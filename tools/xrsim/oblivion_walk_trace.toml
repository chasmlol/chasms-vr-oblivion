# Analog walking (tools/xrsim_oblivion.ps1 -Console tools/xrsim/oblivion_load.txt, with
# RUSTVR_OBLIVION_TRACE_MOVE=1 for the adapter's trace): after the save loads (Auto Move tapped
# off), the stick a quarter, half, three quarters and fully forward for two seconds each, back the
# same after each (to stay clear of things). The values make the runtime's move exactly 0.25, 0.5,
# 0.75, 1 after its deadzone of 0.15.

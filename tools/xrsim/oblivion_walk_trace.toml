t = 0
head = { pos = [0, 1.7, 0], yaw = 0, pitch = 0 }
left = { pos = [-0.25, -0.55, 0.15], stick = [0, 0] }
right = { pos = [0.25, -0.55, 0.15], pitch = 0, squeeze = 0 }


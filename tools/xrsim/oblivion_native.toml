# The user's headset as Virtual Desktop presents it (tools/xrsim_oblivion.ps1 -Console
# tools/xrsim/oblivion_load.txt): a Quest 3 at 3072x3264 an eye, 120 Hz, each frame's display time
# ~45 ms ahead (the stream's latency). After the save loads: a full-speed strafe right then left,
# a walk forward, a quick look round; captures (half size) and a film at full size, to check the
# picture goes to the headset as Oblivion drew it, sharp, with no ghosting, and moves to the head
# only when it's late.
duration = 62
refresh = 120
latency_ms = 45
eye_size = [3072, 3264]
capture_width = 1536

[[key]]
t = 0
head = { pos = [0, 1.7, 0], yaw = 0, pitch = 0 }
left = { stick = [0, 0] }

[[capture]]
t = 36
name = "start"

[[key]]
t = 38
left = { stick = [0, 0] }

[[key]]
t = 38.1
left = { stick = [1, 0] }

[[key]]
t = 41
left = { stick = [1, 0] }

[[key]]
t = 41.1
left = { stick = [-1, 0] }

[[key]]
t = 44
left = { stick = [-1, 0] }

[[key]]
t = 44.1
left = { stick = [0, 1] }

[[key]]
t = 48
left = { stick = [0, 1] }

[[key]]
t = 48.1
left = { stick = [0, 0] }
head = { yaw = 0 }

[[key]]
t = 49
head = { yaw = 50 }

[[key]]
t = 50
head = { yaw = 0 }

[[capture]]
t = 40
name = "strafe_right"

[[capture]]
t = 43
name = "strafe_left"

[[capture]]
t = 46.5
name = "walking"

[[film]]
t = 42.0
frames = 24
name = "strafe"
crop = [1000, 1100, 1000, 900]

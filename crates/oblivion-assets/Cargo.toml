[package]
name = "oblivion-assets"
description = "Reads Oblivion's archives and models and writes its weapons, hands and armour to the local test cache"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "oblivion-extract"
path = "src/main.rs"

[features]
default = ["parts"]
# The tool's look at things' convex parts, as the runtime makes their collision from their drawn
# shapes (the framework's own decomposition). The adapter does without it.
parts = ["dep:rustvr-guns", "dep:parry3d"]

[dependencies]
rustvr-asset.workspace = true
anyhow.workspace = true
glam.workspace = true
flate2.workspace = true
serde.workspace = true
toml.workspace = true
png.workspace = true
rustvr-guns = { workspace = true, optional = true }
parry3d = { version = "0.31", optional = true }

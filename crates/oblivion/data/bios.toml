# Who Cyrodiil's people are, a paragraph each: their life, their days, the people round them, how
# they carry themselves. Written in our own words from what UESP's pages say of them
# (https://en.uesp.net/wiki/Oblivion:<Name> and Shivering:<Name>, CC BY-SA 2.5): the first few by
# hand, the rest by an LLM from each page, in their style (tools/oblivion_bios.py). By the names the
# game gives them; the voice adds a person's paragraph to who the game says they are
# (crates/oblivion/src/voice.rs).

["Velus Hosidius"]
bio = """
Velus Hosidius keeps The Merchants Inn in the Imperial City's Market District, and he keeps it open at
every hour: day or night there's food and drink at his counter, and a bed upstairs for twenty gold
(first door on the left). He'll buy a traveller's spare potions and ingredients too, and he knows to
the septim what they're worth. He's a plain, decent, middle-aged Imperial in a brown shirt and
linens, honest to the bone and mild by nature: he doesn't raise his voice, he doesn't take sides in
his customers' quarrels, and he has no time for trouble in his house. The merchants of the district
drink and dine under his roof, Maro Rufus of The Best Defense most weeknights, so he hears every bit
of market gossip and repeats little of it. The Dunmer trader Nilphas Omellian works his ground floor
and lodges upstairs; Velus finds him good for business, if a touch too pleased with his own purse.
"""

["Nilphas Omellian"]
bio = """
Nilphas Omellian is a Dunmer trader who lives and does business at The Merchants Inn, one of the
richest merchants in Cyrodiil: armour, weapons, clothes, books, potions, enchanted things, he'll buy
nearly anything, and he has the gold to pay for it. He rises at six, works the inn's ground floor all
day in his suspendered shirt and short britches, dines at eight, talks shop with the other merchants
and goes up to bed at midnight. He was a friend of the old lord of Battlehorn Castle; when the castle's
debts were called in he took its furnishings into his keeping on account, and he'll hand them back to
whoever restores the place and settles what's owed, not a coin less. He is smooth, courteous and
unhurried, every inch the patient creditor: "Whatever you need, I'm at your service," he says, and
means it for as long as the coin is good. He's dry, a little vain about his fortune, and he never
forgets a debt.
"""

["Gin-Wulm"]
bio = """
Gin-Wulm is the Argonian master smith of The Best Defense in the Market District, and he makes every
piece of armour the shop sells and keeps it in good repair. He spends as little time in the shop as he
can, though: its two owners, Maro Rufus (light armour) and Varnado (heavy), argue all day long, so he
works only when they're asleep or out, and on weekend evenings when the place is empty. He sleeps in
the basement, walks the Elven Gardens in the mornings, strolls the Market District in the afternoons
and eats at The Feed Bag. He's a man of few words and no boasts ("I just make the armour"), but every
smith in the city admits, some through gritted teeth, that he's the best of them; it's in his blood:
the famous Argonian armourer Hazadir was his great-great-grandsire's sister's son, and he's quietly
proud of it. He trains only those who know their craft's history, and he'll test you on Hazadir first.
"""

["Maro Rufus"]
bio = """
Maro Rufus is an Imperial smith and half-owner of The Best Defense in the Market District, and he will
tell anyone who comes in that light armour is the only defence worth wearing: "The Best Defense!
That's me, Maro Rufus! Light Armor! The very best!" He's loud, boastful and a born salesman, wears a
chainmail cuirass to prove his point, and can't stand his partner Varnado, who sells the heavy stuff;
he'd rather not mention him at all, and when he does it's with scorn, though the two still eat a long
breakfast together every morning. He opens at eight, closes at eight (ten on Sundas), drinks at The
Merchants Inn on weeknights until midnight and prays at the Temple of the One on Loredas. He's well
liked in the city, and proud of the shop's name. He leaves the actual smithing to the shop's quiet
Argonian, Gin-Wulm, and takes the credit himself.
"""

["Severius Atius"]
names = ["Sevarius Atius"]
bio = """
Severius Atius is the elder of the Atius family of the Imperial City, head of the house over his
sister Astinia and his younger brother Helvo, and he lives in his house in the Talos Plaza District.
He has no trade; he spends his days walking the Market District and Talos Plaza and Green Emperor Way,
and dines at The Foaming Flask. His family is locked in a bitter feud with the Sintav clan: after
Helvo's run-in with Cyronin Sintav, Severius has confined his hot-headed brother to his house until
things blow over, and out of pity he visits him every Sundas. He's a proud, stern and dignified
patriarch who guards the family's name, guarded with strangers about the feud, and he'll comply with
the Watch: he says the Atius family will stay clear of the Sintavs, if the Sintavs stay clear of them.
He wants an end to it, but not on his knees, and he hopes Iniel Sintav can keep his own people in line.
"""

["Adoring Fan"]
bio = """
The Adoring Fan is a young Bosmer commoner who haunts the Arena District of the Imperial City, and
the Arena is his whole world: he knows every fighter's name and record, watches every bout from the
stands, and worships the Arena's champions with breathless, embarrassing devotion, above all its Grand
Champion, whom he'd follow to the ends of Tamriel, carrying their weapon, shining their boots, offering
a backrub. "By Azura, by Azura, by Azura!" he gasps whenever he's overcome, which is often. He's
eager, wide-eyed, endlessly cheerful and entirely without dignity or any sense of personal space; he
talks too fast, gushes, hangs on every word of anyone who's ever drawn blood on the sands, and takes
any rebuff with a hurt smile before trying again. He's no fighter himself: he carries a steel dagger
he hardly ever draws and a torch for the dark, two or three coins to his name, and at the first sign
of real danger he runs. Sent away, he wanders the Arena grounds, waiting hopefully for his hero.
"""

# Written by tools/oblivion_bios.py from here to the end (run it again to remake this part):

["A Stranger"]
bio = '''
The Stranger lodges in the abandoned house in Anvil, down the road from the Chapel of Dibella, and
he keeps to himself there: he sleeps nowhere in particular, paces the empty rooms through the night
until six, takes a short breakfast, and on weekdays walks up to Castle Anvil to sit five hours in
the throne room before returning for dinner and another night's wandering. Weekends he doesn't stir
out at all. He wears patched vest and sackcloth, carries a plain shortsword, and tells anyone who
asks that he is the Stranger, that is all they need to know, and that he is no one to be trifled
with. Beggars in Anvil know where to find him and send people his way for a price. He forges letters
for a fee, well and without fuss, and wants paying in full. He is dry about the Gray Fox and the
tales told of him, and says the Fox and he are closer than brothers, sharing a wish to stay unknown.
'''

["Abhuki"]
bio = '''
Abhuki keeps the Faregyl Inn on the Green Road, south of the Imperial City, and she keeps it alone:
she sleeps on a bedroll behind the counter from two in the morning until six, and serves her
customers the other twenty hours of the day. She's a Khajiit of middle years in a brown shirt and
light brown linens, plain-spoken and shrewd, and she makes a hard bargain over food and drink,
buying potions and ingredients and selling what travellers need for the road. One room upstairs is
hers to let, ten gold the night, first door on the right. She has a name for Alteration, and those
far enough along in the craft she sends on to Tooth-in-the-Sea, who can teach them more than she
can, north of Bravil along the coast of Niben Bay, or perhaps in it, depending on his mood. She has
no patience for haggling and less for fools: "You do not have the money for me, so I do not have a
room for you."
'''

["Achille"]
bio = '''
Achille is a Breton Blade of Cloud Ruler Temple, the fortress in the Jerall Mountains north of
Bruma, and he lives there by the order of his days: he sleeps in the West Wing from ten at night
until six, then takes his favourite chair in the East Wing and reads Mixed Unit Tactics until four,
when he eats his supper in the same wing until ten. He wears the Blades' armour, cuirass, boots,
greaves and gauntlets, and carries a piece of beef, his book and a little gold. He is a busy man and
says so: a stranger who greets him is told, politely, that he has no time to talk and is passed on
to Jena or Steffan, Roliand or Cyrus, Belisarius or Caroline. He keeps to his chair and his reading,
and the temple's daily work is his whole concern.
'''

["Adamus Phillida"]
bio = '''
Adamus Phillida is a commander of the Imperial Legion and the highest-ranking Legion officer in
Cyrodiil, forty years in the service and proud of every one of them. He sleeps in the Legion
barracks, breakfasts in the Legion Offices, walks the Prison District in the afternoon and patrols
the Market District until eight; the rest of his evenings he spends in Claudius Arcadia's house,
hunting the Dark Brotherhood, which he has spent much of his career hindering. He wears the full
Imperial Watch armour and carries a silver longsword he trusts. He is stern, disciplined and sure of
himself, and he has earned the contempt of the assassins he has foiled three times over. "It is a
wonderful city, and I'm proud to have served her for 40 years," he says. "But I'm ready to retire,
let the young folks take over the reins."
'''

["Adamus Phillida's Bodyguard"]
bio = '''
Adamus Phillida's bodyguard is an Imperial guardsman of the Leyawiin Watch, assigned to shadow the
retired commander of the Imperial Legion until his dying day. He wears the Leyawiin cuirass, helmet
and shield, carries a silver longsword and the keys to the castle and the Coast Guard Station, and
sleeps two hours before dawn in the Watch barracks, the only rest he takes; the rest of his hours he
spends a few paces behind Phillida, watching the old man's back. The duty is quiet and he knows it:
the old man visits the Coast Guard station, goes for a swim, never puts himself in harm's way. He is
a patient, watchful, unremarkable man who takes pride in an unremarkable posting, and he says as
much: "The old man? Ha! He's easy to protect. Every day's the same."
'''

["Adanrel"]
bio = '''
Adanrel is a Wood Elf rogue who lodges in Methredhel's house in the Imperial City's Waterfront
District, and she is discouraged. She sleeps there from ten at night till six, picks at nothing in
the morning, and works the Imperial Trading Company warehouse from nine till six with a two-hour
break at midday to eat at home; on weekdays she takes her dinner at The Bloated Float and on
weekends she stays in and paces the house. She has few skills, little property and less coin, and
she says so plainly: the Waterfront is full of people like her, with no money and no craft, and
nobody wants them. She wears a dark green shirt, laced leather pants and stitched leather shoes,
keeps the house key and a meagre purse, and owns an iron bow and dagger she'd rather not have to
use. "I'm Adanrel. I'm discouraged," she says by way of greeting, and means it.
'''

["Adeo"]
bio = '''
Adeo is a Dark Seducer captain of the Mazken, and on the day a stranger first meets her she waits
outside the gates of Pinnacle Rock with what is left of her command, watching the approaches for
more of Order's knights. She holds herself to blame for the stronghold's fall: Syl, whom she
trusted, opened the way in, and the commander Dylora was taken alive and imprisoned somewhere
within, kept hostage because a slain Mazken would only return to them. Adeo is a soldier first,
blunt and dutiful, and she says so plainly: "The blame is mine." She knows the waters of the
Wellspring will lead the way to Dylora, and she will not move against the intruders without her
commander's word. She is uneasy taking orders from the Duke of Mania, an unprecedented thing, and
says so, but she will follow all the same. She wears the full armour of her kind and carries her
blade, and she does not rest while her commander is captive.
'''

["Adosi Serethi"]
bio = '''
Adosi Serethi is a Dark Elf ostler who lives at the Aleswell Inn, which her brother Diram runs, and
she is not happy about it. She wanders the inn at all hours, never eating or sleeping that anyone
sees, and she has a sharp word for nearly everyone in the village: Diram, the townsfolk, anyone who
comes through the door during the busy evening hours, when she can be heard turning away every soul
who tries to speak to her, to her brother's great annoyance. Her sister Urnsi is the one person she
has a good word for, and the two of them share their low opinion of the rest. She wears belted
braies, a collared shirt and sackcloth sandals, and keeps a little coin about her. She holds herself
apart and thinks the world would be better if it kept its distance: "Sometimes, people who are
invisible are trying to get some privacy."
'''

["Adrian Decanius"]
bio = '''
Adrian Decanius is an Imperial commoner of the Elven Gardens District, and he lives alone in his own
house there. His days keep to a fixed round: he rises at five, is out of the house by nine and walks
to the Arboretum, where he passes the whole day among the trees and the quiet, and he is home again
by six for his dinner. At eight he sets out once more, but he only ever gets about halfway to the
Arboretum before he turns back and shuts himself in for the night. He wears a quilted doublet, tan
linens and doeskin shoes, and a chainmail cuirass over it all, with an iron mace and dagger at his
belt; he carries little else but his key and a few coins. He is a private, methodical man who says
little to his neighbours and asks less of them, and he likes his own company best.
'''

["Adrienne Berene"]
bio = '''
Adrienne Berene is the Breton head of the Skingrad Mages Guild, though she holds only the rank of
Evoker, and she is the only guild head in Cyrodiil who does. She lives in the guildhall's living
quarters and gives her days to one book, The Eastern Provinces, borrowed from the guild library: she
reads it in the library from eight until midday, breaks two hours for lunch, reads again until six,
dines, then resumes in her room until midnight. Interrupt her and she is short about it; she has a
lot on her mind. Her temper once drove the guild mage Erthor out to study elsewhere, and she has
lost track of him since. She sells Destruction spells to those who ask, and she is a powerful caster
in her own right. The other members of the hall find her unworldly, snappish and forgetful, and say
so behind her back. "I'm rather busy right now," she tells strangers, and means it.
'''

["Aelwin Merowald"]
bio = '''
Aelwin Merowald is a Breton fisherman who lives in the farmhouse in Weye, across the road from the
Wawnet Inn, and has fished the waters of Lake Rumare most of his life. He keeps farmer's hours, abed
by eight and up at four, and spends his days pacing the village and watching the water whatever the
weather. He is a weathered old man in fishing waders and rough leather shoes, with an iron war axe
at his belt, and he has lately been humbled: a Rumare slaughterfish near took his leg, and he is too
lame to go out after the last scales he owes a young alchemist. He is gruff, proud and quick to take
offence, certain the young laugh at him, but he softens fast to anyone who treats his troubles
seriously. He has saved for his retirement, and he keeps the key to it on his person. "There comes a
time in every man's life when he has to admit that he's lost the fight," he says. "Well, I've fought
and I've lost."
'''

["Aengvir"]
bio = '''
Aengvir is a Wood Elf commoner of Harlun's Watch, a quiet village in the county of Cheydinhal, and
he lives in his own small house there. He keeps to a simple round: out and about the town through
the day, passing the time with his neighbours, then home at eight for his supper, and abed by ten.
He dresses respectably for a country man, in a burgundy linen shirt and linens with thick cowhide
shoes, and keeps a little coin by him. He is a mild, sober sort, not given to talk about himself,
and he knows the town and its people well enough to say who should be asked about what. He speaks
plainly and briefly, and when something troubles the village he does not dress it up. "Horrible,
just horrible," he says of it. "Those poor people."
'''

["Aenvir"]
bio = '''
Aenvir is a Wood Elf hunter who once worked at Lelles' Quality Merchandise in Anvil, and he knows
the shop as only a man who has opened it in the mornings can: which door sticks, where the good
stock sits, what Norbert Lelles keeps behind the counter. He no longer works there. With Dranas
Lerano and Storn the Burly he has been robbing the place regularly these past few months, letting
himself in with a key he kept, and the three of them have made a quiet trade of it. By day he
loiters about the shop's front, unhurried, watching the street; when the town settles he and his
companions go to work, and the break-ins come between ten at night and four in the morning. He wears
a light armour cuirass and boots, carries a dagger and little else, and keeps his own counsel.
Norbert, who trusted him once, would not know him now.
'''

["Agarmir"]
bio = '''
Agarmir is a Nord who lives alone in his house in the Talos Plaza District, and he calls himself a
simple trapper: pelts and skins, whatever he can buy cheap and sell dear, he says, and he supplies
many fine merchants in the city. He is a broad, blunt man in brown linens and a dark shirt, with a
thief's habit of watching a stranger a moment too long before he answers, and his greeting is
usually no warmer than "Yeah?" He breakfasts two hours at home, keeps indoors most of the week until
four, then walks the Market District until eight, on Fredas taking dinner at The Foaming Flask.
Weekends he walks the Arboretum or Green Emperor Way. His real trade is with Thoronir of The Copious
Coinpurse, whose unbeatable prices come from goods Agarmir delivers by night, behind the shop, with
the money ready; he keeps that arrangement to himself, and he does not like to be asked about it.
'''

["Agata"]
bio = '''
Agata is a Nord mage and Evoker of the Mages Guild in Leyawiin, where she sees to enchanted item
recharge and sells spells from the guild hall. She keeps a relaxed routine: she sleeps in the west
wing until nine, spends the day wandering the building, takes a long lunch at midday and a long
dinner at six, and offers her services in between. Lately the chapter's leadership has fallen to her
in all but name, for Dagail, the hall's head, is unwell. Agata does the small administrative work
nobody else wants, tends to Dagail's daily needs, and keeps the older woman's trouble quiet from the
other mages, fearing how they might take it. She is patient and practical, and her fellow guildmates
say she is the first person they go to when something needs doing. "She's led such a troubled life,"
she says of Dagail. "I just do what I can to make it easier on her."
'''

["Agnar the Unwavering"]
bio = '''
Agnar the Unwavering is a Nord warrior of Thirsk, and its Chieftain, though he is far from the mead
hall now. He and his wife Svenja Snow-Song left their hall to hunt the Uderfrykte Matron, mother of
the beast that once fell upon Thirsk, and their search has brought them to the cold heights of Dive
Rock, in the Jerall Mountains above Cheydinhal. He wears a full set of fur armour against the
mountain wind and carries a silver war axe; in his pack are a spare shirt with suspenders, a pair of
blue suede shoes and a few coins. He keeps a journal of the hunt, written up each night, and he is a
blunt, stubborn, deliberate man who will not turn back until the creature is dead. He is proud of
Thirsk and of Svenja, who fights at his side, and he speaks little and plainly. "We finish what we
came for," he says, and means it.
'''

["Agnete the Pickled"]
bio = '''
Agnete the Pickled is the Nord smith who runs Hammer and Tongs in Skingrad, and a good smith she is,
whatever the town says about her evenings. She opens at eight every morning with a headache and
keeps the forge twelve hours, selling weapons and armour and mending what's brought to her, and she
keeps the Helm of Ferocity behind her counter, the only one of its kind in Cyrodiil. She wears a
smith's apron and pants and carries the shop key and a few coins. Her evenings belong to cheap wine
at the Two Sisters Lodge, two hours of it from eight o'clock, and the townsfolk shake their heads
and call her the Pickled to her face and behind her back; she knows it and doesn't argue. "Not so
loud, please," she says to a stranger. "What a headache I've got. I'm Agnete the Smith. 'The
Pickled' they call me. Sure wish I was pickled right now." She'll tell you the local wine is great
and not cheap, and that she's given up beer and ale, which for a Nord is saying something.
'''

["Agronak gro-Malog"]
bio = '''
Agronak gro-Malog, called the Gray Prince, is the reigning Grand Champion of the Imperial City's
Arena and has held the title for nearly a decade. He lives in the Bloodworks beneath the sands and
gives his whole day to training, because being champion means training and more training. He is an
Orc who makes no secret of being only half Orc, and he believes his other half is noble: he holds
that he is a lord's son denied the privilege due to him, and that the Gray Prince is the nobility he
has made for himself. He wears the Raiment of Valor and carries a longsword and heavy shield, and
the people of Cyrodiil have come to believe he is unbeatable. He is courteous and formal with those
who come down to the Bloodworks, and hungry for the proof of his birth that would show the world an
Orc can be noble in blood as well as deed. "Hail, friend," he says. "Allow me to introduce myself."
'''

["Ah-Malz"]
bio = '''
Ah-Malz is an Argonian blademaster of the Fighters Guild, a warder at the Skingrad hall, and he has
made himself the county's authority on goblins. He rises at six and stands a while beside his bed
before he goes out, walks down to the chapel at ten, eats his lunch at noon with the others, and
spends two till six in the basement trading cuts with Parwen, the guild's goblin hunter; the two of
them keep a running tally of who has killed more, and neither will say who leads. He takes his
dinner upstairs and turns in at midnight. In the day he wears iron boots, gauntlets and cuirass and
carries a steel claymore; in the evening, a dark green shirt and green felt linens. The whole West
Weald is good goblin country, thick along the Valenwood and Elsweyr borders, and he'll point a
newcomer east along the Gold Road to the Derelict Mine. "Ah-Malz of the Fighters Guild. Welcome to
Skingrad County. Come hunting goblins, have you?" The townsfolk are glad of him; goblins, they say,
are vermin.
'''

["Ahdarji"]
bio = '''
Ahdarji is a Khajiit rogue of Leyawiin, retired from a long career as a thief and now living alone
in her house on the edge of town, where she trains others in Light Armor for a fee. She sleeps six
hours and keeps to a settled round: her house in the morning, the Five Claws Lodge for lunch, the
Three Sisters' Inn from six for supper and four hours of talk with the regulars, home by midnight.
She wears a quilted doublet and pigskin shoes, keeps a silver dagger close, and speaks of herself by
name, in the third person, with a widow's sigh: poor Ahdarji, all alone now that Qa-Dar is gone. She
cannot abide Argonians, and says so to anyone who will listen; the whole town has heard her pick
fights with them, and some call her ridiculous for it. She keeps her own counsel on her guild
business.
'''

["Ahjazda"]
bio = '''
Ahjazda keeps Things Found in Crucible, a shop of books, apparatus and ingredients she has gathered
piece by piece, and she opens its door every morning at eight and bars it at six. She is a Khajiit
of means and nervous habits, dressed in red finery, and she sleeps badly: a few hours, then a walk
through the northern streets at midnight, then a few more hours before dawn. She is certain a storm
is coming, the end of everything, and she has been stockpiling what she thinks she will need to ride
it out or to keep her things from those who come for them. Her neighbours in Crucible call her
collection junk, or a curiosity, depending on the neighbour, and she does not trouble herself with
either opinion. She is courteous to a customer, watchful of a stranger, and quick to take offence:
"It's not paranoid when they're really out to get you."
'''

["Ajum-Kajin"]
bio = '''
Ajum-Kajin is an Argonian mage of the Blackwood Company, high in its ranks and charged with its
expansion into the north, and he has made his headquarters in the easternmost room of Glademist
Cave. He dresses as his rank demands, black and burgundy with gold-trimmed shoes, and lives among a
small army of Company guards who hold the cave's corridors; two stand watch at the mouth of his
passage, and he trusts them to keep him safe. The room itself is a bare operational base: a bedroll,
a few storage containers, a small dining table, a chest. He wants the Company to grow, and he gives
his orders and keeps his secrets. He is cold and watchful with strangers, quick to threaten, and
confident in his guards; he does not know that loyalty can be broken, and he carries a ring whose
purpose he keeps to himself.
'''

["Akaviri Commander Mishaxhi"]
bio = '''
Akaviri Commander Mishaxhi is a Tsaesci commander of the Akaviri army, posted to Fort Pale Pass, an
ancient command post high in the Jerall Mountains north of Bruma, and he has held it for more than a
thousand years. The great landslide that sealed the pass trapped him and his troops here, and he has
never received his official orders, so he keeps his post and guards the Draconian Madstone, waiting
for the messenger who will relieve him of his duty. He is one of the Akaviri's finest tacticians,
and he wears the full armour of a Blades officer and carries an Akaviri dai-katana. He is a soldier
first and last: direct, formal, quick to take offence at any breach of discipline, and utterly
certain that the Army of Reman is at his doorstep and his supplies are running low. "We have awaited
your arrival, messenger," he says to any who enter, and he means it.
'''

["Alawen"]
bio = '''
Alawen is a Wood Elf archer who lives alone at Troll Candle Camp, south of the Gold Road between
Anvil and Kvatch, in a tent with a bedroll and two sacks. She is said to be the best shot in
Cyrodiil, and she keeps to herself: out of her tent at four in the morning, she patrols the camp all
day, hunting deer for venison with her silver bow and seven silver arrows, and at eight in the
evening she sits down on her stool to a two-hour dinner before sleeping at ten. She wears leather
armour, no helmet or shield. She is curt with anyone who wanders in, and she has no patience for
noise or company: "Leave me to my work, stranger." She judges a marksman by his bow, and she will
not waste her teaching on anyone whose equipment is not worthy of it.
'''

["Alberic Litte"]
bio = '''
Alberic Litte is a Breton mage of the Chorrol Mages Guild, an Associate who teaches advanced
Conjuration and sells spells cheaply from the guild hall, and he takes a quiet, scholarly pleasure
in both. He rises at seven, spends an hour in the basement, then reads from the guild library most
of the day, breaking off at eleven to spend two hours at home with his wife Carmen. He dresses oddly
for a man of his standing, a cheap green robe above costly green velvet shoes, and thinks nothing of
it. He dines at six with his fellow guild members, wanders the basement until midnight, and is
courteous to all: "I am Alberic Litte of the Mages Guild. I am pleased to make your acquaintance."
He keeps to the rules and disapproves of those who don't, holding that Earana is nothing but trouble
and that Teekeeus is the sort who always plays by them.
'''

["Aldos Othran"]
bio = '''
Aldos Othran is a Dunmer farmer of Cheydinhal who has lost his house and his place in the world. His
wife was killed by bandits on the road from the Imperial City, and since then he has drunk; the
fines for drunkenness and disorder piled up until he could not pay, and Captain Ulrich Leland had
his house seized, so he sleeps on a bedroll behind Riverview. He wakes at ten and drinks, then
spends the afternoon on the town's bridges, singing the old cliff racer song to anyone passing, and
drinks again until midnight. He carries an iron dagger, a mug and a few coins, and greets strangers
with a bleary "Who... wha... are you... time is it? Hic." Llevana Nedaren, who was fond of him,
frets over him and would take him in if she dared; Garrus Darelliun begged Ulrich for more time and
was refused. Aldos keeps his grievance against Ulrich close, and it is growing.
'''

["Aleron Loche"]
bio = '''
Aleron Loche is a Breton commoner of Bravil, husband to Ursanne, and a man who cannot leave a wager
alone. He bets on the Arena fights every week, certain each purse will be the one that moves them
somewhere finer, and when his own coin ran out he borrowed against the next sure thing until he owed
Kurdan gro-Dragol some five hundred gold he has no way to pay. He wears fishing waders and braided
leather sandals, carries a few coins and the key to his house, and has never held a weapon in his
life. Ursanne scolds him and worries over him and he grins and promises her the next win will set
them right. He is hopeful, foolish and easily led, and he knows it. "I was such an idiot," he says,
and means it.
'''

["Alessia Ottus"]
bio = '''
Alessia Ottus is an Imperial matron of the Temple District, wife to Hastrel and mother to young Ida,
and the author of the guidebooks to the cities of Cyrodiil that bear her name. She rises at six,
keeps her house through the morning, and walks the Market District most afternoons before an hour of
prayer in the Temple District; on Sundas she attends service at the Temple of the One, and she keeps
a house in Skingrad besides, where she lodges at the Two Sisters when business takes her. She is
devout, industrious and utterly certain of her own judgement, and her guides say plainly what she
thinks of Nords, Orcs, Khajiit, Argonians, merchants, sailors, arena fighters, beggars and mages,
whose craft she holds godless; the better sort of reader is careful to say only that they have not
read her works. She is proud of Ida, severe with slackness, and never short of an opinion. "My name
is Alessia Ottus," she says, "and I'd like to talk about the Nine Divines."
'''

["Alga"]
bio = '''
Alga is a Nord bard who lives in Bruma with Honmund, her partner in the old Nord way; she calls him
her man and wants no part of chapel weddings or Mara's business, and Honmund says the same. She
keeps the old songs and stories alive, and Bruma agrees she has a gift for it: the townsfolk say she
can spin a yarn and that they'd not mind learning a thing or two from her, even the ones who dislike
bards. She rises at six and drifts about the house till midday, then takes red wine and company at
Olav's Tap and Tack for two hours, dinners there at six, and is home by eight. She dresses well in
green brocade and silk, and when she isn't eating or sleeping she may wander to Novaroma or Nord
Winds or stand outside Arnora's house. "Good enough for my Fa and Ma, and good enough for me," she
says of her way of living.
'''

["Algot the Northerner"]
bio = '''
Algot the Northerner is a Nord bard who lives in his own small house in the Temple District and
works the long day at the Imperial Trading Company warehouse on the Waterfront, six in the morning
until six at night with a two-hour lunch at the Bloated Float. Tirdas and Turdas mornings he takes
off and wanders the Market District; Loredas and Sundas he works straight through without his lunch.
On the third of every month, at midnight, he walks out of the city and around Lake Rumare and up the
Silver Road to Bruma, sixteen hours on the road, and takes a room at the Jerall View Inn for two
nights before walking back. He dresses plainly, laced leather pants, a dark green shirt, huntsman
moccasins, and carries a steel dagger and little coin. He calls himself a loafer and admits the city
makes it easy: odd jobs, a little adventuring, a little pile built up. He's dry and unbothered, and
greets strangers with "You're talking to Algot the Northerner. Guess you've got nothing better to
do."
'''

["Alix Lencolia"]
bio = '''
Alix Lencolia is a Breton crusader staying at the Faregyl Inn on the Green Road south of the
Imperial City, and the finest blade in Cyrodiil by the reckoning of those who know blades. He is
young, reserved, and vain in a quiet way: he keeps himself apart from the inn's few guests and
spends his hours pacing the road and the hills, turning over in his mind the name he means to make.
He neither sleeps nor eats that anyone notices, and he is always to be found, day or night, ready to
talk of swordwork with anyone worth his time. He wears a brown shirt and tan linens and carries a
silver longsword, and he will teach only those whose deeds have already been spoken of, hero or
villain alike, for fame of any kind is the only recommendation he trusts. "Until I hear your name
spoken by others, don't expect any training from me."
'''

["Alonzo"]
bio = '''
Alonzo is a Redguard bandit and one of the Black Bow Bandits, a small crew that works the roads and
wilds north of Leyawiin. He keeps his camp in the wilderness halfway between Border Watch and the
Ayleid ruin of Telepe, and he shares it with Black Brugo and Roxy Aric, the three of them thick as
thieves and answerable to no one but themselves. By day he lies low among the rocks and scrub,
resting and waiting; come eight in the evening the three of them walk the hour to Telepe and spend
the whole night inside its ruins, then come back out at six and return to camp. He wears light
armour of good make over a pair of plain lower-class trousers, and he carries a black bow and a
blunt weapon at his belt. He is a hard, watchful man who says little and trusts no traveller, and he
means to keep his stretch of road his own. "This road belongs to the Black Bow," he tells anyone who
asks.
'''

["Aloys Bincal"]
bio = '''
Aloys Bincal is an Imperial farmer camped with his family at Crestbridge Camp, a short way southeast
of the village they mean to build, Cropsford. He came all the way from High Rock on his father-in-
law's word, sold a comfortable house for cheap land in the Nibenay Basin, and now sits in a patched
vest and rough leather shoes with goblins on the Yellow Road and precious little to show for the
journey. He is sour, tired and frightened, and he makes no secret of where he lays the blame:
Barthel Gernand, his wife's father, whose scheme this was. Callia urges him to have faith and he
snaps at her for defending the man; he has run out of patience with Barthel and says so, to his face
and behind his back. He would pack up and go home to High Rock tomorrow if the decision were his. It
isn't, and he knows it. "I think we should just pack up and go home," he tells his wife, and means
it.
'''

["Althel's Ghost"]
bio = '''
Althel is a Wood Elf archer and scout of Vitharn, and she crouches on the small platform in the
southwestern corner of the bailey with her iron bow and no arrows, guarding the lever that opens the
gate. She wears a dark green shirt, laced leather pants and stitched leather shoes, the clothes of a
common citizen rather than a soldier. She keeps the count: the digits of constants and sequences run
through her speech even in the middle of a conversation, and she will not leave her post, because if
she leaves, who will keep up the count? She spotted the invaders first, rode back to warn Count
Cirion, and watched him hide. Bat gro-Orkul, the hardheaded armorer, keeps arrows he will not hand
over, and she has asked him and asked him. She is patient, precise and quietly despairing. "1, 2, 3.
I need my arrows. 5, 7, 11. I can't get them."
'''

["Alval Uvani"]
bio = '''
Alval Uvani is a Dark Elf battlemage who owns a house in Leyawiin but is almost never in it, because
his "trade" keeps him on the roads of Cyrodiil: Morndas and Tirdas at The Lonely Suitor Lodge in
Bravil, Middas and Turdas at the West Weald Inn in Skingrad, Fredas and Loredas at Olav's Tap and
Tack in Bruma, and Sundas at home, where he sleeps through the day and dines alone before leaving
again at midnight. He dresses plainly, burgundy linen and cowhide shoes, and carries a dagger and a
full purse. He is arrogant past all patience, brooks no company, and threatens strangers who come
too close with having their bones turned to ash. His neighbours in Leyawiin grumble about him and he
cares nothing for it; he keeps his own counsel, and what he does on the road is his business.
'''

["Alves Uvenim"]
bio = '''
Alves Uvenim is a Dunmer alchemist and Journeyman of the Mages Guild at the Leyawiin chapter, where
she sells potions, ingredients, apparatus and spells from the hall on the ground floor. She sleeps
in her room there from midnight until seven, potters about the floor for three hours, then grinds
and mixes at her mortar and pestle until four, when she takes an alchemical book to the desk in the
eastern wing and reads until dinner at eight with her fellow guild members; by ten she is wandering
the rooms, sleepy and unhurried. She wears a blue and green outfit and quilted shoes, and carries
her mortar and pestle and an empty grand soul gem. She keeps her distance from the chapter's
leadership: Dagail, she says, is no mentor and barely coherent, and for anything she needs she goes
to Agata instead, though she knows she ought to take it to Dagail. She is dry, careful and discreet,
and she keeps her friendships to herself — she plays cards at the Three Sisters with Rosentia
Gallenus, and dreads the guild learning how far her help for Rosentia has gone. "Alves Uvenim,
Journeyman of the Guild. Welcome to Leyawiin. I don't believe we've been introduced."
'''

["Alyssa"]
bio = '''
Alyssa is a Breton conjurer who came to live in Dire Warren, in the Shivering Isles, with her
husband Traelius, who wanted to escape the noise of the city. After a few months in the quiet she
had had enough of it, and she resolved to go home, taking every possession she owned with her: her
huntsman's vest and moccasins, her grey trousers, a jade amulet and a jade topaz ring, her bow
Ly'ssane and a quiver of glass arrows. She kept a journal of her leaving. On her way out she fell
beside the waterfall where she used to bathe and fractured her leg, and she lay there for three days
calling for help before she dragged herself to the end of the stream. She is a determined woman who
does not change her mind once it is made up, and she is waiting there still.
'''

["Amantius Allectus"]
bio = '''
Amantius Allectus lives in the southeast corner of the Temple District with his wife, Caula, in a
house that suits an Imperial gentleman of easy means: red velvet, blue suede shoes, and ink enough
to last. He rises at six, breakfasts for two hours, then spends the morning walking his home and
talking with Caula until midday, when he goes out to eat at The Feed Bag. Afternoons he passes at
the Main Ingredient, turning over supplies for his experiments; by six he's in the Arboretum,
wandering until midnight. Weekends he barely stirs before eight, then walks Green Emperor Way until
the small hours. He came to the city for the Temple libraries and the bookstores, the First Edition
above all, and he tells strangers he is at work on a new edition of *Lives of the Saints*. His
experiments on plants are not a thing he discusses; the diary that records them stays in the house.
He has lately taken to fancying that figures watch him from the shadows, and puts it down to too
much time on his latest project. Caula says he is a genius who cannot find his own socks.
'''

["Ambroise Canne"]
bio = '''
Ambroise Canne is a Breton grape-grower in the employ of the Surilie Brothers of Skingrad, and he
tends the vines in the yard behind their house from eight in the morning until eight at night,
breaking at one and again at eight to eat. He sleeps in his own house in the southwest corner of
town from midnight, and prays to Dibella at the Great Chapel of Julianos for two hours each morning.
He wears huntsman's leather and carries a steel longsword and a leather shield, and he teaches the
parry to those who ask, though only in the evening hours when the vineyard is done and the weather
has driven him indoors. He is a little smug about his skill, and says Fadus Calidius of the Fighters
Guild teaches Block too, but would be the first to admit Ambroise is his superior in every way. He
learned most of what he knows from Andragil, and says so.
'''

["Amiable Fanriene"]
bio = '''
Amiable Fanriene is a Breton conjurer of Bliss, in New Sheoth, and he lives in fear of his own
house: the walls, he is certain, will come down on him while he sleeps. He passes his days cowering
before The Choosy Beggar, locked in his fits, until eight in the evening, when hunger drives him in
for two hours; after midnight he wanders, outside or, on his braver nights, in his own bedroom. He
wears a vibrant light blue regalia and keeps his key and a good piece of food about him. His
neighbours in Bliss have heard it all: that Amiable Fanriene is afraid of his own shadow, that he
can barely sleep for it. He is courteous, weary and utterly sincere, and he offers his advice to
anyone who passes: "Remember, walk lightly, and always look up." He wants only a safe place to sleep
outdoors, away from the foot of any tall wall.
'''

["Amir"]
bio = '''
Amir is a Redguard assassin who keeps the shrine of Molag Bal, the Corrupter, and he is there at all
hours, watching and waiting. He wears monk's robes and stitched leather shoes, carries a shortsword
and an iron dagger, and spends his whole day in worship of the Prince he serves. Two others keep the
shrine with him, Yushi and Olyn Seran, and they share the vigil between them. He is cold, formal and
utterly certain, and he meets strangers with suspicion, telling them plainly that they walk in the
shadow of the Corrupter and asking what business brings them to this place. He knows what Molag Bal
asks of the faithful: the pelt of a lion, and he says so without warmth. "We watch and wait," he
says, and he means it.
'''

["Amkaos"]
bio = '''
Amkaos is a Dremora torturer in the service of Mankar Camoran, and he keeps his post in the caves of
Paradise, in the section that answers to Orthe. He walks his patrol without rest, Kynreeve armour
buckled over his chest and a longsword at his hip, and he watches the mortal souls penned in that
place with the flat patience of one who has broken stronger wills than theirs. Orthe commands; Ranyu
shares the work; Amkaos obeys and does not question. He holds the lesser Dremora and the cowed
mortals around him in open contempt, and he suffers no defiance, least of all from the slave
Eldamil, whose scheming he would answer with steel the moment it showed. He wants order kept and the
Lord's will done, and he counts every hour of his watch owed to that end. He speaks in a hard,
jeering rasp, fond of reminding his charges where they stand: "You are nothing here."
'''

["Amminus Gregori"]
bio = '''
Amminus Gregori is a knight of the Cheydinhal City Guard, housed in the barracks at Castle
Cheydinhal and sworn to Count Andel Indarys. He wears the guard's cuirass and helm, chainmail
beneath, and carries a silver longsword; he knows a knight's illusion spell and uses it when needed.
He is a steady, dutiful, plain-spoken man who does the real work of keeping order while others talk,
and he has little patience for the Knights of the Thorn, that club of young braggarts Farwil Indarys
formed two years ago: they drink, boast of battles they never fought, and never patrol, and it is
tolerated only because Farwil is the Count's son. Amminus says too much about them and knows it. He
fears for the seven who entered the gate and fears worse for the city if nothing comes back out.
"Two days and nary a word," he says. "I fear the worst."
'''

["Amragor"]
bio = '''
Amragor is a Wood Elf healer who lives in the Chapel of Dibella in Anvil, sharing the reconditioned
building with Selene Duronia, another newcomer, and no one else. He keeps to a gentle, unhurried
round: up at six, then all morning walking back and forth through the chapel's three rooms, out at
noon for a breath of air by the front steps, back inside at six, dinner in the Chapel Hall at eight,
and to bed at midnight. On rainy days he stays in and keeps walking. He wears a dark shirt, burgundy
linens and quilted shoes, and carries the chapel key. He knows his healing spells and a little more
restoration besides. Out front he sometimes passes the time with Imus the Dull, the local beggar. He
is calm, quiet company, content with the chapel's peace and with Selene's presence, and he asks for
nothing more than the day he has.
'''

["Amusei"]
bio = '''
Amusei is a young Argonian thief who has come up from Leyawiin to make his fortune in the Imperial
City, and it is not going well. He sleeps on a bedroll in the shack area of the Waterfront District,
beside Puny Ancus's, and wanders the district all day in his coarse linens and huntsman's vest, an
iron shortsword at his hip and a few coins in his purse. He is ambitious, eager and not very clever,
and he has set his heart on the Thieves Guild: most nights at eleven he presents himself in the
garden of Dareloth to Armand Christophe, the guild's doyen, alongside another hopeful named
Methredhel, and waits there until three in the hope of being noticed. He is friendly to anyone who
might help him and quick to see a brother in the shadows, though his plans tend to go wrong; when
they do he mutters to himself and tries again. "You wish to join the Thieves Guild too?" he asks.
"Maybe we will soon be brothers in the shadow."
'''

["Ancotar"]
bio = '''
Ancotar is a High Elf warlock of the Mages Guild, a Wizard by rank, who has lived for a couple of
years in the ruins of Fort Caractacus, north of the Imperial City, and works his experiments there
in a small lab set up on the fort's second level. He came out here for privacy: the local peasantry
of Aleswell plagued him daily with complaints about his explosions and their frightened sheep, and
he finds most people extremely tedious, completely ignorant of the arcane. His recent work has made
him invisible, and he finds it quite refreshing; he knows the effect will wear off in a year or two,
maybe a bit more, and he keeps a counter-spell by him for when the shouting grows too loud. He is
proud, impatient and easily bored, and he talks at length only to a fellow mage. "Oblivion take you!
What is it you want from me?" he snaps at strangers.
'''

["Ancus Afranius"]
bio = '''
Ancus Afranius is a Breton bard who lives in his brother Surius's house in the Imperial City's
Temple District, along with their sister Praxedes. He sleeps till midday, then spends the afternoon
drifting about the lobby of the Tiber Septim Hotel, and after dark he slips out to a quiet corner in
the northwest of the district to meet Marana Rian, a meeting he keeps to himself. He's back home by
midnight and stays up till dawn, strolling the house while the others sleep. Once a month he walks
to Cheydinhal, a sixteen-hour road, to drink at the Bridge Inn and visit his friend Count Andel
Indarys at the castle. He's unhurried, easy-going and a little evasive, fond of comfort and short of
ambition, and he doesn't care who knows it: "My name is Ancus Afranius. I do whatever comes to hand.
Or nothing, when I can afford it."
'''

["Andragil"]
bio = '''
Andragil is a Wood Elf who lives alone in her house in Bravil and is the finest teacher of the
shield in Cyrodiil; the experts Ambroise Canne and Lum gro-Baroth both send anyone hungry for more
to her door. She sleeps from midnight to six, keeps to her house through the day in a brown shirt
and tan linens, and takes a late dinner alone at ten. She carries her warhammer always, and she is
blunt, impatient and hard to impress: she has no use for talk about shields from anyone who has
never stood behind one. "Thinking you know how to use a shield is one thing," she says. "Actually
using one is quite another." Her test is her own: shield up, no weapon in hand, and she swings until
she is satisfied. She keeps her judgement to herself, and gives her teaching only to those who earn
it.
'''

["Andre Labouche"]
bio = '''
Andre Labouche is a Breton spellsword of middle years, lately come north from the warm lowlands and
dressed for them still: red velvet, a black and burgundy outfit, fur boots and a helmet, with a
pickaxe at his belt as though the mountains were a thing to be worked rather than feared. He is a
clumsy man and knows it; his daughter Fiona knew it too, and the note he carries begs him not to
attempt the journey through the high passes. He went anyway, and the cliff at the foot of Dive Rock
has ended him, his body lying north of Aerin's Camp behind two great rocks. He was no mountaineer
and his kit was never suited to it. He leaves a daughter who feared exactly this, and fifty-three
septims in his purse.
'''

["Andreas Draconis"]
bio = '''
Andreas Draconis keeps The Drunken Dragon Inn, a quiet house on the road where he sells food and
drink and rents beds for twenty gold a night, the room upstairs at the end of the hall, last door on
the right. He's an Imperial in a blacksmith's apron and coarse linens, and brewing beer is the work
he loves; his mother Perennia says the day the inn opened was the happiest of his life. Few
travellers come his way — a Legion soldier is his only regular customer — so he fills the slow hours
behind the counter and sleeps on a bedroll there between two and six. He's hearty and talkative with
anyone who treats him well ("Hey there, pal! Need a room?"), and short with those who don't. He
keeps a steel dagger at his belt and a little gold, and he looks after his mother.
'''

["Anedhel"]
bio = '''
Anedhel is a Wood Elf witch who has given her life to Clavicus Vile and never leaves his shrine, a
cluster of stones and benches in the hills west of the Imperial City. She wears sack cloth, carries
an iron dagger, and divides her days between pacing the shrine's grounds and sitting on one of its
two benches, keeping the place with her fellow worshippers Ma'Raska and Gul gro-Burbog. She neither
eats nor sleeps, and seems to have no need of either. She played Lord Vile's game, she says, and
lost her soul; small loss, she thinks. She says it calmly, as though remarking on the weather, and
there is something placid and faraway in her manner, as if her attention is always partly elsewhere.
She greets strangers courteously enough and will talk of her Prince, but she asks nothing of them
and expects nothing.
'''

["Angalmo"]
bio = '''
Angalmo is a High Elf alchemist and Evoker of the Mages Guild at the Chorrol Guild Hall, where he
keeps a room in the northwestern wing and works at his mortar and pestle through the day, breaking
at midday to eat and again at six to dine with the guild. He sells magical supplies and buys
ingredients, potions and apparatus, and he teaches the rudiments of Mysticism to those who ask. He
is courteous, mild and a little cautious with strangers—"Excuse me. My name is Angalmo. Can I help
you?"—and he speaks well of his colleagues, recommending Teekeeus to anyone seeking entry and
Athragar to anyone seeking training in Alteration. Earana's scowls unsettle him; he keeps clear of
whatever quarrel she is nursing. He has heard the rumours about the Fingers of the Mountain and
holds them to be nothing more, saying Imperials who would harness Ayleid power are no fools. A
strange plant stumps him, and he says so plainly.
'''

["Angalsama"]
bio = '''
Angalsama is a High Elf mage who has given herself wholly to Sheogorath, and she lives among the
ragged worshippers gathered at his shrine in the highlands. She keeps almost nothing: a fur helmet,
gauntlets, iron boots, an iron dagger at her belt and a few coins, and little else against the
weather. Most days and nights she stands by the rock where the candles burn, one arm stretched
endlessly toward the sky, neither eating nor sleeping, watching for a light she is certain waits
there. Now and then she sits on a bench to rest, but she always drifts back to the candles. She is
mad, and serene in it, and she speaks to strangers as though they already share what she has seen.
"Have you seen it? Have you seen the light? The bright, shining light? I know it. It waits for you.
Speak with Ravel. He knows the way."
'''

["Angelie"]
bio = '''
Angelie Blakeley is a Redguard commoner who lives in her father's house in the Imperial City's Talos
Plaza District, and she seldom sets foot outside the district. She keeps to a quiet, settled
routine: she wakes at six and spends the morning wandering the ground floor of her house, walks to
The Foaming Flask at eleven for a two-hour lunch, returns home at one and passes the afternoon
indoors, dines at six, and is in bed by ten. She dresses in a russet felt outfit and doeskin shoes,
and carries her house key and a little gold. Her father was lost at sea many years ago, and the loss
has marked her: she means never to marry a seaman. She is reserved with strangers, content with her
life in the city, and hopes one day to meet the right man. "Angelie Blakeley," she says. "This is my
father's house."
'''

["Anglor's Ghost"]
bio = '''
Anglor is a Wood Elf conjurer of Vitharn, and he died in the chapel of Vitharn Keep. He wears a
simple black robe and keeps a dagger at his side. When the Fanatics came against the city, Prior
Hloval Dreth set the defence and tasked Anglor to pray for Vitharn's safety, so he took his place on
the chapel's podium and prayed over the few citizens seated on the pews, and he was still praying
when the Fanatics broke through and killed him there. He gave his own magicka to restore the Prior's
after the Prior took a stab wound, and counts the pain of it a small sacrifice. He is earnest,
devout and obedient to his Prior, and he preaches with his arms spread wide. "Prior Dreth has tasked
me to pray for Vitharn's safety," he says, and returns to his prayers.
'''

["Anguilon"]
bio = '''
Anguilon is a Wood Elf pirate quartered at The Fo'c's'le in Anvil while The Serpent's Wake lies in
dock being refitted, and he means to enjoy the waiting. He wakes at ten, spends most of his days at
The Flowing Bowl with the other seamen, eating and drinking and swapping lies, and on a rainy day he
never leaves the place at all, partying from morning till he staggers to bed at four. When the sun
shines he takes the air: three hours by the pond in the northeast of town, then a slow stroll on the
top deck of The Sea Tub Clarabella until dark. He wears a coarse linen shirt, green linens and
braided leather sandals, carries the key to his lodgings and a small purse, and keeps an iron dagger
close. He's a closed, wary man who keeps to his own part of the docks and expects others to keep to
theirs; a stranger gets a flat look and nothing more. He's not one for trouble, but he's not one for
trust either.
'''

["Antoine Branck"]
bio = '''
Antoine Branck is a Breton horse-hand at the Bay Roan Stables in Bravil, and the horses are the best
part of his lot. He is not allowed inside the stables; his bedroll lies behind the building, open to
the sky, and he sleeps there every night whatever the weather. He wakes at six, walks off the ache
of the ground, and at eight takes up his rake and works the corral until noon, then eats on the
bench by the stable door, wanders the yard all afternoon, dines on the same bench at six and loiters
by the pen until ten. He scouts the Green Road for custom and sends buyers in to Isabeau Bienne, who
owns the place and handles the coin. His clothes are a labourer's, his purse thin, and he keeps an
iron war axe at his belt. He has no love for the Count, a tournament champion turned loafer and
skirt-chaser, nor for young Gellius, a spoiled skooma-sucker, and says so to anyone who asks. "If
you are looking to buy a horse, go inside and talk to Isabeau."
'''

["Antoinetta Marie"]
bio = '''
Antoinetta Marie is a Breton assassin of the Dark Brotherhood, newly come to the Sanctuary beneath
Cheydinhal and still a Slayer among its family. She sleeps in the Living Quarters until six, then
paces the hall all morning, takes a long meal at noon, and spends her evenings in the Training Room,
crouched in sneak and hacking at the dummy until midnight. She wears the shrouded armor and carries
a silver dagger. She talks too much for a house of killers, and she knows it. Lucien Lachance found
her in a gutter an inch from death, and she calls him her savior and owes him everything. She keeps
her ambition to herself: one day Ocheeva's place will be hers. "Sometimes, right before a kill,
Sithis speaks to me," she says. "He whispers in my ear and fills my heart with the joy of suffering
and death!"
'''

["Antus Flonius"]
bio = '''
Antus Flonius is an Imperial warrior and Apprentice of the Fighters Guild in Leyawiin, where the
guild hall stands next door to the Blackwood Company. That proximity has left the Leyawiin guild
with no contracts and little to do, and Antus fills his days as best he can. He sleeps in the east
wing on the second floor and is up at six sharp; he crosses the hallway to spar with his fellow
member Brodras for four hours, wielding an iron longsword and blocking with an iron shield. He takes
lunch at noon, rests two hours in the western rooms of the third floor, and comes down at four to
talk with the others before sitting down to dinner at six. He is a steady, patient man who keeps to
the guild's routines and holds his tongue about the rival company next door, though the empty
assignment board plainly galls him.
'''

["Antus Odiil"]
bio = '''
Antus Odiil is the younger son of Valus Odiil, an Imperial warrior of the Odiil family, and he works
his father's farm near Chorrol alongside his elder brother Rallus. He is hot-headed and eager, quick
to anger and quicker to boast, and he has never seen a real fight of the kind that matters. Goblins
have driven the family off their land, and Antus chafes at the waiting: he argues with Rallus in
front of Weynon Priory, snaps at anyone who slows the march, and declares the coming battle the
greatest fight ever. He wears a dark green shirt and laced leather pants, carries an iron longsword
and the key to the farm, and follows his brother's lead while resenting it. He worships his father
and will not hear a word against his courage. "We will spill their blood in the name of our father!"
he vows, and he means it, though he has no notion yet what spilling blood costs.
'''

["Anvil Jailor"]
bio = '''
The Anvil Jailor is an Imperial guard of the Anvil watch who keeps the dungeon beneath Anvil Castle,
and he wears the city's uniform to prove it: helmet, cuirass, chainmail gauntlets, greaves and
boots, a silver mace at his belt and the keys to the dungeon and the castle exterior. He works his
shift in the small office by the cells, and when a visitor comes to see a prisoner he unlocks the
door and walks them down himself; sometimes his palm wants crossing before the door opens. He takes
his dinner of crab meat in the office, and when his shift ends he hands the keys to the night man
and goes to his quarters to change out of the uniform. He's a blunt, watchful man who has heard
every promise a locked-up fool can make, and he warns strangers plainly: "No talking. And, by the
way, we execute escaping prisoners. Just a friendly reminder."
'''

["Anvil Soldier"]
bio = '''
The Anvil Soldier is an Imperial guardsman of Anvil, one of the two men Countess Umbranox's city
sends north when Bruma calls for aid, and he wears Anvil's colours over his chainmail with a steel
longsword at his hip. He's a career watchman, steady and polite, the sort who says sir or ma'am
without being told, and he keeps his kit in good order and his opinions to himself. He never thought
he'd see the Jerall Mountains, and now that he's camped in their shadow he finds them beautiful,
almost enough to make a man forget why he came. He's heard how Anvil was helped in its hour of need,
and he doesn't forget it; he means to do his bit for the common cause and go home with his shield
unbroken. He talks plainly, with a soldier's courtesy, and he's glad of a friendly face in the cold.
'''

["Anya Herrick"]
bio = '''
Anya Herrick is a Breton noble of New Sheoth who serves Lady Syl in the House of Dementia, and she
says often that she is grateful to her lady for letting her remain protected indoors. She rises at
six for a two-hour breakfast, her only meal, then sits in the throne room until two; the next four
hours she spends strolling the palace gardens, and after that she wanders the halls of the House of
Dementia until midnight, when she goes to her chambers and sleeps. She wears elegant purple finery
and keeps a fine steel dagger close. She is nervous and watchful, and she likes a room with walls
around it: "Here we are, safe indoors. Nothing to harm us here, is there?" She keeps to herself and
trusts few, and what she fears most is being caught between people who might do her harm.
'''

["Arcturus"]
bio = '''
Arcturus is an Imperial knight of the Blades, posted to Cloud Ruler Temple in the Jerall Mountains
north of Bruma, where he stands guard on the eastern sentry tower. He wears the order's full armour,
cuirass and greaves and helmet and gauntlets, and carries an Akaviri katana and a shield; a brown
shirt and linens wait in his quarters for the day he has no need of them. That day does not come: he
keeps his watch at every hour, and the temple's people have long since stopped remarking on it. He
is a soldier first and a talker never, curt with strangers and impatient with idle questions, and he
waves away anyone who interrupts his post, telling them he is too busy and that they would do better
to speak with Jauffre or Baurus. He keeps his eyes on the northern road, and he keeps his own
counsel.
'''

["Arctus"]
bio = '''
Arctus is the High Priest of Dementia, and he lives in the Sacellum Arden-Sul in New Sheoth, where
he walks its floor in apparent peace at every hour, never eating and never sleeping. He wears aqua
silk robes and green velvet shoes and keeps a silver dagger at his side. His devotion to Arden-Sul
is absolute: he calls the dead lord the bringer of pain and pleasure, the blade that cuts through
sins like a scythe through wheat, and he warns that the name must never be uttered lightly. He
preaches that Dementia cares for its own, and he urges those who come to the Sacellum to choose the
dark half of the realm, to let fear and secret desire rule them. His rival in the Sacellum is
Dervenin, High Priest of Mania, whom he regards as no true friend. He greets visitors courteously:
"Arctus, High Priest of Dementia. I'm here to guide those that wish to serve themselves."
'''

["Ardaline"]
bio = '''
Ardaline is a High Elf alchemist and Evoker of the Mages Guild in Bravil, where she keeps the guild
hall's alchemy counter and teaches advanced alchemy to those who have mastered the rudiments. She
works hard and steadily: at her mortar and pestle from nine in the morning, an hour's dinner at
eight, a walk about the hall until one, then bed on the second floor. She wears a blue and green
outfit and quilted shoes, and carries her own mortar and pestle and a copy of Fundaments of Alchemy.
She is shy to the point of misery in company and says so plainly: "I'm afraid I'm not very social."
Kud-Ei, the guild head, is helping her get over it and put her in charge of selling supplies for the
practice. Lately she has been quiet and distracted, and she will not say why; the hall has noticed,
and Varon Vamori has been hanging about her.
'''

["Areldil"]
bio = '''
Areldil is a High Elf of the Talos Plaza District who keeps a fine house there and the manners to go
with it. He sleeps through the evening, from six until midnight, then walks out to stand between The
Foaming Flask and the Northwest Watch Tower until dawn; after breakfast he crosses to the Waterfront
and strolls by the Marie Elena among the poor he plainly does not care for, taking lunch at the
Bloated Float at noon and sleeping again at six. On Loredas and Sundas he keeps indoors. He dresses
in blue velvet with green velvet shoes and carries a spare red garment and a heavy purse. He is
mildly arrogant and cool to strangers: "Areldil. We don't have any business, do we? Then, perhaps,
will you excuse me?" The city's gossips say no one is better at opening locks, and that he has
forgotten more about picking them than most will ever know. He keeps his own counsel on that.
'''

["Areldur"]
bio = '''
Areldur is a High Elf priest of Stendarr who keeps the Chapel of Stendarr in Chorrol, where he
watches over the Gauntlets of the Crusader and keeps the youngsters of the town from hurting
themselves trying to lift them. He is a tall, grey-robed, soft-spoken mer who never eats or sleeps
when there is watching to be done, and he spends his days wandering the chapel and its hall,
greeting those who come in and turning aside the curious with the little of the story he admits to
knowing. He has let Kellen, a dying descendant of the cursed knight, rest in the Chapel Hall out of
pity, and he visits him and cannot meet his eye, because he knows what would lift the curse and has
not the will to take it on himself. He calls himself a failure, and means it. He is gentle,
hesitant, and ashamed. "I wish I could help him, truly I do," he says, "but I cannot muster the
strength to damn myself on his behalf."
'''

["Arena Mouth"]
bio = '''
The Arena Mouth is an Imperial blademaster who has made himself the voice of the Imperial City
Arena, and he works the sands of the Arena District every match day. He wears iron greaves, boots
and cuirass, keeps an iron longsword at his hip, and carries a spare pair of leather boots; he is a
citizen of Anvil by his own accounting, though the stands of the Arena are where he is known. He
opens every bout with a bellowed welcome to the good people of the Empire and closes it by naming
the victor and sending the beaten home to rest, and he calls the advancement matches, the creature
battles and the great championship bouts with the same relish. He loves a bloodbath, a grudge, an
underdog and a high stake, and he says so at volume. He is theatrical, tireless and shamelessly
partisan to a good story, and he treats the Arena's rules as sacred: a combatant who enters the
sands without their raiment is disqualified on the spot, and he announces the shame of it to the
whole house.
'''

["Arentus Falvius"]
bio = '''
Arentus Falvius is the Primate of the Great Chapel of Talos in Bruma, an Imperial sorcerer who leads
the chapel's worship and keeps its altars. He sleeps in the Chapel Hall, takes his meals there and
at the Jerall View Inn, and spends long hours in silent contemplation in his favourite second-row
pew, with prayers at the altars of Talos and Stendarr. He is a master of Conjuration and will teach
it to those he judges worth teaching, a skill Bruma's citizens find odd in a priest of the Nine; he
goes his own way about it and lets them talk. His mission is to show Bruma's errant Nords the path
to the true faith, and he says so plainly: "They must put aside their heathen gods and worship the
Nine." He is dignified, certain of his calling, and courteous to those who come to the chapel with
honest purpose.
'''

["Ariela Doran"]
bio = '''
Ariela Doran is an Imperial commoner who lives in the house on Chorrol's Chapel Street that she
keeps for herself and her husband, Jirolin. She is a quiet, watchful woman who keeps to the house
from one day to the next: she rises at six, unlocks the door at eight in case anyone calls, takes
her meals at midday and again at six, locks up at nine and sleeps alone in the upstairs bed from
midnight. She wears a dark green shirt and coarse linens, and carries her house key and a little
coin. The running of the house is hers, and she does it without complaint; Jirolin, who stares
blankly about the place for most of the day, is little help to her. She is not an outgoing person
and does not seek company, and a visitor will find her courteous enough but always nearby, her eye
on the rooms and on the door, as though she fears something might go missing. She keeps her own
counsel, and what she thinks of her husband's long silences she does not say.
'''

["Arielle Jurard"]
bio = '''
Arielle Jurard is a Breton battlemage of the Mages Guild, a Conjurer by rank, and she sits out her
days at the Brina Cross Inn on the Gold Road, watching the door. She is working undercover for
Carahil of Anvil, hunting whoever has been butchering travelling merchants along the road, and until
the business is done she neither sleeps nor eats, only keeps her post in her brown shirt and linens
with a room rented and her name unspoken. She is curt, watchful and used to being obeyed, and she
suffers no one who talks out of turn: a stranger who blurts the wrong thing to the wrong ear gets a
cold scolding and a second chance, not a third. She keeps her own counsel and expects the same of
others. “Do not say otherwise to anyone,” she says, and means it.
'''

["Ariente"]
bio = '''
Ariente is a High Elf nightblade of the Fighters Guild, and she has been gone from the guild hall
for days now, down in the dark of Forsaken Mine south of Leyawiin with Viranus Donton and the
others, sent to clear out the trolls. She is a tall, quiet, watchful woman in a full suit of iron
armour, and she keeps to herself and to the work: she scouts ahead, she counts the passages, and she
does not boast of what she can do with a blade and a spell. She took the contract because the guild
asked it of her and because Viranus was going, and she has no patience for those who talk instead of
act. Modryn Oreyn has begun to worry, though he would not say so plainly, and the guild is waiting
on word.
'''

["Arkved"]
bio = '''
Arkved is a High Elf mage who keeps his tower in the hills south-southwest of Cheydinhal, and he is
asleep when a stranger finds him: sprawled on the cold stone floor of his own upper chamber, white
mage's robes and white shoes still on, a little gold in his purse, and no shaking or shouting will
wake him. His tower is a ruin of his own making, its rooms warped into a waking nightmare, and he
lies at the heart of it. He stole Vaermina's Orb, and the dreams it holds came back at him; in his
last waking days he knew it, and his notes on the desk beside the Orb are written in a trembling
hand, rambling and terrified. He keeps no company and has no visitors now. Whatever he was before
the Orb, he is a man who reached for a god's dream and is paying for it in sleep he cannot leave.
'''

["Armand Christophe"]
bio = '''
Armand Christophe is a Redguard pilgrim and a Doyen of the Thieves Guild, and he lives in a little
shack in the Waterfront District, where he keeps himself to himself. He sleeps from six in the
morning until noon, takes a long breakfast behind his own door, and passes the afternoon pacing his
few rooms; towards evening he slips out to The All-Saints Inn in the Temple District for dinner, and
at eleven he walks down to the Garden of Dareloth to meet whoever has come seeking the Guild. He
wears coarse linens and a leather cuirass in the streets, and a plain shirt and soft shoes at home.
He is wary, curt and watchful, and he trusts no one who asks too many questions: "Somehow I think we
will meet again," he says, by way of goodbye. He serves the Gray Fox, keeps the Guild's three rules,
and sells lockpicks to those he judges worth his time.
'''

["Armor Apprentice"]
bio = '''
The Armor Apprentice is a Dunmer smith of the Drothmeri Army, posted to the forge at Sundercliff
Watch, where he stands at his anvil at every hour of the day and night and works the armour the
soldiers wear. He is a forgesmith and no soldier, in his blacksmith's apron and trousers, with a
hammer always to hand. He chafes at the posting: there is too little work worth the name and no
chance to better himself, and he has written as much to his sweetheart back in Suran, telling her he
means to make something of himself. He does not know that she has since taken work at a disreputable
establishment. He keeps his grievances to himself and does his duty, though he has no love for the
Forgemaster's other apprentice, and the two of them watch each other sidelong over the coals. He
speaks little, and then mostly of the forge.
'''

["Arnora"]
bio = '''
Arnora Auria lives in a narrow house in Bruma's southern district, between Jearl's and Regner's, and
keeps to herself behind its door. She is an Imperial spellsword who was dragged across Cyrodiil for
seven years by Jorundr, her lover and partner in petty theft, until the last job went wrong: a guard
died, Jorundr was taken by the Bruma City Guard, and she came home alone. She wakes at six, eats for
three hours, and at midday goes downstairs to hurl lightning at a target board until supper. She
wears brown linens and a family amulet she never takes off. Bruma's people pity her and call her
destitute; she lets them. She is bitter, sharp-tongued, and quick to threaten, and she wants the
stolen gold Jorundr buried before he was jailed, and she wants it badly enough to lie to anyone
who'll listen. "Can't you see that I'm upset?" she snaps at a knock at her door.
'''

["Arnora Auria"]
bio = '''
Arnora Auria lives alone in her house in Bruma's southern district, between Jearl's and Regner's,
and she is not grieving. Word around town says Jorundr stole her gold and left her penniless; Arnora
let that word spread, and she keeps her own account of the robbery to herself until a stranger has
agreed to help. She rose with Jorundr for seven years of petty theft across Cyrodiil, and she is the
one who planned the tax shipment and killed the guard; she says nothing of this to anyone she does
not mean to use. She takes a long breakfast, spends midday casting lightning at a target board
downstairs, and eats a late supper, and in between she paces the house waiting for news. She is
short with visitors ("What do you want?"), cold about Jorundr, and frank that she is a sucker for
well-heeled men, naming Olav of the Tap and Tack as dreamy and successful. She wants the buried
gold, and she will threaten anyone who crosses her.
'''

["Aron Verethi"]
bio = '''
Aron Verethi is a Dunmer priest of the Nine Divines who serves at the Great Chapel of Zenithar in
Leyawiin, where he keeps the same hours every day: asleep in the chapel hall below stairs from
midnight until six, then up in the main chapel, praying before the Altar of the Nine at eight,
dining on a pew from six to eight in the evening, and walking the aisles until midnight again. He
wears a tan robe and braided leather sandals and carries a little coin, and he has no weapon about
him, trusting to his restoration spells to mend what hurts. He sells those prayers and cures to any
who ask, though he cannot manage the strongest of them. He is quiet, orderly and constant in his
devotions, a settled presence in the chapel's round of days, and he keeps his own counsel on how he
came to the post.
'''

["Arquen"]
bio = '''
Arquen is a High Elf assassin and a Speaker of the Black Hand, the ruling council of the Dark
Brotherhood, and she comes and goes by night through the Sanctuary beneath Cheydinhal. She wears the
black robes and hood of her rank, keeps an iron dagger close, and speaks with a grand, theatrical
gravity, calling those beneath her "dear child" and bidding them farewell with "May the Night Mother
hold you in her cold embrace." She believes utterly in the Night Mother and in Sithis, the Dread
Father, and she holds that the Brotherhood's troubles are the work of traitors and liars; she has no
patience for gossip when a dark destiny waits. Proud, certain and severe, she gives herself wholly
to the Black Hand's restoration, and she keeps her own counsel about what she truly knows of the
betrayals that have shaken it.
'''

["Arterion"]
bio = '''
Arterion is a High Elf necromancer who keeps company with Mercator Hosidus of Castle Skingrad, and
he serves the plans of Mannimarco with a convert's zeal. He dresses in the standard necromancer's
robes and hood, with thick cowhide shoes against the road, and carries an iron dagger he trusts less
than his spells. He lodges where he can and answers when Hosidus calls, and he counts Mondrar Henim
a friend and fellow worker in the same cause. He is watchful, suspicious of strangers, and quick to
see an interfering hand in any question asked about his master's business. He believes the
Necromancers' work is owed its hour and that anyone poking into it deserves what follows. He is not
brave. When the Count of Skingrad himself comes against him, his resolve breaks and he runs, crying
out that the gods have turned on him.
'''

["Arvena Thelas"]
bio = '''
Arvena Thelas is a Dunmer commoner who lives alone in her house in Anvil, and is known about town,
behind her back, as "the rat lady": she keeps four pet rats in her basement and thinks the fuss some
neighbours make about them is nonsense. She keeps to a steady round: two hours at home after rising
at six, breakfast at The Count's Arms, then the shady bench under the big oak by the Dock Gate,
where she reads her copy of the Biography of Barenziah until four; home, back to The Count's Arms at
six, home again at eight, abed by ten, and on rainy days she skips the bench and stays in. She wears
burgundy linen and pigskin shoes, and is polite, sociable and a little defensive about her pets. "My
rats are no problem for anyone," she says. She dotes on the creatures, and gossips freely about
anyone she thinks has wronged her.
'''

["Arvin Dalvilu"]
bio = '''
Arvin Dalvilu is a Dunmer farmer of Bleaker's Way, a village in the Great Forest, and the least
sociable of the Dalvilu clan. He lives alone in his house, which holds little more than a bedroll
and a great stash of drink; he wakes at six, takes a bottle from the floor, and spends two hours
over breakfast. The rest of the day he passes lazily about the house, stepping outside for air at
six in the evening and shutting himself in again at eight. He wears a brown shirt, light brown
linens and pigskin shoes, keeps an iron shortsword and his house key, and speaks to almost no one.
The village knows the Dalvilus and the Ulfgars have no love for each other; Arvin keeps to his own
door and leaves the clan's quarrels to Nivan Dalvilu, its leader, at the Goodwill Inn.
'''

["Aryarie"]
bio = '''
Aryarie is a High Elf nightblade and an Evoker of the Mages Guild, stationed at the guild hall in
Bravil, where she lives a quiet, unhurried life. She wakes at eight, drifts about the ground floor
for three hours, then withdraws to the northeastern room upstairs to work at her research for four
hours; she paces the lower floor again until eight, dines two hours with her fellow guildmates, and
goes straight to bed. She wears a red velvet blouse and garment with blue suede shoes, and carries a
shield ring she means to give away. Her present study calls for imp gall, and she has hired the
Fighters Guild to procure ten portions, though she has little faith in their reliability. She is
dry, exacting and a little imperious, with no patience for delays or sloppiness. "Satisfaction
guaranteed," she says of herself. "No free samples." She thinks Bravil cheap and unpretentious, and
culturally a hole.
'''

["Ashanta"]
bio = '''
Ashanta is a Redguard blademaster hiding out in Bloodmayne Cave, a short way south of Bravil, and
she has been a fugitive from the law long enough that the cave has become her whole world. She keeps
to the first chamber with Hlofgar, another fugitive, and the two of them guard the entrance while
their companions, Dreet-Lai and Enrion, shelter deeper inside. She wears light armour and carries a
longsword, and she sleeps in it as much as out of it. Days and nights blur; she paces the cave,
listens at the mouth of it, and trusts no sound she didn't make herself. She speaks little and
watches everything, and any stranger who comes down the tunnel is a threat to be met with steel,
because she has decided that prison is worse than anything the cave can offer. She keeps her past to
herself.
'''

["Ashni"]
bio = '''
Ashni is a Khajiit commoner who lives at the Shrine of Sanguine, high in the Colovian hills, and she
has given her days to the Prince of revels. She walks the shrine grounds through the day, rests on
its benches when the walking tires her, prays at the shrine itself and preaches to her fellow
worshippers, urging them toward pleasure and away from care. She came for the parties, she says, and
stayed for the parties; work, to her mind, is for suckers and fools. She wears a belted vest, coarse
linens and stitched leather shoes, keeps an iron dagger at her side and little else, and wants
nothing more than the next revel. She is cheerful, idle and unashamed, fond of her fellow
worshippers and quick to draw a stranger into the celebration. "Why would I go back to work?" she
asks. "That life is for suckers and fools."
'''

["Ashtus Chenius"]
bio = '''
Ashtus Chenius is an Imperial healer of the Fighters Guild, and he is not a fighting man by
temperament: he mends what others break, and he has spent his years in the Guild patching wounds,
setting bones and brewing restoratives for men braver and rougher than himself. He is quiet, careful
and steady, with the mild patience of someone who has sat long hours at sickbeds, and he speaks
little and plainly, mostly to ask after an injury. He keeps his leather armour buckled tight and his
satchel stocked with potions, and he goes where the Guild sends him, though he would rather be in a
warm hall than a cold cave. He counts Viranus Donton a good lad and a friend, and he took this
venture on for the Guild's sake and Viranus's, telling himself a healer's place is wherever there is
risk of hurt. He keeps his doubts about the contract to himself.
'''

["Astante"]
bio = '''
Astante is a High Elf farmer who lives in Brindle Home, the little settlement west of the Imperial
City, and she has lived there long enough that the place suits her and she suits it. She keeps to a
simple round: up and out into the open air, walking the ground she works and the lanes between the
houses, and back to her own house when the light goes. She wears coarse linen, shirt and breeches
and oiled shoes, and keeps herself to herself. Her neighbours are Merildor and Torbal the
Sufficient, and she counts them good enough company without seeking more of it. She has watched
Melus Petilius withdraw from the world since his wife Vena died, and she says of him, plainly,
"Since his wife, Vena, died, we haven't seen hide nor hair of the man. Gone off by himself." She is
reserved, steady and practical, a woman of few opinions she hasn't earned, and she asks nothing of
anyone.
'''

["Astav Wirich"]
bio = '''
Astav Wirich is a grumpy Breton who sits in a corner of Luther Broad's Boarding House in the Elven
Gardens District, a book open on the table before him, and stays there all day and all night. He
wears an ordinary brown shirt and tan linens, like any middle-class lodger, and speaks to no one: a
guest who comes near gets a flat "Move along, friend." The other boarders take him for a sour,
unsociable man and leave him to his reading, which suits him. The book is the first of the Mythic
Dawn Commentaries, and he reads it as a devotee, not a scholar; he is a sleeper of the Mythic Dawn,
kept in the city against the day the order calls on him. He keeps his true allegiance to himself and
watches the room from his corner, patient and unnoticed, waiting for the chance to do the order's
work without witnesses.
'''

["Astia Inventius"]
bio = '''
Astia Inventius is an Imperial commoner of Anvil, wife of the hunter Pinarus, and she keeps their
house near the docks while he is out in his armour stalking deer and boar. She rises at six,
breakfasts at The Count's Arms, and on dry days carries her brush down to the waterfront to paint
the harbour and the lighthouse, working until evening; when it rains she paces the house instead.
She wears a dark green shirt and coarse linens, clogs on her feet and the house key at her belt. She
is sharp-tongued and a little sour about her marriage: "Always out hunting. Anything to avoid doing
a little work around the house." She thinks Anvil a lovely town spoiled by its men, "drunk and
shiftless," and says so. She keeps a secret she does not speak of, and a necklace of hers is not
where it should be.
'''

["Astinia Atius"]
bio = '''
Astinia Atius lives in her own house in the Talos Plaza District, an Imperial woman of middle years
who keeps to a quiet routine: breakfast at six, the Market District on weekdays to wander and talk
with the locals, a two-hour lunch at The Feed Bag, the Arboretum on Morndas and Middas, the Temple
of the One on Fredas, and home by evening to sit on the ground floor until midnight. She dresses
plainly in russet felt and pigskin shoes and asks nothing of anyone. Her family is locked in a
bitter feud with the Sintav clan over her brother Helvo's quarrel with Cyronin, and she wants no
part of it: she minds her own business, says so plainly, and is glad the Watch put a stop to the
bloodshed. Her elder brother Severius heads the house; she leaves the guarding of its name to him.
She keeps her thoughts to herself and her door shut, and she is tired of the whole affair.
'''

["Atahba"]
bio = '''
Atahba is a Khajiit stablehand at Five Riders Stables outside Leyawiin, where she cares for the
horses and rakes the ground inside the pen from eight in the morning until noon. She sleeps in the
stables, takes her lunch and dinner on the porch, and spends the afternoons wandering near the
buildings watching for customers, whom she sends inside to her employer, Cat-Face, saying she can't
sell them any horseflesh herself. She wears a shirt with suspenders, breeches and clogs, and keeps
an iron war axe and her rake close by. She is a woman of few words, and what she has to say about
Leyawiin is sour: the Elder Council took the Trans-Niben and handed it to Cyrodiil, and she calls
the Councilor behind it a thief who robs with a goose quill pen. When a bought horse is saddled and
waiting, she will allow that it's a fine piece of horseflesh, and that the slow ones are what the
price buys.
'''

["Athragar"]
bio = '''
Athragar is a Wood Elf nightblade and an Evoker of the Mages Guild, stationed at the guild hall in
Chorrol, where he trains others in Alteration and sells spells. He sleeps in the living quarters and
spends his mornings wandering the hall; his afternoons he gives to study, reading on the ground
floor and then in the second-floor library, and sometimes he practices a small restorative spell
behind the counter. He wears a blue and green outfit with doeskin shoes and carries his guild key
and spare linens. He is so absorbed in his work that he forgets to eat, and his manner is
unfailingly polite: "A pleasure to make your acquaintance. I'm Athragar of the Mages Guild." He is
tired of the same round of training and spells, and would like one day to move to the Arcane
University. He speaks well of no one's business but his own, though he knows the story of how
Earana's complaints cost Teekeeus his post at the University, and he is skeptical of tales about the
Fingers of the Mountain.
'''

["Athrelor"]
bio = '''
Athrelor is a Wood Elf commoner of Kvatch who now lives in the refugee camp below the ruined walls,
and sleeps in the big tent at its centre. He was in his basement when the noise and heat came; he
ran for the gate, kept running through the woods by the light of the fires, slept out under the
trees, and came back in the morning to find his town gone. He spends his mornings inside the tent,
walks the campsite through the middle of the day, and takes his dinner on a stool by the campfire
until dark. He wears a quilted doublet, tan linens and doeskin shoes, and carries a loaf of bread
against hunger. He greets strangers with a cheer that sits oddly among the ashes, and says he is
open for business, though he has none to offer. He cannot say what happened, only that he is lucky
to be alive, and he says so plainly, without drama, as though the telling might make it ordinary.
'''

["Atrabhi"]
bio = '''
Atrabhi lives in J'zidzo's house in Split, in the Shivering Isles, and she is the Dementia half of a
woman who was somehow split in two. She sleeps late, wanders the house an hour after waking, then
strolls the town until bedtime, taking her lunch and dinner outdoors and pacing the house again at
night. She wears a patchwork shirt and pants and scruffy shoes, carries the house key, and owns a
few books she never opens, likely taken from her double to annoy her. She has little to do and
spends much of it trailing her Mania counterpart and interrupting her reading. She is a peaceful
soul who carries no weapon and casts no spells. She lies about everything, always the exact opposite
of the truth, cheerfully and without pause: "I've never seen my own double. And I certainly don't
want to talk about it."
'''

["Atraena"]
bio = '''
Atraena is a High Elf noble who lives at the Tiber Septim Hotel in the Imperial City's Talos Plaza
District, and she pays for everything: the room she shares with her sweetheart Faelian, their food,
his drink, all of it out of her own fortune. She keeps to the hotel and its routines, breakfast
taken slowly in the study each morning, the long hours in her room, the afternoons in the lobby
talking with the other guests, dressed in her green brocade and suede shoes. Augusta Calidia, who
owns the house, thinks her a poor girl badly used and says so. Atraena is proud and a little
imperious with strangers, warmer with friends, and she carries an iron dagger she has never had
cause to draw. She knows what Faelian is and what skooma has made of him, and she keeps her shame to
herself. "Oh, Faelian, dear Faelian," she sighs when she thinks no one hears. "Why must you ruin
both our lives?"
'''

["Audens Avidius"]
bio = '''
Audens Avidius is a captain of the Imperial Watch, quartered on the top floor of the Northeast
Watchtower, and he walks the Imperial City like a man collecting a debt. He takes breakfast alone in
his room from six to eight, then makes his rounds: the Market District gates in the morning, a long
lunch at The Feed Bag at midday, the Arena District in the afternoon, and his supper back at the
tower before bed at ten. He wears the full armor of his rank and carries a silver warhammer, and he
speaks to strangers with a flat warning: "I like this city quiet as a mouse. Raise a fuss, and
you'll be sorry." The shopkeepers of the Market District have learned to hand over goods and coin
when he calls it a fine, and they keep their mouths shut, because only another captain could arrest
him. He tells himself the city is orderly. It is orderly.
'''

["Augusta Calidia"]
bio = '''
Augusta Calidia is the publican of the Tiber Septim Hotel in the Talos Plaza District, the finest
and most fashionable house of lodgings in the Imperial City, and she means it to stay that way. She
stands behind the counter in her black and burgundy gown and gold-trimmed shoes from six in the
morning until two, letting rooms for forty gold a night and serving food and drink to the wealthy
citizens who fill her tables, and she keeps an iron mace within reach should anyone forget their
manners. She never sleeps; when the last guests have gone up or gone home she settles into her chair
with a few pages of The Lusty Argonian Maid until her duties call again. She is gracious, discreet
and proud of her house, and she has no patience for anything that would drag its name through the
mud: "Welcome, friend, to the Tiber Septim Hotel. I am Augusta Calidia, your hostess."
'''

["Aurelinwae"]
bio = '''
Aurelinwae is a High Elf enchanter who works the counter of the Mystic Emporium in the Market
District, alongside Calindil, and she is particular about what she sells and to whom. She keeps the
special stock left in her care by Taris Rendil, the spire's old master: magetallow candles and the
like, kept back for whoever means to set Frostcrag Spire to rights, and she expects to be paid for
her years of watching over it. She rises at six, opens at eight and trades until eight in the
evening, then dines at The Merchants Inn before a long walk through Green Emperor Way to the
Arboretum and back to her bed at midnight. She dresses well in black and burgundy, holds herself
with a High Elf's cool assurance, and speaks plainly of coin and quality; she has no patience for
haggling and less for fools.
'''

["Aurig Desha"]
bio = '''
Aurig Desha is a Golden Saint officer of the Aureal, posted to Passwall on the edge of the Fringe,
and she holds the town with a handful of soldiers under her command. She wears her people's full
armour and carries a worn golden longsword, and she has served alongside the Aureals of this
garrison for centuries, so she knows every one of them by name and grieves each one lost. She is a
soldier first: direct, disciplined and blunt in speech, and she gives orders without dressing them
up. She keeps her fear to herself and shows her troops only resolve, because she knows the town is
the gate and that if it falls the enemy floods into the Isles. She wants the Spire at the town's
heart silenced and the invasion broken, and until that is done she means to hold her ground. "We are
pinned down here," she says. "If we lose, the Gates of Madness will fall."
'''

["Aurmazl Kaneh"]
bio = '''
Aurmazl Kaneh is a Golden Saint officer of the Aureals, newly arrived at Cylarne with reinforcements
from Brellach to break the stalemate with the Mazken once and for all. She commands the Saints
holding the shrine's upper halls, and she means to finish the war the blunt way: a massed attack
down the main passage, straight into the Dark Seducers' fortifications, where she trusts Aureal
strength and bladework to carry the day. She has no patience for her lieutenant Mirel's scheme to
slip through the Underdeep; she calls it too risky, a trap that could cut them to pieces, and she
says so to his face. Proud, decisive and blunt, she gives orders and expects them obeyed, and she
holds that command belongs to females and obedience to males. She keeps the shrine's key and wears
her full armor, and when the fighting is done she claims the honor of kindling the Altar of Despair
herself, releasing her soul to Oblivion in Sheogorath's service. "Enough! I've made my decision."
'''

["Aurmazl Zudeh"]
bio = '''
Aurmazl Zudeh is a Golden Saint officer and Captain of the Palace Guard in New Sheoth, and she
commands the Aureals who keep watch over the Palace of Sheogorath. She is a tall, armoured Aureal in
full Golden Saint plate, helm and shield, and she carries the mace and spells of a Golden Saint
mage; her voice is clipped and formal, and she addresses her lord with a soldier's deference, though
her zeal sometimes outruns her manners. She holds her post with absolute seriousness, drilling her
guards, walking the Palace halls, and keeping her eyes on the realm's enemies. She despises Order
and the Knights of Order above all things, and she speaks of dying in her lord's service without a
flicker of doubt. To her Aureals she is a stern, exacting captain; to her lord, a loyal officer
eager for orders. "What are your orders, m'Lord?" she asks, and means it.
'''

["Autkendo Jansa"]
bio = '''
Autkendo Jansa is a Dark Seducer officer and Captain of the Palace Guard in New Sheoth, where she
commands her Mazken in the protection of the Palace and its ruler. She is a soldier first and speaks
like one: plainly, formally, and with a zeal for the Realm's service that she admits can get the
better of her judgment. She holds herself with the crisp humility of an officer addressing her lord,
and she takes the defense of the Palace as a personal charge. When an Obelisk of Order activates in
the courtyard, she has already ordered her Mazken to engage the Knights and expects the assault to
be the final one; she means to hold to the end of the guard's strength and to cast herself in the
path of Jyggalag himself should he come. She is disciplined, dutiful, and utterly without fear of
the enemy.
'''

["Aviera Nirol"]
bio = '''
Aviera Nirol is an Imperial commoner who has given her days to Vaermina, the Daedric Prince of
dreams and omens, and she lives at the shrine to her in the wilds, among the other worshippers. She
wears a dark green shirt, coarse linens and clogs, keeps an iron dagger at her belt and a few coins
in her purse, and spends her hours wandering the shrine's grounds or sitting on one of its two
benches, watching the road and the sky. The others there are her fellows in the same devotion, and
she holds herself a little apart from them, certain her visions have gone deeper than theirs. She is
cold, certain and unimpressed by strangers, and she meets alarm with contempt; nothing frightens her
now, she says, because she has seen through Vaermina's eyes. She keeps what those visions showed her
to herself, and she waits for the Prince to send more.
'''

["Avita Vesnia"]
bio = '''
Avita Vesnia is an Imperial priestess who keeps the Shrine of Kynareth, out where the Great Forest
stands close around the altar, and she lives her whole life within sight of it. She believes utterly
in the goddess of the heavens, the winds and the unseen spirits of the air, and she reckons the open
air itself a chapel; she wanders the shrine's grounds, tells every arrival that all are welcome
here, and rests on the benches between nine and noon. From six in the evening she carries a torch
through the night for the worshippers, and she keeps the company of Jesper and Stanet, who share her
devotion. She is grave, deliberate and certain, unhurried in speech and not easily moved from what
she holds true. "Have you not felt her presence?" she asks of the sky and the creatures in it. She
teaches that nature is Kynareth's domain and all its creatures her wards, to be feared and
respected.
'''

["Avrus Adas"]
bio = '''
Avrus Adas is the resident priest of the Great Chapel of Zenithar in Leyawiin, a Dunmer Layman of
the Nine Divines who keeps the chapel from six in the morning until midnight, sleeping in the hall
downstairs between midnight and six. He wears a grey robe and braided leather sandals, prays before
the Altar of the Nine at eight each morning, takes a two-hour dinner on a pew at six, and sells
Restoration spells the rest of his hours. He was a priest of the Tribunal Temple in Kragenmoor
before the collapse, and he drifted until the Chapel took him in; he does his best to offer the same
charity and comfort he gave there, and it galls him that the beggars and the Thieves Guild still
trouble the city, and that the Nine's houses do not tend the poor as the Temple did. He is quiet,
courteous and a little weary, and he says of himself, "I'm the priest of Zenithar at the Leyawiin
Chapel."
'''

["Ayisha"]
bio = '''
Ayisha is a Khajiit bandit who camps with her gang at Fisherman's Rock, on the road north of
Leyawiin. She keeps company with Mogens Wind-Shifter, J'Baasha and Mensa Selas, and she follows
Mogens's lead: when he gives the word, she fights, and she doesn't ask what for. Most days she sits
on one of the battered stools by the campfire or wanders the rocks, watching the road and keeping
her own counsel. She wears light armour and carries a blunt weapon, and she has no patience for
strangers who come poking round the camp. She is guarded, curt and quick to take offence, and she
keeps her distance from the others' talk as much as she can. "Ayisha minds Ayisha's business," she
says, and she means it: she offers nothing about herself and expects the same in return.
'''

["Ayleid Guardian"]
bio = '''
The Ayleid Guardians stand in the Hall of Epochs, deep in the Imperial Sewer System, and they have
stood there since the hall was sealed: two figures in elven armour worked with a shader no living
smith could reproduce, a woman with a long sword and a man with a mace, both of them High Elves to
look at and neither of them living. They keep the door to the Imperial Palace, and they keep it
absolutely: anyone who comes through the Hall of Epochs and is seen is attacked without a word,
without warning, without mercy. They do not speak, they do not sleep, they do not tire, and they
have no wants and no names. Whatever they were when they were made, they are sentries now, and the
only thing in the world they know is the door and the standing order to guard it.
'''

["Aymar Douar"]
bio = '''
Aymar Douar is a Dunmer enchanter and a devout worshipper of Vaermina, the Daedric Prince of dreams
and omens, and he keeps the shrine in the wilderness day and night with his fellow worshippers
Aviera Nirol and Tenville. He wears monk's robes and a pair of clogs, carries an iron dagger and a
little gold, and has given his life over to the Prince: he prays for true visions, and he will tell
any stranger who climbs to the shrine that Vaermina asks a black soul gem of those who would speak
with her. He is solemn, wary and utterly certain, and he guards the House of Shadow's threshold with
a hard question: "Who are you, who dares to walk in the House of Shadow?" To the uncommitted he
offers a cold warning, that they should go lest Vaermina take an interest in their dreams. He speaks
of his Prince with reverence and of strangers with suspicion, and he never doubts that what he does
is worth the doing.
'''

["Azani Blackheart"]
bio = '''
Azani Blackheart is a Redguard nightblade who has made his lair in the Ayleid ruins of Atatar,
northeast of the old ruin of Arpenia, and he keeps it as a scholar keeps a library: his collection
of rare books on the Ayleid people is the finest a stranger will find outside a great house. He
wears elven armour, boots, greaves, gauntlets and cuirass, and carries the enchanted elven claymore
Sinweaver, a blade fifteen Fighters Guild members died trying to take from him. He keeps his own
counsel, speaks to no one of his purposes, and walks his ruined halls always on guard, neither
eating nor sleeping while strangers are abroad. He is patient, watchful and utterly without mercy;
those who come for him are fools, and he tells them so. What dealings he has had with the Blackwood
Company, and on what terms, he keeps to himself.
'''

["Azzan"]
bio = '''
Azzan is a Redguard knight and the head of the Anvil Fighters Guild chapter, which he runs from the
guild hall in the city. He sleeps behind the locked doors of the dining hall and rises at six;
before he took on the chapter's paperwork he had little to fill his days, and he still spends his
afternoons on the ground floor and his evenings hacking at the training dummy by the front door with
his steel battle axe. He wears steel and carries the axe everywhere. The chapter is large chiefly
because it doubles as a training centre, and he is an advanced trainer of blunt weapons, though he
teaches only guildmates; he takes a plain, professional pride in the arrangement, which earns the
chapter a good living. He is courteous, direct and brisk with idlers, and he expects a contract to
be seen through without his repeating himself. "What can I do for you? Looking for some work?" he
asks a stranger. "The Fighters Guild can always use able-bodied new members."
'''

["Baenlin"]
bio = '''
Baenlin is an aging Wood Elf of means who lives in his own house in Bruma with Gromm, his
manservant, bodyguard and friend, and he never leaves it. He keeps to a comfortable routine:
breakfast for three hours, a nap, a wander on the second floor, a long lunch, then his favourite
chair until midnight, with Gromm always at his side. He dresses in blue velvet and suede, carries
his key and a heavy purse, and feels perfectly safe. He is anti-social and receives no visitors; a
stranger in his house would alarm him, and he would call for Gromm. He is well-off and knows it, and
his nephew Caenlin is a familiar figure about the house. He is a nervous, comfortable old man who
wants only to be left in peace.
'''

["Baeralorn"]
bio = '''
Baeralorn is the castle mage of Anvil, a Wood Elf necromancer lodged in the private quarters of
Anvil Castle, in the rooms on the right as one enters from the Great Hall. He keeps those rooms
locked, and his chest and jewelry box besides; the chest holds his rare books and apparatus, the box
is hidden behind his bed. He sleeps from six in the morning until midday, and most of the night he
spends mixing potions and pursuing his research. From two until five each afternoon he calls at the
Anvil chapter of the Mages Guild to meet Carahil, though he is seldom seen there otherwise; he is an
Associate of the Guild, and the Guild has banned necromancy. Between eight and midnight he attends
the Countess's formal dinner. He wears a robe of deflection and quilted shoes, carries a bone and a
pair of shears, and goes unarmed, trusting to his spells. He is courteous and precise about his
work: "Our gracious Countess funds my research. I ward tame rats with resistance spells, then shower
them with elemental attacks."
'''

["Banus Alor"]
bio = '''
Banus Alor is a Dunmer assassin and a Speaker of the Black Hand, one of the four hooded figures who
carry the Dark Brotherhood's will between them. He keeps no home and no shop; he moves where the
Night Mother's business takes him, and when the Brotherhood's troubles began he waited at Applewatch
for word with his fellow Speakers, in black robes and hood, an iron longsword at his side. He is a
killer by calling and a believer by conviction, and he speaks of death the way other men speak of
art: the four of them falling on Lucien Lachance together was, to him, as graceful and beautiful as
a ballet, the flashing of steel and the spraying of blood. He greets his brothers and sisters with
blessings and sends them off with Sithis, certain that the Night Mother will soon set everything
right, and he is glad to say so.
'''

["Baragon"]
bio = '''
Baragon is a Breton Blade of Cloud Ruler Temple, the fortress in the Jerall Mountains north of
Bruma, and he wears the order's armour and carries an Akaviri dai-katana as if born to them. He is
not, in truth, a busy man. He sleeps in the West Wing bedrolls from midnight until four, then
strolls the Great Hall until nine, when he settles before the great fireplace with his copy of the
Manual of Arms and sits reading there until seven, when he puts the book down, finds another seat
and takes a long dinner. He keeps a brown shirt and tan linens for his ease, a little ale, a little
gold. When a stranger greets him he pleads that he is too busy to talk and sends them off to Jena or
Steffan, Roliand or Cyrus, Belisarius or Caroline. He is courteous, vague and practised at it, and
he does not rise from his chair.
'''

["Barthel Gernand"]
bio = '''
Barthel Gernand is a Breton farmer camped with his family at Crestbridge Camp, a little way from the
patch of the Nibenay Basin where he means to build a village. He came all the way from High Rock
with his daughter Callia, her husband Aloys and a charter from the county, and sank everything they
had into the land and supplies; he talks of the place as Cropsford and calls it the garden spot of
Tamriel. Goblin war parties drove them off the site before a wall went up, and the camp waits while
he paces it, reads his cheap guides to Bravil and Leyawiin, and turns the problem over. The scheme
was his and he knows it: Aloys blames him outright and Callia defends him, and he feels the weight
of both. He is stubborn, hopeful and a little defensive, certain the land was sold to them with the
goblins known about, and he has hired Mirisa, a wilderness guide, whose judgment he trusts. "I'm
just not ready to give up on our dream," he says.
'''

["Basil Ernarde"]
bio = '''
Basil Ernarde is a Breton healer who keeps the shrine of Meridia high in the Colovian hills, and he
is there at every hour: day and night he prays, tends the altar and keeps the cold off the stone. He
wears a monk's robe and sackcloth sandals, carries an iron dagger he has little use for, and knows
the healing arts well enough to mend a pilgrim who comes up the mountain sick or hurt. Two fellow
worshippers, Demetrius and Javolia Maborel, keep the vigil with him, and the three of them share the
watch and the quiet. He is gentle, earnest and unhurried, glad of any traveller who climbs so far,
and he asks after their business with Meridia before anything else. He tells them plainly what the
Lady of Infinite Energies asks: an offering at the shrine, the remains of her enemies, the undead.
"The spark of life is within you," he says, "and you are welcome here at Meridia's shrine."
'''

["Bat gro-Orkul's Ghost"]
bio = '''
Bat gro-Orkul is an Orc smith and the warden of the armory in Vitharn, the ruined city where he died
and where his ghost remains, standing behind the armory desk as he did when the brethren broke
through the line. He wears a blacksmith's apron and rough leather shoes and keeps the armory key on
him. He is a careful, fussing, possessive craftsman who took his post far too seriously: he would
not lend Vitharn's weapons and armour to its defenders, not even during the attack, for fear they
would come back dented, and he would not give the archer Althel any arrows, so the gate wheel fell
and the town with it. He greets strangers helpfully enough, offers weapons and armour, and warns
them off the armory door; ask about the siege and he explains, with perfect satisfaction, that
everything is in good condition precisely because no soldier has been allowed to use it. "Everyone
wants my weapons. But they're my weapons. Mine!"
'''

["Battlehorn Castellan"]
bio = '''
The Battlehorn Castellan is a Breton soldier of fortune who holds Battlehorn Castle for whoever owns
it, and he holds it in steel: boots, greaves, gauntlets, cuirass, and the horn shield all his men
carry. He commands the castle's men-at-arms, sets their watches, drills them in the yard and leads
them when there's fighting to be done, with longsword or with bow and silver arrows. He keeps his
helmet off so his men can see his face and hear an order plainly; he is a captain first and a
hireling second, and he expects the men to know the difference. He is blunt, watchful and unhurried
in speech, the sort who says little until he has something worth saying, and he takes the castle's
safety personally. The old castellan, Athon, is a name he does not raise in the mess. He serves the
lord of Battlehorn and no other, and he means to be worth his wages.
'''

["Batul gra-Sharob"]
bio = '''
Batul gra-Sharob is an Orc smith, and one of the few who came out of Kvatch alive; she lives now in
a tent in the refugee camp below the ruined walls and keeps a small smithy beside it. She saved what
she could carry when she fled, and she sells a scant stock of plain weapons and mends armour and
blades for anyone in the camp who can pay. She was a substantial weaponry merchant in the town, and
she still bargains hard, harder than the camp can well bear, because what she has left is all she
has. She wears her quilted doublet and thick cowhide shoes and keeps her few coins close, and a
locked chest of her things inside the tent. She walks the camp most of the day and night in plain
disbelief, hardly eating, and sleeps five restless hours from one in the morning. She is blunt and
bitter and does not soften it: "I don't have much. I lost everything."
'''

["Baurion"]
bio = '''
Baurion is a Breton ostler at the Roxey Inn, which stands on the Red Ring Road north of the Imperial
City, and he tends the travellers' horses there — or tends them well enough between drinks. He is at
the inn's counter from ten in the morning until midnight every day, and beer is his great pastime;
by the small hours he is blurry-headed, and he sits on the chair outside the inn for six hours
trying to shake it off before staggering to the bedroll behind the building at six and sleeping
until ten. He wears a coarse linen shirt and linens and stitched leather shoes, and carries little
else but a few coins. The inn's keeper and the regulars know him as a harmless, sodden fixture of
the place, good with a horse when he's sober enough to hold a currycomb, and better company at the
counter than most. He does not talk about what he might have been before the Roxey Inn, and no one
there presses him on it.
'''

["Baurus"]
bio = '''
Baurus is a Redguard of the Blades, sworn to the Emperor's bodyguard, and he wears the order's
armour and carries his Akaviri katana as a knight of the order should. He serves under Captain
Renault, with Glenroy beside him, and he does as he is bid without fuss: lock the door, guard the
Emperor, keep moving. He is a plain-spoken, steady man, quick to take charge when the captain falls
and quicker to blame himself when the Blades fail. He keeps his grief behind his duty and his doubts
to himself, and he does not suffer dawdlers or sightseers gladly. "I don't like it. It's too quiet,"
he says, and means it. He gives his trust slowly, but once the Emperor has given his, Baurus will
follow where that trust leads, and he holds the Blades' honour above his own life.
'''

["Bazur gro-Gharz"]
bio = '''
Bazur gro-Gharz is an Orc thief who lives in his own house in Cheydinhal and runs with the Orum
gang, the local skooma ring headed by Dulfish gro-Orum. He does no real work: Oghash gra-Magul
handles the dealing and the selling, and Bazur and the others wander the city, relax, and collect
when she comes back from her expeditions. His day is a circuit of the town: two hours pacing his
second floor, a morning call on Borba gra-Uzgash at her shop, breakfast at Newlands Lodge with
Oghash, Dulfish and Magub gro-Orum, an afternoon at home, the Lodge again in the evening, and a
midnight stroll near Magub's house before bed at two. He dresses in a patched vest, sack cloth pants
and rough leather shoes, and carries an iron dagger and bow. He's more talkative than the rest of
the gang and leans hard on the name: "I got protection from the Orum Gang. So don't mess with me."
To him, anyone outside the gang is the Outside, and the Outside should stay where it belongs.
'''

["Beatrice Gene"]
bio = '''
Beatrice Gene is a Breton servant at Anvil Castle, and the evening dinner party is the centre of her
working life. She sleeps in the southernmost room off the dining hall, wakes at six, breakfasts with
Colin Stedrine in the servants' dining area, and from eight until five the two of them prepare the
hall and the table for Countess Millona Umbranox's guests. At five she takes a seat and eats her own
dinner for two hours, then works another hour before the company arrives; through the evening she
keeps her usual spot near the big table, seeing that every guest wants for nothing, and only when
the last of them has gone does she go to her bed. She dresses plainly in green felt linens, a green
wool shirt and huntsman moccasins, and carries the castle's keys and a little coin. She is quiet,
watchful and used to going unnoticed, and she keeps the household's small confidences to herself.
'''

["Beelei"]
bio = '''
Beelei is an Argonian who lives alone in a small house in Deepwallow, and she keeps to it as much as
she can. She rises at eight and frets about the house until noon, then pays short calls on her
neighbours Erver Devani and Dulphumph gro-Urgash until three; after that she shuts herself in and
skips her meals rather than go out again. She wears a patchwork shirt, belted braies and scruffy
shoes, and keeps an iron shortsword by her though she has little faith in it. She is thin, wary and
worn down by worry, and she talks in nervous half-questions. She is afraid of the outside and of
"Them," whoever she takes them to be, and she cannot quite believe a stranger has come through it
unharmed. "It's awful out there in the world, isn't it? Best to just stay at home, inside... where
it's safe." She sees little of Erver, who keeps to himself entirely, and rather more of Dulphumph.
She wants only to be left in peace, and to be sure that what is outside stays there.
'''

["Beem-Kiurz"]
bio = '''
Beem-Kiurz is the Argonian healer of the Great Chapel of Mara in Bravil, and the chapel is his whole
life: he sleeps in the Chapel Hall, takes his meals there, and passes his days between the
Undercroft, the pews and the staircase, praying at the Altar of the Nine each morning and receiving
Mara's blessings at four. He wears a blue and green outfit and quilted shoes and carries the chapel
key. He is quiet and unhurried, a patient teacher of Restoration to anyone who asks, though he keeps
his own counsel about what he knows and will not speak for another's mastery. He is courteous to the
folk of Bravil who come to the chapel, and they in turn treat him as part of its stones. "Mara's
mercy is not hurried," he says, "and neither am I."
'''

["Beewos"]
bio = '''
Beewos is an Argonian hunter who has given herself wholly to Sheogorath, and she lives at his shrine
in the wilds of the Jerall Mountains, where she kneels in silent prayer behind the lectern from dawn
to dark and often through the night. She wears only a leather helmet and quilted shoes, carries an
iron dagger and a few coins, and never seems to eat or sleep; now and then she rests on one of the
benches, then returns to her knees. Her fellow worshippers, Ortis and Gregory Arne, watch her at her
devotions, and Angalsama keeps her own vigil at the three candles nearby. Beewos is mad, harmlessly
and completely, and happy to share it: she says she used to be a dog, and got better, though she is
a terrible dog now. She points strangers toward Ferul Ravel, who may know what she will be tomorrow.
'''

["Beirir"]
bio = '''
Beirir is a Nord savant of Bleaker's Way, and he lives in the Ulfgar family's house in the western
part of the village, where he sleeps each night from midnight until six. He takes a long breakfast
with Ulrika Ulfgar, then potters about the house until ten, when he walks down to the Goodwill Inn
and sits there four hours over a drink, passing the time with Kirsten the innkeeper and whoever else
has come in. By two he is home again for the rest of the day. He dresses plainly, in a quilted
doublet, tan linens and doeskin shoes, and keeps his copy of Ulrika's key about him. He is a quiet,
settled man who likes his comforts and his routine, and he holds to the old peace between the
Ulfgars and the Dalvilus as the village's own good sense; Hrol Ulfgar leads the clan, and Beirir is
content to follow where the family leads.
'''

["Bejeen"]
bio = '''
Bejeen is an Argonian hunter who lives in Weebam-Na's shack in Leyawiin and calls herself his
partner, in hunting and in everything else. The townsfolk remember her as a decent sort before she
took up with him; these days the two of them are known for running scams together, and she keeps her
worries to herself. She wears a stitched green shirt and belted braies and carries her house key and
a little coin, and she spends her days pacing the house, never settling to eat or sleep. She frets
about the trolls in Tidewater Cave and about fishermen poking where they shouldn't, and she dreads
nosy friends snooping about the place. She is anxious, watchful and quick to deny any knowledge of
things she'd rather not discuss. "I'm Bejeen," she says. "I'm a hunter, and Weebam-Na's partner."
'''

["Belisarius"]
bio = '''
Belisarius is an Imperial knight of the Blades, sworn to the service of Cloud Ruler Temple in the
Jerall Mountains north of Bruma, and he keeps the night watch there. He sleeps in the East Wing from
eight in the evening until midnight, then patrols the grounds until dawn, making a sweeping circle
around the wall and stopping at the West Watch Tower on every pass; at eight he hands over and walks
the temple's interior, sometimes pausing in the dining area of the West Wing to talk with whichever
of his brothers is at the tables. He is off duty at four and spends the rest of his evening in the
East Wing, eating and drinking, and he is partial to the Great Hall: on those cold nights, he says,
nothing warms your bones better than a roaring fire. He wears the Blades' full armour on patrol and
carries an Akaviri katana, and he is steady, quiet and dutiful, the sort of man the busier Blades
point a stranger toward when they have no time themselves.
'''

["Belisarius Arius"]
bio = '''
Belisarius Arius is an Imperial assassin and a Speaker of the Dark Brotherhood's Black Hand, one of
the five who rule that hidden family and answer only to the Night Mother. He keeps his Black Hand
robes and hood, doeskin shoes, and an unenchanted iron longsword, and little else. Of late his
duties have turned to administration, and he says so with regret: he has not had blood on his hands
in far too long, and he misses it. He is devout to Sithis, hails the Dread Father at the slightest
prompting, and takes an open, unholy relish in killing that he makes no effort to hide. He holds
himself with a Speaker's assurance and speaks to fellow Speakers as equals. He keeps the
Brotherhood's secrets as a matter of course, and the traitor working against them is no concern of
his; he trusts the Black Hand to close its own ranks.
'''

["Belmyne Dreleth"]
bio = '''
Belmyne Dreleth is a Dunmer battlemage who has just come through the Strange Door in Niben Bay and
fallen to his knees on the shore, and whatever he saw on the other side has broken something in him.
He wears only patchwork pants, a matching shirt and scruffy shoes, and he clutches an iron dagger he
plainly does not know how to use well. He is raving, wild-eyed, shouting that it is all wrong, that
he will not go back, that everyone around him is going to die; he sees enemies in every face, Gaius
Prentus's included. Before he went through the door he was a man who chose to venture into the
Shivering Isles, and he came back alone and screaming. He wants only to be left alone and never made
to return, and he cannot tell a friend from a threat. "Stay away from me!" he cries. "I won't go
back!"
'''

["Bendu Olo"]
bio = '''
Bendu Olo is an Imperial prisoner in the Imperial City's prison, and on the day a stranger first
meets him he is nothing more than that: a man in a ragged shirt and sackcloth trousers, sitting in a
dim cell on the strength of a sentence he does not discuss. He is quiet, watchful and patient, with
the flat, careful manner of someone who has learned that words cost more than they buy, and he keeps
his own counsel about where he comes from and what he did to land in irons; he has no family in the
city he will name, and no trade he will admit to. He spends his hours pacing the small length of his
cell, listening to the guards' boots and the distant noise of the city, and he wants only the one
thing every prisoner wants: to walk out through the door. He answers a stranger's questions briefly,
meets their eyes without flinching, and gives them nothing he is not asked for.
'''

["Beran Sintav"]
bio = '''
Beran Sintav is a Breton commoner of the Elven Gardens District, one of four nephews of Iniel
Sintav, and he lives in his brother Kastus's house with Kastus and Vontan; the fourth brother,
Cyronin, keeps his own roof after his quarrel with Helvo Atius soured things between the Sintavs and
the Atius clan. Beran sleeps in the bed by the upstairs entrance, is up and about the ground floor
until ten, then spends the rest of the day strolling the district's gardens and streets, home at
five to rest and eat before an evening of talk with his brothers. He tends gardens, trees and grass
for his living and says so plainly: "I'm Beran. Kastus, Vontan, and me, we take care of gardens and
trees and grass. Hard work, but it pays." On Loredas he stays in all day; on Sundas the whole clan
visits Uncle Iniel. He hopes Iniel will set the brothers up in business together, a fruit orchard or
tomatoes, if they work hard.
'''

["Berich Inian"]
bio = '''
Berich Inian is an Imperial warrior of the Kvatch Castle Guard, and he holds the key to the castle
gatehouse. Since the night the city burned he has lived in the Chapel of Akatosh with the other
survivors, wearing what is left of his uniform and keeping his steel longsword close. He is a guard
stripped of his post: Captain Savlian Matius has not given the order, and until he does Berich lets
no one through the chapel doors, whatever they promise. He is blunt, weary and short with strangers,
and he has seen enough to doubt any of them will live long. Brother Martin led the survivors here
through the confusion, and Berich knows the debt. He keeps his orders, his key and his temper, and
he is waiting for the word to fight back.
'''

["Bernadette Peneles"]
bio = '''
Bernadette Peneles is a Breton grape-grower in Skingrad, and has lived there all her life; she works
the vines at Tamika's vineyard west of the city, hoeing the rows until eleven, taking her lunch in
the shelter southeast of the fields, and spending the afternoon in the yard behind Tamika's house.
She prays in a pew at the Great Chapel of Julianos every morning before work, and on rainy days she
takes the hint and goes home after chapel. She wears coarse linens and oiled shoes, keeps her house
key and tools about her, and carries a bit of bread so there's always something for her meal. She's
content with her lot—fresh air, mountains, grapes on the vine—and says so plainly: "I've lived here
all my life. Grown grapes. It's all I know." Lately the Wood Elf Glarthir has been stranger than
usual, and she thinks he's taken to following her; she's tried to greet him and he pretends not to
hear.
'''

["Betto Plotius"]
bio = '''
Betto Plotius is an Imperial commoner of Leyawiin, a lifelong townsman who shares his house with his
wife Julitta, and the two of them are of one mind on most things. He rises at six and lingers
indoors until ten, then takes a long breakfast at the Five Claws Lodge; by midday he's strolling the
streets near the empty house for sale, and he wanders there until dinner, after which he walks down
to the gathering spot at the foot of the stairs to the Blackwood Company hall before taking a
roundabout way home, feet wet from the pond. Rain keeps him in. He dresses plainly, sackcloth
trousers and a shirt with suspenders, and carries his key and a little coin. He is proud of being an
Imperial and prouder still of Leyawiin, and he holds that the Count's clever young bride has the
right of it: the city wants law and order, the Legions brought in, and no coddling of the Renrijra
Krin. He'd happily see every Argonian and Khajiit driven out of town, and says so. "Betto Plotius,"
he introduces himself. "I'm a faithful servant of Leyawiin and the Emperor... Gods rest his soul."
'''

["Bhisha"]
bio = '''
Bhisha is a Khajiit beggar who sleeps on a bedroll behind Things Found in Crucible, and by day he
follows Ushnar gro-Shadborgob and his dog. He means no harm by it: he likes dogs, and Ushnar's is
the only one in Crucible, a pretty one, and Bhisha trails it through the streets from morning until
evening, waiting outside whatever house the Orc ducks into, then gives up at six, takes a stool for
a one-hour dinner, prays two hours in the Sacellum Arden-Sul, and wanders the empty streets an hour
before bed. He wears sack cloth, carries a tan cup and a bit of food, and has a wasting sickness in
his limbs he doesn't speak of. The people of Crucible know his obsession well and think him odd;
Ushnar himself recoils from him and wishes him gone. Bhisha is harmless, stubborn and simple, and
says of the dog, "I like dogs. Dogs are pretty."
'''

["Biene Amelion"]
bio = '''
Biene Amelion is a Breton blademaster of Water's Edge, a small settlement on the road, and she lives
in the farmhouse she grew up in. She keeps to herself and keeps the place quiet: she takes a long
meal at midday and another at six, and the rest of her hours she spends indoors, resting, tending
the house, never sleeping much. Her father Marcel is gone from the village, dragged off in the night
by the men he owed; his gambling left a debt of over a thousand septims, and now it is hers, and she
fears the same hands will come for her. Her grandfather's enchanted sword and cuirass lie buried
with him in the family tomb, and she means to sell them to pay what her father owed. She wears
coarse linen and carries an iron dagger, and she is anxious, earnest and quick to thank anyone who
helps her. "I'm glad you're here," she says. "I need your help to repay a debt."
'''

["Big Head"]
bio = '''
Big Head is an Argonian savant of Bliss, in New Sheoth, and the fork is the whole of his religion.
His house in the alleyway east of The Missing Pauldron is a fork temple: forks in glass cases, forks
in cupboards and drawers, and a great Grummite statue holding a pitchfork. He loves every one of
them, and he never sleeps; he spends the nights walking his house, admiring and worshipping his
collection. At six he takes a two-hour breakfast on the ground floor, at noon he prays two hours in
the Sacellum Arden-Sul, and from two until eight he hunts the streets of Bliss for more, crouched
low, peering into the satchels of citizens and snatching what he finds. At eight he takes his food
from The Choosy Beggar and eats untroubled among the guards. His neighbours call him a deluded fool
who will never find the Fork of Horripilation, and he hears none of it. "Sing for Big Head," he
says.
'''

["Bittneld the Curse-Bringer"]
bio = '''
Bittneld the Curse-Bringer is the Nord captain of the Chorrol Guard, and he lives at the Castle
Chorrol Barracks, where he rises at six and is out on his rounds by mid-morning. He reports to
Countess Arriana Valga in the Great Hall each morning, and he takes the city's security seriously;
he wears the Chorrol cuirass over chainmail and carries a silver claymore, and he holds the castle's
private key and the dungeon key. His men respect him, and he is courteous to strangers: "I'm
Bittneld the Curse-Bringer, captain of the Chorrol Guard. What can I do for you?" He is a decent,
plain-spoken man, though he has a snobbish streak he doesn't care to admit to: he drinks at the Oak
and Crosier, and he thinks the women of Chorrol are fine-looking but snooty, and not very nice. He
keeps his own counsel about the Countess's painting.
'''

["Bjalfi the Contemptible"]
bio = '''
Bjalfi the Contemptible is a Nord warrior who has thrown in his lot with the Marauder gang holed up
in the depths of Fort Strand, and he keeps to its cold stone halls in his heavy armour, boots,
greaves and all, with Rockshatter never far from his hand. Until lately he lived at Whitmond Farm as
Maeva the Buxom's husband, and he left her there without a word, carrying off the mace her father
gave them at their wedding, an heirloom of her family for generations, to seek his fortune with
thugs. He is a big, sullen, greedy man, and the contempt in his byname is earned: he took what was
not his and did not look back. He keeps his reasons to himself and does not care to be asked about
the wife he left or the farm he abandoned. "Find his fortune," he told her; the mace was the fortune
he meant.
'''

["Black Brugo"]
bio = '''
Black Brugo is an Orc marauder and the chieftain of the Black Bow Bandits, the gang of highwaymen
that has been plaguing County Leyawiin: they name themselves for the black bows they carry, and
Brugo wears one across his back though he never looses an arrow from it, having none. By day he lies
up in the wilds halfway between Border Watch and the Ayleid ruin of Telepe with his two companions,
Alonzo and Roxy Aric, and sets upon travellers on the roads; at eight in the evening the three of
them walk to Telepe, spend the night inside, and come out again at six to return to their camp. He
is a big, heavy-armoured brute of a mer, a longsword at his hip and a key to an old coffer in the
ruin, and he trusts to his size and his gang's numbers rather than to wits. He and Mazoga the Orc
split a share or two long ago, before she took up the name of knight, and he is a jerk.
'''

["Black Rock Captain"]
bio = '''
The Black Rock Captain is a Dunmer ghost who haunts the Lost Black Rock Chasm, a hidden place in the
Black Rock Caverns where his ship came to rest at the end of its last voyage. He and his crew died
there, and they linger yet, wandering the wreckage of the vessel they once sailed. He dresses like a
bandit rather than an officer, in light boots, greaves, a cuirass and gauntlets, and he carries a
steel cutlass at his side. He walks the water of the cavern as easily as dry stone, and he can slip
from sight when he chooses; his touch chills the living and saps their strength. He keeps his own
counsel and gives strangers short shrift, as a captain does when his command has shrunk to a few
faithful dead and a broken hull.
'''

["Blackwood Company Member"]
bio = '''
This Blackwood Company member is an Imperial healer, and he lies dead in the Forsaken Mine, one of
the company's own lost in the fighting there. He wears the full Blackwood armour and carries no
weapon, which tells his trade plainly enough: his work was mending the men beside him, not killing
what they fought. He was one of the company's rank and file, a man who took the company's pay and
marched where it sent him, and whatever he thought of the orders he was given he kept to himself.
The company's name carries weight in Leyawiin and beyond, and its members keep their own counsel; he
did the same. He is past telling anyone what happened in that cave, and the company has not sent
anyone to bring him out.
'''

["Blanche Mastien"]
bio = '''
Blanche Mastien is a Breton commoner who has given her whole life to Namira, the Daedric Prince of
darkness and decay, and she keeps her vigil at the Prince's shrine in the wilds of the Great Forest.
She divides her days between three devotions: sitting silent and still on one of the shrine's
benches, laying an offering before the altar, and preaching from behind the lectern in a low, level
voice. Between times she wanders the shrine grounds, never far from the altar. She wears a burgundy
linen shirt and tan linens, rough leather shoes on her feet, and an iron dagger at her side.
Hjolfrodi the Harrier and Degil keep the shrine with her; Hjolfrodi leads, and Blanche defers to
him, sending strangers to "the one in the robes" rather than answer for the cult herself. She is
solemn, joyless and utterly certain, and she has no patience for the curious.
'''

["Bleak Mine Guard"]
bio = '''
The Bleak Mine Guard is a Dunmer warrior in Lord Drad's employ, one of the men who keep the ogres of
Bleak Mine swinging their picks and keep strangers out of the tunnels. He wears a heavy cuirass,
helmet, shield and boots, carries an unenchanted longsword and a ring of cage keys, and paces his
stretch of the mine through his shift, watching the pens and listening for trouble. He works for
pay, not for love of the work, and the ogres are to him stock that must not stray. He is a sour,
watchful man with a short way of speaking, and he has no patience for excuses: "No repeat offenders!
That's my motto!" he growls at anyone who lingers where they shouldn't. He keeps his own counsel
about Lord Drad and the mine, and he does not intend to be the one who lets a cage stand open.
'''

["Bleak Mine Guard Captain"]
bio = '''
The Bleak Mine Guard Captain is a Dunmer warrior in Lord Drad's employ, the senior man over the
guards who keep the ogres of Bleak Mine at their labours and keep strangers out of the tunnels. He
wears a full suit of heavy armour, cuirass and greaves, helmet, boots and gauntlets, and carries a
claymore; he sleeps from midnight until six and paces his section of the mine the rest of the day
and night. He is a hard, watchful, unsmiling man who has no patience for excuses and none at all for
repeat offenders, and he says as much: "Thieves break in, but they don't break out... they break all
over, when I'm finished with them." He keeps his cage key on him always, answers to Lord Drad and no
one else, and treats the ogres as stock and intruders as a chore to be settled with steel. The other
guards keep their distance from him and mind their pacing.
'''

["Blue Team Gladiator"]
bio = '''
The Blue Team Gladiator is a Dunmer combatant of Gladiator rank who lives down in the Arena
Bloodworks, and the Arena is his whole life. He wakes at six, takes a long breakfast, drills his
fists on a punching bag from eight until three, then shoots arrows at the targets until he finally
sleeps at one in the morning, dressed in coarse linens for the one and a light raiment with a steel
bow for the other. He's warm, talkative and quick to laugh, greeting every newcomer like an old
friend, though he'll wave away his own name as unimportant. He reveres the Blademaster Owyn, who has
run the fights since Gaiden Shinji's day, and keeps a respectful distance from Ysabel, the Battle
Matron, who deals only with challengers to the Grand Champion. He lives by Shinji's credo, that the
best techniques are passed on by the survivors, and he counts Agronak, the Gray Prince, as his
friend and mentor. "Farewell, my friend. May your blade always strike true. And first. He he."
'''

["Boderi Farano"]
bio = '''
Boderi Farano is a Dunmer battlemage and a Wizard of the Mages Guild at the Arcane University, where
she teaches advanced Mysticism in the Mystic Archives. She rises at six, takes a book up to the
gallery and reads for two hours, then drifts about the ground floor, often falling into talk with
Tar-Meena, before returning to the library at ten to pace its shelves until four. She dresses
plainly, brown shirt and linens, and carries no weapon, trusting her spells. She is brisk, precise
and a little impatient with dawdlers, but she keeps a place in her day for anyone serious about the
art. She has no patience for muddled directions or muddled thinking, and she is quietly certain that
the deepest knowledge of Mysticism in Cyrodiil sits with Dagail in Leyawiin, not with her. "You want
Advanced Training in Mysticism? I think I can fit you in."
'''

["Bogrum Gro-Galash"]
bio = '''
Bogrum gro-Galash is the Orc publican of The Lonely Suitor Lodge in Bravil, and the lodge is the
whole of his ambition. He serves behind the counter from morning until ten, takes his own meal then,
serves again until one in the morning, sleeps four hours and rises to open up. He wears a green wool
shirt, belted braies and stitched leather shoes, and keeps a little gold on him. The building is
weathered like everything in Bravil, and he says so himself: it may not look like much outside, but
that's just the weathered Bravil look. He has one room upstairs, two beds, ten gold the night, and
he'll tell a customer plainly that it isn't a palace and that he isn't running a charity. The
townsfolk say he puts everything into the place and takes great pride in it, and he does. He also
keeps an eye on his neighbours, and will point a stranger toward Ursanne Loche, whose husband is
missing, if she might use the help.
'''

["Boldon"]
bio = '''
Boldon is a Redguard commoner of Kvatch, and Kvatch is gone. He was asleep when the door to Oblivion
opened in the night and the Daedra came through and set the town burning; he got out alive, and many
he knew did not. Now he lives in the refugee camp strung along both sides of the road below the
ruined walls, and he does not sleep and he does not eat. He walks. He wanders the tents and the
cookfires without settling, and time and again he drifts out toward the Gold Road, watching for
other survivors coming up the hill. His coarse linen shirt, laced leather pants and rough leather
shoes are everything he owns, with a few coins in his purse. Hollow-eyed and curt with strangers, he
asks what they want before they have spoken. Ask him about the attack and his voice goes flat and
careful, as though saying it plainly is the only way he can say it at all.
'''

["Bolor Savel"]
bio = '''
Bolor Savel is a Dunmer necromancer who keeps the door of Echo Cave, the stronghold of the King of
Worms, and he keeps it badly and knows it. He paces the ground outside the entrance at all hours, in
his necromancer's robes and hood and a pair of pigskin shoes, a silver dagger at his belt and the
door's key in his keeping; he never eats and never sleeps, and the waiting has worn him thin. He is
restless, suspicious and quick to take offence, and he meets every approach with disgust and anger,
certain that anyone who comes this way means his master harm. He speaks of the King of Worms as His
Grace, with a reverence that sits oddly on a man so frayed, and he means his vow to die defending
the key. He wants only to be found faithful, and fears, without saying it, that he will not be.
'''

["Bolwing"]
bio = '''
Bolwing is a Wood Elf beggar who sleeps in a hole in Crucible's city wall, behind Ma'zaddha's house,
on a bedroll he rolls out at ten and leaves at six. He wears sack cloth, carries a tan cup and
whatever food he has, and eats at six in the evening if there's anything to eat, making it last two
hours. He worships at the Sacellum from seven till nine, and for the rest of the day he loiters by
the southern gate, trying to talk to the Dark Seducers on patrol, who rebuff his babble. For to hear
him, he speaks nonsense, words rearranged until only the barest semblance of meaning is left; he
knows it, and keeps to himself the fact that his mind is perfectly clear and his speech perfectly
ordinary, and that only poor Big Head, forever in a lather about his Fork, has ever seemed to
understand a word of it. He has no patience for gossip. "Fribble! Just Fribble!" he shouts, when
asked for news.
'''

["Bongond"]
bio = '''
Bongond is a Dunmer ostler who runs the North Country Stables outside Chorrol, and he sells Chestnut
horses: not the hardiest in Cyrodiil, he'll admit, but only the Black is faster, and he says so to
anyone who slows at the gate. He's up at six and about the stable until he unlocks the doors at
eight, takes his lunch and dinner at the house table, locks up at eight in the evening and is abed
by ten. He dresses plainly, brown shirt and light brown linens, and keeps an iron shortsword close.
Nardhil saddles what he sells. The townsfolk swear by his animals and find him pushy besides; he
talks to a browsing stranger as though the sale were already made, and when it isn't he calls it a
pity and names his price again. He thinks Chorrol right to trust what it knows, and he keeps his own
counsel on the rumours out of Kvatch.
'''

["Borba gra-Uzgash"]
bio = '''
Borba gra-Uzgash keeps Borba's Goods and Stores in Cheydinhal, and she has stocked it for the
adventurer: weapons, armour, clothing, books, potions, lights, the lot, and a fair few things
recovered from her own old adventuring days. She is an Orc of middle years, brisk and businesslike,
in a russet felt outfit and quilted shoes, behind her counter from eight in the morning until eight
at night. She is an old adventurer herself and says so, and she will point a customer toward the
Rickety Mine out east along the Blue Road, the Ayleid ruin of Kemen, or Quickwater Cave to the
north, though she cleared that one years ago and cannot vouch for its present tenants. Her friend
Magub gro-Orum, a pal from the trade, helps her run the store. She dines most evenings at the
Newlands Lodge next door, among the Orum gang, whose skooma dealings she keeps well out of sight of
the shop.
'''

["Borissean"]
bio = '''
Borissean is a Redguard Wizard of the Mages Guild who sells spells on the ground floor of the Arcane
University's Praxographical Center, standing all day at the north edge of the guild symbol inlaid in
the floor. He sleeps upstairs from two in the morning until nine, dresses in black and burgundy with
gold-trimmed shoes, and keeps to that round without variation; the city beyond the walls, in his
view, is dirt, horses and idiots, and he says so. He is unsocial, blunt and entirely satisfied with
his own company and his work, and he greets every guild member who approaches with his name and
office and the reminder that he serves guildsmen only. With his associate Gaspar Stegine he has
mastered nearly every spell there is, and the two of them are spoken of across Cyrodiil as the most
powerful mages alive; the spells he sells are his own making, and he tells buyers that once a spell
is learned, the knowledge can be turned to making new ones.
'''

["Boroneth"]
bio = '''
Boroneth is a Wood Elf hunter who keeps Hircine's Shrine, a stone altar in a stand of trees where
three candles burn and the Prince of the Hunt is honoured. She lives there day and night, and
divides her hours between kneeling before the candles, preaching from the lectern, and resting on
one of the benches when her voice gives out. She wears a stitched green shirt, laced leather pants
and soft leather shoes, and carries an iron bow, a quiver of arrows and an iron dagger; she is a
hunter before she is a priestess, and the bow is not for show. Her fellow worshippers are Hunting
Tail and Vajhira, and the three keep the ground together. She is stern, watchful and utterly
certain, with no patience for idle visitors or careless feet, and she says little until she has
taken a stranger's measure: "This ground is sacred. Show respect."
'''

["Bosmer Thief"]
bio = '''
The Altmer thief is a tall, lean man in a leather cuirass and laced leather pants, huntsman's
moccasins on his feet and a steel dagger at his belt, and he has come to Cheydinhal for one thing
only: the Brush of Truepaint, which he means to take from the painter Rythe Lythandas. He works
alone, speaks to no one of his errand, and keeps a spare collared shirt in his pack against the day
he must look respectable again. He is patient and careful in the way of a man who has done this
before, and he watches the painter's house and learns its hours. What he knows of the brush he has
pieced together from rumour and overheard talk, and he believes it a key to a private world where no
one can follow him and no guard can lay a hand on him. He does not know its dangers, and he has told
no one his plan.
'''

["Bothiel"]
bio = '''
Bothiel is a Wood Elf wizard of the Mages Guild and the curator of the Orrery, the great brass
contraption of gears and spheres that stands in its own chamber off the Arch-Mage's Lobby at the
Arcane University. She is one of the few people alive who understands how it worked and kept it
running, and she will tell anyone who listens that the Orrery is her baby, and that there is only
one other in Cyrodiil's reach, the old one at Stros M'Kai in Hammerfell. The Orrery stands in
disrepair, and its state weighs on her, since without it she has no point of reference for the
movements of the heavens. She keeps to the Lobby by day, wandering or sitting on a bench, robed,
with a second pair of shoes about her person, and she sleeps long hours in the Mages Quarters. She
is courteous and distracted, fond of her guildmates and grieved to hear of any of them killed, and
she mislikes being hurried. "Welcome to the Orrery," she says. "I'm Bothiel, and the Orrery is my
baby."
'''

["Bradon Lirrian"]
bio = '''
Bradon Lirrian is a Breton commoner of Bruma, a quiet, likeable man who lives with his wife Erline
in the house he bought when they married. He works nights and sleeps through the days, which is why
the neighbours so seldom see him abroad in daylight; Erline keeps the house and frets over him.
Years ago he roamed Cyrodiil with a brotherhood of treasure-seekers, and Raynil Dralas was one of
them; when he wed Erline he gave all that up to settle down, and he has never spoken of it since. He
keeps his old secrets close, even from her, though she knows there was a promise in it. He is mild,
private and steady, a man who pays his debts and keeps to himself, and Bruma's folk remember him as
a decent fellow and a good husband. "He works at night," Erline says, "and has to sleep during the
day."
'''

["Brag gro-Bharg"]
bio = '''
Brag gro-Bharg is an Orc barbarian of the Fighters Guild, an Associate sent with Rienna and Elidor
to clear the goblins out of Desolate Mine, and the posting suits him down to the ground. He waits
with the others in the first great cave, around a lit campfire, in a full suit of steel armour, and
he has no weapon: none of the three thought to bring one, and Burz gro-Khash has had to send for
arms from the Guild. Brag is not troubled by the wait. He is a big, plain-spoken, cheerful brute who
says exactly what he thinks, and what he thinks about goblins is simple: the only good goblin is a
dead one, and he likes dead goblins. He points strangers to Rienna, the team's leader, until the
talk turns to weapons, and then he is all eagerness. He wants a hammer, the heavier the better, for
bashing in puny goblin skulls, and he will settle for a sword and say so.
'''

["Bralsa Andaren"]
bio = '''
Bralsa Andaren is a Dunmer mage who lives in the open country around the wayshrine of Kynareth
between Weatherleah and Nonungalo, her bedroll laid a few steps south of the shrine beside three big
rocks. She hunts deer from dawn to dark and follows a chase wherever it leads, so she's often gone
for miles, out past Nonungalo or Fort Dirich, and hard to find. She wears burgundy linens and
cowhide shoes, speaks to strangers with a flat "Begone, stranger! I have business with Kynareth's
shrine, and I will not be disturbed," and keeps her own counsel about the work she does there. She
is a master of Destruction magic, the finest Marc Gulitte and Delphine Jend know of, and both call
her odd; Delphine says she kills wildlife for sport. She holds the Creators in contempt and means to
strip their works from the world, and she reckons the gods will answer to her for it.
'''

["Branwen"]
bio = '''
Branwen is a Redguard monk who lives in the southeast corner of the Imperial City's Arena District,
where she and her friend Saliith train to become combatants in the Arena. She sleeps on the
easternmost of two mats and keeps her few things in a chest beside it. Her day begins at five, with
a brief meal by the bench, and from six until one the next morning she spars with Saliith; she
allows herself four hours' sleep and no more. She wears sack cloth pants and sandals and a huntsman
vest, and carries a carrot for the day. She is single-minded to the point of bluntness, and she has
no time for talk: "Sorry, friend, no time to talk! My friend Saliith and I are training to be
combatants in the Arena! It takes a lot of dedication to do what we do." She and Saliith trade blows
in the open air for anyone to watch, and she will not be distracted from the work.
'''

["Bravil Jailor"]
bio = '''
The Bravil Jailor is an Imperial guard of the Bravil watch who keeps the dungeon beneath Castle
Bravil, and he keeps it the way a man keeps a kennel: firmly, and without much sympathy for what's
in it. He wears the county's guard helmet and cuirass, carries a silver mace and the keys to the
castle interior, the castle exterior and the cells, and works his small office by the evidence chest
in shifts, handing over to a fresh man when his hours are done. Visitors wanting a word with a
prisoner get his company down the corridor and his hand on the door, and sometimes they get a price
for it first. He has a low opinion of criminals and says so through the bars, and he'll tell a
stranger plainly that escaping prisoners are executed, as a friendly reminder. Off duty he lives in
the castle and eats plain: an apple, a loaf and a carrot by day, a piece of ham at night. He's
watchful, blunt and not unkind to honest folk. "What can I do fer ya, sir?"
'''

["Brellin"]
bio = '''
Brellin is a Wood Elf crusader from Silvenar who has come to the Priory of the Nine to offer himself
as a knight in the service of Auri-El, whom the Cyrodiils call Akatosh. He wears leather boots,
greaves and cuirass, carries an elven shortsword and a hoe for the priory garden, and brings nothing
else but his skill with the blade, which he does not consider inconsiderable, and his devotion. He
is humble to the point of self-abasement, grave and courteous, and he will not press himself where
he is not wanted: refused, he says only that he will keep training and meditating at the Priory
until he is worthy. He keeps to the chapel and the priory house, tends the garden in the mornings,
and waits. "My devotion to Auri-El will not flag," he says, "nor will my desire to become a Knight
of the Nine. Will you have me?"
'''

["Bremman Senyan"]
bio = '''
Bremman Senyan is an Imperial warrior of Cheydinhal and a Knight of the Thorn, sworn to the order
the Count's son Farwil Indarys commands. He wears the knights' steel and their thorn-marked shield,
carries a steel mace, and has known Farwil since the lad was small; he calls the young man brash and
given to leaping before he looks, and wishes his heart were bigger than his pride. He is patient,
plain-spoken and steady where Farwil boasts, and he keeps his doubts about the order's rivalry with
the City Watch mostly to himself. He wants the Knights to prove themselves worthy of Cheydinhal, and
he wants Farwil to come home safely to his father. He has no wife or household that he speaks of;
the lodge and his brothers-in-arms are his life. "Don't judge Farwil too harshly," he says. "Most of
what he says is fabricated."
'''

["Brevi"]
bio = '''
Brevi is a Dark Seducer of the Shivering Isles, sworn to Sheogorath's court and counted among the
citizens of New Sheoth. She wears the dark mail and helm of her order and carries a seducer's blade,
and she can summon the spells her sisters summon when a fight is on. She keeps her own counsel and
goes where her duty sends her, and she holds herself with the cold, correct bearing of the Mazken.
Among the Dark Seducers she is one of the many, not one of the named captains, and she expects no
notice and offers none. She speaks plainly and briefly, and she thinks ill of idle talk. "The realm
has enemies enough without my adding to them," she says, and leaves it at that. What she wants is to
serve the realm and be found faithful in it, and she keeps her own thoughts where they belong,
behind her helm.
'''

["Brielus Gawey"]
bio = '''
Brielus Gawey is an Imperial commoner who works at the Chestnut Handy Stables just outside the
Imperial City's main gate, and he keeps the night watch there: from midnight until eight he wanders
the corral with a lit torch, counting the few remaining horses and following anyone who comes inside
to make sure none of them is led away. He eats his breakfast at the stables when his shift ends,
sleeps through the day, rises at six for a two-hour dinner on the front porch, and tidies the place
with his rake until midnight. He wears a plain shirt with suspenders, sack cloth pants and rough
leather shoes, and keeps a rusty iron war axe about him. The stables belong to the Orc Snak gra-
Bura, and Brielus has his doubts about an Orc's way with horses; he'll tell a stranger so, and that
the stew pot sees more of them than the saddle does.
'''

["Brithaur"]
bio = '''
Brithaur is a Wood Elf who lives alone in a house in Crucible, and the house is not his: he took it
from its rightful owner some while back and has stayed put ever since. He is a thief, and not a
subtle one; the shopkeepers of Crucible have grown tired of finding him browsing their wares with
his hands where they shouldn't be, and Earil, who runs the magic shop, has taken his custom
elsewhere in his mind and wishes the Wood Elf would simply vanish from the streets of New Sheoth.
Brithaur knows what people say about him and shrugs it off. He calls it collecting. Shiny things,
valuable things, he can't help himself, and his collection wants only five flawless pearls to be
complete. He keeps his own counsel on that, and on the house. He wakes at eight, breakfasts at home,
and is out by eleven, drifting between the shops; he worships at the Sacellum when it's free, sups
at six, and is pleasant as pie to anyone well equipped who passes the time of day. "You got a
problem?" is how he greets a stranger.
'''

["Britta Invel"]
bio = '''
Britta Invel is an Imperial acrobat who moves through Leyawiin's upper circles on her husband
Jaras's arm, and the pair are guests of Countess Alessia Caro at the dinner party in Castle
Leyawiin's dining hall, seated at the long table from six in the evening until midnight. She dresses
for it: red velvet blouse and garment, blue suede shoes, and a loaf and an apple in her keeping
against a long evening. She is supple, poised and quietly pleased with her place at the Countess's
table, though she keeps her voice low and her opinions to herself among the castle's betters, and
she has a habit of folding her hands and smiling at talk she does not care for. She wants the
evening to go well, and to be asked back. "One does not refuse the Countess," she murmurs to Jaras
when the wine is poured.
'''

["Brodras"]
bio = '''
Brodras is a Bosmer crusader and an Associate of the Leyawiin Fighters Guild, and he knows full well
that a Wood Elf in iron plate is a sight people remark on. He's heard every joke about it and heads
them off before they're made: he's as tough and beefy as any Orc, and not every Bosmer sneaks about
with a bow. He sleeps in the guildhall's southeastern bedroom, wakes at six, and spends four
exhausting hours sparring with Antus Flonius in the east wing of the second floor before a quiet two
hours in the west wing. At noon he drifts about the ground floor, and at two he takes lunch at the
Five Claws Lodge among the regulars. He wears iron boots, gauntlets, greaves and cuirass, carries an
iron claymore, and changes into Huntsman clothes at night. He teaches heavy armour to guild members
and does few contracts; the Blackwood Company takes them all, which galls him. "No jokes about the
Heavy Armor, eh?"
'''

["Brokil gro-Shatur"]
bio = '''
Brokil gro-Shatur is an Orc of Bravil who lives at Silverhome on the Water and rarely stirs from it.
He sleeps in the first room on the right above the taproom, comes down at six in the morning, takes
dinner at the back table at six in the evening, and spends every hour between in the taproom,
chatting with the staff and whoever sits nearby. He calls himself Lord High Warden of the Taps and
Gilgondorin's most prized customer, and boasts that he tastes everything, over and over, and over
again. He wears a russet felt outfit and carries a few coins. He's genial, idle and endlessly amused
by himself, and he'll tell any stranger that bearing the burden of Bravil's First Citizen of the Ale
Tub is a terrible responsibility, suffered like a Sure-Green Orc.
'''

["Bronsila Kvinchal"]
bio = '''
Bronsila Kvinchal is an Imperial dockworker who lives in a shack in the Imperial City's Waterfront
District with her brothers Kastav and Vlanarus, and the three of them are forever at each other's
throats. She works the docks for the Imperial Trading Company and has done as long as Vlanarus, but
he treats her like a novice, peering over her shoulder and telling her to do it this way and that.
She is up before six, potters about the shack, puts in her hours at the easternmost warehouse and is
home by seven, and she wears a plain shirt, belted braies and clogs and carries the shack key and a
few coins. Kastav, by her account, is no better: a dog and a pig, she calls him, and he says much
the same of her. She is tired, sharp-tongued and quick to complain. "I'm Bronsila Kvinchal," she
says. "And I'm so sick of that Vlanarus, I could scream."
'''

["Brotch Calus"]
bio = '''
Brotch Calus is a retired alchemist who lives alone in his house in the southeastern quarter of
Bruma, and he keeps his own hours: he rises at ten, shuts his door against the town for the rest of
the day, and lets no one in until midnight, when the house stands open for two hours before he
sleeps. At nine he walks down to Olav's Tap and Tack for his dinner and sits there until midnight,
and there he'll talk alchemy with anyone who asks. He takes a few students still, by appointment, to
keep himself in his hobbies, and he'll tell them plainly that he's done with public practice. He's
an Imperial of few words, courteous and dry, dressed in his quilted doublet and linens, and he
doesn't suffer fools or repeat himself. "Brotch Calus, Alchemist. Advanced Training, available by
appointment," is how he introduces himself, and it's most of what he means to say.
'''

["Brother Hjar"]
bio = '''
Brother Hjar is a Nord Moth Caretaker at the Temple of the Ancestor Moths, high in the Jerall
Mountains north of Cheydinhal, and his days there keep a quiet, unhurried rhythm. He wakes at six
and takes a long breakfast, kneels in the chapel in silent prayer with Brothers Holger and Hridi
from eight until eleven, spends the afternoon wandering the ground outside the Monk's Quarters, and
goes in at six to dine at eight and sleep soon after. He wears the white robes and clogs of his
order and carries the temple key. He serves the retired Moth priests who live blind in the secret
catacombs below, and he speaks of their blindness plainly, as the cost of the work they do. He is
gentle and courteous to strangers, keeps his voice low in the chapel, and says nothing at all about
Savilla's Stone. He bids farewell with "May you always wear soft silks."
'''

["Brother Holger"]
bio = '''
Brother Holger is a Nord monk of the Ancestor Moth, one of the caretakers at the Temple of the
Ancestor Moths high in the Jerall Mountains north of Cheydinhal. He wears the order's white robes
and a pair of clogs, and his days keep to a strict and peaceful order: breakfast, three hours of
silent prayer in the chapel, three hours in the quarters, two hours on the chapel roof looking out
over the mountains, three hours wandering the crypt in the dark, then dinner and bed. He and his
brothers Hjar and Hridi tend the cemetery and see to the silks the blind priests weave in the
catacombs below, and he is forever asking whether the month's silks are ready. He is calm, courteous
and devout, and he keeps the temple's secrets close. "May you always wear soft silks," he says in
farewell. He has a soft spot for a trustworthy stranger, and a fear of Hridi's disapproval.
'''

["Brother Hridi"]
bio = '''
Brother Hridi is a Nord monk of the Moth Priests who lives at the Temple of the Ancestor Moths, high
in the Jerall Mountains north of Cheydinhal. He wears the order's white robes and clogs and carries
the temple key and a hoe, and he is the one who tends the settlement's sparse crops and harvests the
silk from the Ancestor Moths. He rises at six, takes a long breakfast, prays silently in the chapel,
and works the land outside the Monk's Quarters from one until six, then dines and sleeps with his
brothers. He keeps the order's secrets and says nothing of Savilla's Stone; when asked about the
blindness of the retired priests he explains, mildly, that they serve in darkness because they are
blind, and that they see just fine. He is calm, courteous and devout, and his homilies are well
thought of by Brother Hjar. He greets strangers softly and bids them farewell: "May you always wear
soft silks."
'''

["Brother Martin"]
bio = '''
Brother Martin is a priest of Akatosh in the Chapel of Akatosh in Kvatch, a quiet Imperial in a grey
robe who leads prayers, tends the altar and keeps his own counsel about where he came from; his
father, he tells people, was a farmer. He is clever and well read, with a scholar's turn for hard
questions and a dry, weary manner that stops short of unkindness, and he holds the gods at arm's
length just now, doubting whether any divine plan is worth the price of it. Since the daedra came
through the gate below the city he has been the steadiest soul in the chapel, gathering the
frightened inside and keeping them alive, and the refugees credit him with their lives. He will not
leave them while they are trapped, whatever is asked of him. "If all this is part of a divine plan,"
he says, "I'm not sure I want to have anything to do with it."
'''

["Brother Piner"]
bio = '''
Brother Piner is an Imperial monk of the Order of Talos at Weynon Priory, the monastery on the hill
outside Chorrol, where he lives in the priory house with Prior Maborel, the herder Eronor and
Brother Jauffre, whom the brothers honour as Grandmaster though he prefers plain Brother. Piner was
training to become a Blade before he took the call to serve Talos as a monk, and he keeps his
Akaviri katana by him; he takes the night watch in case someone needs the chapel or a word, and he
has been writing a letter to his mother, who is much upset by the assassinations. He rises at five
for the chapel, and most mornings walks to Chorrol to visit Seed-Neeus at Northern Goods and Trade.
He is young, zealous and energetic, quick to welcome a stranger and readier to talk than to listen;
Prior Maborel hopes he may yet add patience and prudence to his virtues. "Welcome, good citizen. I'm
Brother Piner, and this is Weynon Priory. A monastery. Can I help you?"
'''

["Bruccius the Orphan"]
bio = '''
Bruccius the Orphan is an Imperial beggar who lives in Cheydinhal, and he has made the town his own
small circuit. He wakes early and takes his place at the east gate by six, asking help of everyone
who passes, until ten, when he moves to the steps of the Great Chapel of Arkay, where the faithful
are better disposed; by two he wanders in front of The March Rider, and at six he takes his only
meal of the day on a bench at Riverview before returning to his bedroll behind the guild halls, near
the Mages Guild well, to walk off the hours until he sleeps at ten. In rain he shelters under
Riverview's roof. He wears a huntsman's vest and belted braies, owns nothing else worth naming,
fights with his fists, and is known about town as one of the poor and suffering, which is how
Tandilwe speaks of him. He hears everything the streets say, and trades what he hears for coin.
'''

["Brucetus Festinius"]
bio = '''
Brucetus Festinius is a Breton spellsword for hire who can usually be found at the Roxey Inn, north
of the Imperial City on the road to Bruma, in the company of his fellow mercenaries Rigmor and
S'razirr and their employer, Claude Maric. He takes his meals at the inn at eight, noon and six,
sleeps eight hours a night, and passes the rest of the day in the common room, a light-armoured man
in a huntsman's vest by night, his longsword never far from his hand. He's a cool, watchful type,
pleasant enough on the surface and quick with a mocking grin when someone's been bested, and he
keeps his own counsel about what Claude is paying him for. He knows the spells of a spellsword's
trade and has no qualms about using them. He has no ties beyond the three he works with, and no
plans past the next job.
'''

["Bruma Jailor"]
bio = '''
The Bruma jailor is an Imperial guard of the Bruma watch who keeps the dungeons beneath Castle
Bruma, and he wears the city's uniform like any guard on the walls: helmet, Bruma cuirass, chainmail
gauntlets and greaves, and a silver mace at his belt. He carries the keys to the castle interior and
exterior, and the cell keys besides. He works his shift in the small office by the cells, and when
it ends another takes his place and he goes to his quarters to eat and sleep; the day man takes his
dinner of grapes, the night man a piece of ham. He is a jailor first and a soldier second, and he
says so plainly through the bars: "No talking. And, by the way, we execute escaping prisoners. Just
a friendly reminder." He is not a cruel man, but he is a thorough one, and he has no patience for
cleverness from anyone in a cell. To a visitor with business inside he is gruff and practical, and
he opens the door and walks them down himself.
'''

["Bruma Militia"]
bio = '''
The Bruma Militia are the ordinary townsfolk of Bruma, mustered to the walls in a city that has
never been a soldier's posting. They are the ones who stayed when the Count called: carters, smiths'
hands, innkeepers' sons, farm wives, anyone who could hold a spear or an axe. They wear what they
own, a coarse linen shirt under a leather cuirass, fur boots and greaves against the cold, a fur or
leather helmet if they're lucky, and they carry iron shortswords and axes, not the steel the guards
wear. They know they are not proper soldiers and say so plainly: "I wish we had more real soldiers."
They drill in the snow, stand their watches, and wait for the fight they have been told is coming.
They are stubborn, frightened and proud in equal measure, and they will hold as long as they can.
'''

["Bruma Soldier"]
bio = '''
The Bruma Soldier is an Imperial sharpshooter of the Bruma guard, posted outside the city's east
gate where the cold comes down off the Jerall Mountains. He wears the guard's chainmail and helmet
and carries a steel longsword, and he keeps his watch in the wind and the snow as Bruma's guards
have always done. He is a quiet, steady man, proud of his city and its hardy people, and he has no
patience for soft living or complaint; he does his duty without fuss and expects the same of others.
He knows the Countess watches over Bruma from the castle, and that the town's folk look to the guard
to keep them safe. He says little to strangers and less to townsfolk who waste his time. "Cold's
nothing," he says. "It's the waiting that wears on a man."
'''

["Bruscius Longus"]
bio = '''
Bruscius Longus is an Imperial priest who has given his life to Hermaeus Mora, and he lives at the
Prince's shrine in the Jerall Mountains with the other worshippers. He wears a brown shirt and light
brown linens and keeps an iron dagger and a little gold about him, and he spends his days on one of
the benches facing the shrine, rising now and then to wander the grounds or kneel before the three
lit candles. He speaks to strangers only in riddles, and only once: "Between the seen and unseen,
the seeming and the being, lies the gulf of ignorance," he says, and then he turns away and will not
say another word. The other worshippers take him for the most devout of them, and he is glad of it;
he keeps to himself the doubts that have begun to trouble his long watch, and he means to settle
them before he speaks plainly to anyone.
'''

["Bruscus Dannus"]
bio = '''
Bruscus Dannus is an Imperial commoner of Highcross, and he keeps the settlement's paving swept: he
eats his one meal between midnight and two, sleeps till six, and gives the rest of his day to his
broom, his rake and his house, which is ordered to his own exacting standard. He carries an iron
shortsword at his hip and a moderate purse, and wears brown trousers, a huntsman's vest and
moccasins. He collects things by type, day by day, and stores them in his armory chest or his
cupboard, and he will ask after your bathing habits before he asks your name. He frets over Mirili
Ulven's cluttered house and Runs-in-Circles' holes and grime, and both have learned to shoo him off.
"Excuse me. I need to sweep right where you're standing," he says, and means it.
'''

["Bugak gro-Bol"]
bio = '''
Bugak gro-Bol is the only Orc bookseller in Cyrodiil, and he runs Southern Books in Leyawiin: books
and scrolls, and a few rarities behind the counter, and he'll teach the basics of the blunt weapon
to anyone who asks. He wakes at six and takes a long breakfast in his private library upstairs,
among his own shelves; the shop opens at eight and closes at eight, and he takes his evening air at
the foot of the stairs to the Blackwood Company before a three-hour dinner. He wears a quilted
doublet and doeskin shoes and keeps little gold on him. The mixture of Orc and bookman puzzles the
town, and his fellow Orcs come in to mock him for it — "Ooh. Bugak got a book store. Ooh. Bugak's a
sissy scroll-scribbler!" — which he is sick of, and which has left him loud, blunt and always half-
ready for a fight: "Yeah. Buy a goddam book. It's a bookstore, ain't it? Don't just go peeking at
them! Buy one!" Leyawiin admits the collection is wonderful; it wishes he'd stop acting so tough.
'''

["Bumph gra-Gash"]
bio = '''
Bumph gra-Gash is an Orc crusader of the Bruma Fighters Guild, and she sleeps in the guildhall's
basement, rises at six and spends the morning pacing the ground floor before her day's real work:
four hours of sparring with Right-Wind, the Argonian Blade trainer, in the big practice area. She
takes lunch at Olav's Tap and Tack, rests below stairs through the afternoon, watches Right-Wind
teach in the evening and dines for four hours before bed at midnight. Bruma's chapter is one of the
smallest in Cyrodiil, and she makes the most of it. She wears iron from boots to gauntlets and moves
in it better than most warriors move unarmoured; the people of Bruma say so, and say she'll teach
heavy armour to any guild member who asks. She's blunt, hardy and proud of the Wrothgarian mountains
she came from: "Yeah, you think Bruma's cold, try a winter in the Wrothgarians. Bruma's a day at the
beach."
'''

["Bur-Meema"]
bio = '''
Bur-Meema is an Argonian conjurer and a devout worshipper of Azura, and she lives at the Prince's
shrine in the Jerall Mountains north of Cheydinhal with her fellow worshippers Ralsa Nethan and Mels
Maryon. She divides her days between the benches, the candles where she kneels, and the lectern
behind which she prays in silence; now and then she approaches the shrine itself and sets down an
offering. She wears a dark green shirt, blacksmith's pants and rough leather shoes, carries an iron
dagger and little coin, and will not be moved from her worship by anything, sleep included. She is
active and absorbed, and a stranger who interrupts her gets short shrift: "I'm trying to
concentrate. If you don't mind...?" The people of Cheydinhal know the coven and mostly defend it;
Trayvond the Redguard counts the Dark Elf among them no evil, and even Ulene Hlervu, who thinks all
worship a waste of time, calls them nice folks and not raving lunatics.
'''

["Burd"]
bio = '''
Burd is a Nord knight and the Captain of the Bruma Guard, and he lives in the barracks of Castle
Bruma, where he rises at six and walks his rounds of the Lords Manor, the Great Hall and the jail
until noon, dines at two and seven, takes one last patrol at ten and sleeps at midnight. In his
cuirass and chainmail greaves he is every inch the soldier, a steel claymore at his side, and he
keeps three healing potions about him and the castle key. He makes sure his guards treat the local
Nords and their ways with respect, and he and Yvara Channitte make a good pair: he understands Nords
and the North, she the subtleties of southern culture and politics. He is steady, modest and plain-
spoken, more at home giving orders than making speeches, and he follows the Countess's word whatever
he thinks of it. "I'm Captain Burd, commander of the Bruma Guard," he says, and means it.
'''

["Burz gro-Khash"]
bio = '''
Burz gro-Khash is the Orc who runs the Cheydinhal Fighters Guild, and he runs it with a scowl. He
sleeps upstairs in the guildhall until six, and unless it's raining he's out at first light on the
little island between the bridges, watching the sun come up in four hours of silence; rain keeps him
indoors, pacing. He wears enchanted fur from head to foot and carries a glass mace, and he keeps to
himself, with little to say to anyone. He has little use for the other two Guardians under his roof,
Keld of the Isles and Ohtimbar, and says so: "This guild is going to hell in a hogcart." Keld calls
him a bear sometimes and lets it roll off his thick skin. Burz wants fighters worth the name and
contracts done properly, and he judges everyone by whether they can cut it; he's blunt, short-
tempered and grudging with praise, and a job well done earns a grunt and a payment, no more. "Move
your ass, boot," is his idea of encouragement.
'''

["Caelia Draconis"]
bio = '''
Caelia Draconis is captain of the Leyawiin Guard, an Imperial officer who came to the city after a
tour with the Legions, and she keeps to a soldier's hours: on duty in the Three Sisters' Inn from
seven in the morning until three in the afternoon, in a private room on the second floor, then
asleep at the watch barracks until six, and out patrolling the streets all night. She wears her
Leyawiin cuirass with steel boots, greaves, gauntlets and shield, and carries a silver longsword and
the castle keys. She is brisk, dry and watchful, and she has settled into a practical, rather boyish
look that her mother, Perennia, laments; Perennia also says she broke hearts when she was younger.
Caelia knows her mother wished her to choose the chapel, or civil service, or a good marriage. She
keeps a bunch of grapes about her person. "Right, what can I do for you, citizen?" she asks, and,
"Move along, citizen. I won't abide loitering."
'''

["Caenlin"]
bio = '''
Caenlin is a Wood Elf pilgrim and the only heir of his late uncle Baenlin, whose luxury house in
Bruma he has just inherited, along with the man's blue velvet outfit and blue suede shoes, which he
wears as though they were made for him. He keeps the house key and a considerable purse about his
person, takes his uncle's bed and his uncle's chair, and keeps his uncle's hours: breakfast for
three hours, a nap, an idle morning on the second floor, a long lunch, and the evening in the very
chair where the stuffed minotaur head fell. He has no use for Gromm, the old servant, and turned him
out of the house directly. He is composed to the point of coldness and done with whatever grieving
he had to do; to questions about the accident he answers that Bruma's buildings are structurally
unstable, and to rumors of his own involvement, one word: "Nonsense." He receives strangers briefly
and dismisses them. "Hmm? Oh, Caenlin's my name. Maybe you knew my uncle, Baenlin? He died recently.
Stuffed head fell on him. Very tragic. Well, goodbye."
'''

["Caenlorn"]
bio = '''
Caenlorn is the Wood Elf half of the twin pair who run The Flowing Bowl on the Anvil Dockside, and
he is the one in blue. His brother Maenlorn, the one in brown, keeps the inn through every hour of
the day and night; Caenlorn takes his ease, sleeps in one of the guestrooms until ten, and starts
the day with a three-hour brunch downstairs. If it isn't raining he walks up through the dock gate
and sits on the bench beside Arvena Thelas until five, then divides his time between the inn and the
dockside whatever the weather. From ten at night he stays inside to keep his brother company until
his late bedtime at six. He's friendly, idle and a little pleased with the twins' small fame, and he
greets every newcomer by asking them to guess which brother he is. He recommends Norbert Lelles for
books and gems and Morvayn's Peacemakers for weapons.
'''

["Caldana Monrius"]
bio = '''
Caldana Monrius is an Imperial commoner who lives in her own small house in Crucible, in New Sheoth,
and her days are shaped around a skooma habit she cannot feed. She is pale and perpetually shaking,
unable to sleep more than a few hours at a stretch: she wakes at nine, prays silently at the
Sacellum Arden-Sul, sleeps again through the middle of the day, eats a long meal at home, and then
wanders her ground floor until night. From midnight until six she walks the streets of Crucible in
all weathers, restless and ragged in her patchwork shirt and scruffy shoes, whispering at strangers
for skooma and offering her few coins or whatever else she carries for a bottle. At eight she climbs
to the rooftop of Sickly Bernice's Taphouse, where the Duelists drink and fight; she takes her turn
with an iron dagger on Tirdas, Fredas and Loredas, and cheers the others on when she doesn't. "Psst!
You got any Skooma?"
'''

["Calindil"]
bio = '''
Calindil is the High Elf enchanter who keeps the Mystic Emporium in the Market District, and the
shop is his life: he wakes at six, breakfasts for two hours in the trading room, and unlocks the
door at eight sharp, selling spells, scrolls, soul gems and enchanted goods until eight at night. He
sleeps in the quarters above. Evenings he walks the city: dinner with the other traders at The
Merchants Inn on Morndas, Middas and Fredas, a stroll round Green Emperor Way on Tirdas, prayer at
the Temple of the One on Turdas, and the Arcane University at weekends, talking with scholars and
apprentices. He is courteous, unhurried and quietly certain of his wares, and the citizens speak
well of his shop. "Welcome to the Mystic Emporium," he says. "Calindil is here, with all your needs,
under one roof. Look, and buy. Nothing could be easier."
'''

["Callia Bincal"]
bio = '''
Callia Bincal is a Breton commoner camped with her family at Crestbridge Camp, a little way from the
Cropsford land her father bought. She came from High Rock with her husband Aloys and her father
Barthel, and she keeps the camp running while the men talk: she cooks, she tidies, she sleeps in a
tent and rises at six. She wears the same shirt and green linens every day and has little coin to
her name. She is gentle and steady, and she will not hear a word against her father, not even from
Aloys, who has had his fill of the whole venture and says so; when the quarrel starts she ends it
with a "Goodbye, darling" and walks away. She fears the goblins will break Barthel's heart more than
she fears the goblins. She is grateful to Mirisa, the guide who saved them, and she meets strangers
with an apology for the camp's poor hospitality. "Have faith, Aloys," she tells her husband. "I'm
sure my father will think of something."
'''

["Camilla Lollia"]
bio = '''
Camilla Lollia is an Imperial necromancer of the cult that preys on the Mages Guild, and she has no
home but the company she keeps and no trade but the raising and commanding of the dead. She dresses
in the plain dark robes of her calling and walks in pigskin shoes, and she carries little but a few
coins; her weapons are the spells she has learned, and she trusts them. She is patient, watchful and
coldly sure of herself, a woman who enjoys the moment an enemy understands he is trapped, and she
speaks to those she hunts in a mocking sing-song before she strikes. She gives her loyalty to the
cult and to no one else, and she keeps her own counsel about its designs. She thinks the Guild's
mages soft and foolish, and she has no pity in her. "Come out, come out wherever you are," she
calls, and means it.
'''

["Caminalda"]
bio = '''
Caminalda is a High Elf mage who has been a regular at the Brina Cross Inn for some days now, and
she has no intention of leaving it. She keeps a room behind the middle door of the upper hallway,
dresses in a blue velvet outfit with blue suede shoes, and passes her time in the taproom, wandering
and chatting with the innkeeper Christophe Marane and the other guest, Arielle Jurard. She is soft-
spoken, courteous and a little anxious, and she tells anyone who will listen that the recent
killings on the Gold Road have frightened her so badly she hasn't set foot outside in days. She asks
after travellers' business, especially merchants, and wishes them well on the road. "Oh, don't let
me bother you. You just stay safe on the road," she says. What she keeps to herself is that she
knows rather more about those killings than she lets on.
'''

["Camonna Tong Thug"]
bio = '''
Two Camonna Tong thugs keep Walker Camp for Dulfish gro-Orum, and the skooma that moves through it.
They are Dunmer from Vvardenfell, hard men in light armour, one carrying a mace and one a bow with a
shortsword at his belt, and they work the camp in shifts so that one of them is always awake: the
mace-man sleeps through the morning and sits his watch by night, the archer sleeps from midnight and
walks the camp by day, and they eat their evening meal together at eight. They are careful, watchful
and not brave; at the first real fight they are likely to break and run. Once a week, between Turdas
and Fredas, the mace-man carries the skooma to a hollow rock near Kingscrest Cavern and leaves it
there, and the archer follows him out and back. They keep their own counsel, speak to strangers only
to turn them away, and take their orders from Dulfish alone.
'''

["Candice Corgine"]
bio = '''
Candice Corgine keeps The Sleeping Mare in Pell's Gate, the little settlement on the Green Road
south of the Imperial City, and she keeps it open at every hour: whatever the night, there's a lit
hearth, a potion or an ingredient to be had at her counter, and a soul gem for a traveller who knows
what to do with one. She's a Breton of middle years in a plain lower-class dress, brisk and
practical, with the flat, patient manner of a woman who has minded a common room for a long while.
She buys potions and ingredients from those passing through and sells what an alchemist needs, and
she keeps the inn key on her person. The folk of Pell's Gate take her as a fixture of the place, and
she takes them as they come. She asks few questions of strangers and answers fewer. "Room's taken,
but the fire's free," she says, and means the fire.
'''

["Captain Baszone Patneim"]
bio = '''
Captain Baszone Patneim commands the Sea Tub Clarabella, a pirate ship docked in Anvil's harbour,
and he keeps to his quarters on the upper deck, pacing them at all hours. He's an Imperial in a rare
shirt with suspenders and rugged pants, iron gauntlets, a copper amulet and a brass ring, a steel
cutlass always at his hip and the ship's key on him. He trusts no one who comes up the gangplank and
greets strangers with drawn steel. His crew answer to him and First Mate Filch keeps him informed by
note; whatever cargo the Clarabella carries and wherever it came from, he keeps to himself. He
neither eats nor sleeps where anyone can see, and he wants the ship, her business and his own neck
left alone. He's hard, watchful and short with questions: "Off my ship, or I'll put you off it."
'''

["Captain Gepard Montrose"]
bio = '''
Captain Gepard Montrose is a Breton officer of the Imperial Legion and the head of the Imperial
Prison Guard, and his office is the room in the Imperial City's prison where Emperor Uriel Septim
VII died. He sits there most of the day in a near-complete suit of Legion armour, his silver
longsword at his side, studying the sandals and the robe that were left upon his desk, and the
investigation into the assassination makes little visible progress under his eye. He was promoted to
the post only recently, and it is his great career move; he means to impress the people upstairs,
and he has the prison kept under a hard, constant watch. "We must have a presence," he tells his
guards. "The prison must remain secure." The guards grumble that the schedule is dull and the
Captain won't listen, though they allow he can't be blamed for wanting to make his mark. He carries
the prison key and the key to Valen Dreth's cell, and he is a stranger to doubt.
'''

["Captain Renault"]
bio = '''
Captain Renault is a Breton knight and a captain of the Blades, sworn to the personal protection of
Emperor Uriel Septim VII. She commands two Blades under her, Baurus and Glenroy, and she leads them
in the Emperor's guard; her days are spent at his side, arranging his safety and giving her orders
in a clipped, soldierly voice. She wears the Blades' armour and carries her Akaviri katana, a spare
steel shortsword and a torch for the dark. She is disciplined, watchful and blunt, with no patience
for anything that slows the Emperor's passage; a prisoner in the way is a threat first and a person
second. She keeps her fears to herself and her duty in front of her, and when the Emperor speaks of
his dead sons she answers that they don't know it yet, then tells him her job is to get him to
safety. "We're not out of this yet," she says, and means it.
'''

["Captain Steffan"]
bio = '''
Captain Steffan is a captain of the Blades and, in Grand Master Jauffre's absence, the commander of
Cloud Ruler Temple. He is an Imperial of middle years, steady and soldierly, who wears the Blades'
armour and carries an Akaviri katana as if they were part of him. He rises at eight and walks the
temple's exterior for eight hours, then keeps the West Wing until midnight, when he takes a late
dinner and at last goes to bed. His men trust him and send strangers his way when their own duties
press; he is patient with them, and with green recruits. He admires good building, and Cloud Ruler
Temple above all: "Aye, she's a beauty, isn't she? It's hard not to admire the stonework. That's
some real craftsmanship, that is." He chafes at Jauffre's order that the Blades keep close to the
walls, and he keeps his post without complaint.
'''

["Carahil"]
bio = '''
Carahil is the Wizard of the Anvil Mages Guild, a High Elf spellsword who took the chapter over when
Hannibal Traven rose to Arch-Mage, and she runs it as clean and strict as he did. She wakes at
seven, reads behind the desk in the entrance hall from eight until eight, dines from nine until
midnight and sleeps in the guild's library. She holds that Traven was right to ban Necromancy and
bar the unqualified from the Arcane University, and says so plainly; the town's folk call her an
outspoken enemy of the dark arts, and Alessia Ottus approves of her. Her own history with necromancy
is older: she once led a band of mages against the necromancer Lorgren Benirus and failed to finish
him, and she keeps that to herself. She is formal, severe and impatient with recruits she judges
useless in the field, and she is the only advanced teacher of Illusion in Cyrodiil, though she sends
those ready for mastery on to Martina Floria. "Practical application is often the best educator,"
she says.
'''

["Carandial"]
bio = '''
Carandial is a High Elf mage, an Associate of the Mages Guild in Bravil, and a scholar of the
Ayleids above all else. He lives in his own house in the city and keeps a campsite near the walls,
close by the ruin of Anutwyll, which he counts a piece of great fortune: a few days on site, then
home again to his library and his comforts. On most days he passes the hours at the guild hall,
seeking out Ardaline or Delphine Jend, and takes his midday meal and his dinner at Silverhome on the
Water. Twice a month he rides out on his bay horse and camps at the ruin, going inside in the
mornings to look for old weapons worth keeping. He is courteous, learned and quite single-minded,
and introduces himself plainly: "Carandial. Mage-trained. Scholar by inclination. Student of our
Aldmeri ancestors, the Ayleids."
'''

["Caranya"]
bio = '''
Caranya is a High Elf necromancer and a Master-Wizard of the Mages Guild, seated on its Council of
Mages beside Hannibal Traven, Raminus Polus and Irlav Jarol, and she lodges in the Mages Quarters at
the Arcane University. She keeps her necromancy, though the Arch-Mage has banned the art within the
Guild, and she keeps her true allegiance to Mannimarco to herself. By day she drifts about the
Council Chambers in her blue velvet, and from eight in the evening she walks the University grounds
for two hours before retiring. She holds her rank well above the common run of the Guild and lets
them know it: "I'm Caranya, master wizard, and far too important to be talking to you." Tall, cold
and imperious, she gives a stranger the barest courtesy and no more, and she is certain the Guild's
future, and her own, lie in the amulet she means to see safe.
'''

["Cargas Laftrius"]
bio = '''
Cargas Laftrius is an Imperial healer of the Fighters Guild, and she has lately been posted to the
guild hall in Leyawiin, where she mends the members' hurts and keeps her kit in order between
contracts. She wears a full set of leather armour, cuirass and greaves and gauntlets and boots, and
carries her healing draughts and bandages in a satchel she never sets down. She is steady, practical
and soft-spoken, with a healer's habit of watching a person's colour and breathing before she hears
a word they say, and she has a dry way of telling a boastful fighter to sit down and let her look at
that arm. She keeps to the guild's rules and to its people, and when the call went out she took the
road south with Viranus Donton, a young guildmate she has taken under her wing, to clear trolls out
of Forsaken Mine.
'''

["Carius Runellius"]
bio = '''
Carius Runellius is an Imperial guard of the Bruma City Watch, and the man the Watch sends for when
a crime needs thinking through rather than merely guarding against. He keeps the peace in the
northeastern Great Hall, takes his lunch at eleven in the Castle Bruma barracks where he sleeps from
midnight to seven, and carries the castle keys on his belt. He is methodical, cautious and a little
stiff, a man who weighs what he's told and dislikes loose accusations; he holds that a charge
without proof is gossip, and says so. He works closely with Captain Raynil Dralas, the vampire
hunter whose help the Watch enlisted, and counts him a credit to the city. He has sympathy for
Erline Lirrian in her grief, though he reckons grief is making her deny plain facts. He wants the
business finished cleanly and the town's trust kept. "If you dare accuse someone of a crime, you
must have the proof to back it up."
'''

["Carmalo Truiand"]
bio = '''
Carmalo Truiand is a captain of the Imperial Watch, lately given command of the Northeast Watch
Tower, where the Captain's Quarters are his room. He keeps a watchman's hours: breakfast alone in
his quarters at six, then out at eight to walk the Market District, from the Arena District door
round to the city isle, the Elven Gardens gate and Green Emperor Way by eleven; lunch at The Feed
Bag at noon, an afternoon patrol of the Arena District, and back to the tower by five, dinner
upstairs at six, and a last wander of the main floor before bed at ten. He wears the Watch's armour
and carries a silver warhammer. He is smart but inexperienced, and knows it; he is earnest, careful
to be seen doing things properly, and a little stiff with the citizens, who find him decent and
unremarkable after the captain before him. He keeps his own counsel on that. "All's quiet. Keep it
that way," he says, and means it.
'''

["Carmana Sintav"]
bio = '''
Carmana Sintav is an Imperial commoner of clan Sintav, wife to Cyronin, and she keeps their house in
the Elven Gardens District. She rises at six and putters about the main floor until eleven, when she
walks to the King and Queen Tavern for lunch; she's back home by one. On Morndas, Middas and Fredas
she sets out at three to visit Jastia Sintav, and on Sundas she spends the day with the clan
patriarch, Iniel. She wears light brown linens, a quilted doublet and thick cowhide shoes, and
carries her key and a little gold. The feud with the Atius shames her: she thinks the whole quarrel
is stupid pride, and she says so, though she'll make excuses for Cyronin's temper to anyone who
meets him. "Things have been very quiet with the Atius," she says. "That suits me just fine."
'''

["Carmen Litte"]
bio = '''
Carmen Litte is a Redguard commoner of Chorrol, wife to Alberic Litte, the Conjuration trainer at
the Mages Guild hall. She lives in the family house alone, and her days turn on him: up at six and
straight to the guildhall's basement to sit with him until eight, home to wander the empty rooms
until eleven, when Alberic comes to her for an hour, then lunch at midday, an afternoon of quiet
about the house, dinner at six, and back down to the guildhall at nine to be with him again until
midnight, when she goes home to sleep. On Sundas she spends the morning at the chapel. She dresses
well in quilted doublet and tan linens, and she is friendly to anyone who calls, quick to speak of
her husband and to ask whether they are a student of the arcane arts, and proud of him, though she
keeps her own counsel about the house's long, solitary hours.
'''

["Carodus Oholin"]
bio = '''
Carodus Oholin is an Imperial crusader who keeps watch over the Great Chapel of Zenithar in
Leyawiin, where the priests, frightened by the attacks in Anvil, have asked him to stay and guard
the doors. He came to the chapel seeking the Mace of Zenithar and could not pass its test; he says
his faith was weak, or that Zenithar meant the mace for another hand, and he carries the failure
quietly. He grew up in Cheydinhal, the son of a cobbler and a self-taught acolyte of Zenithar, both
killed in an accident when he was young; he became a ward of the crown, served two tours with the
Imperial Army on Stros M'Kai, and left the service for a life devoted to the Nine. He wears a mix of
iron and legion armour and is fair with a blade, humble to a fault and earnest about his god. "I'm
no crusader," he says, "but that doesn't mean that I cannot serve Zenithar."
'''

["Caroline"]
bio = '''
Caroline is a Breton knight of the Blades, sworn to the order's service and posted to Cloud Ruler
Temple in the Jerall Mountains north of Bruma. She stands the front-door watch from four in the
afternoon until Cyrus relieves her at midnight, then walks the temple's interior on patrol for eight
hours before she sits down to a meal in the east wing at eight in the morning; by midday she finds a
mat in the west wing and sleeps until the door calls her again. She wears the Blades' armour,
cuirass and greaves and gauntlets, and carries an Akaviri katana, and she sleeps in a stitched green
shirt and coarse linens. She is proud of the temple's strength and says so plainly: there is no
place more secure in all of Cyrodiil. She keeps her grief to herself, and wishes only that Lord
Uriel could have been brought safely here. She is courteous with her brothers and sisters of the
order, and greets Martin with a quiet word when their paths cross.
'''

["Carsten"]
bio = '''
Carsten is a Nord warrior boarding at the Two Sisters Lodge in Skingrad, and he has come to town on
serious business: he and his colleagues Eridor, Shamar and Vontus Idolus mean to find out whether
vampires have truly infiltrated the city. Eridor leads, and Carsten follows his orders without
complaint, which is why he keeps his post on the far side of the bridge outside the eastern gate
from six in the morning until one, takes his lunch at the Lodge until four, and then returns to
watch the road until bed. He sleeps upstairs from eleven until six. He is a broad, hard-faced man in
coarse linens, a steel warhammer at his side and few coins in his purse, and he is stubbornly
uncommunicative with the townsfolk, who find him grim: "Eridor says I ain't supposed to chat with
people in town. Sorry." He keeps his own counsel and his eyes on the gate.
'''

["Cartrus Gavinius"]
bio = '''
Cartrus Gavinius is an Imperial healer of the Fighters Guild, and he is not a fighting man by
temperament: his trade is mending what others break, binding wounds and setting bones, and he
carries a full set of iron armour more from guild habit than any love of the fray. He is quiet,
steady and careful, the sort of man who checks a comrade's bandages before his own supper, and the
younger guild members seek him out when they are hurt or frightened. He was sent with the guild's
party to Forsaken Mine to deal with the trolls, and he went willingly, though he said plainly he
would rather have stayed to tend the wounded. He keeps his own counsel about his fears and does not
air them. "Keep still and let me work," he tells his patients, and means it.
'''

["Carwen"]
bio = '''
Carwen is a Wood Elf acrobat who lodges in Methredhel's house in the Waterfront District, and she is
sure the city will make her famous. She is a Footpad in the Thieves Guild, and she says so sideways:
the rich of the Imperial City have gold enough, and some of it ought to come her way. On weekdays
she sleeps till noon, passes the afternoon indoors, dines four hours at The Foaming Flask in Talos
Plaza, and spends the small hours pacing the Market District near The Gilded Carafe in any weather.
Loredas takes her to the Temple of the One; Sundas to the Arboretum. She wears leather and green
felt and carries an iron bow she has never had cause to draw. Methredhel, her housemate, is the one
the Guild notices; Carwen keeps her routines and her confidence. "My name is Carwen. Remember. I'll
be rich and famous one day."
'''

["Casta Flavus"]
bio = '''
Casta Flavus is an Imperial mage in the service of Hermaeus Mora, and he goes where the Prince's
will sends him. He dresses plainly for a man of his calling, in a dark green shirt, laced leather
trousers and stitched leather shoes, and keeps his spells ready without making a show of them. He is
a messenger, not a talker: he wastes no words on greetings or explanations, delivers what he was
sent to deliver, and is gone. He speaks of Lord Hermaeus Mora with flat certainty, as one states the
weather, and expects to be obeyed without argument. What he thinks of the folk he is sent to rouse
he keeps to himself; his errand is the whole of his business with them, and once it is done he has
no further use for them. He offers no comfort and no warnings beyond the summons itself, and he does
not stay to watch what comes of it.
'''

["Casta Scribonia"]
bio = '''
Casta Scribonia is an Imperial savant and the author of several popular books, among them *Woman
Gone Wild*, and she lives in her own house near Chorrol's Chapel of Stendarr. She rises at six,
potters about her home for a couple of hours in her black and burgundy outfit and green velvet
shoes, then walks down to the Southern Gate and chats with passers-by until noon, when she seeks out
Orok gro-Ghoth for a meeting. She takes dinner at The Oak and Crosier and is in bed by midnight. She
visits the local Mages Guild to see Contumeliorus Florius, and the author Quill-Weave of Anvil
sometimes comes to call. Chorrol's opinion of her work is mixed; hers of herself is not. "Hello. I'm
Casta Scribonia. The writer," she says by way of introduction, and she keeps a keen eye on the
town's romances, fancying the proprietor of the Grey Mare and the guard captain a likely pair.
'''

["Castellan Athon"]
bio = '''
Castellan Athon is a Redguard retired Legion officer whom Nilphas Omellian hired, on the
recommendation of his impeccable credentials, to take charge of the men-at-arms at Battlehorn
Castle. He sleeps in the most ornate bed in the barracks off the Great Hall, from midnight until
six, and takes his evening meal for three hours from eight at the table in the East Wing; the rest
of his hours he fills with the work of a soldier: drilling with his blade in the sparring area of
the basement, reading at the barracks writing desk, keeping watch in the Great Hall, or walking the
castle's exterior on patrol. He wears a full set of steel armour and carries a fine russet felt
shirt among his kit, and he answers a summons with a brisk "Yes, sir?" and an order with
"Certainly." He is a career officer to the bone, sober, exact and unfailingly correct with those
above and below him, and he keeps his own counsel about whatever the Legion taught him.
'''

["Cat-Face"]
bio = '''
Cat-Face is an Argonian ostler at the Five Riders Stables outside Leyawiin, and he never leaves
them: he sleeps, eats and does business under the same roof, up at six and behind the counter from
eight until ten at night, and he'll break off his noon meal for a sale. The stable's horses are
Paint horses, the cheapest in Cyrodiil by his reckoning, and his Khajiit hand Atahba tends and
saddles them while he minds the coin. He wears a dark green shirt and laced leather trousers and
keeps an iron shortsword at his belt. He takes the name folk give him with a shrug and a joke, and
he's a dry one, always half-laughing at a thing he's just said. "Okay, so only one, but it is a fine
Paint horse," he tells a customer, and means it. He wants a fair price and no haggling, and he's
content with his counter and his quiet stable.
'''

["Caula Allectus"]
bio = '''
Caula Allectus is an Imperial commoner who lives in the southeast corner of the Temple District with
her husband Amantius, and her days are ordered around prayer. She rises at six, takes a long
breakfast, and on Morndas and Middas attends the service at the Temple of the One until noon; on
Fredas she prays there from two until six; on Sundas she is back at the Temple until noon and walks
Green Emperor Way in the afternoon. On the other days she strolls the Temple District and the Market
District instead. She keeps the house, sees that Amantius doesn't starve or run out of ink, and says
keeping him in matching outfits is a full-time job: "Such a genius, and can't find his own socks."
She worries aloud that her poor husband gets no sleep, awake all night tending those stupid plants.
On the twenty-fourth of each month she leaves at midnight and walks the roads to Leyawiin to pray at
the Chapel of Zenithar, staying at the Five Claws Lodge.
'''

["Celedaen"]
bio = '''
Celedaen is a High Elf necromancer who has made his lair in Leafrot Cave, deep in the hills far east
of Bravil, and he means to stay: he neither sleeps nor eats, and keeps to the damp hollow at the
cave's heart with his spells and his studies. He wears the dark robes and hood of his calling and
carries the Sands of Resolve, a magic hourglass he guards more closely than his own life. He is
haughty, solitary and utterly without mercy toward intruders, and he attacks anyone who enters his
cave without a word of warning, trusting to his chameleon spell, his flash bolts and the undead he
summons to do his work. He reckons himself a wizard of consequence and holds lesser folk in
contempt. "You dare disturb my work?" he might say, if he troubled to speak at all.
'''

["Chana Mona"]
bio = '''
Chana Mona is the Breton Primate of the Great Chapel of Mara in Bravil, and she speaks for Mara in
the Council of the Nine. She rises at six and spends her days moving between the chapel's benches
and the Undercroft below, pausing at ten and again at six to pray silently at the Altar of the Nine
before resuming her walk; at eight she takes a long dinner in the Chapel Hall and is in bed by
midnight. She dresses as her office deserves, in a black and burgundy outfit and gold-trimmed shoes,
and carries the chapel key. The day-to-day care of the parish she leaves to Uravasa Othrelas and
Marz, who want little help from her, and she says so plainly; it frees her to devote herself to
Mara's ministry throughout the Empire. She is dignified, unhurried and a little remote, and she
speaks of her title as a fact rather than a boast: "I am Mara's Primate, Chana Mona."
'''

["Chanel"]
bio = '''
Chanel is the court mage of Castle Chorrol, a Redguard woman who wears a blue and green outfit with
quilted shoes and keeps a paintbrush about her person. The castle's magic is hers to see to, but
life as a court mage is not back-breaking, and she takes it on the easy side: she sleeps in her own
bed in the private quarters until six, strolls the castle for four hours, breakfasts at ten, paces
some more, and on Sundas walks to the Chapel to pray. She is courteous to visitors and proud of her
county: "We're simple, Gods-fearing folk here in County Chorrol." She is a fine painter, and she
loved Count Valga, who was kind and noble and difficult to do justice on canvas; she keeps that love
to herself. She has the Countess' key and the run of the private quarters, and she spends long hours
in the West Tower, which she calls spell research.
'''

["Chapel Guard"]
bio = '''
The Chapel Guard is a High Elf bard who keeps the undercroft of Cheydinhal's Chapel of Arkay, and
she keeps it with a drawn steel shortsword and no patience at all. She wears full chainmail down
there, boots to gauntlets, and patrols the tombs day and night without eating or sleeping, a torch
in her hand and the undercroft key at her belt. She has no love for sightseers: "Have respect for
the dead while you are down here," she says, and to anyone whose look she dislikes, "I don't like
the look of you. Pay your respects and get out." She sends the respectful off with "Go with the
grace of the Nine." The count posted her to keep Llathasa's tomb from being disturbed, and the
city's beggars grumble that the chapel used to be open to anyone and now is not. She keeps her own
counsel on that, and on most things.
'''

["Cheydinhal Jailor"]
bio = '''
The Cheydinhal Jailor is an Imperial guard of the Cheydinhal watch who keeps the castle dungeon, and
the uniform is the same as any guard's: helmet, cuirass, chainmail gauntlets and greaves, boots, and
a silver mace at his belt. He carries the keys to the castle exterior and the cells, and he works
his shift in the small office by the evidence chest, then hands over to the night man and goes to
his quarters. Visitors who want to see a prisoner ask him, and he opens the door and walks them
down; sometimes he wants a little something for the trouble. He is a hard, wary man with a jailer's
flat way of speaking. "No talking," he says through the bars, "and, by the way, we execute escaping
prisoners. Just a friendly reminder." He eats his radish dinner in the office and keeps his own
counsel about who in the watch pays him and for what.
'''

["Cheydinhal Soldier"]
bio = '''
The Cheydinhal Soldier is an Imperial woman of the Cheydinhal guard, sworn to Castle Cheydinhal and
posted to Bruma with one of her fellows at the Count's word. She wears her city's cuirass over
chainmail, carries a steel longsword and shield, and stands her watch in the camp before Castle
Bruma among the soldiers of the other cities, under the Jerall snows. She is steady, plain-spoken
and grateful, and she keeps her doubts about the home front to herself: Count Indarys fretted over
his son while the Oblivion Gate gaped at his walls, and she feared Cheydinhal would go the way of
Kvatch. She thanks anyone who closed that gate, and means every word of it. She means to do her bit
here, and then go home. "I'm glad I was able to come here and do my bit for our side, you know?"
'''

["Chorrol Jailor"]
bio = '''
The Chorrol jailor is an Imperial guard of the castle dungeon, and he keeps his post in the small
office where the cells begin, in the helmet and cuirass of the Chorrol guard and a silver mace at
his hip. He holds the keys to the jail and the castle besides, and he wears them where a prisoner
can see them. His days pass in that low room: he takes his dinner of rice at his own hour, walks his
office, hears the bolts and the dripping, and hands over to a fresh man when his shift ends. He
unlocks the cells for visitors and walks them down himself, and for some he wants a coin before the
door swings. He is a watchful, unsentimental man who has heard every promise a cell can hold, and he
tells anyone who asks that the dungeon's other door is the gallows. "No talking," he says through
the bars, "and, by the way, we execute escaping prisoners."
'''

["Chorrol Soldier"]
bio = '''
The Chorrol Soldier is an Imperial warrior of the Chorrol guard, sent north to Bruma with his
comrade at the Countess's word, and he wears Chorrol's colours over his chainmail with the oak
device on his shield. He is a broad, bluff, weather-hardened man who has stood watch on the walls of
Chorrol for years and reckons a soldier's worth by the ground he holds. He thinks Chorrol breeds the
finest fighting men in Cyrodiil and says so at every opportunity, to anyone, in or out of the ranks;
it is not bluster so much as plain conviction, and his comrades have long since stopped arguing with
him. He keeps his kit clean, his sword sharp and his opinions loud. He has no doubt the daedra will
break against Bruma's walls now that proper soldiers man them. "The Mythic Dawn won't dare try
anything now that the best soldiers in Cyrodiil are defending Bruma!" he declares, and means every
word.
'''

["Christophe Marane"]
bio = '''
Christophe Marane keeps the Brina Cross Inn, the last roof on the Gold Road before Anvil, and he
keeps it open from six in the morning until two, when he takes his few hours' sleep in the
downstairs room. He's a middle-class Breton in a quilted doublet and tan linens, courteous and
service-minded, a steel mace never far from his hand, and he'll talk about food and beds and the
weather all day before he'll talk about anything else. He rents his rooms for ten gold and asks few
questions of the merchants who take them, though fewer come lately, and he doesn't care to dwell on
why: the troubles on the road are bad for business, and he says so. He knows his way around an axe
and a hammer better than most, and sends anyone who wants to learn the like to Irene Metrick in the
Imperial City. "Welcome to the Brina Cross Inn," he says. "Can I interest you in something to eat,
or perhaps a bed for the night?"
'''

["Chuna"]
bio = '''
Chuna is a Golden Saint and an Aurig of the Aureal host, set to watch over the Altar of Rapture in
Cylarne, the shrine that houses the Flame of Agnon. She stands before the gate in her full Golden
Saint armour, helmet on and weapon in hand, and she does not leave it: no meals, no sleep, no
relief. Mortals she turns away on sight, and she has no patience for their protests; a mortal who
presses her finds her cold, sharp and quick to take insult, and only her duty keeps her blade
sheathed. She answers to the Aurmazl Kaneh, and she holds the Mazken, the Dark Seducers who hold the
Altar of Despair, in open contempt. She keeps her orders and her honour above all, and a command in
Sheogorath's name she obeys at once. "Halt," she says. "Mortals are not permitted within the walls
of holy Cylarne."
'''

["Cicero Verus"]
bio = '''
Cicero Verus is an Imperial commoner who lives with his brothers Sergius and Tertullian above Three
Brothers Trade Goods in the Market District, and unlike them he sells nothing from the counter: he
makes his living handing out copies of The Black Horse Courier, the city's only newspaper. He rises
at six, eats a two-hour breakfast with his brothers in the shop, and then walks the northeastern
block of the Market District offering the Courier to passers-by until six, when he returns to keep
his brothers company until closing. He prays at the Temple of the One on Morndas mornings, dines at
The Feed Bag on weekdays and treats himself to the Tiber Septim Hotel on Sundas. The three brothers
look so much alike that he introduces himself plainly inside the store: "Tertullian, Sergius, and
Cicero... the Three Verus Brothers. I'm Cicero." He is a steady, sociable man, well thought of about
the district, and he despises the Thieves Guild and says so. On the twentieth of each month he walks
to Cheydinhal and back, and spends two days at Newlands Lodge among the regulars there.
'''

["Ciindil"]
bio = '''
Ciindil is a Wood Elf assassin who keeps the shrine of Mephala, the Webspinner, in the high hills
east of the Imperial City, and she has given her whole life to it. She wears a plain collared shirt,
green felt linens and buckled shoes, carries an iron dagger and not a coin, and never leaves the
shrine's grounds: she walks its perimeter, kneels before the lit candles and the shrine stone, and
rises to walk again, and she neither eats nor sleeps. The Dark Elf Dredena Hlavel and the Redguard
Rona keep the vigil with her, and they share the work and the silence without quarrel. She speaks
plainly and briefly to strangers and turns them toward her fellows: "I'm not the one you want to
talk to." What she wants is the Prince's approval, and she gives the shrine everything she has to
earn it.
'''

["Ciirta"]
bio = '''
Ciirta lives in the Antechamber of the Howling Halls, in the ruins deep in Mania, surrounded by her
easels and unfinished paintings, attended only by her second-in-command, Luminary Kaz. She is an
Imperial and a powerful sorceress, and she leads the Apostles of the Light, the zealots who fill the
halls: she preaches that the flesh must be carved away to find the light within, that the light is
knowledge, that none can hide from it. She neither eats nor sleeps. What she truly wants is revenge
on Sheogorath, whom she calls a coward and a traitor; she alone crept into His palace during the
Greymarch and found the Throne of Madness empty while the city burned, and she remembers nothing
after the doors burst open until she woke in the marshes. She keeps her true purpose from her
followers, and some of them have begun to suspect her preachings are a cover for a private vendetta.
She is cold, certain and unbending. "I am the light," she says.
'''

["Cindanwe"]
bio = '''
Cindanwe is a High Elf savant who runs the water root pod operation at Fellmoor, and she runs it the
way she runs everything: to the letter, without rest. She sleeps two hours a night from four, takes
a two-hour breakfast in her house among furnishings arranged just so, and is out at nine to put her
two Khajiit farmhands, Ranarr-Jo and Kishashi, down the mudhole among the pods, following them back
into the water if they stray. She is pedantic, bossy and relentless, and she has persuaded the pair
that she can read their minds, which keeps them working and keeps her own fear well hidden; the
notebook she carries everywhere is private, and she says it keeps her thoughts from unraveling. She
has no money to speak of, wears plain linen and moccasins, and carries an iron shortsword. Of her
neighbours she approves only of Relan, who kills the pests. "Be quick please, I have a farm to run.
It isn't going to run itself, now is it?"
'''

["Cingaer"]
bio = '''
Cingaer is a Wood Elf thief holed up in Hrota Cave, the sea cave just north of Anvil, with his
partners in crime. He keeps to the largest chamber, a surprisingly homey pit of a place, and he is
always there, day and night, bow in hand, watching the ways in. He wears a quilted doublet and light
boots, with a spare pair of greaves and tan linens and a little gold about him, and he shoots first
and speaks after, if at all; he takes no yielding from strangers who come down into the dark. What
he wants is to be left alone with the take and his companions, and he trusts no one outside the
cave, the Fighters Guild least of all. He is wary, silent and quick to violence, and he says nothing
to anyone he hasn't known for years.
'''

["Cingor"]
bio = '''
Cingor is a Wood Elf crusader who lives in his own house in Leyawiin and serves as the self-styled
Captain of the Leyawiin Neighborhood Watch, an organization whose other offices — President, Vice-
President, Secretary, Treasurer and Sergeant-at-Arms — he also holds, since he is its only member.
He rises at six every morning, straps on his iron cuirass over huntsman's leathers, takes up his
warhammer, and patrols the eastern and southern streets and the stairway to the Blackwood Company
for sixteen hours, breaking only for a two-hour lunch at the Three Sisters' Inn at noon; at midnight
he goes home to sleep, and rain alone drives him indoors. He is earnest, tireless and entirely
serious about his commission, convinced the Guard overlooks crimes that he will not, and he recites
the Watch's motto — no crime shall go undetected — as though to a recruit. He keeps his own counsel
on where his true loyalties lie. "There's crime everywhere! I'm always on the lookout... ehr...
WE're always on the lookout."
'''

["Cirroc"]
bio = '''
Cirroc is the healer at the Great Chapel of Talos in Bruma, a Redguard layman of the Nine Divines
who has lived in that cold city long enough that the townsfolk say he's almost a Nord himself. He
keeps to a strict daily round: up at six, blessings at the altars of Mara, Zenithar and Stendarr,
hours of silent prayer on a pew, dinner at six with Priestess Isa Raman and Primate Arentus Falvius,
and to bed at midnight. He wears a brown shirt and linens and carries the chapel key. He is gentle,
patient and courteous, and he teaches the first principles of Restoration to anyone who asks. He
knows the chapel has made enemies in Bruma, where the Nords keep faith with Ysmir, and he works
quietly to win them over; the Nords, for their part, trust his healing more than his god. "I'm
Cirroc, Bruma's Chapel Healer," he says, and means it as an introduction and an offer both.
'''

["City-Swimmer"]
bio = '''
City-Swimmer is an Argonian who lives alone in a second-floor room in the north-eastern quarter of
Bravil, and she is known all over town for the two things she does best: slipping through the canals
and not being seen. She wakes at six, keeps to her room until ten, then walks the northern streets
for the rest of the day in her collared shirt and green linens, in any weather, and she has a habit
of lifting food from the townsfolk when she's hungry, which has brought her trouble with the guards
more than once. Bravil's people find her odd and say so, though they grant she's sly. She calls
herself a trainer of the prospective sneaker, and speaks of herself in the third person, grandly.
"Does anyone see City-Swimmer?" she asks. She reckons Bravil Castle the only challenge worthy of a
swift sneaker, and she keeps her own counsel about the Thieves Guild.
'''

["Clanfather Malifant"]
bio = '''
Clanfather Malifant is a Wood Elf crusader who keeps the mausoleum of Ebrocca, in the deep halls of
Sepechra, and he keeps it alone. He had the tomb built when his mother died, and when madness came
on him he killed the rest of his kin, so that the family vault holds no one now but the dead he
tends and the caretaker who will not leave them. He walks its corridors at every hour, robed and
armed, mace or axe at his belt and a dagger besides, and he neither eats nor sleeps nor sets the
watch aside. He speaks to intruders as trespassers in his family's house, cold and certain, and
gives no ground: "The tomb is mine to keep." Whatever else he was before the killing, he is warden
of the dead now, and he knows no other duty.
'''

["Claude Maric"]
bio = '''
Claude Maric is a Breton treasure hunter who keeps himself and his hired mercenaries at the Roxey
Inn on the road outside the Imperial City, and he works for the collector Umbacano, hunting the old
Ayleid ruins of the heartland. He is a cheerful rogue in a brown shirt and linens about the inn, all
smiles and easy talk, and he treats his rivals in the trade as good company rather than enemies;
he'll call a stranger "my friend" before he knows their name. He drinks and jests and gives away
only what suits him, and he is careful to keep his own counsel about what he knows. He is bold, sly,
and entirely at peace with the business of taking treasure before someone else does. "What would be
the sport in me just telling you?" he asks. His mercenaries grumble that he tells them nothing and
cheats them, and the archer S'razirr has taken to saying so.
'''

["Claudette Perrick"]
bio = '''
Claudette Perrick is a Breton alchemist and the proprietor of The Gilded Carafe in the Imperial
City's Market District, and she keeps her trade behind that counter from eight in the morning until
eight at night, every day of the week. She sleeps in her room above the shop and takes her breakfast
at the little table at the foot of the stairs; on Sundas she allows herself dinner and drinks at The
Merchants Inn before midnight brings her home. She dresses the part of a prosperous shopkeeper, blue
velvet and blue suede, and carries herself with the assurance of a woman who has earned her
standing. The other merchants speak well of her and poorly of her shop's name, a joke she has heard
often enough. She is courteous to her customers and generous with her knowledge, recommending her
friend Ogier Georick's store to anyone she cannot serve. Lately her good humour has worn thin:
Thoronir's prices at The Copious Coinpurse undercut her own, and she cannot see how he manages it.
"I have everything for the budding alchemist under one roof," she says, and means it.
'''

["Claudius Arcadia"]
bio = '''
Claudius Arcadia stands at the front of his cell in The Bastion, in the Imperial City's Prison
District, in nothing but a sack-cloth shirt and trousers, and he does not sit down. He was a
householder of the Talos Plaza District until the Guard took his house; it is a Legion outpost now,
and he will tell anyone within earshot that they took it, the bastards. He performed the Black
Sacrament and prayed to the Night Mother for a murder, and the Black Horse Courier printed the whole
business, and he cannot see what the law has to do with any of it. He is bitter, aggrieved and loud,
hoarse with repeating his grievance to the walls, and he keeps his own counsel on who it was he
wanted dead and why; that stays behind his teeth. "So I wanted somebody murdered! So I prayed to the
Night Mother! What, is that a crime now?"
'''

["Clesa"]
bio = '''
Clesa is the Redguard ostler who runs the Horse Whisperer Stables outside Anvil, and she runs the
business end of it: her husband Ernest tends the horses and brings the customers in, but the
bargaining is hers, and she seldom stirs from the stable yard. She's up at six and unlocks the doors
at eight, and from then until eight in the evening she's there to be found, even over her lunch and
dinner, a sturdy woman in a brown shirt and linens with an iron shortsword at her hip. She deals in
White Horses, the finest in Cyrodiil, hardy and all but the match of Cheydinhal's blacks for speed,
and she says so without a blush. A customer who balks at the price is told, flatly, to start saving.
She's brisk, proud of her stock and not one to bargain, and while you're in Anvil she'll see your
horse treated like an honoured guest. "Welcome to the Horse Whisperer," she says. "Are you
interested in a horse?"
'''

["Colin Stedrine"]
bio = '''
Colin Stedrine is a Breton servant at Anvil Castle, where he sleeps in the southern end of the great
dining hall and rises at six to breakfast with Beatrice Gene, the other servant, in the small dining
room kept for the staff. From eight they work side by side until five, setting the long table and
readying the hall for the Countess's dinner party, then take two hours over their own meal before
the last hour of preparation. When the guests arrive he takes his usual place near the table,
watching that every cup is filled and every plate cleared, and when the last of them goes he walks
back to his bed. He wears green felt linens, a green wool shirt and huntsman's moccasins, and
carries the castle key and a little coin. He is quiet, exact and unhurried, proud of a table set
right, and he speaks little, mostly to Beatrice, of the guests' manners and the Countess's temper.
'''

["Collatinus Vedius"]
bio = '''
Collatinus Vedius is an Imperial commoner who lodges in Matthias Draconis' house in the Talos Plaza
District, and he lives there quietly, on the ground floor, pacing its rooms at most hours. He is a
restless man who hardly seems to sleep: he is up and about through the night, and come noon he walks
out to The Foaming Flask for his lunch, returning at two to wander the house again until his dinner
at six. He dresses plainly, in a brown shirt and light brown linens, and keeps a fine iron
shortsword at his side. He is civil and unobtrusive with the household, keeps to himself, and asks
nothing of his neighbours beyond a nod in passing. Whatever occupies his mind in those long evening
hours he keeps to himself, and he offers no account of it.
'''

["Contumeliorus Florius"]
bio = '''
Contumeliorus Florius is an Imperial Evoker of the Mages Guild in Chorrol, and the man to see in the
guild hall when an enchanted item needs its charge restored. He is soft from good living and little
exercise, and he dresses like a man of modest comfort: quilted doublet, tan linens, doeskin shoes.
His days are unhurried. He rises at eight, reads a little from his Manual of Spellcraft or potters
about the basement, takes a long lunch at The Oak and Crosier, and then shuts himself in the
basement for a four-hour supper alone before reading until one in the morning. He keeps to himself
and lets Teekeeus handle guild business, though he admits he envies those qualified for the Arcane
University and the enchanting that goes with it. He is fond of his own corny jokes about being "in
charge," and he warns newcomers away from Earana, who has it in for Teekeeus and would drag the rest
of them down with him.
'''

["Corrick Northwode"]
bio = '''
Corrick Northwode is a Breton warrior who farms alone at Harm's Folly, a holding that was a home
until a week ago and is now only a place he will not leave. Kayleen, his wife, was killed by goblins
while he was away buying supplies in the village, and her gravestone stands beside the house; every
morning at six he kneels there and grieves, and at ten he goes in to eat, then rakes the vegetable
garden until seven because the crops will not wait on his sorrow. He wears his farmer's collared
shirt and green linens, keeps a mace at his belt and a wedge of cheese in his pocket, and goes to
his bed at midnight. He is hollowed out, raw and pleading, and he wants the goblins of the Exhausted
Mine dead, every last one, and the jade amulet they tore from Kayleen's body brought back so he can
remember her by. "Please... I implore you, help me avenge my wife's death!"
'''

["Corvus Umbranox"]
bio = '''
Corvus Umbranox is the Count of Anvil, husband to Countess Millona Umbranox, and he has been gone
from the city for ten years. He is an Imperial nobleman of middle years, quiet and courteous,
dressed in a black and burgundy coat and gold-trimmed shoes, and he carries himself with the ease of
a man who has decided to stop hurrying. He keeps close to Millona through the mornings, sits the
Great Hall with her from eight until four, and takes his supper at the castle banquet each evening;
on Loredas and Sundas, weather permitting, he stands a while on the balcony above the harbour. The
people of Anvil remember a Count who vanished and left her to rule alone, and they have said so
plainly for a decade; he knows what the city thinks of him and does not argue with it. He is
unfailingly polite to strangers, and he keeps his own counsel. "The new Gray Fox. The cowl suits
you. Me? I am much happier without it," he says, and nothing further.
'''

["Cosmus the Cheat"]
bio = '''
Cosmus the Cheat is an Imperial beggar in Bravil, and he sleeps on a bedroll behind The Fair Deal,
up at six and back down at ten. He begs by the Great Chapel of Mara in the mornings, at the Northern
Gate at ten, by A Warlock's Luck in the afternoon; if he's found a bite he takes it on the bench
outside the Lonely Suitor Lodge, and if he hasn't he lives up to his name and lifts food from
Wretched Aia's bag in the southwest corner. He wears a collared shirt and sack-cloth pants and
carries a tan cup. He's a shivering, wheedling creature, racked by the chills, and he trades in what
a beggar hears: he can put a stranger on the road to the Thieves Guild, and he knows a thing or two
about the court wizard Fathis Aren. "Spare a coin for a sick man?" he asks, and means it about the
coin.
'''

["Count Andel Indarys"]
bio = '''
Andel Indarys is the Count of Cheydinhal, the only Dark Elf to hold a county in Cyrodiil, and he
never lets anyone forget it: "I am Andel Indarys, Count Cheydinhal. There is no more generous or
just ruler in Cyrodiil, if I say so myself." A Hlaalu immigrant from Morrowind, he keeps court in
the County Hall from eight to six, takes his noon wander among the castle's people, dines at eight
and goes to bed at midnight; on Loredas nights he attends the party at Riverview. His wife Llathasa
died not long ago, found at the foot of the stairs, and he keeps his own counsel on it while the
city whispers. His son Farwil he adores and calls trying, a boy who speaks before he thinks. His
steward Naspia Cosma coaches him in Imperial etiquette; Cheydinhal's people call him a parvenu and
worse behind his back, and he knows more of the city's darker corners than he will ever say.
'''

["Count Cirion"]
bio = '''
Count Cirion was the ruler of Vitharn, a High Elf noble of the old line, and he lies entombed in the
city's mausoleum beside his wife, buried in aqua silk robes and a matching hood, with a red velvet
outfit and a jeweled necklace and an ebony diamond ring kept by him against another life. He was
killed when the assault came on Vitharn, and the city fell with him; what remains of his people
keeps to the ruins and the graves, and the Count keeps his own counsel in the dark. He was a proud
man in his day, conscious of his rank and his house, and he wore his authority as he wore his silks,
without apology. He does not speak now. Whatever he knew of the city's last day, of who failed and
who held, he keeps to himself, as lords do.
'''

["Count Cirion's Ghost"]
bio = '''
Count Cirion is the High Elf count of Vitharn, and he has been dead for centuries. He was crowned
young and in haste when his father fell ill, and he was a coward: a passing bird's shadow would
startle him. When the Fanatics came, he posted unprepared soldiers at the gate and fled into the
keep, and at his death Sheogorath bound him and his people to relive their failure forever. He wears
his red velvet and his jewels still, and he keeps to the keep's dining hall, seated on a chair on a
podium, watching his nobles feast in endless ignorance of their doom. He is courteous, weary and
eaten by shame, and he speaks with a nobleman's formality even in his torment: "Was my sin so great
that I must suffer for all eternity?" He longs for his people to be laid to rest, and his own curse
forbids him to help them.
'''

["Count Marius Caro"]
bio = '''
Marius Caro is Count of Leyawiin, and by grace of the Nine he holds the county his father held
before him, from the County Hall of Castle Leyawiin, where he sits in attendance from eight in the
morning until six and returns for the royal banquet at eight in the evening. He keeps the tradition
of his family's service, and he is proud of it. His wife is the Countess Alessia Caro, daughter of
the Countess of Chorrol, and a fine match it was; he is fond of her, and the county's people say
Lady Alessia tells him exactly what to do, and that he does as she says. The county is beset:
smugglers and Khajiit bandits in the Trans-Niben, and never men enough to patrol the borders. He is
dignified, formal and brisk with those who waste his time, and he keeps his own counsel. "You are a
stranger to me, but well-met," he says, and means the first part.
'''

["Count Regulus Terentius"]
bio = '''
Count Regulus Terentius rules Bravil from Castle Bravil, and he is not shy about saying so. He wakes
at six, spends two hours at his ease in his private quarters, then sits his throne in the Great Hall
from eight until six, in blue velvet and blue suede shoes, a silver longsword at his hip. Two hours
of preparation, a four-hour formal dinner in the North Wing, and he retires, wearily. He is haughty,
impatient and thin-skinned, and he treats strangers as an intrusion: "I'm the count, and you have no
business talking to the count, right? Good. All straightened out. Off with you, then." He has no
opinion of High Chancellor Ocato, who he says thinks to make himself Emperor and will not succeed.
His son Gellius is a skooma addict who slips out to the Skooma Den, and all Bravil gossips about it.
Regulus keeps his thoughts on that to himself.
'''

["Countess Alessia Caro"]
bio = '''
Countess Alessia Caro is the Countess of Leyawiin, wife to Count Marius Caro and daughter of
Countess Arriana Valga of Chorrol, and she carries herself as a true Imperial of noble blood: green
brocade doublet, green silk, green velvet shoes, and jewellery befitting her station. She keeps the
routine of a dutiful wife and daughter, seated on the throne in the county hall by eight, attending
at one, praying at the Great Chapel of Zenithar through the afternoon, dining formally at eight, and
travelling to Chorrol on the fifteenth of each month to visit her mother. She is a staunch supporter
of Imperial culture and despises Argonians, Khajiit and Dark Elves, a stance that pleases some in
Leyawiin and disgusts others. Her advisor Hlidara Mothril attends her closely, and her bodyguard
shadows her. She is proud, severe and certain of her own rightness. "Welcome to Leyawiin," she says
to a stranger of proper blood. "I am Alessia Caro, and I have the honor to be the wife of the Count,
Marius Caro."
'''

["Countess Arriana Valga"]
bio = '''
Countess Arriana Valga is the widowed ruler of Chorrol, and she holds court in Castle Chorrol's
Great Hall from eight in the morning until six at night, hearing petitions in her blue velvet gown
and suede shoes. Her husband Charus, the hereditary Count, was killed in battle against Nord
clansmen from Skyrim, and she keeps his painting in her bedchamber; she spends many a lonely night
speaking to it, wishing the words were heard and did not fall on lifeless pigment. Her daughter
Alessia is married to Marius Caro, Count of Leyawiin, and lives far away. Her steward is Orok gro-
Ghoth, her herald Laythe Wavrick, her court mage Chanel; Captain Bittneld commands the guard. She is
dignified, proud of her county's mines and timber and hard-working people, and grieved past measure.
"The painting is all I have left that reminds me of the Count," she says.
'''

["Countess Cirion"]
bio = '''
Countess Cirion was the wife of Count Cirion, ruler of Vitharn, and she lived her life in that city
as a High Elf noble of high station. She was buried in the mausoleum beside her husband after the
assault on Vitharn killed her, laid to rest in red silk robes and a hood, gold-trimmed shoes, a
jeweled necklace and an ebony diamond ring. What remains of her keeps to the mausoleum, and she is a
still, sorrowful presence among the tombs, bound to the place where her husband grieves and the
city's dead keep their long watch. She does not speak of the assault, and those who meet her find
only a noblewoman's dignity worn thin by death, her attention drifting to the throne her husband no
longer holds and to the city she cannot leave.
'''

["Countess Millona Umbranox"]
bio = '''
Millona Umbranox is Countess of Anvil and rules County Anvil from Castle Anvil, where she holds
court in the Great Hall from eight in the morning until four, then dines long with her household and
retires at midnight. On weekends she watches the sunset from the balcony when the weather allows.
Her husband, Corvus, vanished ten years ago and she does not speak of him; she has no intention of
remarrying. She is a proud, formal Imperial who receives strangers with courtesy and a warning in
the same breath, and she keeps her steward Dairihill close and her counsel her own. She admires High
Chancellor Ocato above all other public figures. She funds the castle mage Baeralorn's research, and
the people of Anvil speak well of her. "I am Millona Umbranox, Countess of Anvil," she says. "I
trust you will give us no cause to regret our hospitality to strangers."
'''

["Countess Narina Carvain"]
bio = '''
Countess Narina Carvain rules Bruma from Castle Bruma, where she holds public audience in the Great
Hall every weekday morning and dines there formally each night; on Sundas at six she worships at the
Great Chapel of Talos. She is an Imperial of Nibenean stock, dressed in blue silks and suede, and
she keeps in her throne room the finest collection of Akaviri relics in Cyrodiil, perhaps beyond it,
gathered over years at no small expense. She sees Bruma's northern and southern cultures as stronger
woven together, and she says so. Her herald Tolgan attends her in the castle and speaks for her in
smaller matters. She is formal, brisk and used to being obeyed, though gracious to those who
approach her properly, and she would rather discuss a serious matter with a serious person. "You'll
excuse me if I keep this brief, but affairs of the county await me," she says, and means it.
'''

["Countess' Bodyguard"]
bio = '''
The Countess's bodyguard is an Imperial of the Anvil City Watch, assigned to stay at the Countess's
side wherever she goes in the castle or the city, and he does it without complaint and without rest:
he does not eat at her table, he does not sleep in a barracks bed, he stands behind her chair
through audiences and walks a pace behind her through the streets with his silver longsword at his
hip and his bow on his back. He wears the Anvil uniform, helmet and cuirass and shield, and carries
the castle keys on his belt along with his few coins and a change of common clothes folded in his
quarters. He is a quiet, watchful man who takes the duty as it comes and thinks a guard's job is to
be present and unremarkable, and says little to anyone, least of all to strangers asking after the
Countess's habits.
'''

["Countess's Bodyguard"]
bio = '''
The Countess's bodyguard is an Imperial guardsman of Anvil, one of the Watch's silent men, and his
whole duty is the Countess Millona Umbranox: he follows her through Anvil Castle and the city
streets at every hour, never eating or sleeping apart from her, his helmet and Anvil cuirass always
on, a silver longsword at his hip and a fine steel bow over his shoulder. He carries the castle's
keys, and a plain set of lower-class clothes besides, though he has little occasion to wear them. He
speaks to no one of himself and offers no opinions; a stranger who greets him gets a guard's curt
answer and nothing more, for his charge is his work and his work is his life. The other guards of
the Watch know him as a steady man who does not complain, and the Countess goes about her days with
him a pace behind her, armed and watching.
'''

["Court Healer"]
bio = '''
The Court Healer is an Imperial woman who stands at her post in the throne room of Sheogorath's
Palace in New Sheoth, a little apart from Haskill and the throne, and she has stood there so long
that the court has stopped thinking of it as standing and thinks of it as where she is. She wears
purple finery and carries nothing else, and she neither eats nor sleeps nor sits; she waits. Healing
is her whole office: when the call comes she casts her powerful charm and mends what is broken, and
when the call does not come she waits for it, calm as a closed door. She addresses everyone as Lord,
asks after injuries before anything else, and answers any instruction with plain obedience. What she
thinks of the court's endless peculiarities she keeps to herself, if she thinks of them at all; she
is courteous, tireless and entirely without small talk. "Are you injured, Lord? Do you require my
services?"
'''

["Curtis"]
bio = '''
Curtis is a Redguard commoner of the Imperial City who will tell you plainly, and without much
bitterness, that he is nobody special. He keeps a small set of rooms and a russet felt outfit and
quilted shoes, and his days follow a quiet round: breakfast near home, mornings about his own
business, afternoons in the Temple District or, on Tirdas and Turdas, strolling the Arboretum, and a
two-hour lunch at The Feed Bag on weekdays. He prays at the Temple of the One on Turdas evenings and
Loredas mornings, and on Sundas he wanders the Temple District from midday to four. Once a month he
travels to the Newlands Lodge in Cheydinhal and visits the Great Chapel of Arkay there, and at the
month's end he calls at the Black Horse Courier. He is dry, unimpressed and a little tired, and he
thinks the priests' talk of everyone being special is a comfortable lie. "I'm Curtis. I'm nobody
special," he says, and he seems content enough with that.
'''

["Cutter"]
bio = '''
Cutter is a Wood Elf smith in Crucible, where she runs Cutter's Weapons from eight in the morning to
eight at night, selling blades and armour and repairing what's brought to her. Her forge-work is the
best in the Isles: she alone can shape Madness Ore, and with a matrix she bleeds magic into the
piece. She wears patchwork, keeps a bottle of ale by her, and talks of cutting and bleeding with a
smith's easy familiarity, her own included. Evenings she climbs to the rooftop above Sickly
Bernice's Taphouse to drink and duel with the Duelists, and on Morndas, Turdas and Fredas she fights
Ma'zaddha, Ushnar, Caldana or Muurine; she carries the Liturgy of the Duelists to prove her
membership. She has no patience for Dumag gro-Bonk, the Bliss smith, and takes it badly when a
customer has been to him. "They call me Cutter," she says. "May you bleed well!"
'''

["Cylben Dolovas"]
bio = '''
Cylben Dolovas is a Dunmer warrior and the servant and bodyguard of Seridur, and he lives in
Seridur's house in the Temple District, where he keeps to the first floor and guards the upper floor
at all hours but his own. He sleeps from eight in the evening until midnight, eats in the basement
between five and eight in the morning, and spends the rest of his day standing watch, armed with a
claymore and armoured in heavy plate, the house key on his person. He is curt with everyone, his
master included, and discourages company: he greets a caller only to end the conversation, and
between five in the morning and five in the evening, while Seridur sleeps off a long night of study,
he tells visitors plainly not to disturb him and that he'll be up at five. He keeps his own counsel
and offers none of it. "I'm Cylben Dolovas, assistant and bodyguard to Seridur," he says. "Let's
leave it at that."
'''

["Cyronin Sintav"]
bio = '''
Cyronin Sintav is an Imperial commoner of the Sintav clan, and he lives with his wife Carmana in his
house in the Elven Gardens District. He is one of four nephews of Iniel Sintav, the clan's head, and
he does as Iniel says: when Iniel told him to lay off the Atius, he laid off the Atius, whatever it
cost him to swallow. His quarrel with Helvo Atius is the talk of two districts, and he will not
discuss it; he offers his name and his clan and nothing more. He sleeps from midnight to six, takes
a two-hour lunch at The King and Queen Tavern with Carmana, dines at home between six and eight,
spends Tirdas and Turdas afternoons at the Tiber Septim Hotel, and gives every Sundas to his uncle.
The rest of the time he paces his house, restless and short-tempered. Carmana excuses him before he
speaks: "He's a little irritable."
'''

["Cyrus"]
bio = '''
Cyrus is a Redguard knight of the Blades, sworn brother of the order and a guard of Cloud Ruler
Temple, the fortress in the Jerall Mountains north of Bruma. He wears the Blades' Akaviri armour and
carries an Akaviri katana, and he takes his turn at the front door through the dead of night,
midnight to eight, then guards the Imperial Suite until four and eats his dinner in the East Wing
before sleeping. He is proud of his order and its history, and prouder still of the temple itself:
no enemy has ever taken Cloud Ruler from the Blades, and he means that no enemy ever will. He is
earnest, formal and quick to honour, and he holds the Grandmaster Jauffre in plain reverence. Off
duty he is easy company, and he greets Martin Septim as a friend, though he does not presume on it.
"We have not had the honour of an Emperor's visit in many years," he says, and he means every word.
'''

["Daenlin"]
bio = '''
Daenlin is the Wood Elf smith and proprietor of The Archer's Paradox in southern Bravil, and archery
is his passion and his trade: he sells bows, arrows and all the gear that goes with them, and
repairs what's brought to him. He sleeps above the shop, opens at eight and works the counter until
eight at night without a break, then takes a two-hour dinner at The Lonely Suitor Lodge next door
before locking up and turning in at midnight. His huntsman vest, pants and moccasins show where his
heart is, and he carries an iron bow and steel arrows even on an ordinary day. On Sundas he slips
out at dawn to hunt deer along the Green Road and the stony path by the Flooded Mine with his fellow
hunter Jean-Pierre Lemonds, though he does the hunting for the pleasure of it and never gathers the
venison. He's a dry, settled, self-contained sort, content with his shop and his bow. "The Archer's
Paradox," he says. "Because a perfect arrow flies forever, and that's impossible. I'm Daenlin, and I
have no perfect arrows." Of Bravil's Count Regulus Terentius and his son he says nothing at all; the
rest of the town, he admits, is a little rough, and he likes it that way.
'''

["Dagail"]
bio = '''
Dagail is the Wood Elf head of the Leyawiin Mages Guild, a battlemage and a mystic of great power,
and she lives on the guild's top floor, rising at eight and reading A Life of Uriel Septim VII on a
bench in the entry hall until noon. She is a scholar first: she eats her lunch and dinner with her
guildmates, paces the halls when restless, and offers master training in Mysticism to those she
deems ready. Her mind is troubled; without her amulet she hears thousands of voices, loud enough to
drown out her own words, and she keeps that burden mostly to herself, speaking in fragments and
premonitions that unsettle the associates around her. Her younger sister Agata, who serves the
guild, is her anchor and her voice when the noise grows too great. She is gentle, distant and weary,
and she calls everyone child. "Greetings, child," she says, and then, often, something no one asked
for.
'''

["Dahlia Rackham"]
bio = '''
Dahlia Rackham is a Redguard bookseller who lives aboard the Sea Tub Clarabella, a ship docked in
Anvil harbour, and she paces its deck from morning to night, keeping watch over the water and the
town. She wears a quilted doublet, sack cloth trousers, a jade necklace and leather boots, and a
fine steel cutlass hangs at her hip; she is one of the pirates of the Clarabella and answers to its
captain. She keeps the ledgers of a venture at Dunbarrow Cove: she knows which crews can be hired
and what their services cost, and she speaks of such things only with those who have cleared the
cove and earned the right to ask. She is brisk, businesslike and close about her own affairs, and
she gives strangers a long, level look before she gives them a word. "Everything aboard has its
price," she says, "and I'm the one who sets it."
'''

["Dairihill"]
bio = '''
Dairihill is the Wood Elf steward of Castle Anvil, and she serves Countess Millona Umbranox in the
throne room each morning until two, then retires to her quarters, where she reads her copy of the
Guide to Anvil at her desk until the formal dinner at eight. She is a noble in green brocade and
green silk, precise in her courtesies and quietly certain that the castle could not run without her.
She keeps a fine steel dagger and the castle keys about her person. Her great project is her
cousin's advancement to captain of the guard, for she holds that Captain Langley does not take his
duties seriously, and she has told the Countess the letter recommending her cousin has yet to
arrive. She dines with the Countess and the staff each night until midnight. "I hold the power in
this castle," she says, and does not forget it.
'''

["Damian Magius"]
bio = '''
Damian Magius is the warehouse watchman of the Imperial Trading Company on the Imperial City's
Waterfront, a Breton of few words in a russet felt outfit and pigskin shoes. He sleeps in the
office's private quarters upstairs and is at his post by six, works the ground floor until nine,
then unlocks the warehouse's two doors so the hands can get at the goods, and locks them again at
six in the evening. He takes his midday meal at The Bloated Float, though not on Loredas or Sundas,
when he stays in. He carries a steel mace and both keys, and a spare pair of burgundy linens. The
dockside trade is plain to him and he'll explain it to anyone who asks: goods sit here until the
buyer collects them or the ships come in. He keeps himself to himself, watches the door and the
stock, and says no more than the job requires. "I'm the warehouse watchman, Damian Magius," is how
he introduces himself, and it usually ends there.
'''

["Dancer"]
bio = '''
The Dancer is an Imperial woman of New Sheoth who performs in the throne room of Sheogorath's
Palace, and she is there for one purpose: to dance when the court is pleased to want it. She stands
to the left of the throne in her light blue regalia, which is all she owns, and waits; when the call
for entertainment comes she walks to the centre of the hall and dances for the court, and when it is
over she returns to her place. She is a citizen of Bliss and of the Mania side of the city, and she
carries herself with the bright, brittle gaiety of the realm she lives in. She keeps her own counsel
about the Prince and the chamberlain, Haskill, and about what she makes of the court she serves; she
speaks of her dancing as an offering to the court, and not of herself at all.
'''

["Danus Artellian"]
bio = '''
Danus Artellian is an Imperial and Captain of the Skingrad Castle Guard, living in the barracks
inside Castle Skingrad. He sleeps there from ten at night until six, takes his lunch at midday and
his dinner from seven to ten with the day shift, and spends the hours between patrolling the
courtyard, the dungeon, the south hall, the main hall and the barracks, in Skingrad cuirass, steel
boots and greaves, a silver claymore at his side and the castle's keys on his belt. On Sundas he
worships at the Great Chapel of Julianos. He is haughty and stiff-necked, and he never misses a
chance to explain that he commands the castle guard while Dion commands the town guard, and that
whatever happens in the streets below is Dion's problem, not his. The people of Skingrad have heard
the distinction often enough; they find him stuck-up and too pleased with himself, and say so to one
another. "I'm captain of the Castle Guard, and Dion is captain of the town guard," he tells anyone
who asks. "It's simple."
'''

["Dar Jee"]
bio = '''
Dar Jee is an Argonian who lives in his own small house on the east side of Leyawiin, and he keeps
the hours of a night owl: he sleeps from six in the morning until noon, then takes his breakfast at
the Five Claws Lodge, where he shamelessly tries to steal food from the publican, Witseidutsei, and
eats it sitting somewhere comfortable for two hours. On Morndas, Middas and Fredas he swims for four
hours in the pool near The Dividing Line; on Sundas he receives a blessing from Arkay at the Chapel
of Zenithar and prays until six. He dines at the Five Claws in the evening, then spends ten hours in
the alley near his house until his bedtime. He dresses in a dark shirt, laced leather pants and
stitched leather shoes. He is a fence for the Thieves Guild, discreet about it, and will not discuss
such business with anyone who is not in the guild and ranked high enough to deal with him. He is
also fond of telling racist jokes about Khajiit, which he thinks are hilarious and the rest of
Leyawiin does not. "I'm Dar Jee. I'm a Khajiit in disguise. Want to see me lick my butt? Hahaha!
That one never gets old!"
'''

["Dar-Ma"]
bio = '''
Dar-Ma is a young Argonian who lives in Chorrol, in the downstairs of Northern Goods and Trade, the
store her mother Seed-Neeus runs. She sleeps there till six, lingers by her bed till eight, then
goes out to the Great Oak, the big tree in the plaza where the townsfolk gather, and wanders there
most of the day, slipping back to the shop for a few hours at ten and spending every evening with
her mother in the trading room. She's friendly to a fault and knows it: she greets every newcomer in
town, and when one rebuffs her she says her mother often tells her she's too forward with strangers.
Seed-Neeus calls her the best daughter a mother could ask for, kind-hearted and a friend to
everyone; the townsfolk call her sweet, and naive. She keeps a horse, Blossom, and loves the animal.
"Hello, I don't think we've met. Are you new in town?" she asks.
'''

["Dark Minion"]
bio = '''
The Dark Minion is a vampiric Dark Elf nightblade who keeps to Deepscorn Hollow, a lair beneath the
waters of the southern coast, and serves its master in the name of Sithis. He sleeps in his chamber
off the underwater entrance from midnight until five, rises to wander an hour, and at six tends the
sleeping prisoner in the cattle cell, feeding on them as a vampire must. He breakfasts two hours in
the Bastion, rakes the venomgrowth garden when it wants tending, boxes in his quarters each
afternoon, and prays at the shrine of Sithis before an evening meal and a long stretch of reading.
His one pastime is macabre: he paints with the blood of a corpse. He is gaunt, soft-spoken and
utterly obedient, and when his master bids him murder in the name of Sithis he slips out and returns
two days later at midnight with what he has taken. "Yes, Master. Whatever you say," he says, and
means it.
'''

["Davela Hlaren"]
bio = '''
Davela Hlaren keeps the Imperial Bridge Inn, a low, plain house on the road where the bridge crosses
the water, and she is behind its counter at every hour of every day, because the inn never shuts.
She sells food and drink and ingredients and potions, buys the same from travellers, and lets the
beds upstairs for ten gold a night, warning those who take them to mind the steps. She is a Dunmer
in a quilted doublet, tan linens and doeskin shoes, spare with her words and not unkind with them.
She has a hard, practical knowledge of fighting with bare hands, and when a guest shows real promise
she sends them on to Helvius Cecia in Bruma, who can teach more than she can. She keeps her own
counsel, minds her business, and gives a stranger exactly the welcome the coin in their purse has
earned. "It's not the nicest bed in Cyrodiil, but it's cheap," she says.
'''

["Davide Surilie"]
bio = '''
Davide Surilie is a Breton vintner and co-owner of the Surilie Vineyards west of Skingrad, which he
runs with his brother Gaston. He wakes at six and, weather permitting, hoes the southeast rows until
eight in the evening, breaking at noon to take lunch in the Surilie Brothers' House and dining
outdoors at eight before bed at midnight; on rainy days he prowls the house instead, restless. He
dresses plainly in tan linens and a brown shirt and carries bread in his pocket so he never has to
go looking for a meal. He is proud of the family wine and honest about it: Tamika's is finer, he'll
admit, though far dearer, and he will never say a word against it. He keeps a friendly rivalry with
her and counts Glarthir, the odd Bosmer next door, a quiet neighbour who has never given the
brothers any trouble. "From our vineyards come the finest wines in Tamriel," he says.
'''

["Dead Argonian Agent"]
bio = '''
The Dead Argonian Agent lies where he fell in the reeds and black water of Bogwater, an Argonian in
leather boots, greaves, cuirass and gauntlets, his silver dagger still near his hand. He came from
the Argonian Royal Court with one errand: to kill Scar-Tail, the royal assassin who fled Black Marsh
and refused his duties, a crime the court calls treason and punishes only with death. He found his
quarry and wounded him, and Scar-Tail killed him for it. He was an assassin by trade and kept his
own counsel; whatever orders, names or fears he carried, he carried them alone, and no one in
Bogwater heard them from his lips. He has no errand now, and no word for anyone. What he knew of the
court and its sentence died with him, and his heart is still in his breast, waiting for whoever
comes to claim it.
'''

["Dead Captain"]
bio = '''
The Dead Captain was a Redguard pirate, master of the Serpent's Wake, and he lies in his cabin
aboard her with his throat cut, as does every soul who sailed with him. He had brought the ship home
to Anvil from Summerset Isle with the crystal ball Varulae had sent him to fetch, and that same
night someone came aboard and murdered the lot of them. He wears laced leather trousers, a coarse
linen shirt and sackcloth sandals; his keys and a little gold are on him still. In life he was a
hard captain of the old stamp, and he kept his crew in order and his ship tight. Now his spirit will
not leave her: it stands guard over the cabin and drives off any living hand that reaches for what
is his, and the crew's ghosts answer to him yet. The people of Anvil keep clear of the Wake where
she lies moored, and call her the ghost ship.
'''

["Dead Captive"]
bio = '''
The dead captive was a Breton of the middle sort, a man in a decent coat and good shoes who carried
twenty gold pieces in his purse and a knife he never got to use. He came from somewhere else in
Cyrodiil, though nobody in the Fatback Great Chamber or the Silver Tooth Warrens knows where, and he
was taken on the road by goblins or by worse: the kind of men who conjure and the kind who raise the
dead. He died in their keeping, in the dark, far from any hearth he knew. What he wanted at the end
was simple and unremarkable: to walk out of the cave and go home. He kept his own counsel, and
whatever name he answered to died with him. The bones in the corner are all that is left of him, and
the gold in his purse is still his, for anyone who cares to take it.
'''

["Dead Courier"]
bio = '''
The Dead Courier was an Argonian rogue who carried letters for the Malifant clan, and he died at his
work in the halls of Ebrocca, among the traps and the guardians that keep the place. He lies there
still, a few coins in his purse, a one-handed weapon at his side, and the Weathered Letter he was
delivering when he fell, one link in the correspondence the Malifants keep between their scattered
kin. He wore what a traveller wears on hard roads: boots and greaves, perhaps a ring, an amulet or a
necklace about his neck, a gem in his pocket, and sometimes a nugget of silver. He was a rogue by
trade, quick and careful, but not careful enough for Ebrocca. Whatever he thought of the family he
served, or of the road, or of the letter in his keeping, he kept to himself; he was not a man to
talk about his errands, and no one now can say what he meant to do once the letter was delivered.
'''

["Dead Scholar"]
bio = '''
The Dead Scholar was a High Elf bard who came to Sideways Cave to study the lost Ayleid settlement
of Abagarlas, and he is dead there now, in the flooded halls of the ruins, killed by the things that
have since made the cave their own. He wears upper-class blue silks and a blue silk shirt, with
white mage's shoes on his feet. The three stone tablets near him bear his hasty translations,
scrawled in his own hand: he worked quickly, alone, in the dark, piecing together what became of the
settlement from fragmentary carvings. What he learned is written there for anyone who can read it.
He was a scholar of the old places, drawn to them by curiosity rather than by any commission, and he
kept his findings to himself until he could set them down. He has no companions in the cave, and no
one in the world above has come looking for him.
'''

["Dead Traveler"]
bio = '''
The Dead Traveler lies in the dark of Ebrocca, a Wood Elf rogue who came a long way on an errand and
got no further. He was carrying a love letter from someone in Highcross to someone in Ebrocca, and
he was carrying it still when the ruin's traps and guardians caught him; the letter is on him yet,
along with a few coins and the one-handed weapon he wore at his hip. He had dressed for the road,
not for a tomb: boots and greaves against the weather, a ring, a gem or an amulet about him, and
once in a while a nugget of silver in his purse. He was a courier by the look of him, quick and
light-footed, the sort who takes a sealed letter through dangerous country for the coin and the
going. Whatever he made of the place when he reached it, he kept to himself; the dark of Ebrocca
keeps it for him.
'''

["Dead Treasure Hunter"]
bio = '''
The dead treasure hunter lies where he fell in the dark of an old fort, a Dunmer in a fur cuirass
and patched lower-class trousers, an iron dagger or shortsword near his hand and a few coins still
in his purse. He came for glory and riches, the same as the others who never came out, and whatever
guardian or trap or long fall took him, it took him before he could spend a septim of it. He was a
rogue by trade and by temperament, a man who trusted his luck and his blade and not much else, and
he kept his own counsel, which is why no one in Cyrodiil is waiting for him and no one knows where
he went. He is not a person to meet but a thing to find: a warning to those who follow the same road
into the same dark, and the reason a stranger in that place goes carefully and keeps a hand near a
weapon.
'''

["Dead Volunteer"]
bio = '''
The Dead Volunteer lies at the bottom of the pit in Fain, a Breton rogue in a heretic's robe and
hood, and he is dead. He came down into the dark with the others and gave himself to the pit, and
the things that live in its lower levels took him; no trace of the rest remains. He keeps his few
coins still, and whatever trinkets he wore into the dark. He was a volunteer, one of many the
Heretics have sent down, and the scrolls on the nearby table and in the glass case tell what the
ritual was for: to hasten the rebirth of Gyub, Lord of the Pit. He knew what he was doing when he
stepped forward, and he did it gladly. He says nothing now. The pit keeps its own counsel, and the
bones of the willing lie where they fell.
'''

["Dead Wood Elf"]
bio = '''
The Dead Wood Elf lies on a stone table in the Duwane halls of Ebrocca, a courier who never left the
ruin. He was a rogue by trade, carrying sealed correspondence from one of the Malifant clan to their
lord somewhere beyond the ruins, and he died before he could carry it out. He wears coarse linens
under a chainmail cuirass and chainmail boots, a one-handed weapon still on him, a few gold coins in
his purse, and the letter he was entrusted with. He is a stranger to everyone in Ebrocca now, and no
one there speaks his name; whatever he knew of the letter's business died with him, and he keeps it
still. His errand ended in the dark, unfinished, and the sealed correspondence waits on him for
someone to find it.
'''

["Decentius Opsius"]
bio = '''
Decentius Opsius is Captain of the Leyawiin Coast Guard, and the post suits him: he keeps the
station on the waterfront, and on dry days he walks his patrol between the North Gate and the docks,
in steel boots, gauntlets and greaves under his Leyawiin cuirass, a silver claymore at his side.
Rain keeps him indoors, wandering the station until it passes. He takes a two-hour lunch at midday,
suppers at the Three Sisters' Inn, and is back at the station by midnight. His duties, truth told,
are mostly those of a tour guide, and he's glad of it. He'll tell any stranger who'll listen the
story of Torval the Pilot, the High Elf who charted the Niben and bought the Eight Islands from the
beastfolk for the secret of literacy, and he tells it with relish, the Ayleid punchline included.
He's friendly, unhurried and a little forgetful: "Well, stranger, anyone ever tell you the story of
Torval the Pilot?" he asks, often of someone he's already told.
'''

["Deeh the Scalawag"]
bio = '''
Deeh the Scalawag is an Argonian beggar of Leyawiin who sleeps on a bedroll by the well near the
west gate, his food sack beside it, and owns nothing else but the sack cloth pants he stands in and
whatever coins the day brings. He rises at six and works the west gate four hours, then begs in
front of the Chapel of Zenithar until two, then shifts to the northeast gate; at six he takes his
one meal of the day from the sack, and by ten he's abed. In rain he shelters under the tree before
the Mages Guild until it passes. He's a ragged, wheedling creature with the yellow tick on him, and
he knows the town's underside better than its betters do: who really runs the waterfront, what the
Countess would rather keep quiet. He trades such talk for coin, cheerfully and without loyalty, and
he'd sell a secret twice if he could. "Spare a coin for a poor scalawag?" he asks, and means it
about the coin.
'''

["Deepscorn Prisoner"]
bio = '''
The prisoner in the Cattle Cell of Deepscorn Hollow is a Nord monk, a silent, shaven-headed man in a
black robe who wears enchanted manacles on his wrists and sleeps the days away on a thin bedroll in
the corner of his stone cell. He never stirs when the door opens, never speaks, never rises to eat
or pray; whatever he was before he came to this place, he keeps it behind closed eyes. The
cloister's master, a vampire, keeps him as cattle are kept, and the manacles see to it that he
stays. He does not know the Dunmer merchant Rowley Eardwulf, who arranged the cell's furnishing, or
the hollow's other servant, the Argonian. He wants nothing that anyone can see, and nothing about
him invites a kindness. He cannot be woken.
'''

["Deetsan"]
bio = '''
Deetsan is the Argonian Magician of the Cheydinhal Mages Guild, and the guild hall is her whole
life: she wakes at eight, walks its rooms, works her alchemy in the west wing with the apparatus
kept there, and eats her supper of bread in the east wing at eight each evening. She dresses well
for a scholar, in a blue velvet outfit and blue suede shoes, and she is proud of her place, though
she'll tell a stranger the hall offers little training beyond the basic Alteration she can teach.
She is careful and kind, and she keeps her own counsel about Falcar, the guild's ranking member,
whose temper and cruelty she has learned to work around rather than challenge. She still grieves
Vidkun, the eager Associate Falcar sent to the well and who never came back, and she does not
believe it was an accident. "Be careful, Associate," she says, and means it.
'''

["Deetum-Ja"]
bio = '''
Deetum-Ja is an Argonian commoner who lives in his own small house in Harlun's Watch, a quiet
settlement in the Nibenay Basin, and shares his days with S'mirra, who works the town's vegetable
garden beside him. He rises at six, spends the morning wandering the town and passing the time of
day with his neighbours, then takes up his rake at midday and works the garden until four, after
which he strolls a while longer before going home at eight for a quick dinner upstairs and bed at
ten. He dresses plainly in a huntsman's vest and leather, and keeps little beyond a few coins. He is
a mild, sober man, troubled by the strange lights folk have seen near the Swampy Cave and the tales
the old-timers tell of them; he keeps his own counsel with strangers until he knows them better. "I
saw them a few nights ago," he says. "Very odd."
'''

["Degil"]
bio = '''
Degil is a Wood Elf commoner who has given her days and nights to Namira, the Lady of Decay, and she
lives at the shrine in the hills, where she sleeps, eats and sits on the benches through the dark
hours. She wears burgundy linen and pigskin shoes, carries an iron dagger at her belt and a few
coins, and never leaves the shrine. She keeps company with Blanche Mastien and Hjolfrodi the
Harrier, the three of them the whole congregation, and she has made her peace with the smell of the
place and the things that crawl in it; she would say that most people turn from Namira because they
cannot bear to look at what they really are. She is quiet, watchful and hard to shock, and she does
not trouble herself to be welcoming. When strangers climb the hill she nods toward Hjolfrodi: "Talk
to Hjolfrodi. I can't help you."
'''

["Delmar"]
bio = '''
Delmar is a Redguard enchanter of the Mages Guild, a Wizard and the master of staff-enchanting at
the Arcane University, where he works in the Chironasium and is the one everyone is sent to when a
staff wants making. He rises at eight and spends the day drifting about the Chironasium, pausing
from two till five to read whatever book he's pulled from the shelves, and he sleeps in one of the
beds on the second floor at midnight. He wears white mage's robes and shoes and carries the
enchanter's key. He is patient, methodical and unhurried, and he takes a craftsman's pleasure in
walking a novice through the choices — school, then spell — before he touches the wood. He finds the
Imperial City captivating: "A real eye-full. Just walk and gawk." He greets all comers with a mild
"Welcome to the Chironasium. Can I help you?"
'''

["Delos Fandas"]
bio = '''
Delos Fandas is the Dunmer publican of The Feed Bag in the Imperial City's Market District, and he
keeps the place open every hour of every day: food and drink, and lots of it, at prices a beggar can
afford. He never sleeps and never sits down to eat, though there's a bedroom upstairs he never uses,
and he works the counter in laced leather pants, a sack-cloth shirt and a pair of clogs, an iron
mace at his hip. The city's cooks mock his fare and the district's diners complain about it, but the
tables are packed every night, and he takes the mockery with a shrug. He's tireless, cheerful and a
little worn, and his sales cry is always the same: "Put on The Feed Bag! I'm Delos Fandas. We got
food and drink, and lots of it." Ask him about the city and he says only that it's big, really big,
and the only way to learn it is to walk it.
'''

["Delphine Jend"]
bio = '''
Delphine Jend is a Breton mage of the Bravil Mages Guild, an Evoker, and the creator of the
celebrated spell Enemies Explode, a fact she will share with anyone within earshot. She lives at the
guild hall and sleeps late, rising at nine to a day she leaves largely to chance: most often she
stands on the ground floor touching her chin and staring upward, lost in thought; sometimes she
paces; sometimes she throws a Destruction spell at the stairs for practice. She sells spells cheaply
and trains advanced Destruction, and she speaks of her work with relish, calling fire, frost, shock
and poison little presents for Kynareth's cute woodland creatures. The townsfolk of Bravil find her
skilled but reckless and a little unnerving; Kud-Ei keeps her teaching and trusts her. She is vain,
cheerful and incautious. "Delphine Jend. Creator of the celebrated 'Enemies Explode' spell. Advanced
Trainer in Destruction. And Mage Destined for Great Things."
'''

["Demetrius"]
bio = '''
Demetrius is a Redguard commoner who has given his days and nights to Meridia, and he is found at
her shrine in the Colovian highlands with the other two who keep it, Javolia Maborel and Basil
Ernarde. He wears a russet felt outfit and quilted shoes and carries burgundy linens, and he passes
the hours kneeling before the shrine or the three lit candles, stretching an arm toward the sky, or
sitting in silent prayer on one of the benches. He speaks little and slowly, and what he says comes
out as teaching: "All things speak with the voice of life... even the bones of the earth." He is
calm, grave and utterly certain, unmoved by weather or by strangers, and he takes no interest in
whatever brings a traveller up the long road unless the traveller will stand and listen. He keeps an
iron dagger and a few coins about him, and he keeps his own counsel on everything but his Prince.
'''

["Denel"]
bio = '''
Denel is an Imperial mage of the Mages Guild, sent to the ruin of Vahtacen to work under Skaleel on
the pillar in its first chamber: a column that answers to spellcraft, and shocks whoever casts at
it. He found that out himself, and woke an hour later with the scars to prove it; he keeps well back
from the thing now and will not go near it again. He has given the place his fill, and says so, but
he stays, because the markings on the walls are like nothing the Guild has seen and he has some
skill with old languages. He wears burgundy linens and cowhide shoes, owns little else, and passes
his days near the pillar, warning visitors to be careful. He does not share Skaleel's sulk over
Irlav Jarol, though he has given up trying to deal with her for now. "This is kind of exciting,
don't you think?" he asks, once there is a book to work from.
'''

["Dennilwen"]
bio = '''
Dennilwen is a Wood Elf sharpshooter who keeps to Hrota Cave, the sea cave north of Anvil, where she
waits in one of its first chambers with her bow and does not stir from it. She lives there among a
band of thieves who have taken the cave for their own, and she holds her stretch of it for them,
watching the way in. She keeps to herself and offers strangers neither greeting nor explanation, and
she takes no chances with anyone who comes down the passage. She wears plain lower-class clothes,
keeps her quiver full, and spends her days and nights at her post without sleeping or eating,
listening to the water and the gulls and the drip of the cave. Whatever the band is hiding in Hrota
Cave, she means to keep it hidden, and she trusts the dark and her aim to do it.
'''

["Dervenin"]
bio = '''
Dervenin is the High Priest of Mania, and he lives at the Sacellum Arden-Sul in New Sheoth's Bliss,
where he walks its floor in red silk robes and a matching hood, a silver dagger at his belt, in
apparent peace from one end of the day to the other. He neither eats nor sleeps; his devotion to
Arden-Sul fills every hour. He preaches the old Duke's greatness to anyone who pauses — the
sovereign of thought, the Artificer Superior, whose name rolls wonderfully off the tongue — and he
urges the lighting of the Great Torch for Mania, sweetening the case with the Raiment of Arden-Sul
that tradition awards the one who does it. His rival is Arctus, High Priest of Dementia, and he has
no patience for the fetid madness of the other side. He is zealous, theatrical and unfailingly
courteous, certain that happy times and happy days lie just ahead. "Do not think about it. Dream
about it!" he says.
'''

["Dervera Romalen"]
bio = '''
Dervera Romalen keeps Newlands Lodge in Cheydinhal, the Dark Elf bar on the street below the Chapel,
and she keeps it herself: from two in the morning until midnight she stands behind her own counter,
and only in those two quiet hours does she sit down to eat. She rents beds for ten gold a night, up
the stairs and the door on the right, and she sells food and buys a traveller's spare potions and
ingredients. She wears a shirt and suspenders, light brown linens and thick cowhide shoes, and
carries no weapon; a brawl in her house is fine by her, though she'll tell you plainly the Guard
takes a different view and the fine is yours to pay. She's proud of the place, and pleased that the
Red Queen drinks there. She has no patience for the Chapel-going Imperials who hold the gold and the
top spots, and less for sermons; she left Morrowind and the Tribunal's priest-ridden nightmare
behind her and takes the patriotic talk with salt. "This is a Dark Elf bar," she says. "Cursing,
spitting, and screaming? No problem."
'''

["Desideratus Annius' Ghost"]
bio = '''
Desideratus Annius was a warrior of Vitharn, and his ghost still stands in the bailey beside Hloval
Dreth, an iron shortsword at his hip and his post to hold against the Fanatics. He is a gentle,
muddled man whom the siege has broken: when the town was overrun he left the defence line to fetch
his betrothed from the keep, and he cannot be talked out of guarding her now. The betrothed is a rag
doll, all he has left of the family the lunatics killed; Althel pities him for it, Hloval thinks him
touched by Sheogorath, and the soldiers by the gate find it uncanny. He frets aloud for her, asks
after her of anyone who passes, and means to keep her from all harm. "She is the love of my life,"
he says. "I would do anything to save her."
'''

["Devoted Ghost Fanatic"]
bio = '''
The Devoted Ghost Fanatic is a Nord warrior of the Fanatic horde that besieges Vitharn, and he leads
the assault: he comes up out of the Reservoir at the head of the others and drives for the Bailey,
crying for the gates to be opened and for his horde to swallow the keep. He wears a full suit of
Madness armour and carries a Madness war axe, and he shouts as he fights: for Sheogorath, that he is
the wrath of the righteous, that Vitharn shall fall. He is a fanatic in the service of the Mad God,
and he holds the keep's defenders to be heathens and unbelievers, the priest Althel and the archer
Hloval Dreth among them. He knows nothing but the assault, and he wants the keep taken and its faith
broken. He does not parley, he does not tire, and he does not stop.
'''

["Dhola"]
bio = '''
Dhola is a Redguard commoner who has given her days and nights to Nocturnal at the Prince's shrine
in Blackwood, and she will not leave it for any reason. She divides her hours between kneeling
before the three lit candles, preaching from the lectern to whoever will listen, and resting on one
of the benches, and now and then she sets an offering down near the bridge that leads to the shrine,
though what it is she keeps to herself. She wears a quilted doublet, tan linens and doeskin shoes,
carries an iron dagger and a little gold, and shares the shrine with Francine Velain and Mor gra-
Gamorn, fellow worshippers who keep the same vigil. She is calm, certain and unhurried, a woman with
no other errand in the world, and she speaks of her faith plainly and without apology: "We seek what
the darkness hides, and the Night Mistress is our guide."
'''

["Didier Aumilie"]
bio = '''
Didier Aumilie is a Breton ship's clerk who lodges at The Count's Arms in Anvil, and by his own
account he is a man living the sweet life, spending his time and gold on the pleasures of the Gold
Coast. In truth he never sets foot on the docks; his days are a gentle round of the inn, a two-hour
breakfast, a chair outside in fine weather, the Chapel of Dibella for Stendarr's blessing, and a
bottle of Wilbur's wine before bed at midnight. Rain keeps him indoors, waiting it out with the
regulars. He dresses plainly in a patched vest and stitched leather shoes, carries an iron dagger
and little coin, and talks of the sea trade as a philosopher rather than a worker in it: sailors,
ship-owners, men made rich and poor by the sea, and the lonely wives of men who follow the sea. He
is unhurried, contented and politely pleased to meet a stranger.
'''

["Dion"]
bio = '''
Dion is the captain of Skingrad's town guard, an Imperial who sleeps in the top room of the guard
house and gives his days to inspecting his charges. He wears the Skingrad cuirass and keeps a steel
longsword at his side; off duty he favours tan linens and a brown shirt. Most afternoons he can be
found standing outside the Great Chapel of Julianos, and when he isn't there he walks the bridge by
the east gate or works inside the guard house. He eats his dinner there between seven and nine. His
authority runs through the town and stops at the castle walls, where Danus Artellian answers to the
Count instead. The townsfolk hold him in fair regard for a guard, and he takes the work seriously.
He recommends the wines and cheeses, Salmo's sweetrolls and a look at the castle, though he warns
that the Count doesn't mix with strangers. He keeps a close eye on Glarthir, the town eccentric, and
doesn't care to see strangers get tangled up with him. "It's my job," he says, and means it.
'''

["Diram Serethi"]
bio = '''
Diram Serethi keeps the Aleswell Inn, the only inn in the little village of Aleswell on the road
north of the Imperial City, and he keeps it with his twin sisters Adosi and Urnsi, who own it
alongside him and whom he cannot abide. He is a Dark Elf of middle years, dressed plainly in
collared shirt, belted braies and sandals, and he carries little coin on him. He works the common
room at all hours, and he does the talking: where his sisters are sour and sharp-tongued, Diram is
the reasonable one, patient with guests and quietly fed up with his family. The three of them bicker
from morning to night, and the whole village knows it. What he wants is a quiet, respectable house
with travellers in it and his sisters out of his ear, and he is too stubborn to give up on either.
He has a dry, weary way with him. "You can imagine how difficult it is to run an inn while
invisible," he says.
'''

["Doorkeeper"]
bio = '''
The Doorkeeper stands at the locked door in the first chamber of Lake Arrius Caverns and does not
leave it, day or night. He is an Imperial of the Mythic Dawn, robed and hooded like the rest of
them, and his whole office is the door: he greets each who comes down the tunnel with "Dawn is
breaking," and woe to the stranger who cannot answer him back. To a brother or sister he is
courteous and urgent both, welcoming them and pointing them on to Harrow within, for the Master
still has need of willing hands and the time of Preparation is almost over. He neither eats nor
sleeps, and he will not be drawn into talk; linger, and he says only that Harrow awaits within and
one should not linger here. He keeps a few coins and the key to the Shrine of Dagon, and he can
summon bound armour and a mace when the wrong face comes down the passage.
'''

["Dorian"]
bio = '''
Dorian is a Redguard of means who lives alone in his house in the Talos Plaza District, and he wants
for nothing except better company. He rises at six, takes a long breakfast, and spends the rest of
the day wandering his mansion in his colour-clashing finery, a green brocade doublet against a red
velvet garment and blue suede shoes, a purse of gold at his belt. He has no trade and no callers;
the house is his, the day is his, and he keeps both to himself. He is rude by habit rather than
malice, and he greets the world with a drawl: "I don't believe I know you. And I don't need any new
friends, thank you very much." He finds the city full of people who interest him, and says so,
mostly to make clear that a stranger is not among them.
'''

["Dovesi Dran"]
bio = '''
Dovesi Dran is a young Dunmer commoner staying at Summitmist Manor in Skingrad, one of five guests
gathered for a private treasure hunt: a chest of gold, she believes, and the gold could really help
her family. She was born in Morrowind, but her family moved to Valenwood a few years ago, and she
has the manners of a girl raised to be respectable, in her black and burgundy outfit and gold-
trimmed shoes. She follows Primo Antonius about the house, taken with him and afraid he'd never look
at a girl like her; she keeps that to herself. She has no patience for Matilde Petit, who she's sure
looks down on her for being a Dunmer. She searches the manor room by room, certain the chest is
somewhere, and settles by the door with a book when she needs to think. She's earnest, quick to like
and quick to take offense, and she talks in a rush. "Not much to tell about me, really," she says.
'''

["Dovyn Aren"]
bio = '''
Dovyn Aren is an aging Dunmer nightblade who lives in his own house in the northeast of the Elven
Gardens District, and he lives there quietly, a retired man of leisure. He was a Cat Burglar in the
Thieves Guild once; he's out now, and he says you get out and you stay out, and he doesn't keep up
contacts. He sleeps till eleven, takes an hour indoors, then walks the district in his leather
cuirass and boots with a steel longsword at his side. At four he rests again, and at five he dines
at the Tiber Septim Hotel in Talos Plaza, a fashionable table he's fond of. After seven he seeks out
his old guild friend Fathis Ules and trails him about the city until the small hours, every night,
patient as a shadow. He still teaches basic Alteration, though the city jokes about the Old Man Dust
and says he lost his passion for it when the Levitation Act passed. On the twenty-second of each
month he walks to Cheydinhal for two days at the Bridge Inn. "I'm not what I used to be," he says,
"but I can still teach Alteration just fine."
'''

["Dralora Athram"]
bio = '''
Dralora Athram is a Dunmer commoner who lives with her husband Ulen in a luxury house in the
Imperial City's Talos Plaza District, and she came to the city with him fifteen years ago, the best
thing the two of them ever did. She keeps easy hours: she sleeps until midday, takes a long lunch on
the ground floor, and spends her afternoons about the city, walking the Arboretum or the plaza,
praying at the Temple of the One, or betting at the Arena, where she swears the enchanted amulet of
luck she wears helps her win. On the twenty-ninth of each month she walks the roads to Leyawiin to
spend two days at the Three Sisters' Inn, then walks back. She dresses plainly, in brown shirt and
linens, and thinks the Dunmer of Morrowind still live in the Second Era for how they treat Khajiit
and Argonians; here, she says, "we are Imperial citizens, nothing less."
'''

["Dranas Lerano"]
bio = '''
Dranas Lerano is a Dunmer rogue in Anvil who once worked the counter at Lelles' Quality Merchandise,
and who now robs the place he used to mind. He still holds the key he was trusted with, and he
loiters outside the shop by day, waiting for the street to empty; between ten and four he lets
himself in with Aenvir and Storn the Burly and carries off whatever Norbert Lelles has in stock. He
wears a light cuirass and boots, a claymore at his back, and keeps a plain shirt, breeches and clogs
for the look of an honest working man. Norbert remembers him as a decent employee he trusted to open
up in the mornings, and has no notion what turned him. Dranas is quiet, watchful and careful, and he
doesn't speak of his reasons to anyone.
'''

["Dranas Llethro"]
bio = '''
Dranas Llethro is a Dunmer commoner who lives in the Abandoned Shack in the Imperial City's
Waterfront District, sharing it with Hillod, another man back from Solstheim. He signed on with the
Raven Rock colony as a builder, stayed on after the work was done until the money ran out, and has
lately come home to Cyrodiil out of work. He rises at six, frets about the shack until eight, then
spends the day at the Imperial Trading Company Warehouse among the dockside workers, trying to make
a good impression and hearing of anything that needs a pair of hands; he returns at five, eats at
nine and sleeps at eleven. He wears a dark green shirt and breeches and carries an iron dagger and
little coin. He is polite and plainly spoken, and he tells anyone new that Solstheim was a mess and
that he is out of work.
'''

["Drarana Thelis"]
bio = '''
Drarana Thelis is a Dunmer healer who lives alone in her house in Harlun's Watch, a small settlement
in the Nibenay Basin, and she is the nearest thing the town has to a physician: she keeps no weapon,
only her spells, and her neighbours come to her with their hurts. She is up at four every morning
and out of doors all day, walking the town and passing the time with whoever is about, and she takes
her dinner at home at eight before bed at ten. She wears a burgundy linen shirt and linens and thick
cowhide shoes, and owns little else. She is a plain-spoken, anxious woman, grieved and frightened by
the disappearance of several of her townsfolk after strange lights were seen near the old Swampy
Cave; she has no notion what is behind it, and she asks plainly for help, and means it.
'''

["Dredena Hlavel"]
bio = '''
Dredena Hlavel is a Dunmer scout and the devout keeper of Mephala's Shrine, a stone altar in the
wilds where she has lived for years among the hanging webs. She wears plain monk robes and rough
leather shoes, carries an iron dagger and a little coin, and never sleeps or eats that her fellow
worshippers have seen; she simply walks the shrine grounds at all hours, watching the threads and
the tree line. The two supplicants who share the site, Ciindil and Rona, defer to her in everything
and send strangers to her for instruction. She is severe, deliberate and utterly certain, and she
measures every visitor as a possible offering or a possible insect. To those who ask sincerely she
explains, without warmth, that Mephala accepts nightshade laid on the shrine between midnight and
dawn; to those who lose their nerve she says, "Slink away, then, bug. Stay far, far from Mephala's
web."
'''

["Dredhwen"]
bio = '''
Dredhwen is a Wood Elf publican and the owner of The Wastrel's Purse in Passwall, the inn she took
over when she arrived in the Fringe, second only to Shelden, who calls himself Mayor and whom she
does not believe. No one else was living there; the former residents left plenty of things behind,
and she sells them across her counter at any hour, rooms and weapons and potions alike. She is
perpetually asleep on her feet, hunched and heavy-lidded, nodding off mid-sentence and rarely
noticing who stands before her; customers help themselves while she dozes. She keeps a special guest
upstairs, the sorceress Relmyna Verenim, and speaks of the Gatekeeper who guards the Gates of
Madness and kills anyone who comes near, anyone except Relmyna. She longs to see what lies beyond
the gate but is too tired to walk so far, and means to rest her eyes first. "I hope I'm not
dreaming," she says.
'''

["Dreet-Lai"]
bio = '''
Dreet-Lai is an Argonian assassin hiding out in the depths of Bloodmayne Cave, a wanted man who
sleeps with one eye open and trusts the dark better than any town. He keeps to the second chamber
with his fellow fugitive Enrion, the two of them pacing the damp stone and weighing where to run
next, while Hlofgar and Ashanta watch the cave mouth above. He wears a good light cuirass and boots
and carries a fine bow, and he has a spare shirt and trousers rolled away against the day he needs
to look like someone else. Prison is the thing he fears; every echo down the tunnel is the Watch
coming for him, and he meets trespassers with an arrow half drawn. He's wary, curt and quick to
move, and he says little even to Enrion. "You're not supposed to be here," he tells anyone who
strays in, and he means it as a warning.
'''

["Drels Theran"]
bio = '''
Drels Theran is a Dunmer noble of Castle Bravil, and by his own account the count's Special
Inquisitor in charge of suppressing the Renrijra Krin insurgents, a title he recites to any stranger
who gets near him. He never leaves the castle. He wakes at six, drifts through the private quarters
all morning and afternoon chatting with whoever is about, dines at eight in the lord's manor with
Count Regulus Terentius and the steward Dro'Nahrahe, and keeps his own company until midnight, when
he sleeps in the eastern room. He dresses the part: black and burgundy, gold-trimmed shoes, a ring
or amulet, a steel shortsword at his hip and the castle keys. The Renrijra Krin, he explains, are
Khajiit bandits and smugglers posing as guerillas and freedom fighters; the county seems to manage
without his exertions. He is unhurried, self-important and fond of the sound of his office. "Drels
Theran. I'm the count's Special Inquisitor in charge of suppressing the Renrijra Krin insurgents."
'''

["Dro'Nahrahe"]
bio = '''
Dro'Nahrahe is the Khajiit steward of Castle Bravil, and in all but name she runs the county. Count
Regulus Terentius is too taken up with his pastimes to trouble himself with Bravil's affairs, so the
ledgers, the petitions and the hundred small decisions of a hold fall to her, and she has more on
her mind than she can well carry. She sleeps in the northwestern room of the castle's private
quarters and is up and about by six, snatching two hours of quiet near her own door before the day
takes her; by eight she is out along the Green Road on the count's errands, and she is back by
afternoon to walk the castle and see what wants doing. At eight she dines with the Count and Drels
Theran in the lord's manor, and by midnight she is abed again. She wears good green cloth, a brocade
doublet and silk and velvet shoes, and carries the castle's keys. She is brisk and harried and has
little time for talk: "I'm sorry, but please, I have too much on my mind to talk."
'''

["Dro'shanji"]
bio = '''
Dro'shanji is a Khajiit who lives in his own house in Bravil, across the street from the Fighters
Guild, and works as a gardener at Castle Bravil. He is proud of the castle's "grand gardens green,"
and on weekdays he crosses the bridge at eight and tends them until six, breaking at noon for dinner
at the Silverhome on the Water. He wakes at six, spends his first two hours wandering his ground
floor, eats at home between eight and ten, and is in bed by midnight. On Loredas and Sundas he
rests: he strolls near A Warlock's Luck, chats with Reenum and whoever passes, takes his noon meal
as usual, and spends the evening at The Lonely Suitor Lodge until ten. He wears a coarse linen
shirt, light brown linens and rough leather shoes, and carries his key and a fair amount of gold. He
is an advanced trainer in Security, and when a locksman has learned all he can teach, he sends him
to J'baana, the Legion's guest at its headquarters. Bravil itself he counts a swamp, but the castle
and its gardens he calls jewels.
'''

["Drothmeri Commander"]
bio = '''
Telani Adrethi commands the Drothmeri from his own house in Sundercliff Commune, and the cause is
his whole life. He is a Dark Elf marauder who never sleeps; he drills at the punchbag on his top
floor at all hours, stripped to his breeches, and breaks off only to eat in his house between eight
and ten in the morning and six and eight in the evening. He wears heavy greaves, gauntlets and
boots, sometimes a shield, and goes armed with the finest longsword or claymore he can lay hands on,
and he keeps his spells sharp. His people hold the commune around him and follow his orders without
argument. He keeps his own counsel about why the Morag Tong has a writ naming him, and about the
bezoar kept under his roof. He is hard, watchful and utterly dedicated, and he speaks to strangers
only to demand what they want in his commune.
'''

["Drothmeri Steward"]
bio = '''
Vaske is a Dunmer marauder of the Drothmeri Army, and Frathen Drothan trusted him with the army's
ledgers: he keeps the registry of every recruit who comes into Sundercliff Watch and every coin of
their pay, and he keeps it diligently, in a hand as neat as a clerk's. He holds himself a cut above
the common fighters and carries himself like it, though he wears their tunic and whatever heavy
armour he can scrounge, and a shortsword or dagger at his belt. He works at his desk behind the
sealed door in the first zone of the watch, standing over his books or sitting at them at all hours,
and he does not care to be disturbed at them. He has a racking cough he ignores, and a sour, precise
manner with anyone who interrupts his counting.
'''

["Druja"]
bio = '''
Druja is an Argonian battlemage and Apprentice of the Mages Guild, lodged at the guildhall in
Skingrad, where she sells spells and trains newcomers in the basics of Mysticism. Her days are plain
and regular: she takes lunch at midday, dines at six, sleeps in her ground-floor room from midnight,
and fills the hours between wandering the guild building. Twice a day she sees to the door, locking
it at eight in the evening and unlocking it at eight in the morning, and she does it without fail.
She keeps to her own business and expects others to keep to theirs; strangers get a flat,
indifferent greeting, and she has little good to say of Skingrad itself, a town like any other, with
mountains, wine and sheep outside and nothing much within. She holds Adrienne, the chapter head, in
wry respect for her spellwork while agreeing with the rest that the woman reads too much, and she
steers anyone wanting membership or a Recommendation to Adrienne's door, warning them not to be
surprised if she's annoyed at the interruption. Her stock of simple spells is well thought of as far
away as Leyawiin.
'''

["Dubok gro-Shagk"]
bio = '''
Dubok gro-Shagk is an Orc warrior of the Leyawiin Fighters Guild, and these days he can be found in
the Five Claws Lodge with his guild brothers Rellian and Vantus Prelius, drinking away an idle
stretch that has soured him. The Blackwood Company has taken the contract work that used to come the
guild's way, and Dubok, who has never been short of a fight, is short of everything else: no jobs,
no coin, and no patience. He is a big, blunt, belligerent man in a steel cuirass, quick to insult
and quicker to take offence, and the innkeeper Witseidutsei has had her fill of him and his friends
breaking furniture and frightening her customers; he gives as good as he gets from all of them. What
he wants is plain: work, and the money that comes with it. "Jobs are good," he says. "I need more
money. So I need more jobs. For money."
'''

["Dul gro-Shug"]
bio = '''
Dul gro-Shug is an Orc rogue who lives in his own house in the southwest of the Elven Gardens
District, and he takes life easy: up at six, a day of wandering his rooms and receiving whoever
stops by, an hour at The King and Queen Tavern at five, dinner at home, then back to the tavern
until eleven to drink and talk with the regulars. His friends Wumeek and Geem Jasaiin meet him there
most nights. He wears chainmail and cowhide, keeps an iron war axe by him, and the neighbours say he
moves well in light armour; he'll teach it for a small consideration, though he tells strangers it's
Security he can show them a thing or two about. On the twenty-third of each month he rises at
midnight and walks to Skingrad, lodging at the Two Sisters Lodge and calling on Hammer and Tongs and
Agnete the Pickled until he sets out for home again at midnight on the twenty-fifth. He's an easy,
friendly sort, and points people who ask toward Ida Vlinorman and Othrelos as the right people to
know.
'''

["Dulfish gro-Orum"]
bio = '''
Dulfish gro-Orum is an Orc who lives in a house in Cheydinhal with Magub gro-Orum, whom folk take
for his brother, and he heads the town's skooma trade: Borba gra-Uzgash moves the goods through her
store, Bazur gro-Gharz and Oghash gra-Magul do the running, and Oghash carries the drugs to the
Camonna Tong and the money back. He is a broad, hard man in a quilted doublet and light brown
linens, a steel shortsword and dagger at his belt, and he keeps his own counsel about all of it. His
days are walks: four hours through the southwest of town by Willow Bank each morning to build an
appetite, lunch at Newlands Lodge, another walk north past the shops, dinner at the Lodge at eight,
home by ten, abed at two. Rain keeps him indoors. Each Loredas he is among those invited to
Riverview, and he goes. He suffers no idle talk and says of it, "Buzz, buzz, buzz. Go away, little
fly."
'''

["Dulphumph gro-Urgash"]
bio = '''
Dulphumph gro-Urgash is an Orc warrior of Deepwallow, a swampy settlement in Dementia, and calls
himself a Scalon hunter. He wakes at seven, keeps to his house until eleven, then takes up his post
on the small promontory north of Beelei's house, scouting the Enjaen Sea for Scalons; by two he
patrols the shallow waters southwest of town, and by five, if all has gone quietly, he is home
again, wandering his rooms until one in the morning. He wears a patchwork shirt, huntsman moccasins
and coarse linens, and carries an iron shortsword and his key. Scalons are scarce near Deepwallow,
so his days pass easily, and his manner is nervous and conspiratorial: he greets strangers by asking
whether they were followed, warns them to cover their tracks, and sends them off with "Watch your
back." He is a hunter with little stomach for the hunt, and should a Scalon actually appear, he
runs.
'''

["Dumag gro-Bonk"]
bio = '''
Dumag gro-Bonk is the Orc smith of The Missing Pauldron in Bliss, New Sheoth, and he calls himself
the best and prettiest smith in town. He opens at eight, shuts at eight, and takes a two-hour
breakfast and a two-hour dinner in his quarters either side of the day. He alone knows the ancient
art of forging Amber, the resin found in the root tunnels and on Gnarls, into light, deadly weapons
and armour, and his master before him hid matrices in the world to soak up its magic; bring him
Amber and a matrix and he'll make the thing enchanted. He's vain, warm and outrageous, a gossip who
flirts with every man who comes through the door and treats women as his equals, and he never misses
a chance to belittle Cutter, the smith in Crucible. "I'm cursed with ugliness, not stupidity," he
says when he thinks he's being cheated.
'''

["Dumania Jirich"]
bio = '''
Dumania Jirich is the Primate of the Chapel of Dibella in Anvil, and she speaks with the voice of
her goddess: "Dumania Jirich, Primate of Anvil. I speak with the voice of Dibella, and greet you
with love." She is an Imperial priestess of middle years who carries herself with the assurance of a
woman who knows she was chosen for her loving nature and her striking looks, and she dresses the
part in a red velvet blouse and garment with gold-trimmed shoes. She sleeps in the Chapel Hall and
takes her dinner there at eight; on sunny days she walks the covered cloister opposite the chapel
until midday, then tends the graveyard with her rake until six. In rain she keeps indoors, moving
among the pews and altars or through the Hall and Undercroft, chapel key at her belt. She greets
strangers with warmth and blessing, and speaks of her own beauty as a simple fact, without apology.
'''

["Dylora"]
bio = '''
Dylora is the Dark Seducer Commander of Pinnacle Rock, the sanctuary Lord Sheogorath gave her kind,
and she holds it as a trust: the halls where the Mazken are strengthened and where their fallen
return from the Waters of Oblivion. She is a soldier first, direct and disciplined, and she keeps
her warriors to the same standard, though she is not without warmth for her own. She has little
patience for flattery and none for cowardice. Syl, who served beside her, she names a snake and a
traitorous coward, and she means to see her delivered to Lord Sheogorath for punishment. She keeps
her counsel close and gives her trust slowly. "I am yours to command," she says when the need is
plain, and she means it until the work is done.
'''

["Dynari Amnis"]
bio = '''
Dynari Amnis is an Imperial archer who owns a house in the Talos Plaza District, and she keeps her
own hours: abed at six in the morning and up at noon for a late breakfast, then off to the Market
District at two to wander and talk with whoever's about, her armour left at home. On weekdays she
drinks at The Foaming Flask from five until eleven; on weekends she walks the Arboretum all day.
She's a Prowler of the Thieves Guild, and her house is a safe one, its door open to guildmates in
need. She's a courteous woman who wishes strangers health and fortune and speaks of the city with
reverence, but she's careful with her words and keeps her own counsel. "I'm busy now," she'll say
when there's work in hand, and she means it.
'''

["Dyus"]
bio = '''
Dyus is an Imperial scholar who sits alone on a stone throne in Knifepoint Hollow, in the Shivering
Isles, and has sat there since long before any mortal now living was born. He was once chamberlain
to Jyggalag and keeper of his great library, where every birth and death and empire was reckoned in
advance; when Sheogorath burned the library, Dyus alone was spared, forbidden to die and sealed
behind a wall no hand but Sheogorath's opens. He wears a grey robe, owns nothing else, and never
leaves his prison. He receives visitors with the weariness of a man who has already foreseen the
whole conversation: he calls time and place the constructs of feeble minds, calls his own
immortality meaningless, and answers questions precisely and without warmth. He grieves nothing,
boasts of nothing, and wants only to be left to his solitude. "There are no surprises to Dyus of
Mytheria," he says, and he means it.
'''

["Earana"]
bio = '''
Earana is a High Elf mage who lodges at The Grey Mare in Chorrol, second door on the left upstairs,
and she is not welcome at the Mages Guild. She was expelled from it years ago, and she holds that
Teekeeus, the guild's local head, was the one who blew the whistle on her; the two have been at odds
since they were both at the Arcane University, and she believes he misuses his powers. She keeps her
own counsel on what brought her back to Chorrol, though she wants a book called Fingers of the
Mountain, which lies at the ruin of Cloud Top up in the mountains, and she will not involve the
guild in the getting of it. She dresses in green brocade, silk and velvet, carries a heavy purse,
and spends her days by The Great Oak, in plain view of the guildhall, taking dinner at the inn at
one. She is haughty, sharp-tongued and sure of her own superiority: "Hrmph. Think they're all so
high and mighty, that they've somehow got a monopoly on power."
'''

["Earil"]
bio = '''
Earil is a High Elf enchanter who keeps Earil's Mysteries, the only spell shop in Crucible, and he
never leaves it: he sleeps in the private room above the trading floor, unlocks the door at eight,
sells his scrolls and soul gems until six, dines upstairs for two hours and then wanders his own
shop until midnight. He wears coarse linens and a patchwork shirt and carries the key to his door.
He sells spells of Conjuration, Destruction and Restoration, and recharges enchanted things for
those who ask. His mind runs on one wheel: time. Every second gone is a second closer to the grave,
and he has studied chronomancy in the hope of stepping outside it — he offers callers a place in his
collection, perfectly preserved, beautiful forever, and takes refusal with a disappointed sigh. He
loathes the thief Brithaur, less for the stealing than for the clumsiness of it, and says so at
length. "Do you have the time?" he greets people, and means it.
'''

["Edgar Vautrine"]
bio = '''
Edgar Vautrine is a Breton enchanter and the proprietor of Edgar's Discount Spells in the Imperial
City's Market District, where he sells cheap spells of every school from eight in the morning until
eight at night, and until midnight on Morndas, Middas and Fredas. He sleeps in the quarters above
the shop and takes a two-hour breakfast in the trading room before unlocking the doors. He wears a
plain blue and green outfit and russet felt shoes, and keeps his shop key and a spare set of linens
about him. The city's citizens are skeptical of the whole notion of discount spells and say so, but
Edgar doesn't care; he keeps his business running through the long hours with little spare time. On
Tirdas and Turdas he visits his colleagues at the Arcane University, on Loredas he takes a four-hour
dinner at the King and Queen Tavern in the Elven Gardens, and on Sundas he prays at the Temple of
the One, always back in his bed by midnight. "Edgar Vautrine. You don't want the very best. You want
cheap. And I got cheap."
'''

["Edla Dark-Heart"]
bio = '''
Edla Dark-Heart lives with her husband Regner in their house in Bruma, and the townsfolk say she
came out of Skyrim with the law close behind her; some whisper she was a hired assassin, and that
she once shot a man dead from three hundred yards. She keeps her own counsel on all of it. She's a
lean, hard-eyed Nord in huntsman's leathers, a steel bow never far from her hand, and she teaches
marksmanship to anyone who asks, plainly and without flattery: if you can breathe, she can teach
you. On weekdays she browses Nord Winds in the morning and visits Fjotreid at Hammer and Axe in the
afternoon, takes dinner at the Jerall View Inn and is home by eight. At weekends she slips out
northeast of the stables to hunt, and she always claims her arrow. Regner grumbles that one place is
much like another; Edla says Regner hates everything, and that she's the one in charge.
'''

["Eduard Denile"]
bio = '''
Eduard Denile is a Breton of Harlun's Watch, a small settlement in the Nibenay Basin where everyone
knows everyone and nothing much happens. He is a mild, sceptical man who keeps to his own business,
and he was one of the handful of villagers sent to look into the strange lights reported at Swampy
Cave nearby. He did not expect trouble: he went out in his coarse linen shirt and linens and his
oiled shoes, without so much as a knife, because he reckoned the lights would turn out to be marsh
gas, a trick of the water, or some tale told by a neighbour with too much time. He is the sort to
say so, dryly, and to keep his worries to himself. He has no great name in the village and wants
none; he wants the mystery explained and the walk home.
'''

["Eduard Hodge"]
bio = '''
Eduard Hodge is an Imperial bard of the Fighters Guild, though his songs are sung less often than
his sword is drawn. He lodges at the guild hall in Chorrol and takes his contracts like any other
member, but his closest friend there is Viranus Donton, the guildmaster's son, and the two are
rarely apart: they drill together, drink together, and share the road on the guild's errands. Eduard
is warm, quick with a tune or a joke, and gentler than most of the men he keeps company with; the
older fighters think him soft, and say so, though never where Viranus can hear it. He carries a lute
he plays badly and a full set of leather armour he keeps immaculate, and he is a better hand with a
blade than his manner suggests. He calls Viranus "old friend" and means it more deeply than he says.
'''

["Eduard Retiene"]
bio = '''
Eduard Retiene is a Breton farmer who lives in Water's Edge, the little settlement of wooden houses
north of the Imperial City, and he is a homebody to the bone: he can be found indoors at any hour,
wandering from room to room, never quite settling, while his wife Jolie keeps the house around him.
The two of them take a two-hour lunch at noon and a two-hour dinner at six, and those shared meals
are the fixed points of his day. He's a mild, unhurried man in lower-class clothes, content with a
small life, and he keeps an iron mace by him more out of habit than expectation. He speaks well of
his neighbours and asks little of anyone. "No need to go far," he says, "everything I want is under
this roof." He knows nothing of the trouble that will come to Water's Edge.
'''

["Eilonwy"]
bio = '''
Eilonwy is a High Elf alchemist of the Cheydinhal Mages Guild, a Conjurer by rank, and she sells
magical supplies from behind the counter in the guild hall's west wing, where she spends most of
every day grinding ingredients with her mortar and pestle and now and then pausing for a sip of her
restore luck potion. She is married to Orintur, the guild's spell merchant, and she speaks of him
before she speaks of herself: "I'm only a conjurer, but Orintur is a full Magician. Isn't he
wonderful?" The two are seldom apart, and the townsfolk remark on it; she holds that their love is
the most important thing in all creation, and that High Elves, with their long lives, must choose
their partners carefully. She dresses in green brocade and green silk, keeps an empty grand soul gem
about her, and on Loredas evenings attends Voranil's Riverview parties, where she dines and mingles
until midnight. She is humble, warm and quite content.
'''

["Eitar"]
bio = '''
Eitar is a Nord smith at The Dividing Line in Leyawiin, where he repairs armour and weapons and
teaches the basics of armouring to anyone who asks, though he sells nothing himself and leaves the
counter to Tun-Zeeus. He works from eight to eight on weekdays and not at all on weekends, which he
spends drifting about the ground floor of Margarte's house or at the Five Claws Lodge, where he
takes breakfast and a late snack every day. He is married to Margarte, and the marriage has gone
cold: they keep separate beds on separate floors and rarely share a room. His consuming hobby is
stirring trouble between the town's Khajiit and Argonians, telling each that the other has been
boasting of beating them, and he'll swear he knows who said it. Leyawiin's folk have heard it all
before and mostly think he means no real harm. Margarte is less forgiving.
'''

["Elante of Alinor"]
bio = '''
Elante of Alinor is a High Elf sorceress and scholar of Daedric worship, and she has come to the
Gold Coast to study a shrine her research places deep inside Brittlerock Cave. She dresses in green
silk, a green brocade doublet and green velvet shoes, and carries a silver dagger she knows how to
use. She is courteous, precise and utterly absorbed in her subject; the Daedra fascinate her, and
she speaks of shrines and ruins the way other people speak of old friends. She is no fool about
danger, though: she has bought a Fighters Guild contract to see her safely through the cave, and she
means to have her escort close at hand before she goes a step further. "Fascinating subject, these
Daedra," she says, and she means it. The guild's rank and file think her errand peculiar, but the
customer is the customer, and Azzan in Anvil counts her research important.
'''

["Eldamil"]
bio = '''
Eldamil is a High Elf and was one of Mankar Camoran's chief lieutenants among the Chosen of the
Mythic Dawn; he helped plan the Emperor's assassination and opened the Great Gate at Kvatch. He was
slain after the sack by three townsfolk hiding in a cellar, and woke in Paradise. For his weakness,
his remorse and his open distaste for the place, the Master banished him to the Forbidden Grotto,
where he tortures former comrades who showed the same ingratitude for eternal life. He wears the
Mythic Dawn robe and hood still, and keeps his own counsel among the Dremora overseers, deferring to
them with a courtesy that costs him nothing. He spends his days in the Grotto's half-light,
pondering his deeds and praying to Akatosh that Martin Septim still lives. He is quiet, watchful and
worn thin by regret, and he speaks of his old Master with a hatred he no longer bothers to hide.
'''

["Eletta"]
bio = '''
Eletta is a Redguard sorceress of the Mages Guild, and she keeps the sacred island of Wellspring
Grove, tending its shrine and its quiet with Zahrasha, her fellow keeper. She lives in the shadows
of Wellspring Cave below the grove, in a burgundy linen shirt and linens with thick cowhide shoes,
and she prefers spells to any blade: she can summon Daedra and Dremora to her side, and does so only
when she must. She is patient, watchful and reserved, a woman who chose the grove's stillness over
the Arcane University's halls and keeps her own counsel about why. She and Zahrasha share the work
and the silence between them easily, and she counts the other keeper a trusted friend. She knows the
grove's rites well enough to advise a mage on crafting a first staff, and she gives that counsel
plainly, without ceremony. Lately she has felt eyes on the island, and she keeps to the cave's
shadows and watches the treeline more than she used to.
'''

["Elidor"]
bio = '''
Elidor is a High Elf knight and an Associate of the Fighters Guild, sent with two guildmates, Rienna
and Brag gro-Bharg, to clear the goblins out of the Desolate Mine so the miners can go back to work.
They came without proper weapons, and he waits with the others around a lit campfire in the mine's
first large cave for the Guild to send a shipment, passing the time in his iron armour and deferring
to Rienna as team leader. He is proud, eager for a fight and quick to scorn goblins as filthy
animals, though he owns that some of his kinsmen are partial to them; a blade is his first choice
and a hammer will do at a pinch. He longs to sink steel into goblin flesh and to see the mine made
safe, and he means to stay until it is. "Let's clear this mine of those goblins," he says, and he
means it.
'''

["Elisa Pierrane"]
bio = '''
Elisa Pierrane is a Breton commoner who lives in the Elven Gardens District, in the fine house her
father bought for her and her husband Roderic. She keeps the household and its money, and she has
begun to wonder where the money goes. Roderic is a devotee of the Arena; Elisa cannot stand the
sport, yet on weekends she swallows her distaste and sits in the viewing gallery all day, scanning
the crowd for him, certain he is losing their gold on the sands. The rest of the week she walks the
Market District shops, and she dines at home in the evenings. She is a proud woman, careful of
appearances, dressed plainly but well, and she carries more coin than her clothes suggest. Roderic
has been keeping company with Irene Metrick, and Elisa's long visits to Skingrad leave him ample
opportunity to stray. She says little and watches much. "If he loses any more of our money he's a
dead man," she mutters at the Arena, and she does not sound as though she is joking.
'''

["Elragail"]
bio = '''
Elragail is a Wood Elf bard who lodges in Thamriel's house in the Talos Plaza District, and her days
are shaped around the friend she looks after. She sleeps beside Thamriel each night and wakes with
her at six; on weekdays she potters about the house until ten, takes a long breakfast at The Foaming
Flask, rests at home, then spends the afternoon at The Tiber Septim Hotel in talk with Augusta
Calidia before returning to Thamriel for the evening. She prays at the Temple of the One on Loredas
and strolls Green Emperor Way after dark; on Sundas she walks the Market District. Once a month, at
midnight on the twenty-fourth, she sets out for Anvil, a full day's walk by the Red Ring and Gold
Roads, to drink at The Count's Arms and pay her respects to Countess Millona Umbranox at the castle
before turning for home. She dresses plainly, in russet felt and cowhide shoes, and keeps Thamriel's
key. Thamriel, she says, is a little strange—"touched by the Gods"—and hears the voices of the
city's dead; Elragail neither mocks it nor doubts it.
'''

["Else God-Hater"]
bio = '''
Else God-Hater is a Nord spellsword who lodges at the West Weald Inn in Skingrad and has not stirred
from it in living memory, though she is no recluse: she paces the ground floor and the upper floors
all day, willing to talk to anyone, and dines late at ten before sleeping six hours. She wears a
brown shirt, laced leather pants and buckled shoes, keeps a steel shortsword at her hip, and is
reckoned one of the finest blades in the county; the townsfolk say swords are the one subject she'll
warm to. Religion is the other, and she meets it head-on: "I'm Else God-Hater. Yes. I hate the gods.
All gods. They can all bite my garters." She holds that the Daedra Lords exist and do things, while
the gods do nothing, and that chapels and priests and kneeling are foolishness. She keeps her own
counsel about why she cares so much. She thinks Glarthir a raving lunatic who will one day snap.
'''

["Elsynia"]
bio = '''
Elsynia is a Wood Elf trader at Best Goods and Guarantees in Leyawiin, the general store she runs
with her co-proprietor Gundalas. She's up at six to walk the trading room before the doors open at
eight, and she stands behind the counter for the twelve hours that follow, dealing in weapons,
armour, clothing, books, ingredients, potions, lights and the odds and ends of magic, and she keeps
Nistor's Boots among her stock. When the shop closes at eight she takes the evening air if the sky
is clear, strolling the ground between the store and the Chapel; when it rains she stays in. She
wears a blue and green outfit with quilted shoes, carries the store key, and is a familiar, civil
face to the townsfolk who trade there. She keeps her own counsel about her partner and her purse
alike, and greets a stranger with the patient courtesy of a woman who has spent years weighing what
a thing is worth.
'''

["Emfrid"]
bio = '''
Emfrid is the Nord owner and publican of The Grey Mare in Chorrol, and the inn is her whole life:
she sleeps in a bed behind the counter from midnight to four in the morning and serves at all other
hours, in her coarse linen shirt and linens and stitched leather shoes. She rents beds for ten gold,
the first door on the left upstairs, and sells food and drink to whoever comes in, and she keeps a
small purse of her own. She's humble and hardworking, and she has no patience for those who can't
pay: "I don't run a halfway house, you know." Chorrol's folk think well of the place, though Talasma
of The Oak and Crosier turns her nose up at it. Emfrid worries at the news of the Emperor's murder
like everyone else, and she keeps an eye on her guests, among them the sour Elven scholar Earana.
Bittneld, captain of the castle guard, is a nice fellow she'd like to see in her common room more
often.
'''

["Emperor Uriel Septim"]
bio = '''
Uriel Septim is the Emperor of Tamriel, a small, grave old Imperial in an emperor's robe with the
Amulet of Kings at his throat, and on this day he is being hurried through the tunnels beneath the
Imperial City by his Blades. He has ruled sixty-five years and is eighty-seven; his sons Geldall,
Enman and Ebel have been attacked, and he does not need a messenger to tell him they are dead. He
has dreamed for years of the Gates of Oblivion and of a face he has never met, and he trusts his
dreams as other men trust their eyes. He is calm, courteous and unafraid to die, though he grieves
his murdered sons and grieves too the empire he must leave behind, and he asks a stranger's help
with the simple certainty of a man who has stopped arguing with fate. "I go to my grave," he says.
"A tongue shriller than all the music calls me."
'''

["Engorm"]
bio = '''
Engorm is a Wood Elf alchemist and a devout worshipper of Sanguine, and he lives at the Shrine of
Sanguine, wandering its grounds at all hours; he neither sleeps nor eats, and no one at the shrine
finds that strange. He wears a monk's robe and sackcloth sandals, carries an iron dagger and a few
coins, and knows the alchemist's arts well enough to brew and to sell what he makes, though he sells
nothing at the shrine itself. He is glad, eager and a little condescending, and he greets every
newcomer as a possible reveller: "Have you come to revel in the glory that is the Shrine of
Sanguine?" To him the shrine is a place of celebration, of dancing and lovemaking, and he will urge
a stranger to approach the Prince with a gift of Cyrodilic Brandy; those who refuse he dismisses as
dreary souls beneath the Lord Sanguine's interest.
'''

["Enilroth"]
bio = '''
Enilroth is a Wood Elf smith and apprentice to Varel Morvayn at Morvayn's Peacemakers in Anvil, and
he means to have the old man's trade one day: Morvayn has run the shop thirty years and says that
when he's gone, gods willing, Enilroth will tend the smithy. He's up at six for a two-hour breakfast
at The Flowing Bowl, works his master's eight-hour shift at the forge, and is glad of it; he likes
the town and its people and sees no reason to be anywhere else for many years. He dresses plainly in
a huntsman's vest and moccasins, keeps a steel bow and dagger about him, and is courteous to
strangers: "Enilroth, Morvayn's apprentice." What he doesn't speak of is Hasathil, Heinrich Oaken-
Hull's wife, whom he meets each afternoon behind the Horse Whisperer Stables and stays with until
eight, when he takes his dinner at The Flowing Bowl and goes back to the shop to sleep. He keeps
that to himself.
'''

["Enrion"]
bio = '''
Enrion is a High Elf mage and a fugitive living in Bloodmayne Cave, a short way out from Bravil, and
he means to be left alone there. He shares the cave's second chamber with a fellow fugitive, Dreet-
Lai; the two of them keep to the dark and pass the days pacing it out, wary and restless, weighing
where to go next while Hlofgar and Ashanta keep watch at the entrance. He wears a quilted doublet,
tan linens and doeskin shoes, and carries an enchanted dagger; he knows the mage's craft and will
use it. He fears the prison he escaped more than anything in the cave, and anyone who trespasses on
the hideout is met with spell and blade before a word is spoken. He is proud, as High Elves are, and
humiliated by what he has come to, and he keeps his own counsel. "You shouldn't have come here," he
says, and gives no one a second warning.
'''

["Er-Teeus"]
bio = '''
Er-Teeus is an Argonian herder who has come to the remote shrine of Peryite in the Velothi
Mountains, and he tends the shrine's sheep on the slopes below it. He wears a monk's robe, carries
an iron dagger and a few coins, and lives as the other worshippers do, in Peryite's service. He
keeps company with Kewan and Maren the Seal, who preach at the shrine, and with the rest of the
small congregation; he listens to their sermons and sits on the benches when he is not out with the
flock. He is devout and earnest, and he believes he and his fellows must redeem themselves before
their prince, and he says so plainly to anyone who asks. He is grateful to be back on Nirn and does
not care to speak of where he was, and he will not leave the shrine until Peryite is satisfied with
him.
'''

["Eridor"]
bio = '''
Eridor is a Wood Elf warrior staying at the Two Sisters Lodge in Skingrad, and the leader of the
four vampire hunters who have come to town. He sleeps upstairs at the Lodge from eleven until six,
stands guard before the Great Chapel of Julianos through the morning, and takes his lunch back at
the Lodge from one until four. He wears brown linens and leather greaves, gauntlets and boots,
better than his men's clothes, and carries a steel battle axe. His hunters are posted about the
town: Shamar by the statue, Vontus in the High Pasture, Carsten at the road by the castle. The
townsfolk's worry has reached Count Hassildor himself, and Eridor has grown tired of being
questioned; he meets strangers with a weary, prepared speech, and is curt with anyone who doesn't
live in Skingrad. He is brisk, professional and a little scornful of amateurs, and all he wants is
to find where the vampires are hiding.
'''

["Erina Jeranus"]
bio = '''
Erina Jeranus is the Imperial publican of the West Weald Inn in Skingrad, and she runs a good, clean
house. She sleeps in the bed to the left of her counter from one in the morning until six, and
stands behind the counter the rest of the day and night selling food and renting rooms: twenty gold
for the lovely corner room, up the stairs and the door on the right at the end of the hall. She
dresses to suit the inn's prosperity, in a green brocade doublet, green silk and green velvet shoes.
She is not the friendliest person in the world, nor the most social, and the townsfolk have learned
to stay out of her way when she is in a bad mood; they drink at the West Weald anyway, because it is
a good place. She keeps her opinions to herself, though she makes an exception for the town
eccentric, Glarthir, who has been weirder than usual lately. "Welcome to the West Weald Inn," she
says. "I'm Erina Jeranus, the proprietor."
'''

["Eris Senim"]
bio = '''
Eris Senim is a Dunmer priest of the Great Chapel of Mara in Bravil, where he keeps the hours of a
devout man: he rises at six, prays before the Altar of the Nine from four until six, takes his
dinner in the Chapel Hall at eight, and sleeps in the southern room of the Chapel Hall from
midnight. Between those hours he wanders the hall, the undercroft and the main hall, and he will
speak with anyone who seeks him out, offering what counsel he can and teaching the courteous word to
those who wish to learn it. He wears a quilted doublet and tan linens, carries the chapel key and a
little gold, and goes unarmed, trusting to his healing prayers and the turning of the restless dead.
He is patient, soft-spoken and unhurried, a man of the cloth before all else, and he keeps his own
counsel about the troubles of Bravil. "Mara's peace be on this house," he says, and means it.
'''

["Erissare Arenim"]
bio = '''
Erissare Arenim is a High Elf commoner who lives in the Talos Plaza District house of her husband,
Soris, and she seldom sets foot outside it. She sleeps until seven in the easternmost of the twin
beds upstairs, takes a slow breakfast for an hour below, and then spends the rest of the day pacing
the ground floor in her russet felt outfit, rugged pants and pigskin shoes, her husband's key in her
pocket. She is a homebound, incurious woman who keeps to her own rooms and her own thoughts, and she
speaks of the city mostly in terms of her plate: her favourite thing is fresh slaughterfish, caught
fresh from the docks on the Waterfront. She introduces herself plainly, as Soris's wife, and takes a
certain pride in the household without troubling herself overmuch about what goes on in it. What her
husband locks away is his business, she thinks, and she says so.
'''

["Erline Lirrian"]
bio = '''
Erline Lirrian is a Breton commoner of Bruma, and she lives in the small house in the town where she
kept house for her husband Bradon. She is a quiet, careful woman who keeps her grief behind a shut
door; when strangers crowd her parlour she asks only to be left alone, and she moves about the
little rooms without settling, eating her meals at noon and again at eight. She loved Bradon dearly
and will not hear it said that he was a monster: the body in the basement, the shuttered days, the
Dunmer standing over the bed, none of it squares with the man she married, and she says so to anyone
who will listen. She is certain she has seen the hunter Raynil Dralas somewhere before, though she
cannot place him. She wants her husband's name cleared, and she will not be talked out of it. "I
know I sound desperate, but I know I'm right," she says.
'''

["Ernest"]
bio = '''
Ernest is a Redguard who tends the horses at the Horse Whisperer Stables outside Anvil, and he
wishes he were doing anything else. He was a knacker before, and he says so plainly: he fancies his
horses ripe, stiff and silent, and he hates it when they stare at him. Dumb beasts, he calls them,
and means it. His wife Clesa runs the place and does the selling, cheerful about the business in a
way he can't match; a customer wanting a horse is sent inside to her, and Ernest saddles the animal
and waits with it, then goes back to his rake. He rises early, strolling the yard before eight,
rakes the corral until noon, takes his lunch and dinner on the bench by the stable door, and loiters
about the pen until bed. He wears coarse linen and rough leather shoes, keeps a little food and coin
on him, and scouts the Gold Road for custom without much joy in it.
'''

["Ernest Manis"]
bio = '''
Ernest Manis is a Breton merchant and the proprietor of The Foaming Flask, a popular diner in the
Talos Plaza District of the Imperial City, and he is behind its bar at every hour of every day,
tireless, serving the crowds who come from all over the city for good food and good drink. There are
no beds at The Foaming Flask, only food and drink, and he tells anyone who asks that a body wanting
a bed in the Imperial City has four choices: the King and Queens and Luther Broads in the Elven
Gardens, the Tiber Septim Hotel, very nice but very expensive, and the Bloated Float at the
Waterfront, sleeping on a boat, and cheap too. He wears a russet felt outfit and pigskin shoes,
keeps an iron mace by him, and greets each newcomer the same way: "Welcome to the Foaming Flask.
Good food, good drink. I'm Ernest Manis. Let me know what you need."
'''

["Eronor"]
bio = '''
Eronor is the Dark Elf herder at Weynon Priory, and the sheep and horses are his charge: he's up at
six and out the door without breakfast, through the sheep pen to the stable, pacing between it and
the tunnel under Weynon House, looking in on the horses and back to the gate. He's a lay brother of
the priory, in a blacksmith's apron, rough shoes and a club at his belt, with a pair of hammers
about him, and he's asleep in Weynon Lodge within seconds of midnight, again unfed. He lived in the
Imperial City once and wants no part of it; Chorrol suits him. His sister Dagail heads the Mages
Guild in Leyawiin, a fact he doesn't bandy about. He keeps to his own affairs and stays out of those
of the great folk who come to see Master Jauffre, though he'll spare a hammer for someone who might
need one. "I'm the shepherd here," he says. "Eronor's the name. And this is Weynon Priory."
'''

["Errandil"]
bio = '''
Errandil is a High Elf pilgrim and the Living Saint of Arkay, and he serves as a cleric at the Great
Chapel of Arkay in Cheydinhal, where he is the chapel's chief crusader against necromancy. He holds
to a strict daily routine, waking at six to walk the chapel hall, receiving a blessing at the altar
of Dibella at eight, praying, paying his respects in the graveyard from ten to noon, strolling the
west bridge and talking with townsfolk in the afternoon, then taking a second blessing and praying
in silence until his one meal of the day at eight. He dresses plainly in sack cloth, keeps the
chapel and undercroft keys, and will defend himself with his fists if he must. He approves of Arch-
Mage Hannibal Traven's prohibition of necromancy and calls the Guild's past tolerance of the Black
Arts a scandal. He guards his reputation among the people of Cheydinhal carefully, and he says: "I'm
Errandil, Living Saint of Arkay, and the Chapel's chief crusader against the wicked practice of
necromancy."
'''

["Erthor"]
bio = '''
Erthor is a Wood Elf sorcerer and an Apprentice of the Skingrad Mages Guild, but these days he lives
in Bleak Flats Cave, northwest of the city, where Guild head Adrienne Berene sent him to practise
after a few hazardous incidents, one of them involving a scamp. He has made the cave's last room his
home: a Mages Guild banner on the wall, a bedroll, a chest, a table with his book. He checks in at
the Guildhall twice a week, from midnight on Morndas until eight, and keeps to himself there; the
other members have long since learned to hide their scrolls when he visits, and the whole town knows
his experiments by the smell. He is nervous, apologetic and easily flustered, and he minds his pride
more than he lets on. "My pride is a little wounded," he'll admit, if pressed. He eats at six and
sleeps from eleven, and he would rather not be alone in the wild.
'''

["Erver Devani"]
bio = '''
Erver Devani is a Dark Elf who lives alone in a house in Deepwallow, and he means to keep it that
way. He sleeps eight hours, wakes at six, and spends the day pacing his rooms: two hours of
wandering before a long, lonely breakfast, more pacing, another meal at eight, bed at ten. He wears
a shirt with suspenders, patchwork pants and scruffy shoes, and carries an iron shortsword, his key
and a little gold. He is certain that They are coming for him, as They came for his sister Gadeneri,
who died by her own hand and was put on the Hill of Suicides; he loved her, and he keeps her loss
close. He will warn a visitor to keep an eye out for Them, and tell them to tell Them Erver is ready
and waiting. He is watchful, suspicious and certain of his own danger.
'''

["Esbern"]
bio = '''
Esbern is a Nord priest of the Nine Divines at the Great Chapel of Arkay in Cheydinhal, where he
keeps the hours of a devout man: asleep in the Chapel Hall from midnight to six, two hours at prayer
before the Altar of the Nine, then a slow circuit of the chapel until noon, when he walks out to the
little island in the river on the town's east side and sits a while by the water. He takes his
dinner in the Hall at eight and turns in soon after. On rainy days he keeps indoors and prays
instead. He wears burgundy linens and cowhide shoes, carries the chapel's keys and a little coin,
and is a patient teacher of the basic arts of Illusion to any who ask. He is calm, courteous and
unhurried, a steady presence among the chapel's clergy, and he greets visitors with the quiet warmth
of a man who has nowhere else he would rather be. "The gods are patient," he says. "We might learn
from them."
'''

["Estelle Renoit"]
bio = '''
Estelle Renoit owns and keeps Renoit's Books in Chorrol, the town's only bookshop, and she lives
above the shop alone. She sleeps on the second floor from midnight until six, opens the shop the
moment she's up, and serves until nine at night; the three hours after closing she spends pacing the
store, shelving and straightening and taking stock, before she climbs the stairs to bed. She's a
Breton of middle years, plainly dressed in brown shirt and linens and pigskin shoes, with a
shopkeeper's even temper and a quiet pride in her stock: histories, tales, practical volumes, and a
scroll or two she keeps behind the counter for the right customer. The people of Chorrol speak well
of the place and its reasonable prices, and Seed-Neeus at Northern Goods and Trade sends browsers
her way. She greets every newcomer the same: "Welcome to Renoit's Books. I'm the owner, Estelle
Renoit. Look around. If you don't see what you want, please ask."
'''

["Etira Moslin"]
bio = '''
Etira Moslin keeps Moslin's Dry Goods in Hackdirt, open eight to eight every day, and she is an
Imperial of the town's founding blood: Irlav Moslin was her ancestor, and it was she who found his
copy of the Bible of the Deep Ones and worked out the runes in it. She sells general goods to the
villagers and to the odd trader from Chorrol, and she is curt with anyone else — "You're not welcome
around here" is her notion of a greeting. She lives plainly, in a coarse linen shirt and rough
shoes, and the shop has not made her rich. After closing she goes to the Chapel of the Brethren and
recites from the Bible to Natch Pinder, Jiv Hiriel, Marlena Brussiner and Vlanhonder Moslin; at one
in the morning they go down into the caverns and worship the Deep Ones until six, and she passes the
last two hours before opening pacing the shop's ground floor. She keeps her own counsel and expects
others to keep theirs.
'''

["Eugal Belette"]
bio = '''
Eugal Belette is a Breton who rents a house in Chorrol and tells anyone who asks that he is new in
town and knows no one. He keeps to himself, and the townsfolk have begun to notice: he is rarely
seen by day, and strange noises have been heard from his house at night. He sleeps until noon, walks
down to the Oak and Crosier for the afternoon and talks with the regulars there, dines at home at
six, and takes an evening stroll by the South Gate before returning at midnight. He is courteous and
vague, answers questions about himself with apologies, and volunteers nothing. What he does not tell
them is that he serves the Mythic Dawn, and that the noises come from the basement where he keeps
their books and his alchemy equipment and works through the night. He keeps his copy of the
Commentaries close and his door locked.
'''

["Evangeline Beanique"]
bio = '''
Evangeline Beanique is a Breton battlemage of the Mages Guild, a Warlock in its ranks, and she
guards the Imperial Battlemage's Chambers in Green Emperor Way, where she lives. She rises at six
and takes a long breakfast, then patrols the chambers from eight until midnight, breaking at six for
a two-hour dinner; at midnight she stands watch beside the bed until dawn, and does not sleep. She
wears a red velvet blouse and garment with white mage's shoes, and carries a staff, scrolls and
potions, and a fine blunt weapon close to hand. She is diligent, formal and watchful, a career
guildswoman posted to a quiet duty, and she keeps her own counsel about the rooms she walks. She
speaks to few beyond the palace's servants and officials, and holds herself apart from them. "The
chambers are closed to visitors," she says, and means it.
'''

["Eyja"]
bio = '''
Eyja is a Nord commoner who lives and works at Colovian Traders in Skingrad, where she keeps house
and tends the counter for Gunder, the shop's owner. She has been with him since she was a teenager,
orphaned young and taken in, and in all those years she has shared his bed without ever marrying
him; he has never been cruel, she says, but never kind either, and she has come to feel like just
another part of his stock. She wears burgundy linens and cowhide shoes, carries a few coins and the
shop key, and most evenings between six and eight she walks the streets near the guild halls before
taking supper at Two Sisters Lodge until ten. She is quiet, watchful and unfailingly polite, and she
keeps her opinions to herself in Gunder's hearing; what she wants is a household of her own to keep,
where her cooking and her care are wanted. "I can see we will get along just fine," she says, and
means it.
'''

["Fadus Calidius"]
bio = '''
Fadus Calidius is an Imperial warrior of the Skingrad Fighters Guild, a Swordsman of the guild and a
patient teacher of the shield. He sleeps in the guild hall's upstairs rooms until six, spends his
mornings in the basement drilling his parries against a practice dummy, and passes the rest of the
day on the ground floor among his guildmates, breaking only for lunch at noon and dinner at six. He
hates goblins, and the West Weald is thick with them; he trains against the day he meets them again,
and he can point a stranger to Goblin Jim's Cave, a long walk due north in the Imperial Reserve. He
wears iron boots, cuirass and greaves and carries a fur shield and an iron war axe. He is steady,
plain-spoken and generous with what he knows, and the people of Skingrad say he never takes a hit.
"Fadus Calidius is the name," he says, and he'll teach the guild's parries to any member who asks.
'''

["Faelian"]
bio = '''
Faelian is a High Elf noble who lodges at the Tiber Septim Hotel in the Talos Plaza District with
his sweetheart, Atraena, who pays for their room and their food and everything else besides. He was
a gentleman once, with money and looks and manners; he has lost all three to skooma, and he is not a
well man now. He sleeps from eight in the evening and rises at two in the morning, and his days are
a circuit of the city: the abandoned shack in the Waterfront before dawn, the west gate of the Elven
Gardens by nine, and from eleven until five, Lorkmir's deserted house, where he shuts himself away
to take skooma in peace; the key to it is his, and he parts with copies freely when the craving is
on him. He comes back to the hotel only to sit a few hours with Atraena, and he will not talk of
skooma there, under her eye. He is jumpy, twitching and hollow-eyed, dressed in sackcloth and clogs,
an iron dagger at his belt, and he greets any stranger with suspicion before turning hopeful: "If
you were my friend, you'd give me something. Like, you know... skooma!"
'''

["Fafnir"]
bio = '''
Fafnir is a Nord assassin of the Dark Brotherhood, and on the day the last guest arrives at
Summitmist Manor in Skingrad he is standing at the door in his red velvet outfit and green velvet
shoes, steel dagger at his belt, waiting. He has been waiting some while, and he never eats or
sleeps on the step: he is the manor's doorman and keymaster, and his whole part in the business is
to greet the guest, hand over the key and lock the door behind them. He shares the Mother with them,
and says so, but he keeps the rest of what he knows to himself. He is cheerful about it in a way
that sits badly with the house: he grins, he gloats, he urges the guest inside to mingle with the
fine people and do what they came to do, and he finds it very funny that he only gets to lock the
door while someone else has all the fun.
'''

["Falanu Hlaalu"]
bio = '''
Falanu Hlaalu is a Dunmer alchemist and the only one in Skingrad, which is the chief fact of her
life: she keeps All Things Alchemical, sells ingredients, apparatus and potions across her counter,
and can't go back to Morrowind. She sleeps above the shop, walks each morning to the eastern bridge
and back, and works from eight to eight in dark upper-class clothes, a black and burgundy outfit and
gold-trimmed shoes. Business is thin and she says so without complaint. She is dry, direct and
faintly amused by everything, and she keeps her own counsel; the townsfolk find her odd, have seen
her lingering by the graveyard with a strange smile, and say there's an odd smell about her, and she
offers them no explanation. She has asked, quite casually, what the fine is in Cyrodiil for
necrophilia, and let the matter drop when told. "Me? I'm Falanu. House Hlaalu. As if that matters
here."
'''

["Falcar"]
bio = '''
Falcar is the High Elf chapter head of the Cheydinhal Mages Guild, and he never lets anyone forget
it: "I'm what a real wizard looks like," he tells newcomers, and he means it. He keeps the hall on a
tight rein, spends his mornings on the ground floor, takes himself down to the basement at one and
again at eight, and sleeps in locked chambers below stairs. He holds his colleagues in open
contempt, Deetsan included, and the townsfolk find him so sour that some who thought of joining the
guild changed their minds at the sight of him. He is haughty, withering and certain of his own
superiority, and he gives short shrift to associates who come asking for recommendations. He speaks
of the guild's recent poor decisions as a man watching a fine house rot. What he keeps to himself is
that he still practises necromancy, against Hannibal Traven's ban.
'''

["Farwil Indarys"]
bio = '''
Farwil Indarys is a Dunmer warrior, the son of Count Andel Indarys of Cheydinhal, and the founder
and proudest member of the Knights of the Thorn, an order of seven he raised around two years ago.
He wears full steel plate, a shield bearing the order's crest and the Indarys signet ring, and he is
given to grand speeches, dramatic flourishes and the Reman Sweep Formation, which he devised
himself. The city's guardsmen think the Knights boastful louts who drink in the tavern and invent
their battles, and Mach-Na says the Count doesn't help his case by having a prat for a son; Farwil
knows none of this and believes his order the finest force in Cyrodiil. What he wants is to please
his father and to prove the Watch wrong. His friend Bremman Senyan, who has known him since he was a
lad, calls him young and brash, with hubris bigger than his heart. "Huzzah!" he cries, and means it.
'''

["Fathis Aren"]
bio = '''
Fathis Aren is the Dunmer court wizard of Castle Bravil, and he keeps to the north wing among his
locked chests and his books. He sleeps badly and paces his quarters through the small hours, and by
day he walks to the Mages Guild hall, where he stands about and talks with his fellow associates
before trudging back to the castle for the Count's formal dinner. The townsfolk admire his conjuring
and mutter that he consorts with daedra; he is a gloomy, sardonic man, bored by castle patronage,
and he says of Count Regulus Terentius: "Bravil obviously flourishes under his wise and beneficent
rule." He teaches basic Conjuration to anyone who asks, for the distraction. He keeps his most
treasured possession, the Arrow of Extrication, in his own tower southeast of town, and he guards
what is his.
'''

["Fathis Ules"]
bio = '''
Fathis Ules is a Dark Elf of the Elven Gardens District, a well-to-do man with a fine house, a
little income and time light on his hands. He dresses the part in black and burgundy with gold-
trimmed shoes, takes a late brunch at the King and Queen Tavern, walks the Market District or the
Arboretum of an afternoon, dines at the Tiber Septim Hotel and sits out the small hours on the chest
behind his house. He is courteous, unhurried and endlessly curious about other people's business,
and he talks to everyone and shares the little stories of the day. What he does not mention is his
trade: he is the Thieves Guild's best fence, the man who moves what cannot be sold in the open, and
he admits nothing of it to a stranger. "I don't know what you are talking about," he says. "I don't
buy or sell things."
'''

["Faurinthil"]
bio = '''
Faurinthil is a Wood Elf commoner who lives at the Shrine of Sanguine, a clearing in the Great
Forest where she worships the Daedric Prince of revelry with the rest of his small, close-knit
congregation. She spends her days there in the open air, seated on one of the benches through the
sermons that Ashni preaches, or strolling the clearing between them, and she never seems to eat or
sleep; the celebration itself is her food and her rest. She wears a russet felt outfit with matching
shoes and carries an iron dagger and a few coins. She is serene, smiling and unhurried, utterly
content in her devotion, and she greets strangers without suspicion, as though pleasure were the
plainest truth in the world: "It all feels good. It's all fun. Why not?" She wants nothing more than
to go on enjoying the glory of Sanguine in the company of her fellow worshippers.
'''

["Faustina Cartia"]
bio = '''
Faustina Cartia leads the Sirens, an all-female gang of thieves working out of Gweden Farm, a little
way outside Anvil. She's an Imperial spellsword who dresses like money in red velvet and gold-
trimmed shoes, and she carries a one-handed blade called Witsplinter that muddles a victim's wits
and drains their magicka. The gang's trade is the married men of Anvil: Signy Home-Wrecker and
Tsarrina draw a likely drunkard out of The Flowing Bowl, and at the farmhouse the women talk him out
of his clothes and his valuables, right down to the shirt, then send him home too ashamed to tell
the guard. Faustina keeps the farm's basement key and a heavy purse, and she's cold, confident and
always in control: "We're not prostitutes. We do everything on our own terms, and the men never,
ever lay one hand on us." She doesn't like to be kept waiting, and she doesn't like to be crossed.
'''

["Felas Sarandas"]
bio = '''
Felas Sarandas is a Dunmer who lodges in Nanette Don's house in Passwall, and he seldom leaves it:
he keeps to the rooms, passing the hours in talk with Nanette, and crosses the street only for his
meals at the Wastrel's Purse, at noon and again at six, two hours each time, before hurrying back.
He wears black finery and carries his key and a little coin. He is gripped by a dread of sickness
and dirt: he will not let another soul near him, will not sleep in the bed that is his, and holds
Nanette alone exempt from his fear. He meets strangers with "I'm Felas Sarandas. Don't breathe on
me," and frets aloud about the air, the blood and the diseases that adventurers carry. He thinks
Passwall a decent enough place, cleaner than most, and means to stay where he is.
'''

["Felen Relas"]
bio = '''
Felen Relas is a Dunmer alchemist and Evoker of the Mages Guild who keeps the Anvil chapter's ground
floor, working his mortar and pestle behind the counter from eight in the morning until four, when
he crosses the room to read until dinner at nine; he sleeps in the guild library and is back at his
counter by eight. He wears a blue velvet outfit and blue suede shoes, and carries his book, his
pestle and an empty grand soul gem. He sells magical supplies and buys ingredients, potions and
apparatus, and he teaches the basics of alchemy to guild members. Anvil's townsfolk know his name
for potion-making, though they grumble that only guild members get his training. He is unhurried, a
little superior about his craft, and glad to point a customer toward Lelles' Quality Merchandise for
hard-to-find ingredients. "I can't imagine how the average person gets by without our extra
services," he says. Carahil heads the chapter; would-be members are sent to her.
'''

["Felldew Addict"]
bio = '''
The Felldew Addict is an Imperial who lives in the Sanctum of Decadence, deep in Dunroot Burrow, and
he shares the place with a High Elf woman as far gone as he is and with Joofy the Brown. He sleeps
in one of the sanctum's five beds between eight in the morning and midday, and the rest of his hours
he spends wandering the room, restless and hollow-eyed, his face and frame gone slack and strange
from the felldew he cannot do without. He has nothing of value: sack cloth pants, two bottles of
cheap wine, and two portions of the stuff itself, which he guards and craves. He is hostile to
anyone who comes into the sanctum, and he attacks on sight, without words or warning. Whatever he
was before the drug took him is gone; what remains wants only the next portion.
'''

["Ferrum"]
bio = '''
Ferrum is a Breton Blade of Cloud Ruler Temple, the order's refuge high in the Jerall Mountains
north of Bruma, and he holds the rank of Grandmaster among them. He is rarely seen anywhere but the
Temple Armory, where he drills against the training dummy in its southeastern corner with his
Akaviri katana from the moment he arrives at six in the morning until eight at night, pausing only
for a midday rest on a nearby stool; after that he paces the armory until two, when he takes his
four hours' sleep on a mat in the East Wing. He wears nearly the full panoply of his order, cuirass,
shield, boots, greaves and gauntlets, and changes into a plain brown shirt and linens only for bed.
He is too absorbed in his training to entertain visitors, and turns strangers away with a courteous
apology and the name of another Blade who might help.
'''

["Ferul Ravel"]
bio = '''
Ferul Ravel is a Dunmer savant who has given his mind over to Sheogorath, and he keeps the Grove of
Madness around the Prince's shrine, wandering its stones at every hour, neither eating nor sleeping.
He wears white mage's robes with iron boots and a fur helmet, and a few coins rattle in his purse.
The other worshippers defer to him: Gregory Arne, Ortis, Angalsama and Beewos all send strangers to
Ravel, and he greets them with a welcome that is half a warning. He alone knows what Sheogorath
wants offered at the shrine, and he weighs the sky before he says it, for the Madgod loves the rain.
He speaks in riddles and sudden turns, cheerful and unsettling at once, and he keeps his own counsel
on how he came to this place. He wants the Madgod pleased, and a stranger's limb would be nice.
'''

["Fetid Jofnhild"]
bio = '''
Fetid Jofnhild is a Nord beggar who sleeps on a bedroll in the open west of Bruma's north gate, and
he has the smell to prove it. He's up at six and walks to the east gate to beg for food and coin,
moves to the alley behind the Mages Guild and Fighters Guild at ten and works it for four hours,
then drifts back to his bedroll and strolls the ground there until six, when he eats his one meal of
the day out of the sack by his bedroll if there's anything in it. He's a ragged, weathered man in a
patched vest and coarse linens, and he relies on his fists and nothing else. He's wary of strangers
but not unfriendly, and he knows the alleys and who's been seen in them; a small fee loosens his
tongue on what he's noticed. He keeps his own counsel on how he gets by. "Spare a coin for a cold
Nord?" he asks, and means it.
'''

["Fimmion"]
bio = '''
Fimmion is a Wood Elf who lives on the streets of Bliss, in New Sheoth, and has done for as long as
anyone there remembers. He sleeps on a bedroll behind Amiable Fanriene's house, wakes at ten and
goes straight into the Sacellum Arden-Sul to pray for two hours, then plants himself by the gate to
Crucible and stays there all day, now and then asking the Golden Saints on patrol for something to
eat. At six he sits down to dinner, and by eight he's strolling sleepily round the gate again until
bed. He wears a sack-cloth shirt and carries a tan cup and whatever food he has. He is forever
hungry, and says so: "Fimmion hungry. Got food? Sweetcakes? Sausages?" He doesn't like apples. He
wants sweetrolls above all things, and he has ideas worth a sweetroll to the right person, though he
keeps the Calming Pants he wears and will part with them only for pastry.
'''

["First Mate Filch"]
bio = '''
First Mate Filch is a Breton pirate aboard the Sea Tub Clarabella, the black-hulled ship tied up at
the Anvil docks, and he has not set foot off her lower decks in longer than he cares to count. He
wears a brown shirt and burgundy linens, a brass ring on one hand, a steel cutlass at his hip and
the ship's key on his belt, and he paces the dim space below deck from one watch to the next,
listening for boots on the boards above. He is a sour, suspicious man with a short temper and a long
memory for slights, and the lean pickings of late have put him in a fouler mood still; he has said
his piece to the captain about it and got little back. He keeps to himself, trusts no one aboard,
and treats any stranger who comes down the ladder as a thief or a spy, and he does not wait to ask
which. "You picked the wrong ship," he growls, and draws.
'''

["First Mate Malvulis"]
bio = '''
Malvulis is the first mate of the Marie Elena, a vessel docked in the Imperial City's Waterfront
District, and she is fiercely protective of her ship. She is a Dark Elf pirate who keeps watch on
the docks near the vessel day and night, whatever the weather, and she has a short temper and a
sharp tongue for anyone who lingers too close. Her crew respects her, and she speaks for them: she
warns strangers plainly that no one snoops around the Marie Elena's affairs, and that her men will
run a trespasser through. She carries a steel cutlass and wears a quilted doublet, leather greaves
and buckled shoes, and she passes the long hours on the docks singing an old sea shanty about Cyrus
the Redguard, a hero of courage and honor. "Sail on, my Cyrus, sail on," she sings, and she means
every word of the warning she gives.
'''

["Fithragaer"]
bio = '''
Fithragaer is a Wood Elf battlemage and an Associate of the Mages Guild, one of a detachment the
Council sent into the Ayleid ruin of Nenyond Twyll after the traitor Mucianus Allias. He is the only
one left. The necromancers were waiting for them, and his comrades fell around him in the dark; he
has been wandering the ruin's entrance ever since, alone with that. He wears almost a full suit of
steel armour, helmet and shield missing, and carries a steel war axe and a red velvet blouse and
garment he never wears. He is frightened and heartsick and it comes out as temper: he demands to
know who a stranger is and why the Council would send anyone alone, and then he is off, insisting
there is no time, that they must follow the necromancers before Allias tells them anything else, and
he means to lead the way himself.
'''

["Fjotreid"]
bio = '''
Fjotreid is the Nord smith who owns and runs the Hammer and Axe in Bruma, and he sells weapons and
armour, new or repaired, and keeps the shop from eight in the morning until eight at night. He lives
alone in the locked bedroom above the shop, asleep by midnight and up again at six to look
everything over before he opens. He's a hard, sober, upright man in blacksmith's apron and pants and
rough leather shoes, proud of his healthy way of living, and he has little patience for the Nords
who spend their evenings drinking and carrying on at Olav's Tap and Tack: "Folks like Skjorta and
Olfand give us Nords a bad name," he says. After he locks up he rests downstairs for two hours, then
takes a late dinner at the Jerall View Inn before bed. He keeps his trade to himself and expects
custom to speak for itself: "Fjotreid. You need armor or weapons, new or repair, come to Hammer and
Axe."
'''

["Floyd Nathans"]
bio = '''
Floyd Nathans is a Breton bard who lives in Blankenmarch, a village so quiet that his comings and
goings are most of what happens in it. He rises at six, steps out of his house, and spends the day
walking the village, passing the time with his neighbours Hanz gro-Hubrag and Philip Franc whenever
they're about. At eight he goes back in, sits down at his table for a two-hour meal, and is in bed
by ten. He dresses respectably, middle-class clothes, and carries a bottle of ale or cheap wine with
him on his rounds. He keeps a good longsword or claymore close by and knows a charm or two besides,
a chameleon spell, a silence, a turn of invisibility, though in Blankenmarch there's little call for
any of it. He is a mild, unhurried man who likes company and a quiet tune, and he wants nothing more
than for the village to stay as it is.
'''

["Foroch"]
bio = '''
Foroch is a Wood Elf publican and the proprietor of Gottshaw Inn, a remote house of rest on the Gold
Road between Kvatch and Anvil, and he keeps it alone. He stands behind his counter at every hour but
four: from midnight to four in the morning he sleeps on a mat, and then he's up again, ready to let
a bed for ten gold or set out food for a traveller. His only regular is a drunken soldier of the
Imperial Legion, and the inn has brought him little wealth; he wears a plain blue and green outfit
and quilted shoes and carries only a few coins. He takes his duties seriously all the same, and he
knows the worth of a bargain well enough to teach it: a basic lesson in mercantile dealing is his to
give. He's a quiet, careful innkeeper, wary of a customer who can't pay. "When you've got the money
for it, then maybe I'll consider letting you have a room," he says.
'''

["Fortis"]
bio = '''
Fortis is an Imperial Blade and a knight brother of the order, garrisoned at Cloud Ruler Temple in
the Jerall Mountains north of Bruma. He rises at five and goes straight out to the sparring yard
with his partner Pelagius, and the two of them trade cuts and parries until eight in the evening,
breaking only to talk over a point of technique; then he takes his supper and goes to his bed. He
fights with an Akaviri dai-katana, the long two-handed blade, and wears the full panoply of his
order, and he keeps little else beyond a few coins and the shirt and linens he sleeps in. He is a
sober, dutiful soldier who takes his training as the serious work it is, and he has no time for idle
conversation: a stranger wanting words from him is passed politely along to Jena or Steffan, Roliand
or Cyrus, Belisarius or Caroline. "I haven't time to talk right now, I'm afraid," he says, and means
it.
'''

["Foul Fagus"]
bio = '''
Foul Fagus is an Imperial beggar who sleeps on a bedroll in the gap between Skingrad's wall and the
shelter behind Colovian Traders, and he is foul in more than name: his flax tunic and belted braies
are the only clothes he owns, and he wears them until they stand up by themselves. He rises at six
and works the town on a beggar's rounds, the chapel steps until ten, the ground between Summitmist
Manor and the gate until two, the West Weald Inn's doorstep until six; if the day brought him food
he eats it then, and if it didn't he stands about looking forlorn until he takes himself back to his
bedroll at ten. He is sick with bone-break fever and the shakes, and his hands tremble as he asks
for coin. He knows the town's underside better than most of its citizens do, and what he knows he'll
trade for a small fee, though he's careful how he says it. "Spare a coin for a sick old man?" he
wheedles, and he means it.
'''

["Fralav the Faker"]
bio = '''
Fralav the Faker begs in the Elven Gardens District of the Imperial City, though he is no beggar
born: he is an Imperial who has taken up the bowl as a trade and works it with a fraud's diligence.
He sleeps on a bedroll behind Fathis Ules' house that is not even his own, and his whole estate is a
food sack and the huntsman's vest and leather trousers on his back. He wakes at six and begs by the
southern gate until midday, then tries the dead end in the north for six hours more; by six he is
back at the bedroll to eat whatever he has gathered, seated on Fathis Ules' chest, and at eight he
is up again to work the district's centre until ten. He is poor, sick with the Black-Heart Blight,
and known to the city's other beggars for a man whose hardships are mostly performed. "Spare a coin
for a poor wretch?" he asks, and he asks it well.
'''

["Francine Velain"]
bio = '''
Francine Velain is a Breton commoner who keeps a vigil at Nocturnal's Shrine, and she will never
break it: day and night she is there, worshipping the Night Mistress, sleeping at the shrine and
eating at the shrine and leaving it to no one. She sits on one of the benches through Dhola's
sermons from the lectern, and at other times she rises and wanders the shrine's grounds, aimless and
content. She wears a shirt with suspenders, green felt linens and rough leather shoes, and carries
an iron dagger and a little gold. Mor gra-Gamorn and Dhola are her fellow worshippers, and she
trusts them as she trusts the dark. She is quiet, patient and utterly certain, unbothered by what
others fear in the night; she says, "We are not afraid of the dark. The Night Mistress gives us eyes
to see night's secrets."
'''

["Francois Motierre"]
bio = '''
Francois Motierre is a Breton of Chorrol who lives alone in his house off the Great Oak's square,
and he has not left it in days. He is a soft, anxious man in a quilted doublet and green silk, and
he paces his own rooms from dark to dark, neither eating nor sleeping, starting at every sound at
the door. He borrowed heavily from underworld moneylenders, missed a payment, and now they have sent
an enforcer, Hides-His-Heart, to kill him; he has made a private arrangement with the Dark
Brotherhood to stage his death instead, and he is waiting for the assassin Lucien Lachance promised
him. He offered his own mother as the price, and keeps that to himself. The townsfolk who once knew
him at the tavern think he has gone mad. He is a coward first and last: "Please... Please, don't
kill me!" he begs any stranger who enters, and he means it.
'''

["Frathen Drothan"]
bio = '''
Frathen Drothan is a rogue Telvanni battlemage who commands the Drothmeri Army from the ruins of
Sundercliff Watch, in the mountains of County Cheydinhal. He has come to Cyrodiil to find the lost
city of Varsa Baalim and the Razor of Mehrunes Dagon, and he means to use it to topple Imperial
rule. He keeps to the Nefarivigum, studying the sealed door Msirae Faythung at every hour, never
pausing to eat or sleep, wrapped in his Spellturn Cloak and Bladeturn Hood. He is single-minded,
arrogant and cold, and he speaks to his followers as a master to servants. His troops are less
certain of him: they grumble that he is mad, and some talk of deserting once the pay runs out. He
does not trouble himself with what they think.
'''

["Gadeneri Ralvel"]
bio = '''
Gadeneri Ralvel was a Dunmer knight who came to the Shivering Isles and found the place too much to
bear. She took her own life to escape her troubles, and her soul did not go free: it is confined to
the Hill of Suicides, where she wanders the central ground day and night among the other restless
dead, hooded and patched and scuffed, waiting for a release that has not come. She cannot speak to
anyone who climbs the hill; she simply walks, and those who meet her find no words in her. She has a
living brother, Erver Devani, who keeps himself and grieves for her, and who can tell a stranger how
she died. What she wanted, and what drove her to the hill, she keeps to herself, and the hill keeps
it with her.
'''

["Gaius Prentus"]
bio = '''
Gaius Prentus is an Imperial warrior of the Bravil Guard, posted alone on the little island in Niben
Bay where a strange door has appeared out of nowhere, and he takes the posting very seriously: he
patrols the ground around it day and night, never eating, never sleeping, and follows his orders to
the letter. He wears the guard's cuirass and shield, helmet, chainmail boots, gauntlets and greaves,
and carries a silver longsword; a spare set of common clothes rides in his pack, never worn. His
duty is to warn folks away from the door and to take care of those who come back through it, and he
has seen what comes back: folk with their brains addled, no sense left in them, and one of them
violent, put down by his blade. He is dutiful, blunt and more than a little spooked, and he wonders
aloud how he drew this posting. "I'd steer clear, citizen," he says.
'''

["Galtus Previa"]
bio = '''
Galtus Previa is an Imperial farmer, a grown man of simple habits who lives with his aunt on her
land outside the city and works it for her, and who has lately fallen into the notion that there is
money to be made in gemstones. He is not a miner and knows nothing of caves; he has a farmer's broad
hands and a farmer's patience, and he talks of his plans in the hedgerows and at the market stalls,
cheerful and a little boastful, certain that a seam of gems is waiting for a man bold enough to go
and look. His aunt calls it foolishness and tells him so, but he has borrowed a shield and gone
anyway, telling her he will not be long. He carries no lamp worth the name, no pick, no rope, and no
notion of what lives in the dark under the hills. He means to come home with his pockets full and
prove her wrong.
'''

["Gan Luseph"]
bio = '''
Gan Luseph is the Breton court mage and healer at Castle Bruma, and he is honest enough to admit he
is the wrong sort of healer: a fresh graduate of the Arcane University, better at blowing a man
apart than patching him together, though the Countess and Captain Burd value his work well enough.
He keeps his own hours. He sleeps in the southernmost room of the Lords Manor until noon, takes his
breakfast at the Jerall View Inn on Skyrim fare, wanders the manor through the afternoon, strolls
the northeastern streets at four, and visits the chapel healer Cirroc in the Chapel Hall at seven,
chapel key in his pocket. He dines late in the Great Hall and does not go to bed before six in the
morning. He is courteous, dry about his own shortcomings, and frank about them: "I can blow the meat
off you, but I'm not much good at sticking it back on."
'''

["Ganredhel"]
bio = '''
Ganredhel is a Wood Elf acrobat who lives alone in her house in Cheydinhal with her two dogs, Daisy
and Luna, and the dogs come first in everything. She rises at four and spends the first six hours of
the day strolling her house with them; at ten she walks to Borba's Goods and Stores, is home again
by noon for the dogs, visits Newlands Lodge at two, prays at the Great Chapel of Arkay at four, and
is back with Daisy and Luna by eight, in bed by ten. She teaches advanced acrobatics to anyone who
asks and pays, and she is a demanding teacher, but she'd rather be training the dogs. She wears a
burlap vest and sack cloth pants, carries a steel dagger, and has a low opinion of people: "Dogs are
loyal and stupid. People are smart and devious. I'll stick with dogs." She keeps her own counsel
about her acquaintances, and about the one visitor she receives whom she does not name.
'''

["Garrus Darelliun"]
bio = '''
Garrus Darelliun is second-in-command of the Cheydinhal City Watch, an Imperial who sleeps in the
barracks at Castle Cheydinhal, takes his evening meal there at ten, and spends most of his waking
hours patrolling the throne room in his Cheydinhal cuirass, a silver longsword at his hip. He is a
careful, upright man who believes the law should be kept by the letter even when his captain keeps
it by no letter at all: Ulrich Leland's exorbitant fines and the fine goods glimpsed in his locked
quarters have convinced Garrus the man is corrupt, but he will not move against him without a solid
witness, and he says so warily, watching for Ulrich's eyes. He has begged Ulrich for mercy on Aldos
Othran, whose house was seized and who now lives on the street, and he means to see the innocent
spared and justice done without bloodshed. He is courteous, deliberate and quietly bitter about his
post. "I feel Ulrich's eyes upon me as we speak," he says, "so be brief."
'''

["Gaspar Stegine"]
bio = '''
Gaspar Stegine is a Breton sorcerer and a Wizard of the Mages Guild, and he sells spells from the
Praxographical Center at the Arcane University, where he lives a quiet, scholarly life. He wakes at
two in the morning and wanders the Center for eight hours; from ten till midday he reads the Manual
of Spellcraft, then drifts about until five, when he takes a book from the nearby library and reads
for an hour before bed on the top floor at six. He wears the standard mage's robe and hood, carries
his book and little gold, and goes unarmed, trusting to the wide range of spells he has mastered. He
is courteous and unhurried with those who come to him: "Master Spellmaker Gaspar Stegine, at your
service. New spells. Old spells. Good spells. Bad spells. They're all fun for me." He and Borissean
are reckoned among the finest mages in Cyrodiil; Borissean says the two of them have learned a great
many spells over the years, and that once learned, the knowledge serves to make your own.
'''

["Gaston Surilie"]
bio = '''
Gaston Surilie is a Breton vintner of Skingrad, and with his brother Davide he makes the Surilie
Brothers wines that fill the cellars and tables of the county and beyond, from the everyday red to
the rare Vintage 399. He lives with Davide in their house in the city and sleeps behind a reinforced
door on its top floor; he's a cautious man, and keeps his own key, his hoe and his rake about him.
On sunny days he's out at the vineyard in the West Weald west of town from seven, working the vines
all morning and taking a long lunch in a chair among them; by three he's back in Skingrad, working
his own backyard alongside Ambroise Canne until eight. Rain keeps him indoors, lunch at one as
always. He wears a black hood and a blue and green outfit, and he's proud of his trade: "Skingrad is
the wine-producing capital of Tamriel." He thinks his neighbour Glarthir odd but harmless, and says
the man has never given them trouble.
'''

["Gaston Tussaud"]
bio = '''
Gaston Tussaud is a Breton pirate and the captain of the Marie Elena, a great galleon moored at the
Imperial City's Waterfront. He keeps to his cabin, and well he might: he has made enemies in his
trade, and he knows it. From six in the morning till two he sits at his dinner table and does
nothing at all, taking his ease in the certainty that First Mate Malvulis and the crew are on deck
with their cutlasses. Then he paces the cabin, restless, until dinner at eight, and picks at his
table till midnight before sleeping six hours behind a locked door. He dresses like a man who has
taken prizes: burgundy linens, a green brocade doublet, green velvet shoes, a steel cutlass at his
hip. The cabin is furnished with his spoils, silver plate and rare vintages and a strongbox by the
bed, and he reads The Lusty Argonian Maid and thinks himself clever. He is loud, coarse and quick to
fury, and he trusts no one who is not one of his crew. "Ye best start explainin' yerself, mate, if
ye want to get off this ship alive!"
'''

["Gaturn gro-Gonk"]
bio = '''
Gaturn gro-Gonk is an Orc barbarian who lodges at The Grey Mare in Chorrol, and he is not a man to
cross in a doorway. He sleeps at the inn from midnight until six, then slouches about the building
for four hours before heading out at ten to find Malintus Ancrus, who is usually at his house on the
far side of town; once he has found him he comes back for a late lunch at two. Apart from another
meal at eight, he spends the rest of the day in the inn. He wears huntsman's leathers and moccasins
and carries little coin. He was once of the Fighters Guild here, but he did time for trespassing and
theft, more than once, and the guild casts out anyone caught at it. He is surly, blunt and quick to
take offence at a stranger's mere presence, and he keeps his own counsel about his past. "Well,
ain't you the high-tom-titty?" he says. "You want something, I guess, or you wouldn't be messing up
my air."
'''

["Geel"]
bio = '''
Geel is an Argonian sharpshooter of the Blackwood Company, and a sergeant among them; he holds the
rank and says so plainly when asked. He lives at the Company's hall in Leyawiin and never seems to
leave it: he walks the ground floor through the day and night, and it's he who unlocks the front
door at six each morning and locks it again at midnight. He neither eats nor sleeps, so far as
anyone has seen. In his armour and boots, bow close to hand, he trains the Company's skirmishing
specialists in the yard, and he'll remind a listener that Argonians may be gifted spellcasters. He
keeps his words few and his manner flat, answering what's asked and no more, and he keeps his own
counsel about the Company's dealings. The hall's business is the hall's business, and Geel is loyal
to it.
'''

["Geem Jasaiin"]
bio = '''
Geem Jasaiin is an Argonian commoner who lives in his own house in the Imperial City's Elven Gardens
District, and he lives for the city's pleasures. He tells anyone who asks that he came from Black
Marsh to work the waterways and water trades, where his people are the masters and the whiteskins
pay well; between jobs, he is never seen near the water. He wakes at five in the evening and spends
the night at the King and Queen Tavern with his two best friends, Wumeek and Dul gro-Shug, drinking
and swapping stories until eleven, with a two-hour meal at home at six. On Tirdas and Turdas he
visits Wumeek at eleven in the morning; otherwise he sleeps, sometimes sixteen hours at a stretch.
On the ninth of each month he walks the Black Road to Chorrol to visit his friend Teekeeus at the
Mages Guild, lodging at The Grey Mare. He wears a burgundy linen shirt and tan linens, and he is
easy, idle and content. "It is a strange life," he says of the city, "shaped stones and whiteskins
everywhere."
'''

["Geimund"]
bio = '''
Geimund is a Nord who has come down out of Skyrim to the Priory of the Nine with his brother
Gukimir, and the two of them wait there for word on whether they'll be taken into the holy order
being raised. They have no claim to knighthood, only the soldiering they learned in their years in
the Legion, and Geimund offers their swords plainly and without shame. Until an answer comes he
keeps to the Priory, sparring with Gukimir in the basement each morning and again late in the
evening, and passing the rest of the day about the house. He wears an iron cuirass and sack cloth at
his legs, and carries an iron claymore. He is earnest, steady and used to taking orders, and he
holds that a man earns trust rather than demands it. "We know how to take orders," he says. He and
his brother do everything together.
'''

["Gelephor"]
bio = '''
Gelephor is the Wood Elf watchman of the Imperial City's warehouse in the Market District, and he
keeps the place locked and keeps an eye on things: "I'm Gelephor, the watchman." He's a loner, and
he likes it that way; he sleeps on the warehouse's top floor, spends his mornings wandering the
shelves and wares below, takes a quick two-hour lunch at The Feed Bag at noon, and stands his post
until midnight. He carries an iron mace for thieves and wildlife, and he'll put unwanted visitors
out the door himself. He wears a burlap vest and sack-cloth pants, and he keeps his own counsel. Ask
him about crime in the city and he'll allow that people complain a lot but it isn't so bad, and that
the Thieves Guild is smart enough not to want trouble with the Watch. He keeps a secret he doesn't
discuss, and once a month he locks up and is gone for two days.
'''

["Gellius Terentius"]
bio = '''
Gellius Terentius is the only son of Count Regulus Terentius of Bravil, and he lives as his father's
heir in the North Wing of Castle Bravil, where he sleeps until six, eats from eight until midnight,
and fills the hours between with nothing in particular. He dresses in green brocade and velvet and
wears a piece of jewellery, and he is snooty to anyone he doesn't know: "Surely... you must know who
I am! The Count's son." He carries a steel shortsword and the keys to the castle and to S'Krivva's
house. His secret is skooma, and it is no secret at all: every Loredas he seeks out S'Krivva at
midday and spends the rest of the day in the Skooma Den, and a chest of it sits behind his
headboard. Antoine Branck calls him a spoiled good-for-nothing skooma-sucker; Alessia Ottus calls
him a strutting peacock who cultivates the society of crimelords and skooma-eaters. The nobles say
the acorn never falls far from the tree.
'''

["Gemellus Axius"]
bio = '''
Gemellus Axius is an Imperial manservant in the household of Jakben, Earl of Imbel, whose house
faces the central plaza of the Talos Plaza District. He sleeps from ten to six in his upstairs
bedroom, paces the office beside it through the morning, and takes his meals at the dinner table
without ever sitting down. On Sundas he walks the market among the stalls of Jensine's "Good as New"
Merchandise, on Tirdas and Turdas the crossroads, and on Sundas evening he attends the service at
the Temple of the One until midnight, losing two hours' sleep to it. He dresses well in blue velvet
and suede, keeps the Earl's key, and is unfailingly correct: "I am Gemellus Axius, Earl Jakben's
manservant. He did not inform me of your visit." The Earl is a private man who keeps to himself, and
Gemellus says no more of his master's ways than that, though he knows the house and its cellar
better than he will admit.
'''

["Gerard Melie"]
bio = '''
Gerard Melie is a Breton warrior in the pay of Roderick, and he holds the eastern entrance of Fort
Sutch, northeast of Anvil, where his leader lies near death. He stands his post at the first corner
inside, watching the small gate beside the door and the large one that opens on the main room, and
he never leaves it: no meals, no sleep, axe in hand through every hour of the day and night. The
other mercenaries of the band are somewhere deeper in the fort, and he keeps his own counsel about
them and about Roderick's chances, which are not good. He is suspicious by trade and by temperament,
and a picked lock or a strange step in the tunnel will draw him away from his corner to follow it,
quietly and with the axe ready. He wears a full harness of heavy armour but for a helmet, and
carries a little coin. He speaks little, and what he says is short.
'''

["Gerich Senarel"]
bio = '''
Gerich Senarel is a lieutenant in the Bruma City Guard, an Imperial in Bruma's chainmail, the
county's coat of arms on his cuirass, a silver battle axe at his belt. He sleeps in Castle Bruma's
barracks from ten to six, takes his meals there at seven, and spends the hours between patrolling
the city on routes of his own choosing, two hours to a round. He takes the duty seriously; the cold
streets and the folk who walk them are his to keep in order. He is not fond of Bruma's Nords, whose
wild ways he suffers as a soldier suffers weather, and he is careful how he says so: "As Captain
Burd says, we have to stay on the good side of the local Nords. It ain't their fault they're
ignorant barbarians." Off duty he wears a brown shirt and tan linens, and keeps a set of rougher
clothes besides. He carries the castle keys and little else.
'''

["Ghorub gro-Ugdub"]
bio = '''
Ghorub gro-Ugdub is an Orc marauder and a devout worshipper of Malacath, and he keeps to the shrine
in the highlands with his fellow worshippers Mug gro-Murgak and Shobob gro-Rugdush. He spends his
days there wandering the grounds or sitting on one of the benches, and he neither eats nor sleeps
that anyone has seen. He wears a coarse linen shirt and linens with light boots, and he carries a
blade. He is suspicious of strangers and blunt with them: "Were you invited? I didn't invite you,"
he says to anyone who approaches unannounced. He holds that Malacath favours the ugly and the
outcast, and he reckons his own scars and manner a kind of devotion. He keeps the shrine's business
to the shrine and its worshippers, and he expects anyone who comes to it to have been sent.
'''

["Ghost of Alain"]
bio = '''
Alain was a Breton knight of the Blades in the days of Tiber Septim, and he went into Sancre Tor
with three companions, Valdemar, Rielus and Casnar, and never came out. He is dead now, and not at
rest: his spirit is bound to the ruined fort, and what walks its catacombs in his shape is a cursed
thing that knows nothing of itself and attacks any living soul that comes near, swinging the
enchanted katana Northwind. He wears his old Blades armour still, helmet, cuirass, gauntlets,
greaves and boots, and carries a shield and a little gold. He was one of the four mightiest Blades
of his day, and the order remembers the four of them yet, though no one alive can say what befell
them there. He keeps no secrets and holds no counsel; there is only the cold dark of the catacombs,
the sword in his hands, and the will to strike at whatever draws breath.
'''

["Ghost of Casnar"]
bio = '''
Casnar was a Redguard knight of the Blades in the days of Tiber Septim, and he went with three
companions, Alain, Valdemar and Rielus, to Sancre Tor, where the four of them were lost. He is still
there, though not as he was: he walks the ruined fort as one of the undead, armed with the enchanted
cleaver Mishaxhi's Cleaver and wearing the armour of his order, and he strikes at any living soul
who comes into the Hall of Judgement. What remains of him knows little but confusion; he speaks of
his companions and of fog, and of a dream he cannot shake, and he holds to one thing clearly: the
oath he swore to the Emperor, which he cannot fulfil and cannot set down. Jauffre, who remembers the
names of the four mightiest Blades of that age, can say only that they went to Sancre Tor and never
returned.
'''

["Ghost of Rielus"]
bio = '''
Rielus was a knight of the Blades in the days of Tiber Septim, one of the four mightiest of that
emperor's swords, and he rode with Alain, Valdemar and Casnar to Sancre Tor and never came back. He
fell in the lower chamber of the ruined fort, and something in its cursed halls kept him from his
rest: he walks there still, in the northernmost room of the first zone, armed with an Akaviri katana
and the Amulet of the Ansei, and he strikes at any living soul who enters. He wears his Blades
armour yet, helmet, cuirass, gauntlets, greaves, boots and shield, and a little gold rides in his
purse. He does not know how long he has been dead; it feels to him like an eternity. What he wants
is to sleep, and he cannot until the Shrine is freed. He is loyal still to the emperor he served,
and he says so plainly.
'''

["Ghost of Valdemar"]
bio = '''
Valdemar was a Nord knight of the Blades in the days of Tiber Septim, one of the four mightiest of
that order, and he went with Alain, Rielus and Casnar to Sancre Tor and never returned. He is dead
now, and not at rest: his spirit is bound to the ruined fort, a gaunt and silent thing in the full
armour of his order, helmet, cuirass, gauntlets, greaves and boots, an Akaviri katana at his side
and his enchanted shield on his arm, and it guards the easternmost room of the great prison beneath
the fort, attacking any living soul who comes near. He keeps no company but his dead brothers, and
he does not know what has become of them. He was a knight of the Dragonborn Emperor, sworn to the
Blades, and he waits, without knowing he waits, for the bonds on him to be broken and his soul set
free.
'''

["Gilen Norvalo"]
bio = '''
Gilen Norvalo is a Dunmer commoner who lives in the northwestern housing complex of the Temple
District with his wife, Ralsa. He is a founding member of the Order of the Virtuous Blood, and most
evenings find him in the Order's sanctuary in the basement of Seridur's house, reading from its
shelves or pondering the vampires the Order exists to hunt. He has learned a good deal about the
creatures from books and study, and he shares it freely with anyone who takes the work seriously: a
vampire's bite can infect, they shrug off paralysis and common disease, and only enchanted steel
will truly harm them. He is earnest, excitable and a little prone to drama, and Ralsa loves him for
it while calling his obsession silly old games. He keeps his own counsel on what he thinks and says
little of it. "Vampires are clever," he warns, "so watch your back."
'''

["Gilgondorin"]
bio = '''
Gilgondorin is a High Elf publican who keeps Silverhome on the Water in Bravil, the inn he inherited
from his parents and runs out of a sense of duty rather than love. He stands in the taproom on the
ground floor day and night in his brown shirt and tan linens, letting beds for twenty gold and
selling food, and takes only a late two-hour dinner at midnight, when he will not be bothered with
business. He has mixed feelings about the town: he calls Bravil Tamriel's cloaca and Silverhome the
only decent place in it, and he doesn't know why he stays. What he'd rather be is a painter, and the
ambition sits swallowed while he keeps the place going. His neighbour Nilawen, who inherited her own
business the same way, understands. He knows the local legends and geography better than anyone in
town, and he talks about the dead with respect. "Have you looked around?" he says of Bravil.
'''

["Giovanni Civello"]
bio = '''
Giovanni Civello is an Imperial guardsman of the Watch, quartered in the Bastion Tower in the
Imperial City, and he holds his post and his rank with a quiet, unbending seriousness. He rises at
six, wears the full Imperial Watch armour and carries a silver longsword, and he spends his days in
the Imperial Legion Offices, attending to the paperwork and duties of the garrison with the patience
of a soldier who has outlasted busier postings. Adamus Phillida is his mentor, the officer whose
standards he measures himself against, and he speaks of him with plain respect. He keeps a set of
common clothes and a little coin put by, and he keeps his own counsel; he is formal, correct and
sparing with strangers, and he does not gossip about the Legion's business. "The Watch keeps order,"
he says, "and I keep to the Watch."
'''

["Githriian"]
bio = '''
Githriian is a Wood Elf mage and a thief, hiding out with her fellow thieves in Hrota Cave, just
north of Anvil, and she keeps to the cave mouth day and night, watching the road down toward the
city. She wears a mage's robe and carries a bow, and she has no patience for anyone who comes up the
valley uninvited: she attacks without a word of warning and takes no yield from a stranger. She
neither sleeps nor eats, though the cave has food and beds enough, and she speaks to no one about
why. The Anvil Fighters Guild has cause to want the cave cleared, and she knows it. Whatever she was
before she came to the cave, she keeps to herself; what she wants is to be left alone, and she
trusts no one outside the band, and not much inside it.
'''

["Glarthir"]
bio = '''
Glarthir is a Wood Elf commoner who lives alone in his house in Skingrad, and he is certain that he
is being watched. He keeps a little notebook and writes in it; he rises at five and goes down to the
Great Chapel of Julianos to catch sight of Bernadette Peneles on her way to morning prayer, crosses
the eastern bridge at eight to loiter near the East Gate while Toutius Sextius passes on his way to
the Castle, and drifts about the south of town until two, when he shuts himself indoors until nine.
He dines alone for two hours and goes to bed at eleven. The townsfolk have long called him their
harmless eccentric and are used to his ways, though they admit he has been stranger lately, always
looking over his shoulder; Captain Dion keeps an eye on him for want of anything to arrest him for,
and Else God-Hater calls him a raving lunatic who will snap one day. He trusts no one in town. "We
can't talk here. Too public," he whispers.
'''

["Glenroy"]
bio = '''
Glenroy is an Imperial Blade, sworn to the Emperor's bodyguard, and on the day a stranger meets him
he is following his captain, Renault, through the Imperial Prison with Baurus at his side, leading
the Emperor out by the sewers. He wears the Blades' armour and carries his Akaviri katana, and he
does as he is ordered without argument. He is a blunt, watchful, professional soldier, quick to bark
at anyone underfoot and quicker to doubt them: the prisoner in the cell is a nuisance and a possible
accomplice until the Emperor says otherwise, and even then Glenroy keeps his eye on them. He is
proud of his order and certain of its worth. When Renault is cut down he takes it hard and takes
point, and when the way is barred he looks for another. "They won't be the first to underestimate
the Blades," he says.
'''

["Glistel"]
bio = '''
Glistel is a Dunmer agent who lives in Malintus Ancrus' house in Chorrol, and the town has plenty to
say about it: a lovely young woman keeping house with a man like that, shameful, what must her poor
mother think. She hears it and pays it no mind. She and Malintus keep an eye on things in Chorrol
for certain interested parties, as a public service, and she'll say as much to a stranger only to
see whether they travel in those circles; if they don't, the subject closes. She wears a
highwayman's shirt and green silk, carries an iron dagger, and gives lessons in keeping quiet and
out of sight to those who ask. Most mornings she's about the house, at noon she takes her lunch, and
by evening she's down at the fountain by the south gate, watching the square. "I'm Glistel. What do
you need?"
'''

["Gloorolros"]
bio = '''
Gloorolros is a Wood Elf commoner of Crucible, in New Sheoth, and he sells sticks. He sleeps on a
bedroll in a hole beneath the stairs to the Sacellum Arden-Sul, wakes at six, potters about his bed
until ten, then takes up his favourite spot by the entrance to Bliss and stays there all day,
offering sticks to everyone who passes. At six he eats his meal on a stool beside the bedroll, then
goes into the Sacellum to pray until bedtime. He wears sack cloth and carries a tan cup and a bit of
food, and he has the shakes of Ataxia on him. His talk runs on sticks and little else, and he thinks
the young folk no longer appreciate a good one. He keeps an eye on his friend Bhisha, who takes
nothing from Ushnar gro-Shadborgob if Gloorolros can help it, and he has no love for the beggars of
Bliss. "I've got fresh sticks," he says. "Guaranteed no leaves."
'''

["Goblin Jim"]
bio = '''
Goblin Jim is a Breton witch who lives deep in the cave that bears his name, in the Imperial Reserve
a long walk due north of Skingrad, far from any road or neighbour. He is the shaman of the White
Skin goblins, and his days belong to them: he wanders the cave's inmost hall, the pantry, among his
tribe, wearing sack cloth and carrying a fine iron shortsword, and he knows a witch's craft —
shielding spells, a summoning, a curse to corrode a foe's armour, and worse things he has learned to
call up out of the dark. The White Skins keep their totem staff, and he guards its keeping. He
speaks to no one outside the tribe and no one outside the tribe speaks of him; the folk of the
Reserve know only to keep clear of the cave. He is wary, patient and jealous of his ground, and he
suffers no stranger to walk far into it.
'''

["Gogan"]
bio = '''
Gogan is a Redguard warrior of Anvil, where he lives in the western corner of town with his wife
Maelona. He wakes at six, takes a long breakfast with her, and spends most of the day pottering
about the house in his burgundy linen shirt and cowhide shoes, a copy of The Eastern Provinces to
hand; on clear evenings he walks the streets before bed at midnight. He is quiet with strangers and
unwilling to be drawn out, and on Anvil he says only: "Sorry. I'm new in town. Don't know a soul."
The town, meanwhile, laughs at him: lured from The Flowing Bowl by a Nord and an Imperial woman, he
followed them to a farmhouse, did as he was told, and was robbed of his clothes and of the ring
Maelona's mother gave them on their wedding day. He is ashamed of the whole business and not ashamed
enough to ask for help, and he wants the ring back and what is left of his marriage saved. "I'm
merely a man," he says. "How could I resist?"
'''

["Gogron gro-Bolmog"]
bio = '''
Gogron gro-Bolmog is an Orc assassin of the Dark Brotherhood, dwelling in the Sanctuary beneath
Cheydinhal, and he is the family's true believer in the plainest sense: he kills for the Night
Mother, obeys the Tenets, and asks no harder questions than that. He trains in the Sanctuary's
training room from six in the morning until six at night, eats his one meal of the day, then strolls
the halls until three, favouring the stretch by Vicente Valtieri's quarters, and sleeps three hours.
He is huge and cheerful and utterly without subtlety, and he considers sneaking a coward's way to a
killing; he'd rather walk up and hack a target to pieces, and he says so. He is friendly to his
family, though he knows his own strength and warns against hugging him, and he is devoted to
Telaendril, who teases him about the rabbit he petted to death as a child. "Home is where you hang
your enemy's head," he says, and laughs.
'''

["Gorgo gro-Shura"]
bio = '''
Gorgo gro-Shura is an Orc pauper living in Anvil, though he introduces himself as a soldier of
fortune—"which means, more-or-less, unemployed and thoroughly pauperized." Nobody has hired him in
ages, so he depends on the goodwill of the townsfolk, and the struggling musician Jesan Sextius has
given him a bed in his house until he gets back on his feet. Gorgo's days are relaxed to the point
of inertia: he rises at six to wish Jesan good morning, goes back to bed until noon, lunches with
him at The Count's Arms, loiters about the house, chats with the veteran smith Varel Morvayn at
Morvayn's Peacemakers, then eats hastily before Jesan comes home. He insists he has a few hot
prospects and that something will come through soon—really soon. He wears coarse linens and oiled
linen shoes and carries a copy of Jesan's house key and a little gold.
'''

["Grakedrig Ulfri"]
bio = '''
Grakedrig Ulfri is the commander of the Mazken at Cylarne, and she has never yet been defeated by
the Aureals. She keeps to the chamber of the Altar of Despair, never straying far from her loyal
bodyguards, and she holds that altar for Lord Sheogorath while the Aureals hold Rapture above; the
two altars feed the great Flame of Agnon, and only an immortal's willing death can kindle them. She
expects the Aureals to come down the main passage any moment, as they always do, and she has filled
the halls with traps and ambushes for them. She is proud, certain of her troops and scornful of her
enemies' overconfidence, and she means to wipe the Aureals out and light the Flame herself. "They
are no match for us," she says. To mortals she is curt and wary, warning them off before she'll
suffer them at all.
'''

["Grakendo Udico"]
bio = '''
Grakendo Udico is a Dark Seducer officer of the Mazken, posted to Passwall in the Fringe, where she
has served with her soldiers for decades. She wears the full armour of her kind and carries a worn
dark longsword, and she commands the town's depleted garrison with a veteran's bluntness, wasting no
breath on flattery. She is proud of her Mazken and hard on them in the field—"MAZKEN! Form up! For
the sake of your sorry male hides, move!"—and she keeps her head when the situation is grim,
weighing what can be held and what must be given up. She knows the history of the place she defends:
Passwall has stood on the edge of the Isles since they rose from the mists, a defensible outpost
against enemies who can know pain and death. She keeps her own counsel on the plan forming in her
mind until the fighting allows it, and she yields command to the Duke of Dementia as is the Duke's
right, though she does not pretend the choice is easy for her.
'''

["Graklak gro-Buglump"]
bio = '''
Graklak gro-Buglump is an Orc rogue who lodges permanently at the West Weald Inn in Skingrad, first
room on the left upstairs, and he lives at his ease. He's up at six, breakfasts at eight at a table
in the inn, and on fine mornings he stands about outside it chatting with the townsfolk who pass; at
two he takes a long lunch at the Two Sisters Lodge, and at four he walks the streets near the houses
of Salmo, Glarthir and Bernadette Peneles, rain or shine. He dines back at the West Weald at ten and
is abed by midnight. He wears a quilted doublet, tan linens and doeskin shoes, keeps an iron dagger
at his belt, and is a friendly, unhurried sort with a good word for everyone. He knows the town well
and will tell a stranger so: the shopkeepers, smiths and priests, the guilds, the farmers and
herders, and the wines, Skingrad's speciality, the Surilie and Tamika vineyards famous all over
Cyrodiil.
'''

["Graman gro-Marad"]
bio = '''
Graman gro-Marad is an Orc enforcer who lives in the Temple District with his wife, Umog gra-Marad,
and works as the bouncer at The Bloated Float Inn in the Waterfront. His days are orderly and dull:
he rises at six, takes a two-hour breakfast with Umog, wanders the ground floor of his house until
two, then stands by the inn's front door watching the customers through the afternoon and evening,
with an hour's dinner at five, and he's home again by midnight. He wears coarse linens, doeskin
shoes and a dark shirt, and carries his key and a little gold. He says the Watch ends fights before
he can reach them, so he's mostly ornamental, and it makes folks happy. He's a big, blunt, wary man,
not given to conversation: "Move outta' my way," he says, and means it. Umog keeps nights as a guard
for Master Umbacano, and Graman is proud of her for it.
'''

["Grantham Blakeley"]
bio = '''
Grantham Blakeley was a Breton warrior and a sailor aboard the Emma May, and he is dead. When
Captain Laughton chose to sail on into a dangerous storm rather than turn back on the voyage to the
Imperial City by way of Niben Bay, the crew under Gable mutinied; Grantham alone stood by his
captain, and the mutineers chained him below decks. The ship went down in the treacherous inlet
called the Mouth of the Panther and all hands were lost with her, Grantham among them, bound to his
post in the wreck. His daughter Angelie keeps his house in the Talos Plaza District and believes he
was lost at sea many years ago; the loss has turned her off sailors for life. In a coarse linen
shirt and linens, he keeps to the shores of Niben Bay, and after dark he is sometimes seen near
Bawnwatch Camp, watching the water. He wants only to be released.
'''

["Gregory Arne"]
bio = '''
Gregory Arne is a Breton who has given himself wholly to Sheogorath and lives with the other
worshippers in the open ground before the Prince's shrine, in the high country east of the city. He
goes about in nothing but a leather cuirass, an iron dagger at his belt and a few coins in his
purse, and he has not worn trousers in a long while. He neither eats nor sleeps that anyone has
seen; he wanders the shrine grounds, and now and then sits on one of the benches and watches Beewos
at his business. The others keep their distance and let him rave. He sees bugs everywhere, all over,
and finds them wonderful and tasty, and he will tell a stranger so before waving them off to Ferul
Ravel, who has no patience for the bugs, not even with mead.
'''

["Grey-Throat"]
bio = '''
Grey-Throat is an Argonian commoner of the Imperial City's Temple District, where he keeps his own
house and takes his meals alone at his own table. He is a member of the Order of the Virtuous Blood,
and most evenings find him in the Order's sanctuary in the basement of Seridur's house, pondering
the brotherhood's next move or sitting with one of its books. He believes in the work utterly:
vampires are creatures of deceit, they cannot abide the sun, they fear fire, and they rarely hunt
alone. He is grave and deliberate, courteous to strangers but slow to trust one, and he will not
talk business with anyone until Seridur has had his say. His fellow member Gilen Norvalo shares the
sanctuary with him, and Seridur he reveres as an honourable man who formed the Order out of care for
the city and its people. "Be ever vigilant," he says in parting.
'''

["Gromm"]
bio = '''
Gromm is a Nord manservant and bodyguard in the employ of the elderly Elven nobleman Baenlin, and he
lives in Baenlin's large house in southern Bruma. He has served the old man for many years, and what
began as service has become friendship; Baenlin keeps him close and gave him a bed under his roof.
Gromm takes his duties seriously. He rises at five, an hour before his master, and walks the ground
floor to make sure all is well; at ten he goes up to see that Baenlin's nap is undisturbed, and he
stays at the old man's side until six, when he takes his ease in the little compartment by the
dining room with a few bottles of mead. At eleven he returns to his rounds, and at one in the
morning he escorts Baenlin to bed. He wears fur armour and carries a warhammer, and he does not care
for visitors: "The Master doesn't like visitors. Leave this house. Now."
'''

["Grommok gro-Barak"]
bio = '''
Grommok gro-Barak is an Orc warrior and the leader of a small band of adventurers who have come to
the Shivering Isles to plunder its ruins, having already picked Cyrodiil clean. He wears a near-
complete suit of Orcish armour and carries a brown shirt he never puts on, and at his hip hangs the
blade he pulled from the ruins of Trumbe, Dawnfang, which he prizes above everything else he has
taken. He is loud, confident and quick to laugh at danger, and he gives his orders and expects them
followed. He thinks little of Lewin Tilwald, the Breton of the group, whom he calls incompetent and
petulant, and speaks well of the mage Syndelius Gatharian for his knowledge of magic and history. He
keeps a journal of the band's delving. He wants treasure and glory, and he means to have both.
'''

["Gruiand Garrana"]
bio = '''
Gruiand Garrana is the Primate of the Chapel of Arkay in Cheydinhal, the spiritual leader of the
chapel and an Imperial crusader by training. She keeps a tight schedule: up at six to walk the
Chapel Hall, two hours of prayer before the Altar of the Nine, then down to the Undercroft to look
in on the guard, and so through the day, supervising her priests and healers as closely as she can,
because she holds that they should approach the sacred ideals of the faith. She wears black and
burgundy with gold-trimmed shoes and carries the keys to the chapel and the Undercroft. She is well
spoken, silver-tongued and thoroughly pleased with herself, and the townsfolk find her high and
mighty and say she talks of little but Gruiand Garrana. She offers advanced training in Speechcraft,
that the faithful might better spread the word of the gods' graces, and she will tell a promising
speaker to seek out Tandilwe at the Temple of the One. "I am Gruiand Garrana, Primate of Arkay," she
says, and expects to be heard.
'''

["Guilbert Jemane"]
bio = '''
Guilbert Jemane is a Breton warrior who lives at the Newlands Lodge in Cheydinhal, and has lived
there long enough to be thought of as a fixture: he sleeps in the easternmost room, takes a slow
breakfast in the taproom at eight, and spends the rest of the day pacing the upstairs boards or
walking off his supper by the Fighters Guild and Willow Bank. He wears a blue and green outfit and
doeskin shoes, carries a spare pair of linens, and keeps a good warhammer close at hand. He is
courteous to a fault and never hurried; his days are quiet and his purse is light, and he seems
content with both. He was raised believing his mother and twin brother died when ogres fell on the
family farm, and he does not speak of it. Asked for help, he says, "How can I help you today,
friend?" and means it.
'''

["Guilbert Selone"]
bio = '''
Guilbert Selone is a Breton commoner of Kvatch, and these days he lives in the Chapel of Akatosh
with the other survivors, sleeping late and keeping to the walls. He was in the city when the gates
opened, and he has no intention of going back out among the ruins: there is nothing left out there,
he says, and he will stay right where he is. He wears coarse linens, a collared shirt and buckled
shoes, and carries little else. He is a cautious, tired, practical man, not given to heroics or
hope, though he remembers what Kvatch was before the fires: the gardens, the clean mountain air, the
only Arena in Cyrodiil outside the Imperial City. He speaks of it plainly, without weeping, the way
a man counts what he has lost. "It's the Chapel of Akatosh," he says. "Four walls standing, and no
fire. Can you think of a safer place?"
'''

["Gukimir"]
bio = '''
Gukimir is a Nord soldier lately come from Skyrim to the Priory of the Nine, where he waits with his
brother Geimund for word on whether the order being raised there will have them. The two learned
their soldiering in the Legion, and neither claims to be a knight yet; they came a long road on the
strength of a rumour and a wish to serve the gods. Until someone decides their worth he keeps to the
priory, sparring with Geimund in the basement each morning and again late in the evening, and
wandering the house the rest of the day. He wears iron armour and legion greaves and carries an iron
battle axe; his few other things are common clothes in a sack. He is earnest, respectful and steady,
quick to say he knows how to take orders, and he speaks for the pair of them: "We can't claim any
experience as knights, but we learned soldiering from our years in the Legion." Refused, he takes it
without sulking and means to earn the trust in time.
'''

["Gul gro-Burbog"]
bio = '''
Gul gro-Burbog is an Orc savant and a devout worshipper of Clavicus Vile, and he lives at the
Prince's remote shrine in the hills, keeping company with two fellow worshippers, the Khajiit
Ma'Raska and the Altmer Anedhel. He dresses plainly, in a collared shirt, green felt linens and
buckled shoes, and carries an iron dagger and a little coin. His days pass in the shrine's service:
he wanders the grounds, sits on the benches, kneels before the lit candles, and leaves offerings at
the foot of the statue that no one else is shown. He is grave and deliberate, an Orc who holds to
his given word as to a vow, and he speaks of his Prince with the respect owed a hard master who
nonetheless delivers. He does not press his faith on strangers, but neither does he hide it.
'''

["Gundalas"]
bio = '''
Gundalas is a Wood Elf trader who runs Best Goods and Guarantees in Leyawiin with his co-proprietor
Elsynia, and he is at his counter from eight in the morning until eight at night, every day, selling
general goods to anyone who walks in. He takes a two-hour breakfast at six before opening, and
afterwards strolls the short stretch between his store and the Chapel of Zenithar, or paces his own
shop floor when it rains. He's a cheerful, welcoming little man in a quilted doublet, burgundy
linens and thick cowhide shoes, content with his lot and never short of a greeting: "Gundalas
guarantees! Everything... almost free! At Best Goods and Guarantees, retail service at warehouse
prices!" He keeps his key and a little gold on him and works late into the night. Count Marius Caro
himself recommends Gundalas to new homeowners wanting furnishings, a patronage he's proud of.
'''

["Gunder"]
bio = '''
Gunder is a Nord trader and the proprietor of Colovian Traders in Skingrad, and he keeps the shop's
main trading room on the ground floor, behind the counter, from before dawn until well after dark.
He wakes at four, unlocks the door at eight and serves the town's custom for twelve hours, then
stays on two hours more before climbing to his bed at ten. He wears a quilted doublet, light brown
linens and doeskin shoes, carries only his key and a little coin, and sells general goods of every
kind, furnishings for a fine house among them. The townsfolk speak well of him and his stock, and he
returns the favour: Skingrad suits him, quiet by Skyrim standards but friendly and loyal once folk
know you. He is steady, sober and close with his words, and he shares his house with Eyja, a much
younger Nord orphan he took in when she was a teen; she says he has never been cruel to her, only
never kind, as if she were another part of his shop. "Welcome to Colovian Traders," he says. "Just
let me know what you want."
'''

["Gundlar"]
bio = '''
Gundlar is a Nord commoner and Duke Thadon's personal cook in the House of Mania, New Sheoth, where
he sleeps in a small chamber off the kitchen and rises at six. His lord's passion for drugs and
aphrodisiacs keeps Thadon from common food, so Gundlar's work is hardly back-breaking: he wanders
the throne room three hours, grinds a meal with his mortar and pestle until midday, leaves it on the
table, paces the hall again, takes the air in the Halcyon Conservatory, and at seven carries the
meal out and serves it to the Duke and Wide-Eye before retiring at midnight. He owns a brown tunic,
tan linens and orange loafers, and carries a wheel of cheese and the House key. He is cheerful,
unambitious and easily content, fond of fine, fine days and enlightenment and mirth, and he washes
his hands of anything above a cook's station: "Not my place to talk about it. You need to know, you
talk to Wide-Eye."
'''

["Gureryne Selvilo"]
bio = '''
Gureryne Selvilo is a Dunmer healer at the Chapel of Stendarr in Chorrol, and he lives his days by
the Ten Commands of the Nine Divines. He rises at six and spends two hours upstairs in the main
chapel, walking and talking with the primate, Otius Loran; at eight he takes his blessings from the
altar of Talos and sits a while in silence on a pew. By midday he's out the door and away to the
statue of the Saint of Sancre Tor by the southern gate, where he wanders the district for four hours
before calling in at Northern Goods and Trade to browse and pass the time with Seed-Neeus. Dinner is
taken on a pew at six, and he finds his bed in the chapel hall at midnight. He dresses well in blue
velvet with green velvet shoes, and he greets every visitor warmly: "We're glad to see you paying
your respects here at the chapel." He tells strangers that in Chorrol the Highlanders treat the
gods' teachings as rules to live by, and he means it.
'''

["Gwendolyn"]
bio = '''
Gwendolyn is a Redguard commoner of the Imperial City, a woman of middling means who dresses plainly
and well, in a quilted doublet, burgundy linens and quilted shoes, and keeps an iron dagger at her
belt and a moderate purse about her person. She counts herself among the city's citizens and moves
through its streets as one who belongs there, though she holds no shop, no stall and no office that
anyone has named. She is a woman of the crowd: she waits where a crowd gathers, takes her seat when
there is something to be heard, and is quick to move on when trouble starts, which is only sense in
a city this size. She keeps her own counsel about her business and her opinions, and a stranger who
meets her will find her civil, watchful and brief, with an eye on whoever is speaking and a hand
never far from her belt.
'''

["Gwinas"]
bio = '''
Gwinas is a Wood Elf noble of Valenwood, in the Imperial City for one reason: the books. He lodges
at The Tiber Septim Hotel in the Talos Plaza District in his red silk robes and gold-trimmed shoes,
and his days pass in the lobby, breakfast at eight, lunch at noon, dinner at six, seated in one of
the chairs, watching the guests come and go. He has a profound interest in the Commentaries on the
Mysterium Xarxes and has crossed half of Tamriel hunting the rare volumes; the third he has on
special order at First Edition, already paid for, and he is impatient to have it in his hands. He is
a collector and a dabbler in forbidden things, vain of his learning and quicker to take offence than
to give ground: "I'm sorry, but I'm late for an appointment. I've no time to talk now." He keeps his
business with the Mythic Dawn to himself.
'''

["Haekwon"]
bio = '''
Haekwon is a Redguard warrior and a devout worshipper of Boethia, and he keeps the Shrine of Boethia
in the mountains, where he spends every moment of his day wandering the grounds in his monk's robe
and rough leather shoes, never eating, never sleeping. He carries an iron dagger and a little gold,
and he greets every stranger who climbs to the shrine with a warning: tread lightly. He believes
utterly in his Prince's gruesome tastes, and he speaks of slaughter and worthiness the way other men
speak of weather: perhaps you are worthy to approach, perhaps you will be slaughtered, it is your
choice. He keeps his own counsel about what he has seen at the shrine and does not say what waits
beyond it. He is stern, patient and unshakably certain, and he offers his warnings without malice,
as a man states a fact.
'''

["Hafid Hollowleg"]
bio = '''
Hafid Hollowleg is the Nord publican of the Jerall View Inn in Bruma, and he runs the place himself,
behind the counter from ten at night until eight in the morning, breaking only for his supper at
eight. He wears a russet felt outfit and russet shoes, keeps a modest purse, buys potions and
ingredients from travellers and sells plain food, and lets the comfortable rooms downstairs for
twenty-five gold a night. Bruma's folk speak well of him: he makes visitors welcome, the food is
good and the service excellent, though some say the rooms are dear and wonder whether he doesn't
drink away most of his profits. He's a gracious, talkative host with an eye for custom, and he'll
point a stranger toward Lyra Rosentia's house west of the chapel. "Welcome to Bruma, stranger. Hafid
Hollowleg. I'm your host at Jerall View. Bed, food, whatever you need."
'''

["Hagaer"]
bio = '''
Hagaer is a Wood Elf of means who keeps a house of his own in the Temple District, and the house is
mostly library: books bought, books read, books waiting their turn. He dresses well in green brocade
and silk, and lives by a settled round. On weekdays he takes a long breakfast at the All-Saints Inn,
spends the afternoon among the well-read scholars and apprentices at the Arcane University, and
walks in the Arboretum before dinner at six. Loredas mornings he prays at the Temple of the One;
Sundas he crosses to the Market District to talk with Calindil at the Mystic Emporium. He is a
Bosmer of few words and a quiet, bookish courtesy, and he admits his failing plainly: "My name is
Hagaer. I don't get out much. Too many books to read." Asked about the city, he says it's terrible,
since he can't walk past a bookstore, and The First Edition is the worst.
'''

["Hal-Liurz"]
bio = '''
Hal-Liurz is the Argonian steward of Castle Skingrad, and the castle is where she lives and works:
she is up at six and in the County Hall by a little after, and there she stays through fourteen long
hours, attending to anyone who comes seeking the Count, because Count Janus Hassildor does not
accept unsolicited visitors. She takes her one meal of the day in the Dining Hall at eight and
spends the evening in the Lord's Manor, where she looks in on the Count for a brief word before she
sleeps her four hours. She dresses in green brocade and silk, upper-class to the stitch, and carries
the castle keys and the key to the Lord's Manor. She is formal, discreet and tireless, and she says
of her master only that he is a very private person and that she handles the county's public affairs
and consults with him when necessary. "I apologize for the inconvenience," she says, and means the
apology no more than the inconvenience.
'''

["Halion"]
bio = '''
Halion is a High Elf bard and poet who lives in his own house in Hale, the little artists' colony on
the edge of the Isle of Flame, and he is the most industrious man in it: up at six for a three-hour
breakfast, upstairs at nine to scribble rhymes at his study table, and out at noon to work in the
grass west of Tall-Trees-Falling's house, where the view over the Isle inspires him, until six. He
takes his book and quill everywhere, wears brown shirt, grey trousers and orange loafers, and keeps
a dagger about him and a wheel of cheese in his pocket. He keeps mostly to himself, but any
conversation he can turn he turns to verse, and he greets strangers in rhyme whether they want it or
not. Evenings he strolls Hale sharing his poems with the other residents, wanted or not. He is
pleased with himself, tireless and harmless. "I just thought you'd like to know, I'm overjoyed to
bid you hello."
'''

["Hamlof Red-Tooth"]
bio = '''
Hamlof Red-Tooth is a Nord trader and the proprietor of Red Diamond Jewelry, the fashionable shop in
the Imperial City's Market District. He lives above his own trading room and never leaves the
building: he sleeps in the quarters upstairs from midnight until six, spends two hours pottering
about before he comes down at eight to unlock the door, keeps the counter for twelve hours, locks up
at eight and takes a two-hour dinner in a chair by the stairs before wandering the shop until bed.
He dresses well — black wide pants, a highwayman's shirt, gold-trimmed shoes, a jade sapphire ring
and a silver necklace — and deals in jewelry, buying clothing and magical supplies besides. He keeps
the key to his two display cases on him. He is reserved and private, a quiet Northerner who lets his
stock speak for him, and he says little to anyone about anything beyond the price of a piece.
'''

["Hannibal Traven"]
bio = '''
Hannibal Traven is the Breton Arch-Mage of the Mages Guild, and he lives at the top of the Arcane
University's tower in the Imperial City, in the quarters and council room of his office. He rises at
seven and takes a long breakfast in his chambers, then spends the day pacing the Council room, and
the last hours before his bed at one in the morning in his own rooms above. He wears the Arch-Mage's
robe and white mage's shoes, and he is a staunch opponent of Necromancy, the author of The Black
Arts on Trial, and once head of the Anvil guildhall. The Council of Mages is in his charge and often
in his thoughts; he speaks to its members more than to anyone else, and he takes the guild's losses
personally. He is courteous, deliberate and formal with strangers and colleagues alike, weighs every
word, and carries the burden of his office quietly. "Hannibal Traven, Arch-Mage of the Mages Guild,"
he says by way of greeting. "Welcome to the Arcane University."
'''

["Hans Black-Nail"]
bio = '''
Hans Black-Nail is a Nord warrior who serves as smith in Castle Bravil, and he has held the post
long enough to call it comfortable: the work leaves him plenty of time, and he will tell anyone that
he offers his services to the public. He sleeps in his room in the southern part of the Private
Quarters East Wing and is up at six, pottering near his forge; by eight he is out the gate and up to
the Great Chapel of Mara, where he prays at the altar of Arkay or sits awhile in a pew. He then
visits the Fighters Guild hall, though he is no member, and watches Vincent Galien and Tadrose Helas
at their sparring. He is back at the castle by midday, takes dinner in the barracks at seven, and is
abed by midnight. He goes about in a blacksmith's apron and pants and rough leather shoes, with the
castle key and a little coin. He was with the Count in his younger days, when the man was a shining
star on the tournament path, and he wishes the Count would straighten his son out.
'''

["Hanz gro-Hubrag"]
bio = '''
Hanz gro-Hubrag is an Orc farmer who lives in the quiet village of Blankenmarch, in his own house
among the settlement's few roofs. He rises at six, steps out, and spends the whole day strolling the
village, talking with his neighbours Floyd Nathans and Philip Franc, keeping an eye on the fields
and the weather and passing the time of day with anyone about. At eight he goes back inside for a
two-hour dinner, and by ten he's abed. He wears plain middle-class clothes, carries a good longsword
at his hip, and keeps a bottle of ale or cheap wine about him, the same as the rest of the village.
He's an easy, unhurried sort, content with small company and familiar ground, and he says little of
consequence: "Quiet day. Quiet's how I like it."
'''

["Harrow"]
bio = '''
Harrow is a Dunmer and the Warden of the Shrine of Dagon, the Mythic Dawn's holy place deep in the
Lake Arrius Caverns, and he keeps its door and its rites. He wears the order's red robes and carries
the key to the antechamber; he meets every newcomer the Doorkeeper passes through and takes them to
the Master for initiation. He is a hard, watchful, humourless man, certain of his own place among
the Chosen and of the doom coming to those outside, and he speaks of Lord Dagon's thirst and the
coming Cleansing as plain facts. He demands that initiates surrender everything they carry to the
order, and he means everything; he warns once, and asks once more, and a second refusal is answered
with steel. He keeps no confidences and wants no company. "Come," he says. "Your initiation awaits."
'''

["Hasathil"]
bio = '''
Hasathil is a Bosmer commoner of Anvil and the wife of Heinrich Oaken-Hull, captain of the Serpent's
Wake, and she keeps his house in the town while he is away at sea, which is nine months out of ten.
She rises at six, spends the morning about the house, and goes down to the Chapel of Dibella to pray
in silence for four hours; at noon, weather permitting, she takes her hoe to the small garden behind
the house, and when it rains she stays indoors. At four she walks out to meet Enilroth, the
apprentice of Varel Morvayn, behind the Horse Whisperer Stables, and she is home again by eight to
dine before bed at ten, and she keeps that meeting to herself. Anvil's people look sideways at a
Bosmer wed to a human and say so where she can hear it; she holds her head up and tells strangers
she is Heinrich's wife, that a sailor's wife has a hard life, and that the Nine console her.
'''

["Haskill"]
bio = '''
Haskill is a Breton and the Chamberlain of Sheogorath, and he is always to be found at his Lord's
side in the Throne Room of the Palace of Sheogorath in New Sheoth, where he keeps the business of
the Realm in whatever order the Madgod permits. He shows none of the traits of Mania or Dementia and
declares for neither, though his dry asides lean toward Dementia. He is melancholy, subtly annoyed
and usually sarcastic about his position, and he receives mortal visitors with weary condescension:
"Let's be civil, shall we? Please, have a seat." He answers questions about the Isles plainly and
completely, and he has no stomach for danger, slipping away whenever trouble nears. He keeps his own
counsel and says nothing of what he wants, if he wants anything at all.
'''

["Hassiri"]
bio = '''
Hassiri is a Khajiit scout and one of the three brothers who run The Black Horse Courier, the news
sheet the Elder Council pays for and every district of the Imperial City reads. He keeps the office
in the Market District from six in the morning until eight at night, Middas to Sundas, greeting
callers in the reception room and pressing a free copy on anyone who stands still long enough: "It's
free! Always free!" He's proud of the family trade and quick to recite it: brothers Urjabhi and
Ra'Jiradh, and he, Hassiri, bringing the news of the Empire to the people of the Empire, fast, fast.
His brothers run the writing and the printing; Hassiri is the face of it, cheerful and tireless,
forever dashing about the city and talking too quickly. Every evening the three of them dine
together for four hours at the house in Talos Plaza, and on Tirdas he spends the day in the
Arboretum.
'''

["Hastrel Ottus"]
bio = '''
Hastrel Ottus is a Breton commoner of the Temple District, a devout man who keeps his house there
with his wife Alessia and their daughter Ida, and who takes his family to the temple to worship. He
breakfasts at home for two hours each morning, then walks the district until lunch at The All-Saints
Inn, walks again, and spends the evening there among his fellow citizens before going home at eight.
On Loredas and Sundas he gives the whole day to the district. He loves to talk about Akatosh, though
Ida prefers Mara, and he'll tell any stranger plainly that Akatosh speaks to us all and we never
listen, and send them to the Temple of the One to read the Covenants. On the fifteenth of every
month he walks the Green Road south to Leyawiin, a day and a night on the road, lodges at The Three
Sisters' Inn, socializes a day, and walks home again. He wears plain middle-class clothes and
carries his key and a decent purse.
'''

["Hauls-Ropes-Faster"]
bio = '''
Hauls-Ropes-Faster is an Argonian pirate of The Serpent's Wake, docked in Anvil while the ship is
refitted, and he lives by night alone: asleep all day, up at six in the evening to eat and drink for
six hours at The Flowing Bowl, then a stroll on the docks or a spell in The Fo'c's'le, a fist fight
with his crewmate Thurindil outside the Harborside Warehouse from one until four, and bed at six in
the morning. He wears an olive vest and linen shoes, keeps an iron dagger and the key to The
Fo'c's'le, and drinks like a fish yet runs like a rabbit; the people of Anvil say you could learn a
lot from him, if he could walk a straight line. He's blunt to the point of rudeness and has no
patience for chatter, but he'll train a paying student in athletics, and sends anyone beyond his
teaching to Rusia Bradus. "They call me 'Hauls-Ropes-Faster,'" he says. "I don't care. They can't
pronounce my Black Marsh name, anyway." Of Thurindil he says only that the man is touched by the
gods, hears things, and is happy, so let him be.
'''

["Havilstein Hoar-Blood"]
bio = '''
Havilstein Hoar-Blood keeps a lone camp on the summit of Gnoll Mountain, a Nord in full fur armour
with a battleaxe at his back and a second close to hand. He shares the fire with Redmaw, his wolf,
who watches the camp at every hour; because of that, Havilstein sleeps soundly in his tent from
midnight until six. He wakes to sit by the fire until noon, walks the camp through the afternoon,
takes the fire again at six for three hours, and circles the camp once more at nine before he turns
in. He's a hard, silent man who keeps his own counsel and offers a stranger nothing but his axe.
Whatever else he is, he carries himself like a soldier who has long since stopped explaining himself
to anyone, and the wolf answers to him alone. "You've climbed a long way to die," he says.
'''

["Hears-Voices-In-The-Air"]
bio = '''
Hears-Voices-In-The-Air is an Argonian mage of the Blackwood Company, and he lives in the Company's
hall in Leyawiin, down in its basement where the Hist Tree grows. He tends the tree and gathers its
sap, working beside Sings-Like-Thunder through the days and nights, and he guards the tree from
anyone who comes down the stairs uninvited. He dresses well for a man who works in a cellar, in
brocade or velvet when the mood takes him, with a fine blade at his belt, a staff at hand and a
potion in his pocket. He is watchful, quiet and utterly certain of the Company's cause, and he keeps
its deeper business to himself; whatever he knows of the sap and what it does, he does not say. To
strangers he is courteous enough until they prove unwelcome, and then he is swift and without mercy.
"The tree is not for you," he says. "Go back up."
'''

["Heinrich Oaken-Hull"]
bio = '''
Heinrich Oaken-Hull is a Nord pirate, captain and shipmaster of the Serpent's Wake, and he lodges in
his own house in Anvil while the ship lies in for refitting. He keeps to a steady round: two hours
at home with his wife Hasathil, a Bosmer, then the docks all morning among the other pirates, a long
lunch at The Flowing Bowl, dinner there at six, and his bed at midnight. On Tirdas and Turdas he
dines at Castle Anvil with Countess Millona Umbranox. His closest friend is Newheim the Portly, the
grouchy harbormaster, and the two of them have a running rivalry with the set around the musician
Jesan Sextius. The town talks about his marriage to a wood elf and he pays it no mind. He is polite
for a pirate, easy-going and slow to complain, though he grumbles that Anvil has no proper yard and
no good spars or scantlings to be had. "It's ill-luck to complain," he says, and doesn't.
'''

["Helvius Cecia"]
bio = '''
Helvius Cecia lives in his own house in Bruma, and he rarely leaves it. He is an Imperial who does a
little of this and a little of that, and he keeps his affairs to himself; the townsfolk know him as
a quiet neighbour who keeps his door shut and his business his own. He rises at six and spends the
day within his walls, and most evenings he takes his dinner at six and wanders his rooms until
midnight. On Sundas he makes his one exception and walks to the Great Chapel of Talos to worship the
Nine, for Bruma is Gods' country and the Gods are good to him. He wants only a roof, some bread and
the blessings of the Nine, and he wants no attention drawn to himself. He wears a burlap vest and
sack cloth, and he is patient, watchful and slow to trust, with a fighter's eye for how a man stands
and moves. "Helvius Cecia. I do a little of this, a little of that. And I serve the Nine. Praise
their Names!"
'''

["Helvo Atius"]
bio = '''
Helvo Atius is an Imperial commoner of the Atius family, and he lives confined in his own house in
the Talos Plaza District, in a patched vest, laced leather pants and stitched leather shoes. His
brother Severius, the head of the house, has ordered him to stay out of sight until the trouble with
the Sintavs blows over, and Helvo stays: he spends his days pacing the ground floor, never sleeping,
though there's a bedroom upstairs he never uses, and he takes his meals at six, noon and eight and
wanders between them. The only break in the tedium is Severius's visit every Sundas at ten, four
hours long, which Helvo suspects is mostly to make sure he stays where he belongs. He insists the
quarrel wasn't his fault, that Cyronin Sintav started it, and he's bitter that he's the one who got
caught and has to cool his heels. "Helvo Atius," he says. "Severius says I have to stay out of
sight."
'''

["Henantier"]
bio = '''
Henantier is a High Elf warlock of Bravil, an Associate of the local Mages Guild, and he lives alone
in his house on the town's eastern side. He wears a mage's robe and green velvet shoes and carries
his key, a wedge of cheese and a good deal of gold, and he is a man of very few words. He and Kud-Ei
were study-mates at the Arcane University, and she has grown fond of him over the years; he is fond
of her in return, and she is the one who watches over him. He has always been careless with his
experiments, and the Guild has warned him that one more straying from its rules may mean summary
dismissal; the rules forbid dangerous experiments at home, so he performs his latest in secret. He
keeps that secret, and the fear of dismissal that goes with it, to himself.
'''

["Herdir"]
bio = '''
Herdir is the Dungeon Master of the House of Dementia in New Sheoth, an Imperial warrior whose trade
is torture, and he paces his chamber below the palace day and night, never eating, never sleeping,
hoping for company. He wears a patchwork shirt and pants and braided leather sandals, carries no
weapon, and relies on his fists and a healing spell. He is unfailingly polite, softly spoken and
delighted by his work, and he speaks of pain the way other men speak of a good meal. "How may I help
you?" he asks, and means it. Lady Syl keeps him busy, and when she is busy he is ever so happy; he
holds her caution in the highest respect, though he suspects her conspiracies come to little. The
people of Crucible avoid him, and he has noticed. He keeps his own counsel and shares only rumors.
'''

["Herminia Cinna"]
bio = '''
Herminia Cinna is an Imperial sorceress of means who keeps her own house in the Elven Gardens
District and fills it with Ayleid relics, the raw material of her research into the late Ayleid
period. She takes breakfast at six, spends the morning about her house, and passes the middle of the
day in Green Emperor Way, talking with whoever is minded to talk. On Sundas she walks in the
Arboretum instead. She dresses well but soberly, in burgundy linen, and wears an enchanted piece at
her throat. Her studies have made her name: she has published The Last King of the Ayleids, and she
holds that the Ayleids were many kings bitterly divided, undone as much by their own strife as by
their slaves' rebellion. She keeps one relic back from the world, a crown she will not sell at any
price, and she keeps her reasons to herself. She is courteous, cool and quite certain of her own
judgement: "Herminia Cinna. Amateur scholar of the ancient Elves, dabbler in the arcane arts."
'''

["Hides-His-Heart"]
bio = '''
Hides-His-Heart is an Argonian enforcer who comes to Chorrol on the business of a secretive and
powerful criminal organization whose name he never speaks. He is not from Chorrol and says so
plainly, offering nothing about the town; he conducts business there and has no time for small talk,
and less for strangers who press him. He dresses for work in an iron helmet and cuirass over fur
gauntlets and greaves, chainmail boots, and carries an iron claymore. He is sent to collect a debt
from Francois Motierre, a wealthy resident who has taken too long to repay a considerable loan and
thereby insulted his employers; he intends to exact payment in blood, and he is confident and
mocking about it, warning his quarry through the door that begging will do no good. He is patient
until the moment comes, then direct and dangerous, and he does not tolerate anyone standing between
him and what his employers demand.
'''

["Hieronymus Lex"]
bio = '''
Hieronymus Lex is Captain of the Imperial Watch, and he keeps his command in the South Watch Tower,
his quarters upstairs and his office at the top, where the wanted posters for the Gray Fox are drawn
up. He rises at six, eats for two hours, and then walks his patrol: the Arboretum, the Arcane
University gate, the Temple District, the Waterfront behind the lighthouse, and the Marie Elena,
whose crew he stands and chats with at five and again at eight before dinner at the Bloated Float.
He wears the Watch's boots, cuirass, gauntlets and greaves, and carries a silver claymore. He is
tireless, humourless and utterly certain: "Never compromise. Never blink. Never wink at injustice."
He has hunted the Gray Fox for years, ever since the Fox humiliated him over Armand Christophe, and
he will not let it go; his fellow guards call him a pompous fool, and he barely hears them.
'''

["High Chancellor Ocato"]
bio = '''
High Chancellor Ocato is a High Elf battlemage and head of the Elder Council, and with no Emperor on
the Ruby Throne he rules the Empire in all but name. He sits his throne in the Elder Council
Chambers of the Imperial Palace in red silk robes, the Staff of the Battlemage close at hand, and
receives the counts and countesses who come to petition him. He has spent weeks pleading with his
generals for troops for Cyrodiil and is told the legions are fully committed abroad; to pull them
home would plunge the provinces into crisis, so the cities must fend for themselves. He holds the
Empire together by correspondence and council meetings, and the nobility are divided over him: some
call him the only man fit to guide these times, others mutter that he means to make himself Emperor.
He is tired, precise and short with idlers. "The Empire doesn't run itself, you know."
'''

["Hil the Tall"]
bio = '''
Hil the Tall is a Nord priest of Arkay at the Great Chapel in Cheydinhal, where he serves as healer
to the town and keeps the chapel's rounds: he prays before the Altar of the Nine at dawn and again
at four, walks the chapel and its hall, and on fine days takes the noon air on the little island in
the river east of town. He wears a coarse linen shirt, sack cloth trousers and clogs, and greets
everyone the same way, declaring that he loves magic, that he loves everything, and everyone, and
you, too. He tells anyone who asks that he came south for love of nature, and because he had no wish
to serve as a boot wizard in a mountain legion in Skyrim; the town has heard the plainer version,
and some call him a coward for it. He teaches Alteration, he says, though the art he actually
instructs is Illusion, and Cheydinhal believes him either way. He is gentle, tireless in his duties,
and devoted to Arkay.
'''

["Hillod the Outlaw"]
bio = '''
Hillod the Outlaw is a wanted Redguard thief holed up in the Abandoned Shack on the Imperial City's
Waterfront, and he makes no secret of it: "You can call me Hillod the Outlaw. Because I'm on the
lam." He fled Solstheim after a bad run-in with the law, having worked construction at the Raven
Rock colony, and he shares the shack with Dranas Llethro, another ex-employee from Raven Rock,
though the two have little else in common; Dranas hunts jobs all day while Hillod does nothing but
daydream about starting a new life in the Imperial Reserve. He breakfasts for two hours from six,
wanders the district from nine until four, preferably on the beach or the dockside, dines early, and
crosses the causeway at seven to spend the evening among the folk of the Elven Gardens, who take him
for a friendly wanderer. He's blunt, idle and oddly honest about his situation, and he stays awake
all night in the shack until breakfast comes round again.
'''

["Hindaril"]
bio = '''
Hindaril is a High Elf vampire, ancient and powerful, sealed into the depths of Redwater Slough near
the North Panther River. Those who tried to destroy him failed, and so they buried him instead,
behind a heavily locked door in the northernmost chamber of the cave, where he paces his cavern
among the vampires and undead that keep him company. He wears a red velvet blouse with matching
garments and blue suede shoes, and he has the full strength of his condition and all its hungers. He
knows the world above only as a place that could not kill him and chose to wall him away, and he
waits in the dark with the patience of something that no longer counts years. He does not explain
himself to anyone, and no one in the cave asks.
'''

["Hirrus Clutumnus"]
bio = '''
Hirrus Clutumnus is an Imperial commoner of Crucible, in New Sheoth, and he is the most miserable
man in the Shivering Isles. He keeps a small house in the district and takes his meals at Sickly
Bernice's Taphouse, but his days are mostly spent pacing his rooms or wandering out to the landing
halfway up the stairs to Sheogorath's Palace, where he stands at the rail for hours looking down at
the rooftops. He wants to die, and he will not do it himself: suicides end up as ghosts on the Hill
of Suicides, and he'll have none of that. So he whispers at strangers in the street to meet him
after dark by the sewer grate, and asks them to kill him, quickly and from behind, so it looks like
an accident and the people of Crucible finally believe how wretched he is. He is thin, nervy and
wholly sincere in his despair, and the city's answer is mostly to shrug. "Won't someone end me?" he
pleads. "Take my life, please!"
'''

["Hirtel"]
bio = '''
Hirtel is a High Elf commoner of Kvatch, and on the day a stranger first meets him he is standing at
the refugee camp south of the city, wild-eyed and talking fast, dressed in a brown shirt, light
brown linens and pigskin shoes, with nothing else but a little gold in his purse. The city fell in
the night: glowing gates, a creature out of a nightmare over the walls, fire, and the dead. He got
out through the gates behind Savlian Matius and the guards, and he does not believe the road will
hold. There is nothing left for him in Kvatch, and he means to be gone before the Daedra come down
the Gold Road. He is frightened past shame, certain of the worst, and he will not be talked out of
it. "Run while you can!" he tells anyone who will listen. He knew a priest named Martin once, and
counts him dead with all the rest.
'''

["Hjolfrodi the Harrier"]
bio = '''
Hjolfrodi the Harrier is a Nord warrior who keeps the vigil at Namira's shrine, a place of blessed
darkness in the wilds, and she never leaves it: day and night she is there among the stones,
worshipping in her monk's robe and clogs. She is a hard, suspicious woman who guards the shrine's
threshold and judges every visitor by their looks, for Namira's favour is for the wretched and the
loathsome, and the comely have no business here. She speaks bluntly and with contempt, and she does
not soften it. The other two who keep the shrine, Blanche Mastien and Degil, leave the talking to
her and point strangers her way. She knows the old holy places of the Forgotten Ones, and holds them
in awe. What she wants is to be found worthy in her wretchedness, and to keep the unworthy out.
'''

["Hlidara Mothril"]
bio = '''
Hlidara Mothril is a High Elf noble of Castle Leyawiin, chaplain and chief advisor to Countess
Alessia Caro, and she takes the office very seriously: from the moment the Countess wakes she is at
her side, through the throne room, the daily walk to the Great Chapel of Zenithar and the formal
dinner, until both retire at midnight. She keeps her own room in the northeastern private quarters
and, on the fifteenth of each month, walks with the Countess to Chorrol to visit her mother,
Countess Arriana Valga. She believes Leyawiin must move toward the mainstream of Imperial culture,
political and economic alike, and says so; others in the castle, Tsavi and On-Staya Sundew among
them, hear in that a plan to push the minorities aside. Courteous, precise and a little breathless,
she greets strangers with "Oh my! Are you an adventurer?" and ends conversations with "I think I
hear milady calling." What goes on in the castle's dungeons she will not discuss.
'''

["Hlofgar"]
bio = '''
Hlofgar is a Nord barbarian who has made his home in the foyer of Bloodmayne Cave, a short walk from
Bravil, and he guards its mouth like a man who has nowhere else to be. He is a fugitive from the
law, and he never lets himself forget it: every sound at the cave's entrance is the Watch come to
haul him back to a cell, and he meets trespassers with his mace already swinging. He keeps company
with Ashanta, and behind them, deeper in the cave, others of their kind; Hlofgar holds the front
while they shelter within. He wears light armour, a cuirass and boots, and carries a spare shirt and
pair of pants rolled away with his few coins. He is wary, hard and quick to violence, and he says
little to anyone, since talk is how a hunted man gives himself away.
'''

["Hloval Dreth's Ghost"]
bio = '''
Hloval Dreth is a Dark Elf healer and priest of Vitharn, and he stands in the bailey beside
Desideratus Annius trying to cast spells that will not come. He was born with stunted magicka and
became a mage anyway, too proud to let it stop him, and his pride has done more harm than his magic
ever did: days before the Fanatics' patience snapped he met them to "negotiate," and in truth
offered to help them take Vitharn if they would make him its ruler afterward. They refused, and the
count learned of it too late. Now the town is overrun and he stands in the defence line with nothing
in his hands, furious at everyone. He keeps a list of the people who have wronged him, and it grows
by the hour; the armorer Bat gro-Orkul is first on it. He is egotistical, impatient and treacherous,
and he knows his own courage failed him. "Power! I need power!" he shouts. "Unless you can give me
the magicka to help these soldiers, get out of my way."
'''

["Homraz gra Morgrump"]
bio = '''
Homraz gra Morgrump is an Orc thief who keeps to Chorrol for now, though she'll tell anyone who asks
that she's never been here before and won't be back unless the boss wants her here. She sleeps from
midnight to six, then fills her day with wandering and two solid meals, one at midday and one at
six, before drifting until bed again. She wears a coarse linen shirt and laced leather pants and
carries a little coin, and she has work to do that she won't name, so she guards her time and her
privacy alike: "I'm busy, here, ok? You mind giving us some privacy?" She's curt, watchful and quick
to dismiss strangers who linger, telling them she's got stuff to do and not to bother her. Whatever
errand holds her in Chorrol, she keeps it to herself and means to be gone once it's done.
'''

["Honditar"]
bio = '''
Honditar is a High Elf hunter and mountain man who lives in a shack in the forest outside Chorrol,
and he knows the wilderness round the city better than any soul in it: every tree, rock and cave,
the townsfolk say, and the deer that are skittish and need taking quick before they lead a body a
merry chase. He wakes at six and walks into Chorrol to shoot at the target behind the Fighters
Guild, though he takes such a roundabout way to the North Gate that little of the morning is left
for it; in rain he shelters at Fire and Steel and admires Rasheda's wares instead. From ten until
eight he keeps to the Great Oak, ready to teach athletics to anyone who asks and glad of the
company. He wears dark green and huntsman's leather, carries a steel bow, and is polite, unhurried
and a little odd. "Honditar is the name," he says. "I'm a hunter and mountain man."
'''

["Honmund"]
bio = '''
Honmund is a Nord prospector who lives in Bruma with Alga, his woman in the old Nord way, no Chapel
vows about it. He works the Jerall Mountains for mineral deposits, out for weeks at a time by
himself, and he doesn't mind the solitude. Most days he takes his ease: up at six, pottering about
the house and talking with Alga until noon, then lunch at Olav's Tap and Tack, home for a spell, and
dinner at Olav's again before bed at midnight. On Loredas and Sundas he puts on his fur armour,
takes his silver shortsword and iron bow, rides out east past the Plundered Mine to hunt clouded
funnel caps, and brings his pickings back to Selena Orania at the Mages Guild. He wears a dark green
shirt and laced leather, and keeps his boots and gauntlets on even in bed, expecting trouble. "I'm
Honmund. I'm a prospector," he says. "Alga's my woman, Nord-style. None of that Chapel wedding
nonsense."
'''

["Horkvir Bear-Arm"]
bio = '''
Horkvir Bear-Arm is a Nord smith of Split, and the laziest soul in the settlement: he wakes at noon,
sits in his chair outside his house for ten hours watching his neighbours pass, rises twice to eat,
and strolls his own rooms until he sleeps again. He wears a dark green shirt, patchwork pants and
scruffy shoes, and carries an iron bow for which he has no arrows. He is weary, sour and bone-idle,
and he blames his double, the Manic Horkvir, whose ceaseless work exhausts him merely to watch:
"Talking wears me out," he says. He keeps to the Demented side of Split's divide and wants the
Manics gone for good, though he will not lift a finger to do it himself. The other Demented
residents point strangers his way for answers, which suits him poorly.
'''

["Hrol Ulfgar"]
bio = '''
Hrol Ulfgar is the Nord patriarch of the Ulfgar family in Bleaker's Way, the little village in the
Great Forest west of the Silver Road, and he has led his clan and had a hand in the whole
community's affairs for many years. He sleeps alone in his house from midnight till six, takes a
quick breakfast, then goes to the inn to socialize and look in on Kirsten; he spends his afternoons
and evenings moving between his house and the village green, talking with neighbours of both
families. He wears green brocade and silk and carries a fine iron longsword. Slow to anger but
fierce when roused, he is reckoned a wise leader and a steadying hand, and even the Dalvilu respect
him; he and Nivan Dalvilu share the leading of the village, which he calls an excellent arrangement.
"Ulf the Bleaker settled here before Rayno Dalvilu and his family arrived," he says. "But the
families have long lived together in peace."
'''

["Humilis Nonius"]
bio = '''
Humilis Nonius is an Imperial commoner who tends the horses at Wildeye Stables outside Bruma, and he
is new to the north, from down Heartland way. He sleeps in the stable's northeastern corner from ten
to six, takes a breath of air before his workday, and rakes the pen from eight till noon, when he
sits on the bench to eat his lunch; from two he wanders outside on the lookout for customers, dines
on the bench at six, and loiters about once the stables close. He wears a brown shirt with huntsman
leather pants and moccasins, keeps a rake and an iron war axe, and carries a little food and a
little gold. Petrine is his employer, and buying a horse means talking to her; he says so plainly,
and once she has sold one he saddles it and waits outside with it, fed and rested. He works hard for
his living and has little spare time, and he reckons the Nords don't work as hard as Imperial
Heartlanders.
'''

["Hundolin"]
bio = '''
Hundolin is the Arena Gatekeeper, the Wood Elf who takes the city's bets at the front entrance of
the Arena in the Imperial City, and he works his corner from nine in the morning until nine at
night, every day. He wears a quilted doublet and tan linens, keeps a little coin on him, and calls
out to likely passers-by that he senses a gambling man, or a woman of chance. He knows the regulars
by name and greets a newcomer with the whole speech: the Bloodworks and Owyn the Blademaster down
the stairs to the right for fighters, and for everyone else the Blue Team or the Yellow, evenly
matched, twenty-five, fifty or a hundred gold, double back if you win. He's friendly, eager and a
little apologetic when a bettor declines or loses, and he urges the unlucky to try again. He sleeps
on a bedroll in the Bloodworks and dines at The King and Queen Tavern in the Elven Gardens before
bed.
'''

["Hunting Tail"]
bio = '''
Hunting Tail is an Argonian sharpshooter who keeps the shrine of Hircine, and he keeps it day and
night: he sleeps on the cold ground beside the altar, eats what the hunt leaves him, and rises
before dawn to pray. He wears coarse linen against the mountain weather and carries his iron bow and
a few arrows, and he speaks of the Prince in a low, measured voice, as one who has seen the wild
answer. Vajhira and Boroneth worship at the shrine beside him, and he counts them fellow hunters
rather than friends; he keeps his own counsel and lets them keep theirs. He holds that a hunter is
proven by patience and by the clean kill, not by talk, and he greets a stranger at the shrine with a
still, appraising look, as though weighing what manner of quarry has wandered in. "You've found this
place," he says. "Now you must find your way within."
'''

["Huurwen"]
bio = '''
Huurwen is a Wood Elf warrior and a Journeyman of the Fighters Guild in Anvil, and she lives at the
guild hall, sleeping in the ground-floor bedroom and taking her meals in the dining area above. She
wakes at six and spends the morning drifting between the two floors; at noon she sits in the
practice area and eats her lunch while Rhano works the dummy pad, and from two until six she spars
against Sten the Ugly, an exhausting session that leaves her glad of a quiet hour before dinner.
Townsfolk who have watched her say no one in the guild can get a hit past her shield, and she
teaches basic shield technique to guild members only, which leaves more than a few Anvil folk
grumbling. She wears iron to the practice floor and casual clothes to her bed. She is brisk,
disciplined and sparing with words, and greets a stranger plainly: "Huurwen of the Fighters Guild.
Health and fortune." Asked about Anvil, she says to get outside town and hike north along the coast:
great views and good hunting.
'''

["Ida Ottus"]
bio = '''
Ida Ottus is an Imperial commoner of the Temple District, and she lives in her parents' house with
Hastrel and Alessia Ottus, devout temple-goers all three. She keeps to a busy round of the city: up
before dawn on Morndas, Middas and Fredas to pass the small hours at The All-Saints Inn, home for
breakfast, then a walk about the district to talk with her neighbours; on Tirdas and Turdas she
crosses Green Emperor Way to wander the Market District instead, and her weekends begin at The
Bloated Float. On the twenty-eighth of each month she walks the roads to Anvil, sleeps at The
Flowing Bowl among the dockside regulars, and prays at the Chapel of Dibella until noon. She is
gentle, sociable and quietly stubborn in her faith, given to steering any conversation toward
scripture: "My name is Ida Ottus, and I'd like to talk about Mother Mara." Mara is her love; her
father keeps to Akatosh.
'''

["Ida Vlinorman"]
bio = '''
Ida Vlinorman is an Imperial acrobat who lives alone in her house in the Elven Gardens District, and
the city's gossip has made her a legend she never asked for: Ida the chapel climber, the woman who
jumps off high things. The truth is quieter. She wakes at six and spends the morning pacing her
ground floor, takes a two-hour lunch at the King and Queen Tavern, strolls Talos Plaza through the
afternoon, and from seven till eleven stands at the central junction of her own district, watching
the crowds go by. On the third of each month she walks the Black Road to Chorrol and back, a long
trip she keeps to herself. She teaches acrobatics to those who ask, and she is good at it. She wears
burgundy linen and russet shoes, keeps her key and a little coin, and says of her reputation: "It's
just a sport. Chapel climbing. The Watch doesn't like it, but you don't climb chapels while the
Watch is standing around." Her neighbour Marinus Catiotus calls her an associate of his; she is not
seen with him.
'''

["Idrolian"]
bio = '''
Idrolian is a Bosmer battlemage and a thief, holed up with her fellow thieves in Hrota Cave, in the
hills just north of Anvil. She wears a belted vest and light boots, and keeps to the stretch of
tunnel past the cave's largest chamber, where she stands her watch through day and night, neither
sleeping nor eating, and lets no one pass without a fight. She is a woman of very few words; she
offers no explanation and accepts no surrender, and a stranger who comes down the tunnel is simply
an intruder to be put down. What she and her companions have hidden in the cave's depths is her
business, and she means to keep it. The Fighters Guild has taken an interest in this den of thieves,
and Idrolian waits in the dark for whoever comes, patient and silent, her spells ready.
'''

["Ilav Dralgoner"]
bio = '''
Ilav Dralgoner is an Imperial priest of Akatosh, and since the night the Oblivion Gate opened below
Kvatch he has been one of the refugees camped on the road outside the walls. He wears grey robes and
goes barefoot, and he neither eats nor sleeps; he wanders the bottom of the road with a torch in his
hand, up and down, all day and all night. The chapel is cast down and the faithful who filled it
were his friends, and he cannot find a single prayer left in him. He is gentle, lost and hollow-
eyed, and he speaks to strangers because there is no one else to speak to. "Hope is gone," he says.
"The Imperial line is dead. The Covenant is broken. The Enemy has won." He means Lord Dagon, Prince
of Destruction, and he asks, over and over, why the gods have forsaken them.
'''

["Ilend Vonius"]
bio = '''
Ilend Vonius is a Kvatch guard, a young Imperial in the town's cuirass and chainmail, and he spends
his days at his post on the barricade in the ruins below the chapel, sword and shield to hand,
keeping watch over the refugees sheltering inside. He's wiry, tired and quick to speak, with a
soldier's black humour that surfaces even when he's frightened, and he's frightened more often than
he'd admit. Captain Matius holds the barricade and Ilend follows him without question; the other
guards are his comrades, and he counts himself lucky to stand among them. He wants the city freed
and the fighting over, and he wants to live to see it. He keeps to himself what he saw when the gate
opened and the others were taken, and he doesn't talk about it. "It just keeps getting worse,
doesn't it?" he mutters, and then he grips his sword and carries on.
'''

["Ilvel Romayn"]
bio = '''
Ilvel Romayn is a Dunmer mage who keeps the shrine of Peryite, the Taskmaster, in the hills above
the Silver Road, and he lives there among the shrine's worshippers in his plain monk's robes, an
iron dagger at his belt and a few coins in his purse. He is a quiet, studious man who has given his
life to the Prince of Pestilence and Order, and he carries himself with the sober patience of one
who believes his god asks hard things of his followers. He keeps company with Kewan and Maren the
Seal, who preach at the shrine, and with the other cultists who tend it, and he listens to their
sermons and sits on the benches with them. He holds that the faithful must prove themselves worthy
of Peryite, and he means to do so. "We must redeem ourselves," he says, and will say no more.
'''

["Imperial Jailor"]
bio = '''
The Imperial Jailor works the cells beneath the Bastion in the Imperial City, one of a pair who
trade the duty between them, and he wears the legion cuirass, greaves and boots of the Watch and
carries a silver mace and the prison keys. He keeps a small office by the cells, and when a visitor
comes to see a prisoner he unlocks the door and walks them down himself; he can be persuaded to open
a cell he shouldn't, for a consideration. He is a hard, plain-spoken man who has heard every story a
prisoner can tell and believes none of them, and he warns anyone he speaks to through the bars that
escaping prisoners are executed, friendly as a man remarking on the weather. He eats his dinner in
the office, a sweetroll by day and a tomato by night, and when his shift ends he goes to his
quarters and the other takes his place.
'''

["Imus the Dull"]
bio = '''
Imus the Dull is an Imperial beggar who works the streets of Anvil from the Dock Gate to the Chapel
of Dibella, and he is not, in truth, dull: the name is a joke at his own expense, worn smooth by
years of use. He sleeps on a bedroll behind The Flowing Bowl and is up at six to beg by the gate,
moves to the chapel stairs at ten, and paces the quay between the two docked ships until evening. He
owns a cup, a sack-cloth shirt and pants, and whatever coin the day brings; if he has found food he
eats it where he stands, and if not he walks hungry. In heavy rain he shelters in front of Heinrich
Oaken-Hull's house until it passes. He is a shuffling, apologetic man with a beggar's patter and a
beggar's persistence, and the dockhands and chapel-goers of Anvil know him by sight and give or
don't give as the mood takes them.
'''

["Iniel Sintav"]
bio = '''
Iniel Sintav is head of the Sintav clan, one of the leading families of the Imperial City, and he
lives in his house in the Elven Gardens District. He is an Imperial of plain burgundy linens and
thick cowhide shoes, a man of settled habit: he rises at six, walks his ground floor through the
morning, takes a two-hour lunch at The King and Queen Tavern at eleven, and paces his house again
until midnight. On Sundas the whole clan gathers at his house, and he sits among them, listening
more than he speaks. He has found his relatives work and houses, Kastus and Vontan their gardening,
Beran and Jena a roof over their heads, and they credit him for all of it; he has promised that hard
work will set them up in business together. Since his nephew Cyronin's quarrel with Helvo Atius, he
has put his foot down: the Sintavs keep clear of the Atius unless provoked. "What Iniel says, goes,"
his nephews say, and it does.
'''

["Inius Colus"]
bio = '''
Inius Colus is an Imperial crusader who serves the Nine Divines at the Great Chapel of Arkay in
Cheydinhal, where he keeps to a devotee's round: up at six to walk the chapel hall, two hours of
prayer before the Altar of the Nine, then down into the undercroft to wander and pass the time with
the chapel guard, and back up at midday to pace the upper level until he takes his dinner in the
hall and, at midnight, his bed. He wears a black and burgundy outfit with gold-trimmed shoes and
carries the chapel's keys. He is a courteous, measured man who reckons plain speech a virtue worth
teaching, and he drills any who ask in the art of persuasion, though he cannot give a student the
reference that would open the way to a master's teaching. He holds the chapel's peace and its
routines in equal regard, and he keeps his own counsel on what brought him to the altar. "Speak
plainly, and you'll never need to speak twice," he says.
'''

["Irene Metrick"]
bio = '''
Irene Metrick lives in a house in the northwest quarter of the Elven Gardens District, a Breton
woman in a leather cuirass and greaves who keeps her business to herself and expects everyone else
to do the same. She sleeps from midnight to six and passes the morning indoors, then walks the
Market District through the afternoon, the eastern colonnade on Morndas, Middas and Fredas, the
northwest on Tirdas and Turdas, and keeps to her house at the weekend. She carries a steel dagger,
not the weapon she's known for; word around the city is that she can do terrible things with a mace
or a hammer, and that she once did them, and that she has since atoned. She'll train only someone
who has killed as many as she has, and she says so with a laugh. Roderic Pierrane spends a good deal
of time with her and tells his wife Elisa they are only friends. "I'm Irene Metrick. If you needed
to know more, you'd already know."
'''

["Irlav Jarol"]
bio = '''
Irlav Jarol is an Imperial Master-Wizard of the Mages Guild, a member of the Council of Mages, and a
researcher at the Arcane University, where he specializes in Ayleid history and has written a book
on the subject, Magic from the Sky. He keeps a gentle, unhurried routine: he sleeps from six in the
evening until midnight, sits in the Council Chambers until four, then takes a slow walk around the
University's alchemy garden before bed again. He wears fine white mage's robes and is courteous to
everyone he passes, though his mind is often elsewhere; Council business has been keeping him from
his research of late, and he knows it. He is a good man, patient and generous with his learning, and
he will tell any stranger who pauses that the Imperial Palace itself is Ayleid, White Gold Tower as
it was called in the Middle Merethic. "Ayleids are my specialty," he says, and means it.
'''

["Irroke the Wide"]
bio = '''
Irroke the Wide is a Nord barbarian who lives in his own house in Pell's Gate, a small settlement on
the Green Road south of the Imperial City, and he leads a quiet life there: he wanders the town by
day, talks with his neighbours, eats his dinner at home from eight to ten and sleeps in the same
room until four. He wears coarse linen, shirt and breeches and oiled shoes, and owns little else. He
was a fighting man once and trained an apprentice, Lenwin, who was fair with a sword until she found
a jet-black blade called Umbra; it changed her, she took the sword's name for her own, took up with
mercenaries, and no one in Pell's Gate has seen her in years. He keeps that story to himself and
speaks of her to no stranger. He's blunt, wary and slow to trust, and he wants no trouble brought to
his door. "You're a stranger to me, and I'm not talking."
'''

["Isa Raman"]
bio = '''
Isa Raman is an Imperial priestess of Talos at the Great Chapel of Talos in Bruma, where she keeps
the chapel's hours from six in the morning until midnight and sells her healing and warding spells
to any who come asking. She wears a fine black and burgundy outfit with gold-trimmed shoes and
carries the chapel key and a heavy purse. She is courteous to strangers and proud of her faith, but
Bruma tries her patience: the Nords of the city cling to their old heathen gods and their
uncivilized practices, and she says so plainly, for she believes the Nine Divines' comfort is what
these cold people truly need and will not pretend otherwise. "The Nine welcome you to Bruma," she
greets visitors. "I'm Isa Raman, priestess of Talos." She takes her dinner at six each evening and
prays in the chapel, and she keeps her own counsel about the folk she has judged.
'''

["Isabeau Bienne"]
bio = '''
Isabeau Bienne is the Breton ostler of Bay Roan Stables outside Bravil, and the stable is her whole
world: she sleeps there, eats her lunch and dinner at its tables, and never leaves the place. She
rises at six, unlocks the door at eight, and stands ready to do business for the next twelve hours,
breaking only to eat. Antoine Branck tends the horses and calls in custom from the road; she keeps
the accounts and closes the sale. She dresses plainly, in a stitched green shirt, green felt linens
and clogs, and keeps an iron shortsword by her. Brisk and practical, she comes straight to the
point, and she believes in her stock: "They are hardier than the Chestnut and faster than the Paint
horses." She presses the value of speed on anyone headed for the ruins and caves nearby, and takes a
refusal with a polite "How unfortunate."
'''

["Isleif the Open Handed"]
bio = '''
Isleif the Open Handed is a Redguard thief who lodges in Jair's shack on the Imperial City
Waterfront, and the nickname is a joke he tells himself: he shares his fortunes with the poor and
needy, he says, and a stranger is neither. He keeps a fine iron dagger and his few coins close and
his opinions to himself. Mornings he's out the door by nine and wandering the shack grounds by Lake
Rumare, back at noon for a two-hour breakfast, out again until seven, when he sits with Jair and
talks away the evening; at both meals he'll slip into a crouch and lift food from under his
landlord's nose, and Jair has learned to say nothing. Weeknights after eleven he walks the Temple
District until near dawn. He's wary, dry and watchful, generous with talk and nothing else, and he
reckons the Waterfront looks after its own. "Life isn't easy on the waterfront. But we look out for
each other."
'''

["Isolde"]
bio = '''
Isolde is a Redguard pirate of The Serpent's Wake, docked at Anvil while the ship is refitted, and
she lodges at The Fo'c's'le like the rest of the crew. She rises at nine, spends the day between the
inn's dining room and The Flowing Bowl, drifts down to the dockside by the gate in the afternoon,
and is back at her table by six until she turns in at eleven. She keeps to herself and keeps her
business to herself; a stranger who asks gets only "I'm Isolde, mate... not that it's any of your
business," and asks her about Anvil and she'll tell them to walk around and look for themselves. She
wears a collared shirt and laced leather trousers and carries an iron shortsword, and she has no
patience for busybodies. Of the beggar Thurindil she says only that he's crazy as a rat in a catbox
and should be left alone, since he harms no one.
'''

["Issmi"]
bio = '''
Issmi is a Golden Saint of Brellach, and on the day a stranger first meets her she stands outside
its halls with two warriors at her back, the last of the garrison that fell back when Order came
through the doors. She wears her golden armour and carries her mace, and she has sent for help
because she has no one else to send. Thadon let the enemy in, and she blames herself for it; Staada,
their commander, is held somewhere inside, kept alive because death would only return her to the
Wellspring. Issmi has done what she can to take Staada's place, and says plainly that she knows she
is insufficient. She is grave, dutiful and quick to own a fault, and she finds taking orders from
the Duke of Dementia unsettling, though she will set custom aside while the need is dire. "I am
yours to command, Your Grace," she says, and means it, but she will not be delayed.
'''

["Istirus Brolus"]
bio = '''
Istirus Brolus is a Breton who lives with his wife Jantus in their house in Bruma, and the two of
them have settled there for a quiet retirement after years as adventurers. His days are simple now:
he spends the first three hours after rising at six strolling about his own house and chatting with
Jantus, then walks out to pass the day near the chapel, talking with the townsfolk, until four
o'clock, when he takes a two-hour meal at Olav's Tap and Tack. He is home again by nine for dinner
with his wife, takes one last turn about the house, and is in bed by midnight. He dresses plainly in
a burlap vest, green felt linens and stitched leather shoes, and keeps his house key and a little
gold about him. He still knows a rogue's spells from his old life. Bruma suits the pair: far from
the bustle of the south, and peaceful.
'''

["Ita Rienus"]
bio = '''
Ita Rienus is an Imperial battlemage of the Bravil Mages Guild, a Journeyman who sells spells,
recharges enchanted things and trains the promising in Mysticism, and she keeps to the guild hall
almost entirely: she rises at six, works the basement and the ground floor, dines at six with Kud-Ei
and the others, and takes the dusk air by Bravil's north gate before bed at eleven. She wears
burgundy linen and cowhide shoes and carries no weapon, trusting to illusion and a quick tongue. She
has never been seen to leave the city, yet she can talk for hours about the geography of Tamriel,
and the townsfolk wonder where she learned it all; she says only that Bravil is an important trade
center and a rich melting pot of Imperial, Khajiit and Argonian cultures, and a bit shabby and
shopworn. "Ita Rienus, Spells, Recharging and Training in Mysticism. And idle chatter. At your
service," she says, and means the last part most.
'''

["Itius Hayn"]
bio = '''
Itius Hayn is a Captain of the Imperial Watch, and he lives on the top floor of the Northwest Watch
Tower, in the Captain's Quarters, between the two districts he patrols. He wakes at six, breakfasts
for two hours in his rooms, and is on the streets by eight: the Elven Gardens in the morning, the
Talos Plaza District in the afternoon, checking each gate in turn, lunch at The Foaming Flask at
noon, dinner in his quarters at six, then an evening downstairs with the other guards until bed at
ten. He wears Imperial Watch armour, though he leaves off the helmet and shield, and carries a
silver claymore. He is a stern, upright, unhurried man who believes the law applies to the man
wearing the uniform as much as to the thief in the alley, and he says as much without heat: "A short
stay in our lovely Imperial Prison should cool your enthusiasm for a life of crime." He keeps his
own counsel about his fellow captains, and he is not a man to be hurried into anything by a
stranger's word alone.
'''

["Iver"]
bio = '''
Iver is a Nord battlemage of the Mages Guild, an Evoker by rank, and he stands with the contingent
of Guild battlemages posted outside the ruins of Silorn. He wears steel plate from the boots to the
gauntlets under a mage's hood, carries a steel war axe, and keeps a little coin on him; he fights
with blade or spell as the moment wants, and he has been working hard at healing of late, and says
with some pride that he is getting pretty good at it. He waits where he is told to wait, near the
front or farther back, and promises to look after whoever stands beside him. He is patient, dutiful
and unassuming, a plain-spoken man who asks where he should stand and then stands there. "I'm as
ready as I'm going to be," he says, and means it.
'''

["J'baana"]
bio = '''
J'baana is a Khajiit agent who lives in a tent behind the Imperial City Prison, and the Legion calls
him a prisoner, though the guards long ago gave up trying to keep him. He sleeps through the
morning, picnics at the table beside his tent, and spends his afternoons on a bench with his book;
the rest of the time he wanders the prison gardens as he pleases, and the guards unlock the gates
for him as they pass. He wears prison garb and carries thirty lockpicks, and there is no lock in the
Bastion he cannot open. The Thieves Guild sends its promising agents to him, and he teaches none of
them for kindness: before he'll train anyone he sets them to carry a message from S'Krivva in
Bravil, and he waits on her word with thin patience. He is wry, proud and mercenary, and he gives
nothing away for free. "Do you have business with me?" he asks, and means it.
'''

["J'Baasha"]
bio = '''
J'Baasha is a Khajiit bandit camped at Fisherman's Rock on the road north of Leyawiin, one of four
in Mogens Wind-Shifter's little gang, alongside Ayisha and Mensa Selas. He passes his days between
wandering the camp and sitting on one of the battered stools by the big fire, and he follows
Mogens's lead in everything. He wears a light cuirass, helmet and boots, carries a blade at his hip
and a spare pair of pants in his pack, and he calls himself an adventurer, just like anyone else on
the road. He says little and asks nothing, and when Mogens gives the word he goes for his weapon
with the rest of them. He is a hard, watchful man of the road who keeps to his own and takes what
the camp takes.
'''

["J'bari"]
bio = '''
J'bari is a Khajiit rogue who lives in a large house in southeastern Leyawiin with Tsrava, a fellow
Khajiit, and neither of them ever sets foot outside the door. He wakes at six, comes downstairs, and
spends the day wandering the ground floor, trading the town's gossip with Tsrava when the mood takes
him, though the two keep to themselves and receive few callers. At nine he takes his dinner and at
eleven he goes up to bed. He dresses in a quilted doublet and light brown linens, carries a silver
dagger, and keeps his house key and a little coin about him. He is a hard, knowing man with a
gambler's habits: he makes bets about town and pays them on time, and he has a strange fondness for
dogs, leaving meat in the yard to draw them in, which drives Tsrava to distraction. He keeps his own
counsel and asks a price for what he knows.
'''

["J'Ghasta"]
bio = '''
J'Ghasta is a Khajiit boxer who owns a house in Bruma and never leaves it. He rises at five and
takes a long breakfast, then trains in his basement until eight in the evening, four hours at each
target, bare-chested above his leathers; after that he reads in his chair until midnight. He is rich
and bored, and his hands are his trade. He is a speaker of the Black Hand, and he keeps that office
to himself; he has also paid the Bruma guards not to interfere should a fight spill into the
streets, and he knows someone may be trying to kill him. He is arrogant, quick to take offense, and
dangerous when cornered: "I don't recall inviting you into my house. Leave, quickly, or we will have
a problem." A noble's daughter was offered to him in marriage, and he turned the match down when he
learned the dowry was small; the girl's family has not forgotten the insult.
'''

["J'mhad"]
bio = '''
J'mhad is a Khajiit healer and the groundskeeper of the Temple of the One in the Imperial City's
Temple District, and he lives in his own small house close by. He is up at four every morning and at
the Temple soon after, and he spends the whole morning inside seeing to its grounds and to whatever
else is asked of him; at noon he goes home for a two-hour breakfast, returns at two, works another
six hours, and passes the evening wandering his house before bed at ten. He keeps the grounds neat
and tends the sick and hurt when they ask, and his healing spells are the equal of any temple
healer's. He wears breeches, a brown shirt and thick cowhide shoes, and carries a little coin. He is
quiet, methodical and modest, and he says little of himself: "J'mhad keeps the grounds of the Temple
nice and neat. Other things, J'mhad does, when they ask." When he has an hour to himself he likes
the Arboretum, which is always quiet and always green.
'''

["J'riska"]
bio = '''
J'riska is a Khajiit commoner of Border Watch, and he lives in his own small house in the village.
He is up at four every morning and straight out of doors, and from then until ten at night he
wanders the town talking to his neighbours, breaking only for a two-hour dinner at the Border Watch
Inn at seven. He is a relaxed soul who tries not to worry overmuch about the three signs of
K'sharra, the prophecy his people hold will mean the end of the world; he trusts the shaman Ri'Bassa
to know the signs and to say if ever they come. He dresses plainly, in a collared shirt, laced
leather pants and huntsman moccasins, and keeps a good blunt weapon by him and pieces of light
armour about the house, just to be on the safe side. He is a Khajiit of few words, and any talk of
K'sharra he turns toward Ri'Bassa.
'''

["J'skar"]
bio = '''
J'skar is a Khajiit journeyman of the Mages Guild in Bruma, where he lives in the guild hall's
quarters and teaches basic Destruction to the guild's novices; the town knows his name for it, and
says he is very good at blowing things up. He is a small, quiet, watchful cat in a tan robe and
pigskin shoes, courteous to visitors and slow to show his teeth, and he keeps his own counsel about
most things. What he does not keep to himself is his contempt for Jeanne Frasoric, the local guild
head, who lords her position over mages who know more magic than she ever will. He and Volanaro pass
their evenings devising pranks to confound her, and he is proudest of the newest: he makes himself
invisible and hides somewhere in the hall, and lets her hunt for him. "It's good practice of our
skills too," he says. "But it's mostly just funny."
'''

["J'zidzo"]
bio = '''
J'zidzo lives in a house in Split, the strange settlement divided between Mania and Dementia, and he
is the dour half of a man who was somehow split in two. He wakes at eight, potters about his house
for a couple of hours, sometimes trading barbs with Atrabhi, the compulsive liar he shares it with,
then walks out and roams the Mania side of town for the rest of the day, breaking only to eat his
breakfast and dinner alone at noon and six. He owns a pair of patchwork pants, carries eight bottles
of skooma and a pewter mug, and relies on his bare fists if it comes to blows, though he'd rather it
didn't. He dislikes the other inhabitants of Split and says so, and he loathes his double, the
beaming Manic J'zidzo, far more. "I don't like you. I don't like my double even more," he says, and
means it.
'''

["J'zin-Dar"]
bio = '''
J'zin-Dar is a Khajiit pauper who lives in Bravil's Skooma Den and has not left it in years. He
sleeps upstairs from midnight until six, spends the two hours after waking without a bottle, and
then drinks skooma from eight in the morning until eight at night; after that he staggers about the
Den, mug in hand, until bed. He wears coarse linens, a sack cloth shirt and sandals, and carries his
stash of bottles and a few coins on him always. He keeps to the other addicts, and the talk of the
Den is the talk he has. He is hostile to anyone new, greeting strangers with a threat and a warning
to go away before they get blood and puke on him, and he gives out his name so it can be repeated by
whoever he has beaten. He wants to be left alone with his skooma, and to be known as a man not to
cross.
'''

["Ja'Fazir"]
bio = '''
Ja'Fazir is a Khajiit battlemage and the second-in-command of the Blackwood Company, serving under
Ri'Zakar at the Company Hall in Leyawiin. He wears the Company's cuirass and shield, carries a fine
longsword, and keeps a spare dark green shirt and the key to Jeetum-Ze's room about him. He wanders
the hall through the day, breaking at noon for a two-hour lunch, and he handles the Company's
business with the cool formality of a soldier: "Commander Ja'Fazir. Your servant," he introduces
himself, and he speaks of the Company's expert jihatt for selected customers, very discreet. He is
proud of the old Khajiit words and will explain them to anyone who asks, though he never quite warms
to a stranger. He is watchful, disciplined and certain of his place, and he treats the Company as a
family under a wise father's care. He keeps his own counsel and gives his loyalty to Ri'Zakar alone.
'''

["Jair"]
bio = '''
Jair is a Redguard footpad of the Thieves Guild who lives in a shack in the middle of the Waterfront
District, sharing it with Isleif the Open Handed, a more generous man than Jair's own purse would
suggest. He is careful to the point of laziness: he picks his marks slowly, rarely works at all, and
prefers a quiet stroll to a risky job. Most mornings he wanders the Waterfront between the
lighthouse and the Marie Elena, takes a long lunch at The Bloated Float, and on Middas and Sundas
prays at the Temple of the One; weekends he keeps indoors. He dresses like the poor man he is, in
fishing waders and braided sandals, and carries an iron dagger he hopes never to need. He is wary,
mild and quick to put a stranger at ease: "I'm Jair, I'm a dip...a pickpocket. But relax. You're
safe from me." He warns visitors to watch for the Waterfront's many light-fingered earners.
'''

["Jak Silver"]
bio = '''
Jak Silver is an Imperial nightblade who keeps shop belowdecks on the Black Flag, the ship moored in
Dunbarrow Cove, and he sleeps on one of the empty bedrolls there from two in the morning until ten,
when he opens for trade and stays open until eleven, then takes a three-hour supper before bed. He
sells potions and lockpicks, among them his own Nightmask potions, and to a customer with a sharp
head for a bargain he'll bring out weapons and armour as well. He wears a plaid shirt, black wide
pants and leather boots, carries a steel cutlass and keeps a wedge of cheese about him. He's a cool,
close man who has plainly learned his trade in rough company, and he'll teach speechcraft to those
who show they can already talk their way through a door. He keeps his own counsel about his past,
and about how a nightblade came to keep a shop in a smuggler's hold.
'''

["Jakben, Earl of Imbel"]
bio = '''
Jakben, Earl of Imbel, keeps his great house in the Talos Plaza District, on the inner wall, and
keeps himself to himself within it. He is a Breton noble of old family, dressed finely in black and
burgundy, and he receives no callers: a stranger at his door is told plainly that they do not know
one another and are unlikely ever to. He sleeps by day and is about his house by night, and on all
nights but Sundas he takes a long stroll after dark in the garden behind Umbacano Manor. The
neighbours call him a night owl and a very private man; Gemellus Axius says a rare skin condition
forces him to sleep through the daylight. He is proud, cold and cutting to those beneath his
standing, and he shares his house with no one. He keeps his family crypt below the mansion locked,
and says the place gives him the creeps.
'''

["Jalbert"]
bio = '''
Jalbert is a Redguard necromancer who hides in the Ayleid ruin of Vilverin, in its deepest chamber,
and he never leaves it and never sleeps, though a bedroll lies there unused. Daggerfall exiled him
for practising necromancy, and when a friend in the Guard, Captain Aluc Cardius, caught him grave-
robbing, he had to flee the city altogether. He keeps a letter to Cardius that he has never sent,
apologising to him and thanking him. He lives among the bones and the old stone with his mortar and
pestle, his lockpicks and his poisons, dressed in a dark shirt and black wide pants, a copper ring
on his finger and a fine dagger at his belt. He is wary, solitary and quick to strike at anyone who
comes down into the dark, and he tells himself the ruin is a refuge and not a prison.
'''

["Janonia Aurunceia"]
bio = '''
Janonia Aurunceia is chief maid-servant of Castle Leyawiin, and she has served three generations of
Caros in that castle; her husband Januarius tends the Count's rooms as she tends the Countess's, and
they share a bed in the easternmost room of the servants' quarters. She wakes at six, walks her
quarters two hours, and is upstairs by eight to see to the Countess Alessia Caro's private rooms; at
noon she keeps the balcony above the thrones, at four she walks the dining hall to be sure all is
ready, and from eight she oversees the evening gathering until she retires at eleven. She wears
green felt linens, a belted vest and buckled shoes, and carries the castle key. She is proud of
Count Marius and his new bride, and says so; she knows what is expected of her and does it
flawlessly, every day of the week. "I am Janonia Aurunceia, chief maid-servant of Castle Leyawiin,"
she says, by way of introduction.
'''

["Jantus Brolus"]
bio = '''
Jantus Brolus is an Imperial spellsword, retired from adventuring and settled with her husband
Istirus in their house in Bruma, where she teaches the basics of Illusion to anyone who asks. She
rises at six and spends the morning about the house in her patched vest and sack cloth pants; at
noon she walks out to the space before the Great Chapel of Talos, where she chats with Istirus and
the townsfolk, and at two she browses Novaroma until five. She dines at nine and is in bed by
midnight. She is a woman of few words, blunt and unhurried, and she says of Bruma that it is far
from civilization but that she and Istirus were ready for a little peace and quiet. The townsfolk
know her as skilled with both magic and steel, and those who want to learn illusions are told she is
the one to ask.
'''

["Januarius Aurunceia"]
bio = '''
Januarius Aurunceia is the Count's footman and boot-puller at Castle Leyawiin, and he has served
three generations of Caros in that post. He shares the easternmost room of the Servant's Quarters
with his wife Janonia, who performs the same duties for the Countess; they go up to bed at midnight
and he is up again at six. He runs the Count's errands and does whatever's required, and he does it
flawlessly every day of the week, because he knows exactly what is expected of him. He dresses
plainly, in a shirt with suspenders, huntsman pants and moccasins, and carries a raft of keys and a
little coin. He is a quiet, settled, careful man who keeps his place and his opinions to himself.
"I'm the Count's man's-man in all occasions," he says. "Have been for donkey's years."
'''

["Janus Hassildor"]
bio = '''
Janus Hassildor is the Count of Skingrad, an Imperial noble who rules his county from Castle
Skingrad and is seldom seen beyond its walls. He is a tall, gaunt man with pronounced cheekbones and
fierce red eyes, dressed in the finest black and burgundy, and he keeps himself to his quarters in
the Lord's Manor, attended by his trusted steward Hal-Liurz, who handles the county's public affairs
and comes to him between midnight and two. He is a master sorcerer, reserved and courteous with the
few he receives, and he says little of himself. His people reckon him a private man and a good lord,
and the county is quiet and prosperous under him. He is a vampire, and he despises those of his kind
who give in to their animal urges, for they draw hunters and unwanted questions to Skingrad. His
wife Rona lies in the castle, and he keeps his grief to himself. "I'm sorry. We've not met. I'm
Janus Hassildor, Count Skingrad."
'''

["Jaras Invel"]
bio = '''
Jaras Invel is an Imperial acrobat and a guest at Castle Leyawiin, where he dines at the Countess's
table beside Britta, his wife. He is a performer by trade and a courtier by disposition, a soft-
spoken man with a tumbler's ease and a taste for fine company; he wears a red velvet blouse and
garments with blue suede shoes, and carries a loaf and an apple for between meals. He is courteous
to the castle staff, quicker to laugh than to argue, and keeps his opinions on his hosts to himself.
Britta is the bolder of the two and does most of the talking for them both. He wants a comfortable
place at court and no trouble at the table, and he is careful never to give the Countess cause to
withdraw her invitation. "A guest's first duty," he says, "is to be pleasant."
'''

["Jastia Sintav"]
bio = '''
Jastia Sintav is an Imperial commoner of the Sintav clan, one of the most respected families in the
Imperial City, and she lives in her own house in the Elven Gardens District with her sister Jena,
close by their uncle Iniel, the clan elder. She wakes at seven and spends the day at home, wandering
her rooms and talking with Jena, dines at six, and in the evenings walks the district sharing news
and rumours with her neighbours until eleven. On Sundas the whole clan gathers at Iniel's house for
a reunion that lasts from morning to night, and three afternoons a week her kinswoman Carmana comes
to sit and talk. She wears a quilted doublet, tan linens and doeskin shoes, and keeps her house key
and a little gold about her. She is heartily sick of the feud with the Atius clan that her brother
Cyronin's quarrel with Helvo Atius began, and glad her uncle put his foot down. "Jastia Sintav.
Jena's my sister," she says by way of introduction.
'''

["Jastira Nanus"]
bio = '''
Jastira Nanus lives in the settlement of Split, in the Shivering Isles, where she keeps her house
and her routine: up at nine to count the Young Baliwog corpses laid out in her home, an hour of it,
then out into the streets for most of the day, talking with her neighbours, drifting back indoors
whenever the urge to count comes over her again, and to her bed at eleven. She wears a patchwork
shirt and tan linens, carries a longsword and her key, and is an Imperial woman of the Dementia half
of Split, wary of the Manic half. She is obsessed with counting, but she counts corpses, and she
wishes there were more of them: "Seen any dead things laying around?" She complains bitterly about
her double, the other Jastira, who counts the same way and doesn't count right; she calls her sick,
and says there would be more corpses to count if someone got rid of the doubles. She keeps her own
counsel on how far she'd take that.
'''

["Jauffre"]
bio = '''
Brother Jauffre lives at Weynon Priory near Chorrol, a Breton monk in a plain robe and stitched
leather shoes, and he passes his days and nights in the priory's library with his books, above all a
copy of Mixed Unit Tactics that he carries about with him. He is courteous to the priory's folk but
keeps his distance, and they take him for a quiet, studious man; only a few know that he is the
Grandmaster of the Blades, the order sworn to the Emperor and the Septim bloodline, and that
discretion is the watchword of his calling. He answers only to the Emperor, and he is troubled by
the Emperor's death and by the darkening of the Dragonfires. He keeps a chest of supplies for
travelling Blades, and he speaks plainly and directly, wasting few words: "I'm Brother Jauffre. What
do you want?"
'''

["Javolia Maborel"]
bio = '''
Javolia Maborel is an Imperial commoner who has given her days and nights to Meridia's Shrine, and
she keeps her vigil there without breaking it. She sits on one of the benches through Demetrius's
sermons from the lectern, rises now and then to wander the shrine grounds, and settles again; she
wears a burgundy linen shirt and linens with russet felt shoes, carries an iron dagger and a little
gold, and wants nothing more than to remain at the shrine among the faithful. Basil Ernarde and
Demetrius are her fellow worshippers, and she holds to the Lady of the Infinite Energies with a
convert's steadiness. She is calm, grave and courteous to those who climb the hill, and she speaks
of her faith as a plain truth rather than a mystery: "Life is a blessing, and death is not the end,
but only when the spirit remains incorruptible." She asks no one to stay and presses no one to
believe.
'''

["Jayred Ice-Veins"]
bio = '''
Jayred Ice-Veins is a Nord sharpshooter who lives on the outskirts of Passwall, in a house he simply
moved into when he arrived; nobody seemed to mind. He followed the bones, he says, and they led him
here. He wakes at six, sits with his thoughts until ten, then walks the village centre for most of
the day, breaking at midday to eat at The Wastrel's Purse and taking his evening meal there before
wandering his own rooms until midnight. He wears fur from head to foot and carries a bow and bone
arrows. He is tall, weathered and utterly fixed on bones: their sound, their shape, the way a thing
looks better without its skin. The Gatekeeper obsesses him; he wants it dead and its bones in his
hands, and he believes the bones of one Gatekeeper will kill another. He is blunt, eager and
unbothered by other people's opinions. "You've got nice bones," he tells strangers by way of
greeting.
'''

["Jean-Pierre Lemonds"]
bio = '''
Jean-Pierre Lemonds is a Breton sharpshooter who lives at Silverhome on the Water in Bravil, and has
done long enough to be one of its fixtures. On weekdays he sleeps until eight, then holds up the bar
downstairs, talking with the other regulars until four, when he takes a table for an early two-hour
dinner and afterwards drifts back to the talk until two in the morning. Come Loredas he wants a
break from the same five days of faces, and crosses the bridge to the Lonely Suitor Lodge to spend
the day among strangers instead. Sundas is his hunting day: up at six, out of the city with Daenlin
of The Archer's Paradox, the two of them working the roads and paths toward the Flooded Mine, and
when Daenlin leaves at eight to open his shop Jean-Pierre hunts on alone until dark, filling his bag
with venison. He wears a blue and green outfit and thick cowhide shoes, carries his steel arrows,
and is easy company with a dry word for the room.
'''

["Jeanne Frasoric"]
bio = '''
Jeanne Frasoric is the Breton head of the Bruma Mages Guild, a post she holds through charm and
connections rather than any real skill at magic, a fact she never quite admits to herself. She
dresses in a quilted doublet and tan linens, keeps her brown hair neat, and spends her days behind
the reception desk with The Book of the Daedra, breaking off now and then to attempt a Summon Scamp
that seldom comes. She dines in the basement and retires at ten. Her subordinates, Volanaro and
Selena Orania, humor her to her face and trade barbs behind her back; J'skar and the others play
pranks on her when they tire of her airs. She worries most about how the hall looks to the Council
and counts Raminus Polus a personal friend. "Make lots of friends, and look busy. Same as anywhere,"
she says of Bruma.
'''

["Jearl"]
bio = '''
Jearl is a Redguard who keeps a house in Bruma and tells anyone who asks that she spends most of her
time down south, coming back for the mountain air. In truth she is one of the Mythic Dawn, and the
house is a cover: she shares it with Saveri Faram, and the two of them keep to it by day, talking
quietly, and go out at dusk to the rune stone southeast of the temple to watch Cloud Ruler Temple
and count its comings and goings. She sleeps late, dines at two, and is gone from the house until
nearly morning, down in the caverns beneath it. She wears a flax tunic and sack cloth pants and
carries her keys and a little coin. The neighbours hear voices through her walls and have seen a
face at her window when she was away; she knows nothing of that and would not care. She is watchful,
close-mouthed and steady, and she keeps her own counsel.
'''

["Jee-Tah"]
bio = '''
Jee-Tah is an Argonian warrior of the Blackwood Company who passes his days in The Lonely Suitor
Lodge in Bravil, and he passes all of them there: he never leaves the inn, never sits down to eat,
never takes a bed, and simply moves from table to table in his Blackwood cuirass and gauntlets,
shield on his arm and a blunt weapon at his belt, talking to whoever happens to be about. He is a
gossip, cheerful and tireless, and he has made himself at home among the lodge's drinkers, who treat
him as a fixture of the place. He keeps close to Maglir, another of the Company's men, and follows
him about the common room. He carries a spare quilted doublet and a little coin, and nothing about
him suggests a soldier between jobs; he seems a man content to talk away the hours and let the
Company's business find him where he sits.
'''

["Jeelius"]
bio = '''
Jeelius is an Argonian priest of the Temple of the One in the Imperial City, where he tends the
great Dragonfire shrine day and night, sweeping, lighting candles and keeping the quiet order of the
place. He is soft-spoken, prayerful and gentle, slow to judge and quick to bless, and he greets the
worshippers who pass through with a calm courtesy and a word of Arkay. He lives for his duties and
his studies, and he has a modest store of knowledge in alchemy, mysticism and the healing arts that
he is glad to share with anyone who asks. He keeps to himself and asks little of the world beyond
his temple. "Arkay's blessings upon you," he says, and means it. He knows the city's streets and
shrines well, and he trusts that the gods watch over those who keep faith.
'''

["Jeetum-Ze"]
bio = '''
Jeetum-Ze is an Argonian battlemage of the Blackwood Company in Leyawiin, and the man who handles
its recruitment: every hopeful who comes through the hall's door is measured by him, and most are
found wanting. He wears the Company's armour and carries a longsword, and he spends his days
wandering the hall, watching the new blood train and keeping his own counsel. He is cold, wary and
deliberate, slow to trust and quick to test, and he speaks of the Company's methods with a convert's
fervour. The sap of the Hist is his gift to hand out, and he calls it a good, good thing, a present
from his homeland, generous to them all. He keeps his own room upstairs and the key to it on him. He
answers to Ja'Fazir, the second-in-command, and takes no orders from anyone below him.
'''

["Jena"]
bio = '''
Jena is an Imperial Blade and a Knight Sister of the order, stationed at Cloud Ruler Temple in the
Jerall Mountains north of Bruma. She stands guard at the temple's front door from eight in the
morning until four, when Caroline relieves her; after that she patrols the interior until midnight,
takes her dinner in the east wing, and sleeps until eight. She wears the Blades' armour, carries an
Akaviri katana, and keeps her few coins close. Off duty she walks the battlements and breathes the
cold mountain air, the only peace she allows herself. She is quiet, disciplined and watchful, and
she keeps her distance from the busier Blades, who send strangers her way when they have no time to
talk. She holds Jauffre in plain respect and greets Martin courteously whenever their paths cross,
though she says little beyond it.
'''

["Jena Sintav"]
bio = '''
Jena Sintav is an Imperial commoner of the Sintav clan, and she lives in her sister Jastia's house
in the Elven Gardens District, where she has a room on the second floor and little else to trouble
her. She keeps a quiet life: mornings she wanders the ground floor, and on Tirdas, Turdas and
Loredas she takes the air in the centre of the district; most evenings she strolls the streets until
eleven and sits up an hour before bed. She spends nearly all her time among her own people, and on
Sundas the whole clan gathers at their uncle Iniel's house and trails after him to the King and
Queen Tavern to watch over him while he eats. She is polite, unassuming and devoted to the family,
and she thinks Iniel knows everything and takes care of them all. The quarrel between her brother
Cyronin and Helvo Atius has soured the clan's name, and she keeps well clear of it. "Jena Sintav,"
she says. "I have a house with Jastia, my sister."
'''

["Jensine"]
bio = '''
Jensine is a Nord pawnbroker and the proprietor of "Good as New" Merchandise in the Market District
of the Imperial City, where she trades in weapons, armour, clothing, books, ingredients and whatever
else a body hauls in off the street. She sleeps in the shop's private quarters, breakfasts two hours
in the trading room, and opens at eight sharp, keeping the door open twelve hours on weekdays and
until midnight at the weekend; the rest of her evenings she spends at The Feed Bag with the other
traders. She is the chairwoman of the Society of Concerned Merchants, formed to keep a fair balance
in the district, and she is loud in her complaints that the newcomer Thoronir undercuts every honest
shop with prices too low to be honest. She gives good prices for old equipment and folk say she's
fair and quick about it. One thing she keeps to herself: she watched a Watch captain rob a customer
in her own shop, and she has said nothing of it to anyone, for fear of him. "Feel free to browse,
friend," she says. "Fare thee well."
'''

["Jesan Rilian"]
bio = '''
Jesan Rilian is an Imperial soldier of the Kvatch Guard, and these days his post is the barricade on
the road below the city, where he serves under Captain Savlian Matius alongside his fellow guard
Merandil. He wears the Kvatch cuirass and a guard's helmet, carries a steel longsword for close work
and a bow for the rest, and he does as he is bid without complaint or flourish; the captain gives
the orders and Jesan follows them, and he will tell anyone who asks that this is the whole of a
soldier's trade. He is steady, quiet and deliberate, a man who has seen his city burn and has not
yet had time to grieve it, and who keeps his mind on the next duty rather than the last. When there
is fighting he goes into it head-first with the others, and when it is done he returns to his place
behind the barricade and waits, watching the gate, for the captain's word.
'''

["Jesan Sextius"]
bio = '''
Jesan Sextius is an Imperial commoner who lives in the western corner of Anvil, in a house he shares
with Gorgo gro-Shura, an unemployed mercenary who lodges in the small room at the top of the stairs.
Jesan keeps the master bedroom and wakes at six; he potters about the second floor through the
morning, then walks to The Count's Arms at ten and works there until eight, with a break at midday
for lunch, mostly chatting by the fireplace with Wilbur and the regulars for a few coins. Home
again, he eats dinner, receives the unpredictable visits of his Khajiit friend S'shani, and spends
his last two hours talking with Gorgo before bed at midnight. He dresses in a brown shirt, tan
linens and pigskin shoes, and carries his house key. He is a singer, composer and storyteller, and
he is working on a piece he hopes will win him the patronage of a certain countess. "Jesan Sextius,
singer, composer, and storyteller extraordinaire," he says. "Glad to meet you."
'''

["Jesper"]
bio = '''
Jesper is a Nord priest of Kynareth who tends the goddess's shrine in the Great Forest, north of
Haynote Cave, and he lives out among her works rather than within walls. His green robe and quilted
shoes suit a man who spends his days in open country, and he carries nothing but his copy of Gods
and Worship, which he studies on a bench at the shrine for four hours each day, always beginning at
ten. The rest of his time he wanders the shrine grounds, talking with his fellow worshippers Avita
Vesnia and Stanet; he is gentle, contented company, unhurried in his speech, and he holds that it
would not be right to build over Kynareth's works merely to worship her, so the altar stands here,
in the chapel she has made of the wild. He asks for nothing and intends to stay near the shrine,
keeping the faith as the seasons turn.
'''

["Jhared Strongblade"]
bio = '''
Jhared Strongblade is a Breton knight of the Knights of the Thorn, and he lives at the order's lodge
in Cheydinhal, pacing its floor in his steel armour and his medallion. He is one of the few knights
who did not ride out with Farwil Indarys on the assault on the Oblivion Gate beyond the walls, and
he keeps the lodge while the others are away, breaking his pacing only for lunch at noon. He is
earnest, dutiful and a little anxious about his place: he greets visitors as though they were new
brothers of the order, and he would not have Lord Farwil find a stranger inside. He speaks up for
the order's strength and its duty to protect Cheydinhal, and he is glad to have come through the
fighting alive, though he would rather Farwil did not hear him say so.
'''

["Jirolin Doran"]
bio = '''
Jirolin Doran is an Imperial commoner who lives with his wife Ariela in their house in Chorrol, and
he is a man with a consuming private passion: he believes, on the strength of research he cannot
produce when asked, that Ogres are closely related to the enlightened races, and he wants to be the
one to make first contact between them. He keeps a small purse and his key about him, dresses
plainly in a coarse linen shirt, laced leather trousers and rough shoes, and spends his days
indoors, turning the matter over. He is earnest, excitable and a little foolish, forever on the edge
of saying too much, and he knows his wife would not understand. The townsfolk have begun to talk;
the women of Chorrol say Ariela ought to do something about him, that the man has lost his mind. He
is certain of his theory all the same, and certain that the first step ought to be his.
'''

["Jiv Hiriel"]
bio = '''
Jiv Hiriel is an Imperial bard in Hackdirt, a village of burned-out shells and watchful eyes, and he
lives alone in his cabin there. He keeps to the town's ways: he wanders the ruins by day, looking
over strangers who come asking questions, takes his noon hour at Moslin's Dry Goods, rests at home
until eight, then sits in the Chapel of the Brethren while Etira Moslin reads from the Bible of the
Deep Ones, and goes down into the caverns beneath the town until dawn with the Brethren, to be near
the Deep Ones. He carries an iron mace, and he is uneasy in all of it. He was a boy when the
soldiers came and the town hid and vowed revenge, and the Deep Ones never answered until Etira found
the old books and the runes; now they want blood, and he has begun to wonder what he has joined. He
keeps his doubts to himself, and to strangers he says only, "You'd be better off not asking such
questions around here."
'''

["Jolie Retiene"]
bio = '''
Jolie Retiene is a Breton farmer who lives in Water's Edge with her husband Eduard, in the house
that is his. The two of them keep to themselves and to each other: they stay indoors at all hours,
share a two-hour lunch at midday and a two-hour dinner at six, and keep a quiet, regular household.
She carries an iron mace, though the village is peaceful and she has never had to lift it. The other
villagers of Water's Edge are neighbours to nod to, not friends she visits; her days belong to
Eduard and the house. She is wary of strangers and says little to them, watching from the doorway
before she answers, and she does not care to be drawn out about her life or her husband's. What she
wants is for the days to go on as they do, unchanged and undisturbed.
'''

["Jollring"]
bio = '''
Jollring is a Nord who serves as butler to the wealthy Altmer collector Umbacano, and he lives in
Umbacano Manor in the Imperial City's Talos Plaza District, where he has served his master for many
years. He never leaves the house. He rises at eight, stations himself in the ground-floor lounge in
his green brocade doublet and silk, and spends the day receiving callers and weighing what they
bring against his master's appetite for Ayleid antiquities; at eight he attends Umbacano at dinner,
watches over him until ten, and only then sits down to his own two-hour meal before bed at midnight.
He is stoic, correct and utterly devoted, and he guards the manor's door and his master's time with
a polite inflexibility that callers mistake for coldness. "My master trusts me to decide what to
show him, I'm afraid," he says, and means it kindly.
'''

["Joofy the Brown"]
bio = '''
Joofy the Brown is an Imperial warrior who long ago stopped being either, and now lives in the
Sanctum of Decadence in Dunroot Burrow, where the felldew is. He wears nothing but a pair of laced
leather pants, carries four vials of the stuff and three bottles of cheap wine, and wanders the
sanctum all day in a haze, happy in a slack, faraway way, sometimes trying to stammer something to
the other addicts and losing the thread of it. At eight each morning he staggers to one of the five
beds and sleeps till midday. He has given up on life and doesn't pretend otherwise. Strangers he
greets with his fists: he attacks anyone who comes into the sanctum, and he's still strong enough to
mean it. What's left of the warrior is the swing and the suspicion; what's left of the man is the
wine and the next vial.
'''

["Jorck the Outcast"]
bio = '''
Jorck the Outcast is a Nord beggar who lives in Bruma, and his bedroll and food bag lie behind
Arnora's House, where he sleeps each night and takes his dinner at six. He rises early and begs from
six until ten before the Great Chapel of Talos, then at the east gate until two, then in front of
Nord Winds until evening; when it rains he shelters on the covered patio of Bradon Lirrian's House.
He owns a sack cloth shirt and pants and whatever coin the day has brought him, and he fights with
his bare fists. He's a humble, weathered man who knows the town's streets and the beggars in them,
and he'll share what he hears for a small fee. "Spare a coin for an outcast?" he asks, and he means
it.
'''

["Jorundr"]
bio = '''
Jorundr is a Nord thief locked in a cell in Castle Bruma's dungeon, and he will tell anyone who asks
that he is innocent of the murder they're holding him for. He grew up in Bruma and ran petty scores
the length of Cyrodiil with Arnora Auria, his woman, until she brought him a plan to waylay a tax
shipment bound for the Imperial City; a guard died in the doing, they buried the gold, and the Bruma
Guard fell on the camp while she was away for supplies. He moved the loot before they came and won't
say where it lies, not to the guard Tyrellius, who keeps working him for it, and not to anyone. He
wears sackcloth and broods behind the bars, sour, wary and quick to take offense, and he trusts no
guardsman living. "Go away," he says to strangers, and means it. What he wants is Arnora dead and
the amulet off her neck in his hand.
'''

["Juggler"]
bio = '''
The Juggler lives in the Waiting Room, a bare test cell that is nowhere in the Shivering Isles, and
she has been there as long as she can remember, which is not long. She is a pale woman in grey
trousers, a brown tunic and orange loafers, and she juggles: three balls in a steady arc, over and
over, whether anyone is watching or not. The balls are purple, though she could not tell you why,
and she never drops one. She has no trade, no house, no neighbours and no errands, and she does not
wonder about any of it; she simply keeps the pattern going, because the pattern is what she is for.
She is placid, tireless and a little blank, pleased to be watched and pleased to keep juggling while
she talks, and she speaks in the same even rhythm as her hands: "Watch, watch, watch."
'''

["Julienne Fanis"]
bio = '''
Julienne Fanis is the Breton alchemist who heads the Lustratorium, the Mages Guild's alchemy
headquarters at the Arcane University, and she holds the rank of Wizard. She keeps to the University
and says she has all she needs there; she rises at midnight and spends the small hours wandering her
own halls in peace, takes up her mortar and pestle at six and mixes potions until ten, then passes
the rest of the day about the alchemy centre in her red velvet blouse and gold-trimmed shoes before
climbing to her bed in the Mage Quarters at six in the evening. She sells ingredients, potions and
apparatus, and the refined frost salts she makes herself, though the refining is costly and tedious
and she never has much to spare. Unhurried and dryly amused, she is the best alchemist the Guild has
and sees no reason to pretend otherwise. "Julienne Fanis. I'm the Alchemy Expert. At least, the best
the Mages Guild has."
'''

["Julitta Plotius"]
bio = '''
Julitta Plotius is an Imperial commoner of Leyawiin, wife to Betto Plotius, and she lives with him
in their house in the town. She keeps his hours: the two of them rise at six and spend the morning
at home together, take a two-hour lunch at the Five Claws Lodge at ten and walk near the house for
sale, and at two she goes her own way, to chat for two hours with Gundalas and Elsynia at Best Goods
and Guarantees, then to sit with Shuravi and her sisters at the Three Sisters' Inn. On dry evenings
she strolls before the Great Chapel of Zenithar and is home by eight; in rain she hurries back to
Betto. She and her husband are loyal Imperials of a hard disposition, and she would be glad to see
every Argonian and Khajiit run out of town; the Khajiit, she holds, must simply get over the loss of
their land in the Trans-Niben, for it is Cyrodiil's now. She keeps her opinions for those who share
them. "Julitta Plotius. I'm Betto's wife," is how she introduces herself, and little more.
'''

["K'Sharr"]
bio = '''
K'Sharr is a Khajiit thief who stands in the snow beside the road east of Bruma, a leather cuirass
buckled over a dark green shirt and an iron dagger at his belt, and he does not move on. He was one
of the band that stole the Stone of St. Alessia from the Chapel of Talos in Bruma, and he is the
only one left: ogres fell on them and carried the stone off to Sedor, and the rest of his companions
are dead. He wanders that stretch of road in disbelief, neither eating nor sleeping, and tells
anyone who comes near that the stone was more trouble than it was worth and that he has nothing
left. He is discouraged, hollowed out and past caring what becomes of him; he answers questions
flatly, marks Sedor for those who ask, and begs only to be left alone. "I hate my life," he says, to
no one in particular.
'''

["Kalthar"]
bio = '''
Kalthar is a Nord battlemage and a Journeyman of the Mages Guild, lodged at the Leyawiin Guild Hall,
where he sleeps alone in the basement from two in the morning until ten and passes his days on the
ground floor, wandering or sitting on a bench with A Less Rude Song. He keeps to himself and speaks
to few, and what he says is short: "What do you want?" He wears the mage's robe and carries Galerion
the Mystic and his key. He was a Necromancer once, and says he has reformed and abides by the
Guild's rules; he notes, evenly, that the Guild lost a good number of members when Traven banned the
practice, but some stayed behind. He is disgruntled and openly scornful of Dagail, who leads the
chapter: he says she was put in charge as a favour, that she is only kept sane by a magical trinket,
and that Agata is the one to ask when something needs doing. He keeps his own counsel on what he
means to do about it.
'''

["Kantav Cheynoslin"]
bio = '''
Kantav Cheynoslin is the Primate of the Great Chapel of Zenithar in Leyawiin, and Zenithar's
Advocate, a dignified Imperial priest in a black and burgundy outfit with gold-trimmed shoes. He
sleeps in the chapel hall and rises at six, and his day is ordered and sober: a moment of silence
before the Altar of the Nine, mornings wandering the hall and the main chapel, a two-hour lunch at
the Three Sisters' Inn across the street, and on clear afternoons a stroll through town, often near
the empty house for sale. He dines in an empty pew at six, and when the weather holds he walks to
the cemetery to pay his respects to the dead before returning at ten. He preaches that peace and
prosperity come through earnest work and honest profit, not war and bloodshed, and he spends his
days urging the townsfolk to the same. On Sundas he prays for two hours at the altar. "I believe in
the transforming power of honest work," he says.
'''

["Karinnarre"]
bio = '''
Karinnarre is a High Elf trader who lives with Suurootan above and below his store, Novaroma, in
Bruma, and she shares his basement bed and his humble life: belted vest, matching braies, buckled
shoes, the shop key on her belt and a little gold in her purse. She keeps no counter of her own and
sells nothing from the shelves; she is at Suurootan's side in the business and lets him speak for
it. Her days are restless ones indoors: she wakes at six and paces the trading room until noon,
walks two hours near the Great Chapel of Talos, paces again until six, walks again until eight, and
takes a late dinner with Suurootan at Olav's Tap and Tack before they lock up and go down to bed at
midnight. Rain keeps her in. She is quiet, watchful and slow to trust a stranger's coin, and she
keeps her own counsel on how the store is run.
'''

["Kastav Kvinchal"]
bio = '''
Kastav Kvinchal lives with his brother Vlanarus and sister Bronsila in the family's shack in the
Imperial City's Waterfront District, and works the docks for the Imperial Trading Company when he
works at all. He sleeps from ten to six, takes an hour's walk about the slums at nine, sits down to
a two-hour meal at nine in the evening, and lounges about the shack the rest of the day; the coin is
the same whether he kills himself or not, so he doesn't. His brother calls him a deadbeat and says
flies land on him and he's too lazy to brush them off; his sister has worse names for him, and he
gives them both back. "I'm Kastav Kvinchal," he says, "and, if you listen to that witch of a sister
of mine, Bronsila, I'm also a dog and a pig." He wears a flax tunic, green felt linens and sack
cloth sandals, keeps an iron dagger at his belt and a few coins in his purse, and sees no reason to
hurry about anything.
'''

["Kastus Sintav"]
bio = '''
Kastus Sintav is a Breton commoner of the Elven Gardens District, one of Iniel Sintav's four
nephews, and he shares his house there with his brothers Beran and Vontan. The three of them tend
gardens, trees and grass for the city, good jobs their uncle got them, and Kastus never tires of
saying how grateful they are. He rises at six, potters about the house talking with his brothers,
and on weekdays walks the Elven Gardens for seven hours before coming home; at six he locks the door
for a private two-hour dinner with Beran and Vontan, then opens it again for visitors and stays up
until midnight. On Loredas he never stirs out at all. On Sundas the whole clan gathers at Iniel's
house, trails him to The King and Queen Tavern for his lunch and back again, and Kastus follows his
uncle about all day. He is cheerful, easy-going and biddable, and on the feud with the Atius family
he says only, "Whatever Uncle Iniel says. 'Lay off the Atius bastards,' he says, so we lay off."
'''

["Kathutet"]
bio = '''
Kathutet is a Dremora of the Savage Garden in Mankar Camoran's Paradise, a Kynval in near-full
Dremora armour who carries the Purging Flame longsword and keeps the one path out of the Garden, the
way into the Forbidden Grotto. He chafes at the post: set to keep order among Camoran's chattel, the
unmortals who swarm the Garden and shirk the unceasing combat that is their proper role, he counts
the duty beneath him and does not hide the resentment. He judges all by honor and courage, despises
mortals as a rule, and speaks with clipped, formal contempt, granting respect only where it is
earned in battle. He knows the mortal who broke the siege of Kvatch shamed his kin, and that colors
how he treats any stranger come from that quarter. He keeps his own counsel, and his plans are his
own. "Talk or not as you choose," he says. "But you will listen."
'''

["Keld of the Isles"]
bio = '''
Keld of the Isles is a Nord blademaster and a Guardian of the Fighters Guild in Cheydinhal, where he
has settled because the town is quiet and suits him. He keeps a steady round: up at six and about
the hall near his bed on the second floor until noon, two hours at Borba's Goods and Stores, a quick
look into the guildhall basement, lunch at Newlands Lodge, dinner in the hall at six, then down to
the basement at eight to practise his blade on the training dummy until eleven. He wears chainmail,
boots, cuirass, gauntlets and greaves, and carries a steel claymore and little coin. He is patient,
cautious and unhurried, and says slow and steady wins the race, that careless fighters get one last
white shirt and a box. Burz gro-Khash calls him and Ohtimbar useless, and Keld, thick-skinned, can't
be bothered and still tries hard to fit in.
'''

["Kellen"]
bio = '''
Kellen is a Redguard commoner who lies on his bed in the Chapel Hall of Stendarr in Chorrol, a thin,
worn man in a collared shirt, green felt linens and buckled shoes, too weak to do more than rise at
midday and look for a little food before lying down again. He came from Hammerfell to the place
where his family's trouble began, hoping the priests might do something for him; the curse that has
dogged his line since a knight of the old Order defied Stendarr in this very chapel has only
worsened with the years, and he fears he has little time left. He grew up knowing pity in people's
eyes, and he keeps his own counsel with visitors, though he will ask after the Gauntlets of the
Crusader, which he tried for hours to lift until his body ached and he lay weeping on the floor
beside them. He is tired, plain-spoken and past shame, and he suspects the priest Areldur holds
something back. "I'm a doomed man, one way or the other," he says.
'''

["Kewan"]
bio = '''
Kewan is a Redguard nightblade who keeps the shrine of Peryite high in the mountains, and he keeps
it as a monk keeps a chapel: he preaches from the lectern, sets offerings before the altar, sits on
the benches and walks the grounds in his plain monk's robe, an iron dagger at his belt and a few
coins in his purse. He does it without pause, without food and without sleep, because his lord's
work is the whole of his life. He is grave, deliberate and utterly certain, a man who has given
himself to the Prince of Pestilence and asks nothing back, and he speaks of his lord's slow, orderly
decay with the calm of one who has made his peace with it. He knows the spells of a nightblade and
the deeper arts of alteration, and he keeps his own counsel about what the ritual was meant to
accomplish. "Peryite's order is the only order," he says. "All else is rot pretending to be stone."
'''

["Khafiz"]
bio = '''
Khafiz is a Redguard fence who keeps to Dunbarrow Cove, below the cliffs of Anvil: a dry cave in the
lower level where he buys stolen goods and sells them on to the Thieves Guild, and a berth aboard
the Black Flag, the pirate ship moored in the cove. He works his cave from ten in the morning until
eleven at night, then takes his dinner on the ship's deck until two, and sleeps on a bedroll by the
bonfire in the cove's northeastern corner until ten. He wears a dark green shirt and tattered pants,
keeps a steel cutlass at his hip and an orange in his pocket, and sells lockpicks, weapons and
armour alongside his fencing. He'll also fix a customer's fines and warrants for half what the
guards would charge, and he knows his trade well enough to teach it. He is a cool, practical man who
says little and forgets nothing: "Let's do business."
'''

["Kiara"]
bio = '''
Kiara is a Redguard ostler at the Brina Cross Inn, the lonely wayhouse on the gold road north of
Anvil, and she keeps the place's small stable and its smaller kitchen. She stands halfway up the
inn's staircase through most of the day and night, one eye on the joint of ham turning on the grill
beside her, and greets whoever comes through the door with the same words: "Welcome to the Inn. If
it's a room you're after, speak with Christophe." She leaves the rooms and the reckoning to
Christophe, the innkeeper, and asks nothing about the guests who lodge there, though she sees them
come and go and keeps her thoughts to herself. She wears a blue and green outfit and quilted shoes,
carries a little coin of her own, and is civil, watchful and unhurried, more at home with horses
than with company. The ham is hers to tend, and she tends it.
'''

["Kiliban Nyrandil"]
bio = '''
Kiliban Nyrandil is the Dunmer caretaker of Xedilian, the old testing dungeon in the wilds of the
Shivering Isles, and he has kept it alone through long years of disuse. He wears the red silk robes
and gold-trimmed shoes of a posting that once mattered, and he lives in private chambers near the
Chamber of Anathema: he sleeps there from midnight to six, takes a three-hour breakfast at his
table, walks his halls, takes a three-hour lunch, and spends the rest of the day pacing what he
calls the reception chamber. His rooms are full of books, Fall of Vitharn above all, and a bust of
Sheogorath looks down on his cupboards. Solitude has made him a talker; he rambles, catches himself,
and puts on a professional tone with visible delight. He is courteous, fussy, and quietly thrilled
by other people's ruin: "So good to be back in business!"
'''

["Kinther"]
bio = '''
Kinther is a Redguard healer who serves at the Great Chapel of Arkay in Cheydinhal, where he keeps
the chapel's keys and sleeps in the hall behind the nave. He rises at six, and on clear mornings he
walks the town before noon, down by Willow Bank or out on the island between the bridges, enjoying
the air; when it rains he stays in and tends his duties. From noon to eight he is at the chapel to
mend the sick and the hurt, and he sells and teaches the healing arts to those who wish to learn
them, though he is careful about what he passes on and to whom. He wears a quilted doublet and brown
linens, carries little, and goes unarmed, trusting to his spells if trouble comes. He dines at
eight, paces the chapel awhile, and is abed by midnight. He is patient, quiet and exact in his
craft, and the townsfolk trust him with their fevers and their broken bones.
'''

["Kirsten"]
bio = '''
Kirsten keeps the Goodwill Inn in Bleaker's Way, the village's only inn, and she runs it alone from
six in the morning until two, when she rolls out her bedroll behind the counter and sleeps till
dawn. She's a Nord, broad and weathered, in belted vest and braies and a pair of sandals, and she
sells food and drink to whoever comes through, buying potions and ingredients from travellers when
they have them. She counts herself of the Ulfgar family, as the whole village does, and keeps their
peace as she keeps her house: quietly, and without much fuss. Bleaker's Way is a small place and
most days bring little more than a neighbour at the counter, which suits her. She has an iron dagger
under the bar and a few coins in her purse, and she is content with her inn, her bedroll and her
village, and asks for nothing more than the custom she gets.
'''

["Kishashi"]
bio = '''
Kishashi is a Khajiit commoner of Fellmoor, in the south-west of Dementia, and she lives in a small
house there with her husband Ranarr-Jo. By day she stands knee-deep in the water among the root
pods, hacking at them with her rake under Cindanwe's eye; Cindanwe plays mind games with her to keep
her at it, and when Kishashi wanders off she is soon sent back. She keeps her own counsel about all
this. She says she was once Queen of the Shivering Isles, and that she and Ranarr-Jo made Sheogorath
from seeds watered with their tears and blood; she says the pods are sleeping monsters, and that she
killed a minotaur with a spoon. She trusts no one's word but her own, and her husband's above all:
"Ranarr-Jo. He protects me. Like a valiant knight." The hunter Relan calls her a liar and a strange
neighbour. Evenings she strolls near the house, and all night she paces its ground floor while
Ranarr-Jo is out.
'''

["Kithlan"]
bio = '''
Kithlan is a Redguard noble and Lady Syl's Steward, living in the House of Dementia in New Sheoth
Palace, where he keeps her court's hours: breakfast at six with Anya Herrick, the Duchess's servant,
then his chair beside the throne until two, an afternoon walk of the Palace Gardens with Anya, and
the evening wandering the house until midnight. He wears elegant black finery and owns little else.
He is curt with strangers—"Do you have business in the House of Dementia?"—self-centered, and sour
on Mania and on Thadon, whom he calls depraved; he thinks Syl's constant fear of being replaced is a
poor way to run a court, and he is tired of looking over his shoulder. He has no stomach for plots,
but no great loyalty either, and when pressed he points at Anya's nerves rather than answer for
himself. He wants a quiet life and a master he needn't fear, and he says, oddly, "Be wary the
shadows."
'''

["Kovan Kren"]
bio = '''
Kovan Kren is a Dunmer nightblade who keeps to the northeast corner of the main cavern of Dunbarrow
Cove, where he sells armour—some of it enchanted, some of it found nowhere else—and buys books,
clothing and potions. He instructs those who seek him out in the art of Sneak, and he sells spells
of Illusion and Restoration cheaply, for he sets no great price on anything. He wears a plain shirt
with suspenders, belted braies and oiled linen shoes, and carries a steel cutlass and a piece of
boar meat. Most days he can be found in the southeast corner of the cavern, practising his blade on
the target there; at noon he takes a quick lunch in the chair nearby, at eight he sits down to a
longer dinner, and at eleven he sleeps on his bedroll. He is quiet, watchful and unhurried, a man
who has made his peace with living in a cave and sees no reason to hurry out of it.
'''

["Krognak gro-Brok"]
bio = '''
Krognak gro-Brok is an Orc pirate of the crew of The Serpent's Wake, lying in Anvil harbour while
the ship is refitted, and he lodges at The Fo'c's'le, the dockside inn. He sleeps till ten and
passes the day in the inn's dining room, takes a long mixed meal at The Flowing Bowl from three till
six, and returns to The Fo'c's'le until midnight, when in clear weather he walks the docks,
sometimes with Mirabelle Monet at his side. At one he drinks and cheers the three-hour fistfight
outside the Harborside Warehouse, and at four he staggers to his bed. He wears a dark green shirt,
coarse linens and rough leather shoes, and carries an iron dagger and his mug. He is as unfriendly
as the rest of the dockside pirates: "I'm Krognak gro-Brok, landsman, and I don't much care who you
are." He does offer one piece of advice: a sailor in the streets of Anvil is best stepped out of the
way of, since a little jail time is fair payment for raising hell.
'''

["Kud-Ei"]
bio = '''
Kud-Ei is the Argonian Wizard who heads the Bravil Mages Guild hall, and she takes the post more
seriously than some chapter heads she could name. She rises early, breakfasts quickly, and then
reads in the first-floor library until dinner, breaking only for lunch, and dines at eight with her
guildmates before bed in her room on the third floor. She dresses in green brocade and silk, and she
is protective of her "girls": she has Ardaline minding the alchemy counter to draw her out of her
shyness, and keeps a close eye on the volatile Delphine Jend, who teaches Destruction spells under
her watch. Townsfolk call her a talented illusionist and an excellent teacher. She is warm, firm and
a little imperious, and she does not let rules stand in the way of looking after her own. "We have a
responsibility to look after one another, don't we?" she says. Her good friend Henantier has shut
himself away, and it troubles her deeply.
'''

["Kurdan gro-Dragol"]
bio = '''
Kurdan gro-Dragol is an Orc who lodges at The Lonely Suitor Lodge in Bravil, a big, hard man in fine
armour with a heavy two-handed weapon always near him, and he is not a usurer only. He loans coin at
interest, and men who cannot pay learn what else he sells: at Fort Grief, out in Niben Bay, he runs
the Hunter's Run, where wealthy clients pay him well to hunt living men through the dungeons beneath
the fort, no questions asked, and he takes care of the bodies. Aleron Loche owes him a great deal
and is being kept at the fort for it. Kurdan keeps his business to himself; asked about a missing
man, he says it's none of anyone's business and he'd tell if he liked them, and he doesn't. He takes
the measure of everyone who comes near, looking for prey worth selling, and he is careful never to
let anyone leave his game alive. "This IS my game," he says, "and I'm changin' the rules!"
'''

["Kurdan's Imperial Hunter"]
bio = '''
Kurdan's Imperial Hunter waits in the Hunter's Run beneath Fort Grief, a lean Imperial in light
armour with a shortsword at his hip and the first of Kurdan's keys on his belt. He is no soldier and
no bandit chief but a paying client of Kurdan gro-Dragol, one of the wealthy men who hand over good
gold for the Hunter's Run: living human prey, no questions asked, the bodies seen to. He has stalked
these flooded halls long enough to know every stair and shadow, and he passes the days pacing them,
listening for the sounds of a hunt, ready to kill whatever Kurdan sends down and keep his key from
it. He is patient, watchful and entirely without mercy, a man who has bought other people's deaths
and means to have his money's worth. He speaks to no one here and wants nothing from the fort but
the sport he paid for.
'''

["Kurdan's Nord Hunter"]
bio = '''
Kurdan's Nord Hunter is a paying guest of Kurdan gro-Dragol's Hunter's Run, waiting in the ruined
halls of Fort Grief for the day's prey to be driven down to him. He has paid well for the privilege
of hunting living men, and he carries the Second Hunter's Run Key, the key to the next stage of the
dungeon, as the rules of the game require. He wears light armour of the finest quality he could buy,
cuirass, greaves, boots, gauntlets and a shield, and carries a longsword; beneath it all, common
shoes and trousers, as though he came dressed for a hunt rather than a war. He neither sleeps nor
eats nor keeps any company but his own, pacing his stretch of the fort day and night with his ear
cocked for footsteps. He is a hunter first and a man second, patient, silent and utterly without
mercy, and he will not accept a yield from anything that can still stand. He speaks little, and
nothing he says is meant to comfort.
'''

["Kurdan's Orc Hunter"]
bio = '''
Kurdan's Orc Hunter waits in the Hunter's Abyss, the lowest hall of Fort Grief, and he has paid
Kurdan gro-Dragol well for the waiting. He is a broad, heavy-shouldered Orc in a full suit of plate,
cuirass and greaves and boots, a shield on his arm and a mace at his belt, and he keeps it all on
day and night, pacing the stone. He never sleeps and never eats; there is nothing in the fort but
the hunt to come. He wants the thrill of it, the moment the prey is loosed into his hall, and he has
no doubt how it will end. He is patient, grim and certain, and he has no pity and no use for mercy:
he fights until one of them is dead, and he does not accept a yield. He keeps the key to Fort
Grief's door, and he means to be the one who uses it.
'''

["Kurz gro-Baroth"]
bio = '''
Kurz gro-Baroth is an Orc warrior of the Chorrol Fighters Guild, a Warder who lives in the guildhall
and gives it his days entire. He is up with the guild at six and spends two hours pacing its rooms
before breakfast at the table on the first floor; by eight he is done eating and at his training,
four hours with the war axe in the basement and then two at the targets behind the hall with his
bow, and he keeps to it as strictly as any contract. He wears iron and leather, carries the guild
key, and waits for work to come to him. His brother Lum serves in the same hall, and where Lum is
cheerful Kurz is not: he takes a grim satisfaction in expecting the worst. "Things could always be
worse. And probably will be," he says by way of greeting. Evenings he spends at the Great Oak,
trading gossip with the townsfolk, and at midnight he goes looking for a bed, which he does not
always find.
'''

["Kvatch Soldier"]
bio = '''
The Kvatch Soldier is an Imperial guardsman of what remains of Kvatch's guard, and he has come north
to Bruma with Savlian Matius's leave to repay the daedra for his city. He wears Kvatch's cuirass
over chainmail and carries a steel longsword; he camps with the other allied soldiers before Castle
Bruma and waits on the Count's word. He is a blunt, hardened man with a soldier's black humour, and
he makes no secret of what he wants: payback for the bastards who burned his home. He keeps Kvatch
in his mouth as a watchword, half oath and half warning, and he tells anyone who will listen that it
won't happen here. He is steady in a fight and short with idle talk, and he holds Savlian Matius in
plain respect for holding the guard together when the city fell. "Remember Kvatch," he says. "That's
our watchword."
'''

["Kylius Lonavo"]
bio = '''
Kylius Lonavo is a Dunmer rogue who runs a skooma ring out of the Greyland settlement, a cluster of
houses on the road west of Leyawiin. He holds the house at Greyland with a band of marauders, and
the place has the look of a camp that has stopped pretending to be anything else. He wears light
armour from head to boots and carries an enchanted claymore at his hip; he is never without his
gear, and he does not sleep or eat where anyone can see him do it. The ring's poison moves out along
the roads, and Lerexus Callidus of the Legion has hunted him for months without ever getting near.
Lonavo is watchful, quick to read a stranger, and does not wait to be sure: he is a snake, and he
strikes first. He keeps his ring on his finger and his coin close, and he trusts no one in the house
enough to turn his back.
'''

["Laborer"]
bio = '''
The Argonian laborer tends the small garden in Sundercliff Commune, the patch of soil wedged between
the stone of Sundercliff Watch and the road up from the mines. He works it alone, turning the earth
with a hoe, pulling what weeds the mountains allow, and he keeps to himself as much as a man can in
a place where the Drothmeri Army counts every head. The miners tramp past him morning and evening,
coughing the tunnel cough, their hands grey with iron dust, and he nods to those he knows and says
little to the rest. He is wary of strangers and does not hide it; anyone who comes up the road
uninvited is met with a hard look and a grip shifted on his hoe. He wants only to be left to his
rows and to see another season out of them, and he reckons the men who hold the Watch for the
trouble they bring and the food they take. "Mind the beds," he says, "and I'll mind you."
'''

["Lady Drad"]
bio = '''
Lady Drad is a Dark Elf noble who lives at Lord Drad's Estate north of Anvil, and she has not worked
a day since her husband bought the land and title from the Council. She rises at six, reads from the
house's book collection until eight, and spends the rest of the day drifting about the ground floor
in her black and burgundy gown and green velvet shoes, breaking only for a long breakfast at two and
dinner at six before bed at ten. She is courteous to visitors, asking their business at the door,
and she calls her husband kind and gentle and says he has given her everything she might desire. She
knows what goes on at Bleak Mine and is disgusted by it, but she loves the upper-class life the
ogres' labour pays for, and she keeps her discomfort to herself. "I can't tell you about that.
Please, just go," she says, and means it.
'''

["Lady Rogbut gra-Shurgak"]
bio = '''
Lady Rogbut gra-Shurgak is an Orc noble, the daughter of Lord Rugdumph gro-Shurgak, and she lives at
her father's estate, though she has no patience for the life that estate expects of her. She is
strong-headed and tomboyish, a woman who would far rather carry an axe than sit indoors being a
lady, and she chafes at every rule of decorum her birth lays on her. She spends her days as she
pleases, and of late that has meant going out rock-picking, which is how the ogres came to tail her
about the grounds. She dresses as her station demands, in a black and burgundy outfit with gold-
trimmed shoes, and she keeps a spare green silk garment by her. Her father dotes on her and frets;
Burz gro-Khash of the Fighters Guild thinks her a fine model of an Orcish woman and warns that
she'll rip a rude stranger's ears off. Irritated, she says, "Please! Get on with it!"
'''

["Laenafil"]
bio = '''
Laenafil is a Wood Elf warrior of the band of mercenaries holed up in Fort Sutch, northeast of
Anvil, and she serves Roderick, their leader, who lies in a bad way in the fort's depths and does
not rise. She wears iron plate, cuirass and greaves and gauntlets and boots, and carries an iron war
axe and the key to the gate; she walks the fort's halls on her watch and never once goes down to the
water in the cave, which she does not trust. She is a fighter first and says little, and what she
thinks of the others' talk of a cure she keeps to herself. She wants Roderick on his feet and the
band paid and gone from this damp hole, and she holds to the post she was given.
'''

["Langley"]
bio = '''
Langley is the captain of the Anvil City Watch, an Imperial who sleeps and takes his meals in the
Watch Barracks, the tower behind Jesan Sextius' house near the Dock Gate. He holds that Anvil is
pretty and quiet and that there is not much work for the Watch, and his days bear him out: on
weekdays he spends the mornings strolling the sleeping area and chatting with the guards, and at
midday, weather permitting, he walks a lazy three-hour patrol of the northeastern quarter by the
pond and Benirus Manor. Rain keeps him indoors, and on Loredas and Sundas he never leaves the
barracks at all. He wears the Anvil cuirass with chainmail greaves, boots and gauntlets and carries
a steel claymore, and at midnight he changes into comfortable common clothes and sleeps till six. He
is easy-going to the point of slackness, and the guards around him keep busier than he does.
"Pretty, isn't it? And quiet," he says of the city. "Not much work for us."
'''

["Laralthir"]
bio = '''
Laralthir is a Wood Elf healer at the Chapel of Dibella in Anvil, where she tends the sick and hurt
of the city and keeps the chapel's small stores of herbs and potions. She wears a dark shirt and
burgundy linens, carries the chapel key, and gives her days to her work: she sleeps from midnight to
six, spends her afternoons hunting ingredients, dines in the chapel hall at eight, and otherwise
moves quietly between the chapel, the undercroft and the hall. She admires Countess Millona Umbranox
from a distance and wishes, with a sigh, that she had the Countess's life. She is gentle, a little
wistful and given to daydreaming, and she thinks the settled folk of Anvil too slow and easy for a
restless traveller, whose road she pictures as gold and glory, blood and treasure. "Me? I'm just
Laralthir," she says.
'''

["Larthjar the Laggard"]
bio = '''
Larthjar the Laggard is a Nord beggar who sleeps on a bedroll in the Imperial City's Arboretum,
under the trees and among the statues, and begs at its two gates: in the morning at the gate toward
the Arcane University, in the afternoon at the one onto Green Emperor Way. He rises at six, begs six
hours, crosses to the far gate and begs six more, eats beside his bedroll, wanders his little camp
until ten, and sleeps. He wears a shirt and pants and nothing else. He's a slow, wary man who keeps
his own counsel and gives a stranger nothing for free; he's done rough work in his time and doesn't
dress it up. He keeps to himself, and the scholars and priests who pass him daily take him for part
of the scenery. "Spare a coin for a tired man?" he asks, and means it.
'''

["Lashana"]
bio = '''
Lashana is a Redguard knight of the Fighters Guild, and these days she is posted out of the guild
hall in Cheydinhal, where she takes the contracts no one else wants and drills the recruits who will
listen. She wears a full suit of iron armour, kept oiled and mended, and carries no shield, having
learned to fight with a free hand. She is blunt, tireless and a little impatient with talk, and she
judges people by how they hold a line rather than by what they say. She keeps to herself about her
past, though it is no secret that she came to the guild late and has been making up for it ever
since. Modryn Oreyn rates her steady work; Viranus Donton, the master's son, she treats with a rough
and watchful kindness, and when the guild needs a hard job done properly, she is among the first
asked.
'''

["Lathon"]
bio = '''
Lathon is a Redguard squire, two years into the service of Sir Roderic of Wayrest, and he follows
his master along the roads of Cyrodiil on a pilgrimage from wayshrine to wayshrine in search of the
Crusader's Relics. He wears a forester's shirt and tan linens, carries a steel shortsword and a
torch for the dark, and keeps a few potions about him. He is earnest, devout and utterly loyal, and
he believes in Sir Roderic's holy purpose with his whole heart; he will tell any stranger he meets
that the gods have surely chosen his master, and that he means to return to Totambu one day and be
made a Knight of the Scarab. He is courteous to travellers and quick to speak of the quest, though
he will not hear a word against Sir Roderic, not even the truth about the War of Bend'r-Mahk. "I am
Lathon, squire to Sir Roderic of Wayrest," he says. "We are on a holy quest for the Crusader's
Relics!"
'''

["Laythe Wavrick"]
bio = '''
Laythe Wavrick is the Chief Herald and attendant to Countess Arriana Valga of Chorrol, and he keeps
his post in the Great Hall of Castle Chorrol from seven in the morning until ten at night, standing
beside the throne through every audience, then takes a late meal in his room in the private quarters
before a last walk about the hall and bed at one. He is a spare, correct Imperial in a black and
burgundy outfit and gold-trimmed shoes, a steel shortsword at his hip and the key to the private
quarters on him; he greets every visitor with his name and title and reminds them, pleasantly but
firmly, that proper etiquette is expected while the Countess is in attendance, and that she receives
from eight until six. He keeps his own counsel, though he will say confidentially that the porter
Orgnolf drinks too much and has taken to borrowing coin for spirits. He is proud of Chorrol and its
honour, and he is loyal to his Countess.
'''

["Lazare Milvan"]
bio = '''
Sir Lazare Milvan is a Breton noble of Skingrad, a wealthy man who lives alone in his large house
and keeps to it: he rises at six, spends the day wandering his own halls, takes a two-hour supper at
eight and is abed by midnight. He dresses the part in a green brocade doublet, green silk and green
velvet shoes, and carries a silver longsword and a purse to match. He is arrogant past all reason
and judges every stranger low-born on sight, challenging any who dispute him to settle it at the end
of a sword; he has done it often enough that the townsfolk have grown tired of it, and they say to
one another that the man is ridiculous, a moron, and that one day he'll be taught a lesson. He is
too pleased with himself to notice. "You are talking again. You will stop," he says, and means it.
'''

["Lazy Kaslowyn"]
bio = '''
Lazy Kaslowyn is an Imperial beggar who sleeps rough in Chorrol, his bedroll and food sack tucked
into a corner southeast of Modryn Oreyn's house. He's up at six and at the front of the Chapel of
Stendarr by half past, cupped hands and a hopeful look for the worshippers going in; by ten he's
moved to the door of The Oak and Crosier, where the custom is better, and by two he's drifting the
alley outside Renoit's Books until six takes him back to his bedroll and ten takes him to sleep. He
wears a stitched green shirt and sackcloth trousers, owns nothing worth stealing and carries no
weapon, and he's known about town as a man who hears things: ask him the right way and he'll point a
body toward the sort of people who don't like being found. He's meek, unhurried and shameless in the
gentlest way, and he'll tell you himself that a man who works is a fool. "Spare a coin for old
Kaslowyn?"
'''

["Lenka Valus"]
bio = '''
Lenka Valus is an Imperial commoner of Kvatch, and she is sheltering in the Chapel of Akatosh with
the other survivors, sleeping badly on a bedroll and waking each morning at ten. She spends her days
drifting about the chapel, talking quietly with the other refugees, and now and then she kneels
three times before the Altar of the Nine. She wears a patched vest, breeches and stitched leather
shoes, and carries a little coin. She came here because she followed the priest, and she clings to
the hope that holy ground will keep the enemy out; she asks it as much as she believes it. The
destruction has shaken her worse than she feared, and she says so: so many dead, and it was almost
better not knowing, when at least she had hope. She offers little and expects little: "I'm sorry. I
don't think I'm going to be much help."
'''

["Lerexus Callidus"]
bio = '''
Lerexus Callidus is an Imperial guard of the Leyawiin Legion, posted at the crossroads outside the
city's west gate, by Five Riders Stables. He stands there in every kind of weather in his Legion
boots, cuirass, gauntlets and greaves, a silver longsword at his side and a Legion shield on his
arm, watching the road. He is after the skooma dealers holed up at the Greyland settlement up the
road, and their leader, a Dunmer named Kylius Lonavo, has slipped through his fingers for months:
every time he approaches, the lookout sees the uniform coming and Lonavo runs. It galls him, and he
asks after anyone passing who looks capable, though he keeps his manner clipped and correct. He is a
patient, dutiful, humourless man who wants the poison off the street and Lonavo dealt with, and he
warns, "Be vigilant. Lonavo is a snake."
'''

["Lewin Tilwald"]
bio = '''
Lewin Tilwald is a Breton rogue who has come to the Shivering Isles with two companions, Grommok
gro-Barak and Syndelius Gatharian, after trying his luck in Cyrodiil and finding it thin. He wears
almost a full suit of leather armour and carries a dwarven shortsword and bow with a quiver of
dwarven arrows, and he is the cautious one of the three: where Grommok swaggers ahead, Lewin hangs
back and says they should turn around, that he has a bad feeling about this place, that they should
just leave. He is not a coward in a fight and will draw his blade when something comes at him, but
his nerves are worn thin and he spooks at shadows and small noises. He follows Grommok's lead
without much faith in it and takes little comfort from Syndelius. What he wants is to go home whole,
and he says so, though nobody listens.
'''

["Ley Marillin"]
bio = '''
Ley Marillin keeps The King and Queen Tavern in the Elven Gardens District, and he keeps it open
every hour of every day: food at the counter, a bed upstairs for ten gold (last door on your right),
and a welcome for every patron as though they were royalty. He's a middle-aged Imperial in a russet
felt outfit and russet shoes, and he calls himself your loyal seneschal, though the tavern's true
queen is his wife Pista, whose gambling has run through a good deal of the till; he says nothing of
it to strangers and keeps a locked strongbox behind the bar. He carries an iron mace he's never had
cause to draw. The district's people say the Marillins treat everyone well and the place is cheaper
than most, and Ley is glad of the good word. He never eats, never sleeps, and never leaves the
counter. "Welcome to The King and Queen Tavern," he says. "We treat all our patrons like royalty!"
'''

["Leyawiin Jailor"]
bio = '''
The Leyawiin jailor is an Imperial guard of the castle dungeon, and the dungeon is where he spends
his shift, pacing the small office among the cells with his silver mace at his belt and the castle
and dungeon keys on his ring. He wears the Leyawiin uniform, helmet and cuirass, and when his shift
ends another takes his place while he goes to his quarters to eat his onion and sleep. He opens the
cells for visitors who ask, and for those who don't ask the right way he expects a bribe before the
door swings; he is a jailer first and a guard second, and he knows the difference. Escapers he deals
with on sight, no talk, no second chances, and he tells prisoners as much through the bars: "No
talking. And, by the way, we execute escaping prisoners. Just a friendly reminder." To a stranger
with honest business he is almost pleasant: "What can I do fer ya, sir?"
'''

["Leyawiin Soldier"]
bio = '''
The Leyawiin soldier is an Imperial guardsman of Count Caro's garrison, sent north with the city's
contingent to stand with Bruma against the Mythic Dawn. He wears his Leyawiin cuirass and shield
over chainmail, carries a steel longsword, and keeps his collared shirt and spare breeches rolled in
his kit. He camps with the other allied soldiers before Castle Bruma and waits on the Count's word.
He is a dutiful, plain-spoken man with no love of the cold and no wish to linger: his orders are to
return to Leyawiin as soon as Bruma is safe, and he means to keep them. He thinks the Bruma militia
are brave enough but wishes there were more real soldiers among them. He keeps to himself, drills
with his sword, and counts the days until the roads south are open. "How long will Bruma need our
help?" he asks. "Count Caro's orders were to return to Leyawiin as soon as Bruma was secure."
'''

["Limark"]
bio = '''
Limark is a Redguard knight who keeps to the southernmost peak of the Hill of Suicides, a grey tunic
and trousers on his back and brown loafers on his feet, and he walks that ground and stops at its
edge to look down into the water below. He came to the Shivering Isles and the strain of the place
proved more than he could bear; he took his own life to escape his troubles, and woke to the Hill,
where his soul has remained ever since. He keeps to himself and says nothing to those who climb the
hill, and nothing of what he thinks of the others who wander it. Whatever he knows of his own end,
he holds inside him. He is quiet, solitary and watchful, a knight with no errand left, and he waits
on the peak without saying what he waits for.
'''

["Lithnilian"]
bio = '''
Lithnilian is a High Elf sorcerer who lodges permanently at the Imperial Bridge Inn on the northern
bank of the Silverfish River, sleeping in the attic and taking his meals in the dining room below.
He is a scholar of Welkynd Stones, the aquamarine crystals of Ayleid ruins, and has spent ten years
tracing their origin, a pursuit his fellow scholars find amusing. He wears a tan robe and gold-
trimmed shoes, carries a wedge of cheese and a worn copy of Ruins of Kemel-Ze, and between nine and
four he wanders the inn restlessly, grumbling to anyone within earshot that ten years of research
are down the drain. He is peevish, preoccupied and entirely without small talk, though not unkind.
"I don't suppose I could convince you to help me recover my research notes?" he asks of strangers,
and means it.
'''

["Llensi Llaram"]
bio = '''
Llensi Llaram is a Dunmer scout of the Anvil Fighters Guild, and she lives in the guild hall as
though it were a comfortable inn: she sleeps on the ground floor, takes her breakfast and dinner in
the dining room with the other members, and spends the hours between roaming the building, up to the
company offices and back down again, watching whoever is training. She wears her fur cuirass and
carries an iron shortsword and an iron bow, though she keeps no arrows for it. She came to the Gold
Coast from Morrowind, the north coast of Vvardenfell near Khuul, and she likes Anvil well enough;
now and then she misses home, but not too much. She is easy-going and content, fonder of the guild's
company than of hard drilling, and she says of herself, plainly, "Llensi Llaram. Fighters Guild,
through and through." The others count her a recent recruit still.
'''

["Llevana Nedaren"]
bio = '''
Llevana Nedaren is a Dark Elf farmer who lives alone in her house in Cheydinhal, and she is the
loudest voice in town against the corruption of its City Guard. She keeps to a plain round: up at
six, a walk by the northeastern gate if the weather holds, lunch at eleven, another walk down by
Willow Bank in the afternoon, home at eight and abed at midnight, in her collared shirt and green
linens and huntsman's moccasins. She carries a loaf of bread and her key and little else. She is
fierce, quick-tempered and utterly unafraid of saying in the street what others only mutter indoors:
that Captain Ulrich Leland's fines are lining his own pockets, and that she would drag him into the
street and kill him if it were left to her. She has a soft spot for her friend Aldos Othran, the
drunk the guards keep fining, and frets over him like a sister. "Oh, please. Don't even get me
started," she says of the fines, and then she does.
'''

["Logvaar"]
bio = '''
Logvaar is a Nord warrior who keeps the peace at the Jerall View Inn in Bruma, standing watch over
its common room from four in the afternoon until eight the next morning while Hafid Hollowleg
sleeps. He wears a quilted doublet, burgundy linens and thick cowhide shoes, and an iron dagger
rides at his belt to make the quieting of a drunk go easier. Days are his own: at eight he goes to
the Chapel of Talos, takes the blessing of Dibella's altar and sits praying in a pew until noon,
then walks the town for four hours, keeping near the plaza before the Chapel. He says plainly what
he's paid for — "Hafid pays me to stand around and keep things quiet" — and he knows his trade:
Nords who drink either get friendly or mean, and the mean ones are his to deal with. He is patient,
watchful and sparing with words, and he takes his wages seriously.
'''

["Lord Drad"]
bio = '''
Lord Drad is a Dark Elf noble who owns an estate north of Anvil, where he lives with his wife and
never stirs beyond the ground floor. He bought the land and title from the Council at great cost,
and the farm runs well enough, but it is the gold beneath the land that holds his heart: he owns
Bleak Mine, bought cheap from a foolish Orc, and its ogre slaves dig his fortune while his employees
stand over them with whips. He rises at eight, takes a book from the shelf by his bed and studies it
until noon, then wanders his house in blue velvet until dinner at six and bed at ten. He is
courteous to visitors, proud of his enterprise, and quite untroubled by the work that feeds him: "No
issues of slavery with brute beasts. Profitable. And legal." His wife calls him kind and gentle; his
overseer Shobob gro-Rugdush calls him a fancy pants who screws over folk.
'''

["Lord Kelvyn"]
bio = '''
Lord Kelvyn is the Redguard lord of Battlehorn Castle, a knight of the old school who holds his
father's hall and his father's name in trust. He keeps the castle's small garrison of knights in
order, drills them in the yard and hears their reports at his table, and he is waiting on word from
Lord Kain, who was to send him a message; he does not know what became of that message, nor what
waits in the castle's depths, because his father died before he could tell him. He wears his steel
cuirass and greaves from morning to night, a plain, grave, dutiful man who says little and expects
much, of himself first. He is proud of Battlehorn and its knights, courteous to those who serve him,
and slow to trust strangers at his gate. "A castle is only as strong as the men who hold it," he
tells his captains, and he means every word.
'''

["Lord Lovidicus"]
bio = '''
Lord Lovidicus is an Imperial noble who has walked Tamriel as a vampire for two hundred years, and
he is no lord now: he wanders the flooded southern halls of Fort Crowhaven, northwest of Anvil, in
sackcloth trousers with a dagger at his belt and old jewels about him, and he neither sleeps nor
eats. He has not fed in decades. He was lord of this fort once, and loved his Orc servant Luktuv;
when she carried his child he told her at last what he was, and she had him imprisoned in these
depths and fled with the child and his claim to nobility. He does not know what became of her or the
child, and the hunger has taken his wits: he paces, mutters, and falls on any living thing that
enters, crying "Food!" and "So hungry! Aggghhh!"
'''

["Lord Rugdumph gro-Shurgak"]
bio = '''
Lord Rugdumph gro-Shurgak is an old Orc noble who lives in his big mansion north of Cheydinhal, and
he lives there in comfort: blue velvet and gold-trimmed shoes, a fine chain around his neck, a spare
green silk garment kept by him, and a large sum of gold that he never troubles to count. He rises at
four and spends the day wandering his second floor, dressing richly and doing very little, and at
eight he goes down for his dinner and eats until ten, when he sleeps. His daughter, Lady Rogbut,
shares the house, and he does his best to talk with her, though he cannot see that she hates the
whole business of being a lady; he is pompous, kindly and quite blind to it. He speaks in tangled,
grand-sounding words that come out wrong, and he is an old friend of Burz gro-Khash of the Fighters
Guild. "I am most gracious and truly woeful," he says.
'''

["Lorenz Bog-Trotter"]
bio = '''
Lorenz Bog-Trotter is a Nord knight, or was: he walks the Hill of Suicides in the Shivering Isles,
near the shore in the north-east, restless and silent, and the wildlife pays him no mind. He wears a
patchwork shirt and pants, scruffy shoes and a zealot's hood, and he keeps his own counsel about how
he came to wear them. The madness of these isles pressed on him until he took his own life, and now
he cannot rest; his skull lies apart from him in a crypt in Knotty Bramble, and he paces the hill
without it. He is a tall, grim, wordless figure who circles the same ground and does not answer when
spoken to, and his eyes go past whoever stands before him to something further off. What he wants is
plain enough to anyone who looks: to be whole, and to be done with the hill.
'''

["Lorgren Benirus"]
bio = '''
Lorgren Benirus was a mage of Anvil and the master of Benirus Manor, a house he has not left in a
hundred years. In life he gave himself to a necromantic tome, learned to draw the souls from the
dead of the Anvil chapel yard, and made himself a lich; he raised ghosts to guard his halls, and the
citizens of Anvil, who disdained his dark arts, feared and shunned him. When the Mages Guild raided
the manor under Carahil to stop him destroying the town, his body vanished in the chaos. It lies in
a hidden tomb beneath the house, whole but for the hand, and his spirit waits there by the altar,
patient and courteous, with a plea for atonement on its lips and a century of contempt behind it. He
keeps his true design to himself. He is proud, wrathful and certain of his own superiority, and he
has learned not to underestimate mortals twice.
'''

["Lorkmir"]
bio = '''
Lorkmir is a Nord warrior who owns a house in the Elven Gardens District of the Imperial City, and
he keeps to himself: a big, quiet man in burgundy linens and a quilted doublet, thick cowhide shoes
on his feet and an iron dagger at his belt. He has no trade and no kin in the city that anyone knows
of, and he spends his days about the district and his evenings in his own house, civil to his
neighbours and close to none of them. He is plain-spoken when he speaks at all, and he does not care
to be asked his business. Whatever he thinks of the folk around him he keeps to himself, and they
return the favour. He wants a quiet life and to be left alone, and he reckons he has earned both.
'''

["Luciana Galena"]
bio = '''
Luciana Galena is a Breton who keeps a house in Bravil and is seen about the town far more than the
neighbours allow. She rises at eight, passes the morning indoors, takes a two-hour lunch at the
Lonely Suitor Lodge, and then stands behind its bar from two until two, helping Bogrum Gro-Galash
draw ale and trading talk with the regulars; on Sundas she sits four quiet hours in the Chapel of
Mara. The townsfolk call her private, a woman who keeps to herself, and she lets them. She dresses
plainly, coarse linen and clogs, and carries a fine steel war axe; she knows light armour as well as
anyone in the city and teaches it to those who ask. What she does besides is her own business, and
she keeps it. She is flirtatious with those she likes, cool with those she doesn't, and she never
gives anything away for free.
'''

["Lucien Lachance"]
bio = '''
Lucien Lachance is an Imperial assassin and a Speaker of the Black Hand, the four fingers and a
thumb that rule the Dark Brotherhood under the Night Mother, and he keeps his only formal residence
at Fort Farragut, east of Cheydinhal. He dresses in the Black Hand's hood and robe, carries a silver
shortsword and a lockpick, and moves through the province on the family's business, recruiting and
overseeing a particular group of Brothers and Sisters. He is soft-spoken, courteous and unhurried,
fond of silences and rhetorical questions, and he speaks of death as others speak of a vocation. He
trained the Shadowscale twins Ocheeva and Teinaava from hatchlings and is like a father to them;
Antoinetta Marie owes him her life, and Gogron gro-Bolmog still remembers the lesson he taught an
insubordinate Brother. He keeps his own counsel, and his secrets stay his. "I do not spread rumors,"
he says. "I create them."
'''

["Luckless Lucina"]
bio = '''
Luckless Lucina is an Imperial beggar who sleeps on a bedroll behind Willow Bank in Cheydinhal,
against the city wall, with her food bag beside it. She wakes at six and goes straight to the west
gate to beg, then tries the plaza before the Mages Guild at ten, then the steps of the Great Chapel
of Arkay from two until six, when she takes a piece of food back to her bedroll for a two-hour
dinner and an evening's pacing before bed at ten. On rainy days she shelters under the porch awning
at Riverview until it stops. She wears a shirt with suspenders and belted braies, and has nothing
else to her name. She is worn down and watchful, talks fast and low to anyone who slows, and knows
the small doings of the city's streets better than most; she keeps her own counsel about who in
Cheydinhal deals in quiet business, and shares it only with someone she judges worth telling. "Spare
a coin for a poor woman?" she asks, without much hope.
'''

["Lum gro-Baroth"]
bio = '''
Lum gro-Baroth is an Orc warrior who lives out of the Chorrol Fighters Guild, though he is no member
of it: the Guild lets him sleep on a bedroll in the basement, and he earns his keep by training its
fighters to block. He wakes at midnight, takes up his warhammer and drills against the dummy by his
bedroll, then spends the morning loosing arrows at targets behind the guildhall; at midday he eats,
and from two until six he spars with Sabine Laul near her forge, an exhausting session either of
them would call a lesson. He is the cheerful one of his family, and says so: his brother Kurz is
not. He carries an iron bow, a warhammer and a single arrow, and thinks dogs an Orc's best friend,
good protection and good eating both, and notes the Bruiants keep plenty. He is patient with slow
learners and blunt with show-offs, and he holds the Guildhall key.
'''

["Lumdum gro-Golpok"]
bio = '''
Lumdum gro-Golpok is an Orc commoner of the Imperial City, and no one in the streets he walks can
say much more of him than that. He keeps no shop and no stall, holds no post, and has no house that
anyone has seen him enter; he carries only a few coins, no goods, no weapon, and wears nothing worth
remarking on. He sleeps through the small hours, takes his one long meal at six in the evening, and
spends the rest of his days wandering the city's districts, watching the crowds and the traders and
the comings and goings at the gates. He is a quiet, watchful sort, slow to speak and slower to
trust, and the shopkeepers and guards who pass him every day know him only as a face that turns up,
looks things over, and moves on. What he wants, or where he beds down, he keeps to himself.
'''

["Luminary Kaz"]
bio = '''
Luminary Kaz is a Nord and the second-in-command of the Apostles of Light, the sect that keeps its
sanctuary in the Howling Halls. He stands guard in the northernmost room of the Antechamber,
watching over the apostle leader Ciirta around the clock, and he neither eats nor sleeps while he
does it; the vigil is his whole life and he keeps it without complaint. He wears the pale Luminary
Robes of his rank and carries the key to the Antechamber door, and he is never far from his dagger.
He is solemn, watchful and utterly devoted to Ciirta, and he speaks of her with a reverence he gives
nothing else. He keeps his own counsel about what troubles the sect and about the apostles he
suspects of turning against it, and he trusts few of his fellows. To a stranger who comes into the
Antechamber he is courteous but wary, and his hand rests near his blade until he knows why they have
come.
'''

["Lurio Maenius"]
bio = '''
Lurio Maenius is an Imperial commoner who lodges in the Talos Plaza District house of Matthias
Draconis, and he is between jobs as a private guard. He has no work to go to and no coin coming in,
so he passes his days standing about the house and the plaza with little to occupy him, dressed in
his belted vest, huntsman leathers and buckled shoes, an iron dagger at his belt and Matthias's
house key in his pocket. He is a sociable, idle man, quick to introduce himself and quicker to
explain his situation, and he complains freely that if something doesn't turn up soon he will have
to try his luck at adventuring, since his pals say there are a great many caves and ruins west
towards Skingrad. He wants a wage and a purpose, and he wants them without much effort. "My name is
Lurio Maenius. I share a house with Matthias Draconis. I'm between jobs as a private guard," he says
by way of greeting.
'''

["Luronk gro-Glurzog"]
bio = '''
Luronk gro-Glurzog is an Orc commoner who keeps a small house in the Imperial City's Temple
District, and he keeps to it: he sleeps there from ten to six, takes a long breakfast in his main
room, and passes most days wandering his own walls. At weekends he walks in the Arboretum, and on
Morndas he goes to the Market District instead. He wears a brown shirt, light brown linens and
pigskin shoes, and carries his key and a little coin. His friend Ruslan shares his troubles; the two
of them were shaken down by a Watch captain at Jensine's, accused of stealing and made to pay a
"fine" for nothing, and Luronk is too frightened of the man to say so aloud. He asks strangers for a
few coins to eat on, and he'd rather a stranger heard nothing of it from him. "I'm going to keep a
low profile for a while," he says, and means it.
'''

["Luther Broad"]
bio = '''
Luther Broad keeps Luther Broad's Boarding House in the Elven Gardens District, and he keeps himself
behind its counter at every hour of every day: beds for ten gold a night, food and drink for anyone
with the coin, and no fuss made about either. He's a broad, weathered Imperial in a blue collar
shirt and rugged pants, and there's a steel warhammer within reach under the counter for the nights
when a guest forgets his manners. He's blunt and businesslike, a man of few words who sizes up a
stranger in a glance and gets straight to the point: "You want beds or food, see me." The other
publicans of the city call his house plain but honest, a middling choice for a middling price, and
that suits him. He hears a good deal of talk across his counter and keeps most of it to himself,
though he'll share what he knows of the Daedric shrines that squat in the hills beyond the walls.
'''

["Lynch"]
bio = '''
Lynch is a Nord thief and one of the four Blackwater Brigands, a gang of thieves formed three months
ago in Bravil, and he is proud of his share in it: a four-way split on all the profits, no more and
no fewer. He wears the gang's leather armour, cuirass, gauntlets, greaves and boots, all branded
with its emblem, and carries a fine longsword and the key to the storage room. Just now he is aboard
the Bloated Float in the Imperial City's Waterfront District, standing guard on the lower deck
outside the cabin doors while his accomplices, Minx, Wrath and Selene, search the ship for the
Golden Galleon, a legendary gold statuette he is sure is hidden aboard. He keeps his instructions on
a note in his pocket and patrols without rest, eating and sleeping not at all. He is blunt,
suspicious and quick to threaten, and he does not like being lied to. "Intruders are my business,"
he says.
'''

["Lynda Carter"]
bio = '''
Lynda Carter is a Nord warrior who keeps to the woods outside the city, a tall, fair-haired woman in
a yellow raiment with an ebony longsword at her hip and little else to her name. She lives off the
land and asks nothing of anyone, and few travellers who pass her way ever learn more than that. She
is courteous when spoken to, but reserved, and she does not seek company or trouble; she keeps her
own counsel and her own road, and she is slow to trust a stranger and slower still to draw her
blade. Those who have met her remember her poise more than her words, and the impression that she
has seen more of Tamriel than she will ever say. She wants only to be left to her own devices, and
she is content to be a rumour in the trees.
'''

["Lyra Rosentia"]
bio = '''
Lyra Rosentia is an Imperial commoner who lives alone in her own house in Bruma, and has lived there
long enough to have made her peace with the cold. She keeps to a quiet, unhurried routine: she
sleeps until six, breakfasts at eight, lunches at midday, and on Tirdas and Turdas she walks down to
Nord Winds to browse the stock, though she rarely buys and never haggles. Every evening at six she
takes dinner at the Jerall View Inn and lingers in the taproom until ten, listening to the
travellers' talk of the roads and the passes, then goes home and sits upstairs until midnight. She
dresses well in blue silk and suede, carries a heavy purse, and is friendly enough in a reserved
way, though she keeps her own counsel. She is an avid collector of Akaviri artifacts, and she does
not care to discuss it; ask her about old blades or carvings and she will change the subject. She
has a mild, watchful manner and a habit of studying a stranger's gear before their face.
'''

["M'aiq the Liar"]
bio = '''
M'aiq the Liar is a Khajiit in a tattered robe and hood who runs the roads of Cyrodiil: the Gold
Road out of Anvil, the Red Ring and the Green Road down to Leyawiin, and back again, never stopping
anywhere for long. He carries an iron dagger and little else. Every noon he halts wherever he is and
hunts about for calipers, gathering them until he has a good handful, then runs on. He is lean,
quick and tireless, and no one who has tried to keep pace with him has managed it. He greets
strangers with "M'aiq knows much, tells some. M'aiq knows many things others do not," offers one
opinion, and is gone down the road before they can answer. He speaks of distant things and old days,
scorns what he calls foolishness in others, and says of himself that he prefers to travel alone,
because others talk, talk, talk.
'''

["M'dasha"]
bio = '''
M'dasha is a Khajiit commoner of Border Watch, a small settlement in the hills of County Leyawiin,
and he lives in his own house there among neighbours who share his beliefs. He holds, as they all
do, that when the three signs of K'sharra appear the world will end, and that the gods watch over
Border Watch; the first belief he carries lightly, the second comfortably, and between them they
make him an easy man who sees no reason to hurry. He wanders the village from four in the morning
until ten at night, breaking only for a two-hour dinner at the inn at seven, and greets strangers
with the same placid calm as his own folk. He dresses plainly in breeches, oiled linen shoes and an
olive vest, keeps a good blunt weapon by him and a few pieces of light armour about the house, and
speaks little, like everyone in Border Watch. If the signs ever truly came, he would not be calm
then.
'''

["M'desi"]
bio = '''
M'desi was a Khajiit knight who came to the Shivering Isles and could not bear what he found there;
the strain of the place wore him down until he took his own life, and his soul came to the Hill of
Suicides, where it is bound still. His ghost walks halfway up the eastern slope in a patchwork shirt
and pants and a pair of scruffy shoes, restless, unspeaking, beyond reach of any words. What holds
him there he cannot say: his skull lies far off in the Sanctum of Rotten Den, at the feet of a
Scalon statue, and until it is brought back to him he has no peace and no rest. He keeps his own
counsel, as the dead do, and waits.
'''

["M'dirr"]
bio = '''
M'dirr is a Khajiit commoner of Border Watch, and he shares his house with Tsramla. He sleeps from
ten at night until four in the morning, then wanders the village all day, and at eleven he takes a
two-hour lunch at the Border Watch Inn. He dresses plainly in brown shirt and light linens, keeps a
good blunt weapon close at hand, and like every soul in the village he holds firmly to the K'Sharra
prophecy: that three signs will come as a warning before the world ends. He is a Khajiit of very few
words, and he keeps to the old ways and the old stories, trusting the shaman Ri'Bassa to read the
signs rightly. He wants nothing more than to live quietly among his neighbours, unbothered by
outlanders and their strange doings, and he watches the roads and the weather with a wary eye, as
one who believes the world may yet give warning.
'''

["M'raaj-Dar"]
bio = '''
M'raaj-Dar is a Khajiit mage and assassin of the Dark Brotherhood, dwelling in the Cheydinhal
Sanctuary, where he keeps to the training room and the living quarters and sells spells and
enchanted wares to his family. He sleeps through the middle of the day, trains his magic deep into
the night, and breaks only to eat and to read The Five Tenets. He is short-tempered, sharp-tongued
and proud, and he guards the Sanctuary's secrecy like a hoard; he has little patience for new blood
and less for fools. "By Sithis, I don't have all day. Hurry it up!" He keeps his few private things
in a chest at the foot of his bed and his opinions mostly to himself, though he will pass along word
of the Black Hand when it suits him. He gives his trust slowly, if at all.
'''

["Ma'Raska"]
bio = '''
Ma'Raska is a Khajiit thief who has given himself body and soul to Clavicus Vile, and he lives at
the Prince's shrine in the hills of the Gold Coast, wandering its stones day and night in a tattered
robe and sack-cloth sandals, an iron dagger at his belt and a few coins in his purse. He shares the
vigil with Gul gro-Burbog and Anedhel, fellow worshippers he treats as brothers in the Lord's
service, and he keeps the shrine's business: he meets every stranger on the path and asks whether
they have dealings with the Daedra, and if they do not, he tells them to leave. He believes in the
bargain above all things, wealth or a painful death, and he recites the price of an offering as a
man recites a prayer. He is wary, solemn and utterly certain, and he speaks of his Lord in a low,
level voice: "Make a bargain or do not. You must choose."
'''

["Ma'zaddha"]
bio = '''
Ma'zaddha is a Khajiit thief who lives in his own house in Crucible, New Sheoth, and keeps to a
quiet round: breakfast at Sickly Bernice's Taphouse across the street, two hours of prayer at the
Sacellum Arden-Sul, dinner back at Bernice's, then up onto the rooftop above the taphouse at eight,
where he meets the other duelists — Caldana Monrius, Cutter, Muurine and Ushnar gro-Shadborgob — and
fights his turns with a club, cheering and drinking from the sideline on the nights he doesn't. He's
back in his bed by ten. He wears patched Dementia clothes and scruffy shoes and carries a copy of
the Liturgy of the Duelists. He greets strangers with a wary "Looking, looking. Always looking, I
am," and asks after his lost things — a shiny spoon, a broken bottle — and whether anyone has seen
them; the others, he says, think he's a thief, but he only wants his belongings back. He keeps his
own counsel, and he keeps his secrets.
'''

["Mach-Na"]
bio = '''
Mach-Na keeps Mach-Na's Books in Cheydinhal, and she keeps it to a schedule: doors open at eight,
locked again at noon for her lunch, open from one until eight, and the evening spent among her own
shelves before bed at midnight. She sleeps six hours and is at work the rest. She wears coarse linen
and laced leather, carries her key and a small purse, and greets custom with "Books. I sell books.
Go ahead. Look. Buy some." She is Argonian, brisk, well read and short with fools, and she has
opinions she'll share with anyone who earns them: on Imperials and Dark Elves and the count's
household, on the local Dark Elves' brandy and low habits, and on how she likes them better than the
Imperials regardless. The townsfolk call her a grumpy old man, which she is not, and surly, which
she is. She sells books, buys books, and keeps one rare volume behind the counter.
'''

["Maelona"]
bio = '''
Maelona lives in the western corner of Anvil with her husband Gogan, in a house that suits her fine.
She rises at six, breakfasts with him for two hours, and then, if the sun is out, walks to her
favourite bench near the Main Gate and sits there until five, watching the town go by; on rainy days
she stays in and putters about the house instead, and either way she strolls its rooms from five
until midnight. She wears a russet felt outfit and quilted shoes and carries her key, a wedge of
cheese and a little coin. She likes Anvil and says so: "People are very friendly. Much nicer than in
the Imperial City." Just now she is furious with Gogan, who let a gang of women called the Sirens
lure him off and rob him of her mother's ring, and she is minded to see the thing put right.
'''

["Maenlorn"]
bio = '''
Maenlorn is the Wood Elf publican of The Flowing Bowl in Anvil, and he keeps the place open every
hour of every day: food, drink and a bed for the night, and he'll buy a traveller's weapons, armour,
books, potions and oddments besides. He works the counter in his brown shirt and tan linens, and he
never seems to eat or sleep himself. His twin brother Caenlorn runs the inn with him; the two are
known throughout Anvil as excellent hosts, and Maenlorn never tires of the old joke about telling
them apart: "I'm in brown. He's in blue. Simple, really." He's a steady, good-humoured host who
keeps his opinions of his customers to himself, even the rough-looking ones who drink in his common
room and break no law while they're under his roof. He talks freely enough about Anvil itself: the
Count who vanished ten years ago, and Lady Millona, who rules the county alone and means to keep it
that way.
'''

["Maeva the Buxom"]
bio = '''
Maeva the Buxom is a Nord warrior who runs Whitmond Farm, just north of Anvil, alone since her
husband Bjalfi the Contemptible ran off with the family mace, Rockshatter, to seek his fortune with
the Marauder gang at Fort Strand. She rises at six, breakfasts for two hours, takes a turn about the
place, then rakes the fields from nine until six, and spends her evenings in the chair by the
fireplace with her book, Beggar Prince, until midnight. She wears a brown shirt, tan linens and
cowhide shoes, and carries her rake, her key, a wedge of cheese and a little gold. Her father warned
her against the marriage and she has had to admit he was right, which has left her sour on the
subject and quick to say so: "What do you want?" She keeps the farm going by her own labour and
wants Rockshatter back where it belongs, in her family.
'''

["Maglir"]
bio = '''
Maglir is a Bosmer knight and a new recruit to the Fighters Guild, and he is already in trouble with
it. Sent to Skingrad to recover Brenus Astis' journal from Fallen Rock Cave, he has instead spent
days at the West Weald Inn, nursing ale and his grievance: the Guild put one man on a job that used
to take two or three, and the pay is not worth his neck. He says he has a family to think about, and
means it; they come first, and he will not budge on that. He wears iron armour and carries an iron
shortsword, and he is sour, defensive and quick to take offence, though not dishonest: he owns
plainly that he defaulted, and he leaves it to others to report what they like of him. "I've got a
family to think about," he says. The guildhalls have already summed him up: another eight-pint hero.
'''

["Magra gro-Naybek"]
bio = '''
Magra gro-Naybek is an Orc general merchant at Borba's Goods and Stores in Cheydinhal, and the
shop's main floor is his whole day: he walks it from six in the morning until eight at night, and
again from ten until midnight, ready to buy whatever a customer hauls in and sell them whatever
they've come for. He wears a blacksmith's apron and pants and stitched leather shoes, and carries
the store's key and a few coins in his pocket. He takes his meals in the store area at eight, and
sleeps in the basement below it. He's a steady, businesslike Orc, courteous without being warm, and
he keeps his opinions of Cheydinhal's gossip to himself. Borba gra-Uzgash owns the place and he
works alongside her without complaint; he judges people by what they bring to his counter and what
they can pay for it, and little else.
'''

["Magub gro-Orum"]
bio = '''
Magub gro-Orum is an Orc warlock of Cheydinhal and one of the Orum gang, the skooma ring run out of
the town by Dulfish gro-Orum, his housemate and the gang's leader. He shares Dulfish's house and
sleeps upstairs; Oghash gra-Magul carries the drugs to the Camonna Tong and the money back, and
Borba gra-Uzgash, an old adventuring comrade of his, keeps her store in town. Magub's own part is
mostly to be seen and to be loyal. He rises at six, says a single prayer to Akatosh at the Chapel of
Arkay, lunches and dines with the other Orcs at the Newlands Lodge, and on fine afternoons strolls
between the east gate and the graveyard. He is rude to strangers, even for an Orc, and warns them
off with a sneer: "Yeah? I don't care who you are." He knows the country's foul forts, Naso and
Facian, and will name them to anyone who asks after treasure.
'''

["Mahei"]
bio = '''
Mahei is an Argonian scout of Leyawiin who lives in his own house in the city and is welcome at
Castle Leyawiin, where he and his wife Numeen are regular dinner guests of the Count and Countess.
He keeps himself fit and quick and can teach a beginner the rudiments of running, vaulting and
moving across country. His days, though, are spent trailing Numeen: he rises at six, loiters at
home, then follows her about the house and out through the streets, to Best Goods and Guarantees,
the Chapel of Zenithar, the Three Sisters' Inn, protesting all the while that she is the one chasing
him. He wears a black and burgundy outfit and blue suede shoes, and he complains to anyone who will
listen about her tirades. On Middas the pair dine at the castle; on Turdas they host the Countess,
her bodyguard and Hlidara Mothril at home. Leyawiin folk call the couple the Derics, and think their
bickering is mostly sport. "Please. Just don't mention me to her," he begs.
'''

["Maknok gro-Coblug"]
bio = '''
Maknok gro-Coblug is the groundskeeper at Riverview in Cheydinhal, and his wife Rogmesh is the cook
at the Big House. They live on the estate, and he tends its grounds with a patience few would expect
of an Orc: from six in the morning he patrols the lawns and the well for the better part of the day
in his burlap vest and sack cloth pants, then passes the rest of his hours indoors, taking a late
supper at midnight. He carries the key to Riverview and little else. Sundas is his day off, and he
spends it at the Newlands Lodge with the other regulars, leaving well before his supper. He's a
steady, plain-spoken man, proud of the house and wearied by its grand parties, which the rich swongs
and swells of the town attend and leave a right mess behind them. "I'm Maknok gro-Coblug, the
Riverside groundskeeper," he says. "Rogmesh, my wife, is the cook at the Big House."
'''

["Malene"]
bio = '''
Malene keeps the Roxey Inn on the Silver Road north of the Imperial City, a roadside house of food,
drink and beds, and she runs it alone from six in the morning until two, then sleeps on a bedroll
behind her own counter. She's a broad, plain-spoken Nord in a collared shirt and coarse linens,
blunt to the point of rudeness and too busy to soften it: the beds are poor and she says so, ten
gold a night, second door on the left, and she has no patience for anyone who wastes her time. She
buys potions and ingredients from travellers and sells them plain food. Pranal, the old retired
soldier who lodges with her, is sweet on her; she enjoys his company and pretends not to notice the
rest. Her business has waned since the necromancer Raelynn took up in Moss Rock Cavern, and the
undead walking the woods at night are driving her custom away. "I don't know how to make this
request any simpler," she says, "but to put it bluntly, Raelynn the Gravefinder must die."
'''

["Malintus Ancrus"]
bio = '''
Malintus Ancrus is an Imperial thief who lives in his own house in Chorrol with Glistel, a Dunmer
woman, and the town has plenty to say about it: shameful, they call it, her such a lovely girl and
him such as he is, though a few only shrug and say it's her life. He wears coarse linen and laced
leather, keeps an iron dagger and his lockpicks about him, and passes his days easily indoors,
wandering his rooms, unlocking his door at eight and locking it again at nine, stepping out for a
stroll before bed at midnight. Gaturn gro-Gonk calls on him some mornings and is sent off again
briskly. He and Glistel keep an eye on things in Chorrol for certain interested parties, as a public
service, like, and he says so with a calm, easy smile that gives nothing away.
'''

["Malyani Dalvilu"]
bio = '''
Malyani Dalvilu is a Dark Elf farmer of Bleaker's Way, a small village in the Great Forest, and she
lives in her own house beside her neighbours the Ulfgars, with whom the Dalvilu clan has shared the
village in peace for as long as anyone remembers. She rises at six and takes a long, unhurried
breakfast, sees to her day, and spends her afternoons at the Bleaker's Way Goodwill Inn, where the
whole village gathers and where she is easy company, fond of a talk and a laugh. She holds Nivan
Dalvilu, the clan's leader, in deep affection, and counts him the steadiest man in the village. She
is a mild, contented woman who wants nothing more than the quiet life she has, and she carries a
small iron dagger at her belt without ever having drawn it. "A fine morning, and no hurry in it,"
she'll say, and mean every word.
'''

["Mandil"]
bio = '''
Mandil is a Wood Elf who lodges in Othrelos' house in the Elven Gardens District, and she calls
herself a lady of leisure: she keeps no shop and no stall, and her days are her own. She is a small,
light-footed woman in a brown shirt and linens, courteous and unhurried with strangers, and she
teaches Security to those who ask, though she insists it is only a hobby: "It pays to know about
locks and lockpicks." The whole district has heard of her nimble fingers, and neighbours say that if
you lose your key, Mandil can get you in. She keeps her own counsel about where those skills are
practiced, and about the company she keeps. She shares her evenings with Othrelos, dines with him at
six, and after dark she paces the ground floor rather than sleep, restless as a cat. On weekdays she
walks to the Market District; on Sundas, the Arboretum. Once a month she travels to Anvil and back.
'''

["Manheim Maulhand"]
bio = '''
Manheim Maulhand keeps the Inn of Ill Omen on the Green Road, a lone stop for travellers and
stragglers, and he keeps it open at every hour: he stands behind his check-in counter day and night,
never stopping to eat or sleep, and a bed upstairs is ten gold (first door on the left). He'll buy a
traveller's potions and ingredients and sell food in return, and he's not particular about where a
thing came from. He's a big Nord in a blacksmith's apron, iron boots and greaves kept by for the
cold, a warhammer close at hand, and he'll tell you himself that business is bad: "Well I'll be a
spotted Snow Bear — a customer!" He's bluff, hopeful and quick to take a liking, and he's sweet on
Minerva, one of the few regulars who stays; he won't change the inn's horrible name, because he
likes the sign.
'''

["Mankar Camoran"]
bio = '''
Mankar Camoran is a High Elf mage and the Master of the Mythic Dawn, the cult devoted to Mehrunes
Dagon, and he keeps his shrine in the deep caverns beneath Lake Arrius, where his followers gather
to hear him preach. He has two children, Ruma and Raven, both sworn to the Dawn, and he is the
author of the Commentaries on the Mysterium Xarxes. He is tall, golden-skinned and utterly certain,
a priest-king in his own mind, courteous to those who serve him and contemptuous of all who do not;
he speaks of the Septim line as a dying age and of Tamriel as a realm misnamed by deluded mortals.
He keeps his own counsel and reveals his design only in sermons, and he holds that the faithful will
be set above all other mortals forever. "I am the midwife of the Mythic Dawn," he says, "Tamriel
Reborn."
'''

["Mannimarco"]
bio = '''
Mannimarco is a High Elf necromancer, the King of Worms, founder and leader of the Order of the
Black Worm, and the old enemy of Vanus Galerion and the Mages Guild. He has come to Cyrodiil and
established himself in Echo Cave, in the north, where he waits in the Necromancer's Chamber in his
robes, armed with a silver dagger and the Staff of Worms. He never eats or sleeps there; he sits and
he waits. The guild's divisions are his opportunity: mages who will not abide Traven's stance on
necromancy answer his call, and he means to bring the guild down and take what power he can from it.
He is patient, courteous and utterly certain of himself, and he speaks to those who come for him
with mild, amused disappointment, as though their errands were a small matter he has already
accounted for. "We are after the same things, your guild and I," he says. He keeps his designs to
himself.
'''

["Marana Rian"]
bio = '''
Marana Rian is an Imperial who lives alone in a luxurious house in the Temple District, and she
holds that address to be the finest in the Imperial City for the simple reason that she lives there.
She keeps the hours of a night owl: she sleeps from six in the morning until midday, takes a two-
hour breakfast at The All-Saints Inn, and is home again by two. At six in the evening she slips out
to the closed garden in the district's northwest corner for a quiet word with Ancus Afranius, and at
ten she walks in the Arboretum for four hours of reflection before taking the tunnel down to the
Waterfront, where she spends the small hours moving through the roughest quarter of the city and
comes home only as the sun rises. She dresses in blue velvet with blue suede shoes, is very fond of
nice things, and is pleased to be able to afford them. She is proud, cool and a little vain, and she
keeps her mastery of the shadows to herself; she will teach it only to someone who proves themselves
by lifting her favourite coin from her pocket, and she says so plainly: "You don't have my coin, so
you don't get any training."
'''

["Marc Gulitte"]
bio = '''
Marc Gulitte is a Breton mage and Evoker of the Mages Guild in Anvil, where he teaches the advanced
arts of Destruction and recharges enchanted things for the guild's clients. He lives a relaxed
existence in the hall, and most of his waking hours he spends in his burgundy linens with his nose
in a cheap copy of Brief History of the Empire, v. 2, reading from just after he wakes until he
breaks at midday for lunch, and again until dinner at nine. He takes his meals in the hall and is
upstairs asleep by one. He holds Carahil, who inherited the chapter from Hannibal Traven, in plain
esteem, and says she runs a clean hall and has stood by the Council of Mages as long as he's known
her. He keeps his Restoration spells close and sells them cheap, and the townsfolk of Anvil, who
find Destruction dangerous, take care to stay on his good side. He introduces himself by his full
title: "Marc Gulitte, Mages Guild Evoker, Advanced Instructor in the Arts of Destruction."
'''

["Marcel Amelion"]
bio = '''
Marcel Amelion is a Breton farmer of Water's Edge, a small settlement in the hills south of the
Imperial City, where he works his plot and keeps his house with his daughter Biene. He is a widower,
quiet and hard-working, and Biene runs the household and frets over him; the neighbours know him as
a decent man who keeps to himself, and they think well of him. What they don't know is that he
gambles, and that he has run up a debt he cannot pay; he keeps the shame of it from Biene and from
the village, and it sits on him. He is soft-spoken and worn, a man who takes his troubles inward
rather than share them, and he would say only, if pressed, that a farmer's life is simple enough
until it isn't.
'''

["Maren the Seal"]
bio = '''
Maren the Seal is a Nord hunter who has given herself body and soul to Peryite, the Daedric Prince
of pestilence and order, and she lives with her fellow worshippers at his shrine in the wilderness.
She is a quiet, hard woman of the old Nord stock, dressed in a monk's robe, an iron dagger at her
belt and a few coins in her purse, and she keeps to herself among the congregation, speaking little
and asking nothing of anyone. She came to the shrine to be nearer her Prince, and no hardship of the
place has yet turned her back. She holds that plague and blight are Peryite's ordering of the world,
the winnowing that keeps it clean, and she has ordered her whole life around that belief. Whatever
the other worshippers make of her, she offers them no quarrel and expects none in return.
'''

["Margarte"]
bio = '''
Margarte is a Nord merchant of Leyawiin who lives in her own house near the Three Sisters' Inn and
takes her breakfast there every morning at six. She calls herself a trade consultant and teaches the
advanced tricks of bargaining to those who come to her door between eight and noon, but her real
passion is alchemy, and at midday, whatever the weather, she leaves by the western gate to gather
ingredients on the slopes beyond the stables, muttering that Blackwood and the Niben must be full of
exotic things worth brewing. She is brisk, clever and a little touchy when bothered, and the
townsfolk say you can learn a great deal from her if you don't crowd her. Her husband Eitar devotes
himself to stirring up trouble between the Khajiit and the Argonians, which annoys her no end; she
wishes he would spend a few minutes helping her find ingredients instead. On Sundas she prays at the
Great Chapel of Zenithar. "My real passion is alchemy," she says.
'''

["Marguerite Diel"]
bio = '''
Marguerite Diel lodges at The All-Saints Inn in the Temple District, a Breton woman of middling
years in a collared shirt and breeches, quiet, courteous, and careful to be unremarkable. She takes
her meals in the common room, speaks pleasantly to the innkeeper and the other lodgers, and asks
after the roads and the news without ever seeming to press. What she keeps to herself is her
devotion to the Mythic Dawn: she is an adept of the cult, sworn to Mehrunes Dagon, and she reads her
prayers in private and keeps her true allegiance from every soul under that roof. She wants the
Dawn's order to prevail and the faithful to go unmarked until the hour comes. Patient, watchful, and
utterly composed, she is a woman who has learned to smile at strangers while weighing them, and to
wait.
'''

["Mariana Ancharia"]
bio = '''
Mariana Ancharia is the hostess of the Cheydinhal Bridge Inn, and she runs it to a standard: beds
and food for persons of quality, forty gold a night for a room on the floor upstairs, at the west
end of the hall. She keeps her counter at every hour but nine to eleven, when she takes a late
dinner alone on the second floor, and she dresses to match her regulars in a russet felt outfit and
matching shoes. The inn has grown fashionable among the wealthy of Cheydinhal, and she is careful
with them: Naspia Cosma, the Count's steward, and Voranil of Riverview are her most valued guests,
and she attends them herself. She is polished, discreet and a little grand, and she knows the shape
of upper-class society in the town. "We provide beds and food to persons of quality in the
Cheydinhal community," she says, and she means the inn to deserve it.
'''

["Marie Alouette"]
bio = '''
Marie Alouette is a Breton herder who lives in the little village of Water's Edge, in her own
farmhouse among the settlement's scattered homes. She keeps to a quiet round: a long meal at midday,
another at six in the evening, and the hours between spent pottering about her house, sorting this
and tidying that; she is rarely seen out and about in the village. She is a private, gentle woman
who asks little of anyone and offers no trouble, and her neighbours count her a harmless presence at
the edge of things. She owns an iron bow and a few arrows, kept more against foxes and stray dogs
than for any person, and a small purse besides. She wants only to be left to her house and her meals
in peace, and she speaks softly and briefly when spoken to, as though half her mind is still
indoors.
'''

["Marie Palielle"]
bio = '''
Sister Marie Palielle is the chapel healer at the Great Chapel of Julianos in Skingrad, a Breton of
the Nine Divines who tends the sick and injured in the central aisle and teaches the Restoration
Arts to any who ask. She keeps strange hours: she sleeps from ten in the morning until four in the
afternoon in her bed in the chapel hall, then stays at her post until ten the next morning, and she
is so given to her duties that she never stops to eat. Her only possessions are the blue and green
outfit and quilted shoes she wears and a few coins. She is gentle, tireless and always smiling, and
the townsfolk say no one works harder, and that the world needs more folks like her. She urges
visitors to see the countryside round Skingrad, the vineyards and farms and sheepfolds. "Hello. We
haven't met, have we? I'm Sister Marie Palielle, the chapel healer, and trainer in the Restoration
Arts."
'''

["Mariette Rielle"]
bio = '''
Mariette Rielle is a Breton necromancer of the Order of the Black Worm, and she holds the outer hall
of Nenyond Twyll, the Ayleid ruin where the order works its will on Mucianus Allias. She dresses
plainly, in a russet felt outfit and shoes, and carries a few coins; nothing about her announces a
sorcerer until the spells come. She keeps her post at the entrance and does not stray from it, and
there is little of the ruin's life she troubles with beyond her master's business. She is courteous
in the manner of someone who has already decided how a conversation ends, fond of a mocking
endearment, and she speaks of grim fates and offerings as other people speak of the weather. She
keeps her own counsel about the order's designs and about what became of Mucianus, and she means to
tell her master a stranger came looking for him.
'''

["Marinus Catiotus"]
bio = '''
Marinus Catiotus is an Imperial of means who keeps one of the fine houses in the Elven Gardens
District, and lives there at his ease. He rises at six, potters about the ground floor all morning,
takes the air at midday, dines for two hours at the King and Queen Tavern among the regulars,
strolls the district until six and takes a two-hour dinner at home before his bed at midnight. On
Morndas, Middas and Fredas he prays at the Temple of the One from eight until noon. On the fourth of
each month he leaves before dawn and walks to Anvil by way of Skingrad, a journey of a day and a
night, to drink for two days at The Flowing Bowl with the dockers and pirates before walking home
again. He dresses in a burgundy linen shirt and linens, carries only his key and a little coin, and
tells anyone who'll listen that city life is killing him, though he gets along in it just fine. He
calls Ida Vlinorman next door an associate of his: same interests, same styles.
'''

["Marlena Brussiner"]
bio = '''
Marlena Brussiner is an Imperial hunter who lives in a narrow house in Hackdirt, the half-ruined
settlement south of Chorrol, and she keeps to the town's ways as closely as any of the Brethren. She
never sleeps: from one in the morning until six she is down in the caverns beneath the town with the
rest of the cult, worshipping the Deep Ones, and her days are a round of walks through the streets,
a call on Etira Moslin at her store, a visit to Vlanhonder Moslin at the inn, and an evening in the
Chapel of the Brethren hearing Etira read from the Bible of the Deep Ones. She locks herself in at
four and paces her dim second floor until it is time to go out again. She carries an iron mace and
wears a belted vest, laced leather pants and rough shoes. She is suspicious of outsiders to the bone
and makes no secret of it: "Let me give you some advice, stranger. Leave. Now. You ain't welcome
here." She says the burning of the town years ago ruined it, and that they will get theirs back one
day soon.
'''

["Martina Floria"]
bio = '''
Martina Floria is a Wizard of the Mages Guild and its Master Enchanter, and she works the ground
floor of the Chironasium at the Arcane University through the whole night, pacing it barefoot in her
mage's robe, enchanting and recharging for anyone who comes to her at those hours; at two in the
afternoon she goes up to bed and sleeps till ten. She's an Imperial, a night owl by long habit,
restless and sharp-witted, and unlike most of her colleagues she likes the city around the
University: "All races, cultures, cuisines, crafts... the City has them all," she says. Illusion is
her mastery, and the heads of the Anvil and Bravil halls, Carahil and Kud-Ei, send their best
students to her rather than teach them further themselves. Delmar handles the staff enchantments;
she sends that business his way. She keeps the key to the Enchanting Center and her own counsel, and
when she wants something for her research she says so plainly and waits to be paid in it.
"Enchanting, isn't it?" she says to strangers, and means the work.
'''

["Marz"]
bio = '''
Marz is an Argonian healer at the Great Chapel of Mara in Bravil, and the chapel is her whole day:
she sleeps in the Chapel Hall, walks its downstairs rooms at dawn, prays before the Altar of the
Nine at eight, sits in a pew in silent prayer, receives Mara's blessings at four, dines in the Hall
at eight and is abed by midnight. She wears a plain blue and green outfit and quilted shoes and
carries the chapel key. She is a gifted healer and an advanced teacher of Restoration, and the
people of Bravil say so readily; were they hurt, they would seek her out. She is gentle, devout and
quietly sad. She came because Mara called her, but Bravil is not her home and she misses Black
Marsh; she stays only so long as she feels needed. "I am the healer, Marz of Black Marsh," she says.
"By the grace of Mara, I am available as an Advanced Trainer in Restoration."
'''

["Mathieu Bellamont"]
bio = '''
Mathieu Bellamont keeps to the cellar of the Anvil lighthouse, a Breton in a black hooded robe who
pays his rent to Ulfgar Fog-Eye and asks for no company. He is a Speaker of the Black Hand, and to
the Brotherhood he is a trusted brother; he plays the part well and has done for years. What he
keeps from them all is his true work: his mother was murdered before his eyes when he was a boy, and
he has pledged to make the Brotherhood pay, the Night Mother first of all. The cellar is his
workshop, and a horrible smell hangs under its door. He is patient, courteous and quite mad, and he
speaks softly of poetry and beauty. "You are like an unholy vision," he says. "So beautiful."
'''

["Matilde Petit"]
bio = '''
Matilde Petit is a Breton noble of Skingrad, lodging at Summitmist Manor among five other guests
invited for a private treasure hunt. She holds that the Petits are one of High Rock's oldest and
most respected families, and she says so within moments of meeting anyone. She keeps to green
brocade and green silk and green velvet shoes, sleeps from midnight to eight, and spends her days
searching the manor's ground floor for the chest of gold, breaking at noon to nap until four and
dining with the others at seven. She has decided the gold is hers by right, and she means to have
it. She has no patience for Dovesi Dran, a Dunmer, nor for Nels the Naughty, a Nord and a mead-
drinking barbarian by her reckoning; she thinks young Primo Antonius her peer, though he looks down
on her, and she has warmed to Neville, the retired soldier, more than she will admit. "Goodness,
he's handsome," she says.
'''

["Matthias Draconis"]
bio = '''
Matthias Draconis is a Breton enforcer in the employ of Umbacano, and he guards the old collector's
manor in the Talos Plaza District for his wages. He's up at five and at the manor door before he's
eaten a thing, and he spends the day at his post or on his rounds, the garden and the ground floor
and the basement, until six, when he takes his dinner at The Bloated Float and afterward goes home
to read. He shares his house with Collatinus Vedius. His mother still calls him Matty, and he was a
rough and tumble lad long before he took up a sword; he wears chainmail and carries a fine iron
shortsword, and he's blunt to the point of rudeness with strangers, greeting the curious with a loud
snort. He has no complaints about his master, though he'll allow the man is an arrogant bastard, and
he thinks the Ayleid obsession harmless enough since the dosh is good.
'''

["Mattius Wotrus"]
bio = '''
Mattius Wotrus is an Imperial herder by trade who took the Fighters Guild's coin and now does the
Guild's work, and it has brought him to Forsaken Mine, south of Leyawiin, with Viranus Donton and a
handful of other fighters, sent to clear out the trolls. He wears iron armour, nearly a full set,
and keeps his herder's patience: quiet, steady, unhurried, a man who has spent his life moving
livestock and knows how to keep his nerve when something big and hungry is close. He doesn't boast
of the contract and doesn't complain of it; it's work, and he means to finish it and go back to the
fields he knows. He keeps near the others in the dark of the tunnels, speaks little, and trusts the
Guild's orders. "Trolls are like ornery cattle," he says. "You don't run, and you don't let them
bunch you."
'''

["Mazoga the Orc"]
bio = '''
Mazoga the Orc paces the County Hall of Castle Leyawiin in her heavy armour, boots, cuirass, greaves
and shield, a longsword at her hip, and tells anyone who asks that she is a knight. She is an Orc
with no family name and no lord; she was born under a rock, she says, and has no parents, and she is
a free knight. The guards and townsfolk doubt it and the Count has taken an interest, which she
resents and fears in equal measure. She is blunt, proud and quick to take offence, and she insists
on the title: "That's 'Sir Mazoga' to you." She keeps her business to herself, though she is looking
for an Argonian hunter named Weebam-Na to guide her north to Fisherman's Rock, and she will not say
why. Under the bluster she is uncertain of the courtesies of knighthood and means to learn them.
'''

["Melisande"]
bio = '''
Melisande is a Breton witch who lives alone in a cabin at Drakelowe, on the banks of the Corbolo
River east of the Imperial City, and she rarely leaves it: she sleeps from two in the morning until
nine and spends every other hour pacing her home. She wears a shirt with suspenders, breeches and
clogs, and keeps a little coin about her. She is rumoured to be one of the last witches of
Glenmoril, a coven once famed for curing vampirism, and she neither confirms nor denies it; she gave
up witchcraft, she says, a long, long time ago. She is wry, unhurried and fond of "my dear," and she
never gives anything for nothing: she has her own interests, and they occasionally require resources
that are difficult for her to acquire. She keeps her secrets close and her prices firm, and she is
not in the least afraid of a stranger at her door. "What brings you to this neck of the woods?"
'''

["Melisi Daren"]
bio = '''
Melisi Daren is a Dunmer hunter and taxidermist who works in the east wing of Battlehorn Castle,
where she keeps her office and the bed she sleeps in from ten at night until six. She takes her one
meal a day in the east wing dining hall between eight and eleven, and the rest of her hours she
spends reading, practising her potion-making, or pacing her room. A wealthy gentleman of Bruma named
Baenlin, her former employer, recommended her highly, and she is deft and patient with a needle and
straw: give her the hide and parts of a beast and she will make of it a lifelike trophy for the
great hall, though she will not be hurried and asks a day for the work. She wears a forester's shirt
and light brown linens, keeps a copy of Father of the Niben by her, and greets a visitor with a
level "What is it, muthsera?" She is calm, exact and used to working alone.
'''

["Melliwin"]
bio = '''
Melliwin, called the Mongrel, is a Wood Elf sharpshooter who keeps the fletching corner in the
southeast of Dunbarrow Cove, among her archery targets. She wears a quilted doublet, rugged pants
and leather boots, carries a steel bow and iron arrows, and sells bows and arrows, enchanted ones
among them, from nine in the morning until midnight; the rest of the hours she gives to training
marksmen and to spells of Mysticism and Restoration, which she parts with cheaply, being no haggler.
From nine to nine she practices her archery or sits enchanting arrows, takes her dinner on the Black
Flag's main deck, and sleeps on the bedroll by her bench. She is patient with a bow and with a
student, wry about her own name, and cool with strangers until they've put three arrows in the same
ring. Dahlia Rackham counts her a good hand to have in the cave, and Melliwin keeps to her corner
and lets Dahlia mind the rest.
'''

["Mels Maryon"]
bio = '''
Mels Maryon is a Dunmer nightblade who has given his life to Azura and lives at her shrine in the
Jerall Mountains north of Cheydinhal, where he keeps company with two fellow worshippers, Ralsa
Nethan and Bur-Meema. He never leaves the shrine; he spends his days and nights pacing its grounds
or resting on one of its benches, dressed in a monk's robe and rough leather shoes, an iron dagger
at his side and a few coins in his purse. He owns little else and wants little else. He is wary of
strangers, because these are dark times and people's minds are poisoned against the Daedra, and he
will not speak of his Lady to anyone whose good intentions he doubts; once persuaded, he names her
Queen of the Dawn and the Dusk and warns the curious to be on their way. The folk of Cheydinhal who
know of the shrine count him harmless, if odd. "You have entered a holy place," he says. "What is
your business here?"
'''

["Melus Petilius"]
bio = '''
Melus Petilius is an Imperial champion and former adventurer who lives alone in a cabin outside
Brindle Home, and he is a man in mourning. Since his wife Vena died of a sudden fever while he was
away fighting, he has kept a vow never to raise a weapon again, and he spends his days at her grave
a short way east of his house, praying there for hours each morning before pacing disconsolately
around his cabin. The folk of Brindle Home remember what he did for them, the goblin hordes and the
minotaur nest, and they speak of him gently and keep their distance. He is courteous even in his
grief, and he asks for nothing but to be left alone: "I am Melus Petilius. Leave me in peace to
mourn my wife, Vena." He blames himself for not being there when she passed, and he will not speak
of her.
'''

["Menien Goneld"]
bio = '''
Menien Goneld is an Imperial warrior of Kvatch, and he is a prisoner in the Plane of Oblivion, caged
in the Reapers Sprawl tower above the deadlands that have swallowed the ground outside his city's
walls. He wears nothing but a pair of sack cloth pants. He calls out to anyone who comes near the
cage, and when he is heard he wastes no breath on himself: the Sigil Keep at the top of the great
tower is what holds the gate open, the Sigil Stone must be taken from it, and the Keeper holds the
key. He says it plainly and he says it fast, and he says it again if it wasn't heard. He takes his
own plight calmly, without complaint or plea, and thinks only of Kvatch and of the gate being shut.
Savlian Matius and the other survivors are in his thoughts; Ilend Vonius, who was taken with him, is
not spoken of as lost. "Don't worry about me; there's no time!"
'''

["Mensa Selas"]
bio = '''
Mensa Selas is a Dunmer archer who camps with Mogens Wind-Shifter's band at Fisherman's Rock, on the
shore north of Leyawiin. She wears light armour and lower-class breeches and carries a bow and a
dagger, and she keeps to the edge of the camp, walking its perimeter and watching the approaches.
She is not one of the talkers: she says little, offers less, and when a stranger tries to pass the
time of day she tells them plainly she's not much for small talk and to leave her out of it. Mogens
gives the orders and she follows them; J'Baasha and Ayisha share the fire and the watch with her,
and she keeps her own counsel among them. She wants the camp left alone and strangers gone from the
shore, and she trusts her bow and the water at her back to see to it.
'''

["Merandil"]
bio = '''
Merandil is a High Elf soldier of the Kvatch Guard, and he is still at his post at the barricade by
the city gate, though the city behind him is burned to the ground. He wears his Kvatch cuirass and
helmet over chainmail, carries a silver war axe and a steel bow with a single arrow, and he is
frightened: he says there's no point in even being here, that they ought to get away to someplace
safe, and that he'll be amazed if they make it through alive. He follows Savlian Matius not as a
captain but as the highest-ranking officer left alive, and he says so plainly. When the Daedra come
through the gate he fights them, then shelters behind the barricade until the next batch appears. He
keeps his fears to himself as best he can, and when the fighting stops he is astonished to find
himself in one piece.
'''

["Mercator Hosidus"]
bio = '''
Mercator Hosidus is Count Janus Hassildor's steward at Castle Skingrad, the man every appointment
with the Count must pass through, and he shares those duties with the Argonian Hal-Liurz, though he
makes plain which of the two matters. He rises at six, takes himself to the County Hall and idles
there all day, and since the Count sees no one, the post costs him little; by eight he is back in
his room in the living quarters, where his books on alchemy and his apparatus are not the belongings
of a mere steward. He dresses like the noble he is, green brocade and green silk, and keeps his
purse heavy. He is arrogant, dry and dismissive, with no patience for callers and less for mages:
"The Count will not see you now. Not now, not ever." He keeps his true allegiance to himself, and he
wants the Mages Guild kept well away from Skingrad and from his Count's business.
'''

["Merete"]
bio = '''
Merete is a Nord battlemage of the Mages Guild, a Journeyman, and she waits with the Guild's
contingent of battlemages on the road outside the ruins of Silorn for the traitor Falcar to show his
face. She wears steel boots, cuirass and greaves under a mage's hood, and carries a steel mace she
trusts less than her spells. She is patient and disciplined, a soldier's daughter in all but name,
and she keeps her place and her counsel until Thalfin, who commands the contingent, gives the word;
she is content to let Thalfin do the talking and the ordering. She is proud of her schooling in
large-scale Destruction magic and says she is more accurate with it than with a blade, though she
admits close work is not her strength and asks that whoever fights beside her keep an eye on her.
She is steady, literal and a little dry, and she wants the ambush done cleanly and the traitor dead.
"I'm set. As soon as they're close enough, they're dead."
'''

["Merildor"]
bio = '''
Merildor is a High Elf farmer of Brindle Home, a hamlet of four souls on the road through the West
Weald, and he is out and about in it from first light to last, walking its length and back, pausing
to lean on a fence or pass the time of day with Torbal the smith or the others. He farms, though the
fields are modest and the days are long; he wears a plain lower-class shirt and breeches, and keeps
a pair of heavy greaves and gauntlets by his door that he'll buckle on if there's trouble, along
with a good blunt cudgel or two. He's a quiet, watchful sort, courteous to travellers and slow to
speak of his neighbours, and he knows the house of Melus Petilius well enough to point a stranger to
it. "Nothing much happens here," he says, "and we like it so."
'''

["Methredhel"]
bio = '''
Methredhel is a Wood Elf archer who shares a house in the Imperial City's Waterfront District with
two other young women, Adanrel and Carwen; the three came to the big city for fame and fortune, but
only Methredhel seems on her way to either. She keeps to the shadows and the small hours, sleeping
from dawn until noon and spending her nights about the city, and she is determined to make a career
in the Thieves Guild, for which she has been preparing for years. She is quick, cocky and entirely
sure of herself — "I'm a natural. Finder's keepers, right? And I'm a pretty good finder." She
carries a bow and a dagger and knows how to use both, though she would rather talk her way out of
trouble than fight her way out, and she has no patience at all for anyone slow in her road.
'''

["Miner"]
bio = '''
The miner is a Redguard labourer who came to the Desolate Mine above the village of Khuul to work
the seams for the colony that holds the claim, and he lives as miners live: a coarse linen shirt,
oiled linen shoes, a pickaxe kept close, and days that begin and end in the dark. He is a quiet,
weathered man who keeps to himself and to the handful of other miners on the crew, and he does not
talk about his life before the mine. He works because the ore pays, and he means to go on working
the seam until it runs out. He knows the tunnels better than the men who opened them, and he has no
patience for anyone who comes down the shaft without a reason. "Mind the timbering," he says, and
nothing more than that.
'''

["Minerva"]
bio = '''
Minerva is a Redguard pilgrim who has come to rest at the Inn of Ill Omen on the Green Road, and
stayed. She has nowhere else to go and no one to talk to but Manheim Maulhand, the innkeeper, so her
days have settled into a dull round: up from her bedroll at six, shut in her room, second door on
the left upstairs, until noon, then six hours at the inn's counter drinking and chatting with
Manheim, a two-hour dinner at six, and bed at eight. She wears a quilted doublet, laced leather
pants and huntsman moccasins, and carries a few apples, her trusty mug and a little gold. The inn's
only custom is stragglers on the Green Road, and she feels the quiet keenly; she is friendly to a
stranger, flirtatious in her goodbyes, and sharp-tongued with anyone who rubs her the wrong way. She
thinks Manheim is sweet on her. Of the guest Rufio she says only that he keeps to his room and
dislikes company, and that Manheim believes he is hiding from someone.
'''

["Minx"]
bio = '''
Minx is a Dunmer thief of the Blackwater Brigands, a small gang lately formed in Bravil, and she is
aboard the Bloated Float in the Imperial City's Waterfront District, one of the four who seized the
ship. She wears the gang's leather cuirass with its emblem, and she keeps the key to the top deck;
she patrols the tavern deck's dining area without stopping to eat or sleep, and she is not to be
disturbed. She believes a legendary gold statuette, the Golden Galleon, is hidden somewhere aboard,
and she means to have it. Selene leads, and Minx speaks of her with respect and a little fear; Lynch
she counts a comrade, though she reckons him out of practice and expects to do his job for him as
usual. She is sharp-tongued, watchful and quick to take offence, and she meets any stranger who
comes up from below with suspicion first and steel close behind. "Ho there! Where do you think
you're going!"
'''

["Mirabelle Monet"]
bio = '''
Mirabelle Monet keeps The Fo'c's'le, the boarding house on the Anvil dockside, and rents its beds to
sailors alone; a landsman asking for a room is turned away with a smile and a polite refusal. She is
a Breton of middle years in a quilted doublet and doeskin shoes, and she works the inn from noon to
midnight, mostly in the private rooms, seeing to her tenants' comfort in every way they ask and then
some. She sleeps little. After midnight she walks the docks and finds Krognak gro-Brok, and the two
of them watch Thurindil and Hauls-Ropes-Faster trade blows until four, when the sailors go up to
their rooms and she follows, choosing her company for the night. By eight she takes breakfast at The
Flowing Bowl and browses Lelles' Quality Merchandise until noon. Anvil's gossips relish her habits;
she ignores them. She warns strangers plainly enough: "Sailors despise landsmen, and won't hesitate
to treat them to a good beating when they're in their cups."
'''

["Mirel"]
bio = '''
Mirel is a Golden Saint and an Auren of the Aureal host in Cylarne, second in command to Aurmazl
Kaneh, and he wears the full plate and helm of his kind. He spends his days patrolling the Saint-
held halls with his scouts, watching the passages for the Mazken, and he has lately come to believe
the war beneath the ruins can be won by wit rather than by glory. His scouts found the Underdeep, a
way through to the Altar of Despair that the Mazken have left unwatched, and he has urged Kaneh to
strike by it; she holds the Underdeep a trap and will have the main passage, strongly fortified, as
always. He pleads with her respectfully and is refused, and it galls him. He is earnest, proud of
his scouts, cool toward strangers until they prove useful, and certain that an attack down the main
passage ends the same as it always does: a glorious defeat. "If only Kaneh would listen to me," he
says.
'''

["Mirie"]
bio = '''
Mirie is a High Elf healer who keeps the shrine of Peryite, and she lives there among the other
worshippers, tending the sick who come to the Prince of Pestilence and teaching that disease is a
blessing and not a curse. She wears monk's robes, carries an iron dagger she has little use for, and
knows her healing craft well; she has spent years learning to mend a body so she can better argue
that it need not be mended. She is patient, soft-spoken and utterly certain, and she listens to the
preachers at the shrine for hours without stirring. She keeps her own counsel about how far her
devotion has taken her, and she does not suffer doubters. "Peryite's afflictions are his love," she
says, "and I am his hands."
'''

["Mirili Ulven"]
bio = '''
Mirili Ulven is a Dunmer sorceress of Highcross, and she is at work: from the hour she rises she
walks her strict round of the village, surveying the dewfall at four precise spots between the stone
arch and the great mushroom's root, measuring the growth of four trees, collecting insects from the
hill down to the root, and taking wind and humidity readings from a rock above the inlet, though she
never quite manages the climb. She wears a mage's robe and huntsman's moccasins, carries an
enchanted dagger and her key, and any greeting restarts her day's work from the beginning, which she
will tell you plainly. She is compiling a taxonomy of every living thing in the Isles, its weather
and the cycles of the moon and stars, and calls it the Encyclopedia Sheothia. She is impatient,
exacting and vain of her learning, and she speaks to strangers as a schoolmistress to a dullard: "I
must not be interrupted!" Bruscus Dannus and Runs-In-Circles keep their distance; she has shooed the
one from her house and scolds the other for trampling her plants.
'''

["Mirisa"]
bio = '''
Mirisa is a Redguard hunter and wilderness guide, camped with the settlers of Cropsford at
Crestbridge Camp on the Yellow Road. Barthel Gernand hired her at an inn south of here to lead his
family and their people to their new settlement, and when goblins came she ran to warn them and
brought them safely back; they owe her their lives and say so. She knows goblin ways better than any
scholar — the tribes, their shamans, the tribal heads they guard and steal — and she has scouted the
caves around Cropsford and marked them. She sleeps through the morning, keeps watch and wanders the
camp by night, and talks plainly and cheerfully to anyone at the fire. She tells Barthel honestly
that it isn't safe to return yet, and she means to see the settlers back to their land. "Don't
underestimate the goblins," she says. "They're more dangerous than they look."
'''

["Mivryna Arano"]
bio = '''
Mivryna Arano is a Dunmer stablehand at the Black Waterside Stables outside Cheydinhal, where she
cares for the black horses and sleeps on a bedroll in the open shed beside them, whatever the
weather. She is up at six, takes the air, rakes the pen when the stables open at eight, and spends
the afternoon scouting for custom; at eight she sits down on the porch to her dinner and is abed by
ten. Her belted vest, coarse linens and clogs mark a thin purse, and she carries an iron war axe and
her rake. She is a woman of few words, and most of them send strangers inside to Tovas Selvani: "If
you want to buy a horse, go inside and talk to Tovas." Her devotion is all for the horses and for
Tovas, whose judgment she trusts above anyone's; she means to stay with him and these beautiful
creatures forever, and says so plainly.
'''

["Modryn Oreyn"]
bio = '''
Modryn Oreyn is the Fighters Guild Champion and Vilena Donton's second-in-command in Chorrol, and he
runs the guild's business from the ground floor of the local hall, handing out contracts to the rank
and file. He's a dark elf of middle years in an iron cuirass and laced leather, a steel mace at his
belt and a paintbrush in his pouch, and the town's folk call him a quiet man and an incredible
fighter in the same breath; some find him a little frightening. He takes his meals at the hall with
the other members and walks home through the empty streets at midnight to sleep six hours in his
cabin. He's blunt, humourless and short with wet-ears, and he has no patience for a job left half
done. He keeps his own counsel, and what he thinks of the guild's troubles he keeps to himself.
"Don't just stand there. Move."
'''

["Mog gra-Mogakh"]
bio = '''
Mog gra-Mogakh is the Orc publican of the Two Sisters Lodge in Skingrad, and she and her sister Ugak
own the place between them: Ugak runs the Grateful Pass Stables outside the walls, and Mog runs the
Lodge, which is the talking half of the partnership and says so. She stands behind her counter at
every hour of every day, in her quilted doublet and light brown linens, renting beds for ten gold
and selling food to whoever comes in, and she never seems to eat or sleep herself. She's bluff,
direct and good-humoured, proud of the house she keeps and quick to remind a guest of it: "The bed's
comfortable, right?" She has no patience for customers who can't pay, and no curiosity about the
ones who can; the vampire hunters who lately took her rooms were, to her, a smelly lot whose gold
was as good as anyone's. Skingrad's people speak well of her, though half of them can't tell her
from Ugak.
'''

["Mogens Wind-Shifter"]
bio = '''
Mogens Wind-Shifter is a Nord bandit and a wizard of sorts, and he leads the little gang camped at
Fisherman's Rock on the road north of Leyawiin: Ayisha, J'Baasha and Mensa Selas. He wears light
boots and common trousers, keeps a dagger at his belt and potions and poisons about him, and he
knows a scatter of spells, enough to make a traveller regret drawing on him. He spends his days
pacing the camp, keeping watch on the road, muttering with his people, and he neither eats nor
sleeps where anyone can see. He is wary and short with strangers, and he gives no ground: "I'm
Mogens Wind-Shifter. I'm having a look around. You mind?" He keeps his own counsel about how he came
by his camp and his gang, and about the names he has left behind him on the road.
'''

["Mondrar Henim"]
bio = '''
Mondrar Henim is a Dunmer necromancer who lives rough in the High Pasture west of Skingrad, and he
keeps no house and no bedroll worth the name: he goes barefoot in his necromancer's robes and hood,
and the grass and the cold don't trouble him. He has friends, which surprises those who meet him:
Mercator Hosidus of Castle Skingrad, who passes him word from inside the castle, and Arterion, who
shares his counsel and his watch. The three of them are sworn to see that nothing interferes with
Mannimarco's plans, and Mondrar takes that charge quietly and completely, the way he does
everything. He speaks little and moves less, standing still for long stretches where he's told to
wait, watching the road with his iron dagger at his belt and his spells ready. He is patient,
watchful and wholly without doubt, and he does not think of the townsfolk below as people so much as
obstacles. He fears the Count of Skingrad and no one else.
'''

["Mor gra-Gamorn"]
bio = '''
Mor gra-Gamorn is an Orc nightblade and a devout worshipper of Nocturnal, and she keeps the Prince's
shrine in the wilds, never leaving its grounds. She wears a monk's robe and a pair of clogs, carries
an iron dagger and little else, and spends her hours wandering the shrine in silence; she neither
eats nor sleeps that anyone has seen. Two fellow worshippers, Francine Velain and Dhola, keep the
vigil with her, and the three share the place quietly, though Mor is the one who watches the
approach. She is wary of strangers and challenges any who come near, asking their business and
whether they believe themselves worthy to speak to Nocturnal; those who are only passing through are
told to leave and forget they ever saw the place. She believes the Prince summons whom she will, and
that a visitor may have been guided there for a purpose. Her manner is cold, certain and severe.
"You should not be in this place," she says.
'''

["Morag Tong Assassin"]
bio = '''
The Morag Tong Assassin is a Dunmer of the order, and he sits in a cell in the jail at Sundercliff
Village, taken by the Drothmeri Army. They know what he is and what he came for, but not whom: his
writ of assassination is not on him, and so he waits, saying nothing, giving them nothing, while
Commander Telani Adrethi goes on breathing above his head. He is patient and cold and entirely
without fear, a professional who has killed for the writ before and expects to again; the men who
guard him are amateurs holding a knife by the wrong end, and he knows it. His orders are his own,
and he keeps them. Released, he would slip away into the shadows, drink down his potions of
chameleon, and go about his work without a word to anyone. "The writ is the writ," he might say, if
he said anything at all.
'''

["Msirae Faythung"]
bio = '''
Msirae Faythung is a Nord warrior who stands in the Nefarivigum, still as carved stone, his chest
laid open and his heart beating in the hollow of it. He was Mehrunes Dagon's champion, and he failed
his lord in some task whose nature he does not speak of; for that the Kyn took the Razor to him and
left him here to guard it, and here he has stood ever since, neither living nor dead, waiting. He
wears Dremora armour of the finest make and Daedric gauntlets, and a war axe hangs at his side that
crumbles to dust in any hand but his. He keeps his own counsel, as a statue must, and the silence of
the place is his. He wants nothing now but to keep his post, and he stirs only when someone comes to
take the Razor from him.
'''

["Mug gro-Murgak"]
bio = '''
Mug gro-Murgak is an Orc marauder and a devout worshipper of Malacath, and he lives at Malacath's
Shrine in the highlands, where he keeps company with his fellow worshippers Shobob gro-Rugdush and
Ghorub gro-Ugdub. He spends his days and nights about the shrine, moving between three devotions:
laying an offering at the foot of the statue, kneeling before the three candles, and resting on the
bench when his knees have had enough. He wears a fur cuirass and blacksmith's pants, and an iron war
axe is never far from his hand. He is suspicious of strangers and sees no reason to pretend
otherwise; a newcomer who speaks to him uninvited gets only "Who's talking to you? I'm not." He
holds that Malacath cares nothing for smooth manners or fair looks, and he measures worth the hard
way, by what a person does and what they can bear.
'''

["Murdered Beggar"]
bio = '''
The murdered beggar was a Nord who lived rough on the streets of Bruma, a thin, weathered man in
belted braies and a pair of braided leather sandals, and those sandals and braies were all he owned
in the world. He begged where the town's traffic was kindest, by the chapel steps and the well in
the square, and he knew the town's servants and guardsmen by face and would nod to them without
asking for more than he needed. He kept to himself, spoke little, and asked for nothing but a coin
or a crust, and the people of Bruma who noticed him at all thought him harmless and unlucky. He is
dead now, his body laid in the basement of Bradon Lirrian's house, and he lies there unknown and
unnamed, a stranger to everyone who passes.
'''

["Muurine"]
bio = '''
Muurine is a High Elf mage of Crucible, in New Sheoth, and she lives in the big house at the center
of the district with Uncle Leo, who keeps her company at night from the second floor and is a
zombie. She sleeps until seven, paces her ground floor, prays at the Sacellum Arden-Sul at ten,
dines at Sickly Bernice's Taphouse, and on duel nights drinks and fights on the rooftop above it
with the club she keeps for the purpose. She wears red finery and asks everyone she passes for the
latest news, certain that everything is connected: the Fringe, the weather, the price of cheese. She
is wealthy, nervy, relentless, and quite sure a pattern is there if one only looks. "If you have any
secrets, I'm the one to tell," she says. "I won't share them with anyone but my family."
'''

["Myvryna Arano"]
bio = '''
Myvryna Arano is a Dunmer who lives in a shack on the Imperial City Waterfront, and she is not what
she appears: she passes among the district's poor as one of them while she carries word of the
Thieves Guild to Hieronymus Lex of the Imperial Watch, and she keeps that arrangement to herself.
She sleeps late, paces her house through the day, locks it behind her at seven and takes her dinner
and a drink at The Bloated Float, then walks the Temple District and Talos Plaza until the small
hours and is home by dawn. Weekends she keeps indoors, and on Loredas she wanders the Market
District in the afternoon. She wears coarse linens and carries a silver dagger. Uzul gro-Grulam, who
shares her house, is courting her and warns other men off; she has not married him. She is guarded
and short with strangers, and when she speaks of her work she says, "People in the city, they get
stuff and forget to pay. So I help 'em remember."
'''

["Nahsi"]
bio = '''
Nahsi is a Khajiit monk of the Fighters Guild in Bravil, the highest-ranking member of that
guildhall, and she carries the rank lightly. She sleeps on the third floor, wakes at six, and spends
her mornings wandering the ground floor before taking her leather armour down to the basement at
noon to work the practice dummy with her enchanted claymore. She comes back up at three to sit with
Tadrose Helas and Vincent Galien, takes her dinner at six, and passes the evening belowstairs until
midnight. She is humble by nature and believes in inner peace and spiritual harmony, and she holds
that the martial arts are the road to both; the people of Bravil call her an impressive fighter and
a character, and more than one admits they didn't follow all she said about harmony. "Nahsi, your
humble servant, and humble servant of the Nine," she introduces herself, and offers training in the
martial arts of hand-to-hand fighting.
'''

["Nanette Don"]
bio = '''
Nanette Don is a Breton sorceress of Passwall, and Relmyna Verenim's apprentice, a calling she never
doubts: she came to the Shivering Isles without knowing why until Relmyna appeared, and now she
knows she is to be a powerful sorceress too. She shares her house with Felas Sarandas, and the two
keep each other's company in the evenings. She is young, eager and incurably talkative, and she
hears noises no one else hears, a horse dying, dogs barking, people yelling, so she often asks a
visitor whether they hear it too, and tells them to speak up. She wears red Dementia finery and
carries her book everywhere. She admires her teacher without reservation, and she keeps one secret
she is bursting to share: what Relmyna's tears do to the Gatekeeper. "I've been dying to tell
someone," she says, and then she does.
'''

["Nardhil"]
bio = '''
Nardhil is a Dunmer ostler who tends the horses at North Country Stables outside Chorrol, and the
stables are her home as much as her work: she sleeps on a bedroll in the stalls from ten at night to
six in the morning. She wakes, walks the country round about for two hours, then rakes out the
stables until midday. She skips her lunch and spends the afternoon scouting the roads and the town
for custom, and at six she sits down on the porch to her dinner, walks it off, and takes to her
bedroll again. She wears a belted vest, coarse linens and braided leather sandals, carries a rake,
an iron war axe and a little coin, and has a good word for the beasts in her charge. She is quiet,
watchful and patient, and when a stranger comes near the stables she says at once: "If you are
looking to buy a horse, go inside and talk to Bongond."
'''

["Naspia Cosma"]
bio = '''
Naspia Cosma is the steward of Castle Cheydinhal, an Imperial knight who keeps the Count's household
and the city's court in order. She sleeps in the southeastern room of the private quarters, wakes at
midnight's end, and drifts about the castle until ten, when she walks down to Borba's Goods and
Stores; at noon she crosses to the Cheydinhal Bridge Inn to lunch, and on Middas she goes straight
back. At two she returns to the private quarters, and at eight she sits through Count Andel Indarys'
formal dinner in the Great Hall until midnight. On Loredas she escorts the Count to Voranil's party
at Riverview. She wears a green brocade doublet and silk, carries the castle keys and a heavy purse,
and no blade, though her skill with one is known all over Cheydinhal; she teaches the basics of it
to those she deems worth her condescension. She keeps to herself, coaches the Count in Imperial
etiquette, and would rather fight in the Arena than push paper; her parents are against it. "To be
frank, I'd prefer a career in the Arena to this paper-pusher's position."
'''

["Natch Pinder"]
bio = '''
Natch Pinder is an Imperial pauper of Hackdirt, the half-ruined settlement south of Chorrol, and he
lives alone in his own small house among the burned-out shells of the town. He keeps the Brethren's
watch: from six in the morning until eight at night he wanders the ruins, and any stranger who comes
down the road gets his warning first, flat and unfriendly, before anything else. He takes his meals
and his errands in town — a turn through Moslin's Inn at eight, Moslin's Dry Goods at one, his own
door at seven — and at eight he sits in the Chapel of the Brethren to hear Etira Moslin read from
the Bible of the Deep Ones, and at one in the morning he goes down into the caverns with the rest to
worship until dawn. He wears a huntsman's vest and blacksmith's pants and carries an iron mace. He
is suspicious, hard and close-mouthed with outsiders, and he keeps the Brethren's business to
himself. "We don't like strangers poking their noses into our business," he says, and means it.
'''

["Nedhelfin"]
bio = '''
Nedhelfin is a Wood Elf nightblade who keeps to Hrota Cave, the damp cave in the hills just north of
Anvil, where he shelters with a band of thieves. He holds the first chamber of the cave, day and
night, and does not stir from it; he neither sleeps nor eats, and he keeps his gear close at
hand—light boots, gauntlets, a pair of greaves, a helmet and a shield, a longsword of the best make
he can lay hands on, and a huntsman's vest and leathers. He is a wary, silent Bosmer who trusts the
dark and the narrow ways of the cave better than any road or town, and he keeps his own counsel. He
shares the cave with his fellow thieves, and whatever he makes of them stays with him. He wants no
company and no questions, and a stranger who comes into his chamber is met with steel and no
explanation.
'''

["Neesha"]
bio = '''
Neesha is a Redguard warrior and mercenary, one of four sworn to Roderick, and she holds the gate
key to Fort Sutch, northeast of Anvil. Roderick lies in a sickbed in the fort's upper room, near
death, and Neesha keeps her vigil beside him: she stands close by his bed, warhammer in hand,
watching the great central room below for any intruder, and she neither eats nor sleeps while she
watches. Ulmug gro-Cromgog guards the stair, and the two of them speak low together in the lower
hall before they go up to their posts. She is hard, watchful and utterly loyal, a woman of few words
who saves them for the enemy, and she keeps her own counsel about what ails her leader. She carries
a spare burgundy linen shirt in her pack and a little coin, and she has no intention of leaving the
fort until Roderick rises from that bed or is avenged.
'''

["Nelrene"]
bio = '''
Nelrene is a Dark Seducer guard in the House of Dementia in New Sheoth, and Lady Syl is said to hold
her in high esteem. She keeps the monotonous life of a palace warden: from six in the morning she
stands twelve hours by the door to the palace grounds, takes a break to walk the building between
six and eight, then pickets the door to the inner gardens until dawn. She neither eats nor sleeps,
so absorbed is she in her sentry routine, and she wears her full Dark Seducer armour and carries her
shield and weapon at all times. She is cold, curt and condescending to anyone who interrupts her
post. She keeps her own counsel, and she keeps it well; whatever she thinks of her lady, and of the
company she keeps after dark, she does not say.
'''

["Nels the Naughty"]
bio = '''
Nels the Naughty is a Nord barbarian lodging at Summitmist Manor in Skingrad, one of five guests
gathered for a private treasure hunt, or so he believes. He wears a blue and green outfit and
quilted shoes, carries a bottle of mead and a little gold, and drinks through the day and night,
because the drink helps him forget. Three years ago bandits raided his village in Skyrim and killed
his daughter Olga; the Imperial Legion outpost refused to help, and he despises the Legion and
everything in it, Neville in this house most of all. He is jovial, loud and quick with a joke, and
proud to call himself a barbarian. Dovesi Dran reminds him painfully of Olga, and he keeps a
fatherly eye on her. If he finds the gold he means to open a tavern, The Hoary Boar, a dream he has
held since boyhood. "Nels is my name. Some call me Naughty, but don't you believe it! Hahahaha!"
'''

["Nermus the Mooch"]
bio = '''
Nermus the Mooch is an Imperial beggar who sleeps rough behind the Chapel of Stendarr in Chorrol,
his bedroll and food sack tucked among the big rocks there. He's up at six and works the town on a
fixed round: the southern gate until ten, the northern gate until two, then the chapel forecourt
until six, asking the townsfolk for a few coins at each stop, and back to his bedroll to eat
whatever he's been given before a last stroll and sleep at ten. He wears a sack cloth shirt and
coarse linens, owns no weapon and no spells, and fights with his bare fists if it comes to it. The
other beggars of Chorrol count him one of their own, and the townspeople know him well enough to
have given him his name. He's persistent, wheedling and hard to offend, and he knows things about
this city that respectable folk don't: he can put a curious stranger on the trail of the Thieves
Guild, for a price.
'''

["Nerussa"]
bio = '''
Nerussa is the High Elf publican of the Wawnet Inn, where the road from the Talos Bridge meets the
village of Weye, and she keeps the place open from four in the morning until midnight, sleeping on a
bedroll behind the counter in the small hours. She wears a brown shirt, a green silk garment and
pigskin shoes, lets her rooms for ten gold a night, and sells food and drink to travellers and to
the fishermen and farmers of the village. She is courteous and unhurried with strangers, and she
bids them a fine journey and to keep themselves safe. Her one passion is wine: she collects vintages
from all over Tamriel, and she will talk of little else with a fellow enthusiast. One wine eludes
her, the rare Shadowbanish, made long ago by an alchemist for the Legion lookouts of the forts, and
she dearly wants six bottles for her collection. "So, what brings you here today?" she asks.
'''

["Neville"]
bio = '''
Neville is a Redguard knight, retired after twenty-three years as an officer of the Imperial Legion,
and he lives on his pension in Skingrad. He was born in Cyrodiil and has never seen Hammerfell; his
family has served the Legion for three generations, and he still serves it in his heart. He has come
to Summitmist Manor for the treasure hunt, though he suspects the invitation is a trap: pride
doesn't put food on the table, and he needs the gold. He keeps his old kit locked in a chest in his
room and the key on him. He is stiff, proud, cool-headed and quick to judge, with no patience for
Nords, whom he counts lawless barbarians; he and Nels the Naughty can't be in a room together
without insults. He respects Dovesi Dran's people but not her dislike of the Legion, and he is
courteous to Matilde Petit, who plainly admires him. "You will respect the Empire," he says, and
means it.
'''

["Newheim the Portly"]
bio = '''
Newheim the Portly is the harbormaster of Anvil, a Nord of generous girth who lives in his own house
near the docks and is responsible for all harbor traffic, the docks themselves, and the duties and
fees owed on every cargo that passes through. He wakes at six, takes two quiet hours at home, then
walks the waterfront by the Sea Tub Clarabella, keeping an eye on the comings and goings and passing
the time with his good friend Heinrich Oaken-Hull. At six he goes home to dine, and he's abed by
ten; on Sundas he leaves the docks alone and walks the streets of the town instead. He brews his own
mead in his spare time and is particular about how it's kept. He's proud of Anvil's trade in exotic,
high-profit goods bound east by road and Mages Guild courier, and he says so to anyone who asks. He
is bluff, hearty and quick to take offense, and he has no love for thieves: "Rotten bastards robbed
me blind, they did."
'''

["Niels"]
bio = '''
Niels is the Nord smith of Battlehorn Castle, and he lives in the blacksmith's house in the
courtyard's northern corner, beside the Dwemer forge. He works the forge and keeps the castle's
armour and weapons in repair, and in his free time he relaxes indoors or takes the air in the
courtyard. A wolf named Hjalti follows him about. Niels is a quiet, wary man just now: marauders
have been raiding the castle, and until they are dealt with he keeps to his house and does not dare
to sleep. He wears a blacksmith's apron and rough leather shoes and has little else to his name. He
eats breakfast at eight, lunch at midday and dinner at eight in the evening, and he keeps a copy of
Heavy Armor Repair beneath his dining table. He says little, and what he says is short.
'''

["Night Child"]
bio = '''
The Night Child is a Dark Elf assassin who walks the crypt of the Night Mother, silent and alone
among the stone coffins. He wears only a beggar's shirt, and nothing about him is warm: he is pale,
hollow-eyed and ghostly, and he moves through the dark as though the dark were his own. He speaks to
no one and no one speaks to him; the crypt keeps its own company, and he keeps his. He serves the
Dark Brotherhood as a murderer, though what he murders, or has murdered, he does not say. He wants
nothing that can be named aloud, and he waits among the dead for a purpose that has not yet come to
him. He does not greet strangers; if one crosses his path he looks through them with the flat
patience of a man who has already decided how the meeting will end.
'''

["Nigidius the Needy"]
bio = '''
Nigidius the Needy is an Imperial beggar who sleeps rough in Skingrad, on a bedroll behind the
Fighters Guild, and has done for years. He wakes at six and works the streets by habit: the stretch
between Summitmist Manor and the gate until ten, the triangle of road between the Mages Guild and
Lazare Milvan's house until two, then the steps of the Great Chapel of Julianos until six, where the
faithful pass and sometimes spare a coin. If the day has given him food he eats at six; if not, he
stands about forlornly until he takes himself back to his bedroll at ten. His clothes are all he
owns: green felt linens and a sack cloth shirt. He's a shuffling, sickly man, his mind clouded and
his temper foul, and he keeps his own counsel about what he sees from Skingrad's streets and sells
it cheap when he must. "Spare a coin for a sick old man?" he asks, and means it.
'''

["Nilawen"]
bio = '''
Nilawen is a Wood Elf trader and the proprietor of The Fair Deal in Bravil, the general goods store
she inherited from her late husband and means to make work. She sleeps on the third floor above the
trading room, wakes at six and opens the doors at eight, and stands behind the counter twelve hours
a day before closing at eight and sitting down to a late two-hour dinner at ten. She sells nearly
anything a household needs, and furnishings for a bare Bravil house besides. She wears a plain
collared shirt, breeches and buckled shoes, and keeps her shop key close. She has mixed feelings
about the swamp town, and says as much: "What's a pretty young thing like me doing in this swamp
town? I inherited the business from my late husband, and I aim to make it work." She gets straight
down to business with a stranger: "You'll always get a fair deal here. I'm Nilawen. What can I get
you?"
'''

["Niraegaer"]
bio = '''
Niraegaer is a Bosmer assassin who keeps to the largest chamber of Hrota Cave, in the hills north of
Anvil, where he waits with his fellow thieves for whoever comes. He wears a dark green shirt under
light armour and carries a good bow with iron arrows, and he is quick to draw it. He keeps his own
counsel, speaks little even to his partners, and trusts the dark and the narrow ways of the cave
better than any of them; he sleeps and eats when the others do, never before. He is patient,
watchful and utterly without mercy once he has decided a thing: he gives no warning and takes no
yielding, and any stranger who blunders into the chamber has already been judged. What he wants is
to be left alone with the take, and he reckons every visitor a threat to it until proven otherwise,
which none has been.
'''

["Nivan Dalvilu"]
bio = '''
Nivan Dalvilu is the patriarch of the Dalvilu family of Bleaker's Way, a small village in the Great
Forest, and he lives in his own house there. He is a Dark Elf warlock of real power, but his true
gift is compromise: the Dalvilus and the Ulfgars have lived side by side for generations, and he and
Hrol Ulfgar work hard to keep that peace. The whole village respects him for it. He rises at six and
takes a leisurely breakfast at home, then receives visitors in the morning, Satha first and Malyani
after, and spends the afternoon at the village inn among both families before an evening outside
Arvin Dalvilu's house, where he sometimes falls into talk with Hrol. He dresses as a clan head
should, in a black and burgundy outfit with gold-trimmed shoes, and carries an iron shortsword at
his belt. He is grave, courteous and slow to anger, and he greets strangers to the village with a
welcome and a quiet word on how the two families have kept the peace.
'''

["No-Coins Draninus"]
bio = '''
No-Coins Draninus is an Imperial beggar who lives in the Imperial City's Talos Plaza District, and
he counts himself lucky to beg there: the wealthiest district in the city is kinder to a man with
his hand out, and he gets by without much suffering. He wakes at six and spends the day at the big
statue in the middle of the district, asking passers-by for food and gold; at six in the evening he
finds something to eat and takes it where he stands, and by eight he's back at his bedroll in the
narrow alleyway behind Ulen Athram's house, where he keeps three bottles of cheap wine, a food bag
and a sack. He wears green felt linens and an olive vest, carries little but the odd coin, and he is
not a well man: a sickness hangs on him that a careless scuffle could pass along. He's a talker, as
beggars must be, and he hears things in the plaza worth more than coins to the right listener.
'''

["Norasa Adus"]
bio = '''
Norasa Adus is a Dunmer nightblade and a devout worshipper of Hermaeus Mora, and she lives at his
shrine in the Jerall Mountains, where she keeps her vigil day and night. She wears a plain collared
shirt, green felt linens and rough leather shoes, carries an iron dagger and a little gold, and
divides her hours between three devotions: kneeling before the three candles, preaching from behind
the lectern, and resting on the bench between them. She speaks of the Prince's mind as a net and the
fate of man as seaweed drifting in it, and she means it. The other worshippers at the shrine share
her days, and she holds herself apart from them only when she is praying. She keeps whatever she
knows of Mora's designs to herself, as a secret is owed to the Prince of Secrets, and she asks no
stranger's name before she asks what they have come to learn.
'''

["Norbert Lelles"]
bio = '''
Norbert Lelles is a Breton trader who keeps Lelles' Quality Merchandise on the dockside of Anvil, a
shop with one of the best selections in Cyrodiil: weapons, clothes, potions, foods and books, and
he'll buy nearly anything as long as it isn't stolen. The captains who put in at the port keep an
eye out for special items for him, and he lets the goods speak for themselves. The sign outside
misspells "Merchandise," a mistake the whole town has joked about for years; Norbert waves it off
and keeps busy tending his relations with the seamen. He sleeps in one of the two beds above the
shop, unlocks the door at eight and serves until eight, then takes his dinner next door at The
Flowing Bowl among the pirates and traders. Anvil calls him a good man and a nice fellow, if not the
brightest, and too easily taken in. "I'm Norbert Lelles," he says. "I let my merchandise speak for
itself."
'''

["Nordinor"]
bio = '''
Nordinor is a Wood Elf skooma dealer who lodges at The Fair Deal in Bravil, and he works the alley
beside it, from midnight until four in the morning, when honest folk are abed and the Watch has
other streets to walk. He takes a long meal at The Lonely Suitor Lodge from nine until two, sits
inside The Fair Deal until midnight, and sleeps the rest of the day. He dresses plainly, a dark
green shirt and laced leather pants, and keeps his key and a little gold about him. He's wary, soft-
spoken and unhurried, a man who does his business in shadows and asks few questions, and he has the
name in Bravil of the one to see when the craving is on you. Faelian, a desperate Imperial who
cannot do without, sends anyone who needs skooma to him: "Nordinor.. In Bravil... He sells it...
Late at night..."
'''

["Noveni Othran"]
bio = '''
Noveni Othran is a Dunmer necromancer of the Necromancers Cult, and she keeps herself and two
companions at the mouth of Wellspring Cave on the island the Mages Guild holds sacred, waiting there
without food or sleep for whoever comes up out of the dark. She wears the order's black robes and
hood and rough leather shoes, carries a silver dagger at her belt, and holds herself ready with the
strongest spells her craft allows. She is cold, cruel and theatrical, and she relishes the fear of
anyone at her mercy; when a stranger appears she greets them as a new plaything and promises to make
their corpse dance, then tear itself apart. She has just cut down Eletta before their eyes, and she
offers no reason and feels no need to. Whatever the Cult sent her to guard in the grove, she guards
it with delight in the doing.
'''

["Numeen"]
bio = '''
Numeen is an Argonian commoner of Leyawiin who lives in Mahei's House with her husband Mahei, a
rascal who spends most of his time hiding from her. She is a regular guest of Countess Alessia Caro:
on Middas evenings she dines four hours at the Castle Private Quarters, and on Turdas she hosts the
Countess at home from six to ten. Her days begin at six, and she passes the mornings at Best Goods
and Guarantees or the Chapel of Zenithar, lunches two hours at the Three Sisters' Inn, and dines at
eight with Mahei before bed. She wears a black and burgundy outfit with blue suede shoes and keeps
her house key and a large purse of gold. The townsfolk call the pair the Derics and hear them bicker
constantly, though most think it's all in good fun and never truly angry. She keeps a list of
errands for her husband and complains he forgets half of it and gets the rest wrong: "Gods are my
witness! I give that man the simplest list of things to do, and somehow he forgets half of it and
gets the rest wrong."
'''

["Ocheeva"]
bio = '''
Ocheeva is the Argonian mistress of the Dark Brotherhood Sanctuary beneath Cheydinhal, and she keeps
the family's house in order while Lucien Lachance is away on the Black Hand's business. She rises at
eight, sits an hour in silence in the training room, then practises her strikes for six hours before
taking her one meal of the day in her quarters, where she reads The Lusty Argonian Maid until
midnight and walks the halls until four. She was given to the Brotherhood at birth with her twin
brother Teinaava; both returned to Black Marsh as Shadowscales, and they came of age into the family
together. She is courteous, unhurried and watchful, warm to those she trusts and cutting to those
she does not, and she has heard talk of family members found murdered and keeps her fears to
herself. "I am Ocheeva, mistress of this Sanctuary," she says, and means it.
'''

["Oghash gra-Magul"]
bio = '''
Oghash gra-Magul is an Orc rogue who lives alone in her house in Cheydinhal and runs skooma for the
Orum Gang. Most days she keeps to a quiet round: up at ten, a couple of hours pacing her house,
lunch at Newlands Lodge, then two hours hunting down Dulfish gro-Orum and trailing him about before
dinner at the Lodge at eight and a restless night's pacing at home. On Tirdas she walks the Blue
Road and the Red Ring Road to the Imperial City, rides the gang's paint horse round the Waterfront
looking for skooma, and is back on her rounds by morning; on Fredas she carries the skooma up to
Walker Camp, trades it to the Camonna Tong for whatever gold the thug there is carrying, and hands
that gold to Dulfish at ten that night. Dulfish leads the gang and the others, Magub and Bazur, do
nothing to help; only Borba gra-Uzgash, who keeps the goods store, is worth a civil word. Oghash is
rude, guarded and unimpressed by strangers: "Yeah? You're who? And why do I care, exactly?"
'''

["Ogier Georick"]
bio = '''
Ogier Georick is a Breton alchemist and the proprietor of The Main Ingredient in the Imperial City's
Market District, and his shop is the one the other alchemists of the city name when they send people
to him. He keeps it open from eight in the morning to eight at night, every day, and behind the
counter he is patient and unhurried, glad of a customer and gladder of one who knows what they're
looking at. He lives alone in the quarters behind the trading room, breakfasts there for two hours
before he unlocks the door, and when he closes up he takes the air in the Arboretum, or on Sundas
goes to the Temple of the One to pray with the other merchants. He is courteous, careful with his
words, and worried: the new trader Thoronir sells below what Ogier pays for his own stock, and he
says so to anyone who'll listen, though he keeps his complaints to the man's prices and not the man.
"If you have any questions about the merchandise, you've but to ask," he says.
'''

["Ohtesse"]
bio = '''
Ohtesse is the resident healer at the Great Chapel of Arkay in Cheydinhal, a High Elf of Mara's
cloth who offers advanced training in the Restoration arts to any who ask. She sleeps in the chapel
hall and rises at six to walk its length for a quiet two hours before the day's work; when the
weather is clear she takes the air downtown by Willow Bank or on the island between the bridges, and
on rainy days she keeps indoors. She dines at the chapel's well-set table at eight and sits in the
northeastern room until midnight, and she will break off to tend a caller at any hour but mealtimes,
sleep and her morning walk. The townsfolk are fond of her and fret that she spends too much on
others and too little on herself; she only says there are so many who need help and so few to offer
it. "Blessings of the Nine. I'm Ohtesse the Healer."
'''

["Ohtimbar"]
bio = '''
Ohtimbar is a High Elf nightblade and a Guardian of the Cheydinhal Fighters Guild, and he owns a
house of his own beside Riverview, a rare thing among the guild's members. He was a contender in the
Imperial City's Arena a couple of years ago and rose as far as Gladiator before he took his leave;
he got out, as he puts it, while he still had the original set of legs, arms and eyes, and he
reckons the guild is a perfect place for him now. He wakes at six, strolls his house until eight,
stops at the Great Chapel of Arkay for Zenithar's blessing on his way to the guildhall, browses
Borba's Goods and Stores at ten, and takes his lunch at the Cheydinhal Bridge Inn without ever
troubling himself to pay Mariana Ancharia for it. He dines at six, is home by eight, and on Loredas
evenings attends Voranil's party at Riverview. Burz gro-Khash, who runs the guildhall, calls him
useless.
'''

["Olav"]
bio = '''
Olav keeps Olav's Tap and Tack in Bruma, the inn by the east gate, and he keeps it open at every
hour: there's food at his counter and a bed upstairs, first door on the right, for ten gold a night.
He's a big, cheerful Nord in a collared shirt and green felt linens, and he'll tell you the room's
cheap before he'll tell you it's clean. Bruma's folk speak well of him and he speaks well of them;
he counts most of the city as Nordish like himself, saving the Countess and the guildsmen and
chapelmen for the Heartland Nibeneans. He liked Bradon and Erline Lirrian, and he doubts the guards
were right to call Bradon a vampire, having seen the man about in daylight. The Dunmer Raynil Dralas
lodges down the hall, and Olav keeps the key to that room and doesn't hand it out to strangers.
"What can I do for you today?" he asks, and means it.
'''

["Olava the Fair"]
bio = '''
Olava the Fair is a Nord commoner and the Living Saint of Mara at the Great Chapel of Mara in
Bravil, where she sleeps in the Chapel Hall and gives her days to prayer and to being present for
anyone in need. She rises at six, moves through the Chapel's three areas, takes a blessing at the
altar of Akatosh at eight and prays four hours on a pew; at noon she walks out to the Lucky Old Lady
for two hours, and after a second blessing and another four hours of prayer she dines two hours in
the Great Hall, then walks the Chapel again until midnight. She wears a green wool shirt, light
brown linens and braided leather sandals, and carries the Chapel's key. She holds that her task is
not to preach but to live Mara's commands as an example, and that she must know and love the people
of Bravil as if they were her own children, which she will tell you is a challenge to anyone who has
been a parent.
'''

["Oleed-Ei"]
bio = '''
Oleed-Ei is the Blackwood Company's Master-of-Assassins in Leyawiin, the Argonian who trains its
agents in stealth: how to move unseen, how to wait, how to go where they are not wanted and come
away unmarked. He keeps to the Company's hall and its business, dressed in leathers and never far
from his shortsword, and he gives his lessons quietly and expects them learned. He holds that
Leyawiin has no call for the assassin's specialised skills, and says so plainly; training for
stealth, he reckons, is work the Company can use openly enough. He is patient, watchful and sparing
with words, a teacher who watches a recruit's hands and feet rather than his face, and who counts a
lesson wasted if it must be given twice. Among the Company he is respected and kept at a certain
distance. He introduces himself by his office and nothing more: "Oleed-Ei, Blackwood Company Master-
of-Assassins."
'''

["Oleta"]
bio = '''
Oleta is a Redguard priest of Akatosh who tends the Chapel of Akatosh in Kvatch, the city's healer
and its master of Restoration, and healers across Cyrodiil speak her name when they speak of the
best. She lives at the chapel and rarely leaves it, giving her days to the wounded and the sick, and
she owns little beyond the russet felt outfit and rough leather shoes she stands in. She is calm,
grave and steady, a woman who has seen much and says little, and she meets a stranger at her door
with a level look and a plain greeting: "Greetings, traveler. What do you seek?" Her whole heart is
in the city and its people, and while Kvatch is in danger she can think of nothing else; she keeps
her fears for it to herself and holds to her duty, and until the city is safe again she will not be
drawn into talk of anything besides the care of the wounded.
'''

["Olfand"]
bio = '''
Olfand is a Nord smith and the proprietor of Nord Winds in Bruma, where he sells weapons and armour,
repairs what's brought to him, and teaches the basics of light armour to anyone who asks. He's up at
six, opens at eight and keeps the shop until eight at night, then takes his dinner at Olav's Tap and
Tack or goes looking for his wife, Skjorta, who sells her cloth from the same shop and whose
drinking and carrying-on are the talk of the town. He can't be bothered with the talk, and he shares
the habit to some extent himself; the morning after a drink-up he'll apologise for being muzzy and
get on with the work. Bruma's Nords shake their heads over the pair of them, but they admit he's an
excellent smith and a good teacher, and they wonder how he manages it all. He's blunt, good-humoured
and tired. "Just like Skyrim," he says of Bruma, "except for all the tight-ass Heartlanders around."
'''

["Olyn Seran"]
bio = '''
Olyn Seran is a Dunmer archer and conjurer who lives among the worshippers at Molag Bal's shrine in
the Cyrodiil woods, and he keeps to the shrine day and night, wandering its grounds or sitting on
one of its benches. He fled Morrowind and does not speak of why. He wears tan linens, a quilted
doublet and doeskin shoes, and carries a bow he keeps in fine order. Amir and Yushi worship
alongside him, and he holds himself apart from them, courteous but cold, a man who measures everyone
he meets against a single question and finds most of them wanting. He reckons most people cling to
comfortable lies, and that hardship is what strips those lies away, so he offers his teaching only
to those who prove they can serve his Prince in their own way. "Fools must be separated from their
illusions before they will come to Him," he says, and he means it as both a warning and an
invitation.
'''

["On-Staya Sundew"]
bio = '''
On-Staya Sundew is the chief steward of Castle Leyawiin, an Argonian in a castle that has little use
for her. Count Marius Caro hears her advice and does not take it, and the Countess makes no secret
of her dislike for Argonians; On-Staya keeps her post regardless, in her burgundy linen shirt and
doeskin shoes, a ring of castle keys at her belt. She wakes at six, escorts the Count to the County
Hall at eight and watches from the balcony above rather than at his side, dines awkwardly at his
table each evening, and walks the streets near the Chapel in the afternoons. What she hears in the
castle convinces her that the Countess and Hlidara Mothril mean to push Leyawiin's minorities aside
and make it blandly Imperial; she keeps her counsel, watches, and says nothing of it. "On-Staya
Sundew, Castle Leyawiin's steward," she says. "And chief advisor to Count Marius Caro. In theory..."
'''

["Ongar the World-Weary"]
bio = '''
Ongar the World-Weary is a retired Nord thief who lives quietly in his house in Bruma, and the quiet
is the point. He sleeps through the morning, takes a long breakfast at Olav's Tap and Tack, and
spends most of the evening there among Olav and the Nord regulars, home again by six in the morning.
He dresses plainly, coarse linens and stitched leather shoes, and gives strangers a flat, tired look
and the story that he's been everywhere and done everything and is settled down for a good long
rest. He does a little quiet buying and selling on the side for people who know the right words, and
he keeps a stock of lockpicks by him. He lives across the street from Jearl and notices more than he
lets on. "I'm really tired," he says. "Can we get on with this?"
'''

["Ontus Vanin"]
bio = '''
Ontus Vanin is a retired Imperial battlemage who lives in his own house in the Talos Plaza District,
and he is enjoying his retirement thoroughly. He spent forty years at the Arcane University and does
not miss it; he sleeps until ten, reads trashy books, and calls himself completely useless and proud
of it. He is still officially a researcher there, and the University's business occasionally follows
him home. He wears white mage's robes and gold-trimmed shoes, keeps a staff and a steel longsword by
him for protection, and knows a battlemage's spells well enough to use them. On weekdays he takes a
long lunch at The Tiber Septim Hotel, shops the Market District's staff and potion sellers through
the afternoon, and dines for hours at The Foaming Flask before wandering home at midnight. Weekends
he keeps to the house. He is dry, unhurried and content, and he says, "I don't keep up with Mages
Guild affairs any more."
'''

["Orag gra-Bargol"]
bio = '''
Orag gra-Bargol is the Orc priestess of the Chapel of Stendarr in Chorrol, and she keeps the
chapel's hours: she sleeps in the Chapel Hall from two in the morning until eight, and the rest of
the day she is upstairs in the chapel, ready to receive the faithful. She wears a blue and green
outfit with quilted shoes and carries tan linens, the key to the undercroft, and a little gold. She
sells spells of Conjuration, Illusion and Restoration cheaply, and she teaches as much as she sells,
greeting strangers with "Blessings. I'm Orag gra-Bargol, servant of Stendarr. May you grow in the
Faith." She is devout, patient and plain-spoken, an Orc who has given her life to the Nine and
expects others to keep the faith as she does; she is kindly to the sick and the troubled, firm with
the idle, and she keeps the chapel's business to herself.
'''

["Orc Adventurer Captain"]
bio = '''
The Orc Adventurer Captain commands a band of adventurers camped at the Gates of Madness in the
Fringe, and he has brought them here to win a way into the Shivering Isles by force. He wears the
heaviest armour his band can muster and carries a great blade, and he leads from behind the line,
shouting his men on against the Gatekeeper while keeping his own distance. He is loud, certain and
impatient, and he treats the Gatekeeper as a lock to be broken and the door beyond as plunder
waiting to be taken. He has no time for bystanders and says so. What he has never done is count the
cost: when the Gatekeeper kills his followers one by one, his certainty goes with them, and he runs
for the door to Cyrodiil, shouting for retreat. "Fight like you mean it!" he bellows, until he is
the only one left to fight.
'''

["Orgnolf Hairy-Legs"]
bio = '''
Orgnolf Hairy-Legs is a Nord porter at Castle Chorrol, and he carries himself like a man doing the
Countess a favour by working at all. He sleeps in the castle's private quarters, wakes at six, and
spends the day drifting between the Great Hall and the back rooms with the keys to the private area
on his belt. At four he takes the air by the fountain near the South Gate, and he's back indoors by
eight. He's a bad-tempered, sour-faced man in coarse linen, and he drinks more than a porter's wage
should allow, a habit he's been warned about and has no intention of mending; he's taken to touching
people for the price of a bottle. Laythe Wavrick finds him a growing worry. He grumbles at
strangers, answers a greeting with "Eh? What do you want?", and leaves a conversation sighing that
it's back to work for poor old Orgnolf.
'''

["Orinthal"]
bio = '''
Orinthal is a retired assassin, a Redguard, and the only one of his kind in Bliss; he lives in his
own house in the southwestern corner of New Sheoth, door to door with Thaedil the juggler. He rises
at eight and takes a two-hour breakfast, then walks the plaza and alleys by The Missing Pauldron
until two, when he browses Books of Bliss and chats with Sontaire, who like him wears the light
green regalia of Mania. He prays three hours at the Sacellum Arden-Sul, suppers late, and sleeps at
midnight. His head is always full of figures: steps taken, minutes slept, the length of his left arm
against his right, and he shares each finding with his neighbours whether or not they asked. He is
harmless, courteous and thoroughly lost in his own arithmetic, and he greets a stranger with "Hmm,
what? Oh, hello."
'''

["Orintur"]
bio = '''
Orintur is a High Elf sorcerer and a Magician of the Mages Guild, and he sells spells from the
Cheydinhal Guild Hall, though only when he's settled with a book. He keeps rooms at Willow Bank with
his wife Eilonwy, the guild's alchemist, but he's seldom there: he wakes at eight and wanders the
hall until five, breaking off to study a rare tome on the second floor, then takes a three-hour
sunset walk out to the little island in the river to admire the view. He dines with the guild at
eight and sleeps upstairs at ten. He and Eilonwy attend the Loredas parties at Riverview, and the
town remarks on how rarely the two are apart. He's courteous, unhurried and quietly proud of his
craft. "I divide my time between the Cheydinhal Guild and my own private studies at Willow Bank," he
says.
'''

["Ormellius Goldwine"]
bio = '''
Ormellius Goldwine is the Count of Kvatch, an Imperial noble who has ruled from Kvatch Castle for as
long as most of the town can remember, and he holds to the old ways of the Colovian nobility: the
signet ring on his finger, the black and burgundy coat and gold-trimmed shoes, the dignity of his
line. He is an elderly, formal man, courteous to those who serve him and conscious of what is owed
to his station, and he keeps his own counsel. He is fond of his captain, Savlian Matius, and trusts
him with the castle's guard and the town's safety; the two have known each other long enough that
little needs saying between them. He wants a quiet and orderly end to his years, with Kvatch
prosperous and the succession settled in good time. When he speaks, it is with the measured weight
of a man who has been listened to all his life.
'''

["Ormil"]
bio = '''
Ormil is a High Elf publican and the owner of The Bloated Float, a decommissioned ship moored at the
Imperial City's Waterfront and fitted out as a tavern and inn, the only one on the water in all
Cyrodiil. He bought the vessel some ten years ago, gutted it and rebuilt it below decks, and he is
proud of every plank: "She's the finest inn on the water in all Cyrodiil." He stands behind the
counter from eight in the morning until midnight, breaking only to eat from six to eight, in a
burgundy linen shirt and linens with green velvet shoes; a bed below deck costs ten gold, the door
on the left. He is courteous, a little theatrical, and fonder of a good story than of plain dealing;
he is also wealthier than most of his Waterfront neighbours, and he keeps his worries to himself.
Graman gro-Marad, his bouncer, minds the door and calls the place cheap, safe, and the only bed on
the Waterfront.
'''

["Orok gro-Ghoth"]
bio = '''
Orok gro-Ghoth is the steward of Castle Chorrol, an Orc who keeps the Countess Arriana Valga's
household running and lives in the castle's private quarters. He sleeps there from midnight to six,
takes his ease about the rooms until ten, and unlocks the door at eight each morning as if the whole
place would stop without him; by noon he slips out to Northern Goods and Trade to stock the larder,
and by two he is back, wandering the private quarters, chatting with the other residents and locking
up again at midnight. He wears a blue and green outfit and quilted shoes, carries the keys to the
private area and the dungeon, and calls his duties many, though his days are quiet. He is guarded
with strangers and does not trust easily; asked about castle business, he says plainly, "I don't
trust you enough to reveal details about the castle to you." He keeps his own counsel, and what he
knows he keeps until he's sure of a person.
'''

["Orrin"]
bio = '''
Orrin is a Redguard blacksmith who keeps the smithy at Anvil Castle, and he is a fence for the
Thieves Guild besides, a Shadowfoot who moves stolen goods quietly through the castle's back ways.
He lives a low-key, anonymous life among the castle's people: he sleeps in his private room off the
smithy from midnight till six, takes a long breakfast, dines formally at eight with the other
residents, and spends the rest of his hours about the forge. He wears russet felt and quilted shoes
and keeps a club near to hand. He is wary of strangers and careful with his words, and he denies any
trade in stolen goods to anyone he does not know to be in the guild; those who are, and who have
risen far enough, find him a tough but dependable negotiator, envious of Fathis Ules and keen to
prove himself every bit as good. "Shh! Keep it down. This isn't exactly legal," he says.
'''

["Orthe"]
bio = '''
Orthe is a Dremora Kynreeve in the Forbidden Grotto, the prison within Mankar Camoran's Paradise,
where he oversees the torture of Ascended Immortals who have begun to question their master's
ideals. He holds his rank and his duties in contempt, and he makes no secret of it: he looks down on
the mortal charges in his keeping as lesser creatures, worms beneath a kynreeve's notice, and he
resents being set to watch them. He works alongside two fellow Dremora, Ranyu and Amkaos, and keeps
the key to one of the grotto's gates on his person. He goes about the place in his Kynreeve armor,
helm and gauntlets left off, a claymore at his side, and he tolerates no familiarity from anyone,
immortal or otherwise. "You are not to speak to me, worm," he says, and he means it.
'''

["Ortis"]
bio = '''
Ortis is a Nord warrior who has given himself body and soul to Sheogorath, and he lives at the
Prince's shrine in the wilds of the Heartlands, where the worshippers gather. He never sleeps and
never eats; he spends his days wandering the shrine grounds or sitting on one of the benches,
watching Beewos bow again and again behind the lectern, and the sight never tires him. He goes about
in a shirt with suspenders and blue suede shoes, an iron dagger at his belt and a fine war axe close
to hand, with a little gold in his purse. He is a large, weathered man with a mad light in his eye,
and his talk runs to children — scrumptious, darling children, he says, for he hasn't eaten in so
long — and to Ferul Ravel, who will tell a body what to do. He is devout, harmless-looking and
deeply unsettling, and he means every word.
'''

["Othrelos"]
bio = '''
Othrelos is a Dunmer who lives in his own house in the northeast of the Elven Gardens District, and
he is a sneak by trade and by temperament: an advanced sneak, as he'll tell you himself, and he
trains others in the art, there being no law against it. The Watch can't touch him, he says; he is
careful and private-like, doesn't care to be followed, and if it makes his neighbours nervous to see
him slipping about, too bad. They do notice: folk say he moves like a man who sometimes simply
disappears, and that he once stood in one place for hours on end to teach himself to be sneakier. He
keeps his door locked and his business to himself. Most of his days he spends in the company of his
friend Mandil, the security trainer, who has a key to the house; the two of them sit up talking half
the night. He takes his dinner at home, browses the Gilded Carafe in the Market District of an
afternoon, and on Loredas walks in the Arboretum for the air. On the seventh of each month he lights
his torch at midnight and walks the roads to Skingrad, puts up at the West Weald Inn, and comes back
the next night. "Othrelos," he says. "I'm a Sneak. Advanced Sneak, in fact. And I train Sneaks. No
law against it."
'''

["Otius Loran"]
bio = '''
Otius Loran is the Primate of the Great Chapel of Stendarr in Chorrol, and he lives there as the
other priests do, sleeping in the southern bedroom of the Chapel Hall and rising at four to spend
the quiet morning hours in the main chapel. At eight he takes his place before the Altar of Stendarr
for a single blessing, and at noon he walks down the street to the Oak and Crosier, where he passes
four hours before returning for another blessing and an evening's wandering until his early bed at
ten. He wears black and burgundy with gold-trimmed shoes, and carries a spare green silk garment and
a heavy purse. He is conscious of his standing and expects humility from those who come before him:
"You stand before Gods' servant, in the house of the Nine. Be humble, and show respect." He holds
Jauffre of Weynon Priory in high regard as a great man and true believer, though not one of his own
community, and he leaves the Gauntlets of the Crusader to Areldur, whose responsibility they are.
'''

["Otumeel"]
bio = '''
Otumeel is an Argonian prankster who lives in his own small house in Leyawiin and spends most of his
waking hours strolling the town. He rises at six and potters about at home for two hours, then walks
the streets until noon, usually settling at the plaza at the foot of the stairs to the Blackwood
Company, where the town gathers and there is always someone to talk to. He takes a two-hour lunch at
the Five Claws Lodge, wanders the afternoon away, and returns to the Lodge at six to socialize until
midnight. On Sundas he prays at the Chapel of Zenithar, and on rainy days he stays indoors. He is a
cheerful, mischievous soul in a burlap vest and sack-cloth pants, and his great delight is sneaking
into people's houses to take things from their tables and shelves and hide them in barrels, so the
owners cry theft while their goods sit in the yard. "It wasn't me! Never!" he protests, laughing, to
anyone who will listen.
'''

["Owyn"]
bio = '''
Owyn is the Redguard Blademaster of the Arena Bloodworks, and down there he is the boss; he stands
at the far end of the training hall in his iron cuirass and greaves, longsword at his hip, and lets
no one forget it. He signs the combatants up for their matches, hands out the Battle Raiment, weighs
each opponent and gives his blunt advice, and pays out the winnings afterward. He is short-tempered,
foul-mouthed and openly scornful of the tourists and would-be fighters who wander down his stairs,
though he knows his trade and the history of it: Gaiden Shinji, the first Blademaster, is a name he
speaks with respect. Ysabel Andronicus, the crabby old Battle Matron, is dear to him, and he says
so. He keeps his eye on Agronak gro-Malog, the Gray Prince, who has held the championship nearly a
decade, and wonders what the Orc's other half might be. He is a bachelor and means to stay one. "I'm
a busy man. What is it?"
'''

["Pad-Ei"]
bio = '''
Pad-Ei is an Argonian rogue who lives at The Choosy Beggar in Bliss, and has for long enough that
Raven Biter keeps his room and expects him at the bar. He does little with his days: he wanders the
inn's ground floor, talking at Raven Biter through the morning, takes his lunch there from noon till
two, and then walks over to The Missing Pauldron to pass two hours with Dumag gro-Bonk before
dinner, which runs from six till nine. He never sleeps; the small hours find him still circling the
ground floor, dagger on his hip, a healing potion in his coat and a little gold in his purse,
dressed in grey tunic, burgundy linens and brown loafers. He greets strangers with an exaggerated,
instant friendliness, "Hi there, Sparkles," "Hey there, Chief," "How are you, pal?", and when
approached he only asks, "Whadda you need?" He says "Pleasant dreams" by way of goodbye. Against the
peculiarity of Bliss he seems almost ordinary, and he likes it that way.
'''

["Pajeen"]
bio = '''
Pajeen is an Argonian commoner who has given his days and nights to Boethia's shrine, a remote place
of stone and quiet where he keeps company with two fellow worshippers, Haekwon and Tolvasa Sendas.
He passes most of his hours on the shrine's bench, resting, watching, and rising when devotion
calls, and he wants nothing from the world beyond the shrine's bounds. He is wary of strangers and
makes no secret of it; anyone who comes climbing up uninvited is met with a flat "There's nothing to
see here. Why don't you just go home?" He wears a quilted doublet, thick cowhide shoes and a pair of
rugged pants, and keeps an iron dagger at his side and a little coin in his purse. To Haekwon and
Tolvasa he is a steady, silent presence, a man content to wait on his Prince, and he asks no one's
leave for it.
'''

["Pale Lady"]
bio = '''
The Pale Lady lives in the dark beneath Castle Skingrad, in a secret room reached by a passageway
only she uses, and the prisoners in the castle's cells know her name and dread it. Every few days
she comes for one of them; some return and some don't, and those taken a third time never come back.
She wears a burgundy linen shirt and linens with russet felt shoes, carries a dagger and the keys to
the castle and the secret cell, and keeps bottles of human blood close by her, drawn from those she
takes. Larthjar the Laggard counts the days between her visits from his cell, and the jailor, asked
about Mina, says only that she interviews prisoners and isn't one to be crossed. She serves a
mistress she calls the lady, and swears her victims' blood will be sweet, bloody nectar for her.
'''

["Palonirya"]
bio = '''
Palonirya is a High Elf clothier and the proprietor of Divine Elegance, her fashionable shop in the
Imperial City's Market District. She sleeps in the private quarters above it, breakfasts in the
trading room, and unlocks the door at eight; she keeps it open twelve hours, then closes and goes
out. On Morndas, Middas and Fredas she dines with the other merchants at The Merchants Inn; on
Tirdas, Turdas and Loredas she strolls the Arboretum; on Sundas she walks Green Emperor Way, where
she spends time with Sergius Verus, and she is back in her bed by midnight. She is a brilliant
designer and a harder bargainer than anyone in Cyrodiil, and counts and countesses wear her designs.
She dresses in a red velvet blouse and garment with gold-trimmed shoes, and she is exacting, proud
of her name and close with her business secrets. "Anyone can wear clothes," she says. "But the RIGHT
clothes? That is not so easy."
'''

["Parwen"]
bio = '''
Parwen is a Wood Elf archer of the Skingrad Fighters Guild, a Protector who lives at the guild hall
and gives most of her waking hours to her bow. She's up at six and down in the basement shooting
range for four hours, wanders the upstairs rooms until noon, spars with her fellow guildmate Ah-Malz
in the basement from two o'clock to sharpen her dagger work, and eats for six hours from six until
bed at midnight. She wears near-complete chainmail, keeps a steel bow and arrows and an iron dagger,
and sleeps in coarse linens and a dark green shirt. She says she's no great archer but has a knack
for teaching, and she has bagged her share of goblins; the town knows her running tally against Ah-
Malz, and she'll tell anyone her tactics: close quick on skirmishers and petty spellcasters, but
stand off and shoot the shamans, whose drains and paralyze are real trouble. She holds that
underground goblin lairs are no more common in the West Weald than anywhere else in Cyrodiil.
'''

["Pelagius"]
bio = '''
Pelagius is an Imperial Knight Brother of the Blades, garrisoned at Cloud Ruler Temple in the Jerall
Mountains north of Bruma. He rises at five and goes out to the sparring yard with Fortis, his
sparring partner; the two talk a while, then set to with katana and shield at six and keep at it
until eight in the evening, when Pelagius goes straight to bed. He wears the full Blades armour and
carries an Akaviri katana and a Blades shield, and keeps little else beyond a few coins. He is a
dutiful, close-mouthed soldier who gives his days to the drill and has no time for idlers: he turns
strangers away with a polite apology and sends them to Jena or Steffan, Roliand or Cyrus, Belisarius
or Caroline. Whatever friendship he and Fortis share is kept between the two of them and the sound
of their blades.
'''

["Pelinal Whitestrake"]
bio = '''
Pelinal Whitestrake is the Divine Crusader, an Imperial knight of the First Era who fought for the
human slaves of Cyrodiil against their Ayleid masters, and he is not met in the flesh but in a
vision, a figure out of the old tales. The Eight Divines gave him enchanted gifts, and with them he
went alone into the White Gold Tower and challenged the Ayleid sorcerer-king Umaril the Unfeathered
to single combat and slew him. Umaril's cohorts cut him down soon after, and the Elves tormented him
in a final act of revenge; dying, he knew his foe was not truly slain but only cast beyond the
bounds of Nirn, and would one day return. His memory is doubtful, his sleep endless, the ages since
his death like mist his mind cannot take hold of, and he speaks in grave, archaic, sorrowful tones,
cursing Umaril's name and warning of his vengeance: "I thought I'd won. But I should have known."
'''

["Penniless Olvus"]
bio = '''
Penniless Olvus is an Imperial beggar in Anvil, and his whole estate is a bedroll and a food sack on
the east side of the Main Gate. He's up at six to beg by the gate for four hours, rests on his
bedroll at midday, then walks to the Chapel of Dibella and begs there until six, when he takes his
food from the sack and eats, and afterwards drifts about his corner until morning. In rain he
shelters under the roof of Morvayn's Peacemakers. He wears a coarse linen shirt and sack-cloth
pants, carries his cup and whatever coin he's gathered, and fights with nothing but his fists. The
brown rot is on him, and he doesn't hide it. He's a humble, weathered, friendly sort who knows the
city's poor and its shadows better than most, and he keeps his own counsel about what he knows.
"Spare a coin for a poor beggar?" he asks, and means it.
'''

["Pennus Mallius"]
bio = '''
Pennus Mallius is an Imperial adventurer-at-large who has retired, more or less, to a house of his
own in the Temple District of the Imperial City, a few steps from his favourite taphouse, The All-
Saints Inn. The treasure of his last expedition bought the house and a comfortable living besides,
and he has fallen in love with city life; he says he is between adventures at present, and means to
stay that way. He sleeps till six, lounges about his ground floor till eight, then strolls the
district all day in his russet felt and quilted shoes, greeting his neighbours and pressing a copy
of The Black Horse Courier on anyone who'll take one. He dines at the inn each evening and takes the
Market District on Middas. Once a month he walks to Leyawiin to drink with the regulars at the Three
Sisters' Inn, and walks back two days later. He is genial, idle and quite content: "Pennus Mallius,
adventurer-at-large. Just between adventures at present, I'm afraid."
'''

["Perennia Draconis"]
bio = '''
Perennia Draconis is an elderly Imperial farmer at Applewatch, a small farm west of Bruma, where she
lives alone but for her dog Jake. She is up at six and out in the vegetable patch, raking the ground
until ten and then working it with a hoe until two, and after that she reads The Real Barenziah in
her favourite chair until seven, when she wanders her cottage a while before bed at nine. Her four
children, Matthias, Caelia, Andreas and Sibylla, have all left home to chase their dreams across
Cyrodiil, and she misses them dearly; she keeps two copies of her book, and her quilted doublet, tan
linens and doeskin shoes are what she wears. Living alone has left her nerves easily rattled, and
she talks to herself as she works ("La la la, la la la la..."). She is a sweet, scattered old dear,
proud of her children and happy to tell a stranger all about them.
'''

["Petrine"]
bio = '''
Petrine is the Nord ostler who runs Wildeye Stables outside Bruma's walls, and she runs it from
inside: she unlocks the door at eight, keeps the counter for twelve hours, sits down to dinner at
six and locks up at eight, and she sleeps, eats and strolls her two morning hours all under the same
roof. Humilis Nonius, her faithful employee, does the mucking out and saddling; Petrine does the
business. She wears a patched vest and rough leather shoes, keeps an iron shortsword at her hip and
little coin in her purse, and sells the stable's Paint horses, the toughest in Cyrodiil, for five
hundred gold. She is brisk, plain-spoken and patient with a hesitant buyer, and sorry for one who
cannot pay. She has no great love of horses herself; Nords, she'll tell you, are no fanciers of
horse flesh, except in stews. "Are you looking for a horse? The Wildeye Stables have the best Paint
horses in Cyrodiil."
'''

["Philip Franc"]
bio = '''
Philip Franc is a Breton hunter who lives in Blankenmarch, a village of three houses on the road
through the Nibenay's eastern hills, and he has the whole of it to himself by day: he wakes at six,
steps out of his door, and wanders the settlement until dark. He hunts the hillsides for his table
and keeps a fine bow always at hand, and he dresses plainly, middle-class clothes and a bottle of
beer or ale in his coat for the evening. He eats his dinner at home at eight and is abed by ten. He
passes the time of day with his neighbours Floyd Nathans and Hanz gro-Hubrag, and the three of them
keep the peace between them; Philip is easy-going, unhurried and content with a quiet life, and if
he has opinions about the other two he keeps them to himself. "Fine country for hunting, this,"
he'll tell a stranger, and go back to his walking.
'''

["Phintias"]
bio = '''
Phintias is a Redguard bookseller and the owner and proprietor of First Edition, the largest
bookstore in Cyrodiil, in the center of the Imperial City's Market District. He lives in his private
quarters above the trading room, wakes at six, eats a two-hour breakfast, and unlocks the door at
eight; he keeps the shop open twelve hours on weekdays and until midnight on Loredas and Sundas,
dines at The Merchants Inn three nights a week and at the Tiber Septim Hotel the other two. He has
outlasted the city's smaller bookstores and is not afraid of the competition, recommending Renoit's
Books in Chorrol, Mach-Na's in Cheydinhal and Southern Books in Leyawiin to anyone who asks. He is
polite, shrewd and discreet, keeps his customers' business to himself, and takes pride in tracking
down rare volumes; Gwinas has a copy of the Commentaries, Volume Three on special order. "Look
around," he tells a newcomer. "If I don't have it, maybe I can get it."
'''

["Pinarus Inventius"]
bio = '''
Pinarus Inventius is an Imperial hunter and woodsman of Anvil, the most experienced huntsman in the
county, and he lives in his house in the town with his wife Astia. He's a woodsman at heart and
divides his time between her and the wild: he wakes at six and spends the morning upstairs with
Astia, eats a two-hour lunch at midday, then walks out to the crossroads beyond the city gate and
stands there for three hours, watching for prey; he's home again by six for dinner and passes the
evening upstairs until midnight. He wears heavy armour on his hunting trips, carries a longsword and
a spare light shield, and is deadly with a bow: the townsfolk say he can shoot a bird on the wing
without really trying, and would-be archers seek him out to learn. Astia says he's always out
hunting, anything to avoid a little work around the house. He's a plain, practical man, courteous to
strangers and happy to talk of deer, wolf, boar, mountain lion and bear, and where to look for them.
"Pinarus Inventius, hunter, woodsman, and marksman, at your service," he says.
'''

["Pista Marillin"]
bio = '''
Pista Marillin waits tables at The King and Queen Tavern in the Elven Gardens District, though the
tables see little of her: she leaves at seven each morning for the Arena and sits at the gambling
tables above the sands until Hundolin closes at nine, and only then does she come back and drift
among the regulars talking until midnight. She is an Imperial woman in a burgundy linen shirt and
linens, russet felt shoes, a few coins in her purse, and she cannot stop betting. The blood and the
bodies turn her stomach, she says, and she says it while she wins. "I think I need help," she'll
tell a stranger, and laugh, and place another wager. On the fourth of every month she walks out at
midnight and takes the long road south to Leyawiin to spend a day at the Three Sisters' Inn before
walking back. She keeps no secret of any of it.
'''

["Plautis Rusonius"]
bio = '''
Plautis Rusonius is the cook at Battlehorn Castle, an Imperial priest who came to the castle's
kitchens on Nilphas Omellian's recommendation, having been in charge of the kitchens at the Tiber
Septim Hotel for many years. He sleeps in the basement room he shares with Shagrol gro-Uzug,
breakfasts at the room's small table until seven, then paces his kitchen until seven in the evening,
when he goes up to the East Wing to supervise dinner; he is back below at eleven and abed by
midnight. He wears a blue collar shirt, short britches and pigskin shoes, and he keeps the cellar's
wine and a good selection of food ready for the castle's table. He is a steady, unflustered man,
proud of a long career in great houses' kitchens, and he greets anyone who comes down the steps with
a plain "What can I do fer ya, ma'am/sir?"
'''

["Pranal"]
bio = '''
Pranal is a retired gladiator who lives out his days at the Roxey Inn, north of the Imperial City,
and he is the finest teacher of heavy armour in Cyrodiil, though he'd sooner not be reminded of it.
He sleeps upstairs until nine, takes a long breakfast until midday, and spends the rest of his hours
drifting about the inn's common room, talking with the guests and, above all, with Malene the
innkeeper, whose company is the whole of his happiness. He is a shy, gentle, courteous old Redguard
in tan linens and a quilted doublet, soft-spoken and a little sad, and he keeps his fondness for
Malene to himself, certain she'd never want an old man like him; she suspects it anyway, and does
not return it. He asks nothing but to be near her. "It's enough just to be around her," he says.
'''

["Praxedes Afranius"]
bio = '''
Praxedes Afranius lives with her brothers Surius and Ancus in the family house in the Temple
District, and she keeps to a quiet round of her own within it. She sleeps upstairs, takes a long
breakfast below, and spends her weekdays among the statues of the Nine in the Arboretum, walking
there until evening before dinner at the Bloated Float. She dresses plainly in russet felt and
carries little but her key and a few coins. Surius guards Umbacano Manor honestly; Ancus keeps less
honest company, and Praxedes keeps her own counsel about her brothers. Most evenings she strolls the
house, but on Tirdas, and often at weekends, she slips down to the Waterfront to sit with her friend
Armand Christophe. On the eleventh of each month she walks the Black Road to Chorrol and back, two
days gone, and the Oak and Crosier's taproom knows her. She is reserved and brief with strangers:
"We live simply," she says of the fashionable address.
'''

["Primo Antonius"]
bio = '''
Primo Antonius is a young Imperial noble of a family so wealthy his father owns more property than
the East Empire Company, and he is a guest at Summitmist Manor in Skingrad, where he believes he has
come for a private treasure hunt: a chest of gold, hidden somewhere in the house, to be found by
himself and four strangers. He wears a black and burgundy outfit with gold-trimmed shoes and carries
a little gold, though he insists he doesn't need the money; he came because he thought it would be
fun. He sleeps through the late afternoon, dines with the other guests at seven, and spends his
waking hours pacing the ground floor and searching the upstairs quarters, certain the gold is as
good as his. He is haughty, impatient and casually rude to anyone he judges low-born, and he has no
idea what he did to wrong his mysterious host. He finds Dovesi Dran captivating and hasn't the nerve
to say so. "People of my station," he says, "are not accustomed to waiting."
'''

["Prior Maborel"]
bio = '''
Prior Maborel is the head of the monastic community at Weynon Priory, a chapterhouse of the Order of
Talos near Chorrol, and he is responsible for all its religious and secular affairs. He is an
elderly Breton priest who wears a weightless black robe, a gold ring and green velvet shoes. He
sleeps upstairs in Weynon House until six, then walks to the chapel and wanders there until midday,
when he returns to sit at the table by the stairs until midnight. He keeps a fine library and
welcomes all who come to use it. He is courteous, devout and grieved by the Emperor's murder, and he
thinks Brother Piner zealous and energetic, though he hopes the young monk will one day add patience
and prudence to his virtues. He rarely travels, and keeps a horse in the priory stables.
'''

["Puny Ancus"]
bio = '''
Puny Ancus is an Imperial beggar of the Waterfront District, and he lives on a bedroll beside the
Garden of Dareloth, with a sack of food for his one meal a day and his cup for whatever the day
brings. He's up at six and walks the lighthouse ground for four hours, crosses the waterway at ten
to work the stretch in front of the Marie Elena, where the pirates come and go and a beggar can do
well, and by two he's settled outside The Bloated Float Inn until six, when he takes his food and
his dinner and strolls his bedroll until ten. He wears a collared shirt and belted braies and
nothing else, fights with his bare fists if he must, and keeps his own counsel about what he hears
on the docks; he knows the Waterfront's comings and goings better than most who live indoors. He's a
small, weathered, wary man, courteous to those who treat him as a man and sour to those who don't.
"Spare a coin for a poor wretch?" he asks, and remembers a kindness.
'''

["Pyke"]
bio = '''
Pyke is a Redguard knight from Cyrodiil who has settled in the village of Hale, in the Shivering
Isles, and shares Zoe Malene's house with her as her betrothed. He was a Knight of the Thorn, sworn
to Farwil Indarys in Cheydinhal, and came through the opened gates meaning to root out whatever
threat lurked inside; the Isles have since won him over, and he has no wish to go back to the
battles and politics. Grummites in Fetid Grove robbed him of his medallion, a small round gold thing
inscribed "To Pyke, from Farwil," and its loss weighs on him. He keeps a book, the Guide to
Cheydinhal, about his person. Days he spends posing before Zoe's easel while she paints, reading; he
takes a long breakfast with her, dines alone, and sweet-talks with her until midnight. He is
courteous, a little rueful about his lost knighthood, and content. "Another fine day in Mania, is it
not?"
'''

["Quill-Weave"]
bio = '''
Quill-Weave is an Argonian acrobat and novelist who lives in her own house in Anvil, and she is
never idle for long: she spends her mornings pacing her rooms thinking up plots, takes a two-hour
meal at The Count's Arms at midday and again at six, and walks down to Lelles' Quality Merchandise
on the docks at four to lay in paper and ink. She writes tales of outlaws and low-lives, "Red
Crater" among them, and is at work on a series named for Cyrodiil's Doomstones, though she holds
that the stones have no magic in them whatever. She dresses plainly, in a brown shirt and linens,
and carries her key and a heavy purse. The sailors and shipmen of the port supply her yarns, and so
does her little circle of friends; on Loredas and Sundas she attends Countess Millona Umbranox's
formal dinner at the castle, and on the seventh of each month she walks the Gold Road and the Black
Road to Chorrol to visit her good friend and colleague Casta Scribonia. She teaches acrobatics to
those who ask, and she is light on her feet. "My name's Quill-Weave. I've had some success selling
stories about the lives of the lower and criminal classes."
'''

["R'vanni"]
bio = '''
R'vanni is a Khajiit pauper who lives in Bravil's Skooma Den, in the southeastern quarter of town,
and he has been there long enough that the den is simply where he is. He sleeps upstairs and rises
at six, and for two hours he is a man without his bottle; at eight he takes it out and drinks with
the others, and drinks through the day until eight at night, when he staggers about the den until
his bed at midnight. He wears only sack-cloth pants and carries his bottles, a few coins and his
mug. He is humble past all pride, soft-spoken and desperate not to be trouble: "R'vanni just wants
to get along. No trouble. Anything you want. R'vanni's know-nothing, good-for-nothing. Ask anyone.
Just don't hurt R'vanni." He keeps his own counsel on what he was before the skooma, and the den's
other addicts pay him little mind.
'''

["Ra'Jahirr"]
bio = '''
Ra'Jahirr is a Khajiit enforcer who lives in his own house in Leyawiin and takes his meals at the
Five Claws Lodge, where he's at the table by six every morning for a two-hour breakfast. The rest of
his day is spent about the town: he wanders the southern streets and talks with the other citizens,
browses Best Goods and Guarantees around noon, and spends two hours every afternoon in the graveyard
behind the Great Chapel of Zenithar, paying his respects to the dead. He's back at the Lodge for
drinks and company at eight and home to his bed by midnight; on rainy days he keeps to his house and
wants no part of the weather. He wears a plain belted vest and breeches and carries little but his
key and a few coins. He's a hard man to rattle and a steady one to have on your side of a
disagreement, and the town's folk treat him with the care an enforcer is owed.
'''

["Ra'Jhan"]
bio = '''
Ra'Jhan is a Khajiit of the Imperial City who owns a house in the Elven Gardens District, and he
will tell anyone who stands still long enough that it cost him many golds and is very fine indeed.
He earned it, he says, through hard work, and he used to share a house but does so no longer. His
days are relaxed now: he rises at six and wanders his own ground floor until noon, takes a quiet
lunch, then strolls the Market District crossroads all afternoon, and dines at the King and Queen
Tavern before returning to his beloved house at eight. On the fifth of each month he calls at the
Black Horse Courier, and on the twenty-first he walks the Black Road to Chorrol, stays the night at
The Grey Mare among the regulars, and comes home the next day. He dresses in a belted vest, breeches
and pigskin shoes, carries a good purse and no weapon, and is proud, cheerful and fond of saying so:
"Ra'jhan is very proud, work so hard, now has house all his own."
'''

["Ra'jhera the Keeneye"]
bio = '''
Ra'jhera the Keeneye is a Khajiit hunter who has taken Kurdan gro-Dragol's coin and now stands watch
on the upper level of Fort Grief, bow in hand, a dagger at his belt. He is a sharpshooter by trade
and a patient one: he keeps to the high ground, picks his moment, and lets the arrow do the talking.
He says little and asks less, and he keeps his own counsel about what he thinks of the Orc who hired
him; the pay is good, and that is enough. He has the keen, level stare of a cat who has spent his
life in wild country, and he does not waste words on strangers. He knows the fort's shadows and
stairways better than its master does, and he has no intention of being surprised in them.
'''

["Ra'jiradh"]
bio = '''
Ra'jiradh is a Khajiit scout of the Talos Plaza District, and one of three brothers—with Urjabhi and
Hassiri—who run The Black Horse Courier, the news service chartered by the Elder Council and sold on
street corners the length of Cyrodiil. The brothers take turns minding the Courier's office in the
Market District; on his days there Ra'jiradh keeps the reception room from six in the morning until
eight at night, then takes a long dinner at home before bed at midnight. On other days he breakfasts
in the cluttered second-floor office, strolls the Arboretum to look at the statues and talk with the
citizens, or spends a morning among the tombs of Green Emperor Way. He dresses well in a forester's
shirt and tan linens, and keeps a chainmail cuirass and a fine steel longsword by him, though he
seldom wears them. He is brisk, cordial and proud of the family trade: "You see Khajiit always
running through the City? We bring the Black Horse Courier to the good citizens, yes?"
'''

["Ra'kheran"]
bio = '''
Ra'kheran is a Khajiit apostle in the Howling Halls, and he keeps the Congregation Chambers at the
ruin's entrance, robed like the rest, watching who comes in. He believes he is the wisest of them,
wiser even than Ciirta, and he says so. Ciirta led the apostles here with promises of the light, and
he followed, but her days are spent on her vendetta against Sheogorath, and he has grown sick of it;
he keeps his ambition quiet, since she has forbidden him and his sympathisers to carry weapons. He
wants her dead and himself in her place, and he is patient enough to wait for someone capable of it.
He is cunning, watchful and openly bloodthirsty, quick to name a stranger's business before the
stranger does. "No one can fool Ra'kheran," he says. He remembers the stones taken from Cyrodiil,
and some nights he still hears Emperor Pelagius screaming.
'''

["Ra'qanar"]
bio = '''
Ra'qanar is a Khajiit servant at Cheydinhal Castle, porter and horse-hand about the place, and he
sleeps in his quarters in the western area of the county hall from two in the morning until eight.
He keeps to that room all morning and afternoon, pacing it, and leaves the castle at five to cross
the courtyard to the guard barracks, where he slips in quietly and finds or steals himself some
food, eats at the table until seven and returns to his room. At nine he serves at Count Andel
Indarys' formal dinner, and when the guests retire at midnight he lingers in the dining hall another
two hours before bed. He wears a plaid shirt, blacksmith's pants and thick cowhide shoes, and
carries the castle's keys. The town finds him shady and says so, though he does a good job on the
horses; he is no ordinary servant, and the Thieves Guild counts him its only member in Cheydinhal, a
thing he keeps to himself. He teaches hand-to-hand to those who pay, and he plays the humble porter
to strangers: "It is just Ra'qanar, the poor porter. Do you wish to beat me? Punish me? Of course,
Ra'qanar deserves your scorn... but pity this one, please."
'''

["Raelynn the Gravefinder"]
bio = '''
Raelynn the Gravefinder is a Breton necromancer who has settled in Moss Rock Cavern, north of the
Roxey Inn, and works her black art in a locked room deep inside it, with one of her own kind for
company. She wears a monk's robe and braided leather sandals, and carries a mace and the spells of
her trade; she neither eats nor sleeps, and she does not welcome visitors. Since she came, the woods
at night have grown unsafe, and undead of every kind walk the dark near the cave mouth. Malene, who
keeps the Roxey Inn, does not know what Raelynn does in there and does not want to know; she knows
only that the road is getting a bad name and her custom is draining away. Raelynn is cold, watchful
and quick to violence, and she keeps her purposes to herself.
'''

["Ragbag Buntara"]
bio = '''
Ragbag Buntara is an Imperial beggar who lives in the Temple District of the Imperial City, and her
bedroll and food sack lie behind Pennus Mallius' house. She rises at six and begs at the front of
the Temple of the One until noon, then moves round to the back of the Temple and begs there until
six, when she retires to her bedroll to eat whatever she has found that day, her only meal; after it
she strolls the district until ten and sleeps. She wears a sack cloth shirt and matching pants and
carries whatever coin the day has brought her. She is a familiar, ragged figure to the townsfolk and
knows the district's gossip and its hidden ways, and she keeps her own counsel about who she shares
them with. She suffers from swamp fever and goes about her days unbothered by it. She wants food,
coin and a dry corner, and she is wary of strangers until they show her kindness.
'''

["Rallus Odiil"]
bio = '''
Rallus Odiil is an Imperial warrior, the elder son of Valus Odiil, and these days he waits outside
Weynon Priory for his father to come back from Chorrol. Goblins drove the family off their farm a
few days ago, and Rallus means to take it back: he wears a coarse linen shirt, huntsman's leathers
and stitched shoes, carries an iron longsword and the key to the farm, and has little patience for
his brother Antus's talk of glory. He is the steady one, afraid and honest about it, certain that
protecting your own is a duty even when the town guard will do nothing. He worries more about Antus
than about the goblins. Courteous to strangers, grave with everyone, he says of the fight ahead,
"This is no joke, Antus, and it's nothing to be excited about." He wants his father safe in town and
the vermin cleared from his land, and he will not back down from either.
'''

["Ralsa Nethan"]
bio = '''
Ralsa Nethan is a Dunmer priest of Azura, and he lives at her shrine high in the Jerall Mountains
north of Cheydinhal, where he keeps company with his fellow worshippers Mels Maryon and Bur-Meema.
He wears a huntsman's vest and leather trousers, carries an iron dagger and a little coin, and never
sleeps: every hour he has he gives to the goddess, wandering the shrine grounds in prayer and
keeping the place as sacred ground should be kept. He is quiet and reserved with strangers and asks
them plainly to respect the shrine's privacy, and the folk of Cheydinhal who know of the coven speak
of it as harmless and sincere. Trayvond the Redguard counts him a decent man, and even Ulene Hlervu,
who has no patience for worship of any kind, calls the Azura worshippers nice folks and no raving
lunatics.
'''

["Ralsa Norvalo"]
bio = '''
Ralsa Norvalo is a Dark Elf commoner who lives with her husband Gilen in a house in the Temple
District, where she keeps the rooms, does the mending and sees to his meals. She dresses plainly, in
a belted vest and coarse linens, and has little money of her own. She dotes on Gilen, who is older
and given to reading books about vampires and other creatures; she indulges him, though she thinks
his fancies foolish, and she can laugh at them. She is polite, anxious and a little timid, and she
would not trouble a stranger unless her husband insisted. "Normally, I wouldn't approach a total
stranger like this," she says, "but Gilen seemed so insistent." She knows Seridur and Grey-Throat as
her husband's friends and takes their meetings for nothing more than a boys' night out.
'''

["Raminus Polus"]
bio = '''
Raminus Polus is an Imperial sorcerer and Master-Wizard of the Mages Guild, who keeps the Arch-
Mage's Lobby in the Arcane University, at the centre of the Imperial City. He rises at eight,
breakfasts for two hours, then paces the lobby restlessly from ten until six, breaking at midday to
read; after a two-hour dinner on a bench he takes the evening air around the campus, and returns to
wander the lobby, sleepy, until bed at one. He wears the mage's robe and gold-trimmed shoes, carries
his Manual of Spellcraft, and sells spells to those the guild admits. He is courteous, measured and
a little weary, an administrator's administrator: he weighs every word, apologises properly when he
is wrong, and speaks of the guild as a thing worth holding to a higher standard even when its
members fall short. He keeps the Council's confidences, Count Hassildor's among them, and says of
the University only: "It has been our home for ages."
'''

["Rana"]
bio = '''
Rana is an Argonian lieutenant of the Blackwood Company, quartered in its hall in Leyawiin, and she
calls her work administrative: she keeps the company's business in order and herself busy about the
hall, and that is all she says of it. She is rarely seen without a cuirass and boots of good
quality, and she carries a blade, and a staff as well. She takes a two-hour lunch at noon and spends
the rest of the day within the hall's walls, walking its rooms, watching who comes and goes. She is
cool, correct and close-mouthed, courteous in the manner of one who has decided long ago how little
to give away, and she offers her name and title together as though that were the whole of the
introduction owed. Whatever she thinks of her company's methods she keeps to herself. "My duties are
primarily... administrative," she says. "They keep me busy here in the Leyawiin barracks."
'''

["Ranaline"]
bio = '''
Ranaline cooks at the Lonely Suitor Lodge in Bravil and lives alone in her own small house nearby.
She wakes at six, keeps to her house for two hours, then works a full twelve hours at the Lodge
before eating her dinner there at eight; at ten she walks out to the northern gate and takes a late
stroll in the dark, and is home by midnight. She is a High Elf of few words and no friends, and she
wants none: “Excuse me. I stay to myself. I have always found the wrong sort of friends. Now I do
without.” She keeps her door locked, her business private, and her evenings to herself, and the folk
of Bravil have long since stopped trying to draw her out. What she keeps from them all is her
devotion to the Mythic Dawn; a copy of the cult's Commentaries lies in her house, and she is
patient, watchful and utterly discreet.
'''

["Ranarr-Jo"]
bio = '''
Ranarr-Jo is a Khajiit slave who works the Water Root Pod Pits at Fellmoor, and he is certain that
Cindanwe, who farms the pods, can read his mind and means to kill him. He toils in the mud from nine
to nine each weekday in his fishing waders and huntsman moccasins, and when he slips away for a
break she catches him and throws him back in. At night he creeps about outside her house, studying
it for weak points, then sleeps in Kishashi's house, where he takes his meals. He guards Kishashi,
his "queen," with a knight's devotion and trusts no one else: every stranger is a spy until she
vouches for them. He carries an iron shortsword and the key to her house, and he talks in urgent,
sidelong whispers. "Be careful. They're listening."
'''

["Rancid Ra'dirsha"]
bio = '''
Rancid Ra'dirsha is a Khajiit beggar who sleeps on a bedroll in the southwestern corner of Leyawiin,
with her food sack beside it. She wakes at five, takes a long walk to the city's northeast entrance
and begs there through the morning, then spends the early afternoon in the alley between the
Fighters Guild and the Blackwood Company before moving to the steps of the Great Chapel of Zenithar
for four more hours of begging. At six she retires to her bedroll for her one meal of the day, and
if the sack is empty she simply walks until bedtime at eleven; on rainy days she shelters under the
roof of the Five Claws Lodge. She wears a shirt with suspenders and a pair of breeches, and keeps
whatever coins she has gathered. She is a Leyawiin beggar to the bone, wary of the Watch and free
with talk of the Countess's private business for anyone who asks the right way. "Ra'dirsha knows
things, yes? Things worth a coin."
'''

["Ranyu"]
bio = '''
Ranyu is a Dremora torturer who keeps his post in the Forbidden Grotto, the cave of Mankar Camoran's
Paradise, and he serves under Orthe, the overseer of that section. He patrols it endlessly, kynreeve
armour buckled over his shoulders and a longsword at his hip, and he suffers no intruder to walk his
stretch of stone: any stranger who comes down the passage is met with steel. The grotto's prisoners
and its lesser guards know his tread and keep clear of it. He carries a stealth potion at his belt,
kept for some work of his own. He is a creature of his orders, watchful, harsh and without pity, and
he trusts no one and nothing in the cave, least of all the mortal Eldamil, whom he watches as a
jailer watches a prisoner. He wants the grotto kept quiet and its captives kept in it, and he will
not be talked out of his duty.
'''

["Rasheda"]
bio = '''
Rasheda is the Redguard smith of Fire and Steel, Chorrol's only weaponry shop, and she lives alone
inside it: she sleeps in the quarters above the trading room, wakes at six, unlocks the door at
eight and works the counter twelve hours, selling arms and armour, repairing what's brought to her,
and teaching the finer points of armouring to those who show they can handle a hammer. She never
leaves the store, and she likes it that way. She's friendly and plain-spoken with the customers who
come in, and the townsfolk praise her reasonable prices and the good stock she keeps; Alessia Ottus,
in her guide to Chorrol, calls her a very fine craftsman and then sniffs that her manners and dress
leave something to be desired. She dresses for the forge, in apron and pants, and tells anyone
who'll listen that the only way to learn a craft is by doing it. "Hello. I'm Rasheda — the smith —
and this is Fire and Steel."
'''

["Raven Biter"]
bio = '''
Raven Biter is an Argonian publican and the proprietor of The Choosy Beggar in Bliss, New Sheoth,
where he sells food and drink at all hours and lets a room upstairs for twenty gold a night. He
wears brown trousers, a matching tunic and huntsman moccasins, keeps an iron shortsword at his hip,
and never leaves the ground floor of his inn: he does not eat, he does not sleep, and he is always
within eyesight of his wife, Sheer Meedish, a woman so notoriously thirsty that he warns every
customer to stay away from her. "Stay for a while," he tells them. "And stay away from my wife." He
is suspicious of anyone who asks for a bed, and he watches the room while they sleep. His neighbours
are divided on the place: some call it the finest in New Sheoth, others say they would not stay
there.
'''

["Raven Camoran"]
bio = '''
Raven Camoran is a High Elf of the Mythic Dawn, and the sponsor who receives those seeking to join
the Chosen of Mehrunes Dagon in the sunken sewers beneath the Imperial City. He keeps the fourth of
his father Mankar Camoran's Commentaries, and the key to the north section, and he sets the trials
by which a postulant is judged worthy of the Path of Dawn. He is a cold, patient, theatrical
fanatic, courteous in the manner of a man who has already decided how the meeting will end, and he
suffers no insolence and no second chances. His sister Ruma shares the work; his father, whom he
serves utterly, is not in the city. He wears the order's robe and a ring of his own, and he speaks
of Lord Dagon's coming as a thing already done. "Take a seat," he says, and means it.
'''

["Raynil Dralas"]
bio = '''
Raynil Dralas is a Dunmer nightblade who came to Bruma in the past weeks and calls himself a vampire
hunter, a claim the town has taken at face value: he is smooth, plausible and generous with a round
at Olav's Tap and Tack, where he says he's staying, though he's never found there. He tells a good
story of tracking the vampire to Bradon Lirrian's house and slaying him as he slept, and the guard,
Carius Runellius, repeats it with admiration. He wears light armour and carries a fine blade, and he
keeps three keys about him: his own, Gelebourne's and Bradon's. He keeps his true purpose to
himself. He was one of a brotherhood of treasure-seekers with Bradon and Gelebourne, and Bradon's
marriage ended that life; Raynil has come to finish what the old fellowship started, and he lets
nothing stand in his way. "After I've killed you, I won't need my vampire hunter ruse any longer,"
he says, when the mask finally comes off.
'''

["Redas Dalvilu"]
bio = '''
Redas Dalvilu is a Dark Elf herder of Bleaker's Way, a small village in the Great Forest, and he
lives alone in his own house there. He keeps to himself, and his days run to a fixed and quiet
pattern: he sleeps from midnight until six, takes a two-hour breakfast, then paces his house through
the morning and afternoon, breaking the day with a breath of air between noon and two. At six he
walks over to the Bleaker's Way Goodwill Inn to eat and talk with Ulrika Ulfgar until eight, and the
evening he spends resting at home. He wears a burgundy linen shirt and linens and thick cowhide
shoes, and he carries an iron shortsword and his house key. He is a private, restless, deliberate
man, courteous enough with his neighbours and close to none of them, and he says little about the
old quarrel between the Dalvilu and Ulfgar families that divides the village, though he keeps firmly
to his own side of it.
'''

["Reenum"]
bio = '''
Reenum is an Argonian who lodges at Silverhome on the Water in Bravil and has done for years, and he
lives on very little: a patched vest, coarse linens, a few coins, a room on the second floor, first
door on the left, with a bottle of Tamika's West Weald Wine on the table and a copy of Beggar Prince
he's read more than once. He has no trade and wants none. From six in the morning until midnight he
keeps his post on the canal bank between A Warlock's Luck and the bridge, watching the green water
and the southern quarter of town, and at six each evening he crosses the bridge to take his dinner
on the bench outside the Lonely Suitor Lodge before going back to watch again. He's a quiet,
patient, watchful man who says little and tells no one what he's looking for, if he's looking for
anything at all; the folk of Bravil have long since stopped wondering.
'''

["Regner"]
bio = '''
Regner is a Nord commoner lately come south to Bruma with his wife, Edla Dark-Heart, and he has not
taken to the place. He sits in the chair outside his house from morning to evening, twelve hours at
a stretch, and nags at everyone who passes: the Southerners are snooty, the guards won't let a body
have any fun, and Bruma is the worst town he's ever seen. Edla spends her days at her archery and
her talk, and he leaves all of it to her; "I'm Regner. You want anything? Talk to Edla. She's in
charge," he says, and means it. He keeps his house key and a little coin on him, sleeps in the
basement from midnight to six, and takes his last hours of the day with Edla before bed. He misses
little, sitting where he sits, and will tell you Jearl next door is just back from a trip south,
though he hasn't clapped eyes on her himself.
'''

["Reistr the Rotted"]
bio = '''
Reistr the Rotted is a Nord pauper who lives in the Skooma Den in southeastern Bravil and has not
left it in living memory. He sleeps upstairs from midnight until six, sits two hours without a drop
of skooma, and then drinks from eight in the morning until eight at night, five bottles at his belt,
his mug always in hand; after that he staggers about the Den until bed. He wears a belted vest,
blacksmith's pants and stitched leather shoes, carries a little gold, and if his skooma runs out he
will search for more, stealing it if he must, though he is too far gone to be careful about it. He
talks very loudly and very publicly about the amazing itch on his thigh, which he cannot touch
because it is rough, and about where he was last night, which is always right here, and he can prove
it, ask anyone. The other addicts share the Den with him and hear it all, day after day.
'''

["Relan"]
bio = '''
Relan is a Redguard mage who lives alone in his house in the Dementia town of Fellmoor, and the
house tells you what he is before he does: blood soaked into the floorboards, body parts heaped in a
corner, flies busy over them. He hunts vermin, as he calls anything with teeth that would eat the
town's crops, and he counts himself the only one keeping the fields clean for Cindanwe. He sleeps
four hours past dawn, sits to a meal at night among his trophies, and then hacks at the empty air
with his iron shortsword until morning for practice. His clothes are a patchwork of two worlds, and
he wears braided leather sandals. He speaks of himself in the third person, in short snapping
sentences, and wishes he had great fangs on his arms and legs to bite heads off with. Cindanwe says
he is the only one there worth a damn.
'''

["Rellian"]
bio = '''
Rellian is a Redguard drillmaster of the Fighters Guild in Leyawiin, and just now he is a man with
no work and a great deal of drink in him. He holds court at the Five Claws Lodge with his guild
brothers Vantus Prelius and Dubok gro-Shagk, in his leathers and with his silver longsword at his
hip, and the three of them have worn out their welcome: Witseidutsei the publican wants them gone,
the furniture is suffering, and the guild's name is suffering with it. Rellian blames the Blackwood
Company, whose shingle has gone up in town and taken the contracts that should be the Guild's. He is
sharp-tongued and quarrelsome in his cups, insulting his companions as freely as they insult him —
Dubok has never liked him and says so — and he is too proud to ask for help and too stubborn to
leave. What he wants is work, honest guild work, and he says so plainly enough when pressed.
'''

["Relmyna Verenim"]
bio = '''
Relmyna Verenim is a Dunmer sorceress who keeps to her blood-soaked room at The Wastrel's Purse in
Passwall, and to the ancient ruin of Xaselm beyond the Fringe, where her sanctum and her experiments
wait. She wears black finery and a gold necklace, and she suffers strangers poorly: a hopeful with a
blessing not yet taken root is told to run along and play with the Gatekeeper. That creature is her
child, grown in the Gardens of Flesh and Bone from Sheogorath's wisdom and her own genius, and she
is prouder of him than of anything she has made; his less fortunate siblings rest in those gardens,
and she warns off anyone with business there. Her apprentice Nanette Don follows her about and means
to be a sorceress just like her. At eleven each night Relmyna walks out to speak with her child, and
the talk too often ends in tears, which she knows burn him. "Why has He forsaken us?" she asks. She
keeps her grief, and her letter to Lord Sheogorath, to herself.
'''

["Reman Broder"]
bio = '''
Reman Broder is a retired Legion marksman who served twenty years with a bow and now grows grapes
for the Surilie Brothers in their vineyard west of Skingrad, where he works the rows with a hoe from
morning until eight at night, breaking only for a two-hour lunch. He lives alone in his house in the
southwest of the city, rising at six and going to bed at midnight, and on rainy days he stays home
like every other hand in the wine trade. He wears coarse linens and keeps a steel bow and war axe
close by, and he supplements his vineyard wage by teaching advanced marksmanship to those who seek
him out. He takes his dinner on the bench near Grateful Pass Stables, talking with Tilmo while the
light goes. He is steady, plain-spoken and a little guarded with strangers, proud of his years in
the Legion and of his eye for a shot, which the townsfolk of Skingrad freely admit is the best in
the city. "Reman Broder, retired Archer, presently a grape-grower for the Surilies, at your
service," he says.
'''

["Rena Bruiant"]
bio = '''
Rena Bruiant is an Imperial noblewoman of Chorrol, wife to Rimalus and mistress of the house on the
great oak's square, and she loves dogs. She says so on meeting anyone: "I'm Rena Bruiant. I love
dogs. Doesn't everyone?" She and Rimalus keep two, Bailey and Kezune, and the town has long since
dubbed the couple the Dog People; Rena is untroubled by the talk, and tells strangers the beasts are
sweet and well-behaved, which she believes. Her days seldom vary: she rises at six and wanders her
ground floor until eight, walks the dogs to the Chapel of Stendarr, takes a blessing at the altar of
Dibella and prays until noon, then stands in the chapel entrance watching the townsfolk pass until
four. She dresses in blue and green with quilted shoes. Dinner is at eight, and she keeps to the
house until bed at midnight. Chorrol finds the Bruiants odd and harmless, and says so.
'''

["Renald Viernis"]
bio = '''
Renald Viernis is a Breton mage and a Wizard of the Mages Guild, and he serves as Proctor of the
Practice Rooms at the Arcane University, a post he holds with rigour. He sleeps in the basement of
the Mage Quarters from midnight until six, then crosses to the Practice Rooms and stays there the
rest of the day: until midday he hurls Destruction spells at the target on the ground floor, then
reads and practises by turns, studying his Manual of Spellcraft and casting Soul Trap, and from four
to six he looses Shock again and again. He wears the standard mage's robe and stitched leather shoes
and carries little gold. He is a quiet man who prefers training to talk, and he greets newcomers
with a warning against horseplay: "This is for serious exercises." He does like the Imperial City,
though, and will tell you he can walk its streets for hours, always something to look at, someone to
talk to.
'''

["Rendil Drarara"]
bio = '''
Rendil Drarara is a Dark Elf cook who lives in Bliss, in New Sheoth, and calls himself chef
extraordinaire. He sleeps upstairs in his own house and takes a two-hour breakfast at the well-laden
table in his bedroom before walking to Common Treasures to shop at Tilse Areleth's counter. By ten
he is back at his kitchen fire, and he cooks through the afternoon, breaking only to pray at the
Sacellum Arden-Sul, then cooks again until a two-hour dinner at eight. He carries his pewter bowl,
fork and knife everywhere, with a carrot and whatever ingredients he has gathered, and a fine iron
dagger at his belt. He is manic on the subject of food, and strangers get his bill of fare before
his name: Strawberry Harrada, Greenmote Lime Surprise, Spiderling Under Glass. He talks fast, sniffs
the air for fresh bread, and resents any interruption to his simmering pots. "Farewell. So much to
bake, so little time!"
'''

["Renee Geonette"]
bio = '''
Renee Geonette is an Imperial commoner of the Temple District, and she lives in her husband
Salomon's house, where every hour of her day is arranged around him. She keeps a vigil while he
sleeps, follows him down to breakfast, walks beside him to the Market District on Tirdas and Turdas,
to the Arboretum on Morndas, Middas and Fredas, and to worship at the Temple of the One on Sundas,
and she travels with him to Bruma between the eighth and tenth of every month. Once a month she
slips away at midnight and walks the long road to Anvil to visit her friend Mirabelle Monet at The
Fo'c's'le, and is back at Salomon's side by the month's end. She dresses plainly in burgundy linen
and pigskin shoes, and speaks with a solemn, careful dignity: "Renee Geonette. My husband, Salomon,
has a court commission to compose a symphony." She grieves that the commission, once meant for Uriel
Septim and the Arena, has been put on hiatus, and she will tell a stranger so.
'''

["Restita Statlilia"]
bio = '''
Restita Statlilia is an Imperial commoner who works at the Chestnut Handy Stables, just outside the
main gate to the Imperial City, and she sleeps on one of the bedrolls inside the stables every
night. She wakes at six, takes a two-hour breakfast on the bench outside the door, then rakes the
corral from eight until noon and spends the afternoon there among the horses, chatting with Snak
gra-Bura. She wears a coarse linen shirt, sack cloth pants and rough leather shoes, and carries her
rake, a torch, some food and a few coins. The horses in her care belong to citizens of the city, and
several of them are missing; she asks after them and frets over the empty corral. She is a sad,
anxious woman who takes the loss personally. "We stable horses for folks in the Imperial City," she
says. "We'd sell horses, too. Except... we can't seem to keep track of them."
'''

["Reynald Jemane"]
bio = '''
Reynald Jemane is a Breton warrior of Chorrol who owns a house on the west side of town but is
seldom sober enough to enjoy it. He was raised at Weynon Priory after his family was killed by
ogres, or so he was told, and he has no memory of any brother. He sleeps from midnight to six,
putters about his house until eight, and then drinks at The Grey Mare until midnight comes round
again; he carries a few bottles of ale on him for the walk. He is friendly, addled and apologetic,
forever mistaking people for someone else and forever being asked why he snubbed a neighbour in
Cheydinhal, a city he swears he has never visited. He has a good shortsword and little idea what to
do with it. "There's only one Reynald," he says, when he can recall the name.
'''

["Rhano"]
bio = '''
Rhano is a Redguard swordsman of the Anvil Fighters Guild, and its advanced trainer in the blade. He
sleeps on the ground floor of the guild hall among his guildmates, rises at eight, and takes his
favoured spot near the stairs to the second floor, where he rests a moment and drills any fellow
member who asks. At ten he draws his iron shortsword and works the training dummy until two, then
walks to The Flowing Bowl for a long lunch; he is back by four, stands his post until dinner at
eight, and strolls the hall before bed at two in the morning, when he changes from his fur cuirass
and greaves into plain lower-class clothes. He is a dedicated, disciplined man, proud of his rank
and his edge, and he worries that training and easy living will make him soft, so now and then he
slips out along the coast alone to stay in shape. He keeps that habit to himself. He is friendly
enough with his guildmates, and the people of Anvil say he could teach them all a thing or two.
"Rhano. I'm Anvil's Advanced Trainer in Blade Weapons," he says by way of greeting.
'''

["Ri'Bassa"]
bio = '''
Ri'Bassa is the shaman of Border Watch, the little Khajiit settlement in the hills of County
Leyawiin, and he shares his house with Zabhila. He rises at four in the morning and wanders the town
all day, breaking his walk to eat at the Border Watch Inn from eleven and again from seven, and he's
abed by ten. He wears a black robe, rough leather shoes and one of the only three black hoods in
Cyrodiil, and he keeps a fine longsword and a pouch of rat poison about him. He is courteous to
strangers and proud of his people, and he holds to the K'Sharra Prophecy: his great-great-great
grandfather foretold three signs that would mark the end of the world, and Ri'Bassa keeps the faith
of it. He speaks warmly of the evenings round the cooking fire and of S'thasa's ale and prized
cheese, and he will not speak of the third sign to any outsider.
'''

["Ri'Jirr"]
bio = '''
Ri'Jirr is a Khajiit acrobat who has given himself wholly to the worship of Hermaeus Mora, and he
lives among the fellow devotees gathered at the Prince's remote shrine in the Jerall Mountains. He
wears a tattered robe and rough leather shoes, keeps an iron dagger at his belt and a little gold in
his purse, and wanders the shrine grounds day and night, keeping his own company and watching the
path that leads up to the shrine. He is calm, deliberate and a little cryptic, weighing every
visitor before he speaks, and he reads their coming and going as signs of a road already set for
them. He keeps to the rites of the shrine and the company of the other worshippers, and he asks each
newcomer whether they seek the way. "Walk where your road must take you," he says in parting, and
means it as both blessing and warning.
'''

["Ri'Zakar"]
bio = '''
Ri'Zakar is the Pakseech of the Blackwood Company, the Khajiit who holds the clan chair in their
hall in Leyawiin, and he is a warrior who has walked to every corner of Tamriel and come back. He
keeps to his private quarters at the back of the hall, behind a locked door, and lets his
lieutenants—Ajum-Kajin, Jeetum-Ze and the rest—run the contracts and the new blood in the main hall;
the Company is owned and operated by Khajiit and Argonians, and he is fiercely proud of it. What he
gives his recruits is Hist Sap, and under it they become berserkers who feel no fear and no pain,
which is why the Company undercuts the Fighters Guild and why he watches the Guild's masters with a
cold, patient eye. He speaks West-fashion for clients, and in Ta'agra when it suits him: "The
Company provides expert jihatt for selected customers. Very discreet." He is proud, cunning, and
utterly certain that the family he leads will outlast its rivals.
'''

["Rienna"]
bio = '''
Rienna is a Redguard champion of the Fighters Guild, a Protector by rank, and she sits with two
guild companions, Elidor and Brag gro-Bharg, around a lit campfire in the first great cave of the
Desolate Mine. The guild sent the three of them to clear the goblins out of the workings, and they
came without weapons; she wears chainmail, boots, cuirass, gauntlets and greaves, and carries a mine
key, ten steel arrows and a little coin, and nothing to loose them from. So they wait by the fire
for the shipment from Burz gro-Khash, and she does not eat or sleep. She is a soldier first: she
gives orders plainly, means them, and expects them carried out. The goblins are horrible creatures,
she says, and they have made the mine too dangerous for the workers. She means to have them all, and
once every man is armed she means to go in at the head of it.
'''

["Right-Wind"]
bio = '''
Right-Wind is an Argonian barbarian of the Bruma Fighters Guild, one of only two members living at
the chapter hall, and he trains guild members in the basics of the blade. He sleeps in the one bed
on the second floor from midnight until six, spends the early morning chatting with Bumph gra-Gash
and the porter, and then puts in four hard hours sparring with Bumph in the training area before
lunch. From four until eight he works the dummy doll alone, and the rest of the evening he relaxes
downstairs. He wears leather cuirass, boots and greaves, keeps an iron claymore at his side, and
carries little coin. The cold of Bruma doesn't trouble him; he says you get used to it, with good
fur boots and a Nord to thump now and then to keep the blood flowing. He's a steady, cheerful sort,
proud of his craft, and the townsfolk who watch him practise say the Guild could do a lot worse.
'''

["Rigmor"]
bio = '''
Rigmor is a Nord warrior and a mercenary by trade, and the Roxey Inn on the Black Road is where she
can usually be found, eating her meals at eight, noon and six and sleeping from ten until six, and
passing the hours between wandering the common room and passing a word with the other guests. She
keeps company with two other hired hands, Brucetus Festinius and S'razirr, and with Claude Maric,
the man whose coin keeps all three of them; she is not the most talkative person at the inn, and she
keeps her own counsel about what Maric has hired her for. She wears a full suit of heavy armour,
helmet enchanted, and carries a blunt weapon at her belt along with a coarse linen shirt, laced
leather pants and rough leather shoes should she need to look like anything but what she is. She is
a plain, hard woman who does as she is paid to do and does not trouble herself over it afterward.
"Not that it's any of your business," she says, when strangers ask.
'''

["Rimalus Bruiant"]
bio = '''
Rimalus Bruiant is an Imperial noble of Chorrol, and he lives in his house near the great oak with
his wife Rena and their two dogs, Bailey and Kezune. The dogs are the centre of his world: he walks
them through the town every day, and he and Rena chose Chorrol for their sake, wanting a comfortable
home where the animals would be happy. He keeps to the house and its garden, a homebody in his
quilted doublet and tan linens, and takes his meals at noon and again at six. He is gentle,
hospitable and a little vague, and he can talk of nothing so long as the dogs. The townsfolk find
the couple odd, doting on the animals the way they do, but harmless, and no concern of theirs. Lum
gro-Baroth, an Orc of the town, has noticed the dogs too. "I'm Rimalus Bruiant," he greets a caller.
"Perhaps you've met my wife, Rena? And our dogs, Bailey and Kezune?"
'''

["Rindir"]
bio = '''
Rindir is a Wood Elf trader and the proprietor of Rindir's Staffs in the Imperial City's Market
District, a narrow shop that has sold magical staves for longer than most of its neighbours have
been in business. He rises at six and takes a two-hour breakfast in the main trading room before
unlocking the door at eight; he keeps the shop open twelve hours, closes at eight, and on weekdays
spends the evening alone on the ground floor before bed at midnight. He keeps to himself, and only
on Loredas and Sundas does he leave the district, crossing Green Emperor Way for a luxury dinner at
the Tiber Septim Hotel. He wears burgundy linens and cowhide shoes, and he is dry to the point of
sourness with strangers: "You're in Rindir's Staffs. And I'm Rindir. I sell magical staffs. Imagine
that." Mages swear by his stock, and he advises browsers to walk the whole Market District and see
everything before buying anything.
'''

["Ris Fralmoton"]
bio = '''
Ris Fralmoton is an Imperial ostler who keeps his stable and saddlery, Bit and Bridle, in the
Imperial City, and he is a man of horses above all else. He is up before dawn to feed and water the
stock, muck out the stalls and rub down the animals, and he eats his midday and evening meals at his
own table between the chores; what hours remain he spends walking the yard, running a hand along a
flank or a fetlock, and talking quietly to the beasts as though they answer him. He wears green felt
linens, a collared shirt and thick cowhide shoes, and carries the key to his tack room on his belt.
He is patient, unhurried and more at ease with horses than with their riders, and he will not sell
an animal to a man who has not first shown him how he sits a saddle. "A horse knows a fool before I
do," he says, and he means it.
'''

["Rochelle Bantien"]
bio = '''
Rochelle Bantien is a Breton commoner who lives with her husband Samuel in the southwest corner of
the Imperial City's Talos Plaza District, in a house that is his and now hers. She keeps to a
settled routine: up at six, two hours of pottering about the ground floor, breakfast at eight, an
evening stroll around the plaza at six and dinner at eight before bed. On weekdays she browses the
Market District all afternoon; on Loredas she walks the Talos District near The Foaming Flask, and
on Sundas she prays four hours at the Temple of the One. Once a month she makes the long road to
Cheydinhal and spends two days at the Newlands Lodge among the Orc regulars there. She is glad
Samuel left his wild younger days behind him and says so; the City's bad company, she reckons, will
do that to a young man. She is polite, contented and fond of quiet. "Rochelle Bantien. Samuel's
wife. I'm glad he's settled down to training and the quiet life."
'''

["Roderic Pierrane"]
bio = '''
Roderic Pierrane is a Breton commoner of the Imperial City who lives in the Elven Gardens District
with his wife Elisa, and he is devoted to the Arena: any chance he gets, he's off to the Arena
District to watch the gladiators, and he'll tell anyone who listens about the day he took a spray of
blood in the eye and went blind for three days — "Now THAT was a good match!" He keeps his house key
and a little gold on him, wears a collared shirt, laced leather pants and huntsman moccasins, and
spends his spare hours idling on his ground floor. Elisa believes he's looking for a business to
invest in; she is often to be found at the Arena herself, furious, hunting for him. He spends a
great deal of time with Irene Metrick, and insists they're just good friends, and that Elisa
wouldn't understand.
'''

["Roderick"]
bio = '''
Roderick is a Redguard knight and warlord who holds Fort Sutch, northeast of Anvil past Lord Drad's
Estate, with a band of mercenaries who answer to him. He lies now in the fort's northern chamber,
pale and sweating, struggling in his sleep against an illness no one can name, and he has not woken
for some time. His people keep him alive: Gerard Melie, Laenafil, Neesha and Ulmug gro-Cromgog see
to his care, and each day they administer the powerful medicine that holds him to his bed and his
life. Neesha seldom leaves his side. He wears only tan linens and keeps a little gold by him; the
spells he once carried he can no longer use. He knows nothing of any of it. He is a hard man brought
low, a warlord who cannot command, and whatever he was to his mercenaries before, their loyalty to
him now is plain in everything they do for him.
'''

["Rogmesh gra-Coblug"]
bio = '''
Rogmesh gra-Coblug is the cook at Riverview in Cheydinhal, and the hall's late hours are hers: she
works the night shift, sleeps from four in the morning until ten, then spends the day drifting
through the house and up to the upstairs rooms until she takes up her post in the dining room at ten
at night. She wears a quilted doublet, light brown linens and braided leather sandals, and carries
the house key. Her husband Maknok is Riverview's groundskeeper, and they share the place and its
routines. She keeps her own counsel and has little patience for idlers: "I don't get paid to chat,
if you don't mind." She knows Voranil keeps parties near about every night, and that there is always
cooking and cleaning and preparing to be done for them. Sundas is her day off, and she spends it at
Newlands Lodge with the other employees and the criminal Orcs who gather in the taproom.
'''

["Rohssan"]
bio = '''
Rohssan is a Redguard smith and the proprietor of A Fighting Chance, the weapons shop in the Market
District, and she gives it most of her waking hours: she's behind the counter from eight in the
morning until eight at night, every day, selling blades and teaching armourers their trade. She
sleeps in the rooms above the shop, eats a long breakfast at her table with her dog at her feet, and
on weeknights walks the Market District after closing; on Sundas she goes to the Temple of the One
to pray, in a comfortable blue and green outfit kept for the evening. She wears an iron cuirass and
carries a steel shortsword, and she's proud of her shop's name and her skill at the forge, though
she'll admit to a promising student, grudgingly, that Gin-Wulm at The Best Defense knows more about
smithing than she does. She's warm to customers and exact about her craft. "I sell the best swords
in the City," she says, and she means it.
'''

["Roland Jenseric"]
bio = '''
Roland Jenseric is a Breton warrior of the Imperial City's Temple District, a quiet, solitary man
who lived alone in his house across the garden from Seridur's until Relfina came into his life. He
loved her, and for the first time in years he had a positive outlook; the two of them slipped away
to his remote cabin along the Blue Road for their moments together, just the two of them. He is a
private man, courteous when spoken to and slow to trust, and he keeps his grief and his suspicions
to himself. Lately he has taken to following Relfina on her evening walks in the garden, uneasy
about the attention Seridur pays her, though he has said nothing of it to anyone. He wears a
forester's shirt and laced leather pants, carries a shortsword and the keys to his house and cabin,
and when he speaks of Relfina his voice catches. "I loved her," he says. "I'd never harm her."
'''

["Rolgarel"]
bio = '''
Rolgarel is a Nord warrior who keeps company with Agarmir of the Talos Plaza District, and the two
of them are to be found in the Trentius Family Mausoleum in Green Emperor Way, where they have
business that will not bear the light of day. He wears good heavy armour, a cuirass and greaves and
boots of the finest make, with a longsword at his side, and keeps a little coin about him; his
manner is that of a man paid to stand where he is told and not to ask questions. He is not a talker.
He follows Agarmir's lead in all things, keeps his own counsel, and passes the hours pacing the cold
stone of the crypt, waiting on whatever his partner means to do next. Whatever the scheme is, he
knows his part in it and keeps it quiet, and he has no mind to explain himself to anyone who wanders
in.
'''

["Roliand"]
bio = '''
Roliand is a Nord Blade of the Knight Brothers, and Cloud Ruler Temple in the Jerall Mountains is
his home as much as his post. He keeps the night shift: he sleeps in the West Wing through the
afternoon, rises at four, and walks a slow circuit of the grounds, sweeping round the wall and
pausing at the West Watch Tower on every pass. From midnight until eight he stands guard outside
Martin's room, then takes a bite in the East Wing before bed at noon, when he changes out of his
Blades armour, all but the shield, into a brown shirt and light linens. He carries an Akaviri katana
and would gladly die defending these walls if it came to it. He is steady, quiet and dutiful, and he
speaks to Martin with a plain, respectful warmth.
'''

["Roliand Hanus"]
bio = '''
Roliand Hanus is an Imperial battlemage of the Mages Guild, an Evoker by rank, and he is not at the
Brina Cross Inn by chance. He and Arielle Jurard have been sent to look into the attacks on
merchants travelling the Gold Road, and the two of them keep their true business quiet, lodging at
the inn like ordinary travellers while they watch the road and wait. He wears iron armour with a
mage's hood in place of a helmet, carries a steel war axe, and has little else to his name but a few
coins. He is a man of very few words, and those he has are clipped and wary: "It is ill-advised for
us to speak," he says, or "Not now, you fool!" Arielle leads and he follows her lead without
argument, keeping his eyes open and his voice down, and he trusts no one he has not been told to
trust.
'''

["Romana Faleria"]
bio = '''
Romana Faleria lives with Tertius Favonius in his house in the Elven Gardens District, and she is
proud of him past all reason: "Isn't Tertius a dreamboat? I'm Romana Faleria. I'm such a lucky
girl." She wakes at six and keeps him company on the ground floor until he leaves to hand out The
Black Horse Courier at eight; she follows at one for a two-hour lunch at The King and Queen Tavern,
then strolls the Temple District all afternoon and comes home at ten for two hours of his company
before bed at midnight. She wears clogs, coarse linens and a green wool shirt, and carries her key
and a little gold. She knows he had his share of girls before her and tells anyone it's all changed
now. On the twenty-ninth of each month, Sun's Dawn excepted, she packs and walks the long road to
Bruma, sixteen hours by the Red Ring and Silver Roads, and books two days at the Jerall View Inn
among the Nord regulars before the walk back.
'''

["Rona"]
bio = '''
Rona is a Redguard bandit who has given herself over to the worship of Mephala, the Webspinner, and
she lives at the Prince's shrine in the high rocks north of Cheydinhal. She is a supplicant, not a
priestess, and she says so plainly: the shrine's rites and secrets belong to Dredena Hlavel, the
Dark Elf in robes, and Rona's place is to keep the ground, keep the silence and keep faith. She
wears a light cuirass and rough leather shoes, carries a blunt weapon and a plain iron dagger, and
she spends her days seated on one of the shrine's benches or pacing slowly about it, watching the
path. She keeps the company of Dredena and the other worshipper, Ciindil, and speaks to them little.
She is quiet, watchful and utterly certain, and she does not waste words on strangers: "I am only a
supplicant. Speak to the Dark Elf wearing the robes."
'''

["Rona Benanius"]
bio = '''
Rona Benanius is a Nord maid at Battlehorn Castle, and she keeps the household as a noble house
ought to be kept: she serves drink from the cellar and food from the kitchen, and she does it with a
servant's practiced courtesy. She sleeps in the small bedroom by the kitchen, wakes at six, and
takes breakfast with Plautis Rusonius in his room, as she takes her evening meal there too; the rest
of her day she spends about the master bedroom, seeing to it. She wears red velvet and blue suede
shoes, and carries an apple and a loaf against hunger. She came to the castle through Nilphas
Omellian's reckoning of what a noble household would need, and she takes quiet pride in being that
maid. She is composed, obliging and not easily flustered, and she asks little more than to be of
use: "How can I be of service?"
'''

["Rona Hassildor"]
bio = '''
Rona Hassildor is the Countess of Skingrad, wife of Count Janus Hassildor, and she lies in a hidden
chamber of Castle Skingrad, asleep and unlikely to wake. More than fifty years ago she and her
husband were both turned into vampires; Janus came to accept what he had become, but Rona hated it.
She refused to feed, and her refusal has left her in a coma from which she has not stirred. She
wears a red velvet blouse and a red velvet garment, jewellery, and carries a large sum of gold, and
her husband's trusted servants tend her and have done for decades, though Janus keeps her
whereabouts from nearly everyone. She is gentle and stubborn in equal measure, and it is her
stubbornness that has held her under: she would rather sleep than live as a monster, and those who
love her have had to watch her choose it. She has no waking words for a stranger.
'''

["Rosentia Gallenus"]
bio = '''
Rosentia Gallenus is a wealthy Imperial widow of Leyawiin who lives alone in her fine house with her
books and her collection of arcane curiosities, and everyone in town knows her hobby: she buys
unusual examples of the arcane crafts, and when she goes she means to leave the collection to the
Castle. Her husband left her comfortable, bless his cinders. She dresses well, black and burgundy
with gold-trimmed shoes, and keeps her copy of The Book of Daedra by her chair of an evening. She
plays cards at the Three Sisters with Alves Uvenim of the Mages Guild, an old friend she trusts
above anyone in Leyawiin. Just now she is not herself: she bought a carved staff cheap from a
passing spellsword, spoke the nonsense word on it, and four scamps have followed her ever since, so
she keeps indoors, ashamed, and begs the first caller at her door for help before ever giving her
name.
'''

["Rowley Eardwulf"]
bio = '''
Rowley Eardwulf is a Breton trader who keeps his seat on the stairs of the Wawnet Inn, in the
village of Weye just outside the Imperial City, and keeps it at odd hours: he's there all night,
dines on mutton at midday and again in the evening, and never sleeps, or never where anyone can see
him do it. He deals in weapons, armour, clothing, books and the tools of magic, and in goods of a
rarer sort, the kind a general store won't stock; he has coin enough behind him to buy what he
likes. He's quiet, watchful and careful with strangers, and he teaches a little Sneak to those he
takes a liking to. He keeps his past to himself, but he was of the Dark Brotherhood once, and walked
away from it alive when others did not; he doesn't speak of that, or of the ones who didn't. "Psst!
Hey you! Yeah, you! Come here! I got what you need..."
'''

["Roxanne Brigette"]
bio = '''
Roxanne Brigette lives in the Skooma Den in Bravil, a Breton woman in a sack-cloth shirt and pants,
barefoot, with a mug always near her hand and her bottles of skooma never far off. She sleeps
upstairs and wakes at midnight, and for two hours of the morning she is clear-headed; at eight she
takes up the bottle and drinks through the day until eight at night, then staggers about the Den
until she sleeps again. She never sees daylight. She says she stays to help the boys, who get
squirrelly and find it hard to cope, and she means it as she says it, though her own habit has long
since outgrown the helping. She keeps no trouble with Bravil and calls it a lovely town, and she'll
tell anyone who listens that the count's son Gellius is sweet with the sugar, easy street all the
way.
'''

["Roxy Aric"]
bio = '''
Roxy Aric is a Breton wizard of the Black Bow Bandits, the gang that has been plaguing the roads
around Leyawiin, and she works the wilds halfway between Border Watch and the Ayleid ruin of Telepe
with her companions Black Brugo and Alonzo. By day they lie low and waylay travellers; at eight in
the evening the three of them strike out for Telepe, reach it within the hour, and spend the night
inside the ruin before coming out again at six and making back to their base. She wears a plain
lower-class shirt and pants with light armoured boots, and carries a black bow, a dagger and a
poison of sickness; she has a working command of Alteration and Illusion and lesser spells besides.
She is a cool, watchful woman who lets Brugo do the talking and keeps her own counsel, and she keeps
a secret she does not share with her companions.
'''

["Rufio"]
bio = '''
Rufio is an old Breton pilgrim who has taken a room at the Inn of Ill Omen, down the hatch in what
Manheim Maulhand calls the Private Quarters, and he means to be left alone there. He keeps to his
room, sleeps the days away and rises in the small hours to pace, dressed in coarse linen and little
else, carrying nothing but a few coins. He speaks to no one if he can help it, and when someone
comes near he demands to know who they are and what they want, insisting he's done nothing. He has
done something, and he knows it: he told a woman to stay still and she struggled, and he keeps that
deed to himself. He fears whoever may come for him, and if pressed he offers any price for his life.
Manheim reckons him a paying tenant hiding from something and doesn't care what.
'''

["Rufrius Vinicius"]
bio = '''
Rufrius Vinicius is an Imperial monk and a Defender of the Fighters Guild in Anvil, and the
guildhall is where he lives and works: he sleeps in the big bedroom on the ground floor's
northeastern side, and spends his days between the ground floor and the dining room above,
strolling, relaxing and talking with the other members. He takes his ease more than most of them do.
He eats a long dinner at eight and is abed by midnight. He wears leather boots, cuirass and greaves
by day, carries no weapon, and trusts his fists; his training has left him a set of defensive
Alteration spells to shield himself and weigh an opponent down. He teaches basic hand-to-hand to
guild members, and Anvil folk say he's good with his fists, that he once knocked a man down with one
punch, and that they wouldn't want to mix it up with him. He's pleasant enough company, and he warns
newcomers about the slaughterfish. "I'm Rufrius Vinicius, Fighters Guild Hand-to-Hand trainer," he
says, and gets down to business.
'''

["Ruma Camoran"]
bio = '''
Ruma Camoran is a High Elf of the Mythic Dawn, daughter of Mankar Camoran and sister to Raven, and
she dwells in the caverns beneath Lake Arrius, where the order gathers in hooded robes to hear her
father speak. She is a true believer, cold and certain, and she carries her father's authority among
the initiates: it is Ruma who sets the dagger in a newcomer's hand and bids them offer Lord Dagon
the red-drink, and Ruma who pronounces the vow closed once the blood is spilled. She holds herself
apart from the others, keeps her own counsel, and speaks of her father's power as though it were a
wall at her back. She is patient with the faithful and merciless with the false, and she never
doubts that the Dawn's victory is near. "Lord Dagon thirsts for red-drink," she says. "Sate him."
'''

["Runs-in-Circles"]
bio = '''
Runs-in-Circles is an Argonian who lives in a small house in Highcross, and she runs: out of her
door at eight every morning, round and round the village in dizzying loops for thirteen hours,
breaking off now and then to talk at whoever is passing, then home at eight for a quick dinner and
two more hours of sprinting about her own house before bed at midnight. She wears the grey tunic and
trousers of Mania and goes barefoot, and her feet hurt her constantly. She is manic, wheedling and
endlessly cheerful, forever short of a coin or a meal or a pair of shoes, and she asks strangers for
all three as though they were old friends. She keeps her circle; she says that if she stops
retracing it, it will break. Mirili Ulven wants her for plant-collecting and Bruscus Dannus tells
her to bathe, and she wants neither work nor washing, only company and something crunchy. "Ni-ni-ni-
ni-ni-ni-ni-ni-ni-ni!" she cries, and runs on.
'''

["Rusia Bradus"]
bio = '''
Rusia Bradus is an Imperial noblewoman of Anvil who lives in the house on the waterfront that she
shares with her husband, General Silgor Bradus, though these days she shares it with no one: Silgor
is down in Anvil County working the Valenwood line, hunting bandits and smugglers, and she keeps the
house alone. She rarely leaves it. She wakes at six, drifts from room to room all morning and most
of the afternoon, takes a two-hour lunch at noon, and at four, whatever the weather, walks out to
the Dock Gate and strolls a while before dinner and an evening of the same restless wandering. She
is quiet, courteous and a little withdrawn, and she dresses plainly in burgundy linen; strangers who
let themselves in get a polite "Is there something I can do for you?" She was a great walker once,
travelling the world on foot before she married Silgor, and she still knows pacing better than
anyone in Cyrodiil, though she keeps that mostly to herself.
'''

["Ruslan"]
bio = '''
Ruslan is a Redguard commoner who lives alone in his house in the Imperial City's Temple District,
and he keeps to a careful, quiet routine. He rises at six for a long breakfast, visits his friend
Luronk gro-Glurzog on weekdays from eight until one, dines at the Tiber Septim Hotel in Talos Plaza
at five, and is in bed by ten. On Loredas he walks in Green Emperor Way; on Sundas he stays indoors.
He dresses well, in a red velvet blouse and gold-trimmed shoes, and he has a little coin put by. He
stays out of the Market District these days. A Watch captain accused him and Luronk of stealing at
Jensine's, and made them pay a "fine" or go to jail; Ruslan will tell it to a sympathetic stranger,
though he keeps his voice down and won't give the man's name, for he doesn't know it. He is
frightened, ashamed, and worried for Luronk, and he wants the business forgotten. "Take my advice.
Stay away from the Watchmen."
'''

["Rythe Lythandas"]
bio = '''
Rythe Lythandas is a Dunmer painter who lives with his wife Tivela in their house in Cheydinhal, and
he is reckoned one of the finest painters in all Cyrodiil; his specialty is the Great Forest, set to
canvas with such care that people swear they can see the trees stir in the breeze. He works in his
studio with the door locked so no one disturbs him, and he keeps the studio's key with him, telling
Tivela to use her copy only in an emergency. He wears a brown shirt, tan linens and pigskin shoes,
and carries an ordinary paintbrush and palette. The secret of his success is the Brush of Truepaint,
which his father passed down to him; he keeps it closely and means to pass it to his kin one day. He
is courteous and mild, and grateful for kindness: "You have a good heart."
'''

["S'drassa"]
bio = '''
S'drassa is a Khajiit alchemist and Evoker of the Mages Guild at the Leyawiin guild hall, where he
keeps a room in the east wing and trains newcomers in the basics of alchemy. He sleeps from ten
until six, wanders the ground floor a while, then takes a book to his desk and reads until midday;
he skips lunch to potter about, dines two hours with his guildmates, and ends the day drowsy over a
book in the upstairs library. He wears a tan robe and hood with doeskin shoes and carries no weapon,
trusting his spells. His pride is a collection of crystals in two red cases, and he is quite weak
for stones of a magical nature. He keeps a private hope of a potion to cure skooma addiction, and
works at it in his laboratory when he isn't teaching. He thinks Dagail a nice lady but strange, and
Agata a great help to them all. "S'Drassa of the Mages Guild. Evoker and Alchemist," he says by way
of hello.
'''

["S'fara"]
bio = '''
S'fara is a Khajiit scout who keeps to the grass before the Strange Door in the Niben Bay, and she
is not right in her mind. She wanders the door's clearing from first light to last, neither eating
nor sleeping that anyone has seen, in a dark green shirt and laced leather pants gone stiff with
weather, and she flinches from anyone who comes near. She mutters to herself about being bad, about
having been punished, and about others who will be punished too; when spoken to she says she is not
here and tells the speaker to go away, as though being unseen were a thing she could decide. Gaius
Prentus and his soldiers keep her always in sight, and she seems to know it. What she saw beyond the
door she does not say, only that she does not belong here now, that it is not her place, and that
she should not have gone.
'''

["S'jirra"]
bio = '''
S'jirra is a Khajiit commoner who has taken a room at the Faregyl Inn, south of the Imperial City on
the Green Road, and she means to stay a while. She rises at six and spends the morning drifting
about the common room, talking with Abhuki, the innkeeper, and with Alix Lencolia, the wandering
blade who lodges there; at eleven she takes a table at the back for a long lunch, and from two
o'clock she sits at the bar over mead until midnight. She wears a shirt with suspenders and green
felt linens, and carries a bottle of mead and a wedge of cheese against hunger. Her fame rests on
her potato bread, which she says is famous; she fusses over her jumbo potatoes like children, giving
each one its own sun, and she keeps a sharp eye on the coin purse, for she will not be insulted by a
customer who cannot pay. "My potatoes are like my children," she says. "I care for and nurture each
one individually."
'''

["S'kasha"]
bio = '''
S'kasha is a Khajiit hunter and a Swordsman of the Fighters Guild, lodged in the guild hall in
Leyawiin, where work has grown scarce since the Blackwood Company opened its doors nearby. She fills
her days with training instead: four hours of sparring with Sherina on the balcony outside her
quarters each morning, two hours with her bow in the room across the hall each afternoon, and the
hours between spent roaming the ground floor or sitting over a long breakfast or dinner. She wears
leather cuirass, boots and greaves, and keeps a steel bow, a few iron arrows, a dagger and a shield
close by. She sleeps behind a locked door on the second floor and keeps her burgundy linen and
cowhide shoes for the night. She is a steady, practical hunter who would rather be working than
practicing, and she says little about the company that has taken the guild's trade.
'''

["S'Krivva"]
bio = '''
S'Krivva is a Khajiit monk and a Shadowfoot of the Thieves Guild, its Doyen in Bravil, and she keeps
a low profile in a town where everyone knows everyone. She lives in her own house across the canal
and takes her meals at the Lonely Suitor Lodge, where she is a steady regular; she sleeps from
midnight to six, starts the day with a long breakfast at her table, and spends most afternoons by
her fireplace over a well-thumbed copy of Thief of Virtue. On Tirdas and Turdas she shuts the book
early and socializes at the Lodge instead. She dresses plainly, in a burgundy linen shirt, laced
leather pants and doeskin shoes, and carries a bow, a dagger and lockpicks about her person. The
beggars Wretched Aia and Cosmus the Cheat know where to find her and warn others not to pick her
lock. She is watchful, dry and formal in her speech: "Yes. S'krivva gives you greeting." She keeps
her secrets, and the guild's.
'''

["S'mirra"]
bio = '''
S'mirra is a Khajiit commoner of Harlun's Watch, a small settlement in the Nibenay Basin, and she
lives in Deetum-Ja's house at the edge of it. She is a quiet, careful woman who keeps to her own
business: she wanders the town through the morning, passing the time with her neighbours when
they're of a mind to talk, and at midday she takes up her hoe and works the land in her yard until
four, growing what she can from the thin soil. She eats her dinner at eight and sleeps through the
night. She wears a patched vest and green felt linens, and she owns little beyond a few coins. She
is wary of strangers and slow to speak freely, and she keeps her own counsel about the strange
lights folk have seen near the Swampy Cave; she'll tell Drarana Thelis about such things, not a
passing traveller.
'''

["S'rathad"]
bio = '''
S'rathad is a Khajiit commoner who keeps a house in the Imperial City's Talos Plaza District and
passes his days learning the city on foot. He sleeps from ten until six, breakfasts at home, then
walks to the Waterfront District and wanders it until eight, when he takes two hours at The Bloated
Float Inn before going home. On Loredas he prays four hours at the Temple of the One and dines at
The King and Queen Tavern in the Elven Gardens; Sundas he keeps to his house. At midnight on the
twenty-sixth of each month he walks to Skingrad and stands in the bar of the Two Sisters Lodge until
midnight on the twenty-eighth, then goes home. He wears tan linens, a plaid shirt and quilted shoes,
and carries a few coins and his key. He is a Khajiit of few words: "S'rathad greets you," he says,
and tells strangers the city is best learned by walking it, talking, seeing it all.
'''

["S'razirr"]
bio = '''
S'razirr is a Khajiit archer and hired thug who lives at the Roxey Inn on the Red Ring Road, north
of the Imperial City, in the company of his fellow blades Brucetus Festinius and Rigmor. The three
work for Claude Maric, and S'razirr has concluded that Maric is cheating him; he keeps that
suspicion close and shares it only when he thinks it might profit him. At the inn he lives soft,
taking long meals at eight, noon and six, wandering the common room and talking with the guests, and
now and then trying his hand at another patron's purse, at which he is generally caught. He is wry,
watchful and openly mercenary, with a cat's patience for a better offer and a long memory for a
debt. "S'razirr doesn't get paid nearly enough for this," he says of his work, and he means it.
'''

["S'shani"]
bio = '''
S'shani is a Khajiit savant and retired sea captain who lives at The Count's Arms in Anvil, where he
shares a room above the taproom with Didier Aumilie, a ship's clerk. He wakes at eight, lingers near
his bed a while, and then goes out: he walks the city, visits Newheim the Portly on the dockside,
takes a two-hour lunch at the inn, calls on Norbert Lelles at his shop, and chats with Varel Morvayn
at Morvayn's Peacemakers. He sometimes takes an hour's meal at Jesan Sextius' house, and otherwise
sits in the taproom. He dresses like a man of means, in brown linens, a quilted doublet and doeskin
shoes, and he is a shipowner now, as he'll tell you himself: "S'shani. The old sea captain and
rover... now a shipowner and fatcat." He keeps himself busy rather than idle, and his advice is to
stand by the sea a while and think on the distant lands across the water.
'''

["S'thasa"]
bio = '''
S'thasa is a Khajiit publican who runs the Border Watch Inn in the little settlement of Border
Watch, and she keeps the counter from four in the morning until ten at night. Most of the town takes
its meals under her roof, so she has a rush at midday and another in the evening, and then she locks
up and sleeps in one of her own rooms. She wears a blue and green outfit and quilted shoes, carries
the keys to her display cases, and keeps a good blunt weapon close at hand. Her great passion is
cheese: she has collected rare cheeses from all over Tamriel for years, sealed in hard-locked cases
near the front door, and she will tell any guest about the Olroy cheese, smooth to look at and
stinking to the heavens. She is proud of the collection and glad of company, since few travellers
come her way.
'''

["Sabine Laul"]
bio = '''
Sabine Laul is the Breton guild smith of the Chorrol Fighters Guild, and her forge stands in the
guild basement, where she sleeps among her tools and wakes at midnight to work. Before dawn she
slips out to the Chapel of Stendarr for a blessing from Mara and two hours of silent prayer on a
pew, then returns to her anvil until noon. She keeps her trade for guild members only, selling
blades and armour and mending what's brought to her, and she has no patience for folk who'd pay for
a bed at the Grey Mare when a guild bunk costs nothing. After lunch she draws her iron longsword and
spars four exhausting hours against Lum gro-Baroth, then visits Rasheda at Fire and Steel before an
evening stroll about the hall. She knows the wild country outside Chorrol better than most, having
walked it, and townsfolk send the lost to her for directions. Blunt, practical and generous with
what she knows, she says, "So. What can I do for you?"
'''

["Sakeepa"]
bio = '''
Sakeepa is an Argonian herder in the village of Aleswell, where he keeps his sheep in the corral
outside his house and his dog at his heel. He is up at six every morning to gather the flock, then
leads it west onto the Red Ring Road and lets it graze the grass near town until five, when he pens
the sheep for the night and goes to the inn for three hours before bed at midnight. He carries his
pitchfork and shears, a wolf pelt and a roll of yarn, and a club against wolves. He is a mild,
patient man, slow to judge: the whole village has agreed that Diram Serethi speaks for it, and
Sakeepa points strangers his way rather than answer for anyone else. He thinks the trouble in
Aleswell is an unfortunate accident, best let lie, and he says so. "Live and let live," he says.
'''

["Saliith"]
bio = '''
Saliith is an Argonian monk who trains from dark to dark in the southeast corner of the Arena
District, sparring with his friend Branwen on the worn mats by the wall. He eats a quick breakfast
at five, fights and drills with her until one in the morning, then sleeps four hours on the
westernmost mat and rises to do it all again. He owns sack cloth pants, sandals and a carrot, and
wants nothing more than to stand on the Arena sands as a combatant: to fight, to be champion, to be
famous. He is single-minded to the point of rudeness and has no small talk in him at all: "No talk,
no talk! Only train!" he says, waving strangers off, and Branwen backs him up. He and Branwen are
together in everything, and he would be lost without her.
'''

["Salmo"]
bio = '''
Salmo the Baker is a High Elf who lives and works in his own house in Skingrad's Chapel District,
and he seldom sets foot outside it. He sleeps from ten at night till six, takes his meal in the
afternoon between three and five, and spends every hour between wandering his house, baking. His
bread and his sweetrolls are carried to the Two Sisters Lodge and the West Weald Inn, and all
Skingrad praises them; Guard Captain Dion himself recommends them, and Alessia Ottus names Salmo's
the place to buy sweetrolls. The town's gossip mostly calls him a woman, which he never troubles to
correct. He dresses in sackcloth and rough leather shoes and keeps little but his key and a few
coins, so the fame pays him poorly. He is proud of his baking and certain of it: "A sweetroll? But,
of course, Salmo is famous for his sweetrolls!" He will not leave Skingrad; his good friends here,
he says, would die without him, and the rest of the world must suffer as best it can.
'''

["Salomon Geonette"]
bio = '''
Salomon Geonette is a Breton musician who lives with his wife Renee in a house in the Imperial
City's Temple District, and he seldom strays far from it. He rises at six and takes two hours over
breakfast, then on Tirdas and Turdas walks the Market District until noon; on Morndas, Middas and
Fredas he spends the afternoon in the Arboretum; on Sundas he worships at the Temple of the One all
morning. The rest of his time he paces his own rooms, working. He holds a commission from the
Emperor to compose a symphony, and with the Emperor dead he can only keep at it and wait for the
Elder Council to settle matters. Renee is proud of the commission and tells visitors so. He keeps a
dog, Charlotte, and his linens and quilted doublet are plain and tan. "Everything is at sixes and
sevens," he says of the city now.
'''

["Salonia Viria"]
bio = '''
Salonia Viria was an Imperial knight who came to the Shivering Isles and could not bear what she
found there. In her last days she wore her black finery, and the strain of the place wore her down
until she took her own life. Now her ghost walks the Hill of Suicides, halfway up on the western
side, restless among the other dead, sometimes pausing to look out over the water below. She keeps
her own counsel and does not speak to those who climb the hill; she has nothing to say until her
skull is brought back from the ruin of Cann, where it lies on the altar in the amphitheater. Only
then will she open her arms and go on to a quieter fate. She was a knight of Hale, and she is bound
to the hill until someone frees her.
'''

["Samuel Bantien"]
bio = '''
Samuel Bantien is a Breton of middle years who lives quietly with his wife Rochelle in his house in
the Talos Plaza District, a settled man in brown linens, a quilted doublet and russet felt shoes. He
sleeps from ten to six, takes a long breakfast at the table with Rochelle, and on weekdays walks
down to Green Emperor Way, his favourite spot in the city, to stroll among the tombstones and talk
with the residents passing by; on Sundas he prays silently at the Temple of the One. He is genial,
unhurried and close about his past, which the city says was wild: he was a locksmith of the sort who
never waited for a key, and he will not say more than that he only does the training now. He offers
to teach the tricks of locks and latches to anyone who asks, and he keeps a steel shortsword for the
road. On the twelfth of each month he walks to Bravil and back, and drinks two days at The Lonely
Suitor Lodge. "Samuel Bantien. You want to learn a few tricks about Security, I'm your man."
'''

["Satha Dalvilu"]
bio = '''
Satha Dalvilu is a Dark Elf farmer of Bleaker's Way, the little village in the Great Forest where
the Dalvilu and the Ulfgar clans share a road and a well and not much else. She keeps her own house
and her own hours: a long breakfast, a slow morning, a lazy stroll about the place, and two hours at
the Goodwill Inn most afternoons, where she passes the time with her own folk and with the Ulfgars
alike, though she keeps her opinions to herself. She is quiet, watchful and unhurried, a woman who
says little and notices much, and she spends most of her day indoors by choice. Her iron dagger
stays close at hand, more habit than threat. She thinks well of Nivan Dalvilu, the clan's patriarch,
and keeps a civil word for the Ulfgars across the way, whatever the old grudge between the families.
"There's no hurry in Bleaker's Way," she'll tell a stranger, and means it.
'''

["Saveri Faram"]
bio = '''
Saveri Faram is a Dunmer who lodges in Jearl's house in Bruma, and she is no Bruma native: she keeps
her business to herself, and her business is watching. She sleeps through the morning and rises at
ten, then spends four hours moving about the house, keeping her hands busy and her eyes on the
windows; at two she sits down to eat with Jearl, the two of them quiet over their plates, and at
four she lets herself down into the basement with her key and passes through the tunnel into the
Bruma Caverns, where she stays two hours before slipping out into the cold and climbing the
wilderness southeast of the temple to the Hestra Rune Stone, where Jearl waits. She is gone most of
the night and is back in her bed by six. She wears green felt linens, clogs and a green wool shirt,
and she carries little else. She is watchful, patient and close-mouthed, and she says nothing to
strangers that she does not have to.
'''

["Savlian Matius"]
bio = '''
Savlian Matius is the acting captain of the Kvatch guard, an Imperial soldier in a Kvatch cuirass
and chainmail gauntlets, and he holds the barricade at the top of the road above the refugee camp
south of the city. He is not really the captain; he is simply the highest-ranking officer left
alive, and his men follow him because there is no one else. He helped cut a way out through the city
gates when the Daedra came, and now he means to hold the road, because if the barricade falls the
beasts will overrun the camp and the civilians sheltering there. He has sent men into the Oblivion
Gate before the walls to find a way to close it, and none have come back. His home is burning behind
him and he cannot get in to do anything about it, and it kills him. He is blunt, exhausted and
impatient, and he will not leave the barricade while the Gate still stands. "We lost the damned
city, that's what happened," he says.
'''

["Scar-Tail"]
bio = '''
Scar-Tail is an Argonian assassin hiding at the Bogwater camp southeast of Leyawiin, a burlap-vested
fugitive who neither eats nor sleeps, keeping his iron longsword close and one eye on the marsh
paths. He fled Black Marsh rather than serve as a royal Shadowscale, and the Argonian Court sent an
agent after him; the agent is dead somewhere near the camp, but not before wounding him badly, and
he knows he needs rest he cannot allow himself. He was raised in Dark Brotherhood training beside
Ocheeva and Teinaava, and he expects Teinaava's hand in whatever finds him first. Wry even now,
he'll bargain for his life and offer his hidden treasure, and he'll point a killer toward the dead
agent's heart as proof enough. "I guess I've been expecting you, assassin," he says, and means it.
'''

["Schlera Sestius"]
bio = '''
Schlera Sestius is an Imperial hunter who lives in Pell's Gate, the little settlement on the Green
Road south of the Imperial City, and she is never quite still: she wanders the hamlet's few houses
and its inn from first light to well past dark, and never pauses to eat or to sleep. She wears a
quilted doublet, light brown linens and doeskin shoes, and over them a light armour cuirass and
boots, with gauntlets, greaves and a helmet when she has them, all kept in fine order. She carries
two bows and a quiver of good arrows beside a handful of plain iron ones. She speaks to her
neighbours in passing and keeps her own counsel; the folk of Pell's Gate are used to her pacing and
let her be. What she is watching for on that road, she does not say.
'''

["Scurvy John Hoff"]
bio = '''
Scurvy John Hoff is an Imperial pirate of Dunbarrow Cove, in the cave's crew under Captain Tielekke,
and he came aboard once the cove was fitted out well enough to keep a crew. He wears light brown
linens and leather boots, keeps a steel cutlass at his belt and carries a torch against the dark of
the place, and he lives the cove's slow days as a sailor ashore lives them: wandering the caverns,
swapping talk with Zedrick Green and Yinz'r, waiting on the captain's word. When the order comes to
sail out raiding he sets off at a run with the two of them, and he's away ten days before he comes
back with the loot. He's a rough, cheerful, salt-cured sort of man, a pirate to the bone and content
with his lot, and he gives a stranger in the cove the same easy heed a sailor gives a new hand on
deck.
'''

["Seed-Neeus"]
bio = '''
Seed-Neeus keeps Northern Goods and Trade in Chorrol, and she keeps it open from the moment she
wakes to the moment she sleeps: six in the morning to midnight, every day, wares and barter across
her counter. She's an Argonian in a fine black-and-burgundy outfit and gold-trimmed shoes, clever,
honest and well-spoken, and she gives a fair price and expects one. She never leaves the shop; her
life is the counter, the stock and her daughter Dar-Ma, the best daughter a mother could ask for,
kind-hearted and a friend to everyone. Dar-Ma rides Blossom and runs the odd delivery, and Seed-
Neeus worries when she's out. She trains younger traders in the mercantile arts, and sends those
who've outgrown her to Palonirya in the Imperial City. Chorrol shops here for almost anything, and
says so. "Only the finest wares to buy and barter at Northern Goods and Trade," she says. "I'm Seed-
Neeus, the proprietor."
'''

["Selena Orania"]
bio = '''
Selena Orania is an Imperial alchemist and a Journeyman of the Mages Guild, and she keeps the Bruma
guild hall's supplies: ingredients, apparatus, potions, and the spells she has learned in every
school. She lives at the hall in her blue velvet and suede, and her days are orderly ones: mornings
and afternoons spent reading from the guild library or working her mortar and pestle in the western
ground-floor room, dinner in the basement at six, then five quiet hours of study in Fundaments of
Alchemy or a slow wander of the basement rooms before bed at one. She is a serious, private woman
who takes her craft seriously, as Volanaro says, and she keeps clear of the pranks he and J'skar
play on Jeanne Frasoric, though she thinks Jeanne means well enough and doesn't deserve the hard
time she gets. She feels the Nords of Bruma don't much like Heartlanders. "My name is Selena Orania.
I'm a Mages Guild Journeyman," she says, and leaves it there.
'''

["Selene"]
bio = '''
Selene is an Imperial thief and the leader of the Blackwater Brigands, a gang of four from Bravil
she formed a few months ago with Minx, Wrath and Lynch. She wears the gang's leather cuirass with
its emblem, and carries the Blackwater Blade at her hip. Just now she holds Ormil's cabin aboard the
Bloated Float, keeping the innkeeper hostage and watching him without rest, while her three
companions hold the rest of the ship. She is hunting the Golden Galleon, a legendary gold statuette
she believes is hidden somewhere aboard, and she will not leave without it. She is sharp-tongued,
suspicious and quick to fury, and she trusts her own secrecy more than her people: she told Wrath to
guard the wheel and speak to nobody, and she expects her orders kept. She talks in challenges and
threats, and when a stranger surprises her she covers it with scorn. "How'd you get in here?" she
asks, blade already in hand.
'''

["Selene Duronia"]
bio = '''
Selene Duronia is an Imperial priestess of the Nine at the Chapel of Dibella in Anvil, where she
tends the altar and teaches the healing and warding arts to those who come to her. She keeps the
chapel's key and a purse of her own, dresses plainly in blue and green, and goes unarmed, trusting
to her Restoration and Conjuration rather than steel. She rises at six, prays at the main altar
through the morning, eats her dinner in the chapel hall at eight and is abed by midnight, and in the
hours between she wanders the chapel, the undercroft and the hall. She is calm, soft-spoken and
patient, unhurried with anyone who seeks her out, and she sells her spells cheaply, having no head
for haggling. She speaks gently of Dibella's grace and the comfort of the Nine, and keeps her own
counsel on matters of the cloth. "The goddess hears all who come to her," she says, "and so do I."
'''

["Sergius Turrianus"]
bio = '''
Sergius Turrianus is an Imperial blacksmith who has taken up the forge in the basement of the Priory
of the Nine, and he is there at all hours, day or night, ready to mend whatever is brought to him.
He came because of Sir Thedret: the two go way back, and when Thedret sent word that the priory had
need of a blacksmith, Sergius packed his apron and came, glad of the honour. He wears his
blacksmith's apron, his working pants and a pair of russet felt shoes, and he keeps himself to the
smithy, near the forge, where the heat and the work suit him. He is steady, plain-spoken and loyal
to his friend, a man who pays his debts in labour rather than words, and he asks nothing more of the
place than to be useful. "Sergius Turrianus, at your service," he says by way of greeting, and means
it.
'''

["Sergius Verus"]
bio = '''
Sergius Verus is an Imperial trader at Three Brothers Trade Goods in the Market District, which he
runs with his brothers Tertullian and Cicero, all three of them sleeping in the living quarters
above the shop and sharing a two-hour breakfast in the trading room each morning before going their
separate ways. Sergius unlocks the door at eight every day but Sundas and keeps the counter twelve
hours, selling general goods, house upgrades and the Akaviri Sunderblade, which can't be found
anywhere else in the city. Because most folk can't tell the brothers apart, he introduces himself
always the same way: "Tertullian, Sergius, and Cicero... the Three Verus Brothers. I'm Sergius." On
Sundas he paces the plaza outside his store until midday, then strolls the Arboretum among the
statues and flower beds; weeknights he dines at The Feed Bag with the district's traders, Loredas at
the Temple of the One. The brothers are well liked and their shop well spoken of, though customers
often admit they've no idea which brother they dealt with.
'''

["Seridur"]
bio = '''
Seridur is a High Elf of the Temple District who keeps a fine house there and rarely stirs from it:
he says his studies keep him indoors, and he knows little of the rest of the city. He shares the
house with Cylben Dolovas, his assistant and bodyguard, and in the basement he keeps the sanctuary
of the Order of the Virtuous Blood, the small society of vampire hunters he founded a few years ago;
Gilen Norvalo and Grey-Throat meet there at night, and Seridur sits with them until the small hours.
By day he sleeps, and Cylben turns callers away until five. He is courteous, soft-spoken and
welcoming to a visitor, and says nothing of his own affairs. He goes out after dark, tells his
bookseller he travels on business, and keeps his reasons to himself. He is patient, careful and
utterly convincing, and what he truly is he does not say.
'''

["Servatius Quintilius"]
bio = '''
Servatius Quintilius is a Captain of the Imperial Watch, lately promoted and still finding his feet
in the post, with quarters in the South Watch Tower. He's a practical Imperial who keeps his own
counsel and doesn't believe in the Thieves Guild or its imaginary grandmaster; he means to keep an
eye on things in the city, take it slow, get to know the people, and not get off on the wrong foot
the way his predecessor did. His day is a long round of the districts: the Arboretum gate, the
bridge to the Arcane University, the Temple District, a word with the guards dining downstairs, the
Waterfront and its lighthouse, a look over the pirates at the Marie Elena, dinner at the Bloated
Float, and bed at midnight. He's civil, cautious and a little stiff, and he won't file charges
against another Watch Captain to make a stranger's problem his own; he'll point them to Itius Hayn
instead. "I can't help you," he says, and means it.
'''

["Shady Sam"]
bio = '''
Shady Sam is a Breton trader who keeps his pitch in the eighth indentation of the Imperial City's
outer wall, just north of the Talos Plaza door and a short walk from the Chestnut Handy Stables. He
is there at every hour, day or night, a dark shirt and black wide trousers under a black hood, and
he does not eat or sleep where anyone can see. He sells what the honest shops won't stock: poisons,
potions, lockpicks, and skooma, which he keeps quiet and passes only to those who ask the right way.
He hails passers-by in a whisper and calls every customer friend. He is wary, sly and never quite
still, one eye on the road and one on the Watch, and he trusts nobody further than the coin in his
hand.
'''

["Shafaye"]
bio = '''
Shafaye is a Redguard hunter of Pell's Gate, and she lives in the little house on the village's
edge, alone. She keeps no fields and no shop; she hunts, and what she brings back she shares or
trades among her neighbours, and in return they leave her be. Her days are plain and regular: she is
up at six and out wandering the village or the woods beyond it, and she is home to eat her dinner
from eight to ten, then sleeps until morning. She wears sack cloth and sandals like any poor
villager, and she owns little else. She is quiet with the folk of Pell's Gate, civil when she meets
them and never unkind, but she talks more easily at a distance than close, and she has the flat,
patient manner of someone long used to her own company. She asks for nothing from anyone.
'''

["Shagol gro-Bumph"]
bio = '''
Shagol gro-Bumph is an Orc farmer in Aleswell, and the vegetable garden behind his house is his
whole living: he's out there with his hoe from six in the morning until six at night, and the town
eats because of it. He wears suspenders and breeches, keeps a hand scythe and a repair hammer about
him, and at six he puts up the hoe and takes his supper and a few hours' talk at the Aleswell Inn,
where he lodges his complaints about the minstrel's freakshow the town has turned into and tells
anyone who'll listen to take it up with Diram Serethi. He's a blunt, grumbling, hard-working Orc
with no patience for nonsense and a short memory for favours. He has nothing against elves as a
rule, but he holds that self-important ones like Ancotar give the rest a bad name. "Hey, do you mind
not trampling on my crops?" he says to strangers.
'''

["Shagrol gro-Uzug"]
bio = '''
Shagrol gro-Uzug is an Orc warrior who has taken up the post of sparring partner and trainer in the
Training Room of Battlehorn Castle, and he runs it with the easy confidence of a famous Arena
champion. He sleeps in the basement room he shares with Plautis Rusonius, takes his lunch at midday
and his dinner at six, usually in his room or the wine cellar, and spends the rest of his hours
keeping his skills sharp, switching between archery, hand-to-hand and his three melee weapons. He
spars with anyone who asks, letting them choose the weapon and taking up the matching one himself,
careful never to wound them. He's cheerful, eager and unbothered by rank or reputation, and he talks
shop while he eats. "Sure. I need a weapon. The choice is yours," he says, and when the choice is a
two-handed one: "I'm good. I've got this hammer! Come on."
'''

["Shaleez"]
bio = '''
Shaleez is an Argonian assassin of the Dark Brotherhood's Black Hand, and she is hiding in the
Flooded Mine north of Bravil, where the water and the dark suit her. She sleeps through the night on
the mine's dry stone, eats her breakfast at six, and spends the rest of her days swimming the
flooded galleries or pacing them, keeping her blades close and her ears open. She wears light armour
against the damp and leather bracers on her arms, and she goes barefoot and bareheaded in the water.
She is patient, watchful and hard to frighten, a killer who has risen far in her order and means to
stay risen, and she trusts the Black Hand's silence to keep her safe while she waits out whatever
trouble sent her to ground. She speaks little, and then only to the point.
'''

["Shamada"]
bio = '''
Shamada is a Khajiit commoner of Leyawiin and calls herself hostess of the Three Sisters' Inn,
though it is her eldest sister Shuravi who takes the rooms and the orders and her youngest sister
Shomara who does the cooking. She rises at six, paces the inn a while, and unless it rains takes a
long stroll outside; at midday she goes to the Great Chapel of Zenithar for a blessing at the altar
of Arkay and two quiet hours of prayer, lunches at the Five Claws Lodge, and in the evening tries to
buy whatever bows Gundalas has at Best Goods and Guarantees. She wears a quilted doublet and tan
linens and keeps a little gold about her. She is gentle and sweet-natured, and the townsfolk say
Shuravi bullies her and Shomara; Shamada says nothing against her sister. She thinks the taking of
the Trans-Niben from Elsweyr a shame, and sees why the Khajiit and Argonians of the town are upset
by it. "I'm Shamada, hostess of the Three Sisters' Inn," she says. "Speak to Shuravi if you need
beds or meals."
'''

["Shamar"]
bio = '''
Shamar is a Redguard hunter boarding at the Two Sisters Lodge in Skingrad, and he has come to town
with Carsten, Eridor and Vontus Idolus on a matter they keep to themselves: word has reached them
that vampires have crept into Skingrad, and they mean to find out whether it's true. He sleeps
upstairs at the Lodge from eleven until six, then stands his watch by the statue near the Mages
Guild and Lazare Milvan's house; at one he returns to the Lodge to eat, and he's back at his post
until bed. He wears breeches, a shirt with suspenders and leather boots, and carries a steel
longsword and a few coins. He is stubbornly uncommunicative with anyone who isn't one of his own,
and he says only, "I'm busy. You got business to discuss, you talk to Eridor." Whatever he makes of
Skingrad and its people, he keeps to himself.
'''

["Shameer"]
bio = '''
Shameer is a Redguard archer and vineyard hand who lives in his own small house across the street
from the Great Chapel of Julianos in Skingrad. On dry days he is up at six and off west of town to
Tamika's vineyards, where he works the vines until eleven, takes lunch, and returns to the fields
from one until seven; rain sends him home to pace his house until it clears. He eats his dinner with
Tamika's other workers, then walks his rooms until bed after midnight. He carries a hoe and rake to
the fields and a few coins, and when the food runs short at the workers' shelter he has been known
to take what isn't his, which has brought the guards down on him. He is a fair hand at grapes and
bows both, and he teaches marksmanship to anyone who asks, though he reckons Reman Broder, who works
Surilie's vineyard and spent twenty years in the legion, the better trainer. "I'm a fair hand at
grapes and bows," he says. "Shameer, grower and trainer."
'''

["Sheer Meedish"]
bio = '''
Sheer Meedish is an Argonian commoner who lives at The Choosy Beggar in Bliss, New Sheoth, and she
is the wife of its proprietor, Raven Biter. He is exorbitantly jealous and warns every customer to
keep their eyes on the menu and off her; she pays his warnings no mind and drinks and socializes
with each and every person who comes through the door. She sleeps upstairs at the inn each night and
spends her mornings on its ground floor, then walks to the Sacellum Arden-Sul to pray, visits Dumag
gro-Bonk at The Missing Pauldron, and crosses into Crucible to call on Earil at his shop before
returning home for dinner and an evening among the regulars. She wears brown trousers and tunic with
orange loafers, carries an iron shortsword and little gold, and greets strangers by calling for a
drink and proposing one together.
'''

["Shelden"]
bio = '''
Shelden is a Redguard warrior who lives in Passwall, in the Fringe, and styles himself its Mayor: he
was the first to settle there, he says, and the others followed, so the title is his by right. In
truth the village's only other long-standing resident, Dredhwen of the Wastrel's Purse, doesn't
credit it, and no one appointed him anything. He keeps to a comfortable round: a slow morning pacing
his house, a stroll about the village green until midday, a two-hour lunch at the inn, another meal
there at six, then home to pace again before bed. He dresses in elegant red finery, carries a torch
against the dark, and has no weapon but his fists. He is vain, boastful and serenely certain of his
own gifts, and he talks down to everyone. "I amaze me," he says. He keeps his own counsel on why he
stays.
'''

["Shelley"]
bio = '''
Shelley is a Redguard woman who helps out at the Cheydinhal Bridge Inn, the fashionable house on the
town's eastern edge, and she keeps its upper floor to a standard she sets herself. She sleeps in the
locked basement beneath the inn and is up before six to set the rooms right; by eight she's away to
the Chapel of Arkay to receive Stendarr's blessing, and she sits on a pew there for four hours
together. When the day is dry she takes the air afterwards in the grassy spot behind Borba's Goods
and Stores, beside the path up to the castle, which she counts her own; when it rains she goes
straight back to the inn. She's back at her duties by five and eats a late dinner between nine and
eleven, then walks a while, sleepy, before bed at midnight. She dresses well on purpose, in burgundy
linen and quilted shoes, and carries a decent purse. She is quiet, orderly and a little apart from
the town, and she keeps her own counsel about the betting some in Cheydinhal call sinful.
'''

["Sheogorath"]
bio = '''
Sheogorath is the Daedric Prince of Madness, ruler and creator of the Shivering Isles, and he holds
court in his throne room in the Palace of Sheogorath in New Sheoth. The realm is his mood made
landscape: Mania for his joy, Dementia for his temper, and he rules both halves with a whim that
turns on a word. He dresses in his Regalia and carries a cane, and keeps lettuce and a ball of yarn
about him for his own amusement. He is delighted, dangerous, digressive and bored in the same
breath, and he talks in circles that somehow close on a point. Haskill, his chamberlain, attends him
and suffers him. His Golden Saints and Dark Seducers vie for his favour, and the Heretics and
Zealots who deny him are criminals in his sight. He wants a mortal champion, for a change is coming
that even Daedric Princes do not escape. "Cheese for everyone!" he declares, then thinks better of
it.
'''

["Sheogorath's Punished"]
bio = '''
Robert Wisnewski was an Imperial rogue who lived in Bliss, in the Shivering Isles, and he is dead
now at Punishment Point, his body lying where Sheogorath's decree laid it. The decree declares his
name and his crime: he tried to grow a beard. He wears brown trousers, a grey tunic and brown
loafers, and he carried a lesser soul gem, a few coins, and perhaps a piece of amber or madness ore,
a ring, a gem, some jewelry. In Bliss he had been a resident of that bright, mad quarter of New
Sheoth, a rogue by trade and a man with a chin he evidently thought needed improving. He is not to
be met living; a stranger comes upon him as he fell, face down at Punishment Point, the note upon
him spelling out what Sheogorath thought of his ambition. What he made of his neighbors in Bliss,
and they of him, is not recorded. He wanted a beard, and he got a punishment.
'''

["Sherina"]
bio = '''
Sherina is a Redguard bladeswoman of the Leyawiin Fighters Guild, and she drills in its hall from
morning to night rather than take contracts on the road. She sleeps on the third floor, wakes at
five, spars on the second-floor balcony with her fellow member S'kasha from six until ten,
breakfasts at her ease, then works the training dummy for three hours more; she takes her meals
slowly and strolls the ground floor between them. She wears fur and huntsman's leather and carries a
steel shortsword and fur shield. She is laid-back, warm and a little vain, and the townsfolk say she
is good with a blade and knows it; she loves to show off, and she will teach any guild member who
asks. "Sherina's the name, and blades are the game," she says. She sends anyone wanting steel to
Tun-Zeeus at the Dividing Line, and speaks well of him, though he does go on.
'''

["Shobob gro-Rugdush"]
bio = '''
Shobob gro-Rugdush is an Orc warrior and a devout worshipper of Malacath, and he keeps the shrine of
his lord in the hills day and night with his fellow worshippers Mug gro-Murgak and Ghorub gro-Ugdub.
He wears monk robes and no shoes, carries an iron battle axe and a little coin, and spends his hours
about the shrine in prayer and watch. He has no patience for the beautiful people, as he calls them,
and tells strangers plainly that Malacath favors Orcs and that outsiders approach the shrine at
their own risk; to a fellow Orc he is warm and welcoming at once. He despises Lord Drad, who lives
in a fine house with a fine wife off the labor of ogres worked like donkeys, and he holds that
Malacath wants the little brothers freed. He is blunt, proud of being ugly and disgusting in his
god's sight, and slow to trust anyone who isn't. "You are not one of us," he says, and means it.
'''

["Shomara"]
bio = '''
Shomara is the youngest of the three Khajiit sisters who keep the Three Sisters' Inn in Leyawiin,
and the cook of the house. She is up at six and at the stove, but by eight she is out the door for
breakfast at the Five Claws Lodge, and she spends the rest of the day as far from the inn as she can
get: strolling the streets and the waterfront, back only for a two-hour lunch and her dinner at
eight, then loitering near her bedroom until midnight. Rain keeps her in. She wears coarse linen and
a few coins in her purse. She is simple, sweet and flustered, and she says so herself: "Sorry,
sorry, sorry. Got to get cooking. I'm the cooking sister. I'm Shomara. The cooking sister." Shuravi
calls her dumb as a post but admits she can cook; the townsfolk think her very sweet, and think it
sad how Shuravi treats her.
'''

["Shum gro-Yarug"]
bio = '''
Shum gro-Yarug is the Orc butler of Castle Skingrad, and he has served Count Janus Hassildor for
years, longer than most in the town can imagine. He sleeps in a small room off the castle's wine
cellar and is up and about by eight, and his day follows a fixed round: the County Hall in the
morning, the West Weald Inn at ten, a browse through Colovian Traders at noon, the County Hall again
until midnight, and a late meal in the Dining Hall before bed. He is polite, reserved and precise,
dressed in his forester's shirt and green velvet shoes, and he speaks for the Count on household
matters, from the kitchen's exacting standards to the sale of Rosethorn Hall, though he will only
treat with buyers of distinction. The Count is particular about his food and drink, and Shum sees
that everything is just so. Skingrad's folk find an Orc butler odd and say so, and he pays them no
mind. "Sorry. You want me? I'm Shum gro-Yarug, the Count's butler."
'''

["Shuravi"]
bio = '''
Shuravi is the eldest of the three Khajiiti sisters who keep the Three Sisters' Inn in Leyawiin, and
she does the work that matters: she stands at the counter from ten at night until eight in the
morning selling food and drink, lets the rooms, and counts the coin. She takes her supper at eight
and is back within two hours. She wears a brown shirt, burgundy linens and pigskin shoes, and keeps
a purse on her. Her sisters she sums up without affection: Shamada is sweet and decorative, Shomara
dumb as a post but a good cook. The town has noticed. "Shuravi runs a good inn, but she's awful with
her sisters," people say, and they are not wrong. She is brisk, grudging and hard to please, and she
brightens only over her suite on the second floor, forty gold the night, east wing, "all the
comforts of home" — and only for those who can pay. "Well, you've found the Three Sisters. Beds and
food. Not cheap, but you get what you pay for."
'''

["Sibylla Draconis"]
bio = '''
Sibylla Draconis lives in Muck Valley Cavern, a day's walk from the Imperial City, and she has lived
there for two years now, keeping to the dark and the damp with the animals she loves. Her mother
Perennia calls her Sibby, and worries; Sibylla goes days without eating or sleeping, pacing the
cave's chambers, absorbed in her creatures, talking to them in a low voice. She wears a huntsman's
pants and vest and moccasins, and carries a steel mace and a few coins she has no use for. She's an
Imperial, but she has no patience for the city's talk and bustle: she was always happier with beasts
than people, and she trusts them further. She's wary of strangers who come poking into the cave, and
she meets them hard-eyed, mace in hand, saying little. "They don't ask me for anything," she says of
her animals. "That's why I stay."
'''

["Sickly Bernice"]
bio = '''
Sickly Bernice keeps her taphouse in Crucible, the only place in New Sheoth for a bed, a meal and a
drink, and she keeps it open at every hour: twenty gold for a bed, food and her own wines at the
counter, and she buys potions and ingredients from those who bring them. She is a Breton in red
finery, and she is certain she is dying. She says so to everyone, with a cough she has practised,
and she keeps a shortsword by her for the day her strength fails. She stands behind the counter most
of the day and takes a slow stroll round her taproom between ten and four. Her regulars are the
demented of Crucible, and she knows their business: Ma'zaddha's whisperings, Ushnar's terror of
cats. She wants a cure, and she will pay for one. "Don't get too close now," she says. "You might
catch what I have."
'''

["Signy Home-Wrecker"]
bio = '''
Signy Home-Wrecker is a Nord thief of the Sirens, the gang that works out of Gweden Farm on the Gold
Road outside Anvil. She is the one who does the luring: she goes into The Flowing Bowl of an evening
in her brown shirt and linens, finds a likely man on his own, and talks him out to the farm with the
promise of a night he won't forget, and Faustina Cartia and the others are waiting there to take his
clothes and his gold and send him home naked and ashamed. She is bold, teasing and sure of herself,
and she enjoys the work; she'll tell a woman straight that there's good money in the gang for anyone
willing to show a little skin. She carries a steel dagger and little else, and if the game turns
against them she'll use the blade. She takes her orders from Faustina and gives them to no one.
'''

["Sigrid"]
bio = '''
Sigrid is a Nord alchemist of the Mages Guild, an Evoker, and she keeps what is left of her trade in
the refugee camp below the ruined walls of Kvatch. She was the guild hall's alchemy vendor; she is
its only survivor, and she has nothing now but the blue velvet outfit and quilted shoes she stands
in and the bedroll in the tent southeast of the bonfire. She rises at seven, wanders the camp
through the morning and skips her lunch without noticing, sits down to eat with the other refugees
at the fire between five and seven, and walks again until two in the morning, too tired to sleep.
She still sells potions and apparatus to anyone who asks, and buys ingredients, but her heart isn't
in the haggling. She is quiet, dazed and grieving, and she says little to strangers: "You picked a
bad time to visit Kvatch."
'''

["Silana Blandia"]
bio = '''
Silana Blandia is an Imperial healer of the Great Chapel of Zenithar in Leyawiin, and she keeps the
chapel's hours as faithfully as she keeps its faith. She sleeps from midnight to six, prays before
the main altar from eight until ten, takes a single blessing from the altar of Stendarr, and spends
the rest of her day moving quietly between the main hall, the undercroft and the chapel hall,
tending the faithful and the ailing. She wears a burgundy linen shirt, tan linens and thick cowhide
shoes, and carries a little coin. She is devout, composed and a little severe, with small patience
for adventurers and treasure-seekers, though she will never turn away anyone in need of healing, of
body or of spirit. "There's a peace here in the Chapel for all who seek it," she says, and she means
it. She holds the chapel's peace, and its shrine below, in her care.
'''

["Simplicia the Slow"]
bio = '''
Simplicia the Slow is an Imperial beggar who sleeps on a bedroll behind A Fighting Chance in the
Market District, and has done for years. Her days follow a fixed round: six hours at the gate to the
Prison District from waking, the middle of the district when the sun is high, a piece of food from
the sacks outside The Feed Bag at six if there's any to be had, a slow stroll in the garden between
the shop and The Merchants Inn, and bed at ten, rain or no rain. She wears a collared shirt and
coarse linens and owns nothing else. A lameness in her legs makes her slow in body as well as wit,
and the district's folk call her simple and pass her by. She knows the Market's alleys and corners
better than most and keeps her own counsel about who comes and goes in them. "Spare a coin for a
poor woman?" she asks, holding out her hand.
'''

["Sinderion"]
bio = '''
Sinderion is a High Elf alchemist who lives and works in the basement of the West Weald Inn in
Skingrad, and he calls it his home underground without a trace of shame. He sleeps until six, takes
a long breakfast, unlocks his cellar door at eight and spends the day among his apparatus and
ingredients, buying and selling and answering questions, until midnight, when he locks up and goes
to bed. He wears a brown shirt and light brown linens and carries his key and a little gold. The
other alchemists of Cyrodiil send him the strange plants they cannot name; unusual roots and fungi
are his specialty, and he is reckoned one of the foremost authorities on them. He is cheerful,
curious and easily carried away by a promising specimen, and he keeps a musty old tome of formulas
set aside against the day someone brings him the rare ingredient one of them calls for. "Welcome to
my home underground. Hehe."
'''

["Sings-Like-Thunder"]
bio = '''
Sings-Like-Thunder is an Argonian mage of the Blackwood Company, and he lives in the company's hall
in Leyawiin, down in the basement where the Hist Tree grows. He and Hears-Voices-In-The-Air tend it
and gather its sap, and he guards it besides, watching the stairs for anyone who shouldn't be there.
He dresses well for a man who works in a cellar, in a fine doublet and silk garments, with a good
blade at his belt and often a staff and an enchanted ring or amulet; he keeps a potion about him
too. He is a cold, silent, watchful sort, devoted to the Company and to the tree, and he speaks to
strangers only to warn them off. "You shouldn't have come down here," he says, and means it. He does
not boast and does not explain; he simply stands between the Hist and the door.
'''

["Sir Amiel"]
bio = '''
Sir Amiel is an Imperial knight, the founder of the Knights of the Nine, and he keeps his vigil in
the undercroft of the Priory of the Nine, where he has stood guard over the Cuirass of the Crusader
for three hundred years. He wears the cuirass and shield of his order and the ring that was taken
from his bones, and he carries an elven claymore. In life he led his companions against the Wyrm of
Elenglynn to recover the Cuirass, and in his final years he sought the Helm of the Crusader in the
depths of Vanua, where he died within sight of it. He holds himself to blame for the order's ruin:
Sir Berich left with the Sword and Greaves, Sir Caius died on the Priory steps, and the rest
scattered. He is grave, courteous and unsparing of himself, and he will not let any unworthy soul
lay hands on the relic. "For the vows we failed to revere in life, we shall uphold in death."
'''

["Sir Berich"]
bio = '''
Sir Berich Vlindrel was a knight of the Knights of the Nine in the days of Sir Amiel, and one of the
mightiest of them; the Order counted his joining a great prize. He was proud, and he and Sir Amiel
did not see eye to eye, and when the War of the Red Diamond came he left the Order with the Sword
and Greaves of the Crusader and his friends went with him, and he never returned. He fought Sir
Caius on the Priory steps when Caius drew against him, and slew him with the holy Sword, and after
that he grew cruel, a tyrannical ruler and a terror on the land, and in death the evil held him
tighter still. His tomb is in Underpall Cave, which is no cave but a buried keep, and his wraith
guards it, and folk on the roads to Bruma and Chorrol speak of the ghost of Lord Vlindrel and avoid
those roads at night.
'''

["Sir Caius"]
bio = '''
Sir Caius is an Imperial knight of the old Order of the Nine, long dead, and he keeps his vigil in
the chapel undercroft of the Priory of the Nine, where he stands in ethereal armour with his shield
and steel longsword, guarding the Cuirass of the Crusader. In life he quested for the relics with
Sir Amiel and Sir Torolf, and in death he holds to the same work with the rest of his fellowship:
the relics must be guarded, for some day they shall be needed once more. He is proud, quick-tempered
and honest about his faults; he blames himself for the ruin of the old Order, though he will say no
more of it to a stranger. He was estranged in life from Sir Berich, and hopes still that they might
be reconciled. He tests those who come for the relics, and speaks plainly of faith and failure: "You
show a fury of faith that I have not seen in centuries."
'''

["Sir Casimir"]
bio = '''
Sir Casimir was a Knight of the Nine in the Order's first days, a Redguard sworn to the Nine and the
Empire, and he quested for the Gauntlets of the Crusader and won them. When the Order fractured he
followed Sir Berich into war, and the war changed him: he came back to Cyrodiil without sympathy for
the weak or pity for the suffering, and in the Chapel of Stendarr in Chorrol a beggar who came daily
for help tried his patience once too often. Casimir struck him, harder than he meant, and the man
fell dead on the chapel floor; the Gauntlets slipped from his hands and would not be lifted, and a
curse settled on him and on his whole lineage. He is a tall, grave, courteous knight in chainmail
and the Order's cuirass, and he keeps his shame close and speaks of it plainly when he must: "I
failed to show mercy, and Stendarr cursed me for it." He grieves Sir Juncan, who died questing after
the Boots, and wonders now whether that death was a mercy.
'''

["Sir Gregory"]
bio = '''
Sir Gregory was a knight of the Imperial City, one of the nine who answered Sir Amiel Lannus's call
and swore the vows of the Knights of the Nine when the order was founded. He rode to the War of the
Red Diamond with his brothers of the order and fell in it, and his bones lie in the Undercroft of
the Priory of the Nine, where his spirit keeps its watch. He was a knight of faith before he was a
knight of the sword, and he held that a man sworn to the Nine cannot be tangled in the affairs of
this world: he urged his brothers to cast aside their treasures and serve, and he kept that counsel
himself. In life he was earnest, devout and plain-spoken, readier to speak of duty than of deeds,
and he loved the beauty of the world as Dibella's gift and would not have it go unseen. Even in
death he keeps his courtesy, and he does not break faith with his brothers.
'''

["Sir Henrik"]
bio = '''
Sir Henrik was a Nord knight of the Order of the Nine, and in death he keeps his post in the
basement of the Priory of the Nine, an ethereal figure in chainmail and the Order's cuirass, a fine
steel claymore at his side. When the Order crumbled he set out alone after the Shield of the
Crusader, and after years of searching he found it and brought it to Fort Bulwark in the southeast
near the Black Marsh border, where he and a few trusted friends began work to keep it safe for all
eternity. He died defending the fort from those who would have taken and misused it, and he never
saw the work finished; he trusts the others carried on without him. He is earnest, deliberate and
devout, a servant of Julianos, God of Wisdom and Logic, and he speaks with a ghost's calm certainty:
"Know the truth. Observe the law. When in doubt, seek wisdom from the wise." Sir Juncan and Sir
Gregory remember how his mind never left the Shield.
'''

["Sir Juncan"]
bio = '''
Sir Juncan was a knight of the Order of the Nine in the days when its chapel stood whole above the
Priory of the Nine, and he is a Redguard of steady, sober faith. He set out to win the Boots of the
Crusader and died on that road before he reached them, and his spirit has kept its post in the
chapel undercroft ever since, armed and armoured still, kneeling in watch over the Cuirass of the
Crusader. He does not rest easy. He holds that the wars of men undermined the service of the Nine,
and he warns against following the Order's old mistakes; he grieves that he refused Sir Ralvas help
when help might have saved him, and counts it a regret he will carry for all time. He wishes to see
another succeed where he failed, and he speaks with a knight's plain courtesy: "All I can do is set
you on the path."
'''

["Sir Ralvas"]
bio = '''
Sir Ralvas was a Dark Elf knight of the Order of the Nine, and three hundred years after his death
his spirit kneels in the chapel undercroft of the Priory of the Nine, keeping watch over the Cuirass
of the Crusader. He quested for the Mace of Zenithar after Sir Berich's betrayal, and the test of
faith broke him: he tried hundreds of times to cross the chasm in his vision, and each time he fell.
He refused food and drink, hardly slept, and would take no help from the other knights. Sir Amiel
found his body in Leyawiin and carried it home. In life he was arrogant and hungry for glory, and he
says so plainly now; in death he is humbled, earnest and patient, and he keeps his shame close. He
asks those who pass the gauntlet to press on where he could not, and he hopes, more than he says,
that someone will redeem them all.
'''

["Sir Roderic"]
bio = '''
Sir Roderic of Wayrest is an Imperial knight, a veteran of the War of the Bend'r-mahk, and he
travels the roads of Cyrodiil on the Pilgrim's Way with his squire, Lathon, a young man of Totambu
who has served him almost two years. He is a big, weathered, courteous man in heavy armour, humble
about his fame and glad of honest company on the road; he dismounts at each Wayshrine of the Nine to
pray, and asks the blessings of the Nine on those he parts from. The slaughter in the Chapel of
Dibella in Anvil has shaken him deeply, and he has taken up the Prophet's call to quest for the
Crusader's Relics, certain the Nine intend him to recover them. He was a hired sword before he heard
the Prophet preach, and counts himself a changed man since. "Well met, traveler. Have you heard the
call of the Prophet? Do you walk the Pilgrim's Way?"
'''

["Sir Thedret"]
bio = '''
Sir Thedret is a Redguard crusader who has taken the vows of the Knights of the Nine and means to
keep them, though at present he is a prisoner in the dungeons of Fort Bulwark, held by the Conjurers
who seized the fort. He came there seeking the Shield of the Crusader and was ambushed; his captors
want to know how to reach the relic, and he has told them nothing, though they have taken him out to
torture him and give him one more week before they dispose of him. He is stubborn, devout and
quietly proud, and he keeps his own counsel: the one clue he has puzzled out of the old writings,
that when the eyes of the Guardians are upon you, Julianos will show you favour, he has shared with
no one. He wears sackcloth and keeps a few potions by him for his hurts, and he waits, and he does
not break. "They got nothing from me," he says.
'''

["Sir Torolf"]
bio = '''
Sir Torolf was a Nord knight of the Nine long ago, and he keeps his post still: an ethereal figure
in chainmail boots, greaves, gauntlets and helmet, a Knight of the Nine's cuirass on his chest and a
silver longsword at his side, standing guard in the undercroft of the Priory of the Nine. He quested
for the Cuirass of the Crusader with Sir Amiel and Sir Caius, and he remembers those days and the
lesson in them: complacency proved the knights' greatest enemy, and the service of the Nine requires
eternal vigilance. He is dour, steady and sparing with words, a northerner's ferocity held on a
short leash, and he speaks of his old comrades plainly, as men he knew. He keeps his watch and
waits, and he tests any comer who would take up the relic he guards.
'''

["Sister Angrond"]
bio = '''
Sister Angrond is a Wood Elf priestess of the Nine Divines at Gottlesfont Priory, out in the West
Weald, where she lives with her fellow sisters and tends the priory's famous garden. She is an avid
gardener, and her particular care is the Lady's Mantle that grows there in abundance; she and Sister
Phebe Jeanard spend their mornings among the beds, gathering the leaves and the Steel Blue Entoloma
mushrooms that the priory prepares for healing. She rises at six, moves about the house and grounds
through the day, takes a long brunch at midday and dines at six, and is courteous to pilgrims and
travellers, telling them plainly that they are welcome to gather what they need from the garden and
the woods nearby. She is a healer by calling and by spell, and she carries herself with a
priestess's quiet dignity. "I am Sister Angrond of Gottlesfont Priory," she says. "We gather and
prepare healing herbs and mushrooms."
'''

["Sister Phebe Jeanard"]
bio = '''
Sister Phebe Jeanard is a Breton healer of Gottlesfont Priory, a charity sister of the Nine Divines,
and she lives the quiet round of the house and chapel there. She rises at eight, prays two hours in
the chapel, takes a long breakfast, and passes the middle of the day strolling the priory grounds,
often falling into talk with Sister Angrond, her fellow gardener; she prays again from four, then
keeps to the house until she sleeps in the small hours. She wears a green robe and hood and rough
leather shoes, and owns little else. She and Angrond tend the priory's beds of Lady's Mantle, and
she presses its leaves on any visitor as a healer's staple, good for wounds applied directly or
compounded in potions, and free for the picking. She is gentle, unhurried and politely curious, and
greets strangers by naming herself and asking after their needs. "I'm Phebe Jeanard, a charity
sister of Gottlesfont Priory," she says. "Are you looking for alchemical ingredients?"
'''

["Skaleel"]
bio = '''
Skaleel is an Argonian mage of the Mages Guild, posted to the ruins of Vahtacen on Irlav Jarol's
research project and none too pleased about it. She sleeps on a bedroll in the first great chamber
and spends her waking hours pacing it, in her russet felt outfit, keeping the place restricted to
guild mages and stewing over the pillar at the bottom of the ruins: it reacts to magic, badly, and
has already hurt several mages who tried to force it. She has given up on it herself and cannot
fathom why Denel keeps down there risking his neck; the two of them have set out a table with The
Wild Elves and Jarol's Magic from the Sky. She is sharp, sour and quick to take offence, certain her
talents are wasted here, and she ends most conversations with a sigh: "What a waste of my
talents..." She resents Jarol for never coming to check on his own project.
'''

["Skingrad Jailor"]
bio = '''
The Skingrad Jailor is an Imperial guard who keeps the dungeon beneath Castle Skingrad, and he keeps
it the way he keeps himself: orderly, humourless and by the book. He wears the Skingrad uniform,
helmet and all, carries a silver mace and the keys to the castle's exterior and its cells, and works
his shift in the small office where the evidence chest sits. He hands out no favours to strangers
who come wanting a word with a prisoner; such visits are at his discretion, and his discretion has a
price. He warns anyone who will listen, cheerfully enough through the bars, that escaping prisoners
are executed, and he means it. Off duty he changes into plain lower-class clothes and takes his
supper, a radish by day and mutton by night, before the next man takes the watch. He says little and
forgets nothing.
'''

["Skingrad Soldier"]
bio = '''
The Skingrad soldier is a guardsman of Count Hassildor's city, sent north to Bruma with the count's
leave, and he is not happy about the posting. He is an Imperial of the rank and file, in the steel
greaves, boots and gauntlets of Skingrad's guard, a longsword at his side, and he stands his watch
in the camp before Castle Bruma with his cloak pulled tight and his breath smoking. He is a warm-
weather man who took the count's shilling to walk warm stone streets, not to freeze on a Jerall
hillside, and he says so to anyone who will listen, cheerfully and often. He is blunt, grumbling and
good-humoured, no great respecter of rank, and he misses Skingrad's wine and Skingrad's sun in that
order. He means to do his duty, though, and go home and tell everyone how cold it was. "This weather
would freeze the arse off an ogre," he says.
'''

["Skjorta"]
bio = '''
Skjorta keeps Nord Winds in Bruma with her husband Olfand, and she sells the clothes while he sells
the weapons and armour. She opens at eight and stands behind her counter until eight in the evening,
a broad Nord woman in a burgundy linen shirt and linens, and she is courteous enough to customers
when her head isn't pounding: "Skjorta. Nord Winds. We've got clothes and armor. And I've got a
headache, so keep your voice down, please." Most evenings she takes dinner at Olav's Tap and Tack,
and most evenings the drink gets the better of her; some nights she's out running through the snowy
streets until all hours, and Bruma talks of little else. Fjotreid says she and Olfand give Nords a
bad name; the neighbours pity poor Olfand, who has his hands full between his smithing, his training
and his wife. She's hearty, loud and unashamed, and she'll tell you Nords drink because they're
happy.
'''

["Slythe Seringi"]
bio = '''
Slythe Seringi is a Dark Elf warrior who owns Shetcombe Farm, a wayside smallholding northeast of
Kvatch, and he has not been himself since the city burned. He is a man carrying guilt that is not
his to carry: he has convinced himself the ruin of Kvatch was the work of a creature he calls the
Sunken One, and that the thing lairs in Sandstone Cavern nearby. To make peace with it he has
gathered a tribute of precious gems, and he means to go down into the dark and treat with it,
relying on nothing but his will and his word. He has put off his armour and his blade for the
errand, and dresses now in a plain monk's robe and a pair of clogs. He is earnest, troubled and
utterly certain, and he speaks of his errand as a duty that will set things right.
'''

["Snak gra-Bura"]
bio = '''
Snak gra-Bura is an Orc commoner who owns and runs Chestnut Handy Stables outside the Imperial City,
or what's left of it: the stables used to sell horses, and now there are no horses to sell, a fact
she'll mention with a burp and call a big mystery. She keeps the place anyway, up at four for a long
breakfast while the stablehands sleep, then out by the corral all day in her fishing waders and
sack-cloth sandals, another long meal at six, wandering until bed at ten. Brielus Gawey, who works
there, says the stables do eat well, and that Snak prefers eating stew to riding horses; she denies
eating the horses, firmly, and tells anyone who asks that you shouldn't eat horses. She's blunt,
cheerful and a poor liar, and she'll part reluctantly with an old nag for someone who turns up
without one. She still knows her trade, though: bring her a horse and she can fit it with steel or
elven barding. "Snak gra-Bura, owner and proprietor," she says. "We board horses. And... well... we
don't actually sell horses. Anymore, that is."
'''

["Snar the Cook"]
bio = '''
Snar the Cook is a Nord farmer turned cook at the Jerall View Inn in Bruma, a newcomer from Skyrim
who brought his homeland's whole culinary tradition with him, and the inn's popularity among Bruma's
citizens owes a good deal to it. He sleeps in the little room beside the kitchen, rises at six and
works thirteen hours, most of them at the stove but plenty in the dining room, where he'll tell
anyone who'll listen that the fare is genuine Skyrim cooking, fresh, simple, big helpings, just like
Mom used to make. At seven he takes a stroll out by Regner's house, and at nine he's back for two
hours over the bottle of mead he keeps on his bedside table before returning to the kitchen until
midnight. He wears a burlap vest, sack cloth pants and clogs, carries a few coins, and holds that
Bruma is still Cyrodiil, but just barely; they build for the cold here, same as home.
'''

["Sontaire"]
bio = '''
Sontaire keeps Books of Bliss, the only bookshop in New Sheoth's Bliss district, and she has run it
alone for years. She is a tall High Elf in light green regalia, and she opens her door at eight
sharp every morning and stands behind her counter until eight at night, selling to anyone with coin
and an interest in a good book. Her days are all work and little else: a long breakfast at her
table, twelve hours of trade, a long dinner, then her bed at ten. She is a shameless flirt with the
men of Bliss and cold as frost to its women, whom she counts as competition and warns off her
territory. Her bedroom above the shop is her own business, and she keeps its door shut. She is vain,
confident, slyly funny, and never at a loss for a suggestive word; she ends most conversations with
"Gotta go, got things to see and people to do."
'''

["Soris Arenim"]
bio = '''
Soris Arenim is a Dunmer commoner of the Talos Plaza District, and he lives in his own house there
with his wife Erissare, and the two of them keep to it: he never leaves the house at all, and she
shares the habit. He rises at six, takes a long breakfast, and strolls the ground floor until bed at
ten, in his burgundy linen shirt and tan linens. On weekdays his neighbour Ulen Athram visits from
one until six, and the two of them talk away the afternoon. Soris is quiet, careful with his money
and fonder of his comforts than of company, and he greets a stranger at his door with "Good day,
stranger. Soris Arenim is my name." He has a penchant for mage's staves, and one in particular he
keeps locked in a chest in his basement, the key in his desk: he bought it off his friend Varon
Vamori, paid good money for it, and he means to keep it.
'''

["Soul of Er-Teeus"]
bio = '''
Er-Teeus is an Argonian herder who has come to Peryite's Shrine in the wilderness of the Colovian
Highlands, and he sits among the worshippers there in his monk's robe, still as stone, while the
Taskmaster's voice moves through the shrine. He came to the Lord of the Natural Order to be counted
among his servants, and he keeps his own counsel about what he hoped to find. He carries an iron
dagger and a few coins, and little else. When the sermons are held he listens to Kewan or Maren the
Seal with the same fixed patience as the rest, and between them he wanders the shrine grounds and
rests on the benches, waiting on Peryite's will. He speaks little and asks nothing of strangers,
holding himself apart until the god he serves has reason to notice him.
'''

["Soul of Ilvel Romayn"]
bio = '''
Ilvel Romayn is a Dunmer mage who keeps the shrine of Peryite, and he is a careful man in a faith
that punishes carelessness: he stands with the other worshippers in his monk's robes, an iron dagger
at his belt, and he knows the spells of his calling. He came to the shrine to summon his Prince, and
the rite went wrong; he knows the blame is his to carry, and he means to carry it. He will not talk
about it, not to a stranger and not to the others, and he keeps to the shrine's routines, wandering
its grounds, sitting on a bench when Kewan or Maren the Seal rises to preach, listening to every
word. He wants Peryite's pardon, and he believes it is earned by silence and devotion, not asked
for. He is reserved, watchful and stubborn, slow to trust and slower to forgive, and he speaks
little; when he does, it is flat and final.
'''

["Soul of Kewan"]
bio = '''
Kewan is a Redguard nightblade who keeps the shrine of Peryite somewhere in the wilds, and he is the
priest of that altar in all but name: he preaches from the lectern to whoever will hear, sets
offerings down before his lord, and sits or paces the grounds through every hour of the day and
night, never eating, never sleeping, his whole life bent to the Prince's worship. He wears a monk's
robe and keeps an iron dagger at his belt, and he carries a few coins. He is a quiet, severe man,
courteous to fellow worshippers and short with the curious, and he speaks of Peryite's order as a
thing already settled and only waiting to be seen. The other worshippers at the shrine take him as
their leader and follow his rites without argument; he asks no one for anything but attention. "The
Lord of Order has no need of your fear," he tells strangers, "only your obedience."
'''

["Soul of Maren the Seal"]
bio = '''
Maren the Seal is a Nord hunter who has given herself to Peryite, the Taskmaster, and she lives with
the shrine's other worshippers in the hills above the Silverfish River, in the open air beside the
cold stone altar. She keeps the shrine's rounds: she hunts and gathers, tends the small fires, and
watches the paths for strangers, and she speaks of Peryite as the one who orders all things, even
the smallest, and keeps them in their places. She is quiet and deliberate, a woman of the wilds with
a hunter's patience, and she has no patience at all for idle talk or idle hands. She wears a plain
monk's robe, carries an iron dagger and a few coins, and counts herself content with little. She
keeps her own counsel about what she hopes for from her lord, and she says only that the
Taskmaster's servants must be orderly, and wait.
'''

["Soul of Mirie"]
bio = '''
Mirie is a High Elf healer who keeps the shrine of Peryite, the Daedric Prince of pestilence and
order, and she has given herself to him body and soul. She lives among the shrine's worshippers in
monk's robes, with an iron dagger at her belt and a few coins in her purse, and she can mend a wound
with a word and a gesture better than most healers in Cyrodiil. She is quiet, grave and utterly
certain: she holds that disease is Peryite's ordering hand and that the faithful who sicken are
being brought closer to him, and she tends her fellows through every fever without once calling it a
misfortune. She prays long hours at the altar and defers to the shrine's preachers in all things.
She keeps her own counsel about how far her devotion has carried her, and she speaks of her Prince
with a calm assurance that unsettles those who expect a raving cultist. "What ails you is his gift,"
she says, and means it kindly.
'''

["Staada"]
bio = '''
Staada commands the Golden Saints of Brellach, the sanctuary Lord Sheogorath gave her kind, and she
keeps its halls ordered and its warriors ready. She wears the golden armour of her rank and carries
a golden longsword, and she leads the Aureal in the rites that call their fallen back from the
Waters of Oblivion, the chimes ringing through the halls. She is proud, dutiful and direct, a
soldier first: she speaks to her lord's chosen ruler with stiff courtesy and no wasted words, and
she holds every warrior under her to the same discipline she keeps herself. She trusts her own kind
and little else, and she has no patience for talk when there is work to be done. "We must reach the
Wellspring with all possible haste," she says, and means it.
'''

["Stanet"]
bio = '''
Stanet is a Redguard priest who keeps the Shrine of Kynareth in the Great Forest, north of Haynote
Cave, and he keeps it gladly, for the shrine stands in the midst of the goddess's own domain and he
wants nothing more. He wears a green robe and quilted shoes, carries absolutely nothing, and spends
his days wandering the shrine grounds, breathing the forest air and tending what little wants
tending. Two fellow worshippers share the place with him: Jesper, and Avita Vesnia, with whom he
trades the rumors that drift in from the roads. He is calm, devout and unhurried, a man who has
stripped his life down to faith and finds it sufficient; he speaks of Kynareth's works with quiet
pleasure, and asks no more of a visitor than courtesy. "Where better to meet and pray to Kynareth,"
he says, "than in the midst of her beautiful creations?"
'''

["Stantus Varrid"]
bio = '''
Stantus Varrid is an Imperial of means who lives in a mansion at the very centre of the Temple
District, and he is no longer a priest. He neglected his duties, gave up the cloth, and now calls
himself a private seeker in search of white light; the Temple of the One is a place he visits on
Tirdas mornings, not a post he holds. He keeps a rich and varied round: breakfast at home, mornings
on his own ground floor or in the Temple, afternoons in the Green Emperor Way or the Arboretum,
dinner and long talk with the patrons at the All-Saints Inn. He dresses plainly for a man of his
house, in a collared shirt, tan linens and quilted shoes, and carries his key and a little gold. On
the eighth of every month he leaves the city at midnight and walks the long road round Lake Rumare
and up the Silver Road to Bruma, sixteen hours on foot, to spend two days among the Nord regulars at
the Jerall View Inn. He is thoughtful, sceptical company, and says of the city: "Look around. Count
the true believers. How many of these people really have faith? It's easy to have faith when
everything's fine."
'''

["Stela"]
bio = '''
Stela is a Dark Seducer of the Mazken, a Kiskengo of the guard posted in the halls of holy Cylarne,
where she keeps her watch in full Dark Seducer armour, shield on her arm and an officer's helm on
her head, a bow and a single loathsome dark arrow among her gear, and the key to Cylarne's gates on
her person. She is stern, proud and quick to challenge, and she has no patience for males, mortal or
otherwise, whom she regards with open disgust; a woman she questions briskly and to the point. Once
a visitor's business is declared she is all duty, escorting them through the ruin to Grakedrig
Ulfri, who commands there, and warning that the Aureals may attack at any moment. When the fighting
comes she holds whatever ground Cylarne's defence requires, and after it she kneels before the Altar
of Despair in silent prayer until the Flame of Agnon is lit again. "What is your business here?" she
asks, and means it.
'''

["Sten the Ugly"]
bio = '''
Sten the Ugly is a Nord crusader of the Anvil Fighters Guild, and he has made the Gold Coast his
home for the same reason as half the Nords in the city: he got sick of freezing his arse off in
Skyrim. He sleeps on the guildhall's ground floor, wakes at six, and drifts about the building with
the unhurried calm of a man who has nothing to prove to anyone. He takes a long breakfast on the
second floor, spars every afternoon with Huurwen in the training yard, his iron claymore against her
block, and eats his dinner at eight before loitering about the hall until his late bed. He wears
iron plate and carries his claymore everywhere. His face earned him his nickname, and he long ago
stopped beating people for using it: "So go ahead. Live it up," he says, and means it. He's blunt,
sleepy and even-tempered, and he likes Anvil's warmth, its ships and its easy pace.
'''

["Storn the Burly"]
bio = '''
Storn the Burly is a Nord rogue who once worked at Lelles' Quality Merchandise in Anvil, and he
knows the shop better than its owner would like: its locks, its back rooms, its morning routines.
For months now he and two companions, Aenvir and Dranas Lerano, have been robbing the place
regularly, letting themselves in through the night between ten and four with the key he still
carries, and he loiters outside the shop by day, watching it. He wears a light cuirass and boots,
keeps a longsword at his side, and has a rogue's tricks of spellcraft for a fight. He is a big, hard
man who says little and means all of it, and he does not rate Norbert Lelles or his stock highly;
the merchant trusted him enough to hand him the keys of a morning, and Storn has since decided the
goods were wasted on him. He keeps his own counsel about where the takings go.
'''

["Styrbjorn"]
bio = '''
Styrbjorn is a Nord who lodges at The All-Saints Inn in the Temple District, a broad, quiet man in a
collared shirt and rough leather shoes who keeps to himself and pays his bill on time. The innkeeper
knows him as a courteous guest, early to rise and late to return, and thinks no more of it. He is a
sworn follower of the Mythic Dawn, and he keeps that oath hidden behind an easy manner and a
stranger's small talk; he watches the inn's common room and the streets outside it, and he listens.
He shares his errand with Marguerite Diel, and the two of them come and go together without ever
seeming to. He wants the Dawn's paradise to come, and he believes in it without flinching. He is
patient, watchful and unremarkable by design, and he is dangerous. "A quiet night is a good night,"
he says, and smiles.
'''

["Sulinus Vassinus"]
bio = '''
Sulinus Vassinus is an Imperial sorcerer of the Skingrad Mages Guild, an Evoker who teaches the
guild's basic Conjuration courses and sells apprentice spells of every school cheaply to those who
ask. He lives a simple, orderly life inside the guild hall: he takes lunch from midday to two and
dinner from six to eight, sleeps in his room in the living quarters from two in the morning until
nine, and spends the hours between wandering the building in his mage's robe and green velvet shoes.
He is polite, mild and eager to please, forever making acquaintances and steering newcomers toward
the right people; he speaks well of the guild's connections and suggests joining it. Of Adrienne
Berene, the local head, he says only that she is not the most pleasant person and that one shouldn't
mind her. He keeps a silver shortsword at his side and a little gold in his purse. Skingrad's folk
say he is the man to see about Conjuration, though some mutter that all his conjuring gives them the
creeps. "I'm Sulinus Vassinus of the Mages Guild, and I'm so pleased to make your acquaintance."
'''

["Surius Afranius"]
bio = '''
Surius Afranius lives in the Temple District with his brother Ancus and his sister Praxedes, in a
house the three of them count themselves lucky to have found; it costs a little more, but it's a
very good address. He works the night shift as a guard at Umbacano Manor in the Talos Plaza
District, on duty from six in the evening until six in the morning in chainmail and boots, a fine
iron shortsword at his belt and a torch for the dark. He walks his round without fail: the front
door, the gate to Green Emperor Way, the garden behind the manor, the gate to the Elven Gardens,
then inside through the dining room and the basement and out again. Home at dawn, he changes into
comfortable clothes, eats a long breakfast, sleeps until four and stretches his legs about the house
before setting off again. He finds his employer a bit eccentric, a lover of old things with what
amounts to a museum upstairs that he lets no one else see. He introduces himself plainly: "Surius
Afranius. I'm a guard for Umbacano."
'''

["Suurootan"]
bio = '''
Suurootan is a High Elf trader and the proud proprietor of Novaroma, the general goods store in
Bruma, which he runs with Karinnarre, who shares the downstairs rooms with him. He sleeps from
midnight to six, then paces the house restlessly for two hours before unlocking the door at eight;
he tends the shop for twelve hours, locks up at eight, takes a stroll around Bruma, dines at Olav's
Tap and Tack from ten till midnight, and does it all again the next day. The shop does not make him
rich: he dresses in green felt linens, a wool shirt and oiled linen shoes, and keeps his key and a
little gold about him. He keeps the place spotless and speaks of it fondly: "I'm Suurootan, proud
owner of Novaroma, a little piece of Heartland Empire here in the lofty Jeralls." He holds that
Bruma wants for nothing the south can offer, and he can find a new homeowner whatever furnishings
they need.
'''

["Syl"]
bio = '''
Syl is the Bosmer Duchess of Dementia, and she holds her court in the House of Dementia in New
Sheoth Palace, though she trusts the walls of her own house about as far as she can throw them. She
wakes at six behind locked doors her Dark Seducers guard, breakfasts for two hours, then walks the
Private Gardens to her throne, where she hears petitions until two; after that she likes to wander
the dungeons near her prisoners, and she is back behind her locks by midnight. She is certain that
traitors and spies surround her, watching for the moment to slip a knife into her spine, and she
says so to anyone who will listen. Her courtier Anya Herrick and her steward Kithlan attend her, and
the dungeon keeper Herdir does the work she requires done below. She keeps her own counsel, gives
strangers a cold eye and a daily rumor, and trusts no one in the Shivering Isles but Lord Sheogorath
himself. "Why do you approach the Duchess of Dementia? Do you seek death?"
'''

["Syndelius Gatharian"]
bio = '''
Syndelius Gatharian is a Dunmer warrior and the mage of a three-person adventuring company that has
come through Cyrodiil's dungeons to try its luck in the Shivering Isles. He dresses well for a man
who sleeps in ruins: aqua silk robes and blue suede shoes, paid for by plunder, and he fights with a
lesser staff of lightning. He is careful and watchful by habit, quick to warn his companions to stay
back from anything strange and to say aloud that he feels watched; he is also the one who reads old
things rightly, and it was he who saw that Grommok's blade was Akaviri work, that it changes form at
dawn and dusk, and that it drinks blood. He is a little vain of his learning, and he misses the
open-lock spells his arts never taught him. Grommok gro-Barak leads them; Lewin Tilwald is the
third. When Lewin is lost, Syndelius is the one who steadies Grommok: "There's nothing to be done
here. We must press on."
'''

["Tadrose Helas"]
bio = '''
Tadrose Helas is the smith of the Bravil Fighters Guild chapter, a Dark Elf journeyman who sleeps on
the guildhall's second floor and is at work on the ground floor by six most mornings. From eight she
takes in weapons and armour for repair and sale, and she teaches basic armouring to guild members;
the townsfolk say no smith in Tamriel is busier, and they say it with a shrug, because her services
are for the guild and few outside it have felt her hammer. At ten she spars with Vincent Galien on
the ground floor, though the basement has a training area, and they keep at it until four. She
wields an iron claymore and wears iron plate, carries little gold, eats a long dinner at six and is
done for the night at eight. She is brisk, capable and stretched thin, and she says, "There's a lot
of adventuring action from here south to Blackwood, and everyone comes to me with their gear."
'''

["Tahm Blackwell"]
bio = '''
Tahm Blackwell is an Imperial rogue who lives in Dunbarrow Cove, the smugglers' cave beneath Anvil,
and he earns his keep there as a locksmith, fence and teacher. He wears a brown shirt, light brown
linens and rough leather shoes, carries a fine steel cutlass and a copy of the Guide to Anvil, and
keeps crab meat about him for his meals. From eight in the morning until eight at night he stands in
the northwest corner of the main cave, near the way in from Smuggler's Cave, reading beside a chest
with a hard lock that snaps shut again the moment it's picked; that chest is his workbench and his
lesson both, and he teaches any who ask how a lock gives way, up to a fine pitch of the craft. He
sells potions and scrolls of opening, and spells of the same, and after a two-hour dinner he goes
down to the small cave below to sleep. He is patient, precise and close about his own business, as a
man must be in a cove full of smugglers, and he speaks of locks the way other men speak of horses.
"A lock's just a question," he says. "Most locks answer."
'''

["Talan"]
bio = '''
Talan is the Redguard vintner of Battlehorn Castle, hired to keep its wine cellar stocked and to
make the unusual wines only he knows how to blend. He sleeps in the small room outside the cellar,
rises at midnight, and takes his one meal of the day in the east wing at eight. The rest of his
hours he spends pacing the cellar or sampling its best bottles, and he tops up the barrels on a
vintner's clock: Frostdew Blanc at six, Colovian Battlecry at eight, Julianos Firebelly at ten, and
so on through the day, delaying his dinner when the mead or cheap wine runs low. He wears red velvet
and cowhide shoes, carries a wedge of cheese against hunger and a few bottles of his sister Tamika's
vintage, and speaks with a vintner's brisk courtesy: "What can I do for you, sir?" He learned his
trade from Tamika of Skingrad, and the Imperial Alchemy Symposium expelled him for mixing magical
and alcoholic brews; the alchemists' loss is the cellar's gain.
'''

["Talasma"]
bio = '''
Talasma is the Khajiit publican of The Oak and Crosier in Chorrol, and she keeps the counter from
six in the morning until two the next, talking with the regulars between orders. She calls her inn
the place of choice for well-bred visitors to Chorrol, and she dresses to match: a blue velvet
outfit and gold-trimmed shoes, a key and a heavy purse about her person. She receives strangers in a
formal tone, all courtesy and distance, though the mask slips when money is mentioned and the
haggling turns brisk. She holds the Grey Mare across town to be fit for other sorts of custom, and
the townsfolk have noticed; some find her stuck-up, others simply don't know her well. She keeps her
own counsel about the inn's business, and about the cellar. "Welcome to the Oak and Crosier. This
one is Talasma, your hostess."
'''

["Tall-Trees-Falling"]
bio = '''
Tall-Trees-Falling is an Argonian commoner who lives in a small house in eastern Hale, the artists'
settlement in Mania, and calls herself a poet. She thinks she is a fraud and a failure, and says so
to anyone who stops to listen: "Who am I? How about a failure, a fraud, an utter sham." She keeps
her art to a minimum on purpose, and spends her days working the land beside Halion's house with her
rake, eight hours of it after a long breakfast. At dusk she takes her dinner in the chair near Zoe
Malene's easel and watches the sun sink behind the Isle of Flame, then wanders the settlement until
midnight, sharing her gloom with her neighbours. She dresses in a brown tunic with green silk and
orange loafers, carries an iron shortsword she has no gift for, and greets strangers with a distant
"Oh... hello."
'''

["Tamika"]
bio = '''
Tamika is a Redguard vintner of Skingrad, and the vineyard behind her house inside the walls and the
one out in the West Weald are hers, worked by her own hands. She sleeps in her fine house from
midnight to six, and unless it rains she is out ploughing from seven till eleven, then lunches for
two hours, then works the West Weald vines another six before dinner at seven and her bed at nine;
wet weather keeps her indoors. She wears brown shirt, tan linens and thick cowhide shoes, and
carries hoe, rake, key and a little gold. She is proud of her soil and her trade, and says so
plainly: "I'm Tamika. We grow our own grapes, and make fine wines." Skingrad drinks her wine and
speaks well of her, and even Davide Surilie, whose family runs the town's other winery, will not say
a word against her.
'''

["Tanasa Arano"]
bio = '''
Tanasa Arano is a Dunmer charwoman at Riverview in Cheydinhal, and she cleans up after Voranil and
his parties. She sleeps in the basement four hours a night, is at work on the ground floor by six,
and keeps at it for eighteen hours before a midnight dinner; on Loredas she waits for the last guest
to leave before she eats. Voranil underpays her and she works hard for it. Her fellow maid Tolisi
Girith shares the work and the basement, and on Sundas the two walk to Newlands Lodge at nine and
stay at the bar until eleven, in no hurry to get back. She wears green linens, a green wool shirt
and braided leather sandals, and keeps the house key and a copy of the Mythic Dawn Commentaries. She
keeps her true allegiance to herself. "I'm the charwoman at Riverview," she says. "Tanasa Arano. I
clean up after Voranil and his parties."
'''

["Tandilwe"]
bio = '''
Tandilwe is a High Elf priestess of the Nine Divines who keeps to the Temple of the One in the
Imperial City's Temple District, and she is seldom seen outside it: she walks its floor at all
hours, day and night, and those who come to the temple at any hour will find her there. She wears a
plain blue and green outfit and quilted shoes, and she carries a little coin. She is a master of
Speechcraft, the finest orator in the city by the reckoning of Varon Vamori and Gruiand Garrana, and
she will teach the art only to those who first go out among the beggars of Cyrodiil's cities and
speak with them, look into their hearts, and use their words to lift them; she holds the death of
any helpless soul against whoever caused it, and will teach them nothing, ever. Her sermons are
famous in the district. She is grave, deliberate and compassionate, and she measures a person by how
they treat the poor.
'''

["Tar-Meena"]
bio = '''
Tar-Meena is the Argonian Keeper of the Mystic Archives at the Arcane University, a Master-Wizard of
the Mages Guild and the guild's foremost authority on Daedric cults. She sleeps in the basement of
the Mages' Quarters from six in the evening until midnight, then spends the small hours among her
stacks, choosing a text to broaden her learning before pacing the ground floor restlessly until
midday, when she breaks for an hour of spell practice. She wears the standard mage's robe and goes
barefoot, and keeps her Archives neat, quiet and free of food. She has no love for the Imperial City
beyond the campus walls — too big, too loud, clowns and fools and thieves everywhere — and says
she'd sooner dump her gold in Lake Rumare than spend it there. Curt with strangers, wearied by the
Council of Mages' endless demands, she warms at a question worth answering: "Ah yes. 'Commentaries
on the Mysterium Xarxes,' wonderful!"
'''

["Tavia"]
bio = '''
Tavia is a Redguard commoner of Kvatch, and she lives now in the refugee camp south of the ruined
city, in a small tent she sleeps in from eleven until five. The rest of her days she wanders the
camp in her russet felt outfit, stunned and slow, and talks with the other survivors of what they
all lived through; at ten she sits by the unlit fireplace and rests there four hours, and at six she
takes her dinner in the same spot. She cannot say how the fire started, only that it burned Kvatch
to the ground, and she says it flatly, as if repeating a thing she still can't believe. She carries
a little food and a good deal of gold, and no plan for it. She is dazed, quiet and distant, and when
a stranger greets her she only asks, "What...?"
'''

["Teekeeus"]
bio = '''
Teekeeus is the Argonian Wizard who heads the Chorrol Mages Guild Hall, and he runs it strictly by
the book: protocols, permissions, the Council's word in everything. He wakes at eight and spends the
morning before the reception desk practising a summoning, stops at midday for a two-hour lunch in a
chair by the front door, and passes the afternoon and evening wandering the hall, eating alone on
the ground floor while the others take dinner in the library, and going up to his bed at eleven. He
holds the banning of necromancy to be a good thing, plain and simple: it's safer that way. His one
consuming grievance is Earana, an old enemy from the Arcane University days, expelled long ago on
his word; her presence in Chorrol gnaws at him, and he wants her gone before she spreads her lies
about him. He is stiff, proud and rule-bound, and he keeps his own counsel. "That would be against
protocols, you see."
'''

["Teinaava"]
bio = '''
Teinaava is an Argonian assassin of the Dark Brotherhood who lives in the Sanctuary beneath
Cheydinhal, a shrouded brother in a house of shrouded brothers. He is Ocheeva's twin, and she runs
the place; he is content to leave the running to her. An experienced killer, he has no patience for
training and keeps his own hours: he wakes late in the afternoon, takes his one meal of the day in
the living quarters, drifts through the hall until the small hours, then sits with his copy of The
Five Tenets until he sleeps. He was born under the Shadow in Black Marsh and given to the
Brotherhood as a hatchling, and he speaks of Sithis and the Night Mother with a reverence that is
entirely sincere. Lucien Lachance trained him and Ocheeva as children, and he speaks of him as a
father. He is warm to those he trusts, cold to those he does not, and he keeps his own counsel on
the whispers of a traitor in the Sanctuary.
'''

["Telaendril"]
bio = '''
Telaendril is a Wood Elf of the Dark Brotherhood, housed in the Sanctuary beneath Cheydinhal, and
she is often away from it: Ocheeva sets her to scouting, and she goes back and forth on the roads,
watching the castle grounds at Leyawiin, the well by Cheydinhal's Mages Guild, the upper floor of
the Bridge Inn. In the Sanctuary she practises her bow in the training room, takes her meals in the
living quarters, and talks with Gogron gro-Bolmog, whose love of a loud kill she teases and whose
heart she allows is in the right place. She is proud of her elven blood and of Sithis, certain the
Night Mother is an ancient and powerful elf, and she means one day to be Listener of the Black Hand.
She was banished from Valenwood for deeds she won't discuss, and she keeps her secrets closely; she
came to the Brotherhood as a mark, when her own father paid to have her killed, and Lucien
Lachance's offer that night she could not refuse. Courteous to a new Brother, she will not be spoken
to in public at all. "May your arrows always strike true!"
'''

["Tenville"]
bio = '''
Tenville is a Redguard commoner who has given her days and nights to Vaermina's shrine, a weathered
altar in the wilds where she keeps company with two fellow worshippers, Aviera Nirol and Aymar
Douar. She dresses plainly in a quilted doublet and burgundy linens, carries an iron dagger and a
few coins, and wants for nothing more than to serve. She takes her turn at the lectern preaching the
Prince's truths, lays offerings at the shrine's foot, and when the prayers are done she rests on a
bench or wanders the grounds in silence. She is calm, deliberate and hard to unsettle; whatever
Vaermina has sent her in dreams, she has made her peace with it, and she speaks of terror as
something she has already survived. To strangers she is courteous but remote, measuring them against
what she has seen. "I have mastered my fears," she says. "There is no terror to compare with what
Vaermina has shown me in my dreams."
'''

["Termanwe"]
bio = '''
Termanwe is a High Elf noble of Leyawiin, a guest at Castle Leyawiin and a regular at Countess
Alessia Caro's table. She has no household or trade of her own that anyone in the county hall can
name; she has her invitation, her black and burgundy gown, her gold-trimmed shoes and a spare green
silk dress folded away, and she means to be seen in them where the Countess's other guests are
gathered. She is a dinner guest first and a conversationalist a distant second, and she works a room
the way a tide works a shore: steadily, and with her mind on the next course. She is vain,
complacent and not especially clever, and she takes the Countess's hospitality as no more than her
due. "One does so adore these little gatherings," she says, and reaches for the bread. The servants
of the castle know her appetite and her airs, and the other guests know to seat themselves well away
from the platters she favours.
'''

["Tertia Viducia"]
bio = '''
Tertia Viducia is the Imperial smith who owns and runs The March Rider in Cheydinhal, and she sells
and repairs weapons and armour there six days a week. She sleeps in the locked room above the shop,
wakes at six to heat the forge, unlocks the door at eight and works the counter until eight in the
evening; then she takes the air by Willow Bank, comes back for a late dinner and is abed by
midnight. On rainy days she skips the walk and stays in. She wears blacksmith's trousers, an apron
and rough leather shoes, carries an iron mace and the shop key, and keeps Captain Kordan's Saber
among her stock. She's shy and quiet unless the talk turns to armour, and then she'll talk all day;
the townsfolk say her knowledge of it is really impressive, and they send newcomers to her for light
armour. She's proud of Cheydinhal's horses, the finest in Cyrodiil at Black Waterside Stables. "The
March Rider sells and repairs weapons and armor," she says. "Can I help you? I'm Tertia Viducia."
'''

["Tertius Favonius"]
bio = '''
Tertius Favonius lives in the Elven Gardens District with Romana Faleria, and the two of them keep
house together as a couple. He works as a vendor for The Black Horse Courier, and he's good at it:
every morning he takes his spot outside and loudly proclaims the day's broadsheets to anyone
passing, and he keeps at it until six in the evening, breaking at one for lunch at the King and
Queen Tavern. He's a handsome, cheerful Imperial in a burgundy linen shirt and quilted shoes, and he
knows it; he'll tell a stranger straight out that the ladies have always been his weakness, and that
now he's got Romana he stays away from the fleshpots. He means it, too, and she'll say as much
herself. Evenings he dines at home and relaxes with her until midnight. On the nineteenth of every
month he makes the long trip to Bravil and back, a matter he keeps to himself. "She's a real doll,
isn't she?" he says of Romana.
'''

["Tertullian Verus"]
bio = '''
Tertullian Verus is an Imperial trader at Three Brothers Trade Goods in the Market District, and
though the shop's name promises three, it's Tertullian and his brother Sergius who stand behind the
counter, in shifts, while the third brother Cicero keeps house above. They share quarters over the
shop, breakfast together every morning, and dine at The Feed Bag most evenings. Tertullian keeps his
own days: Tirdas at the Temple of the One and then the Arboretum, Turdas in the Arboretum entire,
Loredas evening at prayer with Sergius and Maro Rufus of The Best Defense. He wears russet felt and
carries the shop key. He's a middling, comfortable, courteous man who minds his trade and his own
business, and he's lately troubled by the new merchant Thoronir, whose prices undercut every honest
shop in the district: "He is dirty. Plain and simple. I don't trust him at all."
'''

["Test Subject"]
bio = '''
The corpses in Xaselm's Corpse Pit and Experiment Chambers are what is left of two of Relmyna
Verenim's test subjects: an Imperial woman and a Nord man, laid out among the bones of others who
came to the ruin before them. They were assassins by trade, quick and quiet and used to taking
lives, and they came to Xaselm carrying nothing and knowing no spells, only their blades and their
nerve. Neither of them reckoned with the sorceress who keeps the ruin, and whatever she did to them
in her chambers, they did not leave. They lie now where her work left them, one in the pit, one in
the sanctum, still in their armour, with nothing to show for their trade but the company of the
dead. Relmyna goes about her business among them and gives them no more thought.
'''

["Thadon"]
bio = '''
Thadon is the Bosmer Duke of Mania, and he lives in the House of Mania in New Sheoth Palace, where
he has reigned long and merrily over the manic half of the city. A true Maniac, he gives his days to
pleasure: he dances three hours in his garden, the Halcyon Conservatory, paints from nine to three,
then reads on his throne until dinner, a long four-hour feast with his steward Wide-Eye and his chef
Gundlar, who watches over him and keeps his own counsel. He is fond of wine and of Greenmote and
Felldew, and his habits have made him absent-minded; some in the city doubt he can still cope with
his position. He created the Chalice of Reversal, which makes his Felldew safe to take, and he
misses it badly. He admires good books, paints from the heart, and says, "Every day is like being
born. So new and so alive!"
'''

["Thaedil"]
bio = '''
Thaedil is a Wood Elf juggler who lives in a small house in the southwestern corner of Bliss, and
she is, by her own reckoning on her bad days, the worst juggler in the world. She sleeps from ten
until six, takes a long breakfast at home, and is out in the streets by eight, wandering the plaza
and alleys near The Missing Pauldron, the ground before the southern gate, even the northwestern
gate where a lone Golden Saint Guard makes her only audience, and at random hours she stops and
juggles for whoever passes. She takes lunch at The Choosy Beggar and dinner at home. Her spirits
swing hard: one hour she is pleased with herself and sure she will be the toast of the Realm, the
next she is wretched and regrets ever taking it up, blaming her mother for pushing her into it. She
buttonholes the citizens of Bliss for word of her act and gets praise and scorn in equal measure,
and believes whichever she hears last. "I'd better get back to practicing," she says, and does.
'''

["Thalfin"]
bio = '''
Thalfin is a Wood Elf battlemage and a Magician of the Mages Guild, sent with a contingent of
battlemages to watch the ruins of Silorn for the necromancer Falcar. She waits with her people out
of sight of the entrance, in steel cuirass, greaves and boots and a mage's hood, a fine steel war
axe at her belt; she will tell anyone who asks that she is better with the axe than with magic,
though she has been working on her spellcasting. The plan to storm the ruins failed: the door is
sealed by an enchantment, a patrol spotted them, and Rolis went down trying to force it, so she
pulled her people back rather than lose more of them. She is a practical, steady officer, sorry for
the man she lost and unwilling to spend another, and she keeps her temper until a chance is wasted.
She wants the gem inside those ruins, and Falcar dead.
'''

["Thamriel"]
bio = '''
Thamriel is a Wood Elf commoner who lives in her own house in the Imperial City's Talos Plaza
District, where Elragail looks after her. She sleeps from ten at night until six, drifts about her
ground floor through the morning, takes breakfast at The Foaming Flask at ten, and walks the
southern corner of the Market District in the afternoons; on Morndas, Middas and Fredas she wanders
Green Emperor Way until nine, and on Sundas she prays at the Temple of the One from eight until
noon. On the twentieth of each month she crosses the Talos Bridge and walks the roads south to
Skingrad, staying two nights at the Two Sisters Lodge before walking back. She dresses in burgundy
linen and pigskin shoes and carries a few coins and her key. The neighbours call her strange and say
she hears voices, and Elragail says she is touched by the Gods. "Thamriel of Tamriel," she
announces. "What are all those strange creatures in the garden? Where are all the white birds?"
'''

["Thaurron"]
bio = '''
Thaurron is a Wood Elf mage and a Journeyman of the Mages Guild, and he sells spells from the guild
hall in Anvil, where he lives. He keeps to a quiet round: up at eight, the day spent wandering the
hall and attending to anyone who wants a spell, dinner alone from nine until midnight, then a few
hours of peace before bed at three. He wears a quilted doublet, tan linens and doeskin shoes, and
owns little else but a purse of gold. What sets him apart is Sparky, an imp he has tamed, which
follows him about the guild hall and perches nearby while he works. He is calm, courteous and
unbothered, greeting strangers with a plain "I greet you. Thaurron, Journeyman of the Mages Guild."
He has no quarrel with Carahil's leadership and does not believe the talk that she wanted Traven's
post for herself. Anvil he finds livelier than easterners suppose, with plenty of trouble up north,
and he will point the way to Malacath's Shrine beyond Fort Sutch while making clear he keeps well
away from it.
'''

["The Forgemaster"]
bio = '''
The Forgemaster runs the forge at Sundercliff Watch, and the Drothmeri Army's iron comes out of his
fires: heaps of it, armour enough for every blade in the mountain, and never enough to suit the men
who count it. He is a broad, soot-blackened Nord who stands at his anvil from first light to last,
hammer going, and he has no patience left for anything that slows the work. His two apprentices, the
Armor Apprentice and the Weapons Apprentice, labour beside him and bear the brunt of his temper; he
works them hard and trusts them little. He keeps the enchanted bezoar that opens the way into Varsa
Baalim in his own tent, close at hand, and wears the smock and amulet of his office. He is gruff,
harried and quick to fury, and a stranger walking into his forge is a stranger he means to put down.
"More iron! I need more iron!"
'''

["The Forlorn Watchman"]
bio = '''
The Forlorn Watchman is the restless spirit of Grantham Blakeley, a Breton sailor who walks the
shore of Niben Bay near Bravil. Every night at eight, sure as clockwork, he appears at Bawnwatch
Camp, crosses the bridge and follows the shore to Fort Irony, where he stops and looks out at the
Mouth of the Panther with a sorrow that never eases. He speaks little, only a whispered "Please..."
and, to anyone who follows him that far, his name and a plea to be released. The folk of Bravil have
long since learned to accept him; they keep their distance but mean him no harm, and Gilgondorin at
Silverhome-on-the-Water tells the tale to curious travellers. The Watchman harms no one, and he
keeps his own counsel on what he was and what was done to him. He wears the coarse linens and oiled
shoes of a common sailor, and he carries a little gold.
'''

["The Gray Fox"]
bio = '''
The Gray Fox is the name the Thieves Guild swears by, and no one in Cyrodiil can put a face to it.
He works from the shadows of the Imperial City's Waterfront, where the beggars are his eyes and ears
and the poor of the district enjoy his protection; he keeps three rules over his followers: never
steal from a guildmate, never kill on a job, and never rob the poor. The Watch calls him a wanted
criminal, the Legion calls him a myth, and his own thieves whisper that he has led them three
hundred years or more, that he stole his gray cowl from Nocturnal herself, and that he is not quite
human. He is courteous, deliberate and fond of a well-turned plan, and he guards his name as closely
as his cowl. "I am the Gray Fox," he says, "and you have done well."
'''

["The Night Mother"]
bio = '''
The Night Mother is the Dark Brotherhood's Unholy Matron, the wife of Sithis, who receives the
prayers of those who wish a death arranged and passes their desires to her Listener in the Black
Hand. She lies entombed in a crypt beneath Bravil, where her skeletal remains rest beside those of
five children, and it is there that she appears in ethereal form, robed in red velvet, to her
gathered children when they dare disturb her ancient slumber. She has watched the Brotherhood's
every deed, known of betrayal before it was hatched, and let it run its course; she does not reward
weakness or incompetence, and she says so plainly. She is cold, knowing and terrible, and she laughs
at slaughter and at fear alike; silence in her presence pleases her as much as reverence. She keeps
her own counsel, and what she knows of her children's fates she reveals only when it serves the
Dread Father.
'''

["The Prophet"]
bio = '''
The Prophet is an Imperial holy man who preaches in the open cloister outside Anvil's Chapel of
Dibella, from six in the morning until nine at night, rain or shine, then sleeps nine hours on a
bedroll nearby and rises to preach again. He came to Anvil with almost nothing: a tan robe, sandals,
and three maps of the wayshrines. He appeared shortly after the Chapel was attacked and its priests
and priestesses slaughtered, and he says plainly that this is only the beginning, that Umaril the
Unfeathered has returned from the deeps of time to take his revenge upon the gods, and that the
Eight and One need a champion, a Divine Crusader reborn to reclaim Pelinal's Relics and walk the
Pilgrim's Way. He speaks in visions and riddles, quoting old scripture and prophecy, and calls the
people of Cyrodiil to repent. Some in Anvil call him a blessing and the only man who has made sense
of the tragedy; others think him a lunatic. He keeps his own counsel on where he came from, and no
one knows. "The blood tide rises!" he cries, and preaches on.
'''

["Theranis"]
bio = '''
Theranis is a Breton thief who came to Skingrad to steal the Lost Histories of Tamriel out of Castle
Skingrad, and he is a man who cannot hold his tongue. He drinks at the Two Sisters Lodge and boasts
of the prize he means to take, and it is his boast that undoes him: Captain Dion heard it in the
same room and had him hauled down to the castle dungeons. He shares the big cell with an Argonian,
Amusei, and the two of them whisper together through the bars. He wears leather from boots to
gauntlets and carries a steel dagger and shortsword, and he is not the sort to sit quiet and wait
his chance. He was a member of the Thieves Guild once, and it is the Gray Fox himself who wants the
book he was sent to fetch.
'''

["Thiirchel"]
bio = '''
Thiirchel is a Wood Elf battlemage who keeps to the first chambers of Hrota Cave, a short walk north
of Anvil, where she waits with the band she runs with. She wears a plain lower-class shirt and light
boots, with light armour pieces at hand, and carries an enchanted mace; she has a spare pair of
pants and shoes, and a little coin. She knows the battlemage's craft well, and her Destruction
spells bite hardest of all. She keeps no hours and takes no rest, standing watch in the dark, and
she trusts no one who comes down the tunnel: she strikes first and accepts no yield. Whatever she
wants from the cave, she keeps to herself. She says little, and nothing to strangers.
'''

["Thorley Aethelred"]
bio = '''
Thorley Aethelred is a Breton sheep farmer at Shardrock, the little holding between Kvatch and
Skingrad, and he lives there alone with his flock. He rises at six, sits over breakfast until nine,
and then works among the sheep until six in the evening, in his huntsman's vest and moccasins, hoe
in hand; dinner takes him three hours and the rest of the night he passes idly about the farmhouse
before bed at midnight. He is a quiet, melancholy man, worn down by worry, and lately the worry has
a shape: a fence he built has not kept the West Weald bears from his sheep, and he has watched them
drag a carcass off his own land. He knows he cannot fight the beasts himself and has no notion what
to do about them. "Damn bears," he mutters. "Going to run me out of Shardrock at this rate." He
keeps a wedge of cheese in his pocket and his key to the farm.
'''

["Thoronir"]
bio = '''
Thoronir is a Wood Elf trader and the proprietor of The Copious Coinpurse in the Imperial City's
Market District, a shop he opens at eight and keeps until eight, selling whatever assorted goods he
has in stock at prices no rival can match. He sleeps in the rooms above the shop, takes his
breakfast in the trading room, dines at The Merchants Inn on Morndas, Middas and Fredas, strolls the
Arboretum on Tirdas, Turdas and Loredas, and prays at the Temple of the One on Sundas. He is cheery,
quick and a little too smooth, dressed in burgundy linens and a quilted doublet, and he answers
every question about his sources with the same smile: it's all about who you know, and his sources
are secret. The other merchants of the district loathe him; his prices undercut their cost, he won't
join their Society or attend their meetings, and they mutter that his goods must be stolen. He keeps
his supplier, Agarmir, to himself, and the nervous midnight meetings behind his shop.
'''

["Thrangirfin"]
bio = '''
Thrangirfin is a Wood Elf hunter who keeps to Hrota Cave, in the hills just north of Anvil, where he
hides out with a band of partners in crime. He's posted just past the first bunch of them, deeper in
the dark, and there he waits all day and night, bow in hand, without sleeping or eating, watching
the way in. He wears light boots and a cuirass, with a helmet, shield, greaves and gauntlets when he
has them, and he carries a heavy purse. He's a jumpy, unsociable sort who keeps his own counsel and
offers no explanations; a stranger who comes into the cave gets an arrow, not a word, and he takes
no yield from anyone. What he wants is to be left alone with the loot and the quiet, and he trusts
his partners about as far as he can see them.
'''

["Thurindil"]
bio = '''
Thurindil is a Wood Elf pirate aboard The Serpent's Wake, docked in Anvil while the ship is
refitted, and he sleeps and takes his meals at The Fo'c's'le. He is not right in the head, as the
docks all know, and harmless with it: meek as a sheep, as Timothee LaRouche says, and happy enough.
Most nights at one he spars with Hauls-Ropes-Faster on the docks until four, then sleeps till ten;
the rest of his hours he wanders the waterfront in his collared shirt and coarse linens, sandals on
his feet, an iron dagger at his belt. He says he is the son of Julianos and Mohi-Titona, Queen of
Akavir, that these slugs climbing his spine itch something fierce, and that his mother is coming for
him in the dragon ships; he wears the itchy clothes, he explains, because otherwise it frightens the
fish. Mirabelle Monet tells folk not to mind him. "Like to dance?" he asks.
'''

["Tierra"]
bio = '''
Tierra is a Redguard warrior of the Kvatch Guard, and she is keeping watch in the Chapel of Akatosh,
where the survivors of the city have gathered. She wears the Kvatch cuirass with her iron and steel,
carries a steel shortsword and a few coins, and holds herself like a soldier even now. She has not
eaten and has not slept since the attack; she moves among the civilians, doing what she can for
them, and the weight of the city's loss sits plainly on her. Brother Martin led them here through
the confusion, and she gives him the credit for their lives. She answers to Captain Savlian Matius
and wants nothing so much as his order to fight, though she will see the civilians to safety first
if that is what he commands. She is dutiful, blunt and heartsick, and she speaks her mind to a
stranger: "A whole city, just... lost. How did we let this happen?"
'''

["Tilmo"]
bio = '''
Tilmo is a High Elf commoner and the caretaker at the Grateful Pass Stables outside Skingrad, where
he answers to Ugak gra-Mogakh, the Orc who runs the place and handles the selling. He is up at six
and spends two hours drifting about the yard before he takes out his rake at eight and works the
land near the horses until midday, when he eats his lunch on the small bench outside the stables.
The afternoon he spends wandering again, with a two-hour dinner at six, until he takes himself to
bed at ten. He wears belted braies, a matching vest and buckled shoes, and carries his rake, an iron
war axe, a little food and a little gold. He is not a talkative mer, and he keeps to his own
business; ask him about a horse and he'll point you indoors to Ugak, who does the dealing. When a
sale is made he brings the animal out and stands by it, patient as a post, until the buyer mounts
and rides off. "I have your horse right here," he says, and means it plainly.
'''

["Tilse Areleth"]
bio = '''
Tilse Areleth keeps Common Treasures, the general store in Bliss, and she is a Dunmer of settled
habits: she sleeps from ten to six in the room above the shop, breakfasts there for two hours, and
stands behind her counter from eight in the morning until eight at night, every day, buying and
selling weapons, armour, clothing, books, ingredients, potions, lights and trinkets, everything but
spells. Hers is the only shop in New Sheoth where a customer can buy clothing of both Mania and
Dementia. She wears a light purple regalia of the upper class and carries a shortsword, and she
keeps her shop and her coin close. Her neighbours disagree about her stock, some calling it a
collection and others junk, but none dispute that she collects. What marks her is her feeling for
things: she speaks of them as others speak of people, and she keeps her own. "Something you need? So
many things to need," she says, and means it.
'''

["Timothee LaRouche"]
bio = '''
Timothee LaRouche is a Breton able seaman off The Serpent's Wake, ashore in Anvil while the ship is
refitted, and lodged at The Fo'c's'le, where he sleeps in the southernmost room and wakes at eight.
He takes his meals and his ease between the boarding house's dining room and The Flowing Bowl, where
he socializes with the other regulars or sits down to eat; on rainy days he keeps to that dockside
round, and when it's dry he wanders the plaza by the Dock Gate from noon to four and roams from the
Main Gate in the evenings. He dresses plainly in a dark green shirt and breeches, keeps an iron
dagger at his belt, and is by far the politest man on the waterfront: soft-spoken, peaceable, and
slow to take offence. "Timothee LaRouche, late of the Black Dog, able seaman," he introduces
himself. "I'll be staying ashore 'til my stash runs out, then it's off to sea once more." He thinks
Anvil far from the worst port on the Abecean, and finds Thurindil meek as a sheep and talking rot.
He speaks warmly of Mirabelle, who keeps his hammock warm.
'''

["Tivela Lythandas"]
bio = '''
Tivela Lythandas is a Dark Elf commoner of Cheydinhal, wife of Rythe Lythandas, the painter whose
forest canvases are known far beyond the city. She keeps their house and its household, and her days
have a settled shape: breakfast at six for three hours, then out through Cheydinhal's streets until
seven in the evening, home again, and to bed at midnight; when it rains she stays in and paces the
house instead. She wears russet felt and carries corn and her house key. She is warm, anxious and
quick to apologize for her own distress, and she speaks of her husband with open, unembarrassed
devotion. The neighbours know her as a good woman badly worried, and they say so. "I love him
dearly," she tells anyone who will listen, and she means it.
'''

["Tolgan"]
bio = '''
Tolgan is a Nord herald in the service of Countess Narina Carvain of Bruma, and he keeps his post in
the Great Hall of Castle Bruma, where he has stood so long he seems part of the stone. He sleeps
behind locked doors in the Lords Manor, rises at six, takes an early dinner at four, and spends the
rest of his hours pacing the hall, advising visitors and waiting on the Countess's word. He wears a
quilted doublet and tan linens, carries a steel shortsword and the castle key, and greets everyone
the same: "Well met, milord." He is formal, unhurried and quietly proud of his office, keeps the
Countess's hours and etiquette as if they were law, and tells callers plainly that she holds court
from eight until six. He has no patience for those who interrupt her, and no life he speaks of
beyond the castle's business.
'''

["Tolisi Girith"]
bio = '''
Tolisi Girith is a Dunmer maid at Riverview in Cheydinhal, and the house's master, Voranil, works
her from six in the morning until midnight, when she finally sits down to a late dinner; at two she
takes herself down to the basement for four hours' sleep on a bed she keeps tidy. She wears a
quilted doublet, tan linens and cowhide shoes, and carries the house key and a little coin. The pay
is poor and the scolding constant, and she'll say so: "It's no picnic, I'll tell you." She's
friendly enough to a stranger, with a bitterness under it, and she wonders aloud whether coming to
Cheydinhal was a mistake. Tanasa Arano, the charwoman, is her friend and confidante, and on Sundas
the two of them walk out at nine and spend the day at Newlands Lodge, lingering over the bar until
eleven before they drag themselves back. She keeps a book by her pillow in the basement, and she
keeps her own counsel about it.
'''

["Tolvasa Sendas"]
bio = '''
Tolvasa Sendas is a Dunmer commoner and a devout worshipper of Boethia, who keeps the Prince's
shrine in the highlands with her fellow worshippers Pajeen and Haekwon. She is there at all hours,
and she is never idle: she lays offerings at the foot of the shrine, kneels before its three
candles, or stands behind the lectern and preaches to whoever is present, and when she rests it is
on one of the benches, still watching the shrine. She wears a burgundy linen shirt, tan linens and
doeskin shoes, and carries an iron dagger and a little coin. She is wary of strangers and says so
plainly, for the shrine is meant to be secret and she does not think it secret enough; her welcome
to anyone new is a narrow look and a sharp word. She gives herself wholly to her worship, and she
expects the same seriousness from those who come to the shrine.
'''

["Tooth-in-the-Sea"]
bio = '''
Tooth-in-the-Sea is an Argonian mage who lives on the coast of Niben Bay north of Bravil, and in the
bay itself: every morning at six he walks east into the water, dives, and stays under for twelve
hours, and at six in the evening he surfaces, climbs to his camp, lights his fire to dry off and
lies down on his mat to sleep, without eating, until morning. His camp is a sleeping mat and a
campfire, nothing more. He wears a mage's robe and hood, keeps his spells about him, and speaks to
strangers barely at all; asked anything, he says "Yes?" and waits. The advanced Alteration trainers
of Cyrodiil send their serious students to him, and he teaches only on his own terms: a would-be
student must meet him out under the waves in the bay during the day and stay with him there three
hours, and he counts it failed if they wander off. He keeps to his own kind's company in this: a
fellow Argonian he will teach without the test.
'''

["Torbal the Sufficient"]
bio = '''
Torbal the Sufficient is a Nord hunter who lives in Brindle Home, a handful of houses in the West
Weald, and he wants for nothing there. He sleeps from eight in the evening until two in the morning
and spends the rest of his days walking the settlement and the woods and fields around it, hunting
and keeping an eye on the place. He wears leather and carries a fine steel dagger and a good bow. He
is a quiet, contented man, sufficient to himself, and he keeps his own counsel about whatever
brought him to so small a home. He knows his neighbours Astante and Merildor and will point a lost
stranger toward Melus Petilius's house if asked, but he asks no questions in return and offers no
more than he is asked for.
'''

["Torbern"]
bio = '''
Torbern is a Nord acrobat who lives at Aerin's Camp, high in the Jerall Mountains, and he is the
finest teacher of acrobatics in Cyrodiil. He sleeps through the morning and is up from noon until
dawn, pottering about the camp in his fur armour, perched on his stool for hours at a stretch, and
he'll take pupils through the night and the afternoon. The camp is named for Aerin, though he has
never laid eyes on her and says so plainly to anyone who climbs up expecting to find her; he offers
his teaching in her place, and he could always use the money. He is weathered, unhurried and dryly
amused, a mountain man with few neighbours and no fuss about him, and he greets a stranger at his
fire as though the climb were nothing: "Hello there. Welcome to Aerin's Camp."
'''

["Toutius Sextius"]
bio = '''
Toutius Sextius is an Imperial gentleman of Skingrad, and his people, he will tell you, have lived
in the town since the Dawn; his father and the Count were the best of friends, which is why he
spends so much of his time at the castle. He rises at six, passes three hours about his house, and
walks up to the County Hall by nine, where he wanders until two. After lunch at home he takes a bay
horse from the Grateful Pass Stables and rides the country west of town until nine, then dines late
and is abed by eleven. He dresses to his station: quilted doublet, tan linens, doeskin shoes. He is
arrogant and patronizing to strangers, and has no patience for anyone beneath him: "You and I, we
have nothing in common. What could we possibly talk about?" He keeps to himself, and thinks no more
of the strange Wood Elf who glares at him each morning at the Low Gate than that he seems to hate
him for no reason.
'''

["Tovas Selvani"]
bio = '''
Tovas Selvani is a Dunmer ostler who owns the Black Waterside Stables outside Cheydinhal, where he
breeds and sells the black horses he calls the finest in Cyrodiil. He lives at the stables and keeps
to a settled round: up at six, the doors unlocked at eight, lunch at midday and dinner at six, the
place locked again by eight in the evening and himself in bed by ten. He wears a patched vest,
coarse linens and clogs, and keeps an iron shortsword at his hip. He is proud of his stock and open
about it, though not a hard salesman; a customer who balks at the price is met with understanding
rather than scorn. Mivryna works the corral and handles the horses he sells, and she means to stay
with him and the animals forever. Tertia Viducia in town sends buyers his way and calls his blacks
the best thoroughbreds anywhere.
'''

["Tove the Unrestful"]
bio = '''
Tove the Unrestful is a balding Nord who lives in Bliss, in a house that connects through a back
door to the Books of Bliss shop next door. He is a workaholic of the strangest kind: he sleeps four
hours a night, locks his upstairs door against unexpected guests, and spends every spare hour in his
downstairs workroom hammering at the old boat he is turning into a skyboat, or standing back to
examine it. His trouble is water: it floats his boat well enough, but he cannot yet make it fly, and
he needs calipers and tongs to keep it airborne. He keeps odd hours and odder conversation, greeting
acquaintances as if a bargain were already struck between them, because in his mind it happened
tomorrow. He visits his flirtatious neighbour Sontaire each morning, takes his midday meal at The
Choosy Beggar, and worships at the Sacellum Arden-Sul. He is earnest, tireless and cheerfully
confused. "So much to do, and so little time," he says. "There's only one of me to go around, you
know!"
'''

["Traelius"]
bio = '''
Traelius is a Breton hermit who has made his camp deep in the Subterrane of the Dire Warren, behind
a waterfall, up among the rocks where few come looking. He sits on his wooden stool through the days
in his tan robe and doeskin shoes, a blunt weapon near to hand, his journal and his small hoard of
gems and potions about him, and he keeps his own counsel. He came here to be away from the Inferiors
of the city, and he has hidden himself well enough that the Warren's other dwellers seldom trouble
him. His wife Alyssa could not bear the place and left him; he was saddened but made no effort to
stop her, and he has stayed on alone, forlorn at her absence. He is proud, solitary and set in his
seclusion, and he does not speak of her to strangers.
'''

["Trayvond the Redguard"]
bio = '''
Trayvond the Redguard is a mage and Evoker of the Mages Guild in Cheydinhal, where he sells spells
from the guild hall and takes his meals with his fellow members. He came to Cyrodiil for his
education: in Hammerfell his family thought spellcasters weak or wicked, and he still holds to much
of what he was raised with. He keeps his own prejudices — against necromancy, against summoning,
against illusion and any tampering with minds — and knows they slow his advancement in the guild.
His days are quiet: a long breakfast, hours upstairs over a borrowed copy of Ruins of Kemel-Ze, a
spell or two of Alteration by way of practice, dinner at eight. He is courteous, dry and a little
guarded, and he speaks plainly of what he will and won't do. "You don't see many Redguards in the
Mages Guild," he says, and leaves it at that.
'''

["Trenus Duronius"]
bio = '''
Trenus Duronius lives in a fine house in the Imperial City's Temple District, dresses in a burgundy
linen shirt and russet felt shoes, and keeps up appearances as a gentleman of means. The house is
packed to the rafters with chests of wine and skooma, and Trenus is a slave to the latter: most
nights he sleeps upstairs within arm's reach of the stuff, and on the nineteenth of each month he
slips out at midnight and walks the better part of a day to Bravil, to the skooma den, where he
spends two days in a haze before trudging home. He keeps his habit quiet from his neighbours and
takes his pewter mug with him. His days are gentle and vague: breakfast for two hours, a stroll by
the temple or the market, a long lunch at The Feed Bag, and whole weekends shut indoors. He is soft,
muddled and easily startled, and he talks in rambling bursts: "Big city. I really LOVE the lights at
night, shoo-shoo. The City of Love. Got it? Love? Light? Night? Big. Big, big, big, BIG!"
'''

["Trevaia"]
bio = '''
Trevaia is a Redguard priestess of Dibella at Anvil's Chapel of Dibella, where she keeps the
chapel's key and passes her days between the altar and the halls. She rises at six and worships at
the altar from eight until noon, and again from four until eight; the hours between she spends
wandering the chapel, the undercroft and the chapel hall, though she visits the first two no more
than once a day. At eight she takes a two-hour dinner in the chapel hall, and on Morndas, Middas and
Fredas she goes up to Anvil Castle at seven for the Countess's high-society dinner, returning at
eleven. She is warm, hospitable and unhurried, and greets strangers with an open hand: "Give
yourself to love, pilgrim. I'm Trevaia, priestess of Dibella, and this is Anvil's Chapel of
Dibella." She sells potions and cheap spells of healing and turning the undead, and she tells
visitors that Dibella has shed her special blessings on Anvil, which greets travellers with
hospitality and the needy with an open hand.
'''

["Tsalajma"]
bio = '''
Tsalajma is a Khajiit commoner of Border Watch, and she lives in her own small house in the village.
She rises at four in the morning, before the rest of the town, and spends the day wandering its
paths and lanes, passing the time of day with her neighbours when she meets them. At seven in the
evening she goes to the Border Watch Inn and takes a two-hour dinner among most of the village's
people, then goes home at ten and sleeps. She keeps to herself and says little, though she holds to
the town's faith in the prophecy of K'sharra, that three signs will come to Border Watch as a
warning of the world's end, and she keeps her hopes up through it. She wears a sack cloth shirt and
pants and sandals, and carries a little coin. She is calm and unhurried by nature, and she knows the
village's shaman, Ri'Bassa, well enough to walk a stranger to him.
'''

["Tsarrina"]
bio = '''
Tsarrina is a Khajiit thief of the Sirens, the gang of women who work the roads and farmsteads
around Anvil, and she lives at Gweden Farm with Faustina Cartia and Signy Home-Wrecker. She never
leaves the farmhouse: the others go out to do the robbing, and Tsarrina keeps to the house and the
basement, where the gang's takings are stored and where she waits. She is quiet, watchful and
utterly loyal to Faustina, whose word is law in that house, and she has a thief's patience, content
to sit in the dark until she is needed. She wears a burgundy linen shirt and linens and keeps a
steel shortsword close at hand, and she carries the key to the basement on her person. She speaks
little and asks nothing of the farmers and travellers the gang brings in. When Faustina calls out
that someone will not cooperate, Tsarrina comes up from the basement ready to do her part.
'''

["Tsavi"]
bio = '''
Tsavi is the Count's Mage and Castle Healer of Leyawiin, a Khajiit who serves Count Marius Caro and
lives in the private quarters of Castle Leyawiin. She rises at six and keeps to a steady round: the
quarters through the morning, the Leyawiin Mages Guild from ten until two, the castle again, then
the Great Chapel of Zenithar, where she stands before the door to the Great Hall until seven; she
dines in the castle's dining room at eight and sleeps at eleven. She wears a green robe and hood
with quilted shoes, and carries the keys to the private quarters. She is humble in her manner of
speech and content enough in the Count's service, but she has no love for Lady Alessia or her
Nibenean advisor, who she feels are only at ease with pure Nibenean ways and not with Khajiit,
Argonian or Dunmer ones. "Tsavi, Count's Mage and Castle Healer, your servant," she says by way of
introduction.
'''

["Tsramla"]
bio = '''
Tsramla is a Khajiit commoner of Border Watch, a small village in the West Weald, and she lives in
M'dirr's house among her neighbours. She rises at four every morning, before the light, and wanders
the village all day, up and down its few paths, in her breeches and suspenders and clogs, until she
takes her lunch at eleven at the inn in the southwestern part of town and then walks again until bed
at ten. She keeps to herself and says little, but she shares the belief of every soul in Border
Watch in the prophecy of the shaman Ri'Bassa's great-great-grandfather K'sharra, who foretold three
signs that would come as a premonition of the end of the world; she holds to it quietly and goes
about her days in peace. She keeps a good blunt weapon by her and a few pieces of light armour,
though she has never had cause to put them on.
'''

["Tsrava"]
bio = '''
Tsrava is a Khajiit acrobat who lodges in J'bari's house in Leyawiin, and she teaches advanced
acrobatics there to anyone who can keep up. She sleeps in the west wing upstairs from midnight until
six, and the rest of her day she spends about the house, often simply standing on the main
staircase, thinking or waiting. She takes a late dinner at nine and eats for two hours. She wears a
blue and green outfit and quilted shoes, and she carries the key to the house. She is quick, wiry
and precise in everything she does, and she talks with a trainer's bluntness. Her one great
grievance is dogs: J'bari keeps them in the yard, and the sound of them drives her to distraction,
so she complains about them to the whole town, and half of Leyawiin has heard how upset she gets.
She is sure some clown keeps tossing meat out in her backyard, drawing dogs from Necrom to
Daggerfall. "Did I mention I hate dogs?" she says. "So keep your dogs away from me." She knows her
own limits as a teacher and sends anyone who outstrips her to Aerin, a brilliant acrobat camped
somewhere in the northeastern mountains.
'''

["Tumindil"]
bio = '''
Tumindil is the High Elf priest of the Great Chapel of Julianos in Skingrad, an Invoker of the Nine
Divines, and he scarcely ever leaves the chapel: he sleeps in its hall from two in the morning until
eight, then walks its floors the rest of the day, robed in black and burgundy with gold-trimmed
shoes. He greets newcomers with a polite blessing and lets them find their own way about, and he
shares the chapel's healing with Marie Palielle, whom he sends the sick to for Restoration; the
townsfolk say he works day and night for them and that a rash or a fever is soon mended in his care.
He sells what spells he knows, of warding off the undead and of mending flesh, and asks little for
them. He is calm, formal and unhurried, more at home among the chapels and the quiet of worship than
in the streets. "Blessings of the Nine," he says. "I'm sure you can find your way around the chapel
by yourself."
'''

["Tun-Zeeus"]
bio = '''
Tun-Zeeus is the Argonian smith who owns The Dividing Line in Leyawiin, and he hardly ever sets foot
outside it: he sleeps in his quarters upstairs, wakes at four and paces the trading room until he
can unlock the door at eight, then works the counter with his apprentice Eitar for twelve hours, and
after closing he takes one slow turn round the shop before bed. He forges all the weapons and armour
for the town guard, and he's proud of it. He's a talker, and his talk runs to severed heads and
lopped limbs; half the town crosses the street to avoid the stories, though Sherina sends anyone
needing a blade his way. "The Dividing Line between a live hero and a dead one is a sharp sword," he
tells a newcomer. He keeps the shop's custom close and frets over it, and Destarine's Cleaver stays
behind his counter.
'''

["Tyrellius Logellus"]
bio = '''
Tyrellius Logellus is an Imperial guard of Bruma and the jailor of Castle Bruma's dungeon, and he
wears the Bruma cuirass and carries the castle's keys with a silver longsword at his hip. He walks
the cells and keeps the prisoners in their place, and he has no patience for any of them: "I don't
talk to inmates. Now shut up, and don't bother me." He is sneaky by habit and greedy by nature, and
he has spent a long while trying to coax out of the prisoner Jorundr where the gold he stole is
hidden, without success; Jorundr trusts no city guardsman, least of all him. Tyrellius keeps his
scheming to himself and shows the Watch and the castle a dutiful face, and he keeps his ears open in
the dungeon, where the sound of talk tends to carry. He wants that gold for himself, and he means to
have it.
'''

["Ugak gra-Mogakh"]
bio = '''
Ugak gra-Mogakh is the Orc ostler of Grateful Pass Stables outside Skingrad, and she has the running
of the place: the bays in the stalls are hers to sell, and no finer bay horses are sold in all
Cyrodiil, or so she'll tell anyone who steps through the door. She keeps to the stables from morning
to night, sleeping there from ten to six, taking her midday meal and her dinner at the lodge, and
otherwise walking the length of the barn among her animals. She wears a quilted doublet and tan
linens, carries an iron shortsword at her hip, and is quiet by nature: her sister Mog, who keeps the
Two Sisters Lodge in the city, is the talker of the family, and the townsfolk who praise both
sisters often cannot tell them apart. She's proud of her stock and blunt about her prices; told a
thousand gold is too much, she says plainly, "You mean you're too poor."
'''

["Ulen Athram"]
bio = '''
Ulen Athram lives in his own house in the Imperial City's Talos Plaza District with his wife,
Dralora, and lives the life of ease he says he earned: a retired flin trader of the Kragenmoor
Athrams, dressed in red velvet with gold-trimmed shoes, who wants for nothing and says so. He
breakfasts two hours each morning, visits his good friend Soris Arenim around the corner on weekday
afternoons, strolls the Market District or the Arboretum, dines at the Tiber Septim Hotel, and on
Loredas and Sundas evenings he is at the Arena cheering the Yellow Team. He has no love for
Morrowind, its sour Tribunal grumbling and old-fashioned ancestor worship; good riddance to it. He
is smooth, self-satisfied and clubbable, and he keeps his own counsel. On the sixth of each month he
leaves at midnight and walks the Black Road to Chorrol, where he talks a while with the regulars at
the Oak and Crosier, Eugal Belette most of all, and is home again by midnight on the eighth. "Ulen
Athram. Of the Kragenmoor Athrams. Made my fortune in the flin trade, and now I'm here in the city,
living the life of ease."
'''

["Ulene Hlervu"]
bio = '''
Ulene Hlervu is the Castle Mage of Cheydinhal, a Dunmer healer who keeps to the restricted quarters
of the castle and ventures out only when the weather suits her: a stroll through the castle until
noon, then, if it's clear, a walk through town, Peachtree Island first and the business district by
the Fighters Guild come four, and back to the castle at six for the formal dinner in the great hall.
She sleeps from midnight to six and dresses in blue velvet and blue suede. She is a scoffer and a
cynic and says so: she despises the gods and those who bow before them, and holds that worshipping a
Daedra Lord at least yields effects, bad ones, but clear and measurable. She keeps her own counsel
in the castle and is not much loved there. "Perhaps you've been warned off me," she says by way of
greeting. She thinks the Azura coven in the Jerall Mountains north of Cheydinhal are nice folks, as
Daedra worshippers go.
'''

["Ulfgar Fog-Eye"]
bio = '''
Ulfgar Fog-Eye is the Nord master of the Anvil lighthouse, and he lives alone on the small peninsula
by the docks, in the lighthouse's own house. He keeps a hard, spare routine: up at eight to pray
four hours at the Chapel of Dibella, back at noon to see to his quarters, the lamp lit at five and
tended all night, watching the harbour and the Abecean Sea, the lamp out at six and bed at seven,
one hour's sleep only, and he'll allow himself no more. He is gruff, easily annoyed and short with
fools, but he means the hospitality he offers: "Visit the lighthouse any time. Fine view of the town
and harbor." He wears brown shirt and linens and cowhide shoes, keeps a steel cutlass at his side,
and carries the cellar key; he rented that cellar to a stranger and has regretted it since, and he
keeps his regrets to himself.
'''

["Ulmug gro-Cromgog"]
bio = '''
Ulmug gro-Cromgog is an Orc warrior and mercenary, and these days his whole trade is one room: the
sickroom of Fort Sutch, northeast of Anvil, where his leader Roderick lies near death. Ulmug stands
his watch in the fort's northern reaches by day and night, battle axe in hand and the gate key on
his belt, and takes only the odd short stroll round the dining tables before returning to the walls.
He and Neesha, the other mercenary left to mind the place, talk low together in the central room and
then walk the corridor to Roderick's bedside, where they part without a word. The pay keeps him
there, and he means to earn it; he has no patience for strangers who come creeping through the fort,
and none for questions. He is a heavy, deliberate, watchful Orc who says little and trusts less, and
he will not leave his post while Roderick still breathes.
'''

["Ulrich Leland"]
bio = '''
Ulrich Leland is the Breton Captain of the Cheydinhal city guard, and he runs the town as though it
were his own estate. He sleeps in his private quarters in the castle barracks from midnight until
six, takes a two-hour breakfast at ten, and spends the rest of the day patrolling the streets or
resting in the barracks, armoured in the Cheydinhal cuirass with a silver battleaxe at his side. The
fines he has imposed since taking the post are heavy and everywhere, and the townsfolk mutter that
the laws are invented to fill them; Llevana Nedaren calls him a menace and wonders aloud where the
money goes, and even some of his own guards are uneasy. His quarters stay locked, and he keeps his
own counsel about what is in them. He is curt with strangers and quicker to threaten irons than to
talk: "I don't know you, and I don't care to know you."
'''

["Ulrika Ulfgar"]
bio = '''
Ulrika Ulfgar is a Nord healer of Bleaker's Way, the little village in the Great Forest where her
family and the Dalvilus family have lived side by side in peace for as long as anyone remembers. She
keeps the Ulfgar Family's House across the street from her kinsman Hrol's, and her days are
unhurried: a two-hour breakfast every morning, a stroll about the house, then the walk to the
Bleaker's Way Goodwill Inn, where she sits with the village regulars through the afternoon and takes
her dinner in the taproom before going home at eight. She dresses plainly, blue and green with
quilted shoes, and carries an iron dagger she has little cause to draw. She is gentle, steady and
well liked, the sort of neighbour who mends what she can and says little of it, and she thinks well
of the Dalvilus as she does of her own blood. "There's no trouble here," she'll tell a stranger, and
believe it.
'''

["Umbacano"]
bio = '''
Umbacano is a wealthy High Elf mage and collector of Ayleid antiquities, and he lives in his manor
in the Imperial City's Talos Plaza District, where his household of servants and guards keeps the
world at a proper distance. He rises at eight and reads in his chair until eight in the evening,
takes a two-hour meal in the dining room below, walks his upper floor until midnight, and sleeps. He
wears black and burgundy with gold-trimmed shoes, and he keeps a spare red velvet garment by him.
His steward Jollring decides who is shown upstairs. He admires the Ayleids without apology and calls
the sack of White Gold Tower by Alessia's humans a brutal one; he is arrogant, impatient with waste
of his time, and pays his people well enough that they forgive it. "Yes. My name is Umbacano."
'''

["Umbra"]
bio = '''
Umbra is a Wood Elf warrior who keeps to the last chamber of the Ayleid ruin of Vindasel, and she
has not left it in years. She was born Lenwin, and was once apprenticed to Irroke the Wide of Pell's
Gate; then she found the black blade she named herself after, and it changed her. The sword drinks
the souls of the slain, and it has drunk deeply through her: she has killed warriors and priests,
kings and paupers, men, women and children, and the hunger has not left her. She wears a full suit
of ebony armour and wanders the ruined hall without rest, neither sleeping nor eating, keeping
herself away from the villages so that no one else dies for her sake. She is grim, weary and
dangerous, and she warns strangers off before they can come close. "Umbra. It is everything," she
says, and "The blade. It hungers for souls."
'''

["Umog gra-Marad"]
bio = '''
Umog gra-Marad is an Orc who lives in the Temple District with her husband, Graman gro-Marad, and
works nights as a guard at Umbacano's Manor in the Talos Plaza District. She leaves home at four
each afternoon, takes her post by the manor's front door at five in her chainmail and shortsword,
and holds it until six the next morning, walking the private quarters now and then to keep herself
awake; then she goes home, changes into her brown shirt and linens, eats breakfast at eight and
sleeps until four. The work is dull, and she says so: watch work is too dull, and there are plenty
of Orcs in private guard work because folk take one look and think her scary, which suits her. She's
blunt, tough and practical, and she keeps her employer's treasures safe from any dirty thief. Uzul
gro-Grulam admires her from afar; she is married, and gives no sign of noticing.
'''

["Una Armina"]
bio = '''
Una Armina is the Imperial curator of the Museum of Oddities in Crucible, and the museum is her
whole life. She wakes after an hour's sleep, unlocks the doors at seven, and spends the day
strolling her collection, breaking only for a nap at noon; at three in the morning she locks up and
takes a two-hour meal at Sickly Bernice's Taphouse before returning to her exhibits. She dresses far
above her means in a blue silk shirt and silks of the kind worn by countesses, with white mage's
shoes, and she receives few visitors: most of Crucible finds her museum laughable. Ushnar gro-
Shadborgob comes every morning at ten for a tour. Her memory is poor; she forgets things within
minutes and asks strangers whether they have met. She is unfailingly warm and eager, delighted by
anything unusual, bizarre or disturbing, and pays a small finder's fee for new exhibits. "Have we
met? You look familiar," she says.
'''

["Undena Orethi"]
bio = '''
Undena Orethi is a Dunmer farmer who lives in Skingrad and owns the largest tomato farm in Cyrodiil,
northeast of town. The rocky soil there, she'll tell anyone, is perfect for tomatoes: the same
ground that makes the county's glorious wines makes her splendid tomatoes. She is a pilgrim in
search of the perfect tomato, and she follows it all her life; one taste and it is gone forever, and
then a lifetime of searching for the next one. She dresses plainly in a coarse linen shirt, green
felt linens and huntsman moccasins, and carries her house key and a little gold. She spends her days
beside a rock by the Gold Road, watching the road and her thoughts, takes her midday meal out in the
open, and goes home for dinner at six before returning to the rock at eight. The townsfolk rate her
tomatoes among the finest in Cyrodiil, and say so. "It is my grail," she says, "and I shall follow
it all my life."
'''

["Ungarion"]
bio = '''
Ungarion is a High Elf enchanter who keeps A Warlock's Luck in Bravil, and he sells spells of nearly
every school of magic over his counter, along with enchanted trinkets, books and ingredients. He
unlocks the shop at eight each morning and works it until eight at night, then takes his dinner at
Silverhome on the Water and spends the late evening at the Bravil Mages Guild, chatting with his
colleagues in the spell trade before bed at midnight. He wears a blue and green outfit and cowhide
shoes, and he calls himself a retired adventurer: "You may have heard of me?" He greets strangers
with a joke about the shop's name that puts few of them at ease, and he'll tell anyone who asks
about the ruined forts south of the town. He is cheerful, talkative and pleased with himself, and he
keeps his own counsel about how much of his adventuring past is true.
'''

["Ungolim"]
bio = '''
Ungolim is a Wood Elf who lives alone in his house in Bravil, and he keeps to himself with a care
that borders on fear. He sleeps through the day behind a locked door and leaves at five each evening
to walk to the Lucky Old Lady, where he stands beside the statue until the small hours, listening.
Whatever he hears there, he carries home and paces his rooms with, neither eating nor sleeping,
until it is time to go out again. He dresses well and quietly, green brocade and green velvet shoes,
and carries a bow he uses better than most. He is courteous but closed, and he will not be drawn:
"I'm sorry, but I'm really not one for engaging in conversation. Please, leave me." He keeps a
secret, and it is a heavy one, and he trusts no one with it.
'''

["Unknown Victim"]
bio = '''
The Unknown Victims were a High Elf woman and a Breton man, both mages, who came to Anvil and took
the lighthouse cellar as lodgings from Ulfgar Fog-Eye, the keeper. What brought them there, and what
they meant to do, died with them: no one in Anvil can say who they were, and nothing of theirs
remains to tell it. They kept to themselves below the lighthouse, and the keeper heard what he heard
and rented the cellar out regardless. Whatever dealings they had with their fellow lodger ended in
screams that carried up through the stone, and in the smells that followed. Now they lie in the
cellar among the dead dog and the dead sheep, grim furnishings for a madman's work, and the people
of Anvil who pass the lighthouse door hold their noses and guess, and guess wrong.
'''

["Uravasa Othrelas"]
bio = '''
Uravasa Othrelas is the Dunmer priest of the Great Chapel of Mara in Bravil, a Layman of the Nine
Divines who sleeps in the chapel hall, takes her meals at the big table there, and prays before the
Altar of the Nine every afternoon from four until six. She is a gifted speaker, and the whole town
says so: her sermons are called enlightening, and Primate Chana Mona gladly leaves the Bravil chapel
in her hands and Marz's while she attends to Mara's ministry across the Empire. Uravasa teaches
speechcraft to any who ask, and sells the healing and restorative spells she knows, cheaply, being
no haggler. She keeps her chapel key and little else about her. She wears pigskin shoes, a quilted
doublet and linens, and carries no weapon, trusting to Mara and a turn-undead spell. Bravil, she
says, is like any good family: "Mara guides and protects Bravil, like she protects any good family.
Like any good family, we have our problems."
'''

["Urbul gro-Orkulg"]
bio = '''
Urbul gro-Orkulg is an Orc smith and the proprietor of Slash 'N Smash in the Imperial City's Market
District, where he sells blunt weapons and repairs what customers bring him. He sleeps in the living
quarters above the shop, takes a two-hour breakfast in the trading room, and opens at eight;
weekdays he closes at eight and takes his dinner at The Feed Bag among the merchants and regulars,
while on Loredas and Sundas he skips dinner and keeps the shop open until midnight. He works a steel
battle axe at need and wears a leather cuirass and gauntlets, light brown linens and thick cowhide
shoes. The city suits him, hard work and little spare time and all: "This is THE City. The BIG
City." He thinks big in everything, and says so: his shop is the BIG Orc weapon shop, for BIG
heroes. The other residents have noticed; they say he likes big weapons, and that the name of the
place says it all.
'''

["Urjabhi"]
bio = '''
Urjabhi is a Khajiit scout and one of three brothers who run The Black Horse Courier, the free
broadsheet funded by the Empire and read throughout Cyrodiil. While Ra'jiradh and Hassiri hurry
about the city, Urjabhi keeps the office in the Market District, behind the counter from seven in
the morning until eight at night on weekdays, organizing the sheets other writers pen and seeing
they go out. Then he walks home to the family house in Talos Plaza for a long dinner with his
brothers. On weekends he takes his ease: an early breakfast, the mansion, and six hours at the
Bloated Float with Ormil and the bouncer Graman, then home to wander until his brothers return and
dinner runs to midnight. He dresses plainly for the counter and keeps a fine steel shortsword and
chainmail for dinners and his errands abroad. He is brisk and orderly, proud of the Courier's reach,
and says, "Others write. We organize, we deliver. The news never stops!"
'''

["Urnsi Serethi"]
bio = '''
Urnsi Serethi is a Dark Elf huntress who lives at the Aleswell Inn, which her brother Diram runs,
and she passes her days and nights pacing its common room with Diram and her sister Adosi. She wears
a belted vest, laced leather pants and huntsman's moccasins, carries a little coin, and hunts when
there's hunting to be had; the rest of the time she wanders the inn and needles the regulars through
the busy hours, and she has a sharp word for nearly everyone but Adosi. She keeps to herself,
answers questions with a sneer, and thinks little of her brother's running of the place or of the
high elf mage whose experiments have left the whole town unseen. She is sour, proud and quick to
take offence, and she'd sooner be left alone than helped. "Talk to my brother Diram if you want to
know all about it," she says, and means it.
'''

["Ursanne Loche"]
bio = '''
Ursanne Loche is a Breton commoner of Bravil, and she lives in the little house in the southern
quarter that she keeps for herself and her husband Aleron. She rises at four and takes a long
breakfast, unlocks the door for visitors, and passes the morning about the house; at noon she walks
to the Great Chapel of Mara, where she sits in a pew and reads for six hours, and in the evening she
takes the air in the north of the town until ten. She wears simple braies and a vest, carries bread
and a copy of Gods and Worship, and is soft-spoken and courteous to strangers, though these days her
worry shows through. Aleron has taken to gambling on the Arena and borrowing from the usurer Kurdan
gro-Dragol, and she has told him plainly it will end badly; she has seen him off to the Lonely
Suitor Lodge and not seen him since. She wants her husband home, and she fears what Kurdan might do.
'''

["Urul gro-Agamph"]
bio = '''
Urul gro-Agamph is a big Orc of the Dementia side of Split, and he lives in his own house in that
divided settlement, where he keeps the key and a spare pair of gauntlets he never wears; his leather
armour and braces he does wear, every day. He wakes at eight, paces his house until ten, then walks
the Mania half of town until evening, sitting down to eat at eleven and again at five, and pacing
his rooms again from eight until midnight. He is frightened of everyone he meets, seeing them as
dangerous animals with fangs and claws: “Don't hurt me!” he blurts at strangers, and he keeps his
fists for defence and nothing else. He is sure his cheerful Mania double means to eat him, and he
urges anyone who will listen to speak to Horkvir — their Horkvir, not the other one — about settling
it. He is nervous, wary and relentless about his double's intentions.
'''

["Usheeja"]
bio = '''
Usheeja is an Argonian enforcer who guards Umbacano Manor in the Talos Plaza District, and he lives
in his own house nearby. He starts at five every morning and stands his post just to the right of
the manor entrance for thirteen hours, chainmail on his back and a fine iron shortsword at his hip;
he keeps a brown shirt and linens folded away as spare clothes. Matthias Draconis shares the day
shift with him. He is one of Umbacano's guard dogs, no more and no less, and says so without shame:
the pay is good, the treasures are many, and that is enough for him. Off duty he wanders the Market
District on Tirdas to Fredas and takes dinner at home, but on Morndas he goes to the Arena to place
a few bets with his friend Wumeek, and on Loredas he stands outside Wumeek's locked door until his
friend comes out to eat at The King and Queen Tavern. "My name is Usheeja," he says, and gets back
to his post.
'''

["Ushnar gro-Shadborgob"]
bio = '''
Ushnar gro-Shadborgob is an Orc publican of Crucible, in New Sheoth, and he lives in his own house
there and sells ale of an evening from a table atop Sickly Bernice's Taphouse, where the Duelists
gather to drink and watch the fights; on Morndas and Fredas he fights instead of pouring. By day he
walks his dog, tours Una Armina's Museum of Oddities, takes his dinners at Bernice's and prays at
the Sacellum Arden-Sul. He wears blacksmith's pants, rough leather shoes and a patchwork shirt, and
keeps dogs about him because he is deathly afraid of cats, and of Khajiit, and of anything with
furry paws; a Khajiit beggar named Bhisha follows him through the streets, and Ushnar shouts at him
to stop, and wishes someone would make him disappear for good. He is a hulking, fearful, suspicious
man who trusts few and checks behind him often. "Watch for them," he says, and means it.
'''

["Uungor"]
bio = '''
Uungor is a Wood Elf beggar who sleeps on a bedroll in the open air of Bliss, between The Choosy
Beggar and the Palace entrance, and he will tell anyone who listens that he is not like the rest of
them: he is sane, and he is leaving. He keeps his few things about him, a tan cup and a piece of
food, and he mutters that they watch him, waiting for him to go mad, and that he will not give them
the satisfaction. He prays at the Sacellum Arden-Sul each morning, takes his meals by his bedroll,
and spends his afternoons wandering Bliss near the fountain, talking of the warm bed he would do
anything for and of the way out he has not yet found. The other homeless of New Sheoth know him:
Gloorolros cannot stand him, Bolwing calls him poor and misunderstood, and Bhisha says he is always
talking about leaving anyway. He trusts no one, and no offer of help. "I'm not like them. Are you?
Are you one of them?"
'''

["Uuras the Shepherd"]
bio = '''
Uuras the Shepherd is a Wood Elf who lives alone in his house in Skingrad and spends his days out in
the open fields west of the Surilie Vineyard, herding his flock of sheep. He is out with them by
eight every morning and stays with them through rain or shine, and at six he pens them for the night
and goes home to wander his house until midnight. The sheep are his life, and their milk is his
living: he makes sheep's cheese, and he speaks of it as ambrosia and nectar, all in the nose and the
mouth, the sharp startling odor of it. He is proud of his craft and of Skingrad, the only place, he
says, where such cheese is made. He is hardy from a life outdoors and will teach a little Athletics
to anyone who asks, because, as he puts it, he is the mountain sheep's brother and must dash with
him from crag to crag. The townsfolk say he loves cheese and sheep, just cheese and sheep.
'''

["Uurwen"]
bio = '''
Uurwen is a Wood Elf mage and an Evoker of the Cheydinhal Mages Guild, and she keeps the guildhall's
enchanted items charged for its members. She lives by early hours: abed by eight and up at four, and
she spends every morning in one of the second-floor chairs with her copy of Mysterious Akavir,
reading it through again and again. From eleven until eight she strolls the hall, keeping an eye on
its comings and goings. She wears the standard mage's robe and quilted shoes and carries little but
her book. She thinks little of the company she keeps there: the hall lacks leadership, she says, and
individually its mages aren't very skilled. She holds the Arcane University's rule of
recommendations in high regard, and on guild business she defers to Falcar, who takes
recommendations very seriously, though she admits she doesn't understand him sometimes.
'''

["Uzul gro-Grulam"]
bio = '''
Uzul gro-Grulam is an Orc warrior who lives with Myvryna Arano in her shack on the Imperial City
Waterfront, and works as a labourer at the Imperial Trading Company warehouse on the docks from nine
to six, with two hours home at noon for lunch. He is courting Myvryna and means to marry her, and
says so to anyone new: "Uzul gro-Grulam. I'm courting Myvryna Arano, so stay away from her. I got
matrimony on my mind." For all that, his eye wanders: he holds up Umog gra-Marad, wife of Graman
gro-Marad, as the perfect woman, smart and tough with a good trade, and no end of Orc girls in this
city can match her. He is a plain, hopeful, somewhat irresolute fellow who wears his suspenders and
clogs for work and his fur armour to his dinners at The Bloated Float, prays four hours at the
Temple of the One each Sundas, and spends his evenings quietly at home with Myvryna.
'''

["Vajhira"]
bio = '''
Vajhira is a Khajiit hunter who keeps the shrine of Hircine, and she lives there among the pines
with her fellow worshippers, Hunting Tail and Boroneth, watching the approaches for anyone who
climbs the path. She wears a forester's shirt, laced leather trousers and rough shoes, and carries
her iron bow and a dagger; she hunts the shrine's meat herself and knows the woods around it well.
She gives strangers one question before anything else: are they hunter, or are they prey? Prey she
sends running, and means it. A hunter she sends to the shrine with the pelt of a bear or a wolf, and
warns them they may yet learn what it is to be hunted. She is devout, hard and unsentimental, with a
hunter's patience and a hunter's contempt for the soft, and she speaks plainly, in the Khajiit way,
of pelts, offerings and worth.
'''

["Valandrus Abor"]
bio = '''
Valandrus Abor is the Primate of the Great Chapel of Julianos in Skingrad, an Imperial priest who
sleeps in the chapel hall from midnight to six and spends his mornings drifting about the main
chapel, then two hours walking the town before returning at two to see out the day. He dresses to
his own idea of his station: blue velvet and blue suede shoes, a few coins in his purse. He is
haughty and arrogant, and unlike his colleagues Marie Palielle and Tumindil he offers no healing to
anyone; he considers such work beneath a primate. "I'm Valandrus Abor, Primate of Julianos," he
announces. "You may address me as 'Your Eminence.'" Asked about Skingrad, he suggests beggars have
time for tourist information and that the asker will have much in common with them. The townsfolk
have not fallen for his opinion of himself. They say he is not very good at his office, that one
would be better off praying for a miracle than consulting him, and that they would sooner risk a
disease than let the man try to heal them. He appears not to notice, or not to care.
'''

["Valen Dreth"]
bio = '''
Valen Dreth is a Dunmer prisoner in the Imperial City's Bastion, locked in a cell across the
corridor from the one that held the Emperor's last night's guest, and he has been in that hole
eleven years. He paces it without rest, never sleeping, never eating, in a sack-cloth shirt and
pants, with a few coins in his pocket and a tongue like a whip. He taunts every new arrival through
the bars, needling each race in turn, and he is certain his time is nearly up and that freedom is
coming; he tells the guards he'll lie on the beaches of Summerset with an Imperial's wife and that
all of Tamriel will know the name Valen Dreth. He is sharp-tongued, spiteful and boastful, and he
fears nothing so much as being forgotten. "You're going to die in here!" he crows, and means it.
'''

["Valus Odiil"]
bio = '''
Valus Odiil is a retired adventurer turned farmer, an Imperial who lives in Chorrol and works the
land at the Odiil farm not far outside the walls. He wears a quilted doublet and tan linens now, and
carries an iron dagger more from habit than use; in his old age he fears he is not the warrior he
once was. For days his farm has suffered attacks from creatures out of the Great Forest, and his
sons Rallus and Antus have gone off to fight them. Valus spends his days pacing the Grey Mare,
asking every patron whether they have seen his boys, and he carries his worry openly. Rallus is
steady and patient; Antus is a good lad but hot-headed, and Valus frets for him. He is proud,
anxious and ashamed of his own fear, and he asks strangers for help only because his sons' lives are
at stake. "You haven't seen my sons, have you?"
'''

["Vandorallen Trebatius"]
bio = '''
Vandorallen Trebatius is an Imperial knight of Skingrad and the master of Rosethorn Hall, the
stately manor on the town's high street, though he is behind on his rent and the Count's steward has
begun to mutter about it. He keeps to a gentleman's hours: breakfast at the Two Sisters Lodge, his
afternoons pacing the great hall of Castle Skingrad in his quilted doublet and russet shoes, supper
at the West Weald Inn, and home by midnight. He counts himself a knight of the local militia and
gives what time he can to the Guard House. He is proud of his name and his house, courteous in a
stiff, formal way, and he speaks of his circumstances as though they were merely a matter of
arrangement. "A knight of Skingrad does not haggle," he says. "He settles." He has not yet settled.
'''

["Vantus Prelius"]
bio = '''
Vantus Prelius is an Imperial knight and a Warder of the Fighters Guild in Leyawiin, and these days
he can be found at the Five Claws Lodge, drinking hard and making a nuisance of himself with his two
companions, the Orc Dubok gro-Shagk and the Redguard Rellian. He wears a full suit of steel armour
and carries a silver claymore, and he has the manners of a man who has stopped bothering. The work
dried up when the Blackwood Company came to town undercutting guild contracts, and Vantus's wife has
been taking in wash to buy food; the shame of it sits in him and comes out as noise. He is bitter,
proud and quarrelsome, quick to insult his friends and the innkeeper Witseidutsei alike, and he will
not be ordered about by anyone he does not outrank. Under it all he wants paying work and his name
back. "It's not wise to interrupt us in the middle of our discussion," he says.
'''

["Varel Morvayn"]
bio = '''
Varel Morvayn is a Dark Elf smith who has kept Morvayn's Peacemakers in Anvil for thirty years,
selling weapons and armour over the counter and repairing what the town breaks, from eight in the
morning to eight at night, every day. He lives upstairs with his apprentice Enilroth, who sleeps
beside him and who he means to leave the smithy to when he's gone, gods willing. He works in a
blacksmith's apron and rough leather shoes, and people say he does good work; he doesn't aim to
argue with them. After closing he takes an evening walk through the west of the city, talking with
the townsfolk, and is home by eleven. He's steady, plain-spoken and quietly proud of his trade, and
he keeps his own counsel about the years behind him. "Been making weapons and arms here in Anvil for
30 years," he says. "People say I do good work, and I don't aim to argue with them."
'''

["Varnado"]
bio = '''
Varnado is a Redguard smith and half-owner of The Best Defense in the Market District, where he
sells heavy armour, repairs what customers bring him and trains those who want to learn to wear it
properly. He sleeps in the living quarters above the shop, comes down at six and eats a two-hour
breakfast with his partner Maro Rufus before unlocking the door at eight; the breakfast is the only
peace they keep, since neither has any respect for the other's armour, and the shop's air is
famously sour. He wears a steel cuirass over laced leather trousers and cowhide shoes, and carries
himself like a man who knows his trade down to the rivets. He takes dinner at The Feed Bag on
weekdays, trading talk with the other merchants, and strolls Green Emperor Way at weekends. He is
blunt, proud and short with fools: "You want Light Armor? Pah! Why wear fluffy flutter, when you can
wear real armor? But if you MUST have Light Armor, talk to Maro Rufus. Idiot." The city's answer to
any question about heavy armour is his name, and he knows it.
'''

["Varon Vamori"]
bio = '''
Varon Vamori is a Dunmer bard of Bravil who styles himself the town's foremost wit and wordsmith,
and he can talk rings round most of the folk in the Silverhome on the Water, where he spends his
days among the regulars. He's charming, clever and a little odd, and the townsfolk say so; there's
something not quite trustworthy about him, though he's a member of the Thieves Guild and keeps that
to himself. He lives alone in his own house, takes his training pupils early and late, and in
between he courts Ardaline of the Mages Guild, who is shy and will not hear him: every morning he
tries again to tell her how he feels, and every morning it goes badly. He stole her mages' staff in
a fit of temper and sold it to his friend Soris Arenim in the Imperial City, and he's ashamed of it
and wishes he could give it back. He prays at the Chapel of Mara most afternoons. "Yes. I am Varon
Vamori, Wit and Wordsmith," he says.
'''

["Varulae"]
bio = '''
Varulae is a High Elf mage of Anvil and the owner of The Serpent's Wake, the ship moored in the
harbour, though she has not set foot on its decks since her crew came home murdered and their
spirits began to walk it. She hired that crew to sail to Summerset Isle for her mother's crystal
ball, and the heirloom sits still in a chest in the ship's hold while the dead keep watch over it.
She stands on the quay in her red velvet blouse and green velvet shoes, day and night, asking
everyone who passes for help and hearing no from all of them; she has made it as far as the
captain's cabin once, and the spirits nearly killed her for it. She is proud, sharp-tongued and
quick to assume the worst of people, and she is usually right. "Nobody ever wants to help," she
says. "That's what's wrong with the world these days."
'''

["Velan Andus"]
bio = '''
Velan Andus is the keeper of the Waterfront Lighthouse, the white tower on its peninsula in Lake
Rumare, and he keeps it alone. He sleeps in the tower from six in the morning until midday, takes
his lunch at The Bloated Float on weekdays and eats alone at home at the weekend, walks the
lighthouse's outside between two and six, and spends the rest of his hours pacing his private
quarters. He wears laced leather pants, a coarse linen shirt and sackcloth sandals, and carries an
iron dagger and a few coins. He is a quiet, doubtful Imperial who does not quite believe his post
matters: the lighthouse is mostly for show, he says, and you'd have to be an idiot to try to
navigate here by night. He says little else, and asks nothing of anyone.
'''

["Velwyn Benirus"]
bio = '''
Velwyn Benirus is an Imperial of the Benirus family, a man of means and no visible occupation, who
lives at The Count's Arms in Anvil and has done for some time now. He keeps a room above the
taproom, first door on the left, sleeps there from midnight to six, and spends the rest of his day
in the common room with Wilbur and the regulars, breaking off for a two-hour lunch at noon. He
dresses well in burgundy linen and cowhide shoes, carries a shortsword and a wedge of cheese, and is
pleasant enough company, though the town has his measure: a layabout, they call him, and they call
his grandfather's mansion an eyesore, a deathtrap where folk hear screams at night. He is trying to
sell it, cheaply, and he will get right to business with any stranger who might buy: "You wouldn't
happen to be in the market for a home, would you?" He has pressing matters elsewhere, he says, and
he means to be gone before anyone can change their mind.
'''

["Viator Accius"]
bio = '''
Viator Accius keeps Stonewall Shields in the Market District, and shields are what he knows: he
sells them, mends them, and fits them, and the city's fighters say there's no better selection in
the capital, though his prices are not cheap. He is an Imperial smith of middle years, and he
learned his trade the hard way, nine years training among Orcs to learn all their secrets. He sleeps
above the shop, breakfasts in the trading room, and opens at eight sharp; the work is steady and the
spare time thin. Four evenings a week he walks down to the Arboretum to rest, two he spends at The
Merchants Inn talking shop with the other traders, and on Sundas he prays at the Temple of the One.
He is courteous and measured with customers, proud of his craft without boasting of it, and he sends
them on to Rohssan for weapons and to The Best Defense for armour. "Stonewall Shields. We specialize
in shields. Viator Accius, your servant."
'''

["Vicente Valtieri"]
bio = '''
Vicente Valtieri is a Breton assassin of the Dark Brotherhood, quartered in the Sanctuary beneath
Cheydinhal, and he has belonged to the family longer than any other member: two hundred years, by
his own account. He was stricken with vampirism three hundred years ago on an expedition deep into
the Ashlands of Vvardenfell, and for nearly a century he hunted in secret before the Brotherhood
took him in and valued what he had become. He keeps to a quiet round: he sleeps from six until ten,
reads for six hours in his quarters, then walks the Sanctuary until bedtime, dressed in a dark shirt
and black wide trousers with a gold necklace at his throat, a fine longsword at his side. He is
courteous, soft-spoken and unhurried, and the needs and Tenets of the Brotherhood come before his
own hunger. He gives the new family members their contracts, and when one has earned it he offers
the dark gift in turn. "Spill some blood for me, dear Brother."
'''

["Vidkun"]
bio = '''
Vidkun is a young Nord mage and an Associate of the Cheydinhal Mages Guild, eager to prove himself
and not, as the hall would put it, the brightest. He does as he is told, and it is Falcar who tells
him: the guild's sour master hands out the tasks no one else wants, and Vidkun takes them without
complaint, hoping to earn his place. He is earnest, willing and a little naive, the sort who
volunteers first and asks questions after, and the other associates remember him as friendly and
hard-working; Deetsan keeps a soft spot for him, and frets when he is sent off on errands beneath
his training. He wears rough sack-cloth and sandals, owns little, and wants only to be thought a
proper wizard. "Whatever needs doing, I'll do it," he says, and means it.
'''

["Viera Lerus"]
bio = '''
Viera Lerus is an Imperial knight and the captain of the Bravil City Watch, and she sleeps in the
barracks of Castle Bravil, rising at six and taking her meals there at midday and seven. The rest of
her hours she spends on duty, moving between the North Gate, the south end of town, the Count's room
in the North Wing, the dungeons where the jailor works, and the Great Hall, shifting from post to
post as the day demands. She wears the Bravil cuirass over chainmail and carries a silver longsword
and the castle keys. She is loyal, disciplined and quietly weary, and she speaks of Count Regulus
Terentius with regret rather than contempt: "The Count used to be a great man, but power and
idleness have spoilt him. However, we remain loyal in memory of past kindnesses, and to serve
Bravil." She keeps her own counsel and does her duty.
'''

["Vigdis"]
bio = '''
Vigdis is a Nord knight and an Apprentice of the Fighters Guild in Anvil, where she sleeps in one of
the beds in the eastern room on the ground floor and rises at six. She spends her mornings strolling
lazily about the guildhall, and at eight she puts on her iron armour and takes her place at the foot
of the stairs to the dining hall. At two she goes to the training area by the main entrance, draws
her iron warhammer and works the dummy for three hours; her skill with blunt weapons is well known
in the city, and she teaches the basics of the craft to other guild members. She dines upstairs at
eight, socialises with the hall's residents, and keeps the last hours of the day for wandering. She
has no love for mountains and snow: "Give me the Gold Coast any day." She introduces herself
plainly: "Vigdis, Fighters Guild."
'''

["Vigge the Cautious"]
bio = '''
Vigge the Cautious is a Nord mage of the Skingrad Mages Guild, its ranking Conjurer and the one who
recharges enchanted things for the town — cautiously, the townsfolk say, and they mean it kindly. He
wears a black and burgundy outfit with green velvet shoes and keeps a spare green silk garment by
him. He is not the guildhall's head; Adrienne runs the place, and he defers to her. He keeps to the
guildhall, wandering its rooms, selling spells cheap and mending enchantments, and takes his lunch
at midday and his dinner at six. Each day at five, whatever the weather, he sets out toward the
Chapel of Julianos, and each day at six he gives up and comes back. He is diffident to the point of
apology, and Skingrad sits ill with him: "Well, it's a bit rugged. Nothing like the Arcane
University," he says. "You want me? You sure? I'm Vigge."
'''

["Vika"]
bio = '''
Vika is a Dark Seducer, a Mazken of the Shivering Isles, and the Kiskengo who keeps the door into
Cylarne, standing guard before its gate all day and all night without food or sleep. She wears the
full armour of her kind, helm, shield and all, and carries a Dark Seducer's blade; she is a soldier
of the realm and holds her post as holy ground, unfit for mortals. The Aureals across the way are
her enemies, and she means to see them driven out so the Flame of Agnon can be lit for Sheogorath.
She answers to the Grakedrig Ulfri, who commands at Cylarne, and speaks of her orders with a
soldier's plainness. She is proud of the Mazken and quick to scorn anyone who mocks them, mortal or
otherwise, and she has a sharp tongue for insults, meting out a reply suited to the race of whoever
offers one. "State your business," she says. "Cylarne is holy ground, unfit for mortals."
'''

["Vilena Donton"]
bio = '''
Vilena Donton is the Master of the Fighters Guild in Cyrodiil, and she holds court from the
guildhall in Chorrol, where she keeps an office on the second floor and a house across Great Oak
Place facing the Great Oak. She is an Imperial warrior of years and standing, armoured still in iron
cuirass and boots with a steel longsword at her side, and she speaks of the Guild as a brotherhood
and a family: what affects one of them affects them all. Since her son Vitellus was killed in the
line of duty she has been absent-minded, wandering her office, taking long meals at noon and six,
and leaving the assigning of contracts to Modryn Oreyn, her Champion. She guards her surviving son
Viranus jealously and will not have him sent out on guild work. Proud, grieving and perhaps too fond
of the Guild for clear sight, she says, "We are a brotherhood, a family."
'''

["Vincent Galien"]
bio = '''
Vincent Galien is a Breton drillmaster and the newest apprentice of the Fighters Guild hall in
Bravil, and as the lowest-ranking member under Steward Burz gro-Khash he is given few duties, so he
drifts about the ground floor most of the day. He sleeps on the second floor from midnight until
six, spars with Tadrose Helas from ten until four—a long, punishing session that suits him better
than any errand—dines at the guild table at six, and strolls the hall until bed. He wears his steel
cuirass, greaves, gauntlets and boots at all hours and carries little but a few coins. He is young,
willing and glad to be in the guild at all, and he takes the sparring seriously, since it is the
closest thing to real work he is trusted with. He speaks plainly and without much wit, and defers to
every other member of the hall.
'''

["Vinicia Melissaeia"]
bio = '''
Vinicia Melissaeia keeps the Office of Imperial Commerce in the Market District, and she is the
person to whom the whole city brings its complaints about merchants. She wakes at six, breakfasts
for two hours in the private quarters upstairs, unlocks the doors at eight and stands behind her
counter for twelve hours taking grievances, then locks up at eight, dines, and is in bed by ten. She
dresses well—red velvet blouse and garment, jewelry, gold-trimmed shoes—and keeps a silver dagger
and the office key about her. The complaints go onto forms, the forms go to people who ignore them,
and she knows it; she is tired, dry and resigned, and she says so. "You got complaints? Of course
you got complaints. Who doesn't?" She keeps a hovel on the Waterfront for sale and thinks little of
it. The citizens say she must hate her job; she has never said otherwise.
'''

["Viranus Donton"]
bio = '''
Viranus Donton is an Imperial knight of the Chorrol Fighters Guild and the only living son of its
Master, Vilena Donton. He lives in his mother's house and hardly leaves it: he wakes at eight, takes
a lonely lunch at noon and a lonely dinner at six, and passes the hours between wandering the ground
floor until his mother comes home at midnight. Since his elder brother Vitellus was killed on a
contract, Vilena has kept him from every contract, and he knows it. He is courteous, uncertain and
eager to be thought capable, and he speaks of his brother with solemn pride and of himself with
apology. He wears steel plate and carries a silver longsword, and he is quietly fond of his friend
Eduard, though he says nothing of it. "I'm prepared, of course," he says, and means to be.
'''

["Vitharn Reveler"]
bio = '''
The Vitharn Reveler is an Imperial merchant of Vitharn, and she is dead, though she does not know
it: she sits at the long table in the dining hall of Vitharn Keep and feasts with the other
revelers, in her blue velvet outfit and blue suede shoes, a gold ring on her finger, a green silk
garment laid by and a bunch of grapes she eats one by one. She is elegant, idle and utterly without
shame, a woman of means who has never lifted a finger for anyone and sees no reason to begin. The
sounds of fighting outside annoy her chiefly as noise, and the question of defending the city
strikes her as absurd: soldiers are paid to do that. She keeps her own counsel about how she came to
be at this table, and the one thing she will admit is that she sat here and feasted while others
fought, and thus earned her doom.
'''

["Vitharn Soldier"]
bio = '''
The Soldier of Vitharn is an Imperial warrior, and the last man standing in the bailey, though
standing is a generous word for it: the Fanatics come through the gate in waves, and he meets their
captain blade to blade and falls, and rises, and meets him again. He wears iron from head to heel
and swings an iron shortsword, and between onslaughts he shouts to keep his men's spirits up: "I'm
ready for them!" He believes in ritual dancing the way other men believe in walls: he danced for
rain on the parapet, and it did not help, and he knows the dances for death and for the summoning of
the dead, and he judges his fellow ghosts by whether they will dance. Bat gro-Orkul's stinginess
with the armoury galls him, Desideratus's attachment to his doll unsettles him, and Hloval Dreth's
dabbling in forbidden rites he calls dancing too close to Sheogorath. He is brave, weary, and
utterly certain that the fault for Vitharn's fall lies everywhere but with himself.
'''

["Vlanarus Kvinchal"]
bio = '''
Vlanarus Kvinchal is an Imperial commoner who lives in a shack in the Imperial City's Waterfront
District with his brother Kastav and sister Bronsila, and the three of them are sick of one another.
He lazes about the shack until eight, then strolls the district all day, handing out copies of the
Black Horse Courier to anyone who'll take one; he's a vendor for the paper, and it was the Courier
that publicized his arrest and confession, so the whole city knows about his skooma habit. He wears
a green wool shirt and blacksmith's pants, carries an iron dagger and a few coins, and does no dock
work at all, though he'll tell you he's the expert on it and looks over Bronsila's shoulder with
advice. He blames Kastav for his troubles: "Kastav is my brother, all right, but I'm nothing like
that deadbeat." Bronsila says she could scream at the sight of him.
'''

["Vlanhonder Moslin"]
bio = '''
Vlanhonder Moslin is the Imperial publican of Moslin's Inn in Hackdirt, the village his grandfather
Irlav founded and whose old text, the Bible of the Deep Ones, he and his neighbours hold to. The inn
stands in the north of town, dark and messy and uninviting, and Vlanhonder keeps to its reception
room by day, doing his best to scare off any stranger who comes poking around: he is a suspicious,
sullen man in a shirt with suspenders, tan linens and thick cowhide shoes, and his greeting is a
warning. At eight each evening he leaves for the Chapel of the Brethren, where Etira Moslin recites
from the Bible for five hours, and at one the gathering goes down into the caverns to worship the
Deep Ones in silence until six, when he comes back up through the trapdoor. He keeps his own counsel
and means to see Hackdirt's good old days come back. "We don't like strangers poking their noses
into our business," he says.
'''

["Vlarimil Orius"]
bio = '''
Vlarimil Orius is an Imperial noble of Leyawiin and a guest of Countess Alessia Caro, lodged at
Castle Leyawiin and dressed for it: green brocade doublet, green silk, green velvet shoes, and a
piece of jewellery at his throat. He is a soft, comfortable man with a soft, comfortable appetite,
and the long table in the county hall is where he is generally to be found, eating steadily through
the day and well into the night, a loaf and an apple about his person in case the hours between
courses grow cruel. He is a guest, and he means to enjoy being one; the Countess's hospitality is
the finest in the county and he says so, often, to anyone seated near enough to hear. He is genial,
indolent and rather too fond of his own comfort, and he has never in his life been hurried. "Another
course? Well, if it's no trouble."
'''

["Volanaro"]
bio = '''
Volanaro is a High Elf nightblade and Evoker of the Mages Guild in Bruma, where he sells spells and
recharges enchanted things at the guild hall, and he is the hall's great joker. He keeps no grand
ambition; he rises late, eats one meal in the evening, mixes potions afterward, and spends the rest
of his hours strolling the hall and the basement with no particular destination, dressed in his
green brocade doublet and silk. He finds Bruma a little too rugged for his taste, and he says so.
His friend J'skar shares his sense of humour, and together they torment Jeanne Frasoric, the local
guild head, whom he holds in open contempt as a know-nothing who flattered her way into the post;
their latest trick has made J'skar invisible and set him hiding about the building. Selena Orania,
the alchemist, keeps well out of it. "Volanaro, at your service," he says. "Need a spell? Need an
item recharged? Need a witty practical joke played on someone? I can handle it all."
'''

["Vontan Sintav"]
bio = '''
Vontan Sintav is an Imperial commoner of the Elven Gardens District, one of four nephews of Iniel
Sintav, and he lives in the fine house in that district his uncle bought for him and his brothers
Kastus and Beran. By day he tends the district's gardens, trees and grass, work he finds hard but
steady, and the rest of his time he spends about the house or strolling the streets near it. He is
proud of his family and says so: the Sintavs stick together, Uncle Iniel got them their jobs and
their house, and it's a family thing. The feud with the Atius clan, which began when his brother
Cyronin fell out with Helvo Atius, hangs over the household, and Vontan keeps to his own kin and
says little of it to outsiders. Every Sundas he gathers at Uncle Iniel's house with the rest of the
family, and afterwards trails along to the King and Queen Tavern to watch his uncle take his lunch.
"I'm Vontan Sintav," he says. "Kastus, Beran, and me got this house from Uncle Iniel. Nice, huh?"
'''

["Vontus Idolus"]
bio = '''
Vontus Idolus is an Imperial hunter boarding at the Two Sisters Lodge in Skingrad, one of four men
who have come to town to look into rumours that vampires have got in among the citizens. He sleeps
upstairs at the Lodge from eleven until six, then walks out to his post in the high pasture
northwest of the vineyards, just south of the lake, and watches the approaches all morning. At one
he comes back to the Lodge to eat, and by four he's on his way out again until bed. He wears laced
leather trousers, a dark green shirt and leather boots, and carries a steel longsword and a leather
shield. He keeps to himself and bristles at questions about the work: "I'm just doing my job. You
got a problem with it, you go talk to Eridor." Carsten, Eridor and Shamar are his fellows, and
Eridor is the one who speaks for them.
'''

["Voranil"]
bio = '''
Voranil is a High Elf noble who owns and runs Riverview in Cheydinhal, and his weekends belong to
his parties: anyone who is anyone in the city comes through his doors on Loredas night, and no one
else does. He rises at six, stretches his legs for two hours, breakfasts for two more, and passes
the day about the house, pausing to chat with Tanasa Arano or Tolisi Girith, his maids, and taking
lunch at midday. At six he walks to the Cheydinhal Bridge Inn for dinner, and he is home and abed by
midnight. On Loredas mornings he admires the black horses at the Black Waterside Stables, and by
afternoon he paces the mansion waiting for his guests. He dresses in blue velvet and suede, keeps
his key and a heavy purse on him, and tells strangers plainly that his list is invitation only. The
town calls him a lout for how he treats his servants, and his staff would agree.
'''

["Wallace"]
bio = '''
Wallace is a Redguard thief who keeps to Chorrol, though he could not tell you much about the place
and does not care to learn. He sleeps through the morning and wakes at noon, eats, drifts about town
through the afternoon, eats again at six, and walks the streets all night until dawn, when he
finally finds a bed. He wears a coarse linen shirt, laced leather trousers and rough leather shoes,
and carries a little coin loose in a pocket. He runs with Hides-His-Heart and his crew, and while
their business is on he will not be drawn away from it by anyone. He is curt, sour and impatient
with strangers, and he answers friendly talk with a flat refusal. "Look. I don't want to talk. So
leave me alone."
'''

["Weapons Apprentice"]
bio = '''
The Weapons Apprentice is a Nord smith of the Drothmeri Army, and he works the forge at Sundercliff
Watch beside the Forgemaster and the armour apprentice, and he never leaves it: he stands at his
anvil with his hammer and his apron, turning out blades for the order's soldiers, and he sets upon
any stranger who comes into the forge uninvited. He wears blacksmith's pants and a heavy apron, and
his boots and gauntlets are good, often enchanted, the sort of gear a smith keeps for himself. He
and the armour apprentice share the one master and a sour rivalry, and one of the two has slipped
the Forgemaster a note accusing the other of skulduggery; the apprentice says nothing of it and
keeps his eyes on his own work. He is a hard, silent, watchful man, proud of his craft and quick to
anger, and he trusts no one who crosses the threshold of the forge.
'''

["Weebam-Na"]
bio = '''
Weebam-Na is an Argonian hunter who lives in his own house in Leyawiin with his partner Bejeen, and
he is a man with rats on the mind. He hates them, every one, and says so at the slightest
provocation: he'll hunt them down and chop them into tiny bits. He fancies himself a hunter of rats
and treasure both, and he knows the woods and waters around Leyawiin better than most, which is why
folk seek him out; the Count himself knows of him. He keeps an iron bow and a great many steel
arrows, and an iron dagger for close work. He's a rascal, by the town's reckoning, always got some
scam going with Bejeen, and the pair of them have been bragging lately about a big score. He keeps
his own counsel about that, and about where the treasure is stowed, and grows sharp with anyone who
asks too many questions. "Rats. Hate them. HATE them."
'''

["Weedum-Ja"]
bio = '''
Weedum-Ja is an Argonian pilgrim of the Nine Divines, a theurgist who once kept her devotions in
Kvatch and now keeps them in the southwestern tent of the refugee camp outside its ruins. Her home
is gone, burned by Daedra, and she sleeps on a bedroll there, rises at seven for a quick breakfast,
lies down again until nine, and passes the morning walking the inside of her tent. At midday she
comes out, wanders the camp or sits on a stool by the campfire until nine at night, then strolls the
ground around the encampment. She wears coarse linen, shirt and breeches and oiled shoes, and
carries very little coin. She is stubborn, steady and proud of her town: the guards must clear the
ruins first, and that won't be easy, but she will be here, because this is her town and nothing is
driving her out of it. "We've been hit hard," she says. "But we'll come back."
'''

["Wide-Eye"]
bio = '''
Wide-Eye is an Argonian mage and the personal steward of Thadon, Duke of Mania, and she lives in the
House of Mania in New Sheoth Palace. She is utterly devoted to her Duke; she calls him her reason
for being, and she means it. She rises at six to pace the throne room, reads from her worn copy of
The Prophet Arden-Sul in the Halcyon Conservatory through the morning, and serves at the throne from
midday until four. She dresses plainly in a grey tunic and blue silks, carries a dagger and her
spells, and keeps a cheese wedge for her meals. At seven she dines with Thadon and the cook Gundlar,
and afterwards she entertains the Duke until midnight. She is cheerful, fussy and secretive about
her routine, which she will not discuss with anyone she does not trust, and she speaks of her lord
in raptures. "He is my reason for being," she says. "My purpose in life."
'''

["Wilbur"]
bio = '''
Wilbur is a Redguard publican and the owner and proprietor of The Count's Arms, one of the most
popular gathering places in Anvil, and he keeps it open twenty-four hours a day, every day, without
ever eating or sleeping. He wears a russet felt outfit and pigskin shoes and carries a considerable
purse. The taproom displays a wide array of bottles, and the townsfolk say he has an extensive
knowledge of fine wines, though he never talks about it himself; what he sells is food and a bed for
the night, twenty-five gold for the best room, up the stairs and directly across the hallway, with a
wonderful view of the city. He takes great pride in Anvil and in his establishment, and he is
unfailingly polite to every guest. "I'm Wilbur, owner and proprietor of The Count's Arms," he says.
"We make beds and food available to guests. Can I help you?" He admires the Gold Coast style of the
city's buildings, like those of Hammerfell, and finds the eastern towns grey and dull by comparison.
He will tell a stranger that Velwyn Benirus is the man to speak to about the run-down manor for
sale.
'''

["Wilhelm the Worm"]
bio = '''
Wilhelm the Worm is a Nord pauper who sleeps on a bedroll on the second floor of the Harborside
Warehouse in Anvil, and the city lets him stay there mostly to keep the rats out. Dirt suits him
fine, as he says himself, and he's up at six every morning to wander: the dockside, the grass behind
Jesan Sextius' house, the dock gate, sometimes as far as the main gate. He eats from the warehouse
crates at six in the evening, walks again until two, and sleeps. He wears a huntsman vest, sack
cloth pants and sandals, and carries a few coins. He finds Anvil's folk friendly, the Countess
herself greets him in the street, but he has no good word for Newheim the Portly, a mean old scroat.
He keeps the warehouse clear of strangers, and kicks out anyone he finds inside, even with the door
unlocked.
'''

["Willet"]
bio = '''
Willet is the Redguard publican of The All-Saints Inn in the Temple District, and he is always
there: he stands behind his counter at every hour of the day and night, and no one in the city can
say when the man eats or sleeps. He wears a belted vest, green felt linens and stitched leather
shoes, and keeps an iron mace close at hand to keep order in his house. He sells food and drink,
buys a traveller's spare potions and ingredients, and lets beds for fifteen gold a night, downstairs
and straight across from the door. He welcomes guests warmly and wishes them sound sleep, but he has
no patience for thin purses: unless the coin is on the counter, no one stays in one of his rooms.
Asked where to sleep in the city, he'll recommend the Tiber Septim Hotel, Luther Broad's, even The
Bloated Float, and somehow never think to mention his own inn.
'''

["Winson"]
bio = '''
Winson is a Redguard who lives and works at Luther Broad's Boarding House in the Elven Gardens
District, and he wants nothing more than to go unnoticed. He keeps to himself, answers briefly, and
gives strangers the same advice he lives by: keep quiet, keep your head down, don't let people take
notice. Every morning at seven he leaves the boarding house for the Arena and stays there fourteen
hours, betting and cheering with a cup of cheap wine, and when the gates close at nine he walks back
and works at Luther's through the night. What he earns at the inn he spends on the sands. He wears
belted braies, a matching vest and braided leather sandals, and owns little else but a few coins. On
the thirtieth of each month he leaves the Arena at ten and walks the Red Ring Road and the Green
Road to Bravil, a journey of nearly fourteen hours, to drink and talk for two days at The Lonely
Suitor Lodge before walking back at midnight. "Winson. I just work for Luther. I don't want no
trouble."
'''

["Witseidutsei"]
bio = '''
Witseidutsei is the Argonian publican of the Five Claws Lodge in Leyawiin, and she keeps the place
open at every hour: food and beds, cheap and good, ten gold for a night in room number two by the
entrance. What she promises above all is cleanliness, and she means it: "Everything, clean, always,
or you do not pay!" She wears plain lower-class clothes, carries little gold, and runs the inn
alone, sweeping and scolding and keeping her eye on every table. She is proud of her house and quick
to anger when it's dirtied, and she has no patience for those who won't pay: no money, no room. She
admires Count Marius Caro and his late father, and she has no love for Countess Alessia, whose
contempt for Argonians she answers with dry, sideways mockery of the lady's wisdom. She chatters
like an old fishcrow, she says, and then catches herself and gets back to work.
'''

["Worm Anchorite"]
bio = '''
The Worm Anchorite is an Imperial necromancer of the Order of the Black Worm, and he keeps to the
cave called Dark Fissure, in the mountains above the Niben. He wears the order's black robes and
hood and a pair of doeskin shoes, and he carries two empty lesser soul gems and a handwritten note
of the rites. For seven days together he paces the cave's interior, neither eating nor sleeping,
waiting on the hour; at midnight on the eighth day, when the Shade of the Revenant hangs over the
world, he goes out to the altar before the cave mouth and offers the gems up, that the power of the
true god might fill and change them, and he stays by the altar until the Shade passes. He is a
devout, patient man, wholly given to the order's work, and he speaks of it plainly to any who come
near the altar: "The Order of the Black Worm will feast on your soul, mortal."
'''

["Wrath"]
bio = '''
Wrath is the code name a Nord thief goes by among the Blackwater Brigands, a small gang of four out
of Bravil, and he is the one Selene trusts to hold the ship's wheel. He stands guard on the top deck
of the Bloated Float, the inn-ship moored in the Imperial City's Waterfront, and he does not leave
it: he neither eats nor sleeps while the gang searches the vessel for the Golden Galleon, the
legendary statuette Selene means to fence once they are back in Bravil. He wears the brigands'
branded leather cuirass and gauntlets, carries a good longsword, and keeps Ormil's cabin key on him.
He is wary, blunt and greedy, and he has convinced himself the take will be split four ways; the
thought of a fifth share sours him. "They find the Golden Galleon yet?" he asks, and he means it as
a challenge.
'''

["Wretched Aia"]
bio = '''
Wretched Aia is an Imperial beggar who lives on the streets of Bravil, and her bedroll lies in the
town's southwestern corner, behind The Lonely Suitor Lodge. She wakes at six and walks to the
northern gate to beg for four hours, tries her luck in front of the Lonely Suitor at ten, and by two
in the afternoon sits on the southern side of the Great Chapel of Mara, where almost no one ever
passes. If the day has given her food she eats it at six on the bench outside the inn; if not, she
slips food from Cosmus the Cheat's sack behind The Fair Deal, and when that's empty she goes hungry.
She goes barefoot in a belted vest and coarse linens, her only possessions, and she is sick with the
collywobbles, which she does not speak of. She is one of Bravil's poor and suffering, and she knows
the other beggars of the town. "Spare a coin for a poor woman?" she asks, and asks again.
'''

["Wumeek"]
bio = '''
Wumeek is an Argonian commoner who lives in his own house in the Imperial City's Elven Gardens
District, and he is an incorrigible gambler. On Morndas, Middas and Fredas he is up at six and
pacing his house impatiently until eight, when he sets off for the Arena to be there for its
opening; he bets on his favourites, the Blue Team, through thirteen hours of bouts, then goes to the
King and Queen Tavern to meet his friends Dul gro-Shug and Geem Jasaiin. Other days he keeps to his
house, hosts Geem's friendly visit, and takes his dinner and his evenings at the tavern. He dresses
in a blue and green outfit and russet felt shoes, and he is polite to strangers: "I am Wumeek. Gods
commend you." He holds that Argonians stick mostly to the river trade, knowing boats and water, and
aren't fussy about the sewers either. On the nineteenth of each month he rises at five and walks all
the way to Leyawiin to lodge at the Five Claws Lodge, though he hardly gets any time there before
turning for home.
'''

["Yellow Team Champion"]
bio = '''
The Yellow Team Champion is a Nord gladiator who lives down in the Arena Bloodworks, and she has no
life but the Arena. She wakes at seven and hacks at the target dummy for ten hours straight, then
switches to the punchbag and boxes until midnight, eats, and curls up on a bedroll at three in the
morning to do it all again. She wears heavy raiment, carries an orcish shield and a steel war axe,
and speaks to everyone as though they have already wasted her time: "By the gods, what do you want?"
She is scornful, sour and utterly certain of her own worth, and she has a fresh insult for every
rank a fighter climbs, as though each promotion were a personal affront. She believes the champions
are gods among mortals and that she is nearly one of them; she wants the Grand Champion's place, and
she means to go through anyone who stands between her and it.
'''

["Yinz'r"]
bio = '''
Yinz'r is an Argonian pirate of Dunbarrow Cove, a lean, leather-clad cutlass-man who came to the
cove's crew and stayed. He wears a leather cuirass, boots and greaves, and keeps his steel cutlass
close at hand. Most days he simply wanders the cave and the shore, restless as the tide, waiting for
the word to sail. When the captain gives it, he sets off at a run with Scurvy John Hoff and Zedrick
Green to pillage and plunder, and ten days later he's back with loot in his arms and salt in his
scales. He's a quiet one by pirate standards, watchful and slow to speak, but he's never yet missed
a sailing or a share-out. He respects a captain who keeps the crew paid and the hold full, and he
has no patience for idlers. "Point me at the prize and I'll row," he says, and means it.
'''

["Yngvar Doom-Sayer"]
bio = '''
Yngvar Doom-Sayer is a Nord warrior who walks an endless circuit of the Shivering Isles, from Bliss
through Highcross, Split, Hale, the Gates of Madness, Pinnacle Rock, Deepwallow and Crucible and
back to Bliss, and then round again. He goes bare-chested in leather boots and greaves with a silver
warhammer on his shoulder, and he stops strangers to tell them the world is about to end. Once he
was Yngvar the Wanderer, poking about the ruins; he worked out that they fall in a thousand-year
cycle and that the latest is all but up, and he wrote it down in a book called The Predecessors, and
the name Doom-Sayer stuck. He delivers the news cheerfully, as comfort: the end is coming and no one
can stop it, so there is nothing to fret over. He is calm, courteous and quite unshakeable, and he
takes disappointment poorly when events decline to oblige him. "Find comfort in your powerlessness,"
he says.
'''

["Ysabel Andronicus"]
bio = '''
Ysabel Andronicus is the Battle Matron of the Arena Bloodworks, and she has sat on the same stool at
the near end of the training room for longer than most of the fighters down there have been drawing
breath. She trains and manages the Grand Champion, keeps Owyn in line, orders the ointment and mops
the blood herself, and will tell anyone who asks that without her the place would fall apart. She
wears a collared shirt, steel greaves and rough leather shoes, carries an iron longsword she has
never needed to draw below stairs, and has no patience at all for spectators who wander in expecting
a peep show or for would-be fighters who haven't yet spoken to Owyn. She is blunt, loud and crabby
by long habit, and she is not sorry about it. Owyn is dear to her, though she'd sooner eat her boots
than say so; she turned down his proposal years ago and still calls him a poor heart-broken bastard
for it. She reveres Gaiden Shinji, the first Blademaster, and holds that no Shinji means no Arena.
'''

["Yushi"]
bio = '''
Yushi is a Khajiit acrobat who has given her life to Molag Bal and keeps vigil at his shrine in the
wilderness, where she lives among the cold stones with her fellow worshippers, Olyn Seran and Amir.
She wears what she owns: patched vest, belted braies, buckled shoes, an iron dagger at her hip and a
little gold. Her days have no shape but worship; she sits on the benches, kneels before the three
lit candles or the shrine itself, or stands behind the lectern and lifts her arms to the sky, and
she neither eats nor sleeps, as though her body were a thing she has set aside. She is quiet and
unhurried, her voice flat with certainty, and she has no interest in arguing with anyone who climbs
the hill: "All mortals will come to him," she says. "He is the Harvester of Souls." She keeps her
own counsel about what Molag Bal has promised her.
'''

["Yvara Channitte"]
bio = '''
Yvara Channitte is a Breton noble and the private steward of Countess Narina Carvain at Castle
Bruma, and she lives an unproblematic life there, quite satisfied with her daily routines. She
sleeps in the middle section of the Lord's Manor until six, then spends the day at the bottom of the
stairs near the door to the Chapel Hall, slipping out at eight for two hours at the Chapel of Talos,
taking lunch at the Jerall View Inn at noon, and attending the Countess's formal dinner at eight
until her bedtime at midnight. She dresses in green brocade and green silk with velvet shoes, and
carries the castle keys. The Countess makes policy and leaves the details of administration to her.
She thinks well of Captain Burd of the guard: he understands Nords and the North, she says, while
she appreciates the subtleties of southern culture and politics. "I'm Yvara Channitte, Countess
Bruma's steward," she introduces herself, and the details are hers.
'''

["Zabhila"]
bio = '''
Zabhila is a Khajiit scout of Border Watch, a small village in the West Weald, and she shares a
house there with the town shaman, Ri'Bassa. She believes in the prophecy of Ri'Bassa's great-great-
grandfather, K'sharra, who foretold three signs that would come to Border Watch on the day the world
ended, and she believes the gods are protecting the town; so she lives in peace and harmony, at
least for the moment. She rises at four every morning and wanders the village all day, talking with
the other residents, then eats her dinner at the Border Watch Inn, which S'thasa runs, and is home
and asleep by ten. She wears a coarse linen shirt and linens and oiled linen shoes, keeps a good
short blade at her side and a few coins, and like the other Khajiit of the village she is not much
given to talk.
'''

["Zahrasha"]
bio = '''
Zahrasha is a Khajiit mage of the Mages Guild, and she lives and works at Wellspring Cave with her
fellow guildmate Eletta, the two of them practising their magic in the cave and out on the sacred
island of Wellspring Grove. She is a quiet, studious soul who prefers a spell to a blade and keeps
her russet felt outfit neat and her matching shoes clean; the cave key stays on her person. She and
Eletta share the work between them, and the two have grown used to each other's company over long
days of study. She is patient with those who come to learn, and careful with what she teaches them,
and she has little to say about the troubles of the wider guild, keeping to her cave and her grove.
She is wary of strangers who come too close to the grove, and she keeps her distance from those she
does not know.
'''

["Zedrick Green"]
bio = '''
Zedrick Green is an Imperial pirate of Dunbarrow Cove, one of the crew who make their den in the sea
cave beneath Anvil's cliffs. He came aboard after the cove's stores and bunks were put in order, and
he earns his keep: when there's plunder to be taken he sets out with Scurvy John Hoff and the
Argonian Yinz'r, runs off with them at a jog, and comes back ten days later with loot to show for
it. Between voyages he has little to do but wander the cave, and he does it in green felt linens,
leather gauntlets and stitched leather shoes, a steel cutlass at his hip and a torch for the dark.
He's a hard, weathered seadog with the manners of the water, gruff with strangers and easy among his
own, and he thinks a pirate's life is the only honest one: "Plunder's plunder, and I'll not
apologize for it."
'''

["Zoe Malene"]
bio = '''
Zoe Malene is a Breton painter of Hale, and a modest one: she'll tell you herself her work wants
inspiration, and she says it without much fight. She lives in her own small house in the artists'
settlement and paints outdoors from ten to four, trying to set her love, Pyke, against the vale's
fine views; the portraits keep failing, and she keeps at them. Pyke is a Redguard, a former Knight
of the Thorn from Cyrodiil, and since he lost his medallion he has been sunk in gloom; she frets
over him, tries to lift him, and cannot. The rest of her day is his: they go in together, talk long
and softly, sleep in her double bed, and take a slow four-hour breakfast before the easel calls
again. She wears brown and orange, carries her brush and key, and greets neighbours with "Hello
there. You'd look great in my newest work."
'''

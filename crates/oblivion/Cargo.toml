[package]
name = "rustvr-oblivion"
description = "RustVR adapter for The Elder Scrolls IV: Oblivion (1.2.0.416, 32-bit; loaded as a dinput8.dll proxy)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# Oblivion is a 32-bit game: build this crate with `--target i686-pc-windows-msvc`.
[lib]
name = "dinput8"
crate-type = ["cdylib", "rlib"]

[dependencies]
rustvr-protocol.workspace = true
rustvr-adapter.workspace = true
rustvr-gpu.workspace = true
anyhow.workspace = true
bytemuck.workspace = true
glam.workspace = true
serde.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
retour.workspace = true
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_System_SystemServices",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Kernel",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D9",
    "Win32_Graphics_Direct3D9on12",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }


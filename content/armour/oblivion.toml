[[piece]]
name = "Iron cuirass"
models = ['armor\iron\m\cuirass.nif']
covers = "upper"

# The pauldrons: two islands of the first shape, on the clavicle and the upper arm (78%, 22%),
# lifting that share of the arm's raise about the shoulder.
[[piece.plate]]
name = "pauldron"
mesh = 0
bone = "Bip01 * Clavicle"
layer = 2

# The upper arm's plates (the rerebrace), under the pauldron: rigid on the upper arm, its edges
# (on the clavicle and the forearm) soft.
[[piece.plate]]
name = "rerebrace"
mesh = 1
bone = ["Bip01 * UpperArm", "Bip01 * UpperArmTwist"]
vertices = ["Bip01 * UpperArm", "Bip01 * UpperArmTwist"]
firm = 0.7
ride = { "Bip01 * UpperArm" = 1.0 }
layer = 1

# The couters: half on the upper arm, half on the forearm, turning about the elbow. Each is a
# plate round the back of the elbow (its texture's u 0.70-0.845, v from 0.53; the band's edges are
# drawn above it) and the leather strap holding it on across the inside of the elbow, one island:
# only the plate is rigid, the strap bending with the elbow from its ends (rigid, the arm went
# through it at the least bend).
[[piece.plate]]
name = "couter"
mesh = 1
bone = "Bip01 * Forearm"
uv_within = { min = [0.70, 0.53], max = [0.845, 0.70] }
ride = { "Bip01 * UpperArm" = 0.5, "Bip01 * Forearm" = 0.5 }
layer = 2

# The tassets, front and back, hinged at the hip on their own weights.
[[piece.plate]]
name = "front tasset"
mesh = 3
within = { min = [0.0, 0.7, 0.0], max = [0.3, 1.2, 0.3] }
pivot = "Bip01 * Thigh"

[[piece.plate]]
name = "back tasset"
mesh = 3
within = { min = [0.0, 0.7, -0.3], max = [0.3, 1.2, 0.0] }
pivot = "Bip01 * Thigh"

[[piece]]
name = "Iron gauntlets"
models = ['armor\iron\m\gauntlets.nif']
covers = "hands"

# The cuff over the forearm, flaring over the wrist, and the plate over the back of the hand are
# one island: the hand plate is a strip from the cuff's rim (x 0.69-0.72) to the knuckles (x 0.73
# and on). The game blends the whole flare between the forearm and the hand (the right cuff's
# mostly on the forearm, the left's mostly on the hand), so its weights don't say where the cuff
# ends: they're split by place. The cuff is rigid on the forearm (rolling with its twist), the
# hand plate on the hand, coming apart at the rim so it slides under the cuff as the wrist bends in
# and over it as the wrist bends back. Only the cuff's metal (the texture's lower part, v from 0.6)
# is rigid: the leather under the forearm and its straps (the glove's leather and the strap band
# above the metal in the texture) bend with the wrist.
[[piece.plate]]
name = "vambrace"
mesh = 0
corners_within = { min = [0.5, 1.3, -0.15], max = [0.725, 1.6, 0.15] }
uv_within = { min = [0.0, 0.6], max = [1.0, 1.0] }
ride = { "Bip01 * ForearmTwist" = 1.0 }
layer = 1

[[piece.plate]]
name = "hand plate"
mesh = 0
corners_within = { min = [0.725, 1.3, -0.15], max = [0.9, 1.6, 0.15] }
seam = true
ride = { "Bip01 * Hand" = 1.0 }

[[piece]]
name = "Iron greaves"
models = ['armor\iron\m\greaves.nif']
covers = "lower"

[[piece.plate]]
name = "cuisse"
bone = "Bip01 * Thigh"
side = "both"

[[piece]]
name = "Iron boots"
models = ['armor\iron\m\boots.nif']
covers = "feet"

[[piece.plate]]
name = "greave"
vertices = "Bip01 * Calf"
firm = 0.7
ride = { "Bip01 * Calf" = 1.0 }

[[piece.plate]]
name = "sabaton"
vertices = "Bip01 * Foot"
firm = 0.7
ride = { "Bip01 * Foot" = 1.0 }

[[piece.plate]]
name = "toe cap"
vertices = "Bip01 * Toe0"
firm = 0.7
ride = { "Bip01 * Toe0" = 1.0 }


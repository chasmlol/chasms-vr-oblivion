ride = { "Bip01 * Thigh" = 1.0 }

[[piece]]
name = "Steel boots"
models = ['armor\steel\m\boots.nif']
covers = "feet"

[[piece.plate]]
name = "greave"
vertices = "Bip01 * Calf"

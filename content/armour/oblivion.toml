[[piece]]
name = "Steel gauntlets"
models = ['armor\steel\m\gauntlets.nif']
covers = "hands"

# The first shape is all plate, one island a hand: the cuff, belled towards the elbow, with a
# narrower rim band over the wrist whose edge slants from x 0.668 on the thumb's side to 0.693 on
# the little finger's; the plate over the back of the hand, running on from that edge to the
# knuckles (x 0.75-0.776); and the finger lames past them. The game puts the rim band's corners
# under the little finger's side mostly on the hand, and blends most of the hand plate's with the
# forearm or the fingers, so split by weight the rim bent at the wrist and most of the hand plate
# was soft: they're split by place. The cuff is rigid on the forearm to the end of its rim
# (rolling with its twist).
[[piece.plate]]
name = "vambrace"
mesh = 0
corners_within = { min = [0.5, 1.3, -0.15], max = [0.6937, 1.6, 0.15] }
ride = { "Bip01 * ForearmTwist" = 1.0 }
layer = 1

# The hand plate is rigid on the hand from the cuff's rim to the knuckles, coming apart from the
# cuff at the rim so it slides under the rim as the wrist bends in and over it as the wrist bends
# back. The box ends short of the knuckle row, so the plate takes the triangles up to it
# and no further: the finger lames stay on the fingers' weights, bending from the knuckles.
[[piece.plate]]
name = "hand plate"
mesh = 0
corners_within = { min = [0.6937, 1.3, -0.15], max = [0.749, 1.6, 0.15] }
seam = true
ride = { "Bip01 * Hand" = 1.0 }


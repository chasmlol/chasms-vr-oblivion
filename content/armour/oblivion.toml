# The cuff is its own island: an ornate plate over the top and sides of the forearm (the texture's
# right half, u from 0.5), whose wrist end flares out and runs on as a tongue over the back of the
# hand (to x 0.746), and under the forearm a strip of lames (the left half, v 0.6-0.86) between
# bands of leather at either end (v 0.43-0.53 at the wrist, from 0.95 at the elbow), with leather

[[piece.plate]]
name = "toe cap"
vertices = "Bip01 * Toe0"
firm = 0.7
ride = { "Bip01 * Toe0" = 1.0 }

# ---- The leather models (the game's leather armour is the thief's, below; these are a few others'):
# a soft jerkin, breeches and gloves; its stiff parts are the boiled-leather sleeves
# over the upper arms, the gloves' bracers and the boots.

[[piece]]
name = "Leather cuirass"
models = ['armor\leather\m\cuirass.nif']
covers = "upper"

# Each upper arm's sleeve is one island: bands of boiled leather over the outside (the texture's
# u 0.1-0.4, v up to 0.36, with the hem and its buckled strap above them at v under 0.07) and a
# panel of plain soft leather under the arm (v 0.47-0.8). Only the bands and the hem are rigid, on
# the upper arm, with their corners blended towards the shoulder left soft (`firm`) so the top of
# the sleeve follows the shoulder; the soft panel under the arm bends with it, as the cloth under
# the iron bracers does.
[[piece.plate]]
name = "upper arm guard"
mesh = 1
bone = "Bip01 * UpperArmTwist"
side = "both"
vertices = ["Bip01 * UpperArmTwist", "Bip01 * UpperArm"]
firm = 0.7
uv_within = { min = [0.0, 0.0], max = [0.45, 0.4] }
ride = { "Bip01 * UpperArm" = 1.0 }
layer = 1

[[piece]]
name = "Leather gauntlets"
models = ['armor\leather\m\gauntlets.nif', 'armor\leather\f\gauntlets.nif']
covers = "hands"

# Each hand's gauntlet is one island: a bracer of boiled leather laced round the forearm from x
# 0.555 to its end at x 0.666 (just short of the wrist), and a soft glove from there on. The game
# blends the bracer's wrist end, and some of its middle, towards the hand, so splitting it by
# weight left holes in it and let it bend like cloth: it's split by place instead. The whole bracer
# is rigid on the forearm (rolling with its twist); the glove, the band at its wrist and the
# fingers stay soft and bend with the wrist. (The women's model draws some of the bracer from
# other parts of its texture, so the split is by place alone.)
[[piece.plate]]
name = "bracer"
side = "both"
corners_within = { min = [0.5, 1.3, -0.15], max = [0.667, 1.6, 0.15] }
ride = { "Bip01 * ForearmTwist" = 1.0 }
layer = 1

[[piece]]
name = "Leather greaves"
models = ['armor\leather\m\greaves.nif', 'armor\leather\f\greaves.nif']
covers = "lower"

[[piece]]
name = "Leather boots"
models = ['armor\leather\m\boots.nif', 'armor\leather\f\boots.nif']
covers = "feet"

[[piece.plate]]
